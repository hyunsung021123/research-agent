ct a bijection between trident tableaux with $n+1$ columns and two-wall tableaux with $n$ columns, that is, two-row fillings with two designated columns in which vertical order is not imposed. The bijection matches the three-part decompositions of the two classes and shows that each class has cardinality $n(n+1)C_n/2$, where $C_n$ is the $n$-th Catalan number. In particular, it gives a trident-tableau interpretation of a shifted form of OEIS A002457. As a consequence, we obtain an exact enumeration of tree-child networks with one reticulation node that contain a trident, and show that their proportion among all tree-child networks with one reticulation node tends to $1/8$ as the number of leaves tends to infinity.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-24T01:06:12+00:00", "updated": "2026-09-24T01:06:12+00:00", "abs_url": "http://arxiv.org/abs/2609.28892v1", "pdf_url": "https://arxiv.org/pdf/2609.28892v1", "journal_ref": "", "doi": "", "comment": "14 pages, 5 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 tree-child networks의 조합적 구조와 Young tableaux의 bijection을 다루며, 이산기하학이나 oriented matroid의 실현가능성, convex position 등과 직접적 관련이 없음.", "summary": "Tree-child networks with one reticulation node를 인코딩하기 위해 trident tableaux를 도입하고, 이를 two-wall tableaux와 연결하는 bijection을 구성함. 이 bijection을 통해 두 tableaux 클래스의 cardinality가 $n(n+1)C_n/2$임을 보이고, trident를 포함하는 tree-child networks의 열거 및 점근적 비율 $1/8$을 얻음.", "technique": "Young tableaux 간의 bijection 구성 및 three-part decomposition의 대응을 통한 cardinality 계산.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24684v1", "title": "Clique-dependent strongly sublinear treewidth and strongly sublinear tree-independence number", "authors": ["Andrea Munaro"], "abstract": "We establish a strongly sublinear counterpart of a recent result of Chudnovsky, E S, and Lokshtanov (arXiv 2025) on treewidth and tree-independence number. Namely, we prove that a hereditary graph class has strongly sublinear tree-independence number if and only if, for every fixed clique bound, its graphs of bounded clique number have strongly sublinear treewidth. In fact, this is part of a broader equivalence theorem. For hereditary classes, these conditions are also equivalent to having clique-dependent polynomial expansion, to admitting balanced separators whose size is bounded by $Kω(G)^s |V(G)|^{1-β}$ for fixed $K,s,β>0$, and to admitting balanced clique-based separators of strongly sublinear size (equivalently, weight). Thus, we show that all these properties, which arose independently in the study of subexponential-time exact algorithms and polynomial-time approximation schemes, in fact describe the same hereditary graph classes. As a consequence of our equivalence theorem, we also show that every hereditary class $\\mathcal C$ with strongly sublinear tree-independence number admits a subexponential-time algorithm that, given $G\\in\\mathcal C$, computes a tree decomposition of $G$ with strongly sublinear independence number.", "categories": ["math.CO", "cs.DS"], "primary_category": "math.CO", "published": "2026-09-21T14:41:13+00:00", "updated": "2026-09-21T14:41:13+00:00", "abs_url": "http://arxiv.org/abs/2609.24684v1", "pdf_url": "https://arxiv.org/pdf/2609.24684v1", "journal_ref": "", "doi": "", "comment": "29 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프의 트리폭(treewidth)과 트리-독립수(tree-independence number) 연구로, McMullen's problem의 점 배치·oriented matroid·realizability 등과는 직접 관련 없음.", "summary": "유전적 그래프 클래스에서 strongly sublinear tree-independence number를 특성화하는 동치 정리를 증명한다. 이는 bounded clique number를 가진 그래프의 strongly sublinear treewidth, polynomial expansion, balanced separator, clique-based separator의 strongly sublinear 크기 등과 모두 동치임을 보인다.", "technique": "균형잡힌 분리자(balanced separator)와 clique-based separator를 활용한 동치 조건 도출 및 subexponential-time 알고리즘 설계.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23962v1", "title": "The $L_p$ Minkowski problem for $C$-close sets: existence and continuity", "authors": ["Wen Ai", "Deping Ye", "Baocheng Zhu"], "abstract": "Let $C$ be a pointed closed convex cone in $\\mathbb{R}^n$ with nonempty interior, and let $S^{n-1}$ denote the unit sphere in $\\mathbb{R}^n$. The $L_p$ Minkowski problem for $C$-close sets is to determine, for a real number $p$ and a nonzero finite Borel measure $μ$ defined on $Ω_{C^\\circ}=S^{n-1}\\cap \\mathrm{int} C^{\\circ}$, whether there exists a $C$-close set $\\mathds{A}$ such that $μ$ is the $L_p$ surface area measure of $\\mathds{A}$. In this paper, we will solve the problem for $p\\in (0,1)$ and for $μ$ being a nonzero finite Borel measure on $Ω_{C^\\circ}$. Moreover, we establish the continuity of solutions to the $L_p$ Minkowski problem for $p\\in [0, 1]$ in several settings.", "categories": ["math.MG", "math.AP"], "primary_category": "math.MG", "published": "2026-09-21T00:25:31+00:00", "updated": "2026-09-21T00:25:31+00:00", "abs_url": "http://arxiv.org/abs/2609.23962v1", "pdf_url": "https://arxiv.org/pdf/2609.23962v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "볼록기하의 Minkowski 문제이지만, McMullen's problem(점 배치의 acyclic orientation, oriented matroid 실현성)과는 기하학적 맥락이 근본적으로 다름.", "summary": "지적된 convex cone $C$에 대해 $L_p$ Minkowski 문제를 연구하며, $p\\in(0,1)$ 범위에서 주어진 Borel measure를 $L_p$ surface area measure로 갖는 $C$-close set의 존재성을 해결함. $p\\in[0,1]$에서 해의 연속성도 확립.", "technique": "Minkowski 문제의 변분·PDE 기법(존재성 및 연속성 증명), $L_p$ surface area measure의 측도론적 특성화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.28556v1", "title": "Spectral extremal graphs for $W_5$-free graphs with odd size", "authors": ["Jing Gao", "Xianya Geng", "Shuchao Li"], "abstract": "For a fixed integer $k\\ge 2$, let $W_{2k+1}=K_1\\vee C_{2k}$ be an odd wheel graph. The fixed-size spectral extremal problem aims to determine \\[   \\operatorname{spex}(m,W_{2k+1}):=\\max\\{ρ(G): e(G)=m,\\ G \\text{ is } W_{2k+1}\\text{-free}\\}, \\] where $ρ(G)$ denotes the adjacency spectral radius. Based on this problem, Yu, Li, and Peng [12] proposed the following conjecture: When $m-\\binom{k}{2}$ is divisible by $k$ and $m$ is large, every $W_{2k+1}$-free graph of size $m$ satisfies \\(   ρ(G)^2-(k-1)ρ(G)\\le m-\\binom{k}{2} \\) with equality precisely for $K_k\\vee qK_1$. For nonzero residue class, Yu, Zhang, and Zhang [13] proposed the following conjecture: Let $r$ be a nonzero remainder when $m-\\binom{k}{2}$ is divided by $k$ and $m$ is large. Then $S_{k,m}$ is the unique graph among $W_{2k+1}$-free graphs of size $m$ having maximum spectral radius, where $S_{k,m}$ is obtained from $K_k\\vee qK_1$ by adding a vertex $z$ and joining it to exactly $r$ vertices of the $K_k$. Very recently, Fang, Zhai and Zhang [4] confirmed the Yu--Li--Peng conjecture for $k\\ge 2$. Chen, Gao and Li [2] confirmed Yu-Zhang-Zhang conjecture for $k\\ge 3$. When $k=2$, then $W_5=K_1\\vee C_4$. For large odd $m$, determining $\\operatorname{spex}(m,W_5)$ is still open. In this paper we address the odd-size problem. Our result disproved Yu-Zhang-Zhang conjecture for $k= 2$. In our proof, a universal defect bound shows that only $O(1)$ edges can lie outside the dense core. Perron localization then reduces this to at most one edge. A discrete defect inequality forces the complete bipartite crossing and quantizes the two matching deficiencies. Exact quotient-polynomial comparisons eliminate the remaining cross-edge and odd--odd candidates.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-23T08:18:57+00:00", "updated": "2026-09-23T08:18:57+00:00", "abs_url": "http://arxiv.org/abs/2609.28556v1", "pdf_url": "https://arxiv.org/pdf/2609.28556v1", "journal_ref": "", "doi": "", "comment": "26", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "스펙트럼 극값 문제(spectral extremal problem)는 조합론의 별도 부분으로, McMullen's problem의 볼록위치·oriented matroid·realizability와 직접 관련이 없음.", "summary": "본 논문은 홀수 크기 $W_5$-자유 그래프(wheel graph $W_5 = K_1 \\vee C_4$를 포함하지 않는 그래프)에 대한 고정크기 스펙트럼 극값 문제를 다룬다. Yu-Zhang-Zhang 추측을 $k=2$ 경우에 대해 반박하고, universal defect bound, Perron localization, discrete defect inequality 등을 통해 최적 그래프를 완전히 결정한다.", "technique": "Universal defect bound를 이용한 희소 부분 제약, Perron localization을 통한 차수 축소, quotient-polynomial 비교를 통한 후보 제거.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25196v1", "title": "Maximizing the number of cliques in $K_{r+1}$-free graphs with forbidden properties", "authors": ["Aleyah Dawkins", "Rachel Kirsch"], "abstract": "Ferrero and Lesniak in 2018 found the maximum numbers of edges in $r$-partite non-Hamiltonian graphs. Recently we found the maximum numbers of edges and $t$-cliques in $K_{r+1}$-free graphs (1) that are not Hamiltonian or (2) that satisfy a condition on low-degree vertices related to Pósa's theorem. Applying theorem (2), here we extend theorem (1) from Hamiltonicity to other properties. We determine the maximum numbers of edges and $t$-cliques in $K_{r+1}$-free graphs that avoid one of the following properties: traceability, Hamiltonian-connectedness, $k$-path Hamiltonicity, $k$-Hamiltonicity, $k$-Hamiltonian-connectedness, and $k$-connectedness. We find all extremal graphs having the maximum numbers of edges. On the way, we prove upper bounds on the numbers of edges and $t$-cliques in $K_{r+1}$-free graphs that avoid an arbitrary stable property that holds for sufficiently large complete graphs.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T17:45:17+00:00", "updated": "2026-09-21T17:45:17+00:00", "abs_url": "http://arxiv.org/abs/2609.25196v1", "pdf_url": "https://arxiv.org/pdf/2609.25196v1", "journal_ref": "", "doi": "", "comment": "30 pages. arXiv:2310.11452v4 has been split into two papers, with the first on Hamiltonicity and chorded pancyclicity at arXiv:2310.11452v5, and all other properties in this second paper", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 그래프의 클리크 개수와 극값 그래프 이론을 다루지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, 다면체 구조와는 직접 관련이 없습니다.", "summary": "본 논문은 $K_{r+1}$-free 그래프에서 여러 경로/해밀턴 성질을 만족하지 않으면서 최대 개수의 clique를 갖는 그래프를 특성화합니다. 특히 non-Hamiltonian, non-traceable, 비연결성 등 다양한 금지된 성질(forbidden property) 하에서 $t$-clique 개수의 상한을 구하고 극값 그래프를 모두 결정합니다.", "technique": "Turán-type 극값 그래프 이론과 Pósa 정리의 차수 조건을 활용한 상한 증명", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.27172v1", "title": "An exposition of the proof of the Komlós conjecture", "authors": ["Emrullah Akbas", "Suvrit Sra"], "abstract": "We give a short exposition of the recent proof of (Guo, Fang and Lu 2026a) on Komlós, wherein we present a proof based on a simple \"quadratic Dirichlet energy,'' which yields a (looser) discrepancy of $<3π$. We note in an appendix how upon using log-concavity one gets the (tighter) bound $C_0\\approx7.515$ ($< 3\\sqrt{2π}$ of(Guo, Fang and Lu 2026a)). (We also manage to substantially tighten algorithmic Komlós (Guo, Fang and Lu 2026b) , and report it in an appendix.)", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-23T00:10:35+00:00", "updated": "2026-09-23T00:10:35+00:00", "abs_url": "http://arxiv.org/abs/2609.27172v1", "pdf_url": "https://arxiv.org/pdf/2609.27172v1", "journal_ref": "", "doi": "", "comment": "Comments and feedback welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Komlós conjecture는 discrepancy theory 문제로, McMullen's problem(볼록 위치의 점 배치와 oriented matroid 관련)과는 직접적 연관이 없음.", "summary": "본 논문은 Komlós conjecture의 최근 증명(Guo, Fang and Lu 2026a)을 quadratic Dirichlet energy를 기반으로 재구성한 exposé이다. 저자들은 discrepancy bound <3π를 얻으며, log-concavity를 추가로 적용하면 C₀≈7.515의 더 타이트한 bound를 얻음을 보인다.", "technique": "Quadratic Dirichlet energy를 이용한 변분 방법과 log-concavity를 통한 discrepancy 상한 개선.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24653v1", "title": "Symmetric Quantum Latin Squares with Maximal Cardinality", "authors": ["Yiwen Zhang", "Haitao Cao"], "abstract": "In this paper, we prove that there exist a symmetric quantum Latin square with maximal cardinality of order $n$ for all $n\\geq 6$, and a symmetric idempotent quantum Latin square with maximal cardinality of order $4k+2$ for all $k\\geq 1$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T14:23:53+00:00", "updated": "2026-09-21T14:23:53+00:00", "abs_url": "http://arxiv.org/abs/2609.24653v1", "pdf_url": "https://arxiv.org/pdf/2609.24653v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Quantum Latin squares는 조합론적 구조이지만, McMullen's problem의 convex position, oriented matroid, realizability와는 직접적인 관계가 없음.", "summary": "본 논문은 모든 $n\\geq 6$에 대해 최대 cardinality를 갖는 symmetric quantum Latin square가 존재함을 증명하고, 모든 $k\\geq 1$에 대해 order $4k+2$인 symmetric idempotent quantum Latin square의 최대 cardinality 존재성을 보인다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.29957v1", "title": "Theta operators at $t=1$, Macdonald cumulants, and LLT positivity", "authors": ["Jim Haglund", "Vasu Tewari"], "abstract": "We study the Theta operators of D'Adderio-Iraci-Vanden Wyngaerd at $t=1$ and show that the power-sum-indexed operators $Θ_{\\mathsf p_k}|_{t=1}$ agree with a commuting family of derivations when restricted to symmetric functions of positive degree. Writing $\\widetilde{h}_a$ for the modified Macdonald function indexed by the single row $(a)$ we establish that $Θ_{\\mathsf p_μ}\\widetilde{h}_a|_{t=1}$ is, up to a normalization, the single-row Macdonald cumulant of Dolęga. We use these results to show that $Θ_{\\mathsf p_μ}\\widetilde{h}_a|_{t=1}$ and $Θ_{\\mathsf e_λ}\\widetilde{h}_a|_{t=1}$ are both sums of vertical-strip LLT polynomials indexed by certain plane trees. The former further shows that single-row Macdonald cumulants are LLT-positive, thereby yielding a stronger form of the higher-order Macdonald positivity conjecture of Dolęga when all shapes are single rows.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-24T15:14:07+00:00", "updated": "2026-09-24T15:14:07+00:00", "abs_url": "http://arxiv.org/abs/2609.29957v1", "pdf_url": "https://arxiv.org/pdf/2609.29957v1", "journal_ref": "", "doi": "", "comment": "27 pages, 7 figures, comments welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "논문은 Theta 연산자, Macdonald 함수, LLT 다항식 등 대칭함수론의 위치-기반 조합론을 다루나, McMullen's problem의 핵심인 convex position, general position 점 배치, oriented matroid, realizability 등과 직접 관련이 없음.", "summary": "본 논문은 D'Adderio-Iraci-Vanden Wyngaerd의 Theta 연산자를 $t=1$에서 연구하며, 멱급수 인덱싱 연산자들이 대칭함수의 양의 차수에서 교환 도함수족과 일치함을 보인다. 수정된 Macdonald 함수에 대한 Theta 연산자의 작용이 Dolęga의 단일행 Macdonald 누적량과 일치함을 확립하고, 이들이 특정 평면 트리로 인덱싱된 수직-스트립 LLT 다항식의 합임을 증명한다.", "technique": "Theta 연산자의 특화(specialization)를 통한 대칭함수 간의 관계식 도출 및 LLT 다항식 표현으로의 변환.", "connections": "추측: Macdonald 함수론의 양성(positivity) 현상과 조합 다항식(LLT) 표현이 결합하는 점은 oriented matroid의 기하학적 실현성 문제와 잠재적 깊은 연관이 있을 수 있음.", "keyword_hits": [], "source": "explore"}, {"id": "2609.23867v1", "title": "Optimal-diameter partitions into regions of the prescribed measure", "authors": ["Grigory Voinov"], "abstract": "In this paper we find a sufficient condition on an Ahlfors--David regular metric measure space under which it admits a partition into parts of prescribed measures and optimal (up to a constant) diameters. The proof uses the construction of dyadic cubes. The process is algorithmic: the pieces are cut out one by one via a filling procedure on the tree of dyadic cubes. We introduce the notion of spaces which admit a connected dyadic cube decomposition and prove that they admit a partition of the kind described above. We then develop several techniques to obtain such spaces and show some natural examples of this type.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-20T20:58:04+00:00", "updated": "2026-09-20T20:58:04+00:00", "abs_url": "http://arxiv.org/abs/2609.23867v1", "pdf_url": "https://arxiv.org/pdf/2609.23867v1", "journal_ref": "", "doi": "", "comment": "23 pages, 4 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Metric measure space의 분할 문제로, McMullen's problem의 점 배치·convex position과 직접 관련이 없음.", "summary": "Ahlfors-David regular metric measure space에서 처방된 측도를 가진 부분들로의 분할이 최적 직경을 가지도록 하는 충분조건을 제시한다. 동적 큐브 트리상의 filling procedure를 통해 알고리즘적으로 조각들을 순차적으로 추출하며, connected dyadic cube decomposition을 가진 공간의 특성화를 다룬다.", "technique": "Dyadic cube construction 및 tree 기반 filling procedure를 이용한 순차적 분할 알고리즘.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.30058v1", "title": "Facets of the X-ray polytope of doubly stochastic matrices", "authors": ["Prashant Chaudhary", "Kapil Khandelwal"], "abstract": "We study the polytope of anti-diagonal X-rays of k x k doubly stochastic matrices, the image of the Birkhoff polytope under the map that sums the entries along each anti-diagonal. Its facets other than the coordinate facets are the minimal joint tail bounds for lattice laws of a sum of two dependent uniform random variables. We give an exact facet criterion in terms of the allowed edges of a tight graph. For rays of the underlying tropical fan, total support of the tight graph suffices for a facet but is not necessary, as an example with k=19 shows. Up to affine functions and positive scaling, the potentials that define a facet form a polytope whose vertices are its rays. Facets propagate by padding and by grid refinement under explicit hypotheses. We give infinite families of facets from no step potential, facets of quadratic height, superpolynomially many facets, and a classification of three-step potentials. Total support of a step potential is characterized by a Hall-type condition on block starts; with computer assistance, total support decides facets of step potentials for k<=26. The facet counts up to k=12 are found directly for k<=3 and, for k>=4, come from an enumeration by a provably complete algorithm; an independent exact recomputation reproduces its ray lists for 5<=k<=12.", "categories": ["math.CO", "math.MG", "math.OC"], "primary_category": "math.CO", "published": "2026-10-21T17:18:07+00:00", "updated": "2026-10-21T17:18:07+00:00", "abs_url": "http://arxiv.org/abs/2610.30058v1", "pdf_url": "https://arxiv.org/pdf/2610.30058v1", "journal_ref": "", "doi": "", "comment": "36 pages, 4 tables; supplementary material (25 pages) as an ancillary file. Code and data: https://doi.org/10.5281/zenodo.23440726 (https://github.com/methodtrace/2026-doubly-stochastic-xray-facets). Companion paper: arXiv:2610.24197", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 이중확률행렬(Birkhoff polytope)의 X-ray polytope 면(facet) 구조를 연구하며, McMullen 문제·Larman 추측·oriented matroid 등 연구 문제와 직접적 관련이 없다.", "summary": "이 논문은 $k\\times k$ 이중확률행렬(doubly stochastic matrices)의 반대각선 X-ray polytope, 즉 Birkhoff polytope를 반대각선 합산 사상(anti-diagonal summation map)으로 투영한 다면체의 면(facet) 구조를 연구한다. 주요 결과로 tight graph의 허용 간선(allowed edges)을 이용한 정확한 facet 판별 기준을 제시하고, step potential로부터 무한히 많은 facet 족, 이차 높이(quadratic height)의 facet, 초다항식 개수의 facet 등을 구성한다. $k\\leq 12$에 대한 facet 수를 열거 알고리즘으로 완전히 계산하고 독립적으로 재검증하였다.", "technique": "tight graph의 total support 조건과 Hall형 조건을 이용한 facet 판별, step potential 분류, 컴퓨터 보조 열거 알고리즘.", "connections": "", "keyword_hits": ["tope", "tropical"], "source": "filter"}, {"id": "2610.29131v1", "title": "Small covers and the Four Color Theorem", "authors": ["Suyoung Choi", "Ringi Kim"], "abstract": "We give a combinatorial proof that every simple convex $3$-polytope admits a small cover without using the Four Color Theorem. We also prove that the assertion that every simple plane triangulation admits a mod~$2$ characteristic function with at most five values is equivalent to the Four Color Theorem.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-10-21T03:12:33+00:00", "updated": "2026-10-21T03:12:33+00:00", "abs_url": "http://arxiv.org/abs/2610.29131v1", "pdf_url": "https://arxiv.org/pdf/2610.29131v1", "journal_ref": "", "doi": "", "comment": "11 pages, 8 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Small cover, 사색정리, 3-다면체의 조합론적 구조를 다루며 McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 사색정리(Four Color Theorem)를 사용하지 않고 모든 단순 볼록 3-다면체가 small cover를 가짐을 조합론적으로 증명한다. 또한 모든 단순 평면 삼각분할이 최대 다섯 가지 값을 가지는 mod 2 특성함수(characteristic function)를 가진다는 주장이 사색정리와 동치임을 보인다.", "technique": "단순 볼록 3-다면체와 평면 삼각분할에 대한 조합론적 방법 및 mod 2 특성함수 분석.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2610.21533v1", "title": "On the Solution Sets of the Cone-Volume Map", "authors": ["Tom Baumbach", "Zhang Chen", "Martin Henk"], "abstract": "For a fixed set $U=(u_1,\\ldots,u_m)$ of outer unit normals, we consider the cone-volume map which associates to a vector of support numbers $b\\in\\mathbb R^m_{> 0}$ the cone-volume vector $γ\\in\\mathbb R^m$ of the polytope \\[ P(U,b)=\\{x\\in\\mathbb{R}^n:U^\\top x\\leq b\\}. \\] We study its fibers $S(U,γ)$ over prescribed cone-volume vectors $γ$, with particular emphasis on finiteness and non-uniqueness. We give characterizations of the irreducibility of $U$ in terms of properties of the cone-volume map and its solution sets. In particular, for irreducible $U$, we show that $S(U,γ)$ is finite for all $γ$ outside a set of measure zero in the cone-volume cone, and we give an explicit upper bound for its cardinality. In the planar case, we prove that $S(U,γ)$ has semialgebraic dimension at most one for arbitrary $U$. Moreover, for every $U\\in\\mathcal{U}(2,m)$ with $m\\geq 4$, there exists a cone-volume vector $γ$ for which $S(U,γ)$ contains at least two distinct elements. As a consequence, there exist two distinct smooth planar convex bodies with the same cone-volume measure. Finally, for $U$ in general position, we show that the number of solutions is odd for every cone-volume vector outside the exceptional set.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-15T09:01:21+00:00", "updated": "2026-10-15T09:01:21+00:00", "abs_url": "http://arxiv.org/abs/2610.21533v1", "pdf_url": "https://arxiv.org/pdf/2610.21533v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록다면체의 cone-volume map 해집합에 관한 것으로, McMullen 문제(d=5, oriented matroid, convex position 등)와 직접적 관련이 없다.", "summary": "고정된 외법선 집합 $U=(u_1,\\ldots,u_m)$에 대해 지지수 벡터 $b$를 cone-volume 벡터 $\\gamma$로 대응시키는 cone-volume map의 fiber $S(U,\\gamma)$를 연구한다. 기약(irreducible) $U$에 대해 $S(U,\\gamma)$가 측도 0인 집합 외부에서 유한함을 보이고 개수의 상계를 제시하며, 평면($n=2$) 경우 $S(U,\\gamma)$의 반대수적(semialgebraic) 차원이 최대 1임을 증명한다. 또한 일반 위치의 $U$에 대해 예외 집합 밖에서 해의 수가 홀수임을 보이고, $m\\geq 4$이면 서로 다른 두 매끄러운 평면 볼록체가 같은 cone-volume measure를 가질 수 있음을 증명한다.", "technique": "cone-volume cone의 구조 분석, 반대수기하학(semialgebraic geometry), 기약성(irreducibility) 특성화를 통한 fiber의 유한성 및 홀수성 증명.", "connections": "", "keyword_hits": ["general position", "tope"], "source": "filter"}, {"id": "2610.29889v1", "title": "Nashtopes and their A-discriminants", "authors": ["Elke Neuhaus", "Irem Portakal", "Luca Sodomaco", "Katherine Tung"], "abstract": "An $n$-player game in normal form is said to be of format $\\boldsymbol{d} = (d_1, \\dots, d_n)$ if the $i$-th player has $d_i$ options for $1 \\le i \\le n$, and is said to be balanced if $d_n - 1 \\le \\sum_{i=1}^{n-1}(d_i - 1)$. The Nash equilibria of the game correspond to solutions of the system of indifference equations for the game, with payoff differences as coefficients and strategy probabilities as variables. As such, the mixed discriminant of this system gives some information about which games could have an unusual number of totally mixed Nash equilibria. This mixed discriminant can be regarded as an $\\mathcal{A}$-discriminant for some matrix $\\mathcal{A}$ in the sense of [Gelfand--Kapranov--Zelevinsky 1994], and the convex hull of the columns of $\\mathcal{A}$ is a polytope, which we call the Nashtope.   We study this $\\mathcal{A}$-discriminant for each balanced game format with at least three players. This discriminant is a subset of the Nash discriminant variety introduced in [Abo--Portakal--Sodomaco 2026]. We compute the codimension and degree of this discriminant for all balanced game formats, including on-boundary formats, using the Euler obstruction formula in [Matsui--Takeuchi 2011]. Our $\\mathcal{A}$-discriminant locus corresponds to a special multigraded Hurwitz locus studied in [Pratt--Sodomaco--Sturmfels 2026]. As a consequence of [Pokidkin 2026], we obtain the codimensions and degrees of the irreducible components of the Nash discriminant variety for each balanced game format with at least three players, fully resolving Problem 3.8 of [Abo--Portakal--Sodomaco 2026].", "categories": ["math.CO", "cs.GT", "math.AG"], "primary_category": "math.CO", "published": "2026-10-21T15:31:51+00:00", "updated": "2026-10-21T15:31:51+00:00", "abs_url": "http://arxiv.org/abs/2610.29889v1", "pdf_url": "https://arxiv.org/pdf/2610.29889v1", "journal_ref": "", "doi": "", "comment": "36 pages, 4 tables. Supplementary software documentation is available at https://doi.org/10.5281/zenodo.23190651", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Nash 균형과 $\\mathcal{A}$-판별식(discriminant)을 다루는 대수기하·게임이론 연구로, McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 $n$인 정규형 게임의 Nash 균형 시스템에서 도출되는 혼합 판별식(mixed discriminant)을 GKZ 이론의 $\\mathcal{A}$-판별식으로 해석하고, 해당 행렬 $\\mathcal{A}$의 열벡터 볼록껍질인 'Nashtope'를 도입한다. 균형 게임 포맷(balanced game format, $d_n - 1 \\le \\sum_{i=1}^{n-1}(d_i-1)$)에 대해 Matsui–Takeuchi의 오일러 장애 공식을 이용하여 이 $\\mathcal{A}$-판별식의 여차원(codimension)과 차수(degree)를 완전히 계산한다. 결과적으로 Abo–Portakal–Sodomaco(2026)의 Problem 3.8, 즉 균형 포맷을 가진 3인 이상 게임에서 Nash 판별 다양체의 기약 성분들의 여차원과 차수를 완전히 해결한다.", "technique": "Matsui–Takeuchi의 오일러 장애 공식(Euler obstruction formula)을 이용한 $\\mathcal{A}$-판별식의 여차원·차수 계산 및 다중등급 Hurwitz 궤적(multigraded Hurwitz locus)과의 대응.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.28541v1", "title": "Extremal secant size distributions in projective planes", "authors": ["Zoltán Lóránt Nagy", "Zsuzsa Weiner"], "abstract": "Given a point set $S$ in a projective plane of order $q$, each line $\\ell$ determines a secant of size $|S\\cap \\ell|$. We study how concentrated this secant-size distribution can be. We develop a general framework for estimating and, in several cases, determining the extremal number. We point out how the extremal constructions vary depending on the remainder of the size of the set modulo $q$, and classify several extremal families of point sets, building from concurrent lines, Baer {subplanes} and lines in general position. On the lower bound side, we rely on stability results in the Desarguesian case and applications of the standard equalities in general. Finally, we connect the problem to a novel concept, called general position on level 2 for point and line sets, which then leads to a Sidon-type problem over finite fields called projective Sidon sets, providing an additional arithmetic model for highly concentrated secant-size distributions.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-20T17:11:18+00:00", "updated": "2026-10-20T17:11:18+00:00", "abs_url": "http://arxiv.org/abs/2610.28541v1", "pdf_url": "https://arxiv.org/pdf/2610.28541v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 사영평면에서의 secant-size 분포에 관한 조합론 문제를 다루며, McMullen 문제(볼록 위치, oriented matroid, 점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 차수 $q$의 사영평면에서 점 집합 $S$의 secant-size 분포가 얼마나 집중될 수 있는지를 연구한다. 집합의 크기와 $q$의 나머지에 따라 극값 구성이 달라짐을 보이고, 동시 직선(concurrent lines), Baer 부분평면, 일반 위치 직선 등으로 이루어진 극값 패밀리를 분류한다. 또한 'level 2 일반 위치' 및 유한체 위의 projective Sidon 집합이라는 새로운 개념을 도입하여 고도로 집중된 secant-size 분포에 대한 산술적 모델을 제공한다.", "technique": "Desargues 평면에서의 안정성 결과(stability results)와 표준 등식(standard equalities)을 활용한 하한 추정, 그리고 Baer 부분평면 및 동시 직선 구성을 이용한 상한 극값 구성.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2610.28084v1", "title": "Solid-angle formulas for simplicial cones and random shifted sections of polytopes", "authors": ["Philipp Schange"], "abstract": "We consider simplicial cones $C = \\operatorname{pos}(v_1, \\ldots, v_n) \\subseteq \\mathbb{R}^n$ whose generators have a Gram matrix of the form $(\\langle v_i, v_j \\rangle)_{i,j=1}^n = \\operatorname{Id}_n+\\sum_{j=1}^p λ_j u_j u_j^T$, where $p\\in \\{0,\\ldots, n\\}$, $λ_1, \\ldots, λ_p > -1$ and $u_1,\\ldots, u_p \\in \\mathbb{R}^n$ are orthogonal unit vectors. We derive an explicit $p$-dimensional integral formula for the solid angle of $C$ involving the analytic continuation of the standard normal distribution function.   As an application, explicit formulas are obtained for the expected face numbers of sections of acute orthocentric simplices and crosspolytopes with uniformly distributed linear subspaces translated by a fixed vector. The translation vector is assumed to lie outside the affine hulls of all proper faces of the polytope. All solid angles entering these formulas are expressed as integrals of dimension at most two. This application includes regular simplices and regular crosspolytopes as special cases.", "categories": ["math.PR", "math.CO", "math.MG"], "primary_category": "math.PR", "published": "2026-10-20T12:03:23+00:00", "updated": "2026-10-20T12:03:23+00:00", "abs_url": "http://arxiv.org/abs/2610.28084v1", "pdf_url": "https://arxiv.org/pdf/2610.28084v1", "journal_ref": "", "doi": "", "comment": "26 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 단순뿔(simplicial cone)의 입체각(solid angle) 공식과 다면체의 무작위 단면의 면 수 기댓값을 다루며, McMullen 문제(볼록 위치·일반 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 생성 벡터의 그람 행렬(Gram matrix)이 $\\operatorname{Id}_n + \\sum_{j=1}^p \\lambda_j u_j u_j^T$ 형태인 단순뿔 $C = \\operatorname{pos}(v_1,\\ldots,v_n)$의 입체각(solid angle)에 대한 명시적 $p$차원 적분 공식을 유도한다. 이를 응용하여, 고정된 벡터만큼 평행이동된 균등 분포 선형 부분공간으로 자른 acute orthocentric simplex 및 crosspolytope의 단면(face)의 기대 개수에 대한 명시적 공식을 얻는다. 정다면체(regular simplex, regular crosspolytope)를 특수 사례로 포함하며, 관련된 모든 입체각을 최대 2차원 적분으로 표현한다.", "technique": "표준 정규분포 함수의 해석적 연속(analytic continuation)을 활용한 $p$차원 명시적 적분 공식 유도.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.26700v1", "title": "Geodesics in the continuous Hecke monoid", "authors": ["Sergei Presniakov", "Alexander Tiskin"], "abstract": "A permuton is a probability measure on the unit square with uniform marginals, the limit shape of a sequence of permutations. The sticky product of permutons is a continuous analogue of the Demazure product in the $0$-Hecke monoid; on copulas, the distribution functions of permutons, it is given by the tropical $(\\min,+)$ product $\\odot$. We show that every absolutely continuous rotation-invariant probability measure $ρ$ on the plane, which we call the profile, generates a one-parameter family of copulas $C^ρ=\\{C^ρ_β\\}_{β\\in[0,π]}$. A copula in this family is defined by a pair of projections of a $ρ$-distributed random vector onto directions at angle $π-β$. Along this family, the sticky product adds angles: $$C^ρ_{β_1}\\odot C^ρ_{β_2}=C^ρ_{\\min(β_1+β_2,π)}.$$ Hence every non-identity element of such a family is a sticky product of two others and has roots of every natural degree. The normalized inversion number of the copula $C^ρ_β$ equals $β/π$. For the Archimedean measure $\\mathfrak{Arch}$ the family $C^{\\mathfrak{Arch}}$ consists of the limit shapes of the permutations of the uniformly random sorting network, found by Angel et al. and Dauvergne. For the Gaussian measure $\\mathcal{N}$ the family $C^{\\mathcal{N}}$ consists of Gaussian copulas and contains $\\mathit{Unif}$, the uniform measure on the square (the limit shape of the uniformly random permutation); its square root within this family is the Gaussian copula with correlation $-1/\\sqrt2$. By the Herschel-Maxwell theorem the Gaussian measure is the only profile whose family contains $\\mathit{Unif}$; nevertheless, $\\mathit{Unif}$ has another, singular, sticky square root. A discrete analogue of the Gaussian family is the geometric sorting network generated by rotating independent Gaussian points: after rotation by $π/2$ its permutation is exactly uniform.", "categories": ["math.PR", "math.CO"], "primary_category": "math.PR", "published": "2026-10-19T16:37:45+00:00", "updated": "2026-10-19T16:37:45+00:00", "abs_url": "http://arxiv.org/abs/2610.26700v1", "pdf_url": "https://arxiv.org/pdf/2610.26700v1", "journal_ref": "", "doi": "", "comment": "19 pages, 5 figures. A Russian version is available from the authors on request", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 permuton, Hecke monoid, tropical 곱 등을 다루며 permutation과 관련되지만, McMullen 문제(d=5에서 f(5)=11, oriented matroid, convex/general position 점 배치)와는 직접적인 관련이 없다.", "summary": "이 논문은 permuton의 sticky product를 연속적 Hecke monoid의 유사물로 분석하며, 회전불변 확률측도(profile) $\\rho$가 copula의 단매개변수족 $C^\\rho_\\beta$를 생성하고 sticky product가 각도를 더하는 구조($C^\\rho_{\\beta_1}\\odot C^\\rho_{\\beta_2}=C^\\rho_{\\min(\\beta_1+\\beta_2,\\pi)}$)를 만족함을 보인다. Archimedean 측도의 경우 균일 랜덤 sorting network의 극한 형상과 일치하고, Gaussian 측도의 경우 Gaussian copula족을 이루며 Herschel-Maxwell 정리에 의해 $\\mathit{Unif}$를 포함하는 유일한 profile임을 밝힌다. 또한 discrete 유사물로서 독립 Gaussian 점의 회전으로 생성되는 기하학적 sorting network를 제시한다.", "technique": "Tropical $( \\min,+)$ 곱($\\odot$)을 copula에 적용하여 sticky product의 각도 가산 구조를 분석하고, Herschel-Maxwell 정리를 활용한다.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2610.25868v1", "title": "Terao's freeness conjecture for arrangements of 15 and 16 lines", "authors": ["Cristian Anghel", "Rareş Stan"], "abstract": "We prove that Terao's freeness conjecture holds for arrangements of 15 and of 16 lines in the complex projective plane. Together with the theorem of Barakat and Kühne for at most 14 hyperplanes, this shows that freeness of a central arrangement of at most 16 planes in $\\mathbb{C}^3$ is determined by its intersection lattice. The proof has a theoretical and a computational part. Combining published combinatorial criteria for freeness (due to Abe, Dimca, Dimca-Kühne-Pokora and Yoshinaga) with Bojanowski's Hirzebruch-type inequality and an elementary counting identity, we show that a counterexample would have exponents $(6,8)$ or $(7,7)$ for 15 lines and $(7,8)$ for 16 lines, and an intersection lattice subject to strong numerical constraints. We then enumerate all 22,544,280 simple rank 3 matroids satisfying these constraints, up to isomorphism, and determine the complex realization space of each of them exactly over $\\mathbb{Q}$. Exactly eleven of them are realizable over $\\mathbb{C}$, and on each of these the freeness of the realizations is constant. As a by-product we classify the free arrangements of 15 and 16 lines that are not divisionally free, have maximal multiplicity smaller than the smaller nontrivial exponent, and have at least four intersection points on every line.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-10-19T06:23:00+00:00", "updated": "2026-10-19T06:23:00+00:00", "abs_url": "http://arxiv.org/abs/2610.25868v1", "pdf_url": "https://arxiv.org/pdf/2610.25868v1", "journal_ref": "", "doi": "", "comment": "16 pages, 2 tables. Ancillary files contain the code, a reproduction script and the results of the computer-assisted part of the proof", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 초평면 배열의 자유성(freeness)에 관한 Terao 추측을 다루며, McMullen 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "이 논문은 복소 사영평면에서 15개 및 16개 직선의 배열에 대해 Terao의 자유성 추측이 성립함을 증명한다. Barakat-Kühne의 최대 14개 초평면 결과와 결합하면, $\\mathbb{C}^3$에서 최대 16개 평면으로 이루어진 중심 배열의 자유성은 교차 격자(intersection lattice)만으로 결정된다. 증명은 이론적 부분(자유성 판별 기준 및 Hirzebruch형 부등식)과 계산적 부분(22,544,280개의 단순 랭크 3 매트로이드 열거 및 $\\mathbb{Q}$ 위에서의 실현 공간 결정)으로 구성된다.", "technique": "조합론적 자유성 판별 기준(Abe, Dimca, Yoshinaga 등)과 Bojanowski의 Hirzebruch형 부등식을 결합하여 반례의 지수(exponents) 범위를 제한하고, 조건을 만족하는 단순 랭크 3 매트로이드를 동형류까지 전수 열거한 뒤 각각의 복소 실현 공간을 $\\mathbb{Q}$ 위에서 정확히 결정한다.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2610.25841v2", "title": "Union of Translates of a Convex Body", "authors": ["Alec Shelley", "Daniel Tartakovsky"], "abstract": "Let $K\\subset\\mathbb{R}^d$ be a strictly convex body and let $Z\\subset\\mathbb{R}^d$ be a finite set of sites in general position. We consider the problem of calculating the volume $μ_d$ of $\\bigcup_{z\\in Z}(z-K)$. Let $V_z$ be the Voronoi cell of $z\\in Z$ with respect to the convex distance function induced by $K$, and let $N$ be the nerve of the Voronoi cells. When $K$ is a ball, a classical result reduces the inclusion-exclusion formula to a sum over $N$: $μ_d(\\bigcup_{z\\in Z}(z-K))=\\sum_{J\\in N}(-1)^{|J|+1}μ_d(\\bigcap_{z\\in J}(z-K))$. When may the hypothesis that $K$ is a ball be dropped? We show that for $d\\leq 2$ the reduced formula holds for every strictly convex $K$, while for each $d\\geq 3$ there is a strictly convex $K$ for which it fails. For $x\\in\\mathbb{R}^d$, let $χ_x$ be the Euler characteristic of the subcomplex of $N$ induced by the sites lying in $K+x$. A sufficient condition for the reduced formula to hold is $χ_x\\equiv 1$ on the union. When $d=3$ and $K$ is $C^4$, we show that $χ_x\\equiv 1$ on the union for all $Z$ in general position if and only if $K$ is an ellipsoid. The proof relies on the Fubini-Pick affine invariant.", "categories": ["cs.CG", "math.MG"], "primary_category": "cs.CG", "published": "2026-10-19T05:53:05+00:00", "updated": "2026-10-20T22:16:01+00:00", "abs_url": "http://arxiv.org/abs/2610.25841v2", "pdf_url": "https://arxiv.org/pdf/2610.25841v2", "journal_ref": "", "doi": "", "comment": "27 pages, 5 figures; v2 updated abstract", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록체의 합집합 부피 계산에 관한 것으로, McMullen 문제(점 배치, oriented matroid, tropical geometry 등)와 직접적인 관련이 없다.", "summary": "엄격 볼록체 $K$의 이동 합집합 $\\bigcup_{z\\in Z}(z-K)$의 부피를 Voronoi 셀의 nerve $N$을 이용한 포함-배제 공식으로 계산하는 문제를 다룬다. $d\\leq 2$에서는 $K$가 임의의 엄격 볼록체일 때도 축약 공식이 성립하지만, $d\\geq 3$에서는 반례가 존재함을 보인다. 특히 $d=3$이고 $K$가 $C^4$ 볼록체일 때, 모든 일반 위치 점 집합에 대해 Euler 특성 $\\chi_x\\equiv 1$이 성립할 필요충분조건이 $K$가 타원체임을 증명한다.", "technique": "Voronoi 셀의 nerve를 이용한 포함-배제 공식 분석, Euler 특성 조건, 그리고 Fubini-Pick 아핀 불변량을 활용한 증명.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2610.25602v1", "title": "On solutions to tropical Monge-Ampère equations", "authors": ["Omid Amini", "Matthieu Piquerez", "Lyuhui Wu"], "abstract": "This paper develops convex analysis on tropical varieties and investigates the properties of the tropical Monge-Ampère equations. We start by introducing notions of plurisubharmonic functions and Kähler forms on arbitrary tropical varieties. We show that many classical results of pluripotential theory extend to this setting, including an analogue of Demailly's regularization theorem. Next, we study the solutions to the tropical Monge-Ampère equations. While we establish their uniqueness, we show that the existence is not guaranteed in general. More precisely, we prove that the tropical analogue of the Calabi-Yau theorem fails for any pair $(X, θ)$ consisting of a compact tropical variety $X$ of dimension at least two satisfying a mild genericity assumption, and a tropical Kähler form $θ$ on $X$. In particular, there exist measures compactly supported in the open part of $X$ that admit no solution. In contrast, for tropical varieties that are regular in codimension one, we show the existence of solutions. Finally, via strongly faithful tropicalizations whose existence is established in this paper, we relate the tropical solutions, when they exist, to the solutions of non-Archimedean Monge-Ampère equations on Berkovich spaces.", "categories": ["math.AG", "math.CO", "math.DG"], "primary_category": "math.AG", "published": "2026-10-19T00:08:24+00:00", "updated": "2026-10-19T00:08:24+00:00", "abs_url": "http://arxiv.org/abs/2610.25602v1", "pdf_url": "https://arxiv.org/pdf/2610.25602v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 열대 Monge-Ampère 방정식과 Berkovich 공간에 관한 것으로, McMullen 문제(d=5) 및 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 열대 다양체(tropical variety) 위에서의 볼록 해석학(convex analysis)을 개발하고, 다원포텐셜 이론(pluripotential theory)의 고전적 결과들을 열대 설정으로 확장한다. 열대 Monge-Ampère 방정식의 해의 유일성을 증명하는 한편, 차원이 2 이상인 컴팩트 열대 다양체에서는 열대 버전의 Calabi-Yau 정리가 일반적으로 성립하지 않음을 보인다. 나아가 강충실 열대화(strongly faithful tropicalization)를 통해 열대 해를 Berkovich 공간 위의 비-아르키메데스 Monge-Ampère 방정식의 해와 연결한다.", "technique": "다원포텐셜 이론(pluripotential theory)의 열대 유사체 구축, Demailly 정칙화 정리의 열대 버전, 강충실 열대화(strongly faithful tropicalization) 구성.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2610.25491v1", "title": "Interpretations of the $\\textbf{cd}$-index", "authors": ["Dan Guyer", "Alex Waugh"], "abstract": "We extend the recent work of Caster--Guyer--Samper (2026+) to establish a combinatorial interpretation of the $\\textbf{cd}$-index for all $S$-partitionable posets, which includes all polytopes and $S$-shellable spheres. This interpretation is inductive on rank, but does not require passing to the order complex of the poset. We also provide topological interpretations of each $\\textbf{cd}$-monomial. Furthermore, we establish a recurrence on the $\\textbf{cd}$-indices of shelling components of the $d$-simplex that does not require the use of André permutations, a unimodality result for $\\textbf{cd}$-words ending in $\\textbf{d}$ for shelling components of the $d$-simplex and the $d$-cube, and provide two families of subdivisions of the boundary of the $d$-simplex whose sequence of $\\textbf{cd}$-indices is unbounded on all but the monomial $\\textbf{c}^{d+1}$ and all but the two monomials $\\textbf{c}^{d+1}$ and $\\textbf{d}\\textbf{c}^{d-1}$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-18T19:24:36+00:00", "updated": "2026-10-18T19:24:36+00:00", "abs_url": "http://arxiv.org/abs/2610.25491v1", "pdf_url": "https://arxiv.org/pdf/2610.25491v1", "journal_ref": "", "doi": "", "comment": "20 pages, 12 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 cd-index의 조합론적 해석에 관한 것으로, McMullen 문제(d=5, oriented matroid, convex/general position 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 Caster–Guyer–Samper(2026+)의 최근 연구를 확장하여 모든 $S$-분할 가능 포셋(polytope 및 $S$-shellable sphere 포함)에 대한 $\\textbf{cd}$-index의 조합론적 해석을 rank에 대한 귀납적 방식으로 확립한다. 또한 각 $\\textbf{cd}$-단항식의 위상적 해석, $d$-단순체의 shelling component에 대한 $\\textbf{cd}$-index의 점화식, $\\textbf{d}$로 끝나는 $\\textbf{cd}$-word에 대한 단봉성(unimodality) 결과를 제시한다. 나아가 $d$-단순체 경계의 두 세분(subdivision) 족에서 $\\textbf{cd}$-index 수열이 $\\textbf{c}^{d+1}$ 및 $\\textbf{d}\\textbf{c}^{d-1}$을 제외한 모든 단항식에서 비유계(unbounded)임을 보인다.", "technique": "$S$-분할 가능 포셋의 rank에 대한 귀납적 분석과 위상적 해석을 결합하여 $\\textbf{cd}$-index를 André 순열 없이 다루는 점화식을 구성한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.25171v1", "title": "The minimum number of vertices of a triangulation of $\\mathbb{RP}^5$", "authors": ["Xinrui Chang"], "abstract": "We give a computer-assisted proof that every finite simplicial triangulation of real projective five-space has at least twenty-four vertices. Together with the construction of Guyer, Steinerberger, and Yang, this determines the minimum. A cup-product argument produces an induced subcomplex on sixteen or seventeen vertices. Transfer to the spherical double cover then imposes a covering condition on its lifted faces. In the sixteen-vertex case, a direct capacity bound excludes twenty-two vertices. For twenty-three vertices, a cochain extension argument reduces every relevant completion to one of 115 critical signed complexes; integer weights and exact covering certificates exclude all of them. The argument requires no assumption that the triangulation is combinatorial.", "categories": ["math.CO", "math.AT", "math.GT"], "primary_category": "math.CO", "published": "2026-10-18T10:50:45+00:00", "updated": "2026-10-18T10:50:45+00:00", "abs_url": "http://arxiv.org/abs/2610.25171v1", "pdf_url": "https://arxiv.org/pdf/2610.25171v1", "journal_ref": "", "doi": "", "comment": "9 pages; ancillary files include verification code and covering certificates", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 $\\mathbb{RP}^5$의 삼각분할 최소 꼭짓점 수 문제를 다루며, McMullen 문제(일반 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 실사영 5공간 $\\mathbb{RP}^5$의 유한 단순 삼각분할(simplicial triangulation)이 적어도 24개의 꼭짓점을 가짐을 컴퓨터 보조 증명으로 확립하고, Guyer–Steinerberger–Yang의 구성과 결합하여 최솟값이 정확히 24임을 결정한다. 증명은 컵곱(cup-product) 논증, 구면 이중 피복(spherical double cover)으로의 전이, 그리고 115개의 임계 부호 복합체(critical signed complexes)에 대한 정수 가중치 및 정확한 피복 증명서(exact covering certificates)를 활용한다. 이 논증은 삼각분할이 조합론적(combinatorial)임을 가정하지 않는다.", "technique": "컵곱 논증으로 유도 부분복합체를 제한한 후, 구면 이중 피복의 피복 조건과 cochain extension 논증을 통해 모든 경우를 115개의 임계 부호 복합체로 축소하고 정수 가중치 증명서로 배제하는 컴퓨터 보조 완전탐색.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.23004v1", "title": "A cubulation of the associahedron using a torus-equivariant degeneration of the brick variety", "authors": ["Raj Gandhi", "Gabe Udell"], "abstract": "We describe a mixed subdivision of the $(n-1)$-dimensional Loday associahedron into $(n-1)!$ maximal cells which are combinatorial cubes, and we show that the face poset of this subdivision is isomorphic to the face poset of the subdivision of the $1\\times 2\\times \\dotsb \\times (n-1)$ box into unit cubes. More generally, we describe mixed subdivisions of generalized associahedra into pieces which are Minkowski sums of Bruhat interval polytopes. Our subdivisions arise from a torus-equivariant embedded (in a product of flag varieties) degeneration of brick varieties into reduced unions of products of Richardson varieties. The subdivision of Loday's associahedron allows us to `embed' the 1-skeleton of the permutahedron in the boundary of the associahedron.", "categories": ["math.CO", "math.AG"], "primary_category": "math.CO", "published": "2026-10-16T06:28:15+00:00", "updated": "2026-10-16T06:28:15+00:00", "abs_url": "http://arxiv.org/abs/2610.23004v1", "pdf_url": "https://arxiv.org/pdf/2610.23004v1", "journal_ref": "", "doi": "", "comment": "71 pages, 21 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 associahedron의 혼합 세분(mixed subdivision)과 벽돌 다양체(brick variety)의 토러스-등변 퇴화를 다루며, McMullen 문제(d=5)의 oriented matroid·점 배치 문제와 직접적인 관련이 없다.", "summary": "이 논문은 $(n-1)$차원 Loday associahedron을 $(n-1)!$개의 조합론적 정육면체(combinatorial cube)로 분할하는 혼합 세분을 기술하고, 이 세분의 면 포셋(face poset)이 $1\\times 2\\times \\dotsb \\times (n-1)$ 상자를 단위 정육면체로 분할한 것의 면 포셋과 동형임을 보인다. 더 일반적으로, 일반화된 associahedra를 Bruhat interval polytope의 Minkowski 합으로 구성된 조각들로 분할하며, 이 구성은 기(flag) 다양체의 곱 안에 임베딩된 벽돌 다양체(brick variety)의 토러스-등변 퇴화에서 비롯된다. 이를 통해 퍼뮤타헤드론(permutahedron)의 1-뼈대(1-skeleton)를 associahedron의 경계에 '임베딩'하는 결과도 얻는다.", "technique": "기(flag) 다양체의 곱 안에 임베딩된 벽돌 다양체를 Richardson 다양체의 곱들의 기약 합집합으로 토러스-등변 퇴화시키는 방법을 핵심 기법으로 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.22663v1", "title": "Rational decomposition of polyhedra and a conjecture of Brlek and Reutenauer", "authors": ["Flavio D'Alessandro", "Paolo Papi"], "abstract": "We prove in the affirmative a conjecture of Brlek and Reutenauer (2003), which relates unambiguous rational sets to a well known result due to Khovanskii and Pukhlikov (1992) and independently to Lawrence (1990) on the valuations of the algebra spanned by the indicator functions of polyhedra.", "categories": ["cs.DM", "cs.FL", "math.CO", "math.MG"], "primary_category": "cs.DM", "published": "2026-10-15T21:29:14+00:00", "updated": "2026-10-15T21:29:14+00:00", "abs_url": "http://arxiv.org/abs/2610.22663v1", "pdf_url": "https://arxiv.org/pdf/2610.22663v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 다면체의 유리 분해(rational decomposition of polyhedra)와 지시함수 대수의 가치(valuation)에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 Brlek과 Reutenauer(2003)의 추측을 긍정적으로 증명한다. 해당 추측은 비모호 유리 집합(unambiguous rational sets)을 Khovanskii–Pukhlikov(1992) 및 독립적으로 Lawrence(1990)의 다면체 지시함수 대수의 가치(valuation)에 관한 결과와 연결짓는다.", "technique": "다면체의 지시함수로 생성된 대수(algebra)에서의 가치(valuation) 이론 및 유리 분해(rational decomposition) 기법 활용.", "connections": "", "keyword_hits": ["lawrence"], "source": "filter"}, {"id": "2610.21572v1", "title": "Lattice coverings by parallelotopes containing cube vertices", "authors": ["Dragomir Grozev", "Nikolai Nikolov"], "abstract": "We investigate when a parallelotope containing vertices of the unit cube $Q_n=[0,1]^n$ covers $\\Bbb R^n$ by integer translates. We prove the covering property for every parallelepiped containing five vertices of $Q_3$, and, in any dimension, for every parallelotope containing a facet of $Q_n$ and one vertex of the opposite facet. As a consequence, we obtain the sharp bound $1/n$ for the volume of a pyramid contained in $Q_n$ with a parallelotope base. We also give an alternative proof of this bound.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-10-15T09:24:46+00:00", "updated": "2026-10-15T09:24:46+00:00", "abs_url": "http://arxiv.org/abs/2610.21572v1", "pdf_url": "https://arxiv.org/pdf/2610.21572v1", "journal_ref": "", "doi": "", "comment": "4 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "단위 큐브와 볼록 배치를 다루지만 McMullen 문제(f(5)=11, oriented matroid 등)와 직접적 관련이 없음.", "summary": "이 논문은 단위 큐브 $Q_n=[0,1]^n$의 꼭짓점을 포함하는 평행다면체(parallelotope)가 정수 평행이동으로 $\\mathbb{R}^n$을 덮는 조건을 연구한다. $Q_3$의 다섯 꼭짓점을 포함하는 모든 평행육면체 및 임의 차원에서 $Q_n$의 한 면(facet)과 반대 면의 한 꼭짓점을 포함하는 평행다면체에 대해 덮개 성질(covering property)을 증명한다. 이를 통해 평행다면체 밑면을 갖는 피라미드가 $Q_n$ 안에 포함될 때 부피의 최적 상한 $1/n$을 도출한다.", "technique": "정수 평행이동에 의한 격자 덮개(lattice covering) 이론과 평행다면체의 기하학적 성질을 결합하여 덮개 조건을 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.21210v1", "title": "Local modifications in planar hypohamiltonian graphs", "authors": ["Samantha Durias", "Sabrina Guerrero", "Briana Jaiyen", "Daniel Kaplan", "Austin Lapine", "Caleb Peralta", "Akul Shrivastav"], "abstract": "We prove that for $n \\geq 36$ there exists a planar hypohamiltonian graph of order $n$. As a corollary, we prove that for $n \\geq 33$ there exists an almost hypohamiltonian planar graph of order $n$. Further, we exhibit over 100 planar hypohamiltonian graphs of order less than 40, including new graphs of orders 36, 37, 38, and 39.   The proof utilizes three local modifications that alter a graph $G$ by removing a subgraph $H$ and replacing it with $H'$ to form a new graph $G'$: a plus two modification, a plus three modification, and Thomassen's iterable plus four modification. The plus two modification preserves hypohamiltonicity in general, and the plus three modification preserves hypohamiltonicity in our cases of interest. This establishes the main result beginning with Tsai's order 34 examples.   Further, we conjecture that among planar hypohamiltonian graphs, Tsai's 34 vertex examples are the smallest order. The conjecture is based on previous results, constraints on the degree modulo 3, and experimentation with planar graphs consisting entirely of 4-gons and 5-gons.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-15T04:04:41+00:00", "updated": "2026-10-15T04:04:41+00:00", "abs_url": "http://arxiv.org/abs/2610.21210v1", "pdf_url": "https://arxiv.org/pdf/2610.21210v1", "journal_ref": "", "doi": "", "comment": "30 pages, comments welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "평면 hypohamiltonian 그래프의 존재성과 구성은 McMullen's problem(볼록 위치의 점 배치와 oriented matroid 구조)과 무관한 순수 그래프 이론 문제.", "summary": "본 논문은 $n \\geq 36$일 때 평면 hypohamiltonian 그래프의 존재를 증명하고, 세 가지 국소 수정(plus two, plus three, plus four modification)을 이용하여 34개 정점 그래프로부터 구성함. 36-39 정점의 새로운 예시와 100개 이상의 평면 hypohamiltonian 그래프를 제시하며, 최소 차수가 34라는 추측을 제안.", "technique": "국소 부분그래프 치환을 통한 반복적 구성(iterable local modifications)으로 hypohamiltonicity 보존.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25271v1", "title": "Inverse Zero-Sum Problems: The Property C and Property D Conjectures", "authors": ["Guoqing Wang"], "abstract": "Let $C_n^r$ denote the direct sum of $r$ cyclic groups of order $n$, where $n\\ge2$ and $r\\ge1$. Properties C and D predict a uniform multiplicity structure for extremal zero-sum problems over $C_n^r$: every sequence of maximum length avoiding nonempty zero-sum subsequences of length at most $n$, or of length exactly $n$, respectively, should have the form $T^{n-1}$. We give negative answers to the general Property C problem posed by Gao, Hou, Schmid and Thangadurai \\cite[Open Problems 1.2]{GHST07} in 2007, and disprove the Property D conjecture proposed by Gao and Geroldinger \\cite[Conjecture 7.2]{GG06} in 2006.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-10-18T13:39:47+00:00", "updated": "2026-10-18T13:39:47+00:00", "abs_url": "http://arxiv.org/abs/2610.25271v1", "pdf_url": "https://arxiv.org/pdf/2610.25271v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 논문이지만 McMullen's problem(볼록 위치, oriented matroid, 점 배치)과 직접 관련이 없으며, zero-sum 문제는 군론·부가조합론(additive combinatorics) 분야로 서로 다른 주제.", "summary": "본 논문은 순환군의 직합 $C_n^r$ 위에서 extremal zero-sum 문제에 대한 Property C와 Property D 추측들을 다룬다. 저자는 2007년 Gao-Hou-Schmid-Thangadurai의 일반 Property C 문제와 2006년 Gao-Geroldinger의 Property D 추측에 부정적인 답을 제시한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.27083v1", "title": "Partitionability is NP-complete", "authors": ["Russ Woodroofe"], "abstract": "We show that the problem of deciding whether a simplicial complex is partitionable is NP-complete in dimensions two and higher, answering a 1995 question of Kleinschmidt and Onn.", "categories": ["math.CO", "cs.CC"], "primary_category": "math.CO", "published": "2026-10-19T18:00:04+00:00", "updated": "2026-10-19T18:00:04+00:00", "abs_url": "http://arxiv.org/abs/2610.27083v1", "pdf_url": "https://arxiv.org/pdf/2610.27083v1", "journal_ref": "", "doi": "", "comment": "14 pages; 4 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "단순체 복합체의 분할가능성 판정 문제의 계산복잡도를 다루지만, McMullen 문제(5차원 일반위치 점 배치의 면 개수)와는 직접적 관련이 없음.", "summary": "단순체 복합체(simplicial complex)가 분할가능(partitionable)한지 판정하는 문제가 2차원 이상에서 NP-완전임을 증명하였다. 이는 1995년 Kleinschmidt와 Onn이 제기한 문제에 대한 답이다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.24324v1", "title": "Reconfiguration graphs of mutual-visibility sets", "authors": ["Julián A. Fresán-Figueroa", "Ilán A. Goldfeder", "Aldo Lozano-Piña"], "abstract": "A set $S\\subseteq V(G)$ is a mutual-visibility set if every pair of vertices in $S$ is joined by a geodesic whose internal vertices do not belong to $S$. We define a reconfiguration graph whose vertices are the mutual-visibility sets of $G$. Two configurations are adjacent if one is obtained from the other by adding or removing one vertex or by sliding one token along an edge of $G$. The subgraphs induced by configurations of a fixed cardinality are called layers. The spanning subgraph formed by token-addition and token-removal edges is a daisy cube. We study the effects of token-sliding edges on distances and connectivity to this skeleton. For a connected host of order $n\\ge3$, the vertex connectivity of the reconfiguration graph lies between $3$ and $n$, and both bounds are attained. We determine several parameters of $\\mathcal{R}_{\\mathcal{M}}(K_n)$ and describe the behavior of the model for disconnected hosts and for isometric or convex subgraphs. We also give a component-based criterion for mobile mutual visibility. For complete bipartite graphs, we use a description of feasible configurations to determine connectivity and distance bounds for fixed-cardinality layers. For trees, we show that every component of a layer of cardinality at least three is isomorphic to a Cartesian product of subtrees, obtaining exact metric formulas and characterizing the connected layers. Finally, we prove that every layer of a cycle is connected.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-16T23:43:50+00:00", "updated": "2026-10-16T23:43:50+00:00", "abs_url": "http://arxiv.org/abs/2610.24324v1", "pdf_url": "https://arxiv.org/pdf/2610.24324v1", "journal_ref": "", "doi": "", "comment": "22 pages, 4 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "상호가시성 집합의 재구성 그래프는 조합론적 구조이지만 McMullen 문제(5차원 볼록 위치 점 배치, oriented matroid, tope graph)와 직접적 관련이 없음.", "summary": "상호가시성 집합(mutual-visibility set)은 S 내 모든 정점 쌍을 잇는 측지선의 내부 정점이 S에 속하지 않는 집합이다. 본 논문은 이러한 집합들을 정점으로 하는 재구성 그래프를 정의하고, 완전 그래프, 완전 이분 그래프, 트리, 사이클 등 다양한 호스트 그래프에 대해 연결성, 거리, 계층 구조(layer)를 분석한다.", "technique": "daisy cube 구조와 토큰 슬라이딩 연산을 이용한 재구성 그래프 분석; 그래프 호스트별 구체적 특성화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25800v1", "title": "The Maximum Commute Time of Regular Graphs", "authors": ["Jing Huang", "Xuezhu Liao", "Jiaxin Tang"], "abstract": "For a connected simple regular graph $G$, let $τ(G)$ be the maximum commute time for simple random walk, and let $t_n$ be the maximum of $τ(G)$ over all such graphs of order $n$. Aldous and Fill conjectured that $t_n\\sim3n^2/2$. We determine $t_n$ exactly and classify all maximizers for every even $n\\geq10$ and every odd $n\\geq15$; both thresholds are best possible. The maximizers are cubic block chains joined by bridges at even orders and quartic block chains joined at cut vertices at odd orders. The exact formulas specify the linear corrections according to the order modulo four and five, respectively, and imply $ t_n\\sim \\begin{cases} \\dfrac32 n^2, & n\\text{ even},\\\\[1mm] n^2, & n\\text{ odd}, \\end{cases} \\qquad n\\to\\infty. $ Thus the conjectured asymptotic formula holds along even orders but fails along odd orders. The proof combines unit-current potential orderings, cut-current inequalities, and sharp block resistance bounds, supplemented by finite computations in exact rational arithmetic.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-19T05:12:47+00:00", "updated": "2026-10-19T05:12:47+00:00", "abs_url": "http://arxiv.org/abs/2610.25800v1", "pdf_url": "https://arxiv.org/pdf/2610.25800v1", "journal_ref": "", "doi": "", "comment": "30 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "정규 그래프의 random walk commute time 최적화 문제로, McMullen's problem의 convex position 및 combinatorial geometry와는 직접적 관련이 없음.", "summary": "연결된 정규 그래프에서 단순 random walk의 최대 commute time $τ(G)$와 이를 최대화하는 차수 $n$의 그래프들을 완전히 분류함. Aldous-Fill 추측의 asymptotic 형태가 짝수 차수에서는 성립하나 홀수 차수에서는 실패함을 증명.", "technique": "unit-current potential ordering, cut-current inequality, block resistance bound를 결합한 electrical network 이론 기반 접근.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.21577v1", "title": "Generalized Erdős--Ginzburg--Ziv Constants for finite abelian groups of rank three", "authors": ["Hanbin Zhang", "Shiwen Zhang"], "abstract": "Let $G$ be a finite abelian group with exponent $\\exp(G)$. For positive integer $k$, the generalized Erdős--Ginzburg--Ziv constant, denoted by $\\mathsf s_{k\\exp(G)}(G)$ is the least integer $\\ell$ such that every sequence of length at least $\\ell$ over $G$ has a zero-sum subsequence of length $k\\exp(G)$. In this paper, we prove that, for any $n\\ge 1$, \\[\\mathsf s_{3\\cdot 2^n}(C_{2^n}^3)=6\\cdot 2^n-3 \\quad\\text{and}\\quad \\mathsf s_{4\\cdot 3^n}(C_{3^n}^3)=7\\cdot 3^n-3. \\] This completes all the remaining cases in the study of $\\mathsf s_{kq}(C_q^3)$, where $q$ is a prime power and $k\\ge 3$. As a consequence, for every $k\\ge 3$, we have \\[ \\mathsf s_{kn}(C_n^3)=(k+3)n+O(\\frac{n}{\\log n}). \\] This verifies a conjecture of Kubertin asymptotically. Our approach combines the previous group ring techniques and a recent powerful generalization of the Chevalley-Warning and Ax-Katz theorems introduced by Grynkiewicz", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-10-15T09:27:10+00:00", "updated": "2026-10-15T09:27:10+00:00", "abs_url": "http://arxiv.org/abs/2610.21577v1", "pdf_url": "https://arxiv.org/pdf/2610.21577v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한 아벨군의 영합-부분수열(zero-sum subsequence) 문제로, 이산기하학의 점 배치나 convex position과는 직접 관련이 없음.", "summary": "유한 아벨군 $G$에 대해 generalized Erdős–Ginzburg–Ziv 상수 $\\mathsf{s}_{k\\exp(G)}(G)$를 연구하며, $C_{2^n}^3$과 $C_{3^n}^3$에 대한 명시적 공식을 증명했다. 이는 소수 거듭제곱 $q$와 $k \\geq 3$에 대해 $\\mathsf{s}_{kq}(C_q^3)$의 모든 남은 경우를 완성하고 Kubertin의 추측을 점근적으로 검증한다.", "technique": "그룹환 기법(group ring techniques)과 Chevalley–Warning 및 Ax–Katz 정리의 일반화를 결합.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25386v1", "title": "On the maximally edge-connected square graphs with degree sequence conditions", "authors": ["Kai Li", "Yingzhi Tian"], "abstract": "Let $G=(V(G),E(G))$ be a finite connected simple graph. The edge-connectivity $λ(G)$ of $G$ is the minimum number of edges that must be removed to make $G$ disconnected. We call $G$ maximally edge-connected when $λ(G)=δ(G)$, where $δ(G)$ is the minimum degree of $G$. The square graph $G^2$ of $G$ is the graph with vertex set $V(G)$, where two distinct vertices $u$ and $v$ are adjacent in $G^2$ precisely when their distance in $G$ is at most two. In this paper, first we prove that if $λ(G)\\geq4$ and $λ(G^2)<δ(G^2)$, then $λ(G^2)>λ(G)^{3/2}-\\frac54λ(G)$, which extends the result in \\cite{ChenXu} from the edge-connectivity range $4\\leqλ(G)\\leq7$ to $λ(G)\\geq4$. Then we show that $G^2$ is maximally edge-connected if one of the following conditions hold: (i) $δ(G)\\geq\\lfloor(n+2)/4\\rfloor$, or $δ(G)\\leq\\lfloor(n+2)/4\\rfloor-1$ and $\\sum_{i=1}^{2k}d_{n+1-i}\\geq k(n-4)-2δ(G)+3$, where $k$ is an integer satisfying $2\\leq k\\leqδ(G)+2$ and $d_1\\geq d_2\\geq\\cdots\\geq d_n$ are the degrees of $G$; (ii) $d_{n-δ(G)}+d_n\\geq(3n-9)/4$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-18T16:37:15+00:00", "updated": "2026-10-18T16:37:15+00:00", "abs_url": "http://arxiv.org/abs/2610.25386v1", "pdf_url": "https://arxiv.org/pdf/2610.25386v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프의 edge-connectivity와 degree sequence 조건을 다루며, McMullen's problem이 주로 convex position의 점 배치와 oriented matroid 구조를 다루는 것과 직접적인 관련이 없습니다.", "summary": "본 논문은 그래프 $G$의 square graph $G^2$가 maximally edge-connected인 조건을 연구합니다. 먼저 $λ(G)≥4$일 때 edge-connectivity의 하한을 확장하고, 최소 차수와 degree sequence 조건에 따라 $G^2$가 maximally edge-connected임을 보입니다.", "technique": "Degree sequence 분석과 edge-connectivity의 하한 추정을 통한 그래프 이론적 접근.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.28299v1", "title": "Ordered Trees with Linear Off-Diagonal Ramsey Numbers", "authors": ["Lior Gishboliner", "Artur Kravtsov", "Xiangyu Li"], "abstract": "We characterize the following three classes of ordered trees:   $\\qquad$ (1) trees $T$ satisfying $R_<(T,K_n)=O(n)$;   $\\qquad$ (2) $χ$-bounding trees;   $\\qquad$ (3) Ramsey-good trees.   In particular, we show that the first two classes coincide. The second characterization answers a question of Axenovich, Rollin and Ueckerdt, and the third resolves a problem of Balko and Poljak.   In our proof, we also introduce several novel constructions of ordered graphs with sublinear independence number, giving lower bounds on $R_<(F,K_n)$ for various ordered forests $F$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-20T14:43:19+00:00", "updated": "2026-10-20T14:43:19+00:00", "abs_url": "http://arxiv.org/abs/2610.28299v1", "pdf_url": "https://arxiv.org/pdf/2610.28299v1", "journal_ref": "", "doi": "", "comment": "35 pages, 4 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "순서 그래프의 Ramsey 수와 색칠수 경계 문제로, McMullen's problem의 고차원 볼록기하 및 oriented matroid 중심의 조합론적 구조와는 직접 관련성이 없음.", "summary": "순서트리(ordered trees)를 세 가지 기준으로 분류하고, 선형 off-diagonal Ramsey 수를 갖는 트리의 특성을 규명한다. 특히 χ-bounding trees와 Ramsey-good trees의 구조를 완전히 특성화하고, 순서숲에 대한 Ramsey 수의 하한을 위한 새로운 구성을 제시한다.", "technique": "순서그래프의 독립수(independence number)를 부분선형(sublinear)으로 유지하는 구성을 통해 Ramsey 수 하한 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25293v1", "title": "A Common neighborhood signed graph of a signed graph", "authors": ["MUKTI ACHARYA"], "abstract": "Let G be a simple connected graph with the vertex set V (G) and the edge set E(G) such that |V (G)| = n and |E(G)| = q. The common neighborhood graph con(G) of G has the same set of vertices as that of G and uv is an edge in con(G) if u and v have at least one common neighbor in G. By a signed graph S, we mean a graph G whose edges has been assigned sign plus or minus. In this paper, the concept of common neighborhood graph has been initiated in the realm of signed graphs, that is, we define a common neighborhood signed graph of a signed graph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-18T14:20:41+00:00", "updated": "2026-10-18T14:20:41+00:00", "abs_url": "http://arxiv.org/abs/2610.25293v1", "pdf_url": "https://arxiv.org/pdf/2610.25293v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "부호 그래프의 공통 이웃 구조를 정의하지만, McMullen's problem과 관련된 convex position, oriented matroid, 고차원 기하학적 조합론과는 직접 관련이 없음.", "summary": "단순 연결 그래프의 공통 이웃 그래프(common neighborhood graph) 개념을 부호 그래프(signed graph)로 확장한다. 부호 그래프의 공통 이웃 부호 그래프를 정의하고, 이 구조의 성질을 연구한다.", "technique": "공통 이웃 관계를 부호 그래프 설정에서 재정의하는 구조적 확장.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.30003v1", "title": "On optimal (v,5,3,1) optical orthogonal codes", "authors": ["Laura Johnson", "Lorenzo Mella", "Anita Pasotti", "Emma Smith"], "abstract": "In this paper, we establish a tight upper bound for the size of a $(v,5,3,1)$ optical orthogonal code (OOC) and call such a code optimal when it achieves this upper bound. In addition, if an optimal OOC has the property that all non-identity elements of $\\mathbb{Z}_v$ are covered by the list of differences of its codeword-sets then it is called perfect. In this paper, we present direct and recursive constructions for infinite classes of optimal and perfect $(v,5,3,1)$-OOCs.", "categories": ["math.CO", "cs.IT"], "primary_category": "math.CO", "published": "2026-10-21T16:40:00+00:00", "updated": "2026-10-21T16:40:00+00:00", "abs_url": "http://arxiv.org/abs/2610.30003v1", "pdf_url": "https://arxiv.org/pdf/2610.30003v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "광학 직교 부호(OOC)는 부호 이론 및 조합 설계 분야로, 이산기하학의 점 배치·general position 문제와 직접적 관련성이 없음.", "summary": "본 논문은 $(v,5,3,1)$ 광학 직교 부호의 크기에 대한 타이트 상한을 설정하고, 이를 달성하는 부호를 최적(optimal)이라 정의한다. 모든 비항등원소가 부호 집합의 차분으로 표현되는 경우를 완전(perfect)이라 하며, 저자들은 최적 및 완전 OOC의 무한 계열에 대한 직접·재귀 구성을 제시한다.", "technique": "직접 구성 및 재귀적 구성(direct and recursive constructions)을 이용한 조합 설계.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.31557v1", "title": "The domination number of the 2-token graph of the complete bipartite graph", "authors": ["E. Acosta Troncoso", "I. Caldera Caldera", "L. M. Rivera"], "abstract": "For a graph $G$, the $2$-token graph $F_2(G)$ has as vertices all $2$-subsets of $V(G)$, with two such subsets adjacent whenever their symmetric difference is an edge of $G$. In this paper, we determine the domination number of the $2$-token graph of the complete bipartite graph $K_{m,n}$, for all integers $2\\le m\\le n$. We show that it equals $\\lceil m/2\\rceil+n-1$, except when $m=3$, or when $m\\ge5$ is odd and $n=m+1$; in these two exceptional situations it is one less. Our arguments rely on an explicit characterization of the dominating sets of the $2$-token graph of $K_{m,n}$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-22T17:00:01+00:00", "updated": "2026-10-22T17:00:01+00:00", "abs_url": "http://arxiv.org/abs/2610.31557v1", "pdf_url": "https://arxiv.org/pdf/2610.31557v1", "journal_ref": "", "doi": "", "comment": "14 pages, 3 Figures, 1 Table. Submitted for publication before the appearance of arXiv:2610.28936, whose results on F_2(K_{m,n}) were obtained independently. This version differs from the submitted one only by a footnote on arXiv:2610.28936 and three added references in the conclusions section", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Token graphs와 지배 수(domination number)는 조합론의 전통적 주제이지만, McMullen's problem의 핵심인 convex position, oriented matroid, realizability와는 직접 관련이 없음.", "summary": "본 논문은 완전이분그래프 $K_{m,n}$의 2-token graph $F_2(G)$의 지배 수(domination number)를 결정한다. 2-token graph는 꼭짓점 집합 $V(G)$의 모든 2-부분집합을 정점으로 가지며, 두 부분집합의 대칭차가 $G$의 간선일 때 인접한다. 결과는 대부분의 경우 지배 수가 $\\lceil m/2\\rceil+n-1$임을 보이며, $m=3$ 또는 $m\\ge5$가 홀수이고 $n=m+1$인 예외 경우에는 1 작음을 증명한다.", "technique": "지배 집합(dominating set)의 명시적 특성화(explicit characterization)를 통한 직접 계산.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25451v1", "title": "An A-B-C Coordinate Encoding for Exact Boundary-Cycle Extraction on Hexagonal Lattices", "authors": ["Philippe Mullhaupt"], "abstract": "We study an integer-coordinate encoding of boundary incidences for finite subsets of the regular hexagonal tiling. Each selected cell contributes six ordered records with endpoints in two role-distinguished classes, point and tail. Identical records from neighboring cells cancel, and the surviving records form a disjoint union of cycles, including the exterior boundaries of disconnected components and the boundaries of holes. We derive the actual even- and odd-row record formulas from the A--B--C transforms used in Hexagones 2.0, prove exact shared-edge identities and the global role-qualified incidence structure, and thereby obtain an unconditional correctness theorem for the abstract coordinate construction. We compare the encoding with an independent exact cube-coordinate half-edge hashing implementation, proving an incidence isomorphism and checking 504 finite regions. We give an expected-linear-time indexed algorithm and distinguish it from the historical fixed-capacity C traversal, whose sentinel and closure conventions do not inherit the theorem automatically. The claim is a compact coordinate realization of a known planar boundary principle, not historical priority or a new three-axis lattice.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-18T18:23:44+00:00", "updated": "2026-10-18T18:23:44+00:00", "abs_url": "http://arxiv.org/abs/2610.25451v1", "pdf_url": "https://arxiv.org/pdf/2610.25451v1", "journal_ref": "", "doi": "", "comment": "14 pages, 7 figures. Code in reference", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "육각형 격자의 경계 추출 알고리즘은 조합론적 구조를 다루지만, McMullen's problem의 convex position, oriented matroid, realizability, tope graph 등과 직접적인 연관이 없음.", "summary": "정규 육각형 타일링의 유한 부분집합에 대해 정수 좌표 인코딩을 이용하여 경계 사이클을 정확히 추출하는 방법을 제시한다. A-B-C 변환을 기반으로 짝수/홀수 행 기록 공식을 유도하고, 공유 간선 항등식과 전역 입사 구조를 증명하여 좌표 구성의 정확성을 보장한다.", "technique": "정수 좌표 인코딩과 기록 상쇄(cancellation)를 통한 경계 사이클 추출, 큐브 좌표 구현과의 입사 동형 검증.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.30719v1", "title": "Weighted odd-cycle transversals and fractional colorings of planar graphs", "authors": ["Xiaolan Hu", "Jiaao Li", "Zhouningxin Wang"], "abstract": "We bound fractional chromatic numbers by establishing a connection with low-weight odd-cycle transversals. Let $\\ell\\geq 3$ be an integer and let $G$ be a graph of odd girth at least $\\ell$ whose odd-cycle covering polyhedron is integral. For every nonnegative weight vector $w=(w_v)_{v\\in V(G)}\\in \\mathbb{R}_{\\geq 0}^{V(G)}$, we obtain a set $Z\\subseteq V(G)$ such that $G-Z$ is bipartite and $w(Z)\\leq\\frac{mad(G)}{2\\ell}w(V(G))$. Here, $w(S)=\\sum_{v\\in S}w_v$ for any $S\\subseteq V(G)$, and $mad(G)$ denotes the maximum average degree of $G$. Consequently, if $mad(G)<2\\ell$, then $G$ has fractional chromatic number at most $\\frac{4\\ell}{2\\ell-mad(G)}$.   As applications, we prove that, for every positive integer $k$, every $n$-vertex planar graph of girth at least $2k+3$ has fractional chromatic number at most $\\frac{2k+1}{k}(1-\\frac{1}{kn+1})$, establishing the girth version of Naserasr's fractional coloring conjecture with a strict inequality. For $k=1$, we furthermore prove that the upper bound $\\frac{3n}{n+1}$ holds for every $n$-vertex triangle-free planar graph and this is attained for infinitely many values of $n$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-22T04:36:42+00:00", "updated": "2026-10-22T04:36:42+00:00", "abs_url": "http://arxiv.org/abs/2610.30719v1", "pdf_url": "https://arxiv.org/pdf/2610.30719v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "평면그래프의 fractional chromatic number 연구로, McMullen's problem(볼록위치 점 배치, oriented matroid)과 직접 관련성 없음.", "summary": "본 논문은 가중치 있는 홀사이클 제거(weighted odd-cycle transversal)와 fractional chromatic number의 연결을 통해, 홀 girth가 충분히 큰 그래프에 대한 fractional chromatic number의 상한을 구한다. 특히 평면그래프의 girth 조건에서 Naserasr의 fractional coloring 추측을 증명하고, 삼각형 없는 평면그래프에서 정확한 상한을 제시한다.", "technique": "odd-cycle covering polyhedron의 적분성(integrality)과 최대평균차수(maximum average degree, mad) 제약을 이용한 가중치 vertex cover 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.28861v1", "title": "From Wheel to Jahangir graphs: spectra and energy under structured edge deletion", "authors": ["Diego Bravo", "Florencia Cubría", "Annabella Zapattini"], "abstract": "The energy of a graph, introduced by Gutman, is defined as the sum of the absolute values of the eigenvalues of its adjacency matrix. In this work we study how the energy of the Wheel graph $W_n$ changes when a specific set of spokes is removed. The resulting graphs are precisely the Jahangir graphs $J_{m,n}$, where m divides n, and which may also be viewed as the Cycle graph $C_n$ together with an additional vertex adjacent to certain vertices of $C_n$ in a cyclic pattern. We determine the spectra of $J_{2,n}$, $J_{4,n}$, and $J_{6,n}$ by exploiting a factorization of their characteristic polynomials arising from equitable partitions. This yields explicit closed formulas for their energies. Moreover, under certain conditions, we establish the following monotonicity chain: \\[\\mathcal{E}(C_n) \\;\\leq\\; \\mathcal{E}(J_{6,n}) \\;\\leq\\; \\mathcal{E}(J_{4,n}) \\;\\leq\\; \\mathcal{E}(J_{2,n}) \\;\\leq\\; \\mathcal{E}(W_n).\\]", "categories": ["math.CO", "math.SP"], "primary_category": "math.CO", "published": "2026-10-20T19:32:50+00:00", "updated": "2026-10-20T19:32:50+00:00", "abs_url": "http://arxiv.org/abs/2610.28861v1", "pdf_url": "https://arxiv.org/pdf/2610.28861v1", "journal_ref": "", "doi": "", "comment": "16 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Wheel, Jahangir, Cycle 그래프의 스펙트럼 및 에너지 분석은 이산기하학적 점 배치나 oriented matroid 문제와 직접적 연관이 없음.", "summary": "본 논문은 Wheel 그래프 $W_n$에서 특정 spoke를 제거하여 Jahangir 그래프 $J_{m,n}$을 얻을 때 그래프 에너지의 변화를 연구한다. Equitable partition을 이용한 특성다항식 인수분해를 통해 $J_{2,n}$, $J_{4,n}$, $J_{6,n}$의 스펙트럼을 결정하고 에너지의 명시 공식을 도출한다. 결과적으로 $\\mathcal{E}(C_n) \\leq \\mathcal{E}(J_{6,n}) \\leq \\mathcal{E}(J_{4,n}) \\leq \\mathcal{E}(J_{2,n}) \\leq \\mathcal{E}(W_n)$의 단조성을 확립한다.", "technique": "Equitable partition에 의한 인접행렬의 특성다항식 인수분해를 통한 스펙트럼 계산.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.29789v1", "title": "Macroscopic Poincaré Inequalities and Weak-Type Characterizations of $p$-Energy Forms", "authors": ["Fabrice Baudoin", "Andrea Pinamonti", "Meng Yang"], "abstract": "For a class of regular strongly local $p$-energy forms on complete doubling metric measure spaces, $1<p<\\infty$, we derive a macroscopic Poincaré inequality from a Poincaré inequality and a capacity upper bound at a doubling scale $Ψ$. The macroscopic inequality compares $L^p$-oscillations at any two scales and yields a uniform two-scale comparison $J_s\\lesssim J_r$, $0<r<s$, for the Korevaar-Schoen functionals, strengthening their usual weak monotonicity property. Conversely, under a density assumption on compactly supported functions, the macroscopic inequality yields a regular strongly local Korevaar-Schoen $p$-energy satisfying a $Ψ$-Poincaré inequality. We also show that the macroscopic inequality forces lower $p$-scaling of $Ψ$ on scales not exceeding $\\mathrm{diam} X$; together with doubling, this gives two-sided power bounds. Finally, we establish a weak-type characterization of the energy domain of Brezis-Van Schaftingen-Yung type.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-21T14:16:58+00:00", "updated": "2026-10-21T14:16:58+00:00", "abs_url": "http://arxiv.org/abs/2610.29789v1", "pdf_url": "https://arxiv.org/pdf/2610.29789v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 metric measure spa

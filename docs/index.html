면(facet)을 분할·재조합하는 기하학적 구성(Gosset 급수 $k_{21}$ 활용)과 'creased' 폴리토프 개념 정의, 그리고 정확 산술 검증.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12483v1", "title": "The affine Tverberg theorem revisited", "authors": ["Sergey Avvakumov", "Roman Karasev"], "abstract": "We prove the Bárány--Kalai--Tverberg conjecture extending the affine version of Tverberg's theorem to simplicial balls and polytopes other than the simplex:   For any affine map $φ: P\\to \\mathbb R^d$ from a convex polytope $P$ of dimension $N=(d+1)(r-1)$ with $r\\geq 2$, there exist $r$ pairwise disjoint faces $F_1,\\ldots,F_r\\subset\\partial P$ such that $φ(F_1)\\cap\\dots\\capφ(F_r)\\neq\\varnothing$. A similar statement holds for a simplicial ball $P$ with $φ$ assumed affine on all of its faces.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-09-11T06:29:54+00:00", "updated": "2026-09-11T06:29:54+00:00", "abs_url": "http://arxiv.org/abs/2609.12483v1", "pdf_url": "https://arxiv.org/pdf/2609.12483v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Tverberg 정리의 아핀 버전에 관한 연구로, McMullen 문제(볼록 위치 점 배치 및 oriented matroid 관련)와 직접적인 연관성은 없다.", "summary": "이 논문은 Bárány–Kalai–Tverberg 추측을 증명하여, 차원 $N=(d+1)(r-1)$인 볼록 다면체 $P$에서 $\\mathbb{R}^d$로의 아핀 사상 $\\varphi$에 대해 경계 $\\partial P$에 서로 소인 $r$개의 면 $F_1,\\ldots,F_r$이 존재하여 $\\varphi(F_1)\\cap\\cdots\\cap\\varphi(F_r)\\neq\\varnothing$임을 보인다. 이는 Tverberg 정리의 아핀 버전을 단체(simplex) 이외의 단체적 볼(simplicial ball) 및 볼록 다면체로 확장한 결과이다.", "technique": "초록만으로는 구체적 증명 기법이 명시되지 않아 불확실.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12414v1", "title": "Torus actions on compactified braid varieties and polytopality of subword complexes", "authors": ["Lara Bossinger", "Mikhail Gorsky", "José Simental"], "abstract": "Every cluster variety admits an action of its cluster dilation group. We prove that, in the case of braid varieties for simple Lie groups, this action always extends to a regular action on each of the brick compactifications. We explore two applications of this result. First, we show that any closed Richardson variety admits a faithful action of a torus of rank the Kazhdan-Lusztig $d$-invariant, answering affirmatively a recent question of E. Gorsky--S. Kim--M. Sherman-Bennett. The same result holds for projected Richardson varieties. Second, we show that the braid variety is a torus if and only if for each of its brick compactifications, the polar dual of the moment polytope for this action realizes the corresponding subword complex. The braid words satisfying this property turn out to be precisely the double root free words of V. Pilaud and C. Stump. This provides a novel approach to the longstanding open question of the polytopality of spherical subword complexes asked by A. Knutson and E. Miller, and in particular gives infinite families of subword complexes admitting polytopal realizations in dimension higher than the rank of the corresponding Coxeter group. As a common consequence of these two applications, we classify all Bruhat intervals in finite crystallographic Coxeter groups which are isomorphic to face lattices of convex polytopes via certain double root free words.", "categories": ["math.AG", "math.CO", "math.RT"], "primary_category": "math.AG", "published": "2026-09-11T04:05:45+00:00", "updated": "2026-09-11T04:05:45+00:00", "abs_url": "http://arxiv.org/abs/2609.12414v1", "pdf_url": "https://arxiv.org/pdf/2609.12414v1", "journal_ref": "", "doi": "", "comment": "33 pages, comments welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 braid variety, Richardson variety, subword complex의 polytopality에 관한 것으로, McMullen 문제(d=5에서 convex/general position 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 braid variety의 cluster dilation group 작용이 각 brick compactification으로 확장됨을 증명하고, 두 가지 응용을 탐구한다. 첫째, 닫힌 Richardson variety가 Kazhdan-Lusztig $d$-불변량 rank의 torus의 faithful 작용을 가짐을 보이며, 둘째, braid variety가 torus인 경우 brick compactification의 moment polytope의 polar dual이 해당 subword complex를 실현함을 특성화한다. 결과적으로 Knutson–Miller가 제기한 구면 subword complex의 polytopality 문제에 새로운 접근법을 제공하고, Coxeter group의 rank보다 높은 차원에서 polytopal 실현을 갖는 무한 족을 구성한다.", "technique": "Cluster dilation group의 torus 작용을 brick compactification으로 확장하고, moment polytope의 polar dual을 통해 subword complex의 polytopal 실현을 분석하는 기법을 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.11599v1", "title": "Some results on Archdeacon's conjecture for rotation systems", "authors": ["Arahat Chikkatur", "Ji Zeng"], "abstract": "A rotation system on $n$ elements assigns to each element a cyclic order of the other $n-1$ elements. A four-element subset is non-planar if its induced rotation system cannot be realized by a crossing-free drawing of $K_4$. As a combinatorial strengthening of Hill's conjecture on the crossing number of the complete graph, Archdeacon conjectured that every rotation system on $n$ elements has at least $H(n)=\\frac{1}{4} \\lfloor\\frac {n}{2}\\rfloor \\lfloor\\frac{n-1}{2}\\rfloor \\lfloor\\frac{n-2}{2}\\rfloor \\lfloor\\frac{n-3}{2}\\rfloor$ non-planar four-element subsets.   We computationally verify Archdeacon's conjecture for $n\\leq 10$ and show that every extremal rotation system in these orders is realizable by a simple drawing. With computer assistance, we prove that every rotation system on $n$ elements has at least $(8/9 - o(1)) H(n)$ non-planar four-element subsets. We also present a proof by hand for a weaker lower bound of $(2/3-o(1)) H(n)$. Finally, extending recent work of Felsner on antipodal pairs in drawings, we show that Archdeacon's conjecture holds for antipodally shellable rotation systems.", "categories": ["cs.CG", "math.CO"], "primary_category": "cs.CG", "published": "2026-09-10T14:23:07+00:00", "updated": "2026-09-10T14:23:07+00:00", "abs_url": "http://arxiv.org/abs/2609.11599v1", "pdf_url": "https://arxiv.org/pdf/2609.11599v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 회전 시스템(rotation system)과 완전그래프의 교차수(crossing number)에 관한 Archdeacon 추측을 다루며, McMullen 문제(볼록/일반위치 점 배치, oriented matroid)와 직접적인 관련이 없다.", "summary": "이 논문은 $n$개 원소의 회전 시스템에서 비평면(non-planar) 4원소 부분집합의 수가 $H(n)=\\frac{1}{4}\\lfloor\\frac{n}{2}\\rfloor\\lfloor\\frac{n-1}{2}\\rfloor\\lfloor\\frac{n-2}{2}\\rfloor\\lfloor\\frac{n-3}{2}\\rfloor$ 이상임을 주장하는 Archdeacon 추측을 연구한다. 컴퓨터를 활용해 $n\\leq 10$에 대해 추측을 검증하고, 모든 회전 시스템이 적어도 $(8/9-o(1))H(n)$개의 비평면 4원소 부분집합을 가짐을 증명하였으며, 손으로 증명 가능한 $(2/3-o(1))H(n)$ 하한도 제시한다. 또한 antipodally shellable 회전 시스템에 대해 Archdeacon 추측이 성립함을 보인다.", "technique": "컴퓨터 기반 완전 탐색(computational verification), 조합론적 하한 분석, Felsner의 antipodal pair 이론 확장.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.10701v1", "title": "The $E_6$ Restricted Hyperplane Arrangement and its $E_7$ Shadow: Weyl Transport on a Minuscule Bruhat Poset", "authors": ["Saber Ahmed", "Mboyo Esole"], "abstract": "We study the restricted fan cut inside the dual fundamental Weyl chamber by the weights of a $27$-dimensional minuscule representation of $E_6$; the two such representations are dual and give the same arrangement.   Only $11$ of the $27$ weights have kernels meeting its interior, and we prove that they determine the entire fan. It has exactly $14$ chambers and $18$ extreme rays, every chamber is a six-dimensional simplicial cone, and we determine all facets, rays, and incidence relations. The chamber count was previously obtained by Diaconescu and Entin; the simplicial structure, extreme rays, and incidence data are new. The geometry of the $27$ lines on a cubic surface then explains and organizes the resulting chamber architecture. We also enumerate all faces, compute both characteristic polynomials---the arrangement is not supersolvable---together with lattice indices and projective chamber volumes, and describe the oriented matroid.   Our main result is representation-theoretic. A distinguished $14$-element visible subposet of the minuscule $\\mathbf{56}$ of $E_7$, defined entirely inside $E_7$, has Hasse diagram equal to the chamber adjacency graph of the $E_6$ arrangement. Three canonical $7+7$ splittings of it, of types $A_7$, $D_7$, and $E_7$, are the visible traces of Levi-center $\\mathfrak{u}(1)$-charge decompositions of the $\\mathbf{56}$ and reproduce the three level-$8$ decompositions on the $E_6$ side. More strongly, the simple-root labels on its covers, transported by minimal-length coset representatives, recover chamber by chamber all six facets and, globally, the $11$ active weight hyperplanes and the boundary walls of the dual Weyl chamber. Thus the $E_7$ shadow records not merely the chamber graph but, once matched with the independent $E_6$ classification, the full local wall architecture of $I(E_6,\\mathbf{27})$.", "categories": ["math.RT", "hep-th", "math.AG", "math.CO"], "primary_category": "math.RT", "published": "2026-09-09T18:00:49+00:00", "updated": "2026-09-09T18:00:49+00:00", "abs_url": "http://arxiv.org/abs/2609.10701v1", "pdf_url": "https://arxiv.org/pdf/2609.10701v1", "journal_ref": "", "doi": "", "comment": "118 pages, 9 sections, 4 appendices, 23 figures, 24 tables, 61 references", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 $E_6$의 27차원 표현에 의한 hyperplane arrangement와 $E_7$의 minuscule 포셋을 연구하는 표현론·대수기하 논문으로, McMullen 문제(convex position, oriented matroid realizability 등)와 직접적 관련이 없다.", "summary": "$E_6$의 27차원 minuscule 표현의 weights로 결정되는 dual fundamental Weyl chamber 내부의 restricted hyperplane arrangement $I(E_6,\\mathbf{27})$를 완전히 분류하여, 정확히 14개의 chamber와 18개의 extreme ray를 가지며 모든 chamber가 6차원 simplicial cone임을 증명한다. 또한 $E_7$의 minuscule $\\mathbf{56}$ 표현 내의 14원소 visible subposet의 Hasse diagram이 $E_6$ arrangement의 chamber 인접 그래프와 일치함을 보인다. 이를 통해 $E_7$의 구조가 $E_6$ arrangement의 국소적 wall architecture 전체를 부호화함을 밝힌다.", "technique": "Weyl group의 최소 길이 coset representative에 의한 simple-root label의 chamber별 transport(Weyl Transport)와 oriented matroid 기술, 특성다항식 계산.", "connections": "", "keyword_hits": ["oriented matroid"], "source": "filter"}, {"id": "2609.10257v1", "title": "An approximate counterexample to the Barker--Larman problem in dimension $4$", "authors": ["J. Haddad"], "abstract": "The Barker--Larman problem asks if a convex body $K \\subseteq \\mathbb R^n$ containing the Euclidean ball $\\mathbb B_n$, such that all the sections of $K$ by hyperplanes tangent to $\\mathbb B_n$ have constant $(n-1)$-dimensional volume, must necessarily be a Euclidean ball.   In this paper we show a result pointing to a negative answer in dimension $4$.   Taking $λ_0 = 4 \\sqrt{3}π$ and any $N \\in \\mathbb N$, we obtain the existence of a family of convex bodies $K_{λ,N}$ with $λ\\in (λ_0-r_N, λ_0 + r_N)$, such that the sections of $K_{λ,N}$ by hyperplanes tangent to the Euclidean ball, have area within $c |λ- λ_0|^{\\frac{N+1}2}$ of $λ$, while the difference between outradius and inradius of $K_{λ,N}$ is larger than $C |λ- λ_0|$.   The bodies $K_{λ,N}$ are constructed via radial functions as   \\[ρ_{K_{λ,N}}(t) = \\cos\\left( \\sum_{n=0}^N \\frac{(λ-λ_0)^n}{n!} \\varphi_n(t) \\right)^{-1},\\]   where $t \\in [0,2π), λ\\in \\mathbb R$ and $\\varphi_n$ are trigonometric polynomials that can be computed explicitly.   The convergence of the inner power series when $N \\to \\infty$ (which is left open) would imply a negative answer to the Barker--Larman problem in dimension $4$.   As an example we obtain a convex body whose outradius and inradius differ by more than $0.176$, and the area of the sections oscillate by less than $3 \\times 10^{-7}$.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-09T14:42:50+00:00", "updated": "2026-09-09T14:42:50+00:00", "abs_url": "http://arxiv.org/abs/2609.10257v1", "pdf_url": "https://arxiv.org/pdf/2609.10257v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Barker–Larman 문제(볼록체의 접선 단면 부피 조건)를 다루며, McMullen 문제·Larman 추측(점 배치·oriented matroid)과는 직접적인 관련이 없다.", "summary": "이 논문은 유클리드 구를 포함하는 볼록체 $K \\subseteq \\mathbb{R}^n$의 접선 초평면 단면 부피가 상수이면 $K$가 구여야 하는지를 묻는 Barker–Larman 문제에 대해, 차원 $4$에서 음의 답을 시사하는 결과를 제시한다. 구체적으로, $\\lambda_0 = 4\\sqrt{3}\\pi$ 근방에서 정의된 볼록체 족 $K_{\\lambda,N}$을 삼각 다항식 $\\varphi_n$으로 이루어진 방사 함수를 통해 구성하여, 단면 넓이의 변동은 $c|\\lambda-\\lambda_0|^{(N+1)/2}$로 극히 작지만 외접반지름과 내접반지름의 차이는 $C|\\lambda-\\lambda_0|$보다 크게 유지됨을 보인다. $N\\to\\infty$ 극한에서 내부 멱급수의 수렴(미해결)이 성립하면 차원 $4$에서 Barker–Larman 문제의 반례가 존재함을 의미한다.", "technique": "삼각 다항식 $\\varphi_n$으로 구성된 방사 함수 $\\rho_{K_{\\lambda,N}}(t) = \\cos\\!\\left(\\sum_{n=0}^N \\frac{(\\lambda-\\lambda_0)^n}{n!}\\varphi_n(t)\\right)^{-1}$를 이용한 볼록체의 명시적 구성.", "connections": "", "keyword_hits": ["larman"], "source": "filter"}, {"id": "2609.15178v1", "title": "Type C transpositions and strong marked tableaux", "authors": ["Yaozhou Fang", "Xing Gao"], "abstract": "Motivated by the Morse--Seelinger conjecture on type C $k$-Schur functions, we develop a permutation model for type C strong marked tableaux. Using type C transpositions, we give an explicit correspondence with the symmetric-core model that preserves the marking data. We also describe the induced affine Weyl group action on bounded partitions.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T08:00:55+00:00", "updated": "2026-09-14T08:00:55+00:00", "abs_url": "http://arxiv.org/abs/2609.15178v1", "pdf_url": "https://arxiv.org/pdf/2609.15178v1", "journal_ref": "", "doi": "", "comment": "26 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Type C Schur 함수와 marked tableaux는 조합론적 대상이지만, McMullen's problem의 convex polytope, oriented matroid, realizability와는 직접 관련이 없습니다.", "summary": "본 논문은 Morse-Seelinger 추측에 동기를 얻어 type C strong marked tableaux의 순열 모델을 개발합니다. Type C transposition을 이용하여 marking 데이터를 보존하는 symmetric-core 모델과의 명시적 대응을 제시하고, bounded partition에 유도되는 affine Weyl 군 작용을 기술합니다.", "technique": "Type C transposition을 이용한 순열 모델과 symmetric-core 모델 간의 전단사 대응 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.12372v1", "title": "4-Arc-Pancyclicity of Regular Multipartite Tournaments", "authors": ["Weihao Xia"], "abstract": "A multipartite tournament is an orientation of a complete multipartite graph. We prove that every $r$-regular $c$-partite tournament with common partite-set cardinality $α$ is $4$-arc-pancyclic whenever $c\\ge93$; that is, every arc belongs to a cycle of each length from $4$ to $cα$.   This confirms the conjecture of Zhou and Zhang for all sufficiently large $c$ and provides a multipartite analog of Alspach's arc-pancyclicity theorem. Moreover, we also give a construction to show that 4-arc-pancyclic is the best possible. Next, we prove that every arc belongs to at least $cα-α-1$ cycles of pairwise distinct lengths when $c\\ge7$ and $α\\ge2$. For regular $3$-partite tournaments with common partite-set cardinality $α\\ge2$, we obtain the sharp lower bound $α$, settling the remaining case of a conjecture of Xia, Cai, Guo, and Wang.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-11T02:42:13+00:00", "updated": "2026-09-11T02:42:13+00:00", "abs_url": "http://arxiv.org/abs/2609.12372v1", "pdf_url": "https://arxiv.org/pdf/2609.12372v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산 그래프 이론의 순환 구조 연구이나 McMullen의 문제(볼록위치 점 배치, oriented matroid, 실현 가능성)와는 직접적 관련이 없음.", "summary": "정규 다중 분할 토너먼트(regular multipartite tournaments)에서 모든 호(arc)가 길이 4부터 cα까지의 모든 사이클에 속하는 4-호-범순환(4-arc-pancyclicity) 성질을 증명함. c≥93일 때 이 성질이 성립함을 보이고 구성을 통해 4가 최적임을 보임.", "technique": "정규 토너먼트의 구조적 성질을 활용한 사이클 존재 증명; Zhou-Zhang 추측의 일반적 경우 해결", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15330v1", "title": "On Erdős Problem 767: Cycles with Chords", "authors": ["Xiaozheng Chen", "Bo Ning"], "abstract": "For integers $k\\ge 1$ and $n\\ge k+2$, let $g_k(n)$ be the maximum number of edges in an $n$-vertex graph containing no cycle with a vertex incident with at least $k$ chords. Erdős conjectured that $g_k(n)=(k+1)(n-k-1)$ for $n\\ge 2k+2$. Lewin found a counterexample. Bollobás later conjectured that there exists a function $n(k)$ such that $g_k(n)=(k+1)(n-k-1)$ for all $n\\ge n(k)$. Jiang confirmed this by proving the formula for all $n\\ge3k+3$ when $k\\ge1$. In this paper, we determine $g_k(n)$ completely. For all $k\\ge1$ and $n\\ge k+2$, we prove $g_k(n)=\\big\\{\\lfloor\\frac{(k+1)n}{2}\\rfloor,\\max\\{a(n-a)+\\lfloor\\frac{a(k+1-a)}{2}\\rfloor : a\\in\\mathbb Z,\\; \\lfloor {(k+1)}/{2}\\rfloor+1\\le a\\le k+1\\}\\big\\}$. For $k\\ge2$, we prove $g_k(n)=(k+1)(n-k-1)$ when $n\\ge \\lceil(5k+1)/2\\rceil$, and this threshold is sharp. Our proof builds on the method developed by Ma and the second author in [Ma and Ning, 2020].", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T10:18:43+00:00", "updated": "2026-09-14T10:18:43+00:00", "abs_url": "http://arxiv.org/abs/2609.15330v1", "pdf_url": "https://arxiv.org/pdf/2609.15330v1", "journal_ref": "", "doi": "", "comment": "22 pages, 2 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen's problem은 convex position의 점 배치와 oriented matroid 관련 이산기하학 문제이며, 본 논문은 그래프 이론의 극값 문제(Erdős Problem 767)로서 직접적 관련성이 없음.", "summary": "본 논문은 Erdős Problem 767을 완전히 해결하여 $g_k(n)$ (어떤 꼭짓점이 $k$개 이상의 현(chord)을 가진 사이클을 포함하지 않는 $n$-정점 그래프의 최대 간선 수)의 정확한 공식을 모든 $k\\ge1$, $n\\ge k+2$에 대해 결정했다. $k\\ge2$일 때 $n\\ge \\lceil(5k+1)/2\\rceil$에서 $g_k(n)=(k+1)(n-k-1)$이 성립하며 이 경계값은 예리(sharp)함을 증명했다.", "technique": "Ma and Ning의 방법론을 확장하여 극값 그래프 구조를 분석하고, 여러 경우로 나누어 상한(upper bound)과 하한(lower bound)을 정밀하게 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.10492v1", "title": "The Distribution of Double Deficiencies in Pattern-Avoiding Permutations", "authors": ["Tipaluck Krityakierne", "Thotsaporn Aek Thanatipanonda", "Doron Zeilberger"], "abstract": "We study the distribution of the number of double deficiencies (DD) in permutations of length n avoiding one or two patterns of length 3. Using structural decompositions of these avoidance classes--together with a lattice-path decomposition in the 321-avoiding case--we derive functional equations and convolution-type recurrences that efficiently compute the corresponding double-deficiency generating functions in all but one single-pattern case. In the 321-avoiding permutations, the resulting generating function is algebraic; we derive exact formulas for the mean and variance and prove that the distribution is close in total variation to Bin(n-2,1/4), with an explicit convergence rate. We also identify a DD-preserving symmetry that yields DD-Wilf equivalences, reducing the number of two-pattern cases that need to be considered separately. For the resulting two-pattern classes, we obtain explicit recurrences, including C-finite relations.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-09T17:31:25+00:00", "updated": "2026-09-09T17:31:25+00:00", "abs_url": "http://arxiv.org/abs/2609.10492v1", "pdf_url": "https://arxiv.org/pdf/2609.10492v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "패턴 회피 순열의 조합론적 성질을 연구하지만, McMullen's problem의 중심인 convex position, general position, oriented matroid, realizability와는 직접적 관련이 없음.", "summary": "길이 3인 한 개 또는 두 개의 패턴을 회피하는 순열에서 double deficiency의 분포를 연구합니다. 구조적 분해와 격자 경로 분해를 통해 함수 방정식과 점화식을 유도하며, 321-회피 순열의 경우 생성함수가 대수적임을 보이고 이항분포로의 수렴을 증명합니다.", "technique": "structural decomposition, lattice-path decomposition, functional equations, C-finite recurrences", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15414v1", "title": "Large Complete Minors from a Cheeger Condition", "authors": ["Chengli Li", "Leyou Xu", "Bo Zhou"], "abstract": "Let $G$ be a graph on $n$ vertices, and let $e_G(S,V(G)\\setminus S)$ be the number of edges with exactly one endpoint in $S$. The Cheeger constant and the restricted Cheeger constant of $G$, where $k\\ge1$ is real, are, respectively, \\[   h(G)=\\min_{\\substack{\\emptyset\\ne S\\subseteq V(G)\\\\|S|\\le \\frac{n}{2}}}   \\frac{e_G(S,V(G)\\setminus S)}{|S|}   \\text{ and }   h_k(G)=\\min_{\\substack{\\emptyset\\ne S\\subseteq V(G)   |S|\\le\\min\\{k,\\frac{n}{2}\\}}}   \\frac{e_G(S,V(G)\\setminus S)}{|S|}. \\] The contraction clique number $\\ccl(G)$ is the largest integer $r$ such that $G$ contains the complete graph $K_r$ as a minor. Krivelevich and Nenadov [Complete minors in graphs without sparse cuts, Int. Math. Res. Not. IMRN 12 (2021) 8996--9015] proved that, for every fixed $\\eps>0$ and all sufficiently large $n$ and $d$, if $G$ is a graph on $n$ vertices with maximum degree at most $d$, then $h(G)\\ge\\eps d$ and $h_{\\eps n}(G)\\ge(\\frac{1}{2}+\\eps)d$ imply $\\ccl(G)=Ω_\\eps(\\sqrt{\\frac{nd}{\\log d}})$. They asked to determine if one can guarantee the same lower bound on $\\ccl(G)$ without the additional condition on $h_{\\eps n}(G)$. They showed that this is the case when $d$ is a constant. We answer this question affirmatively. For every $\\eps>0$, there are constants $β=β(\\eps)>0$ and $n_0=n_0(\\eps)$ such that, whenever $d\\ge 3$ is an integer, for every graph $G$ with $n\\ge n_0$ vertices and maximum degree at most $d$, if $h(G)\\ge\\eps d$, then $\\ccl(G)\\geβ\\sqrt{\\frac{nd}{\\log d}}$. The dependence of this lower bound on $n$ and $d$ is best possible up to a constant factor. As a corollary, a lower bound is derived for the contraction clique number of $d$-regular graphs for which the second largest eigenvalue is bounded away from $d$, compared to earlier $\\frac{d}{2}$. The proof combines spectral properties of graphs with an analysis of lazy random walks.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T11:41:22+00:00", "updated": "2026-09-14T11:41:22+00:00", "abs_url": "http://arxiv.org/abs/2609.15414v1", "pdf_url": "https://arxiv.org/pdf/2609.15414v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프의 Cheeger 조건에서 완전 마이너(complete minor)의 크기를 보장하는 문제로, McMullen's problem(볼록위치의 점 배치와 oriented matroid의 구조)과는 직접 관련성이 없음.", "summary": "본 논문은 그래프 $G$의 Cheeger 상수 $h(G) \\ge \\eps d$라는 조건만으로도 축약 clique 수 $\\ccl(G) = \\Omega(\\sqrt{nd/\\log d})$를 보장할 수 있음을 증명한다. Krivelevich–Nenadov의 미해결 질문에 긍정적으로 답하며, spectral 성질과 lazy random walk 분석을 결합한다.", "technique": "그래프의 spectral 성질과 lazy random walk 분석을 통한 markov chain 기법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.09638v1", "title": "The mean distance to a simple closed curve on the sphere", "authors": ["J. V. M. Pimentel"], "abstract": "Kimberling's Problem 10 asks for a simple closed curve of prescribed length $L$ (in particular, $L=4π$) on the unit sphere minimizing the mean geodesic distance $\\mathcal{J}$ from a point of the sphere to the curve. For a positive integer $n$, put $\\vartheta_{n}=π/(2n)$ and $L_{n}=2π/\\sin\\vartheta_{n}$. We show that the minimum of $\\mathcal{J}$ over rectifiable simple closed curves of length at most $L_{n}$ equals $\\vartheta_{n}-\\tan(\\vartheta_{n}/2)$, that it is attained only by curves of length exactly $L_{n}$, and that the sphere-filling ropes $β^{n,k}$ of Gerlach and von der Mosel attain it. Kimberling's case is $n=3$: at $L=4π$ the minimum is $π/6+\\sqrt{3}-2=0.255649\\ldots$, attained by an explicit six-arc curve and by its mirror image. For $L\\le2π$ we determine $J(L)$, the infimum of $\\mathcal{J}$ over curves of length $L$, exactly: it equals $π/2-L/(2π)$, attained precisely by the circles of length $L$. At the lengths $L_{n}$ we do not classify all minimizers, but show that every one of them bisects the sphere into two disks of area $2π$ and inradius $\\vartheta_{n}$ whose inward collars have the largest possible area at every depth. The great circle is the only minimizer for $n=1$, and the $β^{n,k}$ are, up to congruence, the only ones of thickness at least $\\sin\\vartheta_{n}$. For arbitrary $L$ the function $J$ is nonincreasing, and together with the above this brackets it between two explicit values.", "categories": ["math.MG", "math.DG"], "primary_category": "math.MG", "published": "2026-09-09T02:54:53+00:00", "updated": "2026-09-09T02:54:53+00:00", "abs_url": "http://arxiv.org/abs/2609.09638v1", "pdf_url": "https://arxiv.org/pdf/2609.09638v1", "journal_ref": "", "doi": "", "comment": "10 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Kimberling's problem은 구 위의 곡선 최적화이며, McMullen 문제의 볼록 위치와 점 배치는 무관.", "summary": "단위구 위의 단순 폐곡선에서 구의 한 점까지의 평균 측지선 거리를 최소화하는 Kimberling 문제 10을 해결한다. 길이 $L_n = 2\\pi/\\sin(\\pi/(2n))$인 곡선에 대해, 최소값이 정확히 $\\vartheta_n - \\tan(\\vartheta_n/2)$ (단, $\\vartheta_n = \\pi/(2n)$)이며 Gerlach–von der Mosel의 sphere-filling ropes에 의해 달성됨을 보인다.", "technique": "측지선 거리의 변분 최소화 및 곡선의 두께(thickness) 제약 조건을 이용한 기하학적 특성 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.16388v1", "title": "A doubling Loewner sphere that is not a quasisphere", "authors": ["Matthew Romney"], "abstract": "We construct a metric 2-sphere of finite Hausdorff 2-measure that is doubling, linearly locally connected and Loewner but cannot be mapped to the standard sphere by a quasisymmetric mapping. Our result gives a negative answer to a question of Ntalampekos.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-14T21:54:00+00:00", "updated": "2026-09-14T21:54:00+00:00", "abs_url": "http://arxiv.org/abs/2609.16388v1", "pdf_url": "https://arxiv.org/pdf/2609.16388v1", "journal_ref": "", "doi": "", "comment": "15 pages, 2 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "메트릭 기하학과 위상 문제로, McMullen's problem의 이산·조합 기하 관심사와는 직접 연관 없음.", "summary": "유한 Hausdorff 2-측도를 갖는 doubling, linearly locally connected, Loewner 메트릭 2-구면을 구성하되, 표준 구면으로의 quasisymmetric 사상이 불가능함을 보인다. Ntalampekos의 질문에 부정적 답변을 제시한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.13972v1", "title": "Large solution-free sets via combinatorial degenerations", "authors": ["Paul Hametner", "Jozsef Solymosi"], "abstract": "Consider the linear form $L(x,y,z,w) = 3x+y-2z-2w$. For a positive integer $N$, denote by $r_L(N)$ the largest size of a subset of $\\{1,2,\\dots,N\\}$ that avoids nontrivial solutions to $L = 0$. We show that $r_L(N) = Ω(N^{0.5608687})$, improving the lower bound for Problem 16 in Green's list of open problems. Our proof uses the method of combinatorial degenerations to turn a finite certificate into large solution-free sets. In fact, we can improve Ruzsa's lower bound of $N^{1/2-o(1)}$ for many four-variable equations. Consider $L(x,y,z,w) = ax+by-cz-dw$ with $a,b,c,d\\in \\mathbb Z_{>0}$, $a+b=c+d$, $\\{a,b\\} \\neq \\{c,d\\}$ and $abcd$ not a square. We show that there is $\\varepsilon_L > 0$ such that $r_L(N) = Ω_L(N^{1/2 + \\varepsilon_L})$. Furthermore, we show that for primitive translation-invariant linear forms $L$ in $s$ variables, the lower bound $Ω_s(N^{1/(s-1)})$ coming from a greedy construction is never optimal.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-12T14:40:50+00:00", "updated": "2026-09-12T14:40:50+00:00", "abs_url": "http://arxiv.org/abs/2609.13972v1", "pdf_url": "https://arxiv.org/pdf/2609.13972v1", "journal_ref": "", "doi": "", "comment": "11 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 가법조합론(additive combinatorics)의 선형형식 회피 문제로, McMullen's problem(볼록다면체의 면의 개수)과는 직접적인 연관이 없음.", "summary": "선형형식 $L(x,y,z,w) = 3x+y-2z-2w$에 대해, 자명하지 않은 해를 피하는 $\\{1,2,\\dots,N\\}$의 최대 부분집합 크기 $r_L(N)$에 대해 $\\Omega(N^{0.5608687})$의 하한을 도출하였다. 조합 퇴화(combinatorial degenerations) 방법을 사용하여 유한 증명서를 큰 해-회피 집합으로 변환하고, 일반적인 네 변수 방정식에서 Ruzsa의 하한을 개선한다.", "technique": "Combinatorial degenerations을 이용하여 유한 조합 구조로부터 해-회피 집합을 구성하는 방법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.09715v1", "title": "NP-Hardness of the $H$-Free Edge-Deletion Problem", "authors": ["Lior Gishboliner", "Ethan Honest"], "abstract": "For a graph $H$, the $H$-freeness edge-deletion problem is the algorithmic problem of finding, for an input graph $G$, the minimum number of edges of $G$ whose deletion turns $G$ into an $H$-free graph. We show that for every graph $H$ containing a cycle, this problem is NP-hard. This proves a conjecture of Gishboliner, Levanzov and Shapira, and completes the characterization of the complexity of the $H$-freeness edge-deletion problem, answering a question of Alon, Shapira and Sudakov.", "categories": ["math.CO", "cs.CC"], "primary_category": "math.CO", "published": "2026-09-09T04:56:04+00:00", "updated": "2026-09-09T04:56:04+00:00", "abs_url": "http://arxiv.org/abs/2609.09715v1", "pdf_url": "https://arxiv.org/pdf/2609.09715v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 이론의 알고리즘 복잡성 문제로, 이산기하학·조합론의 McMullen 문제(convex position, oriented matroid, polyhedral 구조)와 직접 관련성 없음.", "summary": "모든 사이클을 포함하는 그래프 $H$에 대해, $H$-freeness edge-deletion 문제(입력 그래프에서 최소 간선 개수를 삭제하여 $H$-free 그래프로 만드는 문제)가 NP-hard임을 증명했다. 이는 Gishboliner–Levanzov–Shapira의 추측을 증명하고, Alon–Shapira–Sudakov 문제에 대한 복잡도 완전 특성화를 완성한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15016v1", "title": "Spherical $t$-Designs on $\\mathbb S^2$ with $54t^2$ Points", "authors": ["Zhiqiang Xu", "Zili Xu"], "abstract": "We prove that, for every integer $t\\geq 1$, the unit two-sphere admits a spherical $t$-design consisting of exactly $54t^2$ points. More generally, such a design exists with exactly $6q^2$ points for every integer $q\\geq 3t$. The proof builds on the topological degree method of Bondarenko, Radchenko and Viazovska, using an explicit equal-area partition of the sphere based on the map of Roşca and Plonka. By choosing the cell centers to minimize the average squared geodesic distance and deriving sharper sampling estimates, we obtain the stated quadratic bound on the size of spherical $t$-designs on $\\Sph$.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-09-14T04:28:44+00:00", "updated": "2026-09-14T04:28:44+00:00", "abs_url": "http://arxiv.org/abs/2609.15016v1", "pdf_url": "https://arxiv.org/pdf/2609.15016v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "구면 디자인(spherical t-design)은 조합기하학의 고전적 문제이지만, McMullen's problem의 고차원 convex position 점 배치나 oriented matroid 구조와는 직접적 관련이 없음.", "summary": "2차원 구 $\\mathbb{S}^2$ 위의 spherical $t$-design이 정확히 $54t^2$개 점으로 존재함을 증명한다. 더 일반적으로 모든 정수 $q \\geq 3t$에 대해 $6q^2$개 점으로 디자인을 구성할 수 있다.", "technique": "Bondarenko-Radchenko-Viazovska의 위상차수 방법(topological degree method)과 Roşca-Plonka 등적분할(equal-area partition)을 결합하여, 측지거리 평균 제곱값을 최소화하는 셀 중심 선택과 샘플링 추정.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.10403v1", "title": "Hyperbolic distance matrix completion", "authors": ["Mihai Putinar", "Prateek Kumar Vishwakarma"], "abstract": "A completion theory for hyperbolic distance data is developed at the interface of matrix analysis, graph theory, and hyperbolic geometry. Krein's characterization of the metric space embeddability in Lobachevsky space leads to a natural anchoring procedure that transforms the indefinite data into a positive semidefinite kernel. In analogy with positive semidefinite and Euclidean distance matrix completion, chordality of the specification graph is shown to be the necessary and sufficient condition for local Lorentz-Gram data to admit global completion. Existence is complemented by explicit constructions. For trees, we obtain geodesic-rectification and product-distance completions; for chordal graphs, the latter extends to matrix-valued transfers along clique-trees. The resulting canonical completion is characterized by sparsity of its inverse and by a maximum-absolute-determinant principle. Its metric distortion exhibits a sharp dichotomy governed by clique separator size. Applications to exact recovery from sparse hyperbolic measurements and to hierarchical and phylogenetic data are developed.", "categories": ["math.MG", "math.CO", "math.RA"], "primary_category": "math.MG", "published": "2026-09-09T16:23:31+00:00", "updated": "2026-09-09T16:23:31+00:00", "abs_url": "http://arxiv.org/abs/2609.10403v1", "pdf_url": "https://arxiv.org/pdf/2609.10403v1", "journal_ref": "", "doi": "", "comment": "62 pages, 9 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "쌍곡기하학 거리 행렬 완성 이론으로, McMullen's problem의 볼록 위치·배치·oriented matroid 관련 문제와 직접 연관 없음.", "summary": "쌍곡공간 거리 데이터 완성 이론을 전개하며, Krein의 특성화와 Lorentz-Gram 핵을 통해 indefinite 데이터를 양반정부호 커널로 변환함. 그래프 현성(chordality)이 전역 완성의 필요충분조건임을 보이고, 트리와 현성 그래프에 대해 명시적 구성을 제시함.", "technique": "Krein의 Lobachevsky 공간 임베딩 특성화, Lorentz-Gram 데이터, 현성 그래프 위의 clique-tree 분해, 최대절댓값 행렬식 원리.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15873v1", "title": "Local measures of interval edge-uncolorability", "authors": ["Carl Johan Casselgren", "Petros A. Petrosyan"], "abstract": "An interval edge coloring of a graph is a proper edge coloring by integers such that the colors on the edges incident with any vertex form an interval of integers. Not all graphs are interval colorable; a simple counterexample is $K_3$.   The (interval coloring) deficiency of a graph $G$ is the minimum number of pendant edges whose addition to $G$ yields a graph with an interval edge coloring. In this paper, we introduce and study further measures of how far from being interval colorable a graph is. The local deficiency of a graph $G$ is the smallest number of pendant edges that needs to be added at every vertex of $G$ in order to obtain a graph with an interval edge coloring; we can think of the colors of these added edges as ''locally missing'' at a vertex. We also study a weaker version of this notion, the weak local deficiency, which informally is the size of a largest set of consecutive integers ''locally missing'' at a vertex in a proper edge coloring of $G$ minimizing this size.   We compare weak local deficiency, local deficiency, and deficiency, and show that the difference can be arbitrarily large in both cases. Moreover, we give concrete examples of graphs whose weak local deficiency (and thus local deficiency) grows with the number of vertices as well as with the maximum degree. We also prove some constructive results on graphs with small weak local deficiency. In particular, all complete multipartite graphs have weak local deficiency at most $2$, and many complete multipartite graphs have weak local deficiency at most $1$. Moreover, bipartite graphs with maximum degree at most $6$, and Eulerian bipartite graphs with maximum degree at most $8$ both have weak local deficiency at most $1$. We conclude the paper by pointing to several open questions for further research.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T16:59:59+00:00", "updated": "2026-09-14T16:59:59+00:00", "abs_url": "http://arxiv.org/abs/2609.15873v1", "pdf_url": "https://arxiv.org/pdf/2609.15873v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Interval edge coloring은 그래프 색칠 문제로, McMullen's problem의 볼록 위치와 점 배치 관련 기하학적 조합론과는 직접적 관련이 없음.", "summary": "본 논문은 그래프의 interval edge coloring 가능성으로부터의 거리를 측정하는 새로운 지표들(local deficiency, weak local deficiency)을 도입하고 연구한다. 완전 다중분할 그래프, 이분 그래프 등 특정 그래프 족에 대한 이들 지표의 상한을 증명하며, 세 가지 결함 측도 간의 비교 결과를 제시한다.", "technique": "그래프의 proper edge coloring과 interval 제약 조건을 활용한 펀던트 엣지 추가의 최소성 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.09873v1", "title": "Boundedness and Separation Between Induced and Non-Induced Covering Numbers", "authors": ["Miriam Goetze", "Yidi Zang"], "abstract": "There are four covering numbers $\\mathrm{c}_g^{\\mathcal{G}}(H),\\mathrm{c}_u^{\\mathcal{G}}(H),\\mathrm{c}_l^{\\mathcal{G}}(H),\\mathrm{c}_f^{\\mathcal{G}}(H)$, each of which measures in a slightly different way how well the edges of a graph $H$ (called a host) can be covered with graphs of a class $\\mathcal{G}$ (called a guest class). If we require the graphs of $\\mathcal{G}$ to correspond to induced subgraphs of $H$, we obtain an induced variant $\\mathrm{ic}_x^{\\mathcal{G}}$ for each covering number $\\mathrm{c}_x^{\\mathcal{G}}$ which satisfies $\\mathrm{c}_x^{\\mathcal{G}}(H) \\leq \\mathrm{ic}_x^{\\mathcal{G}}(H)$ for every graph $H$. Yet, in general $\\mathrm{ic}_x^{\\mathcal{G}}$ cannot be bounded in terms of $\\mathrm{c}_x^{\\mathcal{G}}$. If there exists for a guest class $\\mathcal{G}$ and a host class $\\mathcal{H}$ a function $f$ such that $\\mathrm{ic}_x^{\\mathcal{G}}(H) \\leq f(\\mathrm{c}_x^{\\mathcal{G}}(H))$ for every graph $H \\in \\mathcal{H}$, we call $f$ a binding function.   Within this work, we study for which structural properties of a guest class $\\mathcal{G}$ and a host class $\\mathcal{H}$ such binding functions exist. We consider guest classes $\\mathcal{G}$ that are monotone, hereditary, component-closed or neither, and have bounded maximum average degree, bounded chromatic number or neither. The host classes $\\mathcal{H}$ we consider have bounded treewidth, exclude some minor, have bounded maximum average degree, bounded chromatic number, or none of these properties. For $219$ out of the $240$ possible $3$-tuples of properties for $\\mathcal{G}$ and $\\mathcal{H}$ and covering numbers we either provide a binding function or an example where no such function exists. In particular, we show that such binding functions always exist for hereditary guest classes $\\mathcal{G}$ of bounded maximum average degree for three of the four covering numbers, but may not for the fourth kind.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-09T08:27:48+00:00", "updated": "2026-09-09T08:27:48+00:00", "abs_url": "http://arxiv.org/abs/2609.09873v1", "pdf_url": "https://arxiv.org/pdf/2609.09873v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 covering number와 induced subgraph 문제는 조합론적이지만, McMullen's problem(점 배치, convex position, oriented matroid, 기하학적 구조)과는 직접적 관련이 없음.", "summary": "본 논문은 그래프 호스트 H의 엣지를 게스트 클래스 G의 그래프로 커버하는 네 가지 covering number와 그 induced 변형 사이의 관계를 연구한다. 특정 구조적 성질을 가진 게스트/호스트 클래스 쌍에 대해 binding function이 존재하는 조건을 240개 경우 중 219개에서 결정한다.", "technique": "게스트 클래스의 단조성(monotone), 유전성(hereditary), 연결성 폐쇄(component-closed)와 호스트 클래스의 treewidth, minor-exclusion, 평균 차수/색수 제한 등 구조적 성질의 체계적 분류와 케이스 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.12780v1", "title": "A 4AP-free permutation of the positive integers", "authors": ["Boon Suan Ho"], "abstract": "We construct a permutation of the positive integers containing no four-term arithmetic progression as a subsequence.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-11T12:33:11+00:00", "updated": "2026-09-11T12:33:11+00:00", "abs_url": "http://arxiv.org/abs/2609.12780v1", "pdf_url": "https://arxiv.org/pdf/2609.12780v1", "journal_ref": "", "doi": "", "comment": "5 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "산술 진행(arithmetic progression)을 피하는 순열 구성은 McMullen's problem의 convex position, general position 점 배치나 oriented matroid의 조합 구조와 본질적 관계가 없음.", "summary": "양의 정수의 순열 중에서 부분수열로 4-항 산술 진행(4AP)을 포함하지 않는 것을 구성한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15690v1", "title": "Laurent Symmetric Functions", "authors": ["Hugo Fernández", "Elena Kleinwort", "Tianze Li", "Mario Torres-Danta"], "abstract": "We describe the ring of Laurent symmetric polynomials in terms of generators and relations, giving an analogue of the Fundamental Theorem of Symmetric Polynomials. We extend the Hall inner product, and give an algebraic proof that the Laurent Schur polynomials form an orthonormal basis of this ring. In the case of infinitely many variables, we realize the ring of Laurent symmetric functions as a direct limit of inverse limits, and relate them to characters of rational and algebraic representations of general linear groups.", "categories": ["math.CO", "math.RA", "math.RT"], "primary_category": "math.CO", "published": "2026-09-14T14:58:06+00:00", "updated": "2026-09-14T14:58:06+00:00", "abs_url": "http://arxiv.org/abs/2609.15690v1", "pdf_url": "https://arxiv.org/pdf/2609.15690v1", "journal_ref": "", "doi": "", "comment": "36 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Laurent 대칭함수의 대수 구조 연구로, McMullen's problem이 요구하는 점 배치·조합 기하학과는 직접 관련 없음.", "summary": "Laurent 대칭다항식의 환을 생성원과 관계식으로 기술하며, 대칭다항식의 기본정리의 유사체를 제시한다. Hall 내적을 확장하고 Laurent Schur 다항식이 정규직교 기저를 이루는 것을 대수적으로 증명하며, 무한히 많은 변수의 경우 일반선형군의 유리 및 대수 표현의 지표와 연결한다.", "technique": "생성원-관계식 표현(generators and relations), Hall 내적 확장, 직극한과 역극한을 이용한 실현(direct and inverse limits)", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.12009v1", "title": "A Proof of the Tratnik-Ye Medianity Conjecture of Resonance Graphs on Surfaces", "authors": ["Guangfu Wang", "Ke Kang"], "abstract": "We prove the Tratnik--Ye conjecture that every connected component of a resonance graph of perfect matchings on a closed surface is median whenever the allowed even faces form a proper subset of all faces. The embedding need not be cellular or strong, and the graph need not be bipartite. We also show that the quotient associated with each face is a tree and that these quotients give an isometric embedding of each component into a Cartesian product of trees. This yields a criterion for the facial parity embedding into a hypercube to be isometric.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-10T04:55:36+00:00", "updated": "2026-09-10T04:55:36+00:00", "abs_url": "http://arxiv.org/abs/2609.12009v1", "pdf_url": "https://arxiv.org/pdf/2609.12009v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "완벽 매칭의 조합론적 구조와 기하학적 embedding을 다루지만, McMullen's problem(볼록 위치의 점 배치, oriented matroid, tope graph)과의 직접적 연관성이 없음.", "summary": "본 논문은 Tratnik-Ye conjecture를 증명하여, 닫힌 곡면 위의 완벽 매칭 resonance graph의 모든 연결 성분이 median graph임을 보인다. 특히 면의 부분집합이 proper일 때 이것이 성립하며, 각 성분을 tree들의 Cartesian product로 isometric embedding할 수 있음을 제시한다.", "technique": "resonance graph의 각 면에 associated한 quotient이 tree임을 이용한 isometric embedding 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.18331v1", "title": "Regular dyadic triangulations of delta-matroid polytopes", "authors": ["Mathieu Vallée"], "abstract": "Backman and Liu proved that every integral generalized permutohedron of type $A$, and in particular every matroid base polytope, admits a regular unimodular triangulation. The analogous statement fails in type $B$: the delta-matroid simplex \\[\\operatorname*{conv}\\{\\mathbf{0},\\ e_1+e_2,\\ e_1+e_3,\\ e_2+e_3\\}\\] has normalized volume $2$ and no lattice points other than its vertices, so it has no unimodular triangulation. We show moreover that, up to the natural symmetries of the $0/1$ cube and deletion of constant coordinates, it is the unique non-unimodular delta-matroid polytope that is a simplex. We prove instead that every delta-matroid polytope admits a regular dyadic triangulation, meaning a lattice triangulation whose maximal simplices have normalized volumes that are powers of two. More generally, every integral type $B$ generalized permutohedron admits such a triangulation. The main lattice-theoretic ingredient is that the type $B$ root configuration forms a totally dyadic system, a $2$-local analogue of total unimodularity. As a consequence, these polytopes satisfy a dyadic version of the integer decomposition property. In each dimension the corresponding exponent can be chosen uniformly, even though ordinary integer decomposition can fail for delta-matroid polytopes.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-09-16T08:55:15+00:00", "updated": "2026-09-16T08:55:15+00:00", "abs_url": "http://arxiv.org/abs/2609.18331v1", "pdf_url": "https://arxiv.org/pdf/2609.18331v1", "journal_ref": "", "doi": "", "comment": "12 pages, comments are welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 delta-matroid polytope의 삼각분할(triangulation)을 다루며, McMullen 문제나 Larman 추측과는 직접적인 관련이 없다.", "summary": "Backman과 Liu의 type $A$ 결과(모든 적분 일반화 순열다면체는 regular unimodular triangulation을 가짐)와 달리, type $B$에서는 unimodular triangulation이 존재하지 않는 delta-matroid polytope가 있음을 보인다. 대신 모든 delta-matroid polytope(더 일반적으로 모든 적분 type $B$ generalized permutohedron)는 최대 단체(simplex)의 정규화 부피가 2의 거듭제곱인 regular dyadic triangulation을 가짐을 증명한다. 핵심 격자론적 도구는 type $B$ 근(root) 구성이 total unimodularity의 $2$-국소 유사체인 totally dyadic system을 형성한다는 것이다.", "technique": "Type $B$ root configuration의 totally dyadic system 구조를 이용하여 regular dyadic triangulation의 존재를 증명하고, dyadic integer decomposition property를 도출한다.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.19938v1", "title": "The face lattice of any simplicial polytope is Hamiltonian", "authors": ["Robert Lauff"], "abstract": "We show that the face lattice of any simplicial polytope is Hamiltonian. This proves a major part of a recent conjecture by \\citeauthor{Listingfaces} which states that the face lattice of any polytope is Hamiltonian (SODA26). We use a line shelling in both directions to obtain two different decompositions of the face lattice into disjoint cubes, which allows the application of a theorem by Gregor to obtain the Hamilton cycle.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T09:11:04+00:00", "updated": "2026-09-17T09:11:04+00:00", "abs_url": "http://arxiv.org/abs/2609.19938v1", "pdf_url": "https://arxiv.org/pdf/2609.19938v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 단순 다면체(simplicial polytope)의 면 격자(face lattice)의 해밀턴 순환(Hamilton cycle) 존재를 다루며, McMullen 문제나 Larman 추측과는 직접적인 관련이 없다.", "summary": "이 논문은 임의의 단순 다면체(simplicial polytope)의 면 격자(face lattice)가 해밀턴(Hamiltonian)임을 증명한다. 이는 임의의 다면체(polytope)의 면 격자가 해밀턴이라는 SODA26의 최근 추측(Listingfaces)의 주요 부분을 해결한다. 증명은 두 방향에서의 선 껍질화(line shelling)를 이용해 면 격자를 서로소인 큐브(disjoint cubes)들로 분해한 후 Gregor의 정리를 적용하는 방식으로 이루어진다.", "technique": "두 방향의 선 껍질화(line shelling in both directions)로 면 격자를 서로소인 큐브들로 분해하고, Gregor의 정리를 적용하여 해밀턴 순환(Hamilton cycle)을 구성한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.19703v1", "title": "On integral polytopes related to Edmonds' problem", "authors": ["Hiroshi Hirai"], "abstract": "In this paper, we study polyhedral aspects on commutative and noncommutative Edmonds' problems for computing the rank of linear symbolic matrix $A = \\sum_{k=1}^m A_k x_k$. We regard them as linear optimization over integral polytopes ${\\cal P}(A)$ and ${\\cal Q}(A)$, respectively, which are obtained by the convex hulls of exponent vectors of subdeterminants of~$A$ and its blow-ups $A^{\\{d\\}} = \\sum_{k=1}^m A_k \\otimes X_k$ $(d=1,2,\\ldots)$. By extending previously known results on nc-rank, we establish a hierarchy of integral polytopes ${\\cal P}(A) \\subseteq {\\cal P}^{\\leq 2}(A) \\subseteq {\\cal P}^{\\leq 3}(A) \\subseteq \\cdots = {\\cal Q}(A)$ and show that the integrality gap of ${\\cal Q}(A)$ relative to ${\\cal P}(A)$ is at least $1/2$. Further, we show that if each $A_k$ is rank-2 skew-symmetric, then the above hierarchy terminates at the second level and the integrality gap is improved to $2/3$.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-09-17T04:57:10+00:00", "updated": "2026-09-17T04:57:10+00:00", "abs_url": "http://arxiv.org/abs/2609.19703v1", "pdf_url": "https://arxiv.org/pdf/2609.19703v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 선형 기호 행렬의 랭크 계산(Edmonds 문제)과 관련된 적분 다면체(integral polytopes)를 연구하며, McMullen의 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "이 논문은 가환·비가환 Edmonds 문제를 선형 기호 행렬 $A = \\sum_{k=1}^m A_k x_k$의 서브행렬식(subdeterminant) 지수 벡터의 볼록 껍질로 정의되는 적분 다면체 $\\mathcal{P}(A)$, $\\mathcal{Q}(A)$ 위의 선형 최적화 문제로 다룬다. 다면체들의 계층 구조 $\\mathcal{P}(A) \\subseteq \\mathcal{P}^{\\leq 2}(A) \\subseteq \\cdots = \\mathcal{Q}(A)$를 확립하고, $\\mathcal{Q}(A)$의 $\\mathcal{P}(A)$에 대한 integrality gap이 최소 $1/2$임을 증명한다. 또한 각 $A_k$가 rank-2 반대칭(skew-symmetric) 행렬이면 계층이 두 번째 레벨에서 종료되고 integrality gap이 $2/3$으로 개선됨을 보인다.", "technique": "nc-rank에 관한 기존 결과를 확장하여 blow-up $A^{\\{d\\}} = \\sum_{k=1}^m A_k \\otimes X_k$의 서브행렬식 지수 벡터를 이용한 적분 다면체 계층 구조 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.19540v1", "title": "Peeling sequences: a directional method for the three-block construction", "authors": ["Dániel Gábor Simon"], "abstract": "A \\emph{peeling sequence} of a finite planar point set is an ordering of point removals, in which   each point is a vertex of the convex hull of the points not yet removed. Write $g(S)$ for the number of such sequences, and $g(n)$ for the minimum of $g(S)$ over $n$-point sets in general position. We present a method which can be used to prove better upper bounds on the previously analysed recursive 3-branch constructions $S_n$. In fact, we prove $g(n)\\leq g(S_n)=O(6.57^n)$, using directional restrictions and a weighted prefix-tree argument.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T01:05:08+00:00", "updated": "2026-09-17T01:05:08+00:00", "abs_url": "http://arxiv.org/abs/2609.19540v1", "pdf_url": "https://arxiv.org/pdf/2609.19540v1", "journal_ref": "", "doi": "", "comment": "14 pages, 7 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 점집합의 convex hull peeling sequence 수의 상한을 다루며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "유한 평면 점집합의 'peeling sequence'(각 단계에서 convex hull의 꼭짓점을 제거하는 순서)의 수 $g(S)$를 분석하며, $n$점 일반 위치 집합에 대한 최솟값 $g(n)$의 상한을 연구한다. 기존의 재귀적 3-분기 구성 $S_n$에 대해 방향성 제한(directional restriction)과 가중 전위 트리(weighted prefix-tree) 논증을 활용하여 $g(n) \\leq g(S_n) = O(6.57^n)$임을 증명한다.", "technique": "방향성 제한(directional restrictions)과 가중 전위 트리(weighted prefix-tree) 논증을 결합한 상한 증명 방법.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2609.18611v1", "title": "An inequality for the number of independent sets of matroids with an application to the forest-tree ratio of graphs", "authors": ["Ferenc Bencs", "Péter Csikvári"], "abstract": "Let $M=(E,\\mathcal{I})$ be a matroid of rank $r$. Let $\\mathcal{I}_k$ be the independent sets of size $k$, and let $I_k=|\\mathcal{I}_k|$ and $I=|\\mathcal{I}|$. We show that if every set $F\\in \\mathcal{I}_{r-1}$ is contained in at least $δ$ bases, then $$\\ln \\left(\\frac{I}{I_r}\\right)\\geqslant \\frac{I_{r-1}}{I_r}\\cdot δ\\ln \\left(1+\\frac{1}δ\\right).$$ In particular, we have $$\\frac{I}{I_r}\\geqslant 2^{I_{r-1}/I_r}.$$ By combining this result with several other ideas, we prove that if $G$ is a simple connected graph on $n$ vertices, and $F(G)$ and $T(G)$ denote its numbers of spanning forests and spanning trees, respectively, then $$\\frac{F(G)}{T(G)}\\geqslant \\frac{F(K_n)}{T(K_n)},$$ where $K_n$ is the complete graph on $n$ vertices. Equality holds if and only if $G=K_n$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-16T13:02:03+00:00", "updated": "2026-09-16T13:02:03+00:00", "abs_url": "http://arxiv.org/abs/2609.18611v1", "pdf_url": "https://arxiv.org/pdf/2609.18611v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Matroid의 independent set에 대한 부등식을 다루지만 McMullen's problem(convex position, oriented matroid의 acyclic reorientation, tope graph 등)과는 직접 관련이 없음.", "summary": "Matroid $M$의 rank $r-1$ independent set이 충분히 많은 basis에 포함될 때, 전체 independent set 개수와 rank $r$ independent set 개수(basis)의 비에 대한 부등식을 증명. 이를 응용하여 임의 connected graph에서 spanning forest와 spanning tree 개수의 비가 complete graph에서 최소임을 보임.", "technique": "Matroid의 independent set 크기에 대한 조합론적 부등식과 logarithmic convexity 논증을 결합하여 graph의 forest-tree ratio에 대한 최소화 결과 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.20030v1", "title": "Switching graphs and designs", "authors": ["Aida Abiad", "Dean Crnković", "Louka Peters", "Andrea Švob"], "abstract": "Switching methods can be seen as certain local transformations that do not alter their basic parameters of a combinatorial structure. Efforts have been devoted in the literature to relate and unify the switching theories for codes and designs, and also for Hadamard matrices and graphs. The combinatorial structures we consider in this paper are graphs and designs. We show an extension of known switching method for constructing 2-designs to divisible designs, and then provide some examples of its application. Moreover, we prove several equivalences between switching methods for graphs and designs, and as a byproduct, we obtain a new switching method to obtain 2-designs.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T10:36:35+00:00", "updated": "2026-09-17T10:36:35+00:00", "abs_url": "http://arxiv.org/abs/2609.20030v1", "pdf_url": "https://arxiv.org/pdf/2609.20030v1", "journal_ref": "", "doi": "", "comment": "20 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Switching methods for graphs and designs는 조합 구조의 국소 변환을 다루지만, McMullen's problem의 convex position 점 배치, oriented matroid, 실현성 문제와 직접적 관련이 없음.", "summary": "본 논문은 그래프와 디자인에 대한 switching 방법(기본 매개변수를 보존하는 국소 변환)을 다룬다. 2-디자인에서 divisible 디자인으로의 switching 방법 확장을 제시하고, 그래프와 디자인 간의 switching 방법 동치성을 증명하여 새로운 2-디자인 구성 방법을 제공한다.", "technique": "Switching methods를 통한 국소 변환으로 combinatorial structures의 매개변수 보존 및 동치성 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15146v1", "title": "A lower bound on the density of prefixes with maximal palindromic length", "authors": ["Josef Rukavicka"], "abstract": "The palindromic length $PL(u)$ of a nonempty finite word $u$ is the least number of nonempty palindromes whose concatenation is $u$. For an infinite word $w$, let $P_w(n)$ be the number of nonempty palindromic prefixes of $w[1,n]$, and let $T_w(n)$ consist of those prefixes $w[1,j]$, $1\\leq j\\leq n$, whose palindromic length equals the maximum attained among the nonempty prefixes of $w[1,j]$. We prove the finite inequality $|T_w(n)|\\geq P_w(n)$ for every $n\\geq1$. In particular, if $w$ has infinitely many palindromic prefixes, then \\[   \\liminf_{n\\to\\infty}\\frac{|T_w(n)|}{P_w(n)}\\geq1. \\] The coefficient $1$ is optimal, already for a nonconstant periodic word. The proof uses chains of occurrences connected by palindromic factors, together with trimming and reflection arguments that preserve lower bounds on palindromic length.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T07:21:47+00:00", "updated": "2026-09-14T07:21:47+00:00", "abs_url": "http://arxiv.org/abs/2609.15146v1", "pdf_url": "https://arxiv.org/pdf/2609.15146v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 내 문자열·단어론(word combinatorics) 분야이나, McMullen's problem의 볼록기하·배치·oriented matroid와는 본질적 연관성 없음.", "summary": "유한 단어의 palindromic length(최소 회문 분해 길이)를 정의하고, 무한 단어에서 최대 회문 길이를 달성하는 접두사의 개수 $|T_w(n)|$이 회문 접두사의 개수 $P_w(n)$보다 크거나 같음을 증명. 이 경계는 주기 단어에서 최적임을 보임.", "technique": "회문 인수로 연결된 발생 체인(chains of occurrences)과 회문 길이 하한을 보존하는 trimming 및 reflection 논증.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.14102v1", "title": "On the Number of Distinct Topological Bases of a Finite Set of Size $N$", "authors": ["Lars Warren Ericson"], "abstract": "For a finite set $S$ with $\\lvert S\\rvert = N$, the number of families $\\mathcal{B} \\subseteq \\mathcal{P}(S)$ that are topological bases is $\\#(N) = \\sum_{\\mathcal{T} \\in \\operatorname{Top}(S)} 2^{\\lvert\\mathcal{T}\\rvert - \\lvert\\mathcal{M}_{\\mathcal{T}}\\rvert}$, where $\\mathcal{M}_{\\mathcal{T}}$ is the canonical minimal basis of minimal open neighborhoods. The identity is proved in Lean 4 / Mathlib (`CARDB.lean`): bases generating $\\mathcal{T}$ are exactly the sets with $\\mathcal{M}_{\\mathcal{T}} \\subseteq \\mathcal{B} \\subseteq \\mathcal{T}$. The small-$N$ table and the discrete-dominance sandwich are proved in `CARDB/SmallN.lean` and `CARDB/Asymptotics.lean`.", "categories": ["math.CO", "cs.LO", "math.GN"], "primary_category": "math.CO", "published": "2026-09-12T18:56:14+00:00", "updated": "2026-09-12T18:56:14+00:00", "abs_url": "http://arxiv.org/abs/2609.14102v1", "pdf_url": "https://arxiv.org/pdf/2609.14102v1", "journal_ref": "", "doi": "", "comment": "29 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한집합의 위상적 기저 개수 계산은 McMullen's problem의 점 배치·조합론적 구조와 무관함.", "summary": "유한집합 S에 대해 위상적 기저(topological base)를 이루는 부분족의 개수를 세는 공식을 제시하고, Lean 4/Mathlib에서 정식으로 증명함. 작은 N에 대한 표와 점근적 성질을 확립함.", "technique": "정식 검증(formal verification in Lean 4), 위상적 기저의 특성화(최소 열린근방의 정규 최소기저를 이용)", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15678v1", "title": "Certificate Complexity of Elementary Symmetric Boolean Functions of Arbitrary Degree", "authors": ["Jing Zhang", "Yuan Li"], "abstract": "Let $σ_{n,d}$ denote the elementary symmetric Boolean function of $n$ variables and degree $d$. Our previous work determined its certificate complexity when $d$ is odd and when $d$ is a power of $2$, while even degrees with at least two nonzero binary digits were left open. We solve that open question and determine $C(σ_{n,d})$ for every $1\\le d\\le n$.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-09-14T14:52:49+00:00", "updated": "2026-09-14T14:52:49+00:00", "abs_url": "http://arxiv.org/abs/2609.15678v1", "pdf_url": "https://arxiv.org/pdf/2609.15678v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Boolean function의 certificate complexity는 조합론적 성질이지만, McMullen's problem의 convex position, oriented matroid, realizability와는 직접 관련이 없음.", "summary": "본 논문은 $n$개 변수의 기본 대칭 Boolean 함수(elementary symmetric Boolean function) $σ_{n,d}$의 certificate complexity $C(σ_{n,d})$를 모든 $1≤d≤n$에 대해 결정한다. 이전 연구에서 $d$가 홀수이거나 2의 거듭제곱일 때의 경우를 다루었으나, 본 논문에서 남은 짝수 경우를 해결한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.18151v1", "title": "Demazure crystals for flagged set-valued reverse plane partitions", "authors": ["Siddheswar Kundu"], "abstract": "In this paper, we build a Demazure crystal structure on the set of all flagged set-valued reverse plane partitions of a given skew shape $λ/μ$ and flag $Φ$. Our construction provides a unified generalization of the Demazure crystal structures previously known for the set of all flagged semi-standard set-valued tableaux and the set of all flagged reverse plane partitions. Consequently, we obtain a combinatorial expansion for the flagged hybrid Grothendieck polynomial $H_{λ/μ}(\\mathbf{x}_Φ;\\mathbf{t};\\mathbf{w})$, introduced by Guo--Kang--Liu, in terms of key polynomials. Applying this expansion, we express the hybrid Grothendieck polynomial $H_{λ/μ}(\\mathbf{x};\\mathbf{t};\\mathbf{w})$ in terms of both the stable Grothendieck polynomials $G_ν(\\mathbf{x})$ and the dual stable Grothendieck polynomials $g_ν(\\mathbf{x})$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-16T05:32:06+00:00", "updated": "2026-09-16T05:32:06+00:00", "abs_url": "http://arxiv.org/abs/2609.18151v1", "pdf_url": "https://arxiv.org/pdf/2609.18151v1", "journal_ref": "", "doi": "", "comment": "21 Pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Demazure crystal 구조와 Grothendieck 다항식은 대수조합론의 표준 도구이지만, McMullen's problem(볼록위치 점 배치, oriented matroid, 조합기하)과 직접적 관련성 없음.", "summary": "본 논문은 skew shape와 flag에 대한 flagged set-valued reverse plane partitions의 집합 위에 Demazure crystal 구조를 구성한다. 이는 flagged semi-standard set-valued tableaux와 flagged reverse plane partitions에 대해 알려진 Demazure crystal 구조들의 통일된 일반화를 제공하며, flagged hybrid Grothendieck 다항식의 key polynomial에 의한 조합 전개식을 얻는다.", "technique": "Demazure crystal 구조를 통한 flagged set-valued reverse plane partition의 combinatorial modeling 및 hybrid Grothendieck 다항식의 key polynomial 전개.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.17370v1", "title": "On the extended Shi arrangement of type $B_{\\ell}$", "authors": ["Zixuan Wang"], "abstract": "Motivated by Kawanoue's construction of a basis for the derivation module of the cone of the extended Catalan arrangement of type $B_\\ell$, we construct an explicit basis for the derivation module of $\\mathbf{c}Shi(B_\\ell,m)$. Our construction generalizes the previously known case $m=1$ to $m\\geq1$. It also provides a partial answer to a question of Abe and Terao concerning explicit constructions of simple-root bases.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T16:05:41+00:00", "updated": "2026-09-15T16:05:41+00:00", "abs_url": "http://arxiv.org/abs/2609.17370v1", "pdf_url": "https://arxiv.org/pdf/2609.17370v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학의 고전적 조합론 문제(McMullen's problem, oriented matroid, convex position)와 달리, 본 논문은 hyperplane arrangement의 derivation module 기저 구성에 관한 대수적 조합론 연구로 직접적 관련성이 없음.", "summary": "본 논문은 확장 Shi arrangement $\\mathbf{c}Shi(B_\\ell,m)$의 derivation module에 대한 명시적 기저를 구성한다. 이는 Kawanoue의 extended Catalan arrangement 연구에서 영감을 받아 $m=1$ 경우를 $m\\geq 1$로 일반화하며, Abe-Terao 문제에 대한 부분적 답변을 제공한다.", "technique": "Type $B_\\ell$ Coxeter arrangement의 기하학적·조합론적 구조를 활용한 derivation module의 기저 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.14351v1", "title": "The Colomo-Pronko conjecture for frozen-corner alternating sign matrices", "authors": ["Yinjie Li"], "abstract": "We prove the Colomo-Pronko conjecture for alternating sign matrices with a prescribed square of zeros at a corner, for all matrix sizes and freezing parameters. A known multiple-integral formula for the frozen-corner count yields determinant representations built from fixed polynomial kernels. We relate these kernels to the conjectured determinant through an inverse identity for the commutator of a signed Pascal matrix with reversal. In odd dimension, the comparison uses the one-dimensional nullspace and projection along it to eliminate the central coordinate. Combined with the asymptotic analysis of Colomo and Pronko, our result removes the conjectural assumption from their GUE Tracy-Widom fluctuation theorem for the intersection of the frozen boundary with the main diagonal in uniformly random alternating sign matrices. The finite-dimensional algebraic core of the proof has been formalized in Lean 4.", "categories": ["math.CO", "math.PR"], "primary_category": "math.CO", "published": "2026-09-13T07:24:44+00:00", "updated": "2026-09-13T07:24:44+00:00", "abs_url": "http://arxiv.org/abs/2609.14351v1", "pdf_url": "https://arxiv.org/pdf/2609.14351v1", "journal_ref": "", "doi": "", "comment": "17 pages. Supplementary material and Lean 4 formalization are included as ancillary files", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Alternating sign matrices와 determinant 표현은 조합론의 고전 주제이지만, McMullen's problem (convex polytopes의 face vector)과는 직접적 관련이 없음.", "summary": "본 논문은 frozen-corner alternating sign matrices에 대한 Colomo-Pronko 추측을 모든 행렬 크기와 freezing parameter에 대해 증명한다. 다중적분 공식으로부터 고정 다항식 핵(kernel)으로 구성된 determinant 표현을 유도하고, signed Pascal matrix의 commutator에 대한 역 항등식을 통해 예상되는 determinant와 연결한다. 결과적으로 균등 무작위 alternating sign matrices에서 frozen boundary와 주대각선의 교점에 대한 GUE Tracy-Widom 변동 정리의 추측적 가정을 제거한다.", "technique": "Signed Pascal matrix의 commutator 역 항등식과 奇수 차원에서의 일차원 nullspace를 이용한 중앙 좌표 제거; Lean 4 형식화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.18205v1", "title": "Turán-type extremal problems for unbalanced signed graphs", "authors": ["Linfeng Xie", "Keheng Zhu", "Xiaogang Liu"], "abstract": "In this paper, we establish two Turán-type results for signed graphs. We first generalize the classical Turán theorem to signed graphs and then extend Nikiforov's spectral Turán theorem to signed graphs. Moreover, we determine the second maximum spectral radius among all unbalanced signed graphs that contain no balanced complete signed subgraph on \\(r+1\\) vertices.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-16T06:38:10+00:00", "updated": "2026-09-16T06:38:10+00:00", "abs_url": "http://arxiv.org/abs/2609.18205v1", "pdf_url": "https://arxiv.org/pdf/2609.18205v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "부호 그래프의 Turán 유형 극값 문제는 McMullen's problem의 볼록 위치, oriented matroid, chirotope 등과 직접적 연관이 없음.", "summary": "본 논문은 부호 그래프(signed graphs)에 대한 Turán 유형 결과를 두 가지 확립한다. 고전적 Turán 정리를 부호 그래프로 일반화하고, Nikiforov의 스펙트럼 Turán 정리를 부호 그래프로 확장한다. 또한 균형잡힌 완전 부호 부분그래프를 포함하지 않는 비균형 부호 그래프들 중 두 번째 최대 스펙트럼 반경을 결정한다.", "technique": "스펙트럼 그래프 이론(spectral graph theory)과 극값 그래프론 방법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.19773v1", "title": "Algebraically independent distances and rigid metrics", "authors": ["Yoshito Ishiki"], "abstract": "We study metrics whose distances on distinct two-point subsets are algebraically independent over the rationals. We prove that every compatible metric on a strongly zero-dimensional metrizable space of cardinality at most continuum can be uniformly approximated by compatible metrics with this property. If the space is completely metrizable, the approximating metrics can also be chosen complete. For every $σ$-compact metrizable space, the metrics with algebraically independent distances form a $G_δ$ set in the uniform topology. We also study rigid metrics, whose only bijective self-isometry is the identity. On every locally compact Polish space, rigid proper metrics form a $G_δ$ set among proper compatible metrics. Using a theorem of Niemiec, we obtain uniform density of rigid metrics on compact metrizable spaces with at least three points. Passing to compact completions then yields rigid approximations of every totally bounded compatible metric on any space with at least three points.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-17T06:39:09+00:00", "updated": "2026-09-17T06:39:09+00:00", "abs_url": "http://arxiv.org/abs/2609.19773v1", "pdf_url": "https://arxiv.org/pdf/2609.19773v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "메트릭 공간의 거리 대수적 독립성과 강체성을 다루지만, McMullen의 문제(5차원 볼록위치 점 배치와 oriented matroid 재실현가능성)와는 직접적 관련이 없음.", "summary": "본 논문은 유리수 위에서 대수적으로 독립인 거리를 갖는 메트릭을 연구한다. 강제로 영차원인 가산-compact 메트릭 공간에서 모든 호환 메트릭이 이러한 성질의 메트릭으로 균일하게 근사 가능함을 증명한다. 또한 항등원만을 자기-등거리동형으로 갖는 강체 메트릭(rigid metric)의 위상적 성질(G_δ 집합)과 조밀성을 확립한다.", "technique": "메트릭 공간의 위상적 범주론(G_δ 집합, 균일 근사, 완비화), Niemiec의 정리 활용", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.14630v1", "title": "Subset-Sum Density Realization in Locally Finite Abelian Groups", "authors": ["Norbert Hegyvári", "Thang Pham", "Boqing Xue"], "abstract": "Let $G$ be a countable locally finite abelian group, and let \\[ G_1\\leq G_2\\leq\\cdots, \\qquad \\bigcup_{i\\geq1}G_i=G, \\] be any filtration of $G$ by finite subgroups. For $A\\subseteq G$, let $\\mathcal P(A)$ denote the set of all finite subset sums of elements of $A$, and let $2G:=\\{2g:g\\in G\\}$. We prove that $|2G|=\\infty$ if and only if for every filtration and every interval $[α,β]\\subseteq[0,1]$, there exists $A\\subseteq G$ such that the set of limit points of \\[ \\left( \\frac{|\\mathcal P(A)\\cap G_i|}{|G_i|} \\right)_{i\\geq1} \\] is exactly $[α,β]$. We also prove a positive-density result that does not require $|2G|=\\infty$: if $G$ is infinite and $\\mathcal P(A)$ has positive upper density along the given filtration, then there is an infinite set $B\\subseteq \\mathcal P(A)$ such that $B+B\\subseteq \\mathcal P(A)$. Combining this with the realization theorem, we show that, when $|2G|=\\infty$, every interval $[α,β]$ with $0\\leqα\\leqβ\\leq1$ and $β>0$ can be realized by a set $A$ with this additional property.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-09-13T16:03:40+00:00", "updated": "2026-09-13T16:03:40+00:00", "abs_url": "http://arxiv.org/abs/2609.14630v1", "pdf_url": "https://arxiv.org/pdf/2609.14630v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "가산 국소유한 아벨군의 부분합 밀도 실현은 이산볼록기하학의 점 배치 문제와 직접 관련이 없음.", "summary": "국소유한 아벨군 $G$에서 유한 부분합 집합 $\\mathcal{P}(A)$의 밀도 실현 문제를 다룬다. $|2G|=\\infty$ 조건 하에서 모든 구간 $[\\alpha,\\beta]\\subseteq[0,1]$이 적절한 $A$에 의해 실현 가능함을 증명하고, 양의 상밀도를 가진 $\\mathcal{P}(A)$는 무한 부분집합 $B\\subseteq\\mathcal{P}(A)$로 $B+B\\subseteq\\mathcal{P}(A)$를 만족하도록 구성 가능함을 보인다.", "technique": "여과(filtration)를 따른 상한 밀도 분석 및 극한점 집합의 실현을 통한 밀도 제어", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.17468v1", "title": "On Counting Independent Sets in Regular Hypergraphs", "authors": ["Michail Sarantis", "Prasad Tetali", "Zeyu Zheng"], "abstract": "Balogh, Bollobás and Narayanan conjectured that among all finite simple $r$-uniform $d$-regular hypergraphs, the number of weak independent sets is maximized by a natural quasi-bipartite construction $H_{r,d}$. We give three types of evidence for this conjecture. For every fixed $r$, we prove the conjectured asymptotic exponential rate whenever the twin quotient has maximum pair codegree $o(d)$. The proof uses the hypergraph container method. For hypergraphs with no cross-edges, the occupancy method gives the sharper error bound $O_r(\\log d/d)$. We show that a stronger version of the conjecture in terms of the so-called occupancy fraction is not true, by providing a counterexample for every $r\\ge 3$. We also prove exact cases of the conjecture when the hypergraph is $2$-regular. Using an entropy decomposition in the dual edge-cover problem, we settle every odd $r$ and the case $(r,d)=(4,2)$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T17:09:36+00:00", "updated": "2026-09-15T17:09:36+00:00", "abs_url": "http://arxiv.org/abs/2609.17468v1", "pdf_url": "https://arxiv.org/pdf/2609.17468v1", "journal_ref": "", "doi": "", "comment": "28 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "초록의 independent sets 계수 문제는 McMullen's problem의 convex position 점 배치나 oriented matroid 구조와 직접 관련이 없음.", "summary": "본 논문은 유한 단순 $r$-균일 $d$-정규 하이퍼그래프에서 약한 독립집합(weak independent sets)의 개수에 관한 Balogh-Bollobás-Narayanan 추측을 연구한다. 하이퍼그래프 용기 방법(container method)과 점유 방법(occupancy method)을 통해 특정 경우들의 점근 지수율과 정확한 경우들을 증명하고, 점유 분수(occupancy fraction)에 대한 더 강한 추측의 반례를 제시한다.", "technique": "하이퍼그래프 용기 방법(hypergraph container method), 점유 방법(occupancy method), 이중 간선 덮개 문제에서의 엔트로피 분해", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.17389v1", "title": "A perimeter analogue of Franklin's identity and an inequality related to the parity of parts", "authors": ["Philip Cuthbertson"], "abstract": "We prove two conjectures regarding partition perimeter inequalities. It was conjectured by Gray, Payne, and Watson that Franklin's partition identity becomes an eventual inequality if one replaces the size of the partition with its perimeter. We prove this conjecture by asymptotic analysis of the corresponding generating functions. Gray, Payne, Swisher, and Watson also conjectured that there is a bias for partitions with fixed perimeter to have more odd parts than even parts. We prove this conjecture by deriving the corresponding generating functions and give a positive recurrence for the coefficients. In the case that there are an equal number of odd parts and even parts we provide a connection to peakless Motzkin paths.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-09-15T16:27:31+00:00", "updated": "2026-09-15T16:27:31+00:00", "abs_url": "http://arxiv.org/abs/2609.17389v1", "pdf_url": "https://arxiv.org/pdf/2609.17389v1", "journal_ref": "", "doi": "", "comment": "18 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "분할론(partition theory) 및 생성함수 분석에 관한 논문으로, 이산기하학의 McMullen 문제(convex position, oriented matroid, realizability)와는 직접적 관련이 없음.", "summary": "Franklin의 분할 항등식에서 분할의 크기를 둘레(perimeter)로 바꾼 경우의 비점근적 부등식 추측을 생성함수의 점근 분석으로 증명했다. 또한 고정된 둘레를 가진 분할에서 홀수 부분이 짝수 부분보다 많을 확률적 편향(bias)을 증명하고, 부분 개수가 같은 경우 peakless Motzkin 경로와의 연결을 제시했다.", "technique": "생성함수 분석 및 점근 분석(asymptotic analysis of generating functions); 양의 점화식(positive recurrence) 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.18474v1", "title": "A somewhat sure note on an un-Schur problem", "authors": ["Swaroop Hegde", "Hitesh Kumar", " Pratibha"], "abstract": "Parczyk and Spiegel initiated the study of an anti-Ramsey multiplicity variant of Schur's theorem and proved that the maximum fraction of Schur triples that can be rainbow in a $3$-coloring of $\\{ 1, \\dots ,n \\}$ is bounded asymptotically between $0.4$ and $0.66364$. Furthermore, they conjectured that their lower bound is optimal. We disprove this conjecture and prove new bounds. In particular, we show that the maximum fraction of rainbow Schur triples that can be rainbow in a $3$-coloring of $\\{ 1, \\dots ,n \\}$ lies between $9/22$ and $8/15$ asymptotically. Moreover, we study the problem in the general $k$-color setting and establish new non-trivial bounds.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-09-16T11:09:35+00:00", "updated": "2026-09-16T11:09:35+00:00", "abs_url": "http://arxiv.org/abs/2609.18474v1", "pdf_url": "https://arxiv.org/pdf/2609.18474v1", "journal_ref": "", "doi": "", "comment": "11 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Schur triple 의 rainbow coloring 문제는 조합론의 Ramsey 이론 분야이며, McMullen's problem (convex position, oriented matroid, chirotope)과는 직접적 관련이 없음.", "summary": "Parczyk-Spiegel의 3-coloring에서 rainbow Schur triple의 최대 비율에 관한 추측을 반박하고, 새로운 상하한 $9/22 \\leq f(n) \\leq 8/15$를 증명. 일반적인 $k$-색상 설정으로도 확장.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.20516v1", "title": "On a class of combinatorial group invariants", "authors": ["Arthur Fernandes", "Claudio Qureshi", "Lucas Reis", "Sávio Ribas"], "abstract": "In this paper, we explore group invariants arising from combinatorial structures associated with finite groups, including the functional graphs of power maps and the well-studied power graphs. These invariants induce equivalence relations (and hence partitions) on the set of isomorphism classes of finite groups, which we classify from the finest to the coarsest. Surprisingly, all but three of these partitions turn out to coincide; for the subclass of nilpotent groups, all but two coincide. Furthermore, we introduce a broad class of nilpotent groups and show that, within this class, all but one of these partitions agree. Our proofs draw on tools and ideas from Combinatorics and Number Theory, while requiring only basic notions from Group Theory. In particular, we construct a general framework that may prove useful in contexts similar to those considered in this paper. Finally, we propose some open questions that emerge from our results.", "categories": ["math.CO", "math.GR"], "primary_category": "math.CO", "published": "2026-09-17T14:56:58+00:00", "updated": "2026-09-17T14:56:58+00:00", "abs_url": "http://arxiv.org/abs/2609.20516v1", "pdf_url": "https://arxiv.org/pdf/2609.20516v1", "journal_ref": "", "doi": "", "comment": "25 pages; accepted for publication in Algebraic Combinatorics", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한군의 조합론적 불변량 연구로, McMullen's problem(볼록위치 점 배치·oriented matroid)과는 주제·도구·수학적 맥락이 무관함.", "summary": "유한군과 결합된 함수 그래프 및 거듭제곱 그래프로부터 유도되는 군 불변량을 연구하며, 동형류 집합의 동치류(분할)를 분류한다. 대부분의 분할이 일치함을 보이고, 특히 멱영 부분군(nilpotent groups) 내에서는 더 강한 일치 결과를 얻는다.", "technique": "조합론·수론·군론의 도구를 활용한 동치관계 분류 및 일반적 틀 구성", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.20606v1", "title": "Arboricity and Simplicial Geometric Category of Wedges and Joins of Graphs", "authors": ["Nursultan Kuanyshov", "Islam Yeginbay"], "abstract": "We investigate the behavior of arboricity under two fundamental graph operations, namely wedges and joins, proving an exact formula for wedges and establishing general upper and lower bounds for joins. Using the characterization of the simplicial geometric category of connected graphs in terms of arboricity, we derive a wedge formula for simplicial geometric category and obtain corresponding estimates for graph joins. Finally, we illustrate these results through explicit computations for several classes of graphs by constructing forest decompositions and the associated covers by strongly collapsible subcomplexes.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-09-17T15:53:21+00:00", "updated": "

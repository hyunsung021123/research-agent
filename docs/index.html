struct the hypergraph. Starting from this matrix, we introduce new graphs associated with the hypergraph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T09:57:26+00:00", "updated": "2026-08-19T09:57:26+00:00", "abs_url": "http://arxiv.org/abs/2608.18747v1", "pdf_url": "https://arxiv.org/pdf/2608.18747v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "초록의 hypergraph 스펙트럼 연구는 McMullen's problem의 점 배치, oriented matroid, chirotope 등과 무관함.", "summary": "논문은 하이퍼그래프와 연관된 새로운 특성 인접행렬(characteristic adjacency matrix)을 정의하고 그 스펙트럼을 분석한다. 이 행렬이 동형 하이퍼그래프들을 구별하는 불변량임을 보이고, 행렬로부터 원래 하이퍼그래프를 복원할 수 있음을 보인다.", "technique": "Hypergraph 스펙트럼 이론(spectral analysis)을 통한 구조적 특성 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.21851v1", "title": "A Sharp Matching-Number Threshold for Spectral-Walk Determination of Trees", "authors": ["Chaochao Zhu"], "abstract": "The spectral characterization of graphs is a central problem in spectral graph theory. In this paper we study when a tree is determined, among trees, by its generalized spectrum. We use the equivalent formulation given by the adjacency spectrum together with the total-walk sequence $W_k(G)=\\mathbf 1^{\\mathsf T}A(G)^k\\mathbf 1$. We determine the exact matching-number threshold for this tree-level reconstruction problem. If $T$ and $T'$ are trees with matching number at most 4 and have the same adjacency spectrum and the same total-walk sequence, then $T\\cong T'$. Moreover, in this range it is enough to require equality of $W_k$ for $3\\le k\\le8$. The bound is sharp: for every positive integer $m$ we construct a pair of non-isomorphic trees with matching number 5 having the same adjacency spectrum and identical total-walk sequences. The proof of the positive result is based on a finite-core reduction and an algebraic reconstruction of the possible pendant attachments.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-22T08:49:17+00:00", "updated": "2026-08-22T08:49:17+00:00", "abs_url": "http://arxiv.org/abs/2608.21851v1", "pdf_url": "https://arxiv.org/pdf/2608.21851v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 스펙트럼 그래프 이론의 나무 특성화 문제로, McMullen's problem의 convex position/general position 점 배치나 oriented matroid 구조와 직접적인 연관이 없습니다.", "summary": "본 논문은 나무(tree)가 인접 스펙트럼과 total-walk sequence로 유일하게 결정되는 조건을 연구합니다. matching number가 최대 4 이하인 나무들은 동일한 스펙트럼과 total-walk sequence를 가지면 동형이며, matching number 5인 경우 반례가 존재함을 보여 경계를 확정합니다.", "technique": "유한 핵심 축약(finite-core reduction)과 pendant attachment의 대수적 재구성을 통한 스펙트럼 재구성 방법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.20303v1", "title": "Kahn--Lovász-type inequalities for graph factors", "authors": ["Hyunwoo Lee"], "abstract": "The Kahn--Lovász theorem gives a sharp upper bound on the number of perfect matchings in a graph in terms of its degree sequence, extending the classical Brégman--Minc inequality for bipartite graphs. In this paper, we establish an asymptotically sharp extension of the Kahn--Lovász theorem to $F$-factors for every Hamiltonian graph $F$. As a consequence, we asymptotically determine the maximum number of $F$-factors in an $n$-vertex $m$-edge graph, yielding an $F$-factor analogue of Kruskal--Katona-type theorems.   We also prove a multigraph analogue of the Kahn--Lovász theorem. Combining this with our results for Hamiltonian graphs, we obtain an asymptotically sharp Kruskal--Katona-type bound for a further class of connected graphs $F$, including those containing two vertex-disjoint cycles of equal length whose union spans $V(F)$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-20T17:42:05+00:00", "updated": "2026-08-20T17:42:05+00:00", "abs_url": "http://arxiv.org/abs/2608.20303v1", "pdf_url": "https://arxiv.org/pdf/2608.20303v1", "journal_ref": "", "doi": "", "comment": "27 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 인수(factors)의 조합론적 상한을 다루지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, 다면체 기하학과는 직접 관련이 없음.", "summary": "본 논문은 Kahn–Lovász 정리를 완벽 매칭에서 Hamiltonian 그래프 F의 F-인수로 확장하여, 점근적으로 sharp한 상한을 제시한다. 결과적으로 주어진 n-정점 m-간선 그래프에서 F-인수의 최대 개수를 점근적으로 결정하며, Kruskal–Katona 정리의 유추를 제공한다.", "technique": "차수 수열(degree sequence)에 기반한 상한 기법과 다중그래프 확장을 통해 인수 계수의 점근적 특성화", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.22561v1", "title": "Young-lattice diagonals and a doubly graded multiple-zeta decomposition of $e^γ$", "authors": ["Ricardo Gómez-Aíza"], "abstract": "An equivalent formulation of the Riemann hypothesis recently led to a partition expansion naturally indexed by diagonals of the Young lattice. Segovia isolated the hook families $(r,1^m)$ on these diagonals and computed their limiting contributions $ρ_r$, while observing that non-hook families provide a missing contribution.   We introduce a bivariate finite generating function that packages all Young shapes on every fixed-excess diagonal at once. For each fixed $r\\geq1$, we obtain a diagonal generating polynomial $D_r(n;z)$ and prove \\[   A_r(n)\\sim C_r\\,n\\log\\log n, \\] where $C_r$ is the $(r-1)$st coefficient of an explicit convergent infinite product. Moreover, \\[   C_r=\\sum_{ν\\vdash r-1} C_ν, \\] giving a canonical decomposition over the partitions of the excess $r-1$. The one-part contribution is Segovia's hook constant $ρ_r$, while the remaining terms give all non-hook corrections simultaneously.   We then refine these constants by introducing coefficients $C_{r,d}$ that record simultaneously the Young-lattice excess $r-1$ and the number $d$ of non-unit rows. Row sums recover the fixed-excess constants $C_r$, while column sums recover the depth decomposition in an Abel-regularized multiple-zeta expansion of $e^γ$. More precisely, each partition $ν\\vdash r-1$ is identified with an Abel-regularized multiple-zeta block of depth $\\ell(ν)$. Thus the same array $(C_{r,d})$ organizes the decomposition simultaneously by Young-lattice excess and multiple-zeta depth. Our results concern the combinatorial and asymptotic structure of this decomposition, rather than the Riemann hypothesis itself.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-23T19:21:50+00:00", "updated": "2026-08-23T19:21:50+00:00", "abs_url": "http://arxiv.org/abs/2608.22561v1", "pdf_url": "https://arxiv.org/pdf/2608.22561v1", "journal_ref": "", "doi": "", "comment": "33 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Young lattice 및 분할(partition) 조합론을 다루지만, McMullen's problem(볼록 위치의 점 배치, oriented matroid, 실현가능성)과는 주제 및 기법이 완전히 무관합니다.", "summary": "Young lattice의 대각선(diagonal)으로 색인된 분할들의 구조를 연구하며, 고정된 초과(excess) $r-1$의 각 대각선에 대해 이변량 생성함수를 도입합니다. 이를 통해 $A_r(n) \\sim C_r n \\log\\log n$의 점근 공식을 얻고, 상수 $C_r$을 초과의 분할로 분해하며, 추가로 Young-lattice 초과와 비단위 행의 개수를 동시에 기록하는 이중 색인 계수 $C_{r,d}$를 정의하여 Abel-정규화된 다중 제타값(multiple-zeta) 전개와 연결합니다.", "technique": "이변량 유한 생성함수(bivariate finite generating function) 및 무한곱(infinite product)을 이용한 점근 분석, Abel-정규화된 다중 제타값의 깊이(depth) 분해.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.28971v1", "title": "Calculus of the Facial Distance", "authors": ["Javier Pena", "Elias Wirth"], "abstract": "We develop a few calculus rules to compute or lower bound the facial distance of a polytope. We illustrate our calculus rules on various popular polytopes. In particular, we provide a provide a lower bound on the facial distance of the Birkhoff polytope.", "categories": ["math.OC", "math.CO"], "primary_category": "math.OC", "published": "2026-08-29T00:48:25+00:00", "updated": "2026-08-29T00:48:25+00:00", "abs_url": "http://arxiv.org/abs/2608.28971v1", "pdf_url": "https://arxiv.org/pdf/2608.28971v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 polytope의 facial distance에 관한 미적분 규칙을 다루며, McMullen's problem이나 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 polytope의 facial distance를 계산하거나 하한을 구하는 몇 가지 미적분 규칙(calculus rules)을 개발한다. 다양한 대표적인 polytope에 이 규칙들을 적용하여 예시를 제시하며, 특히 Birkhoff polytope의 facial distance에 대한 하한을 제공한다.", "technique": "Polytope의 facial distance에 대한 미적분 규칙(calculus rules) 개발 및 적용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.28783v1", "title": "Nonnegative conorms, regular matroids, and the tropical Schottky problem", "authors": ["Yelena Mandelshtam"], "abstract": "We prove that a positive-definite quadratic form has nonnegative conorms if and only if it is matroidal, resolving a conjecture of Dutour Sikirić and Kummer. We show that the positive conorm support determines a regular matroid, and the positive conorms are the coefficients of a unimodular integral decomposition of the form. As a result, we show that a positive-definite form lies in the tropical Schottky locus if and only if its conorms are nonnegative and its positive conorm support matroid is cographic. This answers a question of Chua, Kummer, and Sturmfels and provides algorithms for the tropical Schottky decision and recovery problems in every genus.", "categories": ["math.AG", "math.CO", "math.MG"], "primary_category": "math.AG", "published": "2026-08-28T18:45:15+00:00", "updated": "2026-08-28T18:45:15+00:00", "abs_url": "http://arxiv.org/abs/2608.28783v1", "pdf_url": "https://arxiv.org/pdf/2608.28783v1", "journal_ref": "", "doi": "", "comment": "18 pages, comments welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 양정치 이차형식의 conorm과 matroid, tropical Schottky 문제를 다루며, McMullen 문제나 oriented matroid의 acyclic reorientation과 직접적인 관련이 없다.", "summary": "이 논문은 양정치 이차형식(positive-definite quadratic form)이 음수가 아닌 conorm을 가질 필요충분조건이 matroidal임을 증명하여 Dutour Sikirić와 Kummer의 추측을 해결한다. 또한 양의 conorm support가 regular matroid를 결정하며, 양의 conorms가 해당 형식의 unimodular integral decomposition의 계수임을 보인다. 이를 통해 양정치 형식이 tropical Schottky locus에 속할 조건을 완전히 특성화하고, 모든 genus에서 tropical Schottky 결정 및 복원 문제의 알고리즘을 제공한다.", "technique": "양정치 이차형식의 conorm 분석과 regular matroid 이론, unimodular integral decomposition을 결합하여 tropical Schottky locus의 특성화를 수행한다.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2608.28282v1", "title": "Unimodular triangulations and Ehrhart theory for two families of Hermite normal form simplices", "authors": ["Justus Bruckamp", "Jhon B. Caicedo", "Martina Juhnke"], "abstract": "We study regular unimodular triangulations, the integer decomposition property, and Ehrhart-theoretic properties of two families of Hermite normal form simplices. We first consider the one-row case associated with the vector $(N - 1, \\dots ,N - 1 , N)\\in \\mathbb{N}^d$, and completely characterize when the corresponding simplices admit a regular unimodular triangulation. Our constructions are explicit and also yield closed formulas for the $h^\\ast$-polynomial and the local $h^\\ast$-polynomial. Moreover, we prove Ehrhart positivity and derive explicit dimension-dependent conditions under which the Ehrhart polynomial is not unimodal.   Finally, we extend our approach to the two-row cases associated with $(1, \\dots ,1 , N)\\in\\mathbb{N}^d$ and $(M-1, \\dots ,M-1, M, 0)\\in\\mathbb{N}^d$. In these cases, we construct regular unimodular triangulations, derive closed formulas for the $h^\\ast$-polynomial and the local $h^\\ast$-polynomial, and prove Ehrhart positivity.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-28T12:47:05+00:00", "updated": "2026-08-28T12:47:05+00:00", "abs_url": "http://arxiv.org/abs/2608.28282v1", "pdf_url": "https://arxiv.org/pdf/2608.28282v1", "journal_ref": "", "doi": "", "comment": "24 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Hermite normal form 단체(simplex)의 단모듈 삼각분할(unimodular triangulation)과 Ehrhart 이론을 다루며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 벡터 $(N-1,\\dots,N-1,N)\\in\\mathbb{N}^d$ 에 대응하는 one-row Hermite normal form 단체의 정칙 단모듈 삼각분할 존재 조건을 완전히 특성화하고, $h^*$-다항식 및 local $h^*$-다항식의 닫힌 공식을 도출한다. 또한 Ehrhart 양성(Ehrhart positivity)을 증명하고 Ehrhart 다항식이 단봉(unimodal)이 아닌 차원 조건을 유도한다. 나아가 two-row 경우인 $(1,\\dots,1,N)$과 $(M-1,\\dots,M-1,M,0)$에도 같은 접근을 확장하여 정칙 단모듈 삼각분할을 구성하고 관련 불변량의 공식을 제시한다.", "technique": "Hermite normal form 단체에 대한 정칙 단모듈 삼각분할의 명시적 구성과 $h^*$-다항식 계산.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.27887v1", "title": "Note on adjacency spectra for twice punctured hypercubes", "authors": ["Jang Soo Kim", "Victor Reiner", "Laura Schoenzeit"], "abstract": "Eigenspaces of hypercube graph adjacency matrices are well understood. We extend this to subgraphs obtained by removing a vertex or antipodal pair of vertices, motivated by a question on zonotopes.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-28T03:51:47+00:00", "updated": "2026-08-28T03:51:47+00:00", "abs_url": "http://arxiv.org/abs/2608.27887v1", "pdf_url": "https://arxiv.org/pdf/2608.27887v1", "journal_ref": "", "doi": "", "comment": "8 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "초록에서 언급된 zonotope 관련 동기가 McMullen 문제와 간접적으로 연결될 수 있으나, 이 논문의 주제는 하이퍼큐브 그래프의 인접 스펙트럼으로 McMullen 문제와 직접적 관련성이 없다.", "summary": "이 논문은 하이퍼큐브 그래프의 인접 행렬 고유공간(eigenspace)을 확장하여, 하나의 꼭짓점 또는 대척점 쌍(antipodal pair)을 제거한 부분그래프의 인접 스펙트럼을 분석한다. 연구 동기는 조노토프(zonotope)에 관한 특정 질문에서 비롯되었다. 하이퍼큐브 그래프의 인접 행렬 고유공간은 기존에 잘 알려져 있으며, 이 논문은 그 결과를 두 가지 punctured 변형으로 확장한다.", "technique": "하이퍼큐브 그래프의 인접 행렬 고유공간 이론을 꼭짓점 제거 부분그래프에 적용하는 스펙트럼 그래프 이론 기법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.27438v1", "title": "Graded Ehrhart theory for hypersimplices", "authors": ["Nathaniel Libman", "Weston Miller"], "abstract": "We prove that the $q$-Ehrhart series of a hyperplane slice of a cube is a rational function with an explicit denominator that satisfies $q$-reciprocity, confirming a conjecture of Reiner and Rhoades for these polytopes. To do this, we find a generating set for the orbit harmonics ideal, which also yields the Hilbert series and graded Frobenius characteristic of the associated quotient. We further show that the harmonic algebra of a hypersimplex $Δ$ is generated as an algebra by the harmonic space of $Δ$ using structural results on 2-factors of regular multigraphs. In particular, the harmonic algebra is finitely generated, giving a second proof of rationality.", "categories": ["math.CO", "math.AC"], "primary_category": "math.CO", "published": "2026-08-27T17:55:10+00:00", "updated": "2026-08-27T17:55:10+00:00", "abs_url": "http://arxiv.org/abs/2608.27438v1", "pdf_url": "https://arxiv.org/pdf/2608.27438v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 hypersimplex의 q-Ehrhart 이론과 orbit harmonics를 다루며, McMullen 문제(oriented matroid, convex position 점 배치 등)와 직접적인 관련이 없다.", "summary": "이 논문은 정육면체의 초평면 절단(hyperplane slice), 즉 hypersimplex에 대한 $q$-Ehrhart 급수가 명시적 분모를 가지는 유리함수임을 증명하고 $q$-역수 성질(q-reciprocity)을 만족함을 보여 Reiner-Rhoades의 추측을 확인한다. 이를 위해 orbit harmonics ideal의 생성집합을 구하고, 연관된 몫(quotient)의 Hilbert 급수 및 graded Frobenius 특성을 도출한다. 또한 정규 멀티그래프의 2-인수(2-factor)에 관한 구조적 결과를 이용해 hypersimplex $\\Delta$의 harmonic algebra가 harmonic space에 의해 대수로 생성됨을 보이고, 유리성의 두 번째 증명을 제공한다.", "technique": "Orbit harmonics ideal의 생성집합 분석 및 정규 멀티그래프의 2-factor에 관한 구조적 결과 활용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.27247v1", "title": "Almost factorial many facets for 0/1-polytopes", "authors": ["Federico Castillo", "Luis Ferroni"], "abstract": "A long-standing question posed by Fukuda (1995) and Ziegler (2000) inquires about the asymptotic behavior of $g(n)$, the maximum number of facets that an $n$-dimensional $0/1$-polytope can have. A remarkable result by Bárány and Pór (2001) via probabilistic methods established that $g(n)$ is at least superexponential in $n$. In this paper, we propose a drastic change of perspective, which leads us to show that for each $n\\geq 10$ there exists a $0/1$-polytope having at least $(n-\\lceil 2\\log_2 (n)\\rceil - 1)!$ facets. This provides a significant improvement over the currently known lower bounds for $g(n)$. Furthermore, when combined with known upper bounds, our construction establishes the asymptotic behavior of $\\log g(n)$ up to an error of $O((\\log n)^2)$. The methods employed throughout this paper are elementary and fully deterministic. The underlying ideas in our proof stem from the combinatorics of hypersimplices and permutohedra.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-27T15:25:44+00:00", "updated": "2026-08-27T15:25:44+00:00", "abs_url": "http://arxiv.org/abs/2608.27247v1", "pdf_url": "https://arxiv.org/pdf/2608.27247v1", "journal_ref": "", "doi": "", "comment": "10 pages. Comments are welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 0/1-폴리토프의 최대 면(facet) 수의 점근적 거동에 관한 것으로, McMullen 문제(볼록 위치·일반 위치 점 배치와 oriented matroid 관련)와 직접적인 관련이 없다.", "summary": "이 논문은 Fukuda(1995)·Ziegler(2000)가 제기한 $n$차원 0/1-폴리토프의 최대 면 수 $g(n)$의 점근 거동 문제를 다루며, $n\\geq 10$에 대해 $(n-\\lceil 2\\log_2 n\\rceil -1)!$ 개 이상의 면을 가지는 0/1-폴리토프의 존재를 결정론적 방법으로 증명한다. 이는 Bárány·Pór(2001)의 확률론적 초지수적 하한을 크게 개선하며, 기존 상한과 결합하면 $\\log g(n)$의 점근 거동을 $O((\\log n)^2)$ 오차 범위 내에서 확정한다. 증명의 핵심 아이디어는 hypersimplex와 permutohedra의 조합론에서 도출된다.", "technique": "Hypersimplex와 permutohedra의 조합론을 활용한 완전 결정론적·초등적 구성법으로 거의 계승(factorial) 규모의 면 수를 달성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.26692v1", "title": "Many Facets in Random Polytopes from Product and Log-Concave Measures", "authors": ["Silouanos Brazitikos", "Minas Pafis"], "abstract": "We prove bounds of order $n^{n/2}e^{O(n)}$ for the expected number of facets of high-dimensional random polytopes. First, let $μ$ be a non-degenerate compactly supported even probability measure on $\\R$ satisfying $μ([x^\\ast-s,x^\\ast])\\asymp s^κ$ near its right endpoint $x^\\ast$. For every sufficiently small fixed $α>0$, the convex hull of $N=\\lfloor e^{αn}\\rfloor$ independent points with law $μ^{\\otimes n}$ has at least $n^{n/2}e^{-C_{μ,α}n}$ expected facets; this includes all symmetric finite-alphabet distributions.   For every full-dimensional log-concave probability measure on $\\R^n$, we prove that there exist $T\\in[n,2n]$ and $N=\\lceil e^Tn^{3/2}\\rceil$ for which \\[ n^{n/2}e^{-Cn} \\leq \\mathbb E f_{n-1}(P_N) \\leq n^{n/2}e^{Cn}. \\] Thus the scale $n^{n/2}$, up to exponential factors, is universal for log-concave measures in this high-dimensional exponential regime. Finally, we construct a symmetric isotropic full-support non-log-concave counterexample with only $(1+o(1))2^n$ expected facets.", "categories": ["math.PR", "math.MG"], "primary_category": "math.PR", "published": "2026-08-27T06:51:31+00:00", "updated": "2026-08-27T06:51:31+00:00", "abs_url": "http://arxiv.org/abs/2608.26692v1", "pdf_url": "https://arxiv.org/pdf/2608.26692v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 고차원 랜덤 폴리토프의 면 개수(facet count) 기대값을 다루며, McMullen 문제(특정 점 배치에서의 convex position 조건)와는 직접적 관련이 없다.", "summary": "이 논문은 고차원 랜덤 볼록다면체(random polytope)의 facet 수 기대값에 대해 $n^{n/2}e^{O(n)}$ 규모의 경계를 증명한다. 구체적으로, 곱 측도(product measure) 및 log-concave 측도로부터 생성된 볼록 껍질(convex hull)의 기대 facet 수가 $n^{n/2}$ 스케일(지수 인자 범위 내)에서 보편적(universal)임을 보인다. 또한 symmetric isotropic이지만 log-concave가 아닌 반례를 구성하여 이 보편성이 log-concavity 없이는 성립하지 않음을 보인다.", "technique": "곱 측도의 우 끝점(right endpoint) 근방 거동 분석 및 log-concave 측도에 대한 고차원 볼록기하학적 기법을 활용하여 기대 facet 수의 상하한을 동시에 도출한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.26006v1", "title": "Cyclically Colored Triangulations: Enumeration and Connectedness of Reconfiguration Graphs", "authors": ["Daniel Debrohim", "Diana Sasaki", "Patrícia Nunes"], "abstract": "We study the connectedness and enumeration of reconfiguration graphs of valid triangulations of convex polygons whose vertices are cyclically colored with $j \\ge 3$ colors, where every triangle has vertices of three pairwise distinct colors.   For $j = 3$, we settle a conjectural expectation of Acharya, Mütze, and Verciani: we prove that the twist graph $\\mathcal{H}_{3k+2}$ is connected for every $k \\ge 4$, whereas $\\mathcal{H}_8$ and $\\mathcal{H}_{11}$ are disconnected. Using a colored root-edge decomposition that induces Cartesian products in the state space, we obtain coupled recurrences for $T(3k)$ and $T(3k+2)$. The corresponding generating functions reduce to the equation $U(x) = 1 + xU(x)^4$, and the difference between the two consecutive families is given by the Raney number $T(3k+3) - T(3k+2) = R_{4,5}(k-1)$.   For $j \\ge 4$, reconfiguration is performed by validity-preserving diagonal flips. We extend the root-edge decomposition to all admissible classes $N \\not\\equiv 1 \\pmod{j}$, obtaining, for each fixed $j$, a finite algebraic system of functional equations. We further prove that the flip graph $\\mathcal{G}_N^{(j)}$ is connected whenever valid triangulations exist. Thus, the root-edge decomposition provides a unified structural framework for the enumeration and reconfiguration of cyclically colored triangulations.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-26T16:50:10+00:00", "updated": "2026-08-26T16:50:10+00:00", "abs_url": "http://arxiv.org/abs/2608.26006v1", "pdf_url": "https://arxiv.org/pdf/2608.26006v1", "journal_ref": "", "doi": "", "comment": "22 pages, 6 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "볼록 다각형의 삼각분할 재구성 그래프를 다루지만, McMullen 문제(d=5, f(5)=11, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "볼록 다각형의 꼭짓점을 $j\\ge 3$개의 색으로 순환 색칠할 때 유효한 삼각분할의 재구성 그래프(twist graph 및 flip graph)의 연결성과 열거를 연구한다. $j=3$의 경우 twist graph $\\mathcal{H}_{3k+2}$가 $k\\ge 4$에서 연결됨을 증명하고, 열거에서 생성함수 방정식 $U(x)=1+xU(x)^4$ 및 Raney 수 $T(3k+3)-T(3k+2)=R_{4,5}(k-1)$을 도출한다. $j\\ge 4$의 경우에는 flip graph의 연결성을 증명하고 대수적 함수방정식 계를 통한 통합적 구조 틀을 제시한다.", "technique": "색칠된 근-변(root-edge) 분해를 통해 상태 공간에서 데카르트 곱 구조를 유도하고, 이로부터 함수방정식 계를 세워 생성함수를 분석한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.25558v1", "title": "On the Dimension of the Best-Worst Choice Polytope", "authors": ["Keivan Mallahi-Karai", "Majid Salamat"], "abstract": "For a set of $n$ alternatives, the best--worst choice polytope is the convex hull of the deterministic best--worst choice vectors induced by all linear rankings of the alternatives. The question of determining the dimension of this polytope as a function of $n$ has been raised by Doignon \\cite{Doignon2023}. In this paper we answer this question by finding an explicit formula for this dimension. Our proof is motivated by a representation-theoretic interpretation of the relevant rank problem for the symmetric group, but is presented entirely in elementary linear-algebraic terms. The connection with representation theory will be explored elsewhere.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-26T09:07:21+00:00", "updated": "2026-08-26T09:07:21+00:00", "abs_url": "http://arxiv.org/abs/2608.25558v1", "pdf_url": "https://arxiv.org/pdf/2608.25558v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 best-worst choice polytope의 차원을 결정하는 조합론 문제를 다루며, McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "$n$개의 대안(alternatives)에 대한 best-worst choice polytope는 모든 선형 순위(linear ranking)에 의해 유도되는 결정론적 best-worst choice 벡터들의 볼록 껍질(convex hull)이다. Doignon이 제기한 이 polytope의 차원을 $n$의 함수로 결정하는 문제에 대해, 저자들은 명시적 공식을 도출하여 답한다. 증명은 대칭군(symmetric group)에 대한 표현론적(representation-theoretic) 해석에서 동기를 얻었지만, 초등 선형대수학적 방법으로 제시된다.", "technique": "대칭군에 대한 표현론적 rank 문제 해석을 바탕으로 하되, 초등 선형대수학(elementary linear algebra) 방법으로 polytope의 차원 공식을 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.25034v1", "title": "On the Representational Geometry of Dynamic Programs", "authors": ["Richard F. M. Lim", "Ruriko Yoshida"], "abstract": "Standard neural architectures often fail to generalize to longer inputs for dynamic programming (DP) targets. We investigate what makes this hard geometrically. Every finite min-plus DP is a shortest path on a DAG, which is equivalently a tropical polynomial whose extended Newton polyhedron encodes the decision boundary of which path wins. We prove these three descriptions (graph, polynomial, polyhedron) form isomorphic semirings at two levels --- formal polynomials and their computed functions --- connected by operations that characterize all structural redundancies. We then address the length-generalization question geometrically: does the decision boundary at length $T$ decide the boundary at $T+1$? We present two structural negatives. The semiring's two native ways to reduce dimension (setting a variable to each identity) are neither injective nor always closed within the DP. Series and parallel composition fail to construct all DAG topologies from smaller sub-DAGs, and even all terminal-only operations do not capture all DP compositions.", "categories": ["cs.LG", "cs.DM", "math.AG", "math.CO"], "primary_category": "cs.LG", "published": "2026-08-25T18:23:41+00:00", "updated": "2026-08-25T18:23:41+00:00", "abs_url": "http://arxiv.org/abs/2608.25034v1", "pdf_url": "https://arxiv.org/pdf/2608.25034v1", "journal_ref": "", "doi": "", "comment": "13 pages, 7 figures; submitted to NeurIPS 2026 Workshop on Symmetry and Geometry in Neural Representations (Extended Abstract Track)", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 동적 프로그래밍의 표현 기하학(열대 다항식, Newton 다면체)을 다루며, McMullen 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "이 논문은 유한 min-plus 동적 프로그래밍(DP)을 DAG 최단 경로, 열대 다항식(tropical polynomial), 확장 Newton 다면체(extended Newton polyhedron)로 동치 표현하고, 이 세 기술이 두 수준(형식 다항식 및 계산 함수)에서 반환(semiring) 동형임을 증명한다. 길이 일반화(length generalization) 문제를 기하학적으로 접근하여, 길이 $T$에서의 결정 경계가 $T+1$의 경계를 결정하지 못함을 두 가지 구조적 부정 결과로 보인다. 특히, 반환의 두 가지 차원 축소 방식이 단사적이지 않고 DP 내에서 항상 닫혀 있지 않음을 밝힌다.", "technique": "열대 기하학(tropical geometry)과 Newton 다면체(Newton polyhedron)를 활용하여 DP의 결정 경계 구조를 반환(semiring) 동형 관계로 분석.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2608.24095v1", "title": "Sharp Bisection Bounds for Digraphs", "authors": ["Zhaoyang Ma", "Shufei Wu", "Qinghou Zeng"], "abstract": "Fix an integer $d\\ge1$. We prove that, for all sufficiently large $m$, every digraph $D$ with $m$ arcs and minimum semidegree at least $d$ admits a bisection $V(D)=V_1\\cup V_2$ with $\\bigl||V_1|-|V_2|\\bigr|\\le1$ such that \\[   \\min\\{e(V_1,V_2),e(V_2,V_1)\\}   \\ge \\frac{d(m+d+1)}{2(2d+1)}. \\] Here, for disjoint vertex sets $A,B\\subseteq V(D)$, $e(A,B)$ denotes the number of arcs directed from $A$ to $B$. For each $d$, equality holds for infinitely many values of $m$, showing that the additive term $d+1$ is best possible. This answers a question of Liu, Ma and Zu by removing the asymptotic error in the minimum-semidegree bound, strengthens the result to the bisection setting, and determines the optimal additive correction. We also prove that every $n$-vertex digraph with $m$ arcs admits a bisection in which both directed cuts have size at least $(m-n+1)/4$, and that this universal bound is sharp for out-stars.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-25T05:45:43+00:00", "updated": "2026-08-25T05:45:43+00:00", "abs_url": "http://arxiv.org/abs/2608.24095v1", "pdf_url": "https://arxiv.org/pdf/2608.24095v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학과 조합론의 점 배치 또는 oriented matroid 문제와 무관한 순수 그래프 이론의 호(arc) 분할 문제.", "summary": "최소 반차수(minimum semidegree)가 $d$ 이상인 방향 그래프에서 이등분(bisection)을 구성할 때, 양쪽 방향 절단(directed cut)의 최솟값에 대한 sharp한 하한을 증명한다. 각 $d$에 대해 무한히 많은 $m$에서 등호가 성립하며, 덧셈 항 $d+1$이 최적임을 보인다.", "technique": "최소 반차수 조건을 활용한 이등분 구성 및 무한족 그래프를 통한 하한의 달성 가능성 입증.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.25240v1", "title": "Connectivity keeping paths in digraphs", "authors": ["Hojin Chu", "Boram Park", "Homoon Ryu"], "abstract": "Mader conjectured that every $k$-strong digraph $D$ with minimum semidegree $δ^0(D)\\ge 2k+m-1$ contains a dipath $P$ of order $m$ such that $D-V(P)$ remains $k$-strong. For $k=1$, he obtained the weaker bound $δ^0(D)\\ge 2m$. We confirm the conjecture for $k=1$ by showing that the sharp bound $δ^0(D)\\ge m+1$ suffices. As a consequence, we show that for every integer $m\\ge2$, every strongly connected digraph $D$ with $δ^0(D)\\ge\\max\\{2,m-1\\}$ contains a dipath $P$ of order $m$ such that $D-A(P)$ is strongly connected.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-25T23:59:49+00:00", "updated": "2026-08-25T23:59:49+00:00", "abs_url": "http://arxiv.org/abs/2608.25240v1", "pdf_url": "https://arxiv.org/pdf/2608.25240v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학·조합론 중 directed graph의 connectivity 성질에 관한 논문으로, McMullen's problem(점 배치·convex position·realized matroid structure)과는 직접 관련이 없음.", "summary": "본 논문은 Mader의 추측을 부분적으로 해결하여, $k$-strong digraph에서 semidegree 조건 하에 특정 길이의 directed path를 찾되, 이 경로를 제거한 후에도 강연결성(strong connectivity)이 유지되는 구조를 증명한다. $k=1$일 때 최적 경계 $\\delta^0(D) \\ge m+1$을 확립하고, arc 제거 버전에서도 유사 결과를 도출한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.30481v1", "title": "The Multicolour Size--Ramsey Number of an Even Cycle", "authors": ["Lanchao Wang", "Xiaolin Wang"], "abstract": "We determine the $k$-colour size--Ramsey number of even cycles up to absolute constant factors. For every $k\\ge2$ and every even $n\\ge100\\log k$, \\[ \\widehat R_k(C_n)=Θ(k^2\\log k)n. \\] The lower bound follows from the corresponding result of Beke, Li and Sahasrabudhe for paths, while our upper bound improves the previous best estimate $O(k^{34}n)$ of Javadi, Kohayakawa and Miralaei.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-31T09:07:08+00:00", "updated": "2026-08-31T09:07:08+00:00", "abs_url": "http://arxiv.org/abs/2608.30481v1", "pdf_url": "https://arxiv.org/pdf/2608.30481v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "짝수 사이클의 크기-Ramsey 수를 결정하는 극단 그래프 이론 문제로, McMullen's problem(볼록 위치 점 배치, oriented matroid, 조합 구조)과는 직접적 관련이 없음.", "summary": "이 논문은 모든 $k \\geq 2$와 $n \\geq 100\\log k$에 대해 짝수 사이클 $C_n$의 $k$-색 크기-Ramsey 수가 $\\widehat{R}_k(C_n) = \\Theta(k^2\\log k)n$임을 보인다. 하한은 경로에 대한 기존 결과로부터 따르고, 상한은 이전의 $O(k^{34}n)$ 추정치를 개선한다.", "technique": "경로에 대한 Beke, Li, Sahasrabudhe의 결과 활용 및 상한 개선 기법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.29525v1", "title": "Anti-Ramsey Number for Suspension of Edge-Critical Graphs", "authors": ["Shuchao Li", "Haojie Zheng"], "abstract": "An edge-colored graph is called a rainbow graph if all its edges have distinct colors. The \\textit{anti-Ramsey number}, denoted by $\\ar(n,F),$ for a fixed graph $F$ and a positive integer $n$, is the maximum number of colors used in an edge-coloring of the complete graph $K_n$ that contains no rainbow copy of $F$. Meanwhile, the \\textit{Turán number}, denoted by $\\ex(n,F),$ for graph $F$ and $n$, is the maximum number of edges in an $n$-vertex graph that does not contain $F$ as a subgraph. For a vertex $v$ and a multiset $\\mathcal{H}$ of graphs, the \\textit{suspension} $\\mathcal{H} + v$ of $\\mathcal{H}$ is the graph obtained by connecting the vertex $v$ to all vertices of $H$ for each $H \\in \\mathcal{H}$. Let integers $k\\ge 1$ and $r\\ge 2$ be fixed, and suppose that $\\mathcal{H}_{k+1}=\\{H_1, H_2, \\ldots, H_{k+1}\\}+v$ satisfying $H_1, H_2, \\ldots, H_{k+1}$ are pairwise vertex-disjoint edge-critical graphs, and $χ(H_i)=r$ for $i=1,2,\\ldots, k+1$.In this paper, we determine $ \\ar(n,\\mathcal{H}_{k+1}) $ for $k\\ge 1$, $r\\ge 2$ and sufficiently large $n$. This result unifies and generalizes a result of Liu et al. (arXiv:2411.08475) concerning the friendship graph, and a result of Lu et al. (arXiv:2507.13165) on the intersecting cliques.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-30T03:07:18+00:00", "updated": "2026-08-30T03:07:18+00:00", "abs_url": "http://arxiv.org/abs/2608.29525v1", "pdf_url": "https://arxiv.org/pdf/2608.29525v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Anti-Ramsey 수와 edge-coloring 문제는 McMullen's problem의 convex position, oriented matroid, chirotope와 직접 관련이 없음.", "summary": "본 논문은 edge-critical 그래프의 suspension에 대한 anti-Ramsey 수 $\\ar(n,\\mathcal{H}_{k+1})$을 결정한다. 이는 friendship graph와 intersecting cliques 관련 선행 결과를 통합·일반화한다.", "technique": "Anti-Ramsey 수와 Turán 수의 관계를 이용하여 충분히 큰 $n$에 대해 정확한 값을 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.27405v1", "title": "Asymptotic Bounds for Online Ramsey Numbers of Stars versus Long Paths and Cycles", "authors": ["Sam Beilis", "Israel R. Curbelo", "Elizabeth R. Koizumi"], "abstract": "The online Ramsey game for graphs $G$ and $H$ is played on the infinite complete graph $K_\\mathbb{N}$. In each round, Builder chooses an edge, and Painter colors it red or blue. The online Ramsey number $\\tilde{r}(G,H)$ is the smallest integer $t$ for which Builder has a strategy guaranteeing a red copy of $G$ or a blue copy of $H$ within $t$ rounds. For every fixed integer $k\\ge4$, the best-known lower bounds for $\\tilde{r}(K_{1,k},P_n)$ and $\\tilde{r}(K_{1,k},C_n)$ are $\\left(\\frac{k+3}{4}+o(1)\\right)n$ as $n\\to\\infty$. We improve the corresponding asymptotic upper bounds from $(k+o(1))n$ to $\\left(\\frac{2k+4}{5}+o(1)\\right)n$ as $n\\to\\infty$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-27T17:34:20+00:00", "updated": "2026-08-27T17:34:20+00:00", "abs_url": "http://arxiv.org/abs/2608.27405v1", "pdf_url": "https://arxiv.org/pdf/2608.27405v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "온라인 Ramsey 게임은 그래프 이론의 조합 게임이지만, McMullen's problem의 convex position, oriented matroid, chirotope 등 이산기하학적 도구와는 직접적 연관이 없음.", "summary": "본 논문은 온라인 Ramsey 게임에서 별 그래프 $K_{1,k}$와 긴 경로 $P_n$, 사이클 $C_n$에 대한 점근적 상한을 개선한다. 기존 상한 $(k+o(1))n$에서 $\\left(\\frac{2k+4}{5}+o(1)\\right)n$으로 개선하여 하한 $\\left(\\frac{k+3}{4}+o(1)\\right)n$에 더 가까워졌다.", "technique": "Builder의 전략 최적화를 통한 점근적 상한 개선 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.27804v1", "title": "Grundy Total Domination and Skew Zero Forcing in Cartesian Products of Paths and Cycles", "authors": ["Fei-Huang Chang"], "abstract": "We determine the Grundy total domination number and the skew zero forcing number for every Cartesian product of two paths or cycles, thereby closing the nonmatching bounds previously known for these rectangular, cylindrical, and toroidal families. For $2\\le a\\le b$, \\[   Z_-(P_a\\square P_b)   =a-\\mathbf1_{\\{a\\ {\\rm odd},\\,b\\ {\\rm even}\\}}. \\] For $p\\ge2$ and $c\\ge3$, \\[   Z_-(P_p\\square C_c)=   \\begin{cases}   \\min\\{p,c\\},&c\\text{ is odd},   \\min\\{2p,c\\},&c\\text{ is even}.   \\end{cases} \\] Finally, for $3\\le a\\le b$, \\[   Z_-(C_a\\square C_b)=   \\begin{cases}   2a-1,&a=b\\text{ odd},   2a,&a=b\\text{ even},   \\min\\{b,2a\\},&a<b,\\ a\\text{ odd},   a,&a<b,\\ a\\text{ even},\\ b\\text{ odd},   2a,&a<b,\\ a,b\\text{ even}.   \\end{cases} \\] In every case, $γ_{\\mathrm{gr}}^t(G)=|V(G)|-Z_-(G)$. The path-containing lower bounds use Kronecker differences of skew-symmetric or hollow symmetric factor matrices, and they also determine maximum skew nullity and minimum skew rank. They further produce an infinite family for which maximum skew nullity is strictly smaller than skew zero forcing. The new cycle--cycle lower bounds use a cyclic column-defect estimate, applied to complete columns when the shorter cycle is odd and, after a one-sided bipartite reduction, to half-columns when both cycles are even. Explicit forcing constructions give matching upper bounds throughout.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-28T00:46:09+00:00", "updated": "2026-08-28T00:46:09+00:00", "abs_url": "http://arxiv.org/abs/2608.27804v1", "pdf_url": "https://arxiv.org/pdf/2608.27804v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산 기하학이나 볼록 배치, oriented matroid, 실현성 문제와 직접적인 연관이 없고, 그래프 domination 수와 영 인수(zero forcing) 수의 결정론적 계산에 집중하는 순수 그래프 이론 논문입니다.", "summary": "경로와 순환의 데카르트 곱 그래프에서 Grundy 전체 지배수(Grundy total domination number)와 skew zero forcing number를 완전히 결정했습니다. 저자는 직사각형, 원기둥, 토로이달 격자 계열에 대한 일치하는 상한과 하한을 제시하여 이전의 열린 경계를 종결합니다.", "technique": "Kronecker 차분을 이용한 skew-symmetric 및 hollow symmetric 인수 행렬의 하한 도출, 그리고 cyclic column-defect 추정을 통한 순환-순환 그래프의 하한 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.24820v1", "title": "Braces on the cohomology of noncrossing 2-partitions", "authors": ["Paul Laubie"], "abstract": "We show that the operadic structure on the cohomology of the poset of noncrossing 2-partitions is isomorphic to the Brace operad.", "categories": ["math.CO", "math.KT", "math.RA"], "primary_category": "math.CO", "published": "2026-08-25T16:59:26+00:00", "updated": "2026-08-25T16:59:26+00:00", "abs_url": "http://arxiv.org/abs/2608.24820v1", "pdf_url": "https://arxiv.org/pdf/2608.24820v1", "journal_ref": "", "doi": "", "comment": "16 pages. Comments are welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Noncrossing 2-partitions와 poset 구조는 조합론적 대상이지만, McMullen's problem(볼록성과 일반적 위치의 점 배치, oriented matroid)과는 직접적 관련성이 없음.", "summary": "본 논문은 noncrossing 2-partitions의 poset 위의 cohomology에 대한 operadic 구조를 연구하며, 이 구조가 Brace operad와 동형임을 보입니다.", "technique": "Operadic 구조와 cohomology를 이용한 poset 불변량 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.28585v1", "title": "The Tutte polynomial determines the linear coefficient of the Ehrhart polynomial", "authors": ["Erik Panzer"], "abstract": "We prove a formula for the linear coefficient of the Ehrhart polynomial in terms of the Tutte polynomial. Furthermore, we characterize the matroids that extremize this Ehrhart coefficient, proving a conjecture of Ferroni.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-28T17:57:50+00:00", "updated": "2026-08-28T17:57:50+00:00", "abs_url": "http://arxiv.org/abs/2608.28585v1", "pdf_url": "https://arxiv.org/pdf/2608.28585v1", "journal_ref": "", "doi": "", "comment": "13 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Ehrhart 다항식과 matroid는 모두 조합론의 중요 대상이지만, McMullen's problem은 convex position과 point orientation에 관한 것으로 본 논문의 matroid의 Ehrhart 계수 최적화와는 직접적 관련이 없음.", "summary": "Tutte 다항식을 이용하여 Ehrhart 다항식의 선형 계수를 계산하는 공식을 증명하였다. 또한 이 Ehrhart 계수를 최적화하는 matroid들을 특성화하여 Ferroni의 추측을 증명하였다.", "technique": "Tutte 다항식과 Ehrhart 다항식 사이의 관계식 유도를 통한 계수 공식.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.10402v1", "title": "Superpolynomial lower bounds for vertex numbers of real projective space triangulations via a topological Figiel-Lindenstrauss-Milman theorem", "authors": ["Florian Frick", "Kaave Hosseini", "Eric Myzelev", "Arya Narnapatti", "Aliaksei Vasileuski"], "abstract": "We prove that every simplicial triangulation of real projective $d$-space has $\\exp(Ω(\\sqrt d))$ vertices. Together with known constructions, this determines the minimum vertex number as $μ_d=\\exp(d^{1/2+o(1)})$. The result follows from a topological generalization of the Figiel--Lindenstrauss--Milman inequality, answering a recent question of Frick, Hosseini, and Vasileuski: a finite strongly regular CW complex with a free cellular involution, $v$ vertices, and $f$ maximal cells has $\\mathbb{Z}/2$-index at most $O(\\log v\\log f)$. We bound the dimensions of Morse cells by a trace estimate for a constrained Hessian, obtaining a Morse-theoretic proof of the classical inequality for centrally symmetric polytopes. As further applications of this inequality, we give an $\\exp(Ω(\\sqrt t))$ lower bound for the order of a triangle-free topologically $t$-chromatic graph and bound the index of sign complexes by $O(d\\log^2 N)$ for total matrices and $O(d\\log^3 N)$ for partial matrices, where $N\\geq2$ is the number of columns and $d\\geq1$ is the VC dimension.", "categories": ["math.CO", "math.GT"], "primary_category": "math.CO", "published": "2026-09-09T16:22:33+00:00", "updated": "2026-09-09T16:22:33+00:00", "abs_url": "http://arxiv.org/abs/2609.10402v1", "pdf_url": "https://arxiv.org/pdf/2609.10402v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 실사영공간의 삼각분할 꼭짓점 수의 하한을 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid 의 acyclic reorientation 등)와 직접적인 관련이 없다.", "summary": "실사영 $d$-공간의 단체 삼각분할은 반드시 $\\exp(\\Omega(\\sqrt{d}))$개의 꼭짓점을 가짐을 증명하여, 최소 꼭짓점 수가 $\\mu_d = \\exp(d^{1/2+o(1)})$임을 결정한다. 이는 Figiel–Lindenstrauss–Milman 부등식의 위상적 일반화를 통해 얻어지며, 자유 셀형 대합(free cellular involution)을 갖는 유한 강정칙 CW 복합체에서 $\\mathbb{Z}/2$-index가 $O(\\log v \\log f)$로 유계됨을 보인다. 추가 응용으로 삼각형-없는 위상적 $t$-채색 그래프의 크기 하한 및 부호 복합체(sign complex)의 index 상한도 도출된다.", "technique": "Morse 이론적 접근(제약된 헤시안의 트레이스 추정을 통한 Morse 셀 차원 제한)과 위상적 Figiel–Lindenstrauss–Milman 부등식의 일반화.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.17493v1", "title": "Twisted Bracelets for Sorting by Transpositions: the Transposition Diameter of $S_{16}$", "authors": ["Luiz A. G. Silva", "Luis A. B. Kowada", "Noraí R. Rocco", "Maria E. M. T. Walter"], "abstract": "Sorting By Transpositions (SBT) seeks the minimum number of transpositions required to sort a permutation $π$ on $n$ symbols into the identity $ι$. Let $N=n+1$. A cyclic-target pair $(ω,β)$ consists of an even permutation $ω$ and an $N$-cycle $β$ such that $ρ=ωβ$ is also an $N$-cycle. An SBT instance is the special case $(\\barι {\\barπ}^{-1},\\barπ)$, where $\\barπ$ and $\\barι$ are $N$-cycles corresponding to $π$ and $ι$, respectively, and $\\barι {\\barπ}^{-1}\\barπ=\\barι$, so its target is $\\barι$. For each prescribed fixed-point-free cycle type with specified cycle orientations relative to $β$, fixed-content words encode the corresponding permutations $ω$. Colors identify cycles and ranks record their orientations. A word is realizable when the associated product $ρ=ωβ$ is an $N$-cycle. Permuting equal-part colors and shifting rank origins give auxiliary symmetries. Together with word rotation and position reflection combined with rank inversion, they define a twisted dihedral action. Its orbits are twisted bracelets, and the realizable orbits are in bijection with extended-toric equivalence classes of cyclic-target pairs. Here extended-toric equivalence means Eriksson et al.'s toric equivalence with reflection adjoined. This correspondence yields exact orbit counts and direct generation of one representative per realizable extended-toric class. The transposition diameter $TD(n)$ is the largest transposition distance in $S_n$. Previously, $9\\leq TD(16)\\leq10$ was known, and $16$ was the only unresolved value for $n\\leq17$. Combining fixed-point contraction and structural reductions with exhaustive verification of the remaining twisted bracelets, we prove $TD(16)=9$, closing a twenty-five-year gap.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T17:35:37+00:00", "updated": "2026-09-15T17:35:37+00:00", "abs_url": "http://arxiv.org/abs/2609.17493v1", "pdf_url": "https://arxiv.org/pdf/2609.17493v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 치환의 전위(transposition) 지름을 다루는 조합론 논문으로, McMullen 문제(볼록 위치, oriented matroid, 실현 가능성)와 직접적인 관련이 없다.", "summary": "이 논문은 $n$개의 기호에 대한 치환을 전위(transposition)로 정렬하는 데 필요한 최소 전위 수, 즉 전위 지름 $TD(n)$을 연구한다. twisted bracelet(꼬인 팔찌)이라는 조합론적 구조와 extended-toric 동치류를 도입하여 cyclic-target 쌍을 체계적으로 분류하고, 소진적 검증을 통해 25년간 미해결이었던 $TD(16)=9$를 증명한다.", "technique": "fixed-content word의 twisted dihedral action에 의한 궤도(twisted bracelet) 분류, fixed-point contraction 및 구조적 축소를 결합한 소진적 검증.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.16195v1", "title": "Combinatorial slicing problems of polytopes: How (not) to reconstruct a polytope from its slices", "authors": ["Anna Birkemeyer", "Anouk E. Brose", "Marie-Charlotte Brandenburg", "Niklas Prün"], "abstract": "We study combinatorial aspects of hyperplane sections of polytopes, focusing on how much the combinatorics of the sections determines the combinatorics of the original polytope. We show that, in general, combinatorial information about the sections is not enough to determine even the $f$-vector of the polytope. In contrast, for sufficiently generic simple polytopes, the function recording the number of vertices of each central section determines the full combinatorial type. We organize different combinatorial slicing properties into hierarchies, separately for affine and central sections, according to the level of combinatorial structure they determine on the polytope. In analogy with classical metric slicing problems, we formulate combinatorial analogues of the Busemann-Petty problem and Bourgain's slicing problem by replacing volume with face numbers, and show that they fail in every dimension and every face dimension.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T18:27:49+00:00", "updated": "2026-09-14T18:27:49+00:00", "abs_url": "http://arxiv.org/abs/2609.16195v1", "pdf_url": "https://arxiv.org/pdf/2609.16195v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체의 하이퍼평면 단면의 조합론적 성질을 연구하며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 다면체의 하이퍼평면 단면(슬라이스)의 조합론적 정보가 원래 다면체의 조합론적 구조를 얼마나 결정하는지를 연구한다. 일반적으로 단면의 조합론적 정보만으로는 다면체의 $f$-벡터조차 결정할 수 없지만, 충분히 일반적인 단순 다면체(simple polytope)에 대해서는 중심 단면의 꼭짓점 수 함수가 완전한 조합론적 유형을 결정함을 보인다. 또한 Busemann-Petty 문제와 Bourgain의 슬라이싱 문제의 조합론적 유사체를 공식화하고, 이들이 모든 차원 및 모든 면 차원에서 성립하지 않음을 보인다.", "technique": "아핀 단면과 중심 단면을 분리하여 조합론적 슬라이싱 성질을 계층적으로 조직화하고, 고전적 계량 슬라이싱 문제의 조합론적 유사체를 구성하는 방법론을 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.14895v1", "title": "Level structures on tropical abelian varieties", "authors": ["Eran Assaf", "Madeline Brandt", "Juliette Bruce", "Melody Chan", "Raluca Vlad"], "abstract": "We introduce level structures on tropical abelian varieties and give a modular interpretation of $A_g[m]^{\\mathrm{trop}}$, the tropicalization of the moduli space $\\mathcal{A}_g[m]$ of principally polarized abelian varieties with level $m$ structure. We study the case of abelian surfaces in greater depth. The link of $A_2[m]^{\\mathrm{trop}}$ is an explicit simplicial complex whose vertices are the primitive vectors of $(\\mathbb{Z}/m\\mathbb{Z})^4$ up to sign. As a topological space, this link is homotopic to a wedge sum of closed orientable surfaces and circles; we compute the number of each of these and the genera of the surfaces. We deduce the weight zero compactly supported rational cohomology of $\\mathcal{A}_2[m]$, completing a calculation of Oda-Schwermer from 1990.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-09-14T01:29:26+00:00", "updated": "2026-09-14T01:29:26+00:00", "abs_url": "http://arxiv.org/abs/2609.14895v1", "pdf_url": "https://arxiv.org/pdf/2609.14895v1", "journal_ref": "", "doi": "", "comment": "19 pages, 3 figures; comments welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 열대 아벨 다양체의 레벨 구조와 모듈라이 공간의 코호몰로지를 다루며, McMullen 문제(볼록 위치·oriented matroid·점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 열대 아벨 다양체(tropical abelian varieties)에 레벨 구조를 도입하고, 레벨 $m$ 구조를 가진 주편극 아벨 다양체의 모듈라이 공간 $\\mathcal{A}_g[m]$의 열대화 $A_g[m]^{\\mathrm{trop}}$에 대한 모듈러 해석을 제공한다. 아벨 곡면($g=2$) 경우에 집중하여, $A_2[m]^{\\mathrm{trop}}$의 링크가 $(\\mathbb{Z}/m\\mathbb{Z})^4$의 부호 동치류 원시 벡터를 꼭짓점으로 하는 단체 복합체(simplicial complex)임을 규명하고, 이 위상 공간이 닫힌 가향 곡면과 원의 쐐기합(wedge sum)에 호모토픽임을 보인다. 이를 통해 1990년 Oda-Schwermer의 미완 계산을 완성하여 $\\mathcal{A}_2[m]$의 무게 0 컴팩트 지지 유리 코호몰로지를 결정한다.", "technique": "열대 기하학(tropical geometry)과 단체 복합체 위상 분석을 결합하여 레벨 구조의 모듈러 해석 및 코호몰로지 계산을 수행한다.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2609.14645v1", "title": "A short polyhedral proof of the infinitesimal Stoker conjecture", "authors": ["Martin Winter"], "abstract": "The infinitesimal Stoker conjecture states that an infinitesimal deformation of a convex polytope that preserves all dihedral angles also preserves all normal directions up to isometry. We give a short polyhedral proof, self-contained up to assuming spectral and geometric properties of the Izmestiev matrix.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-09-13T16:31:03+00:00", "updated": "2026-09-13T16:31:03+00:00", "abs_url": "http://arxiv.org/abs/2609.14645v1", "pdf_url": "https://arxiv.org/pdf/2609.14645v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체의 이면각 보존 변형에 관한 infinitesimal Stoker 추측을 다루며, McMullen 문제(점 배치·oriented matroid 관련)와 직접적인 관련이 없다.", "summary": "이 논문은 볼록 다면체의 무한소 변형(infinitesimal deformation)이 모든 이면각(dihedral angle)을 보존하면 등거리 변환(isometry)을 제외하고 모든 법선 방향(normal direction)도 보존된다는 infinitesimal Stoker 추측에 대한 짧고 자기완결적인 다면체적 증명을 제시한다. 증명은 Izmestiev 행렬의 스펙트럼적·기하학적 성질을 가정한 위에서 전개된다.", "technique": "Izmestiev 행렬(Izmestiev matrix)의 스펙트럼 및 기하학적 성질을 활용한 다면체적(polyhedral) 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.13757v1", "title": "The crossing number and the unit-distance crossing number of the Hamming graphs H(d,3)=K_3^{box d}, and their realizations over many coordinate fields", "authors": ["Haroldo Costa Silva Filho"], "abstract": "The Hamming graph H(d,3)=K_3^{box d} (n=3^d vertices) is the graph of single-symbol errors of ternary codes, yet we ask a geometric question of it: can it be drawn in the plane with every edge exactly one unit long and no two non-adjacent vertices a unit apart? It can, for every d, joining two problems into one.   Where does it live? As a Minkowski sum of unit triangles, each H(d,3) has a hidden flexibility carrying its coordinates up the constructibility ladder (compass, origami, and beyond), so one graph is realizable over many number fields at once, in the plane and in R^3 (edim(H(d,q))=q-1). Yet almost every faithful realization is transcendental: the Galois picture is a measure-zero shadow of a vast transcendental continuum, matching the exists-R hardness of unit-distance recognition.   How crowded must a unit drawing be? We separate the ordinary crossing number from a unit-distance crossing number (absent from Schaefer's survey), and one recursion H(d,3)=H(d-1,3) box K_3 controls both. We prove cr(H)=Theta(n^2), with sharp one-page constant 7/6; and Omega(n^2) <= udcr(H) <= O(n^2 log n) by concentration, plus a closed-form majorant (3/2)n^2(L^2-L+1), L=log_3 n. The least-crossing drawing we find is constructible (origami): field and crossings are two readings of one geometry. All claims are verified computationally; the lower bound udcr=Omega(n^2 log n) is the central open problem.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-12T07:08:19+00:00", "updated": "2026-09-12T07:08:19+00:00", "abs_url": "http://arxiv.org/abs/2609.13757v1", "pdf_url": "https://arxiv.org/pdf/2609.13757v1", "journal_ref": "", "doi": "", "comment": "45 pages. Reproducible Python code included", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 해밍 그래프의 교차수(crossing number)와 단위거리 실현(unit-distance realization)을 다루며, McMullen 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "해밍 그래프 $H(d,3)=K_3^{\\boxtimes d}$ ($n=3^d$ 꼭짓점)에 대해 단위거리 그래프로서의 평면 실현 가능성을 연구하고, 교차수(crossing number)와 단위거리 교차수(unit-distance crossing number)를 분리하여 분석한다. 귀납적 관계 $H(d,3)=H(d-1,3)\\boxtimes K_3$를 이용해 $\\mathrm{cr}(H)=\\Theta(n^2)$ (상수 $7/6$)와 $\\Omega(n^2)\\le\\mathrm{udcr}(H)\\le O(n^2\\log n)$을 증명하며, 닫힌 형태의 상계 $(3/2)n^2(L^2-L+1)$, $L=\\log_3 n$도 제시한다. 또한 좌표 체계의 관점에서 실현이 대수적(작도 가능, origami)에서 초월적 연속체까지 다양하게 존재함을 보인다.", "technique": "Minkowski 합 구조와 귀납적 재귀 $H(d,3)=H(d-1,3)\\boxtimes K_3$를 이용한 교차수 점화식 분석, 집중 부등식(concentration inequality)을 통한 하계 도출.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.13122v1", "title": "A base-$8$ upper bound for planar peeling sequences", "authors": ["André Hisatsuga", "Griffin Johnston", "Rafael Miyazaki"], "abstract": "Let $g(n)$ denote the minimum number of peeling sequences among all $n$-point sets in general position in the plane. Dumitrescu and Tóth proved an exponential upper bound with base $12.29$, and Simon subsequently lowered the base to $9.78$. Using the same recursive construction, we prove \\begin{equation*}   g(n) \\le (8+o(1))^n. \\end{equation*}", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-11T17:51:07+00:00", "updated": "2026-09-11T17:51:07+00:00", "abs_url": "http://arxiv.org/abs/2609.13122v1", "pdf_url": "https://arxiv.org/pdf/2609.13122v1", "journal_ref": "", "doi": "", "comment": "6 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 점 집합의 peeling sequence 수에 관한 조합론 문제를 다루며, McMullen 문제나 Larman 추측과 직접적 관련이 없다.", "summary": "이 논문은 평면에서 일반 위치(general position)에 있는 $n$개 점 집합에서 peeling sequence의 최소 개수 $g(n)$에 대한 상한을 개선한다. Dumitrescu-Tóth의 밑수 $12.29$, Simon의 $9.78$에 이어, 동일한 재귀적 구성(recursive construction)을 활용하여 $g(n) \\le (8+o(1))^n$을 증명한다.", "technique": "기존 재귀적 구성(recursive construction)을 정밀화하여 지수적 상한의 밑수를 $9.78$에서 $8+o(1)$로 낮춤.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2609.12640v1", "title": "Non-convex unit-edge polytopes on kissing configurations in dimensions 5-7", "authors": ["Matthew Self"], "abstract": "All nine known conjecturally optimal non-lattice kissing configurations in dimensions 5, 6, and 7 are the vertex sets of polytopes with only unit edges. Eight of the nine are non-convex, and the contact polytopes, the convex hulls of the same points, have longer edges. The edges of the unit-edge polytopes are exactly the contacts of the configuration. All but two of the nine are constructed from the lattice contact polytope in the same dimension by splitting some of its facets and reassembling the pieces. This is a geometric construction, distinct from the constructions by layers. The facets that fold when split are consecutive members of the Gosset series $k_{21}$, and a split in dimension $n$ folds to the inner product $1/(10-n)$: $1/5$, $1/4$, or $1/3$. These are the inner products by which the contact polytopes differ from the lattice one. All 12 unit-edge polytopes, the nine and the three lattice ones, are creased, a class we define that extends convexity by admitting shallow folds that reach no more than halfway. Each is the only creased unit-edge polytope on its vertex set. Every statement is certified in exact arithmetic.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-09-11T09:41:13+00:00", "updated": "2026-09-11T09:41:13+00:00", "abs_url": "http://arxiv.org/abs/2609.12640v1", "pdf_url": "https://arxiv.org/pdf/2609.12640v1", "journal_ref": "", "doi": "", "comment": "16 pages, 3 figures, 5 tables. Ancillary files contain the verification code and data (Python standard library only)", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 5~7차원 키싱(kissing) 배치와 unit-edge polytope에 관한 것으로, McMullen 문제(일반 위치 점 배치, oriented matroid, f(5)=11 등)와 직접적인 관련이 없다.", "summary": "이 논문은 5, 6, 7차원에서 알려진 9개의 비격자(non-lattice) 최적 키싱 배치가 모두 단위 모서리(unit edge)만을 갖는 폴리토프의 꼭짓점 집합임을 보인다. 그 중 8개는 비볼록이며, 이들 unit-edge 폴리토프의 모서리는 정확히 키싱 배치의 접촉(contact)에 해당한다. 저자는 'creased' 폴리토프라는 새로운 볼록성 일반화 개념을 도입하고, 12개의 unit-edge 폴리토프 각각이 자신의 꼭짓점 집합 위에서 유일한 creased unit-edge 폴리토프임을 정확 산술(exact arithmetic)로 검증한다.", "technique": "격자 접촉 폴리토프(lattice contact polytope)의 일부 면(facet)을 분할·재조합하는 기하학적 구성(Gosset 급수 $k_{21}$ 활용)과 'creased' 폴리토프 개념 정의, 그리고 정확 산술 검증.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12483v1", "title": "The affine Tverberg theorem revisited", "authors": ["Sergey Avvakumov", "Roman Karasev"], "abstract": "We prove the Bárány--Kalai--Tverberg conjecture extending the affine version of Tverberg's theorem to simplicial balls and polytopes other than the simplex:   For any affine map $φ: P\\to \\mathbb R^d$ from a convex polytope $P$ of dimension $N=(d+1)(r-1)$ with $r\\geq 2$, there exist $r$ pairwise disjoint faces $F_1,\\ldots,F_r\\subset\\partial P$ such that $φ(F_1)\\cap\\dots\\capφ(F_r)\\neq\\varnothing$. A similar statement holds for a simplicial ball $P$ with $φ$ assumed affine on all of its faces.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-09-11T06:29:54+00:00", "updated": "2026-09-11T06:29:54+00:00", "abs_url": "http://arxiv.org/abs/2609.12483v1", "pdf_url": "https://arxiv.org/pdf/2609.12483v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Tverberg 정리의 아핀 버전에 관한 연구로, McMullen 문제(볼록 위치 점 배치 및 oriented matroid 관련)와 직접적인 연관성은 없다.", "summary": "이 논문은 Bárány–Kalai–Tverberg 추측을 증명하여, 차원 $N=(d+1)(r-1)$인 볼록 다면체 $P$에서 $\\mathbb{R}^d$로의 아핀 사상 $\\varphi$에 대해 경계 $\\partial P$에 서로 소인 $r$개의 면 $F_1,\\ldots,F_r$이 존재하여 $\\varphi(F_1)\\cap\\cdots\\cap\\varphi(F_r)\\neq\\varnothing$임을 보인다. 이는 Tverberg 정리의 아핀 버전을 단체(simplex) 이외의 단체적 볼(simplicial ball) 및 볼록 다면체로 확장한 결과이다.", "technique": "초록만으로는 구체적 증명 기법이 명시되지 않아 불확실.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12414v1", "title": "Torus actions on compactified braid varieties and polytopality of subword complexes", "authors": ["Lara Bossinger", "Mikhail Gorsky", "José Simental"], "abstract": "Every cluster variety admits an action of its cluster dilation group. We prove that, in the case of braid varieties for simple Lie groups, this action always extends to a regular action on each of the brick compactifications. We explore two applications of this result. First, we show that any closed Richardson variety admits a faithful action of a torus of rank the Kazhdan-Lusztig $d$-invariant, answering affirmatively a recent question of E. Gorsky--S. Kim--M. Sherman-Bennett. The same result holds for projected Richardson varieties. Second, we show that the braid variety is a torus if and only if for each of its brick compactifications, the polar dual of the moment polytope for this action realizes the corresponding subword complex. The braid words satisfying this property turn out to be precisely the double root free words of V. Pilaud and C. Stump. This provides a novel approach to the longstanding open question of the polytopality of spherical subword complexes asked by A. Knutson and E. Miller, and in particular gives infinite families of subword complexes admitting polytopal realizations in dimension higher than the rank of the corresponding Coxeter group. As a common consequence of these two applications, we classify all Bruhat intervals in finite crystallographic Coxeter groups which are isomorphic to face lattices of convex polytopes via certain double root free words.", "categories": ["math.AG", "math.CO", "math.RT"], "primary_category": "math.AG", "published": "2026-09-11T04:05:45+00:00", "updated": "2026-09-11T04:05:45+00:00", "abs_url": "http://arxiv.org/abs/2609.12414v1", "pdf_url": "https://arxiv.org/pdf/2609.12414v1", "journal_ref": "", "doi": "", "comment": "33 pages, comments welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 braid variety, Richardson variety, subword complex의 polytopality에 관한 것으로, McMullen 문제(d=5에서 convex/general position 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 braid variety의 cluster dilation group 작용이 각 brick compactification으로 확장됨을 증명하고, 두 가지 응용을 탐구한다. 첫째, 닫힌 Richardson variety가 Kazhdan-Lusztig $d$-불변량 rank의 torus의 faithful 작용을 가짐을 보이며, 둘째, braid variety가 torus인 경우 brick compactification의 moment polytope의 polar dual이 해당 subword complex를 실현함을 특성화한다. 결과적으로 Knutson–Miller가 제기한 구면 subword complex의 polytopality 문제에 새로운 접근법을 제공하고, Coxeter group의 rank보다 높은 차원에서 polytopal 실현을 갖는 무한 족을 구성한다.", "technique": "Cluster dilation group의 torus 작용을 brick compactification으로 확장하고, moment polytope의 polar dual을 통해 subword complex의 polytopal 실현을 분석하는 기법을 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.11599v1", "title": "Some results on Archdeacon's conjecture for rotation systems", "authors": ["Arahat Chikkatur", "Ji Zeng"], "abstract": "A rotation system on $n$ elements assigns to each element a cyclic order of the other $n-1$ elements. A four-element subset is non-planar if its induced rotation system cannot be realized by a crossing-free drawing of $K_4$. As a combinatorial strengthening of Hill's conjecture on the crossing number of the complete graph, Archdeacon conjectured that every rotation system on $n$ elements has at least $H(n)=\\frac{1}{4} \\lfloor\\frac {n}{2}\\rfloor \\lfloor\\frac{n-1}{2}\\rfloor \\lfloor\\frac{n-2}{2}\\rfloor \\lfloor\\frac{n-3}{2}\\rfloor$ non-planar four-element subsets.   We computationally verify Archdeacon's conjecture for $n\\leq 10$ and show that every extremal rotation system in these orders is realizable by a simple drawing. With computer assistance, we prove that every rotation system on $n$ elements has at least $(8/9 - o(1)) H(n)$ non-planar four-element subsets. We also present a proof by hand for a weaker lower bound of $(2/3-o(1)) H(n)$. Finally, extending recent work of Felsner on antipodal pairs in drawings, we show that Archdeacon's conjecture holds for antipodally shellable rotation systems.", "categories": ["cs.CG", "math.CO"], "primary_category": "cs.CG", "published": "2026-09-10T14:23:07+00:00", "updated": "2026-09-10T14:23:07+00:00", "abs_url": "http://arxiv.org/abs/2609.11599v1", "pdf_url": "https://arxiv.org/pdf/2609.11599v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 회전 시스템(rotation system)과 완전그래프의 교차수(crossing number)에 관한 Archdeacon 추측을 다루며, McMullen 문제(볼록/일반위치 점 배치, oriented matroid)와 직접적인 관련이 없다.", "summary": "이 논문은 $n$개 원소의 회전 시스템에서 비평면(non-planar) 4원소 부분집합의 수가 $H(n)=\\frac{1}{4}\\lfloor\\frac{n}{2}\\rfloor\\lfloor\\frac{n-1}{2}\\rfloor\\lfloor\\frac{n-2}{2}\\rfloor\\lfloor\\frac{n-3}{2}\\rfloor$ 이상임을 주장하는 Archdeacon 추측을 연구한다. 컴퓨터를 활용해 $n\\leq 10$에 대해 추측을 검증하고, 모든 회전 시스템이 적어도 $(8/9-o(1))H(n)$개의 비평면 4원소 부분집합을 가짐을 증명하였으며, 손으로 증명 가능한 $(2/3-o(1))H(n)$ 하한도 제시한다. 또한 antipodally shellable 회전 시스템에 대해 Archdeacon 추측이 성립함을 보인다.", "technique": "컴퓨터 기반 완전 탐색(computational verification), 조합론적 하한 분석, Felsner의 antipodal pair 이론 확장.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.10701v1", "title": "The $E_6$ Restricted Hyperplane Arrangement and its $E_7$ Shadow: Weyl Transport on a Minuscule Bruhat Poset", "authors": ["Saber Ahmed", "Mboyo Esole"], "abstract": "We study the restricted fan cut inside the dual fundamental Weyl chamber by the weights of a $27$-dimensional minuscule representation of $E_6$; the two such representations are dual and give the same arrangement.   Only $11$ of the $27$ weights have kernels meeting its interior, and we prove that they determine the entire fan. It has exactly $14$ chambers and $18$ extreme rays, every chamber is a six-dimensional simplicial cone, and we determine all facets, rays, and incidence relations. The chamber count was previously obtained by Diaconescu and Entin; the simplicial structure, extreme rays, and incidence data are new. The geometry of the $27$ lines on a cubic surface then explains and organizes the resulting chamber architecture. We also enumerate all faces, compute both characteristic polynomials---the arrangement is not supersolvable---together with lattice indices and projective chamber volumes, and describe the oriented matroid.   Our main result is representation-theoretic. A distinguished $14$-element visible subposet of the minuscule $\\mathbf{56}$ of $E_7$, defined entirely inside $E_7$, has Hasse diagram equal to the chamber adjacency graph of the $E_6$ arrangement. Three canonical $7+7$ splittings of it, of types $A_7$, $D_7$, and $E_7$, are the visible traces of Levi-center $\\mathfrak{u}(1)$-charge decompositions of the $\\mathbf{56}$ and reproduce the three level-$8$ decompositions on the $E_6$ side. More strongly, the simple-root labels on its covers, transported by minimal-length coset representatives, recover chamber by chamber all six facets and, globally, the $11$ active weight hyperplanes and the boundary walls of the dual Weyl chamber. Thus the $E_7$ shadow records not merely the chamber graph but, once matched with the independent $E_6$ classification, the full local wall architecture of $I(E_6,\\mathbf{27})$.", "categories": ["math.RT", "hep-th", "math.AG", "math.CO"], "primary_category": "math.RT", "published": "2026-09-09T18:00:49+00:00", "updated": "2026-09-09T18:00:49+00:00", "abs_url": "http://arxiv.org/abs/2609.10701v1", "pdf_url": "https://arxiv.org/pdf/2609.10701v1", "journal_ref": "", "doi": "", "comment": "118 pages, 9 sections, 4 appendices, 23 figures, 24 tables, 61 references", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 $E_6$의 27차원 표현에 의한 hyperplane arrangement와 $E_7$의 minuscule 포셋을 연구하는 표현론·대수기하 논문으로, McMullen 문제(convex position, oriented matroid realizability 등)와 직접적 관련이 없다.", "summary": "$E_6$의 27차원 minuscule 표현의 weights로 결정되는 dual fundamental Weyl chamber 내부의 restricted hyperplane arrangement $I(E_6,\\mathbf{27})$를 완전히 분류하여, 정확히 14개의 chamber와 18개의 extreme ray를 가지며 모든 chamber가 6차원 simplicial cone임을 증명한다. 또한 $E_7$의 minuscule $\\mathbf{56}$ 표현 내의 14원소 visible subposet의 Hasse diagram이 $E_6$ arrangement의 chamber 인접 그래프와 일치함을 보인다. 이를 통해 $E_7$의 구조가 $E_6$ arrangement의 국소적 wall architecture 전체를 부호화함을 밝힌다.", "technique": "Weyl group의 최소 길이 coset representative에 의한 simple-root label의 chamber별 transport(Weyl Transport)와 oriented matroid 기술, 특성다항식 계산.", "connections": "", "keyword_hits": ["oriented matroid"], "source": "filter"}, {"id": "2609.10257v1", "title": "An approximate counterexample to the Barker--Larman problem in dimension $4$", "authors": ["J. Haddad"], "abstract": "The Barker--Larman problem asks if a convex body $K \\subseteq \\mathbb R^n$ containing the Euclidean ball $\\mathbb B_n$, such that all the sections of $K$ by hyperplanes tangent to $\\mathbb B_n$ have constant $(n-1)$-dimensional volume, must necessarily be a Euclidean ball.   In this paper we show a result pointing to a negative answer in dimension $4$.   Taking $λ_0 = 4 \\sqrt{3}π$ and any $N \\in \\mathbb N$, we obtain the existence of a family of convex bodies $K_{λ,N}$ with $λ\\in (λ_0-r_N, λ_0 + r_N)$, such that the sections of $K_{λ,N}$ by hyperplanes tangent to the Euclidean ball, have area within $c |λ- λ_0|^{\\frac{N+1}2}$ of $λ$, while the difference between outradius and inradius of $K_{λ,N}$ is larger than $C |λ- λ_0|$.   The bodies $K_{λ,N}$ are constructed via radial functions as   \\[ρ_{K_{λ,N}}(t) = \\cos\\left( \\sum_{n=0}^N \\frac{(λ-λ_0)^n}{n!} \\varphi_n(t) \\right)^{-1},\\]   where $t \\in [0,2π), λ\\in \\mathbb R$ and $\\varphi_n$ are trigonometric polynomials that can be computed explicitly.   The convergence of the inner power series when $N \\to \\infty$ (which is left open) would imply a negative answer to the Barker--Larman problem in dimension $4$.   As an example we obtain a convex body whose outradius and inradius differ by more than $0.176$, and the area of the sections oscillate by less than $3 \\times 10^{-7}$.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-09T14:42:50+00:00", "updated": "2026-09-09T14:42:50+00:00", "abs_url": "http://arxiv.org/abs/2609.10257v1", "pdf_url": "https://arxiv.org/pdf/2609.10257v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Barker–Larman 문제(볼록체의 접선 단면 부피 조건)를 다루며, McMullen 문제·Larman 추측(점 배치·oriented matroid)과는 직접적인 관련이 없다.", "summary": "이 논문은 유클리드 구를 포함하는 볼록체 $K \\subseteq \\mathbb{R}^n$의 접선 초평면 단면 부피가 상수이면 $K$가 구여야 하는지를 묻는 Barker–Larman 문제에 대해, 차원 $4$에서 음의 답을 시사하는 결과를 제시한다. 구체적으로, $\\lambda_0 = 4\\sqrt{3}\\pi$ 근방에서 정의된 볼록체 족 $K_{\\lambda,N}$을 삼각 다항식 $\\varphi_n$으로 이루어진 방사 함수를 통해 구성하여, 단면 넓이의 변동은 $c|\\lambda-\\lambda_0|^{(N+1)/2}$로 극히 작지만 외접반지름과 내접반지름의 차이는 $C|\\lambda-\\lambda_0|$보다 크게 유지됨을 보인다. $N\\to\\infty$ 극한에서 내부 멱급수의 수렴(미해결)이 성립하면 차원 $4$에서 Barker–Larman 문제의 반례가 존재함을 의미한다.", "technique": "삼각 다항식 $\\varphi_n$으로 구성된 방사 함수 $\\rho_{K_{\\lambda,N}}(t) = \\cos\\!\\left(\\sum_{n=0}^N \\frac{(\\lambda-\\lambda_0)^n}{n!}\\varphi_n(t)\\right)^{-1}$를 이용한 볼록체의 명시적 구성.", "connections": "", "keyword_hits": ["larman"], "source": "filter"}, {"id": "2609.15178v1", "title": "Type C transpositions and strong marked tableaux", "authors": ["Yaozhou Fang", "Xing Gao"], "abstract": "Motivated by the Morse--Seelinger conjecture on type C $k$-Schur functions, we develop a permutation model for type C strong marked tableaux. Using type C transpositions, we give an explicit correspondence with the symmetric-core model that preserves the marking data. We also describe the induced affine Weyl group action on bounded partitions.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T08:00:55+00:00", "updated": "2026-09-14T08:00:55+00:00", "abs_url": "http://arxiv.org/abs/2609.15178v1", "pdf_url": "https://arxiv.org/pdf/2609.15178v1", "journal_ref": "", "doi": "", "comment": "26 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Type C Schur 함수와 marked tableaux는 조합론적 대상이지만, McMullen's problem의 convex polytope, oriented matroid, realizability와는 직접 관련이 없습니다.", "summary": "본 논문은 Morse-Seelinger 추측에 동기를 얻어 type C strong marked tableaux의 순열 모델을 개발합니다. Type C transposition을 이용하여 marking 데이터를 보존하는 symmetric-core 모델과의 명시적 대응을 제시하고, bounded partition에 유도되는 affine Weyl 군 작용을 기술합니다.", "technique": "Type C transposition을 이용한 순열 모델과 symmetric-core 모델 간의 전단사 대응 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.12372v1", "title": "4-Arc-Pancyclicity of Regular Multipartite Tournaments", "authors": ["Weihao Xia"], "abstract": "A multipartite tournament is an orientation of a complete multipartite graph. We prove that every $r$-regular $c$-partite tournament with common partite-set cardinality $α$ is $4$-arc-pancyclic whenever $c\\ge93$; that is, every arc belongs to a cycle of each length from $4$ to $cα$.   This confirms the conjecture of Zhou and Zhang for all sufficiently large $c$ and provides a multipartite analog of Alspach's arc-pancyclicity theorem. Moreover, we also give a construction to show that 4-arc-pancyclic is the best possible. Next, we prove that every arc belongs to at least $cα-α-1$ cycles of pairwise distinct lengths when $c\\ge7$ and $α\\ge2$. For regular $3$-partite tournaments with common partite-set cardinality $α\\ge2$, we obtain the sharp lower bound $α$, settling the remaining case of a conjecture of Xia, Cai, Guo, and Wang.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-11T02:42:13+00:00", "updated": "2026-09-11T02:42:13+00:00", "abs_url": "http://arxiv.org/abs/2609.12372v1", "pdf_url": "https://arxiv.org/pdf/2609.12372v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산 그래프 이론의 순환 구조 연구이나 McMullen의 문제(볼록위치 점 배치, oriented matroid, 실현 가능성)와는 직접적 관련이 없음.", "summary": "정규 다중 분할 토너먼트(regular multipartite tournaments)에서 모든 호(arc)가 길이 4부터 cα까지의 모든 사이클에 속하는 4-호-범순환(4-arc-pancyclicity) 성질을 증명함. c≥93일 때 이 성질이 성립함을 보이고 구성을 통해 4가 최적임을 보임.", "technique": "정규 토너먼트의 구조적 성질을 활용한 사이클 존재 증명; Zhou-Zhang 추측의 일반적 경우 해결", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15330v1", "title": "On Erdős Problem 767: Cycles with Chords", "authors": ["Xiaozheng Chen", "Bo Ning"], "abstract": "For integers $k\\ge 1$ and $n\\ge k+2$, let $g_k(n)$ be the maximum number of edges in an $n$-vertex graph containing no cycle with a vertex incident with at least $k$ chords. Erdős conjectured that $g_k(n)=(k+1)(n-k-1)$ for $n\\ge 2k+2$. Lewin found a counterexample. Bollobás later conjectured that there exists a function $n(k)$ such that $g_k(n)=(k+1)(n-k-1)$ for all $n\\ge n(k)$. Jiang confirmed this by proving the formula for all $n\\ge3k+3$ when $k\\ge1$. In this paper, we determine $g_k(n)$ completely. For all $k\\ge1$ and $n\\ge k+2$, we prove $g_k(n)=\\big\\{\\lfloor\\frac{(k+1)n}{2}\\rfloor,\\max\\{a(n-a)+\\lfloor\\frac{a(k+1-a)}{2}\\rfloor : a\\in\\mathbb Z,\\; \\lfloor {(k+1)}/{2}\\rfloor+1\\le a\\le k+1\\}\\big\\}$. For $k\\ge2$, we prove $g_k(n)=(k+1)(n-k-1)$ when $n\\ge \\lceil(5k+1)/2\\rceil$, and this threshold is sharp. Our proof builds on the method developed by Ma and the second author in [Ma and Ning, 2020].", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T10:18:43+00:00", "updated": "2026-09-14T10:18:43+00:00", "abs_url": "http://arxiv.org/abs/2609.15330v1", "pdf_url": "https://arxiv.org/pdf/2609.15330v1", "journal_ref": "", "doi": "", "comment": "22 pages, 2 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen's problem은 convex position의 점 배치와 oriented matroid 관련 이산기하학 문제이며, 본 논문은 그래프 이론의 극값 문제(Erdős Problem 767)로서 직접적 관련성이 없음.", "summary": "본 논문은 Erdős Problem 767을 완전히 해결하여 $g_k(n)$ (어떤 꼭짓점이 $k$개 이상의 현(chord)을 가진 사이클을 포함하지 않는 $n$-정점 그래프의 최대 간선 수)의 정확한 공식을 모든 $k\\ge1$, $n\\ge k+2$에 대해 결정했다. $k\\ge2$일 때 $n\\ge \\lceil(5k+1)/2\\rceil$에서 $g_k(n)=(k+1)(n-k-1)$이 성립하며 이 경계값은 예리(sharp)함을 증명했다.", "technique": "Ma and Ning의 방법론을 확장하여 극값 그래프 구조를 분석하고, 여러 경우로 나누어 상한(upper bound)과 하한(lower bound)을 정밀하게 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.10492v1", "title": "The Distribution of Double Deficiencies in Pattern-Avoiding Permutations", "authors": ["Tipaluck Krityakierne", "Thotsaporn Aek Thanatipanonda", "Doron Zeilberger"], "abstract": "We study the distribution of the number of double deficiencies (DD) in permutations of length n avoiding one or two patterns of length 3. Using structural decompositions of these avoidance classes--together with a lattice-path decomposition in the 321-avoiding case--we derive functional equations and convolution-type recurrences that efficiently compute the corresponding double-deficiency generating functions in all but one single-pattern case. In the 321-avoiding permutations, the resulting generating function is algebraic; we derive exact formulas for the mean and variance and prove that the distribution is close in total variation to Bin(n-2,1/4), with an explicit convergence rate. We also identify a DD-preserving symmetry that yields DD-Wilf equivalences, reducing the number of two-pattern cases that need to be considered separately. For the resulting two-pattern classes, we obtain explicit recurrences, including C-finite relations.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-09T17:31:25+00:00", "updated": "2026-09-09T17:31:25+00:00", "abs_url": "http://arxiv.org/abs/2609.10492v1", "pdf_url": "https://arxiv.org/pdf/2609.10492v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "패턴 회피 순열의 조합론적 성질을 연구하지만, McMullen's problem의 중심인 convex position, general position, oriented matroid, realizability와는 직접적 관련이 없음.", "summary": "길이 3인 한 개 또는 두 개의 패턴을 회피하는 순열에서 double deficiency의 분포를 연구합니다. 구조적 분해와 격자 경로 분해를 통해 함수 방정식과 점화식을 유도하며, 321-회피 순열의 경우 생성함수가 대수적임을 보이고 이항분포로의 수렴을 증명합니다.", "technique": "structural decomposition, lattice-path decomposition, functional equations, C-finite recurrences", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.15414v1", "title": "Large Complete Minors from a Cheeger Condition", "authors": ["Chengli Li", "Leyou Xu", "Bo Zhou"], "abstract": "Let $G$ be a graph on $n$ vertices, and let $e_G(S,V(G)\\setminus S)$ be the number of edges with exactly one endpoint in $S$. The Cheeger constant and the restricted Cheeger constant of $G$, where $k\\ge1$ is real, are, respectively, \\[   h(G)=\\min_{\\substack{\\emptyset\\ne S\\subseteq V(G)\\\\|S|\\le \\frac{n}{2}}}   \\frac{e_G(S,V(G)\\setminus S)}{|S|}   \\text{ and }   h_k(G)=\\min_{\\substack{\\emptyset\\ne S\\subseteq V(G)   |S|\\le\\min\\{k,\\frac{n}{2}\\}}}   \\frac{e_G(S,V(G)\\setminus S)}{|S|}. \\] The contraction clique number $\\ccl(G)$ is the largest integer $r$ such that $G$ contains the complete graph $K_r$ as a minor. Krivelevich and Nenadov [Complete minors in graphs without sparse cuts, Int. Math. Res. Not. IMRN 12 (2021) 8996--9015] proved that, for every fixed $\\eps>0$ and all sufficiently large $n$ and $d$, if $G$ is a graph on $n$ vertices with maximum degree at most $d$, then $h(G)\\ge\\eps d$ and $h_{\\eps n}(G)\\ge(\\frac{1}{2}+\\eps)d$ imply $\\ccl(G)=Ω_\\eps(\\sqrt{\\frac{nd}{\\log d}})$. They asked to determine if one can guarantee the same lower bound on $\\ccl(G)$ without the additional condition on $h_{\\eps n}(G)$. They showed that this is the case when $d$ is a constant. We answer this question affirmatively. For every $\\eps>0

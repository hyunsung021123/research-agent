ion, oriented matroid, tope graph 등 핵심 도구와는 관련 없음.", "summary": "본 논문은 부분순서집합(poset) P에 대해 약P-자유족(weak P-free family)의 최대 크기 $La(n,P)$를 연구하며, $e(P)<\\pi^-(P)$를 만족하는 새로운 poset들을 제시한다. Crown poset $O_6$에 대해 약 1.22배의 중간층 크기를 갖는 약자유족을 구성하고, $e(P)=1$인 poset들이 최대 $2-\\delta_P$ 밀도에서 bounded됨을 보인다.", "technique": "Boolean lattice $2^{[n]}$의 연속 층(consecutive layers) 분석 및 명시적 구성을 통한 상한과 하한 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13280v1", "title": "Contractibility of space of symplectically self-polar convex bodies", "authors": ["Mark Berezovik"], "abstract": "Symplectically self-polar bodies have been introduced recently. They appeared in the context of Mahler's conjecture and in the context of symplectic outer billiard dynamics. In this paper we discuss the topology of the space of symplectically self-polar convex bodies. Namely, we show that this space is contractible.", "categories": ["math.MG", "math.SG"], "primary_category": "math.MG", "published": "2026-08-13T14:15:22+00:00", "updated": "2026-08-13T14:15:22+00:00", "abs_url": "http://arxiv.org/abs/2608.13280v1", "pdf_url": "https://arxiv.org/pdf/2608.13280v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Symplectically self-polar bodies와 Mahler's conjecture는 convex geometry 범위이지만, McMullen's problem(d=5의 convex position 점 배치)과는 직접적 관계가 없음.", "summary": "Symplectically self-polar convex bodies의 공간의 위상적 성질을 연구한 논문. 이러한 공간이 contractible임을 보임으로써, Mahler's conjecture와 symplectic outer billiard dynamics에 나타나는 이 객체들의 구조를 파악함.", "technique": "Contractibility를 보이기 위한 위상적 기법(초록만으로는 구체적 방법 불확실).", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13954v1", "title": "Tight bounds for generalized power domination in regular graphs", "authors": ["Hangdi Chen", "Changhong Lu", "Qingjie Ye"], "abstract": "Dorbec et al. [SIAM J. Discrete Math., 27 (2013)] conjectured that, for all integers $k\\geq1$ and $r\\geq3$, every connected $r$-regular graph $G$ of order $n$, other than $K_{r,r}$, satisfies $γ_{P,k}(G)\\leq n/(r+1)$. After disproving this conjecture, Chen et al.[Graphs Combin., 38 (2022)] proposed a corresponding conjecture for claw-free regular graphs. In this paper, we prove this conjecture: for integers $k\\geq\\ell\\geq1$, every connected claw-free $(k+\\ell+1)$-regular graph $G$ of order $n$ satisfies $γ_{P,k}(G)\\leq n/(k+\\ell+2)$, and this bound is tight. Moreover, without the claw-free assumption, we show that, for each fixed integer $k\\geq1$, the supremum of $γ_{P,k}(G)/\\lvert V(G)\\rvert$ over all connected $r$-regular graphs $G$ is asymptotic to $(\\ln r)/r$ as $r\\to\\infty$.", "categories": ["math.CO", "math.OC"], "primary_category": "math.CO", "published": "2026-08-14T04:52:22+00:00", "updated": "2026-08-14T04:52:22+00:00", "abs_url": "http://arxiv.org/abs/2608.13954v1", "pdf_url": "https://arxiv.org/pdf/2608.13954v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Generalized power domination in regular graphs는 극값그래프론(extremal graph theory) 문제이며, McMullen's problem의 oriented matroid, convex position, realizability 등과 무관함.", "summary": "본 논문은 일반화된 power domination 수 $γ_{P,k}(G)$에 대한 상한을 연구한다. Claw-free $(k+\\ell+1)$-정규 그래프에서 $γ_{P,k}(G) \\leq n/(k+\\ell+2)$임을 증명하고 이 상한이 타이트함을 보인다. 일반적 정규그래프에서는 $γ_{P,k}(G)/|V(G)|$의 상한이 $r\\to\\infty$일 때 $(\\ln r)/r$에 근접함을 증명한다.", "technique": "정규그래프의 구조적 성질과 거듭제곱 지배 개념을 활용한 극값 그래프론적 접근.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.15925v1", "title": "Equilateral Completion in Floretion Triangular Coordinates: Locality, Product Points, and Reflection Symmetry", "authors": ["Creighton Dement"], "abstract": "We study unordered triples of order-n floretion base vectors whose tile centroids form nondegenerate equilateral triangles. A scaled integer centroid map converts Euclidean completion into exact arithmetic on a regular triangular lattice. Residues modulo 3 give a self-contained same-orientation theorem: every equilateral centroid triangle uses three tiles of one orientation; a three-color theorem of Ivrissimtzis, Dodgson, and Sabin gives an independent geometric interpretation. Combining this obstruction with the finite triangular-lattice completion counts of Brouwer, Joe, Noble, and Noble yields $|E_n|=4^n(4^n-1)/12$. Synchronized local cyclic actions form a distinguished subclass with $|L_n|=(7^n-4^n)/3$, hence an exponentially vanishing fraction of all equilateral centroid triangles. On the no-e support ${i,j,k}^n$, a mod-2 rigidity argument forces every equilateral centroid triangle to be local, yielding $(2^n-1)3^{n-1}$ examples. We also introduce the unsigned vertex product and its centroid, the product point, and characterize when this point equals the Euclidean center for local cycles. The resulting parity automata produce linear recurrences and Fibonacci subfamilies, including reflection-symmetric product-centered triangles. Finally, an equilateral triangle is multiplication-generated exactly when its unsigned vertex product is the identity, equivalently when its product point is the origin. Within the local class these are precisely the nontrivial global cyclic orbits; exhaustive exact enumeration through order 5 finds no nonlocal examples.", "categories": ["math.CO", "math.GR"], "primary_category": "math.CO", "published": "2026-08-16T20:39:16+00:00", "updated": "2026-08-16T20:39:16+00:00", "abs_url": "http://arxiv.org/abs/2608.15925v1", "pdf_url": "https://arxiv.org/pdf/2608.15925v1", "journal_ref": "", "doi": "", "comment": "35 pages, 1 figure, 4 tables. Sequel to arXiv:2605.20265", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "equilateral triangle 기하학과 조합적 타일링을 다루지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, 고차원 convex polytope 면의 개수 문제와는 직접 관련이 없음.", "summary": "floretion 벡터 기반의 정삼각형 centroid를 갖는 비순서 삼중쌍(unordered triple)을 연구함. 삼각형 격자의 정수 산술로 계산 가능한 구조를 제시하고, mod 3 잉여류를 통해 방향성 정리를 도출하여 equilateral centroid 삼각형의 개수 공식 $|E_n|=4^n(4^n-1)/12$를 유도함.", "technique": "삼각형 격자의 mod 3 잉여류 불변량과 local cyclic action 분류를 통한 조합 열거; parity automata를 이용한 선형 점화식 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.15558v1", "title": "A Counterexample to the Tang Zhang Schatten Norm Conjecture and Sharp Positive Results", "authors": ["Zijian Zeng", "Houde Liu", "Kurunathan Ratnavelu"], "abstract": "For $m\\geq 2$, let $c_p(m)$ be the all-dimensional best constant in   $$ \\left\\|\\sum_{k=1}^m A_k\\right\\|_p \\leq c_p(m)\\left\\|\\sum_{k=1}^m |A_k|\\right\\|_p. $$   Tang and Zhang conjectured an explicit formula for every finite $p>1$. We disprove the conjecture with two explicit real $2\\times 2$ rank-one matrices at $p=3/2$. The comparison is certified by seven strict rational inequalities and, in particular, places the attained ratio above $207/200$, while the conjectured constant lies below $207/200$. On the positive side, we prove the conjectured sharp bound for every family of rank-at-most-one summands when $2\\leq p<\\infty$, and classify all equality cases. We also prove the corresponding endpoint statement for $p=\\infty$. Finally, for arbitrary complex matrices, we establish the conjectured sharp constant in the case $m=2$, $p=4$.", "categories": ["math.CO", "cs.LG", "math.FA"], "primary_category": "math.CO", "published": "2026-08-16T06:10:33+00:00", "updated": "2026-08-16T06:10:33+00:00", "abs_url": "http://arxiv.org/abs/2608.15558v1", "pdf_url": "https://arxiv.org/pdf/2608.15558v1", "journal_ref": "", "doi": "", "comment": "9 pages, 0 figure,", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 행렬의 Schatten norm에 대한 부등식 상수 추측을 다루며, 이산기하학이나 볼록기하학의 조합론적 구조(oriented matroid, convex position, chirotope 등)와 무관함.", "summary": "본 논문은 Tang-Zhang의 Schatten norm 부등식에 관한 추측을 $p=3/2$, $m=2$일 때 명시적인 2×2 행렬로 반박한다. 동시에 rank-at-most-one 행렬족에 대해 추측된 sharp bound를 증명하고, $m=2, p=4$인 경우 일반 복소행렬에 대한 상수를 확립한다.", "technique": "유리수 부등식 인증(rational inequality certification) 및 등호 경우의 분류(equality case classification)를 통한 sharp bound 증명", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.16464v1", "title": "Measurable Matroids: Foundations and Min--Max Theorems", "authors": ["Kristóf Bérczi", "András Imolay", "Ádám Schweitzer"], "abstract": "We develop a measure-theoretic analogue of matroid theory on standard atomless measure spaces. Motivated by the quotient-convergence framework for submodular set functions, our aim is to identify suitable measurable objects on the limit side of finite matroid theory and to develop their basic structural and optimization theory. We prove that measurable matroids admit equivalent descriptions by independent sets, bases, rank functions, and closure operators. The class includes normalized finite matroids, cycle matroids of graphings, and measurable analogues of partition, nested, lattice path, transversal, and matching matroids. We establish measurable analogues of truncation, elongation, direct sum, duality, and minors.   We prove measurable versions of Edmonds' matroid intersection theorem and the Edmonds--Fulkerson matroid union theorem, together with an attainment theorem for common bases. The intersection theorem retains the classical min--max form, with the maximum replaced in general by a supremum. Applied to partition matroids, it gives an exact Hall-deficiency formula for measurable matchings in bipartite graphings and a min--max theorem for continuous bipartite $b$-matchings, with applications to capacity-constrained transport and prescribed cross-sections. We give a rank-expansion criterion under which the supremum is attained. For bipartite graphings, this criterion specializes to the measurable perfect matching theorem of Lyons and Nazarov.   For measurable union, the Edmonds--Fulkerson rank formula remains valid. As a main application of measurable union and its attainment theorem, we prove measurable Nash-Williams--Tutte theorems for graphings, characterizing approximate coverings and packings by hyperfinite essential spanning forests and obtaining exact decompositions under strengthened rank inequalities.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-17T12:03:14+00:00", "updated": "2026-08-17T12:03:14+00:00", "abs_url": "http://arxiv.org/abs/2608.16464v1", "pdf_url": "https://arxiv.org/pdf/2608.16464v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Measurable matroid theory는 무한-차원 구조에 관한 것으로, McMullen's problem의 유한 점 배치와 convex position 문제와 직접적 관련성이 없음.", "summary": "원자성 없는 표준 측도공간에서 matroid 이론의 측도론적 유사체를 개발함. Independent sets, bases, rank functions, closure operators로 동등한 기술을 제공하며, Edmonds' matroid intersection theorem과 Edmonds-Fulkerson matroid union theorem의 측도버전을 증명함.", "technique": "Quotient-convergence framework를 이용한 submodular set functions의 극한론적 접근, min-max 정리의 supremum 형태로의 일반화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13002v1", "title": "Characterization of graphs $G$ where $G \\in \\mathrm{obs}^*(H)$ for some graph $H$", "authors": ["Zahra Rahimi", "M. H. Shirdareh Haghighi", "Asma Namazi"], "abstract": "A full-homomorphism from a graph $G$ to a graph $H$ is a function on vertex sets that preserves adjacency and non-adjacency of vertices. A graph $G$ is called a minimal $H$-obstruction if it has no full-homomorphism to $H$ but every proper vertex induced subgraph of $G$ does. Such graphs can have at most $|V(H)|+1$ vertices. The set of minimal $H$-obstructions on $|V(H)|+1$ vertices is denoted by $\\mathrm{obs*}(H)$. In question 2 of the paper \"Santiago Guzm{á}n-Pro, Full-homomorphisms to paths and cycles, Discrete Mathematics, 347(3):113800, 2024\" it is asked if there is a characterization of those graphs $G$ that lie in $\\mathrm{obs*}(H)$ for some graph $H$. In this paper, we give a complete answer to this question.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T09:23:15+00:00", "updated": "2026-08-13T09:23:15+00:00", "abs_url": "http://arxiv.org/abs/2608.13002v1", "pdf_url": "https://arxiv.org/pdf/2608.13002v1", "journal_ref": "", "doi": "", "comment": "12 pages, 2 figures. Submitted for publication", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Full-homomorphism과 minimal obstruction은 그래프 호모몰피즘 이론이며, McMullen's problem은 convex position의 점 배치와 oriented matroid 관련 문제로서 직접적 관련성이 없음.", "summary": "본 논문은 주어진 그래프 H에 대해 full-homomorphism이 존재하지 않으면서 모든 진부분 유도 부분그래프는 H로의 full-homomorphism을 갖는 minimal H-obstruction 그래프들을 특성화한다. Guzm{á}n-Pro의 미해결 질문에 대한 완전한 답을 제시한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.15672v1", "title": "Uniformity without Projective Consistency: An Exact Counterexample for a Nested Binary Term Grammar", "authors": ["Ivan Khalamendyk"], "abstract": "Let T_0={L} and T_{r+1}={L} union {N(a,b):a,b in T_r}. On the nonleaf terms E_r, require each event N(a,b) to occur after its nonleaf children, and let mu_r be the uniform measure on the linear extensions of this poset. We study the restriction rho_43 that deletes the new level-4 events while preserving the relative order of the level-3 events. We prove that the pushforward of mu_4 under rho_43 is not mu_3. Two explicit orders on the 25 level-3 events have different numbers of level-4 extensions. If b_i is the number of T_2 terms, including the leaf, seen in a prefix of length i, the number of newly released events is (i+1)^2-b_i^2. The release profile of a depth-priority order dominates that of a level order pointwise and is strictly larger for 3<=i<=15. An explicit injection between admissible interleavings therefore gives a strict analytic fiber inequality. Two algorithmically independent exact computations reproduce both 1557-digit fiber counts; their reduced ratio is 614690215260160000/479048686862260621, approximately 1.2831476885707443. The analogous restrictions through level 3 are consistent, so 4-to-3 is the first failure in this grammar. The result is specific to this grammar, uniform measures, and restriction map.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-16T10:32:20+00:00", "updated": "2026-08-16T10:32:20+00:00", "abs_url": "http://arxiv.org/abs/2608.15672v1", "pdf_url": "https://arxiv.org/pdf/2608.15672v1", "journal_ref": "", "doi": "", "comment": "13 pages; ancillary exact-count verification package and certificates", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학이나 조합론의 핵심 문제(convex position, oriented matroid, realizability 등)와 직접적 연관이 없는 순수 조합적·확률적 poset 구조 연구.", "summary": "중첩된 이진 항 문법에서 정의된 poset의 선형 확장에 대한 균등 측도(uniform measure)를 연구하며, 레벨 4에서 3으로의 제약 사상(restriction map) 아래에서 pushforward 측도가 일관성을 잃는 구체적 반례를 제시한다. 깊이 우선 순서와 레벨 순서의 해제 프로필(release profile)을 비교하고 정확한 섬유 개수(1557자리 수)를 명시적으로 계산한다.", "technique": "Poset의 선형 확장 계산, 제약 사상의 pushforward 분석, 두 독립적 알고리즘을 통한 정확 계산 검증 및 섬유 부등식(fiber inequality).", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18670v1", "title": "A general method of deducing the determinantal expressions for polynomial and its derivative", "authors": ["Hongyi Lou", "Shi-Mei Ma", "Xinzhe Song", "Guiying Yan", "Yeong-Nan Yeh"], "abstract": "In this paper, we present a general method of deducing the determinantal expressions for a polynomial and its derivative. As illustrations, we provide three determinantal expressions for the derivative of the Eulerian polynomial. Using a functional equation discovered by Gessel,we also establish the determinantal expressions for the second-order Eulerian polynomial and its derivative.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T08:21:39+00:00", "updated": "2026-08-19T08:21:39+00:00", "abs_url": "http://arxiv.org/abs/2608.18670v1", "pdf_url": "https://arxiv.org/pdf/2608.18670v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "다항식의 행렬식 표현과 Eulerian polynomial 유도에 관한 조합론 논문이지만, McMullen's problem의 convex position, oriented matroid, polyhedral 구조와는 직접적인 연관이 없음.", "summary": "본 논문은 다항식과 그 도함수의 행렬식 표현을 유도하기 위한 일반적 방법을 제시한다. 이를 통해 Eulerian polynomial의 도함수에 대한 세 가지 행렬식 표현을 제공하고, Gessel의 함수방정식을 이용하여 이차 Eulerian polynomial과 그 도함수의 행렬식 표현을 확립한다.", "technique": "함수방정식과 행렬식 항등식을 이용한 다항식 표현 방법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.16740v1", "title": "Codegree Thresholds for $λ$-Choosability of Graphs", "authors": ["Chunqiu Fang", "Rongxing Xu"], "abstract": "Let $λ=\\{k_1,\\ldots,k_q\\}$ be a partition, and let $|λ|=k_1+\\cdots+k_q$. A $|λ|$-list assignment $L$ of a graph $G$ is a $λ$-assignment if its color set can be partitioned into $q$ disjoint sets $X_1,\\ldots,X_q$ such that $|L(v)\\cap X_i|=k_i$ for every vertex $v$ and every $i\\in[q]$. This notion, introduced by Zhu [J. Combin. Theory Ser. B, 2020], puts ordinary coloring and list coloring in the same framework. A theorem of Alon [Random Structures Algorithms, 2000] states that every graph with minimum degree $d$ has choice number at least $(1/2-o(1))\\log_2d$. Saxton and Thomason [Invent. Math., 2015] later used the hypergraph container method to replace $1/2$ by the sharp constant $1$. It is natural to ask whether a similar phenomenon holds for every fixed partition $λ$. Minimum degree alone is not sufficient: balanced complete bipartite graphs have arbitrarily large minimum degree but are always $\\{1,1\\}$-choosable. We show that the appropriate replacement is the minimum $q$-codegree, defined for $|V(G)|\\geq q$ by $δ_q(G)=\\min\\{|N_G(S)|:S\\subseteq V(G),\\,|S|=q\\}$.   More precisely, for every partition $λ$ there exists an integer $d$ such that every graph $G$ with $δ_q(G)\\geq d$ is not $λ$-choosable. Let $f(λ)$ be the least such $d$. For every fixed $q$, we prove $f(λ)\\leq2^{(2q+o(1))|λ|}$ as $|λ|\\to\\infty$, while $f(λ)\\geq(q+1)^{-1}(1+1/q)^{|λ|}$ for every $λ$. For the partition $\\{k,\\ldots,k\\}$ with $q$ equal parts, we determine the threshold asymptotically: $f(\\{k,\\ldots,k\\})=ρ_q^{-(1+o(1))k}$ as $k\\to\\infty$, where $ρ_q$ is the unique $x\\in(0,1)$ satisfying $x=(1-x)^q$. When $q=1$, our result implies $\\operatorname{ch}(G)\\geq(1-o(1))\\log_2δ(G)$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-17T15:51:23+00:00", "updated": "2026-08-17T15:51:23+00:00", "abs_url": "http://arxiv.org/abs/2608.16740v1", "pdf_url": "https://arxiv.org/pdf/2608.16740v1", "journal_ref": "", "doi": "", "comment": "28 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 그래프의 list coloring과 choosability 임계값을 다루며, McMullen's problem의 핵심 주제인 convex position, oriented matroid, 조합 기하학적 구조와는 직접적 관련이 없습니다.", "summary": "λ-choosability를 도입하여 일반화된 리스트 색칠 문제를 연구합니다. 최소 q-codegree를 이용해 그래프가 λ-choosable이 되기 위한 충분조건을 제시하고, 특정 분할에 대해 임계값 f(λ)의 점근적 행동을 결정합니다.", "technique": "초록에서 명시된 기법은 hypergraph container method (Saxton-Thomason)의 활용이 암시되지만, 본 논문의 증명 기법은 초록에 구체적으로 명시되지 않았습니다.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.17996v1", "title": "A rainbow version of Lehel's conjecture", "authors": ["Pedro Araújo", "Xiao-Chuan Liu", "Taísa Martins", "Walner Mendonça", "Luiz Moreira", "Vinícius Fernandes dos Santos", "Zhifei Yan"], "abstract": "Lehel's conjecture states that every 2-edge-colouring of K_n admits a partition of its vertex set into two monochromatic cycles. It was proven for sufficiently large n by Łuczak, Rödl, and Szemerédi in 1998, later improved by Allen in 2008, and fully resolved by Bessy and Thomassé in 2010.   In this paper, we consider a rainbow analogue of Lehel's conjecture in the setting of properly edge-coloured complete graphs. We prove that, for sufficiently large n, every properly edge-coloured Kn admits a partition of its vertex set into two vertex-disjoint rainbow cycles", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T16:43:34+00:00", "updated": "2026-08-18T16:43:34+00:00", "abs_url": "http://arxiv.org/abs/2608.17996v1", "pdf_url": "https://arxiv.org/pdf/2608.17996v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Rainbow edge-coloring과 cycle partition 문제는 McMullen's problem의 point configuration, oriented matroid, realizability와 직접적 관련이 없음.", "summary": "Lehel's conjecture의 rainbow 유사 문제를 연구한다. 충분히 큰 n에 대해, 모든 properly edge-colored complete graph $K_n$이 두 개의 vertex-disjoint rainbow cycles로 vertex set을 분할할 수 있음을 증명한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18874v1", "title": "Counting Schreier Sets Under Neighborhood Conditions", "authors": ["Ben Chen", "Hung Viet Chu", "Corbin F. Foss", "Jie Luo", "Steven J. Miller", "Richard Ren", "Garrett Tresch"], "abstract": "We count Schreier sets that satisfy a neighborhood condition, including $k$-clustered, $k$-consecutive-free, $k$-neighbored, $k$-isolated, and closed under integral $2$-averages. For the first four conditions, we determine the initial counts and prove linear recurrence relations. For the last condition, we prove a recurrence that involves the divisor counting function.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T12:55:29+00:00", "updated": "2026-08-19T12:55:29+00:00", "abs_url": "http://arxiv.org/abs/2608.18874v1", "pdf_url": "https://arxiv.org/pdf/2608.18874v1", "journal_ref": "", "doi": "", "comment": "19 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Schreier sets와 neighborhood conditions의 개수 세기는 McMullen's problem의 convex position, general position, 또는 oriented matroid 구조와 직접적 관련이 없음.", "summary": "본 논문은 k-clustered, k-consecutive-free, k-neighbored, k-isolated 등 여러 이웃 조건을 만족하는 Schreier 집합의 개수를 센다. 처음 네 가지 조건에 대해 초기 개수를 결정하고 선형 점화식을 증명하며, 적분 2-평균에 대한 폐포 조건에서는 약수 세기 함수를 포함하는 점화식을 증명한다.", "technique": "선형 점화식 유도 및 약수 계수 함수(divisor counting function)를 활용한 조합론적 해석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.17264v1", "title": "A transfer principle for Steklov eigenvalue estimates of graphs", "authors": ["Xiongfeng Zhan", "Jin-Xin Zhou"], "abstract": "In this paper, we establish a new variant of the Burger-Brooks transfer principle, which allows us to apply spectral estimates for measured Riemannian surfaces to obtain the following result: There exists a universal constant $C>0$ such that, for every connected graph $G=(V, E)$ with boundary $B$, maximum degree $d_{\\max}$ and genus $g$,   \\[σ_k(G, B)\\leq C d_{\\max}\\frac{g+k}{|B|},\\] where $1\\leq k\\leq |B|$ and $σ_k(G, B)$ denotes the $k$-th Steklov eigenvalue of $G$ with boundary $B$. This bound is sharp up to a universal constant, thereby resolving a problem raised by Lin and Zhao [J. Lond. Math. Soc. (2) 112 (2025), Paper No. e70238]. Furthermore, when $B=V$, the above result yields an upper bound for the Laplacian eigenvalues of graphs, improving the previously known bounds of Kelner, Lee, Price and Teng [Geom. Funct. Anal. 21 (2011), 1117--1143] and Amini and Cohen-Steiner [Comment. Math. Helv. 93 (2018), 203--223].", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T01:46:51+00:00", "updated": "2026-08-18T01:46:51+00:00", "abs_url": "http://arxiv.org/abs/2608.17264v1", "pdf_url": "https://arxiv.org/pdf/2608.17264v1", "journal_ref": "", "doi": "", "comment": "19 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "스펙트럼 그래프 이론과 Steklov 고유값 추정에 관한 논문으로, McMullen의 문제(볼록 위치의 점 배치, oriented matroid, realizability)와는 직접적 관련이 없음.", "summary": "Burger-Brooks 전이 원리의 새로운 변형을 확립하여, 경계가 있는 그래프의 Steklov 고유값 $σ_k(G, B)$에 대한 상한 $σ_k(G, B) \\leq C d_{\\max}\\frac{g+k}{|B|}$를 도출함. 이 결과는 상수까지 sharp하며 Laplacian 고유값에 대한 기존 상한들을 개선함.", "technique": "Riemannian 기하학의 스펙트럼 추정을 그래프 이론에 적용하는 전이 원리(transfer principle).", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.14196v1", "title": "Product structure of graphs excluding a topological minor", "authors": ["Jędrzej Hodor", "Hoang La", "Piotr Micek", "Clément Rambaud"], "abstract": "We prove that, for all positive integers $h$ and $t$ and every graph $X$ with $\\mathrm{td}(X) \\leq h$, there exists a positive integer $c(X,t)$ such that every graph $G$ with $\\mathrm{tw}(G) < t$ that excludes $X$ as a topological minor is isomorphic to a subgraph of $H \\boxtimes K_{c(X,t)}$ for some graph $H$ with $\\mathrm{tw}(H) < 2^{h+1}-1$. This extends a result by Ding and Oporowski (Journal of Graph Theory; 1995), which states that for all positive integers $Δ$ and $t$, here exists a positive integer $f(Δ,t)$ such that every graph $G$ with $\\mathrm{tw}(G)<t$ and $Δ(G)\\leqΔ$ is isomorphic to a subgraph of $T \\boxtimes K_{f(Δ,t)}$ for some tree $T$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-14T11:16:00+00:00", "updated": "2026-08-14T11:16:00+00:00", "abs_url": "http://arxiv.org/abs/2608.14196v1", "pdf_url": "https://arxiv.org/pdf/2608.14196v1", "journal_ref": "", "doi": "", "comment": "18 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프의 treewidth, topological minor, product structure는 이산기하학이나 볼록 위치 점 배치 문제와 직접 관련이 없음.", "summary": "본 논문은 위상적 minor를 제외하는 그래프의 곱 구조(product structure)를 연구합니다. 제한된 treewidth와 degeneracy를 가진 그래프가 트리(또는 낮은 treewidth 그래프)와 클리크의 카르테시안 곱으로 표현됨을 보입니다. 이는 Ding-Oporowski의 1995년 결과를 일반화한 것입니다.", "technique": "Topological minor 제외 조건과 treewidth 제약을 이용한 그래프 분해 및 곱 구조 정리.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.17603v1", "title": "Tasty Chocolate Games", "authors": ["François Carret", "Koki Suetsugu"], "abstract": "In this paper, we investigate Chocolate Games. In Chocolate Games, each player cuts a chocolate bar into two chocolate bars and eats one of them so that they do not eat an indicated bitter block.   The player who eats the bitter part loses the game. This game can be considered as a generalization of Nim, and previous studies consider the condition that for what kind of the shape of chocolate bar, the Sprague--Grundy value of the position can be calculated by Nim--sum (XOR) of the width and height of the chocolate bar. Higher dimensional cases were also studied.   In this paper, we show that the ``Tasty condition,'' which was introduced in previous work for increasing staircase chocolate bars, can also be used for various other shapes of chocolate bars as a sufficient condition, or in some cases a necessary and sufficient condition, for the Sprague--Grundy value to be given by the Nim-sum of the sizes of the chocolate bar in each dimension.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T10:08:53+00:00", "updated": "2026-08-18T10:08:53+00:00", "abs_url": "http://arxiv.org/abs/2608.17603v1", "pdf_url": "https://arxiv.org/pdf/2608.17603v1", "journal_ref": "", "doi": "", "comment": "30 pages, 21 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 논문이지만 McMullen's problem(convex position, general position, oriented matroid, polyhedral matching fields, tropical geometry, triangulations 등)과는 직접 관련이 없음.", "summary": "본 논문은 Chocolate Games(초콜릿 바를 자르는 조합 게임)를 연구하며, Sprague-Grundy 값이 각 차원의 Nim-sum으로 계산되는 조건을 탐구한다. 이전 연구의 'Tasty condition'을 다양한 초콜릿 모양에 적용하여 충분조건 또는 필요충분조건을 제시한다.", "technique": "Sprague-Grundy 이론과 Nim-sum을 이용한 게임 이론적 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.19976v1", "title": "Random valuations", "authors": ["Andrii Ilienko", "Ilya Molchanov"], "abstract": "A valuation is a finitely additive function on the family of compact convex sets in $\\mathbb{R}^d$. We study non-negative infinitely divisible random valuations, with particular emphasis on monotone, $σ$-continuous models with independent increments along nested families. After separating the deterministic part, we show that the Lévy measure of such a valuation is generated by pairs $(F,r)$, where $F$ is a non-empty closed convex set and $r>0$, with each pair contributing $r\\mathbf{1}_{F\\cap K=\\emptyset}$. This yields a Poisson representation and an equivalent formulation through a pure-jump completely random measure on the space of closed convex sets. For stationary valuations, we derive a cylinder-Grassmannian representation of the Lévy measure. In the stationary isotropic case, we obtain a McMullen-type decomposition, at the level of one-dimensional distributions, into independent components stable under dilation of the argument.", "categories": ["math.PR", "math.MG"], "primary_category": "math.PR", "published": "2026-08-20T12:50:11+00:00", "updated": "2026-08-20T12:50:11+00:00", "abs_url": "http://arxiv.org/abs/2608.19976v1", "pdf_url": "https://arxiv.org/pdf/2608.19976v1", "journal_ref": "", "doi": "", "comment": "33 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen-type decomposition이 언급되지만 이는 볼록 집합 위의 확률 가치함수(valuation) 이론에서의 분해로, McMullen's problem(d=5의 볼록 위치 점 배치 문제)과 직접적 관련이 없다.", "summary": "이 논문은 $\\mathbb{R}^d$의 컴팩트 볼록 집합족 위의 비음 무한 가분 랜덤 가치함수(random valuation)를 연구한다. Lévy 측도가 $(F, r)$ 쌍(여기서 $F$는 닫힌 볼록 집합, $r>0$)에 의해 생성되며 각 쌍이 $r\\mathbf{1}_{F\\cap K=\\emptyset}$을 기여한다는 Poisson 표현을 도출한다. 정상(stationary) 등방(isotropic) 경우에는 인수의 팽창(dilation) 하에 안정적인 독립 성분으로의 McMullen형 분해를 1차원 분포 수준에서 얻는다.", "technique": "Lévy-Khintchine 이론을 볼록 집합 위의 가치함수에 적용하여 Poisson 표현 및 완전 랜덤 측도(completely random measure)와의 동치 공식화를 도출.", "connections": "", "keyword_hits": ["mcmullen"], "source": "filter"}, {"id": "2608.17367v1", "title": "On the Hidden Pascal Symmetry and Moment Constraints of Vector Representatives in Quebbemann's 64-Dimensional Lattice", "authors": ["Nick Vorobtsov"], "abstract": "In this paper, we investigate the underlying algebraic and combinatorial structures governing the coset representatives (shift vectors) for Construction A of lattices, with a particular focus on equations (14) and (15) presented in Paragraph 3, Chapter 8 of the seminal work by J.H. Conway and N.J.A. Sloane, \"Sphere Packings, Lattices and Groups\". These dual equations define the boundary conditions for the analytical generation of the 64-dimensional Quebbemann lattice (Q64). We prove that seeking non-zero solutions constrained by arithmetic or geometric progressions yields a structural collapse to the trivial zero vector due to the transcendental nature of π. Conversely, by relaxing these bounds to unique coordinate configurations, we uncover an exact, closed-form algebraic core governed by the alternating coefficients of the Pascal triangle. Furthermore, we implement an energy-minimization model via continuous-to-discrete projection that yields an optimal shift vector with a strictly integer Euclidean norm ||z||^2 = 20.000000. Finally, we bridge this formulation to the Repeated Differences paradigm of Craig's lattices Anm, showing how the spectral components of the Θ-series are naturally filtered by these binomial structures.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-08-18T04:48:46+00:00", "updated": "2026-08-18T04:48:46+00:00", "abs_url": "http://arxiv.org/abs/2608.17367v1", "pdf_url": "https://arxiv.org/pdf/2608.17367v1", "journal_ref": "", "doi": "", "comment": "13 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "격자 이론과 조합구조를 다루지만 McMullen 문제(convex position, oriented matroid, 점 배치의 실현성)와 직접 관련이 없음.", "summary": "이 논문은 Construction A 격자의 coset representative(shift vector)에 대한 대수·조합 구조를 조사하며, 특히 Quebbemann 64차원 격자(Q64) 생성을 위한 경계 조건을 다룬다. Pascal 삼각형의 교대 계수로 지배되는 정확한 closed-form 대수 핵심을 발견하고, 에너지 최소화 모델을 통해 정수 Euclidean norm ||z||²=20을 갖는 최적 shift vector를 얻었다.", "technique": "에너지 최소화를 통한 연속-이산 사영(continuous-to-discrete projection)과 Pascal 삼각형의 binomial 구조를 이용한 스펙트럼 필터링", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.15287v1", "title": "Hamiltonian paths in the permutation digraphs $P(n,n-2)$", "authors": ["Jiaxin Guo", "Ming Duan", "Jie Xue"], "abstract": "For $1\\leq k<n$, let $P(n,k)$ be the directed overlap graph whose vertices are the $k$-permutations of $[n]$ and whose arcs are the $(k+1)$-permutations. Isaak proved that $P(n,n-2)$ has no directed Hamiltonian cycle for $n\\geq4$ and asked whether it nevertheless has a directed Hamiltonian path. We answer this question affirmatively by showing that $P(n,n-2)$ has a Hamiltonian path.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-15T15:34:00+00:00", "updated": "2026-08-15T15:34:00+00:00", "abs_url": "http://arxiv.org/abs/2608.15287v1", "pdf_url": "https://arxiv.org/pdf/2608.15287v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "순열의 조합론적 구조와 그래프 경로 문제를 다루지만, McMullen's problem의 convex position, oriented matroid, realizability와는 직접적 관련이 없음.", "summary": "본 논문은 $k$-순열(k-permutations)을 정점으로 하고 $(k+1)$-순열을 호(arc)로 갖는 directed overlap graph $P(n,k)$를 연구한다. Isaak의 선행 결과에서 $P(n,n-2)$는 $n\\geq4$일 때 directed Hamiltonian cycle을 갖지 않음이 알려졌으나, 본 논문은 이 그래프가 directed Hamiltonian path를 갖는다는 것을 증명함으로써 해당 질문을 긍정적으로 해결한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18967v1", "title": "Exact random covers of metric trees: balanced rounding, duality, and sharp thresholds", "authors": ["Qi Wu", "Yong Lu"], "abstract": "Norin and Turcotte's asymptotically sharp bound for graph burning [J. Combin. Theory Ser. B 168 (2024), 208--235] led them to an exact random-cover conjecture for finite metric trees. Let $U[0,r]$ be the uniform probability measure on $[0,r]$. They conjectured that every finite metric tree $T$ of length $L\\ge2r$ admits a probability measure on $0$-good ball covers whose expected radius measure is at most $(L/r)U[0,r]$. We prove the conjecture for every finite metric tree.   We recast the bootstrapping calculation of Norin and Turcotte as a zero-error replacement certificate. The resulting local scale reduction, together with a three-piece decomposition and a macro-recursion, produces a fractional marked-ball cover with the exact radius budget. We then pass from the fractional cover to random finite covers by a compact rounding argument. For metric-tree balls, Tamir's balancedness theorem and standard balanced-matrix ideality provide the finite-dimensional integrality input.   We also prove an arbitrary-budget duality criterion. If $0<R\\le L$ and $β$ is a finite positive Borel measure on $[0,R]$, then $β$ dominates the expected radius measure of a random $0$-good cover if and only if $σ(T)\\le\\int_{[0,R]}\\max_{v\\in T}σ(B_T(v,s))\\,dβ(s)$ for every finite positive Borel measure $σ$ on $T$; it is enough to test finite atomic measures. We use this criterion to extend the uniform range to every $r\\le L-\\operatorname{diam}(T)/2$, determine the exact range for equal-arm metric stars, and derive deterministic bounds, interval rigidity, and a diameter-defect stability estimate.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T14:33:55+00:00", "updated": "2026-08-19T14:33:55+00:00", "abs_url": "http://arxiv.org/abs/2608.18967v1", "pdf_url": "https://arxiv.org/pdf/2608.18967v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "메트릭 트리의 확률적 커버와 반올림 기법을 다루지만 McMullen 문제(convex position, oriented matroid, realizability)와는 기하학적·조합론적 본질이 무관함.", "summary": "유한 메트릭 트리에서 확률적 0-good ball cover의 기댓값 반지름 척도에 대한 Norin-Turcotte 추측을 증명함. 분수적 표지에서 유한 확률 표지로의 컴팩트 반올림 논증과 균형잡힌 행렬 이상성(balanced-matrix ideality)을 활용하고, 임의 예산 쌍대성 판정법을 도출함.", "technique": "분수적 marked-ball cover 구성, Tamir의 균형성 정리(balancedness theorem)와 balanced rounding, 쌍대성 기준을 통한 재귀적 축소.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.16278v1", "title": "Twisted primitive group association schemes", "authors": ["Akihiro Higashitani", "Masanari Kamiya", "Hirotake Kurihara"], "abstract": "We give results on the question of whether the intersection numbers of a primitive group association scheme determine it up to combinatorial isomorphism. For $G=\\operatorname{PSL}(2,q)$, where $q$ is an odd prime power with $q=11$ or $q\\ge 17$, or $q=2^f$ with $f\\ge3$, we construct a Schur partition that is algebraically isomorphic to the partition of $G$ into conjugacy classes but not combinatorially isomorphic to it. Consequently, the corresponding primitive group association schemes are not determined up to combinatorial isomorphism by their intersection numbers; in particular, they are non-separable.   For $\\mathfrak A_6$ and $\\mathfrak A_8$, we also explicitly construct Schur partitions that are algebraically isomorphic to the corresponding partitions into conjugacy classes but not combinatorially isomorphic to them.", "categories": ["math.CO", "math.GR", "math.RT"], "primary_category": "math.CO", "published": "2026-08-17T08:50:58+00:00", "updated": "2026-08-17T08:50:58+00:00", "abs_url": "http://arxiv.org/abs/2608.16278v1", "pdf_url": "https://arxiv.org/pdf/2608.16278v1", "journal_ref": "", "doi": "", "comment": "28pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Primitive group association schemes and Schur partitions는 조합론 범주이나 McMullen's problem (convex polytopes, point configurations, oriented matroids)과는 직접적 관련이 없음.", "summary": "본 논문은 원시 군 연관도식(primitive group association scheme)의 교차수(intersection numbers)가 조합 동형을 결정하는지에 대한 문제를 다룬다. $G=\\operatorname{PSL}(2,q)$ (특정 $q$ 범위)와 $\\mathfrak{A}_6, \\mathfrak{A}_8$에 대해, 켤레류 분할과 대수적으로는 동형이지만 조합적으로는 비동형인 슈르 분할(Schur partition)을 구성하여 교차수만으로는 결정 불가능함을 보였다.", "technique": "Schur partition의 구성 및 대수적 vs 조합적 동형성 판별을 통한 분리 불가능성(non-separability) 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18648v1", "title": "The induced-$P_4$-free process", "authors": ["Hongyi Lou", "Xinzhe Song", "Guiying Yan"], "abstract": "We study the random induced-$P_4$-free graph process. Let $e_1,\\ldots,e_N$, where $N=\\binom{n}{2}$, be a uniformly random ordering of the edges of $K_n$. Starting from the empty graph $G_0$, we add $e_{m+1}$ whenever $G_m+e_{m+1}$ contains no induced $P_4$, and otherwise leave the graph unchanged. We show that the terminal graph is a trivially perfect graph and we describe the structure and distribution of the connected components of the terminal graph $G_N$. Consequently, we derive the limiting values of several natural graph parameters. In particular, the terminal graph $G_N$ has $Θ(n)$ edges.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T07:54:37+00:00", "updated": "2026-08-19T07:54:37+00:00", "abs_url": "http://arxiv.org/abs/2608.18648v1", "pdf_url": "https://arxiv.org/pdf/2608.18648v1", "journal_ref": "", "doi": "", "comment": "32 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 induced-$P_4$-free 그래프의 랜덤 프로세스를 다루며, McMullen's problem과 직접적 관련이 없음.", "summary": "균일 무작위 간선 순서로 $K_n$의 간선을 추가하되 induced $P_4$를 만들지 않는 임계값에서만 추가하는 랜덤 그래프 프로세스를 연구한다. 최종 그래프는 trivially perfect graph이며, 연결 성분의 구조와 분포를 특성화하고, 특히 $Θ(n)$개의 간선을 갖는다.", "technique": "그래프 프로세스의 임계값 분석과 유도된 부분그래프 회피 조건하에서의 구조 특성화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.17334v1", "title": "A novel approach to determining chromatic number induced by labelings", "authors": ["Gee-Choon Lau", "Wai Chee Shiu", "Zhen Bin Gao"], "abstract": "Given a simple graph $G=(V,E)$ of order $p$ and size $q$, a bijection $f : V\\cup E \\to \\{1, 2, \\ldots, p+q\\}$ is a local total neighborhood antimagic labeling of $G$ if the induced vertex coloring has the property $f^+_{tn}(u) \\ne f^+_{tn}(v)$ for every two adjacent vertices $u$ and $v$ where $f^+_{tn}(u) = \\sum (f(ux) + f(x))$ over every neighbor $x$ of $u$. The local total neighborhood antimagic chromatic number of $G$, denoted $χ_{ltna}(G)$ is the minimum number of distinct induced colors over all local total neighborhood antimagic labeling of $G$. In this paper, we determine the local total neighborhood antimagic chromatic number of the join of graphs with distinct parity orders.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T03:46:13+00:00", "updated": "2026-08-18T03:46:13+00:00", "abs_url": "http://arxiv.org/abs/2608.17334v1", "pdf_url": "https://arxiv.org/pdf/2608.17334v1", "journal_ref": "", "doi": "", "comment": "submitted to Acta Mathematica Hungarica", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 색칠수 문제이지만 McMullen's problem(볼록 위치 점 배치, oriented matroid, 조합기하)과는 직접 관련이 없음.", "summary": "국소 전체 근방 반마법 라벨링(local total neighborhood antimagic labeling)을 통해 유도되는 정점 색칠을 연구하며, 인접한 정점에 서로 다른 색을 할당하도록 하는 라벨링을 정의함. 특히 서로 다른 패리티를 가진 위수의 그래프 합(join)에 대한 국소 전체 근방 반마법 색칠수를 결정함.", "technique": "정점-간선 이분 그래프 라벨링과 합 그래프의 구조적 성질을 이용한 색칠수 결정", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18584v1", "title": "On a conjecture on the Kasami APN function: reductions, structure theorems, a proof for $k\\bmod n\\in\\{1,2,n{-}2,n{-}1\\}$, and exhaustive verification for $n\\le 13$", "authors": ["Gábor P. Nagy", "Attila Vajda"], "abstract": "We study a conjecture on the Kasami almost perfect nonlinear (APN) function $F(x)=x^{4^k-2^k+1}$ on $GF(2^n)$, $\\gcd(k,n)=1$: for the $2^{n-1}$-element set $Δ=\\{F(b)+F(b+1)+1: b\\in GF(2^n)\\}$ and all distinct nonzero $v_1,v_2\\in GF(2^n)$, \\[ \\bigl|\\{(x,y,z)\\inΔ^3 : v_1x+v_2y+(v_1+v_2)z=0\\}\\bigr| \\;=\\; 2^{2n-3}. \\] The conjecture was proposed at the NSUCRYPTO~2019 cryptographic olympiad (the proposer of the problem was not publicly disclosed).   We prove the conjecture for $k\\bmod n\\in\\{1,2,n-2,n-1\\}$, in particular a complete proof for $k=2$ ($d=13$) via a quadratic-form theory and an exact root-count reduction, and we verify it exhaustively by computer for every admissible $(n,k)$ with $n\\le13$.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-08-19T06:25:20+00:00", "updated": "2026-08-19T06:25:20+00:00", "abs_url": "http://arxiv.org/abs/2608.18584v1", "pdf_url": "https://arxiv.org/pdf/2608.18584v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "암호학 및 유한체 위의 부울함수 성질 연구로, 조합론적 기하학의 convex position이나 oriented matroid 문제와 무관.", "summary": "Kasami APN 함수에 관한 추측을 연구하며, 유한체 $GF(2^n)$ 위의 특정 차별집합(difference set)에 대해 선형 방정식의 해의 개수가 정확히 $2^{2n-3}$임을 증명. $k\\bmod n\\in\\{1,2,n-2,n-1\\}$에 대한 완전한 증명과 $n\\le 13$에 대한 전수 검증을 제시.", "technique": "이차형식 이론(quadratic-form theory) 및 근의 개수 감소(exact root-count reduction) 방법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.17300v1", "title": "Monochromatic components in dense 2-edge-coloured balanced bipartite graphs", "authors": ["César Bispo", "George Kontogeorgiou", "Marcelo Lage", "Guilherme O. Mota", "Bruno Skarmeta"], "abstract": "We prove that each $2$-edge-coloured spanning subgraph $G$ of $K_{n,n}$ with $δ(G)\\ge \\lfloor (2n+1)/3 \\rfloor$ can be covered by at most three monochromatic components. We provide a $2$-edge-coloured spanning subgraph of $K_{n,n}$ showing this minimum degree condition is sharp.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T02:52:26+00:00", "updated": "2026-08-18T02:52:26+00:00", "abs_url": "http://arxiv.org/abs/2608.17300v1", "pdf_url": "https://arxiv.org/pdf/2608.17300v1", "journal_ref": "", "doi": "", "comment": "17 pages, 5 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "완전 이분 그래프의 엣지 색칠 및 단색 성분 분해 문제로, McMullen's problem의 convex position이나 oriented matroid 구조와는 직접적 관련이 없음.", "summary": "2-엣지 색칠된 $K_{n,n}$의 부분그래프에서 최소 차수 조건 $δ(G) \\ge \\lfloor (2n+1)/3 \\rfloor$ 하에서 최대 3개의 단색 성분으로 덮을 수 있음을 증명. 이 최소 차수 조건이 tight임을 보이는 예제 제시.", "technique": "그래프 분해 및 최소 차수 기반 조합론적 논증", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.19623v1", "title": "Palette Sparsification for General Uniform Hypergraphs", "authors": ["Ruizhe Shi"], "abstract": "We prove a palette sparsification theorem for general $r$-uniform hypergraphs. For all sufficiently large $n$, every $r\\ge 3$, and every $α\\ge 7.1$, we show that an $n$-vertex $r$-uniform hypergraph of maximum degree $Δ$ is w.h.p. colorable from independently sampled lists of size $O(\\sqrt{\\log n})$ drawn from an ambient palette of size $\\lceil αΔ^{1/(r-1)}\\rceil$. The $\\sqrt{\\log n}$ dependence is asymptotically tight.", "categories": ["math.CO", "cs.DM", "cs.DS"], "primary_category": "math.CO", "published": "2026-08-20T04:16:33+00:00", "updated": "2026-08-20T04:16:33+00:00", "abs_url": "http://arxiv.org/abs/2608.19623v1", "pdf_url": "https://arxiv.org/pdf/2608.19623v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "하이퍼그래프 색칠 문제는 조합론이지만 McMullen's problem(볼록 위치 점 배치, 방향 매트로이드, oriented matroid reorientation)과는 직접 관련이 없음.", "summary": "$r$-균일 하이퍼그래프의 팔레트 희소화(palette sparsification) 정리를 증명함. 최대 차수 $Δ$인 $n$-정점 $r$-균일 하이퍼그래프가 크기 $\\lceil αΔ^{1/(r-1)}\\rceil$인 환경 팔레트에서 독립적으로 추출한 크기 $O(\\sqrt{\\log n})$의 리스트로부터 높은 확률로 칠할 수 있음을 보임. $\\sqrt{\\log n}$ 의존성은 점근적으로 타이트함.", "technique": "리스트 색칠(list coloring) 및 확률적 방법(probabilistic method)을 통한 팔레트 희소화 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18568v1", "title": "An Improved Degree Condition for Connectivity-Preserving Spanning $(u,v)$-Paths", "authors": ["Heng Yang"], "abstract": "Teng and Tian proved the following result. Let $k\\ge 2$ and $t\\ge 3$, and let $G$ be a $k$-connected graph of order $n$. If $n\\ge 6k+1$ and $δ(G)\\ge \\lceil(n+6)/2\\rceil$ when $t=3$, while $n\\ge 6k+7t-17$ and $δ(G)\\ge \\lceil(n+t+2)/2\\rceil$ when $t\\ge 4$, then, for any two distinct vertices $u,v$ and every integer $s$ with $1\\le s\\le t$, there exist $s$ internally vertex-disjoint $(u,v)$-paths $P_1,\\dots,P_s$ whose union spans $G$ and such that $G-E(P_1\\cup\\cdots\\cup P_s)$ is $k$-connected. They asked whether the minimum-degree condition could be lowered to $δ(G)\\ge \\lceil(n+t)/2\\rceil$ for every $t\\ge 3$. We answer this question affirmatively and further reduce the required order to $n\\ge \\max\\{6k+9-3t,\\,2k+t+3\\}$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T05:53:51+00:00", "updated": "2026-08-19T05:53:51+00:00", "abs_url": "http://arxiv.org/abs/2608.18568v1", "pdf_url": "https://arxiv.org/pdf/2608.18568v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "고차 연결성을 보존하는 경로 분해(path decomposition) 문제로, McMullen's problem의 중심인 점 배치의 구조적 성질(general position, oriented matroid)과는 직접적 연관이 없음.", "summary": "본 논문은 k-연결 그래프에서 두 꼭짓점 u, v 사이의 여러 내부 정점-분리 경로들이 그래프를 span하면서 동시에 k-연결성을 보존하는 조건을 다룬다. Teng-Tian의 최소차수(minimum degree) 조건을 개선하여 δ(G)≥⌈(n+t)/2⌉로 낮추고, 필요한 정점 개수 조건도 n≥max{6k+9-3t, 2k+t+3}으로 감소시켰다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18942v1", "title": "Inversion Diameter of Planar Graphs", "authors": ["Yichen Wang", "Yuxuan Yang"], "abstract": "Given an oriented graph $\\vec{G}$ and a subset of vertices $X \\subseteq V(\\vec{G})$, the \\emph{inversion} of $X$ is the operation that reverses the orientation of every arc with both endpoints in $X$. For a simple graph $G$, the inversion diameter $\\operatorname{diam}(I(G))$ is the maximum distance between two orientations of $G$ under inversions of vertex sets. We prove the sharp bound \\[ \\operatorname{diam}(I(G))\\le 2χ_a(G)-2, \\] where $χ_a(G)$ is the acyclic chromatic number. Consequently, every planar graph has inversion diameter at most $8$, improving the previously known bound $12$. Using strong-degeneracy arguments, we also obtain upper bounds $7$, $5$, and $4$ for planar graphs of girth at least $4$, $5$, and $6$, respectively.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T14:08:42+00:00", "updated": "2026-08-19T14:08:42+00:00", "abs_url": "http://arxiv.org/abs/2608.18942v1", "pdf_url": "https://arxiv.org/pdf/2608.18942v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "평면 그래프의 inversion diameter 연구로, McMullen의 문제(볼록 위치의 점 배치와 oriented matroid 관련)와는 직접 관계가 없음.", "summary": "주어진 oriented graph에서 vertex subset의 inversion(호의 방향 반전) 연산 하에서 두 orientation 사이의 거리인 inversion diameter를 연구함. 평면 그래프의 inversion diameter가 최대 8임을 증명하여 기존 상한 12를 개선.", "technique": "Acyclic chromatic number $χ_a(G)$를 이용한 상한 $\\operatorname{diam}(I(G))\\le 2χ_a(G)-2$ 도출 및 strong-degeneracy 논증.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18461v1", "title": "Wilf Equivalence for Length-Three Patterns and Flat POPs, and a Conjecture of Qiu and Remmel", "authors": ["Shiqi Cao", "Sergey Kitaev", "Yuxin Wu"], "abstract": "It is well known that, for each classical pattern $τ$ of length 3, the number of $τ$-avoiding permutations of length $n$ is the $n$th Catalan number, and numerous bijections between different length-three avoidance classes have been constructed and studied. In this paper, we refine this classical problem by studying Wilf equivalence among permutations that simultaneously avoid a classical pattern of length three and a flat partially ordered pattern.   Partially ordered patterns (POPs) provide a flexible framework for encoding families of classical permutation patterns. For $\\ell\\geq 3$ and $1\\leq x\\leq\\ell$, let $P_{\\ell,x}$ be the length-$\\ell$ POP in which the entry at position $x$ is required to be smaller than all the other entries, while no relations are imposed among the remaining entries. Such POPs are called flat POPs. We classify the Wilf equivalences among all pairs $(τ,P_{\\ell,x})$, where $τ$ is a classical pattern of length three. For every $\\ell\\geq4$, the resulting $6\\ell$ pairs form exactly $2\\ell-1$ Wilf equivalence classes, while the exceptional case $\\ell=3$ gives four classes. Our proofs combine the derivation of explicit formulas and recurrence relations with the construction of bijections. Moreover, we introduce novel prime-divisor arguments to distinguish the remaining candidate classes, reducing the problem to showing that a certain Diophantine equation has no solutions for $\\ell\\ge 3{,}274$, where the bound $3{,}274$ is not claimed to be sharp. Finally, by extending our work on POPs, we resolve a conjecture of Qiu and Remmel concerning the distribution of quadrant marked mesh patterns on 132-avoiding permutations and correct an error in their paper that is crucial to the proof.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T02:34:29+00:00", "updated": "2026-08-19T02:34:29+00:00", "abs_url": "http://arxiv.org/abs/2608.18461v1", "pdf_url": "https://arxiv.org/pdf/2608.18461v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "permutation pattern avoidance와 Wilf equivalence는 조합론의 고전 주제이나 McMullen's problem (d=5)의 convex position, oriented matroid, tope graph 등과는 직접 관련이 없음.", "summary": "본 논문은 길이 3의 고전 패턴과 flat partially ordered pattern(POP)을 동시에 회피하는 순열들의 Wilf equivalence를 분류한다. 모든 쌍 $(τ, P_{ℓ,x})$에 대해 $ℓ≥4$일 때 정확히 $2ℓ-1$개의 Wilf equivalence class가 존재함을 보이고, Diophantine 방정식의 무해성과 bijection 구성을 통해 증명한다.", "technique": "명시적 공식과 recurrence relation 유도, bijection 구성, 소인수 argument를 활용한 Diophantine 방정식 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.16412v1", "title": "A new flag-transitive linear space", "authors": ["Seyed Hassan Alavi", "Ashraf Daneshkhah", "Martin W. Liebeck", "Cheryl E. Praeger"], "abstract": "We construct a new flag-transitive $2$-$(496,4,1)$ design with automorphism group $\\mathrm{PΓL}_2(32)$. This corrects an omission in the classification of the finite flag-transitive linear spaces.", "categories": ["math.CO", "math.GR"], "primary_category": "math.CO", "published": "2026-08-17T11:07:13+00:00", "updated": "2026-08-17T11:07:13+00:00", "abs_url": "http://arxiv.org/abs/2608.16412v1", "pdf_url": "https://arxiv.org/pdf/2608.16412v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Flag-transitive linear spaces와 design theory는 discrete geometry의 다른 분야이며, McMullen's problem의 convex position, oriented matroid, realizability와 직접 관련이 없음.", "summary": "본 논문은 자기동형군이 PΓL₂(32)인 새로운 flag-transitive 2-(496,4,1) design을 구성한다. 이는 유한 flag-transitive linear spaces의 분류에서 누락된 부분을 바로잡는다.", "technique": "초록만으로는 구성 방법이 명시되지 않음.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.19507v1", "title": "On the number of solutions of systems of diagonal equations through diagonal GP-graphs: the general and the Hermitian-form cases", "authors": ["Ricardo A. Podestá", "Denis E. Videla"], "abstract": "For any $m, s \\in \\mathbb{N}$, we study the number $N_{m\\times s,q}(κ, β)$ of solutions $(x_1,\\ldots,x_s) \\in (\\mathbb{F}_q)^s$ of the monic system of diagonal equations   $$ X_{1}^{k_i} + \\cdots + X_{s}^{k_i}= β_i, \\qquad (1\\le i \\le m), $$ with $κ=(k_1,\\ldots,k_m) \\in \\mathbb{N}^m$ and $β=(β_1,\\ldots,β_m) \\in (\\mathbb{F}_q)^m$. We show that this number can be obtained in terms of some data of \\textit{diagonal} GP-graphs $Γ(κ,q)$. This is a new family of graphs that we introduce here, i.e. Cayley graphs of the form   $$ Γ(κ,q) = Cay(\\mathbb{F}_{q}^{m}, R_κ) \\quad \\text{where} \\quad   R_κ = \\{ (x^{k_1},\\ldots,x^{k_m}) : x \\in \\mathbb{F}_{q}^*\\}, $$ with $κ=(k_1,\\ldots,k_m)\\in \\mathbb{N}^{m}$. In particular, we give three different expressions for $N_{m\\times s,q}(κ, β)$: one in terms of walks, another in terms of adjacency matrices of $Γ(κ,q)$ and the last one in terms of the spectrum of $Γ(κ,q)$. Finally, we explicitly derive combinatorial formulas for the number of solutions $N_{m}(s,q) = N_{m\\times s,q}(κ_\\ell, 0)$ of monic homogeneous systems of diagonal equations of the form $$ X_1^{q^{\\ell_i}+1} + \\cdots + X_s^{q^{\\ell_i}+1} = 0 \\qquad (1\\le i \\le m),$$ with $κ_\\ell=(\\ell_1,\\ldots,\\ell_m)=(1,3,\\ldots,2m-1)$ and $m\\ge 2$, via the known spectrum of Hermitian-form graphs, which can be viewed as diagonal GP-graphs. For any $m,s \\in \\mathbb{N}$, we give general summation and recursive formulas for $N_m(s,q) \\in \\mathbb{Z}[q]$. For the small cases $N_{1}(s,q)$, $N_{2}(s,q)$ and $N_{m}(s,q)$, with $1\\le s \\le 5$, we give explicit expressions.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-08-19T23:49:29+00:00", "updated": "2026-08-19T23:49:29+00:00", "abs_url": "http://arxiv.org/abs/2608.19507v1", "pdf_url": "https://arxiv.org/pdf/2608.19507v1", "journal_ref": "", "doi": "", "comment": "45 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "논문은 유한체 위의 대각 방정식 해의 개수를 연구하는 것으로, McMullen의 문제(볼록 위치 점 배치의 조합론)와는 직접적 관련이 없음.", "summary": "논문은 유한체 $\\mathbb{F}_q$ 위의 단항 대각 방정식 시스템의 해의 개수 $N_{m\\times s,q}(κ, β)$를 연구한다. 이를 새로운 대각 GP-그래프 $Γ(κ,q)$ (Cayley 그래프)의 스펙트럼 데이터를 통해 표현하며, Hermitian-form 그래프의 알려진 스펙트럼을 이용해 특정 경우의 조합 공식을 유도한다.", "technique": "Cayley 그래프의 스펙트럼 분석과 인접 행렬을 통한 보행(walk) 계산.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.17851v2", "title": "Counterexamples to two conjectures on (1, 2)-domination in cubic graphs", "authors": ["Martin Knor", "Jelena Sedlar", "Riste Škrekovski"], "abstract": "Let G be a cubic graph of order n. The induced cycles vertex number cind(G) is the largest size of a vertex set that induces a 2-regular subgraph of G. By gamma_1,2(G) we denote the (1,2)-domination number of G. Erves and Tepeh introduced the trilobite graphs T_n, which satisfy gamma_1,2(T_n) > cind(T_n). They stated two conjectures, the first of which says that every cubic graph G with cind(G) >= n/2 + 2 satisfies gamma_1,2(G) <= cind(G). The second says that a connected cubic graph G satisfies gamma_1,2(G) > cind(G) if and only if G is a trilobite. We show that both conjectures are false. A computer search finds counterexamples that are not trilobites already for n = 18, 20 and 22. We also construct an infinite family H(k) of order n = 20 + 4k. For every k >= 0 we prove that cind(H(k)) = n/2 + 2 and gamma_1,2(H(k)) = n/2 + 3. Hence both conjectures fail for infinitely many orders n.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T14:45:45+00:00", "updated": "2026-08-19T14:42:03+00:00", "abs_url": "http://arxiv.org/abs/2608.17851v2", "pdf_url": "https://arxiv.org/pdf/2608.17851v2", "journal_ref": "", "doi": "", "comment": "15 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "3-정규 그래프의 지배수(domination number) 문제로, McMullen's problem의 볼록 배치·combinatorial geometry와 무관.", "summary": "3-정규 그래프에서 (1,2)-지배수 γ₁,₂(G)와 유도 사이클 정점 수 cind(G)의 관계에 대한 두 추측이 거짓임을 보인다. 컴퓨터 탐색으로 trilobite가 아닌 반례를 n=18,20,22에서 찾았으며, cind(H(k))=n/2+2, γ₁,₂(H(k))=n/2+3을 만족하는 무한 가족 H(k)를 구성했다.", "technique": "컴퓨터 탐색 및 무한 가족의 명시적 구성", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18492v1", "title": "From the Square-Energy Conjecture to Signed Graphs: Sharp Bounds for Positive Square Energy", "authors": ["Fu-Tao Hu", "Xiao Han"], "abstract": "Let $Σ=(G,σ)$ be a connected signed graph of order $n$ and size $m$, and let $s^{+}(Σ)$ and $s^{-}(Σ)$ denote the sums of the squares of its positive and negative adjacency eigenvalues, respectively. The square-energy conjecture of Elphick, Farber, Goldberg, and Wocjan states that every connected graph $G$ of order $n$ satisfies \\[   \\min\\{s^{+}(G),s^{-}(G)\\}\\ge n-1. \\] Liu and Ning~\\cite{LiuNing2023} published a wide-ranging paper entitled ``Unsolved Problems in spectral graph theory\", and this conjectures were placed first in their list of such problems. We prove that every signature $σ$ of a connected graph $G$ satisfies the sharp bound \\[   s^{+}(Σ)\\le 2m-n+1. \\] For the all-positive signing this gives $s^{+}(G)\\le 2m-n+1$, whereas for the all-negative signing it gives $s^{-}(G)\\le 2m-n+1$. Since $s^{+}(G)+s^{-}(G)=2m$, these two special cases imply the square-energy conjecture; the present theorem is stronger in scope because the same bound holds for every signing of $G$. Applying the theorem to the negation $-Σ$ also yields \\[   s^{+}(Σ)\\ge n-1. \\] Both bounds are sharp. The proof is based on a doubly nonnegative matrix inequality. We also shorten the proof of that inequality by replacing its final case distinction with a fixed convex combination.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T03:32:24+00:00", "updated": "2026-08-19T03:32:24+00:00", "abs_url": "http://arxiv.org/abs/2608.18492v1", "pdf_url": "https://arxiv.org/pdf/2608.18492v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "스펙트럼 그래프 이론의 고유값 부등식 문제로, McMullen's problem의 조합기하학적 관점과 직접 관련 없음.", "summary": "부호 그래프(signed graph)의 양의 고유값 제곱의 합에 대한 상한 $s^{+}(Σ) \\le 2m-n+1$을 증명하여 Elphick-Farber-Goldberg-Wocjan의 제곱-에너지 추측(square-energy conjecture)을 해결함. 이 결과는 모든 부호화에 대해 성립하며 양쪽 부등식 모두 최적임.", "technique": "doubly nonnegative matrix inequality 기반의 스펙트럼 증명; 볼록결합(convex combination)을 이용한 증명 단순화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.21246v1", "title": "Space-filling surfaces: sharp Hölder continuous parameterizations from squares to cubes", "authors": ["Matthew Badger", "Kevin Palmer"], "abstract": "Following a hint of Semmes, we employ Stong's bijections between integer lattices to construct space-filling surfaces, which are higher-dimensional analogues of space-filling curves. For each $m\\geq 2$ we build $α$-Hölder continuous parameterizations $f:[0,1]^m\\rightarrow[0,1]^{m+1}$ with sharp exponent $α=m/(m+1)$. In particular, there exist $(2/3)$-Hölder continuous surjections from squares to cubes. This solves Arnold's problem 1988--5.", "categories": ["math.MG", "math.CA"], "primary_category": "math.MG", "published": "2026-08-21T15:58:35+00:00", "updated": "2026-08-21T15:58:35+00:00", "abs_url": "http://arxiv.org/abs/2608.21246v1", "pdf_url": "https://arxiv.org/pdf/2608.21246v1", "journal_ref": "", "doi": "", "comment": "15 pages, 6 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "공간채우기 곡선·곡면의 위상기하학적 구성 문제로, McMullen's problem의 조합론적·기하학적 배치 문제와 직접 관련성 없음.", "summary": "Stong의 정수격자 전단사를 이용하여 공간채우기 곡면(space-filling surfaces)을 구성하고, $[0,1]^m$에서 $[0,1]^{m+1}$으로의 sharp $\\alpha=m/(m+1)$-Hölder 연속 전사를 달성한다. 특히 정사각형에서 정육면체로의 $(2/3)$-Hölder 연속 전사 존재성으로 Arnold 문제 1988-5를 해결한다.", "technique": "Stong의 격자 전단사(bijections between integer lattices)를 활용한 곡면 매개변수화 구성", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.23223v1", "title": "Coset geometries acting on their elements: The $j$-diagonals twisting", "authors": ["Claudio Alexandre Piedade", "Philippe Tranchida"], "abstract": "Let $β$ be a coset incidence system and fix a type $j$. We use the orbits of the group of $β$ on pairs of distinct $j$-elements to define a Coxeter graph. The action on the $j$-elements induces an action on the corresponding Coxeter group, so the twisting construction for coset incidence systems can be applied. The resulting coset geometry, called the $j$-diagonals twisting, is always a regular hypertope if $β$ is a regular hypertope. Using this, we show that finite regular hypertope whose diagram is a tree with all but one of the labels equal to four always exist. We also define an extension operation that combines this Coxeter graph with another given Coxeter graph. For regular polytopes, these constructions recover the twisting extensions of McMullen and Schulte.", "categories": ["math.CO", "math.GR"], "primary_category": "math.CO", "published": "2026-08-24T13:15:49+00:00", "updated": "2026-08-24T13:15:49+00:00", "abs_url": "http://arxiv.org/abs/2608.23223v1", "pdf_url": "https://arxiv.org/pdf/2608.23223v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen의 이름이 언급되지만(McMullen-Schulte의 twisting extension 복원), 이는 추상 정다면체(regular polytopes/hypertopes)의 구성 이론에 관한 것으로, McMullen's problem(f(5)=11, convex/general position 점 배치)과는 무관하다.", "summary": "이 논문은 coset incidence system에서 타입 $j$의 원소 쌍에 대한 군의 궤도를 이용해 Coxeter 그래프를 정의하고, 이른바 $j$-diagonals twisting을 구성한다. $\\beta$가 regular hypertope이면 결과 coset geometry도 항상 regular hypertope임을 증명하며, 다이어그램이 tree이고 하나를 제외한 모든 레이블이 4인 유한 regular hypertope의 존재성을 보인다. 또한 두 Coxeter 그래프를 결합하는 확장 연산을 정의하고, regular polytope의 경우 McMullen-Schulte의 twisting extension을 복원함을 보인다.", "technique": "coset incidence system 위의 군 궤도로부터 Coxeter 그래프를 정의하고 twisting 구성을 적용하는 대수적 방법.", "connections": "", "keyword_hits": ["mcmullen", "tope"], "source": "filter"}, {"id": "2608.22541v1", "title": "Polytopal bases for barycentric subdivisions", "authors": ["Spencer Backman", "Federico Castillo"], "abstract": "Several important fans studied at the interface of combinatorics and algebraic geometry arise from barycentric subdivisions of other fans; the central example is the braid arrangement. The collection of faces of the standard simplex forms a basis for the deformation cone of the braid arrangement, i.e. the cone of generalized permutahedra. We reinterpret this simplicial basis as the collection of deep truncations of the standard simplex, and systematically abstract this perspective to produce polytopal bases for the deformation cones of barycentric subdivisions of simplicial projective fans. We further demonstrate that these bases restrict to bases for deformation cones of fans obtained by a sequence of stellar subdivisions induced by a building set. When the starting polytope is smooth with all edge lengths equal to 1, we show that we can upgrade our basis to a collection of flat truncations. We then investigate two extensions of the braid arrangement where we are able to further upgrade our flat truncation basis to an indecomposable polytopal basis: 1.the barycentric subdivision of the normal fan of a product of standard simplices and 2.the barycentric subdivision of the braid arrangement.   We discuss connections to, and implications for, Archimedean solids and regular polytopes, permutahedral plates, root polytopes, permutoassociahedra, simple permutonestohedra, cosmohedra, omnitruncations of Coxeter permutahedra, bipermutahedra, $π$-colored fans, and tropical $α$ and $β$ classes.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-23T18:23:39+00:00", "updated": "2026-08-23T18:23:39+00:00", "abs_url": "http://arxiv.org/abs/2608.22541v1", "pdf_url": "https://arxiv.org/pdf/2608.22541v1", "journal_ref": "", "doi": "", "comment": "Comments are welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 조합론과 대수기하학 경계의 팬(fan)·다면체 이론을 다루며, McMullen 문제나 oriented matroid와 직접적 관련이 없다.", "summary": "이 논문은 단순 사영 팬(simplicial projective fan)의 중심 세분(barycentric subdivision)의 변형 원뿔(deformation cone)에 대한 다면체 기저(polytopal basis)를 체계적으로 구성한다. 표준 단체(standard simplex)의 면들이 교란 순열다면체(generalized permutahedra)의 변형 원뿔 기저를 이룬다는 사실을 '깊은 절단(deep truncation)' 관점으로 재해석하고, 이를 일반화한다. 매끄럽고 모든 모서리 길이가 1인 다면체에 대해서는 평탄 절단(flat truncation) 기저, 나아가 불가분(indecomposable) 다면체 기저로 업그레이드할 수 있음을 보인다.", "technique": "중심 세분 팬의 변형 원뿔에 대해 깊은 절단(deep truncation) 및 평탄 절단(flat truncation) 다면체 기저를 구성하고, 빌딩 집합(building set)에 의한 성형 세분(stellar subdivision) 시퀀스로 기저를 제한하는 방법을 사용한다.", "connections": "", "keyword_hits": ["tope", "tropical"], "source": "filter"}, {"id": "2608.22320v1", "title": "A note on distinct volume subsets problem", "authors": ["Koki Furukawa"], "abstract": "For $2 \\leq a \\leq d+1$, what is the largest integer $H_{a,d} (n)$ such that every set of $n$ points in $\\mathbb{R}^d$ with no $a$ points on a common $(a-2)$-flat contains a subset of $H_{a,d} (n)$ points whose determined $(a-1)$-dimensional simplices have pairwise distinct $(a-1)$-dimensional volumes? We construct $n$-point sets that improve the best known upper bounds for $H_{a,d}(n)$ in several cases of $a$ and $d$.   We also study a dual version of the problem. Let $D_d(n)$ the maximum number such that for any arrangement of $n$ hyperplanes in general position in $\\mathbb{R}^d$, we can always find a subset of $D_d(n)$ hyperplanes for which all the $d$-dimensional simplices that they define have distinct $d$-dimensional volumes. We improve the current known upper bound for $D_d(n)$ and give the first nontrivial lower bound for $D_2(n)$ and $D_3 (n)$.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-08-23T09:34:26+00:00", "updated": "2026-08-23T09:34:26+00:00", "abs_url": "http://arxiv.org/abs/2608.22320v1", "pdf_url": "https://arxiv.org/pdf/2608.22320v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 distinct volume subsets 문제(초록에서 $H_{a,d}(n)$ 및 $D_d(n)$)를 다루며, McMullen 문제·Larman 추측·oriented matroid 등과 직접적 연관이 없다.", "summary": "이 논문은 $\\mathbb{R}^d$에서 $n$개의 점 집합 중 결정되는 $(a-1)$차원 단체들의 부피가 모두 다른 최대 부분집합의 크기 $H_{a,d}(n)$에 대한 상한을 개선하는 구성을 제시한다. 또한 쌍대 버전으로서 $n$개의 초평면 배열에서 결정되는 $d$차원 단체의 부피가 모두 다른 최대 부분집합 크기 $D_d(n)$의 상한을 개선하고, $D_2(n)$ 및 $D_3(n)$에 대한 최초의 비자명 하한을 제공한다.", "technique": "상한 개선을 위한 명시적 점 집합 구성(construction) 및 초평면 배열에 대한 조합론적 분석.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2608.22290v1", "title": "Approximate counting of vertices of 0/1 polytopes: a stronger hardness result", "authors": ["Mark Jerrum", "Heng Guo"], "abstract": "We show that approximately counting the vertices of a bounded 0/1 polytope, presented as a system of rational linear inequalities, is, informally speaking, NP-hard. In particular, there is no FPRAS for this problem unless RP=NP. The proof is by a reduction from approximately counting homomorphisms from a given graph to a particular four-vertex graph. The main proof ideas were found using GPT-5.6 Sol Ultra.", "categories": ["cs.CC", "math.CO"], "primary_category": "cs.CC", "published": "2026-08-23T08:31:42+00:00", "updated": "2026-08-23T08:31:42+00:00", "abs_url": "http://arxiv.org/abs/2608.22290v1", "pdf_url": "https://arxiv.org/pdf/2608.22290v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "0/1 폴리토프의 꼭짓점 세기 문제를 다루지만, McMullen's problem(d=5에서의 convex/general position 점 배치, oriented matroid 등)과는 직접적 관련이 없다.", "summary": "이 논문은 유리 선형 부등식계로 표현된 유한 0/1 폴리토프의 꼭짓점 개수를 근사적으로 세는 문제가 NP-hard임을 보인다. 구체적으로, RP=NP가 아닌 한 이 문제에 대한 FPRAS가 존재하지 않음을 증명한다. 증명은 특정 4-꼭짓점 그래프로의 그래프 준동형사상(homomorphism) 근사 계산 문제로부터의 환원(reduction)에 기반한다.", "technique": "특정 4-꼭짓점 그래프로의 그래프 준동형사상 근사 계산 문제로부터의 다항식 환원(polynomial reduction)을 통해 FPRAS 불가능성을 도출.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.21855v1", "title": "Trapezoidality of flat arrangement polynomials", "authors": ["Yuan Gao", "Tianyu Yuan"], "abstract": "Fox's conjecture predicts that the absolute values of the coefficients of the Alexander polynomial of an alternating link form a trapezoidal sequence. Kálmán, Mészáros, and Postnikov gave a new proof of trapezoidality for special alternating links using a polynomial associated with flat vector arrangements. We prove that the flat arrangement polynomial has trapezoidal coefficients for every full-dimensional flat vector arrangement, answering the corresponding open question. Our proof gives a geometric interpretation of this polynomial in terms of convex polytopes. As an application, we prove that the Murasugi--Stoimenow polynomial of every connected Eulerian digraph has trapezoidal coefficients.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-08-22T08:59:17+00:00", "updated": "2026-08-22T08:59:17+00:00", "abs_url": "http://arxiv.org/abs/2608.21855v1", "pdf_url": "https://arxiv.org/pdf/2608.21855v1", "journal_ref": "", "doi": "", "comment": "18 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Alexander 다항식 계수의 사다리꼴 성질(trapezoidality)과 볼록 다면체 해석에 관한 것으로, McMullen 문제(d=5 볼록 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 Fox의 추측(교대 링크의 Alexander 다항식 계수의 절댓값이 사다리꼴 수열을 이룬다는 예측)에 관련하여, 평탄 벡터 배열(flat vector arrangement) 다항식의 계수가 모든 전차원(full-dimensional) 평탄 벡터 배열에 대해 사다리꼴(trapezoidal) 임을 증명한다. 증명은 볼록 다면체(convex polytope)를 이용한 기하학적 해석을 제공하며, 응용으로서 모든 연결된 오일러 유향 그래프(Eulerian digraph)의 Murasugi–Stoimenow 다항식 계수가 사다리꼴 성질을 가짐을 보인다.", "technique": "평탄 벡터 배열 다항식을 볼록 다면체의 기하학적 대상으로 해석하여 계수의 사다리꼴 성질을 증명한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.21663v1", "title": "Variance lower bounds for geometric functionals of rotationally invariant log-concave random polytopes", "authors": ["Minas Pafis", "Christos Pandis"], "abstract": "We establish variance lower bounds for the intrinsic volumes and the face numbers of random polytopes, generated by independent samples from rotationally invariant log-concave probability measures on $\\mathbb{R}^d$ with full support. Our results extend the corresponding Gaussian lower bounds of Bárány and Vu and of Bárány and Thäle to this broader class of distributions. Our proof builds on the geometric construction introduced by Bárány and Vu, for which we develop an alternative treatment based on barycentric coordinates. We combine it with local variance estimates for both intrinsic volumes and the number of faces.", "categories": ["math.PR", "math.MG"], "primary_category": "math.PR", "published": "2026-08-21T22:11:40+00:00", "updated": "2026-08-21T22:11:40+00:00", "abs_url": "http://arxiv.org/abs/2608.21663v1", "pdf_url": "https://arxiv.org/pdf/2608.21663v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 랜덤 폴리토프의 분산 하한에 관한 확률론·기하학 연구로, McMullen 문제(결정론적 점 배치, oriented matroid, realizability)와 직접적인 관련이 없다.", "summary": "이 논문은 $\\mathbb{R}^d$ 위의 회전 불변(rotationally invariant) 로그-오목(log-concave) 확률측도에서 생성된 랜덤 폴리토프의 내재 부피(intrinsic volumes) 및 면 수(face numbers)에 대한 분산 하한을 확립한다. 이는 Bárány–Vu 및 Bárány–Thäle의 가우시안 분포에 대한 기존 결과를 보다 넓은 분포 군으로 확장한 것이다. 증명은 Bárány–Vu의 기하학적 구성을 무게중심 좌표(barycentric coordinates) 기반의 대안적 처리와 결합하고, 내재 부피 및 면 수에 대한 국소 분산 추정(local variance estimates)을 활용한다.", "technique": "무게중심 좌표(barycentric coordinates)를 이용한 Bárány–Vu 기하학적 구성의 재해석과 내재 부피·면 수에 대한 국소 분산 추정(local variance estimates)의 결합.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.21585v1", "title": "The Asayama-Matsumoto conjecture and a refined discrepancy bound", "authors": ["Alessio Basti", "Tommaso Cremaschi"], "abstract": "Every $n$-vertex plane triangulation admits a polychromatic red--blue vertex coloring with discrepancy at most $n-2\\ceil{n/3}\\le\\floor{n/3}$, resolving a conjecture of Asayama and Matsumoto. The proof follows by combining Loyola et al. 2026 and Kawarabayashi et al. 2026. For $n\\ge6$ and $n\\not\\equiv5\\pmod6$, we prove the sharper bound $n-2\\ceil{(n+2)/3}$. An exhaustive census of all $9{,}150$ non-isomorphic sphere triangulations with $4\\le n\\le12$ verifies the bounds and also confirms the sharper estimate at $n=11$, the first order in the remaining open residue class.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-21T19:38:39+00:00", "updated": "2026-08-21T19:38:39+00:00", "abs_url": "http://arxiv.org/abs/2608.21585v1", "pdf_url": "https://arxiv.org/pdf/2608.21585v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 삼각분할의 다색 꼭짓점 채색 불일치(discrepancy) 문제를 다루며, McMullen 문제나 Larman 추측과 직접적인 연관이 없다.", "summary": "모든 $n$-꼭짓점 평면 삼각분할이 불일치 $n-2\\lceil n/3\\rceil \\le \\lfloor n/3\\rfloor$ 이하의 다색 적청 꼭짓점 채색을 허용함을 증명하여 Asayama–Matsumoto 추측을 해결하였다. $n\\ge6$이고 $n\\not\\equiv5\\pmod{6}$인 경우 더 강한 상한 $n-2\\lceil(n+2)/3\\rceil$도 증명된다. $4\\le n\\le12$인 비동형 구면 삼각분할 $9{,}150$개의 전수 조사를 통해 경계를 검증하였다.", "technique": "Loyola et al. 2026과 Kawarabayashi et al. 2026의 결과를 결합하고, 소규모 사례에 대한 전수 조사(exhaustive census)를 수행하는 방식으로 증명을 완성하였다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.22053v1", "title": "An application of Jacobi's residue formula and proofs of some other conjectures on binomial coefficients", "authors": ["Rohun Easwar"], "abstract": "We prove seven conjectures involving binomial coefficients. These conjectures appear in The On-Line Encyclopedia of Integer Sequences (OEIS). Among these is an application of Jacobi's residue formula. We also apply MacMahon's master theorem to give a new and independently obtained proof of a recently established result.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-22T17:37:47+00:00", "updated": "2026-08-22T17:37:47+00:00", "abs_url": "http://arxiv.org/abs/2608.22053v1", "pdf_url": "https://arxiv.org/pdf/2608.22053v1", "journal_ref": "", "doi": "", "comment": "27 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이항계수 항등식 증명은 조합론 일반 분야이나, McMullen's problem의 convex position, oriented matroid, 기하학적 구조와는 직접 관련 없음.", "summary": "본 논문은 OEIS에 나타난 이항계수 관련 일곱 개의 추측을 증명한다. Jacobi의 유수 공식(residue formula)을 적용하며, MacMahon의 주정리(master theorem)를 이용하여 최근 결과의 새로운 독립적 증명을 제시한다.", "technique": "Jacobi의 유수 공식과 MacMahon의 주정리를 이항계수 항등식 증명에 적용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.20048v1", "title": "The Prescribed-Vertex Semidegree Threshold for Directed $3q$-Cycles in Oriented Graphs", "authors": ["Zhenhua Lyu"], "abstract": "For every $q\\ge2$, we prove that every oriented graph $G$ on $n\\ge45q-8$ vertices whose minimum semidegree satisfies \\[   δ^0(G)\\ge \\left\\lceil\\frac n3\\right\\rceil \\] contains a directed cycle of length $3q$ through every vertex. The semidegree bound is sharp. This closes the one-unit gap left by the prescribed-vertex theorem of Kelly, Kühn and Osthus when $3\\mid n$. We also prove that if an oriented graph $H$ has order $N$, minimum semidegree $d\\ge3$, and $7d\\ge2N+3$, then every ordered pair of distinct vertices is joined by a path of length three, four, or five. The constant $+3$ is best possible. As a consequence, the order hypothesis $n\\ge10^{10}\\ell$ in the general prescribed-vertex theorem of Kelly, Kühn and Osthus can be replaced by $n\\ge15\\ell-60$ for $\\ell\\ge7$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-20T13:49:24+00:00", "updated": "2026-08-20T13:49:24+00:00", "abs_url": "http://arxiv.org/abs/2608.20048v1", "pdf_url": "https://arxiv.org/pdf/2608.20048v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 방향 그래프의 사이클 존재성에 관한 조합론 문제로, McMullen's problem과 관련된 convex position, general position, oriented matroid 주제와는 직접적 연관이 없음.", "summary": "이 논문은 $n\\ge45q-8$개 정점의 방향 그래프에서 최소 semidegree 조건 $\\delta^0(G)\\ge\\lceil\\frac{n}{3}\\rceil$이 만족될 때, 길이 $3q$의 방향 사이클이 모든 정점을 지나가도록 존재함을 증명한다. Kelly, Kühn, Osthus의 prescribed-vertex 정리의 한 단위 간격을 해소하며, 순서쌍 정점들을 연결하는 길이 3-5의 경로에 관한 부가 결과를 제시한다.", "technique": "Semidegree 조건 기반의 정점-사이클 포함 정리; 경로 길이 조건의 최적화를 통한 prescribed-vertex 정리의 개선.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18747v1", "title": "Characteristic adjacency matrix associated with a hypergraph", "authors": ["Alain Bretto", "Alain Faisant"], "abstract": "We define a new matrix associated with a hypergraph. A study of this matrix is carried out, in particular the study of its spectrum, which shows the relevance of the construction. We demon- strate that this adjacency matrix is characterisitic of the hypergraph, that is to say, two isomorphic hypergraphs have similar matrices. Furthermore, starting from this matrix, we can recon

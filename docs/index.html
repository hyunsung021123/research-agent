lished": "2026-06-23T17:19:20+00:00", "updated": "2026-06-23T17:19:20+00:00", "abs_url": "http://arxiv.org/abs/2606.24840v1", "pdf_url": "https://arxiv.org/pdf/2606.24840v1", "journal_ref": "", "doi": "", "comment": "17 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "양자 Littlewood-Richardson 대합과 symplectic column의 reduction map은 McMullen's problem의 convex position, oriented matroid, 조합적 구조와 직접적 관련이 없음.", "summary": "본 논문은 양자 Littlewood-Richardson 대합(quantum Littlewood-Richardson bijection)에서 reduction map의 역함수를 symplectic column의 특정 패턴에 대해 명시적으로 계산한다. 이러한 패턴들은 일반 symplectic column의 reduction map 역함수 계산을 위한 cell piece로 작용하며, Watanabe의 combinatorial $R$-matrices와 조합되어 큰 symplectic column에 적용될 수 있다.", "technique": "Symplectic column의 세포 구조(cell pieces) 분해와 combinatorial $R$-matrices를 이용한 reduction map의 역함수 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2606.24776v1", "title": "A disproof of the uniform witness conjecture", "authors": ["Zixiang Xu"], "abstract": "The study of $(d+1)$-uniform set systems with VC-dimension at most $d$ links the Erdős--Ko--Rado theorem with VC-dimension. But already in 1997, Ahlswede and Khachatrian showed that this is not the right extension of the Erdős--Ko--Rado theorem. In 2025, Chao, Xu, Yip and Zhang proposed the uniform witness conjecture as a possible right extension: for $0\\le s\\le d$, if every set of a $(d+1)$-uniform family has a missing trace of the same fixed size $s$, then the family should have size at most $\\binom{n-1}{d}$. They proved the conjecture when $s=d$, and when $s=1$ and $n$ is large. Very recently, Chao, Xu and Zakharov proved the conjecture when $s\\le \\frac{d}{2}$ and $n$ is large.   We fill in the missing half of the picture, although the picture is not the one suggested by the conjecture. More precisely, for $d\\ge 4$ and $\\left\\lceil \\frac{d+2}{2}\\right\\rceil\\le s\\le d-1$, we construct such a family $\\mathcal{F}\\subseteq\\binom{[n]}{d+1}$ with $|\\mathcal{F}|=\\binom{n-1}{d}+\\binom{n-2(d+1-s)-2}{2s-d-2}$ for every $n\\ge2(d+1)$, thereby disproving the uniform witness conjecture.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-23T16:35:12+00:00", "updated": "2026-06-23T16:35:12+00:00", "abs_url": "http://arxiv.org/abs/2606.24776v1", "pdf_url": "https://arxiv.org/pdf/2606.24776v1", "journal_ref": "", "doi": "", "comment": "5 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "VC-dimension과 uniform set systems를 다루지만 McMullen's problem(convex position의 combinatorial geometry)과는 직접적 관련 없음.", "summary": "본 논문은 2025년 제안된 uniform witness conjecture를 반박한다. 이 추측은 $(d+1)$-uniform family가 고정 크기 $s$의 missing trace를 모두 가질 때 크기가 $\\binom{n-1}{d}$를 넘지 않는다고 주장했으나, 저자는 $d\\ge 4$와 $\\lceil \\frac{d+2}{2}\\rceil\\le s\\le d-1$ 범위에서 명시적 반례를 구성하여 추측을 거짓임을 보인다.", "technique": "명시적 구성(explicit construction)을 통한 counterexample 제시, 특히 $|\\mathcal{F}|=\\binom{n-1}{d}+\\binom{n-2(d+1-s)-2}{2s-d-2}$ 형태의 가족 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2606.28041v1", "title": "The Erdos n^2/25 max-cut conjecture for small multiples of five, via a per-root-MaxCut envelope and blow-up integrality", "authors": ["Alper Ferudun"], "abstract": "Erdős conjectured that every triangle-free graph on $N$ vertices can be made bipartite by deleting at most $N^2/25$ edges; the bound would be sharp, attained by the balanced blow-up $C_5[N/5]$. Writing $β(G)$ for the minimum number of edges whose deletion makes $G$ bipartite and $a(N) = \\max\\{β(G):G$ triangle-free on $N$ vertices$\\}$, the conjecture is $a(N)\\le N^2/25$, and for $N=5n$ it reads $a(5n)\\le n^2$. Balogh, Clemen and Lidícký proved it for large $N$ in the two density tails (edge density at most $0.2486$ or at least $0.3197$) and proved the global bound $a(N)\\le N^2/23.5$; the medium-density band remains open. We prove \\[ a(5n) = n^2 \\qquad \\text{for every } 1 \\le n \\le 40, \\quad \\text{i.e. } N \\in \\{5,10,\\dots,200\\}. \\] The proof is computer-assisted and combines three ingredients. (i) A \\emph{per-root-MaxCut envelope}: for the $107$ triangle-free $7$-root types, the mean over types of the best per-type cut is an upper bound $d_{\\rm mono}(W)\\le U_7(W)$ that is \\emph{tight} at the $C_5$-blow-up. (ii) An order-$10$ flag-algebra certificate -- the per-root-MaxCut rows at $7$ and $8$ roots together with rooted-Horn cuts and a manifestly-PSD moment block -- bounds the envelope on the medium band, $U_7(W)\\le \\tfrac{2}{25}+δ$ with an explicit rational $δ\\approx 4.8558\\times10^{-5}$, for every triangle-free graphon $W$ of edge density in $[0.2486,0.3197]$. (iii) The blow-up identity $β(G[t])=t^2β(G)$ plus integrality of $β$ turns this into $β(G)\\le n^2+\\tfrac{25}{2}n^2δ$ for any $5n$-vertex band-density $G$, and $\\tfrac{25}{2}n^2δ<1$ for $n\\le 40$; the two density tails are handled by the Balogh-Clemen-Lidícký bounds, transferred to finite $N$ by the same blow-up. The envelope bound $d_{\\rm mono} \\le U_7$ is a genuine graphon upper bound (each per-root rule is one global $2$-colouring), the certificate is verified in exact rational arithmetic, the moment positivity is Razborov's flag-algebra theorem exhibited as an exact Gram factorization, and the bound is cross-checked against brute-force max-cut on all triangle-free graphs of order at most $12$. The same envelope at orders $9$ and $10$ provably does not reach the constant needed for larger $n$; we explain why, and locate the all-$n$ conjecture at a single self-tight obstruction.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-26T12:44:10+00:00", "updated": "2026-06-26T12:44:10+00:00", "abs_url": "http://arxiv.org/abs/2606.28041v1", "pdf_url": "https://arxiv.org/pdf/2606.28041v1", "journal_ref": "", "doi": "", "comment": "9 pages. Computer-assisted. Ancillary files: order-10 per-root-MaxCut + rooted-Horn flag-algebra certificate with an independent exact-arithmetic verifier, a self-contained brute-force max-cut ground-truth checker, and the manifestly-PSD moment Gram certificate", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Erdős max-cut conjecture는 그래프 이론의 극값 문제이며, McMullen's problem(convex polytope의 combinatorial structure)과는 주제와 기법이 근본적으로 다릅니다.", "summary": "본 논문은 삼각형 없는 그래프에서 이분 그래프로 만들기 위해 삭제해야 할 최대 간선 수에 관한 Erdős 추측을 다룹니다. Flag algebra와 blow-up 항등식을 결합한 컴퓨터 보조 증명으로 $N \\in \\{5,10,\\ldots,200\\}$에 대해 $a(5n)=n^2$을 증명합니다.", "technique": "Per-root-MaxCut envelope(107개 삼각형 없는 7-근 타입에 대한 평균 상한)과 10차 flag-algebra certificate를 조합하여 graphon의 중간 밀도 대역에서 경계를 확립하고, blow-up 항등식 $\\beta(G[t])=t^2\\beta(G)$의 정확성을 이용합니다.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.24383v1", "title": "Sharp Bounds For The Layer Number of Integer Grids", "authors": ["Shiyu Yan"], "abstract": "The layer number of a finite point set is the number of iterations needed to delete it by repeatedly removing the vertices of its convex hull. Ambrus, Hsu, Peng, and Yan conjectured that the layer number of the $d$-dimensional integer grid $\\{1,\\ldots,n\\}^d$ is of order $n^{2d/(d+1)}$ for every fixed $d$. We prove this conjecture. Let $P_i$ be the convex hull of the point set remaining after $i$ steps, and let $Z_n$ be the convex hull of the lattice points in the Euclidean ball of radius $n$. For every step that leaves a nonempty point set, the Minkowski sum $P_{i+1}+Z_n$ contains no vertex of $P_i+Z_n$. Integrality of normalized lattice volume, together with the Bárány--Larman vertex estimate for $Z_n$, gives a lower bound, independent of $i$, on the resulting volume decrease. Summing over $i$ yields the matching upper bound, even when $P_i$ is lower-dimensional. For $d\\ge2$, the same upper bound holds uniformly over all nonempty subsets of $\\{1,\\ldots,n\\}^d$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-27T12:59:11+00:00", "updated": "2026-07-27T12:59:11+00:00", "abs_url": "http://arxiv.org/abs/2607.24383v1", "pdf_url": "https://arxiv.org/pdf/2607.24383v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 정수 격자의 layer number(볼록 껍질 반복 삭제 횟수)에 관한 것으로, McMullen 문제나 Larman 추측과 직접적 연관이 없다.", "summary": "이 논문은 $d$차원 정수 격자 $\\{1,\\ldots,n\\}^d$의 layer number가 $n^{2d/(d+1)}$ 차수임을 증명하여 Ambrus, Hsu, Peng, Yan의 추측을 해결한다. 핵심 아이디어는 각 단계에서 Minkowski 합 $P_{i+1}+Z_n$이 $P_i+Z_n$의 꼭짓점을 포함하지 않는다는 관찰이며, 정규화된 격자 부피의 정수성과 Bárány–Larman 꼭짓점 추정을 결합하여 단계마다 부피 감소의 하한을 얻는다. 이를 합산하여 일치하는 상한을 도출하며, $d\\ge 2$일 때 $\\{1,\\ldots,n\\}^d$의 모든 비공 부분집합에 대해 균일하게 성립한다.", "technique": "Minkowski 합과 격자 부피의 정수성, 그리고 Bárány–Larman 꼭짓점 추정을 결합한 단계별 부피 감소 하한 분석.", "connections": "", "keyword_hits": ["larman"], "source": "filter"}, {"id": "2607.23570v1", "title": "Topological line arrangements and their topological invariants", "authors": ["Sakumi Sugawara"], "abstract": "A topological line arrangement is an arrangement of embedded spheres in the complex projective plane that topologically generalizes a complex line arrangement. In this paper, we establish foundational results on the topology of the complement of topological line arrangements. First, we prove that the cohomology ring of the complement is isomorphic to the Orlik-Solomon algebra, as for classical complex line arrangements. Since classical methods are unavailable in this setting, we use a homological method to compute the cohomology ring. We then study the homotopy type of the complement. We prove that the complement of a symplectic line arrangement has the homotopy type of a minimal CW complex. In contrast, every combinatorial type realizable by a topological line arrangement admits a realization with a non-minimal complement. Moreover, every such combinatorial type admits infinitely many realizations whose complements are pairwise non-homotopy equivalent.", "categories": ["math.GT", "math.AT", "math.CO"], "primary_category": "math.GT", "published": "2026-07-26T09:41:29+00:00", "updated": "2026-07-26T09:41:29+00:00", "abs_url": "http://arxiv.org/abs/2607.23570v1", "pdf_url": "https://arxiv.org/pdf/2607.23570v1", "journal_ref": "", "doi": "", "comment": "19 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 위상적 선 배열(topological line arrangement)의 위상 불변량을 다루며, McMullen 문제나 oriented matroid의 acyclic reorientation과는 직접적인 관련이 없다.", "summary": "이 논문은 복소 사영 평면에서 내장된 구면들의 배열인 위상적 선 배열(topological line arrangement)의 여집합(complement)의 위상을 연구한다. 고전적 복소 선 배열과 마찬가지로 여집합의 코호몰로지 환이 Orlik-Solomon 대수와 동형임을 상동론적 방법으로 증명하며, 심플렉틱 선 배열의 여집합이 최소 CW 복합체의 호모토피 형을 가짐을 보인다. 반면, 위상적 선 배열로 실현 가능한 모든 조합론적 유형은 비최소 여집합을 갖는 실현과, 쌍으로 비호모토피 동치인 무한히 많은 실현을 허용함을 증명한다.", "technique": "고전적 방법을 대신하여 상동론적 방법(homological method)을 사용해 여집합의 코호몰로지 환을 계산한다.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2607.24637v1", "title": "Type $C$ multiline queues and the open-boundary TASEP", "authors": ["Olya Mandelshtam", "Jerónimo Valencia-Porras"], "abstract": "The totally asymmetric simple exclusion process (TASEP) with open boundaries is a finite Markov chain describing particles hopping between adjacent sites on a one-dimensional lattice with left and right boundary transitions governed by parameters $α$ and $β$. The multispecies TASEP is a higher-rank generalization in which particles have different species. Multiline queues were introduced by Ferrari and Martin (2007) to compute the stationary distribution of the multispecies TASEP on a circle. It has remained an open problem to find a combinatorial formula for the stationary distribution of the multispecies open-boundary TASEP. Using Kirillov--Reshetikhin crystals of type $C$, we construct type $C$ multiline queues and a corresponding Ferrari--Martin pairing algorithm that projects them to TASEP configurations. This yields a combinatorial formula for the stationary distribution of the multispecies open-boundary TASEP for the $α=β=1$ specialization.", "categories": ["math.CO", "math.PR"], "primary_category": "math.CO", "published": "2026-07-27T16:33:57+00:00", "updated": "2026-07-27T16:33:57+00:00", "abs_url": "http://arxiv.org/abs/2607.24637v1", "pdf_url": "https://arxiv.org/pdf/2607.24637v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학·조합론의 핵심 주제(convex position, oriented matroid 등)와 무관한 확률과정·표현론 기반의 조합적 문제.", "summary": "본 논문은 개방경계 TASEP의 정상분포를 구하는 조합공식을 제시한다. Kirillov–Reshetikhin 타입 $C$ 결정과 Ferrari–Martin 페어링 알고리즘을 이용하여 타입 $C$ 다중선 큐를 구성하고, $\\alpha=\\beta=1$ 특수화에서 다중종 TASEP의 정상분포를 명시적으로 계산한다.", "technique": "Kirillov–Reshetikhin 결정론(type $C$ crystals)과 Ferrari–Martin 페어링 알고리즘을 통한 TASEP 구성의 결합론적 투영.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.24270v1", "title": "Multiplicative Subgroups of Prime Fields Are Not Sumsets", "authors": ["Misha Rudnev", "Fred Tyrrell"], "abstract": "Let $H \\leq \\mathbb{F}_p^*$ be a proper multiplicative subgroup, and suppose that $H = A+B$ for some $A,B \\subseteq \\mathbb{F}_p$. We prove that either one of the summands is a singleton, or $|A|=|B|=2$ and $|H|=4$. In particular, no proper multiplicative subgroup of $\\mathbb{F}_p^*$ can be written as $A+B$ with $|A|,|B|>2$.   Our proof builds on the Hanson-Petridis polynomial method and Kalmynin's subsequent resolution of Sárközy's conjecture for quadratic residues. Using Kalmynin's $|A|=|B|$ theorem as a structural input, we develop uniform combinatorial and arithmetic arguments which apply to multiplicative subgroups of arbitrary index.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-27T11:10:30+00:00", "updated": "2026-07-27T11:10:30+00:00", "abs_url": "http://arxiv.org/abs/2607.24270v1", "pdf_url": "https://arxiv.org/pdf/2607.24270v1", "journal_ref": "", "doi": "", "comment": "40 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한체의 덧셈-곱셈 구조를 다루지만 McMullen's problem(볼록 위치의 점 배치, oriented matroid, 조합 기하)과는 직접 관련성 없음.", "summary": "유한체 $\\mathbb{F}_p$의 곱셈 부분군 $H$가 두 집합의 합 $A+B$로 표현될 수 없음을 증명. Hanson-Petridis 다항식 방법과 Kalmynin의 결과를 활용하여, 부분군이 자명하지 않은 합으로 나타나려면 $|A|,|B|\\leq 2$여야 함을 보임.", "technique": "Hanson-Petridis 다항식 방법(polynomial method)과 Kalmynin의 $|A|=|B|$ 정리를 구조적 입력으로 활용한 균일 조합·산술 논증.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.23841v1", "title": "Chromatic numbers of circulants with indispensable generators", "authors": ["Ferdous Ahmed", "David Asraf", "David Bonds", "Jonathan Davidson", "Yunhee Jang", "Mike Krebs", "Anand Prakash", "Edgar Yak-De Padua"], "abstract": "The Cayley graph $\\text{Cay}(G,S)$ is the graph whose vertex set is the group $G$, where two vertices $x$ and $y$ are adjacent if and only if $xy^{-1}$ or $yx^{-1}$ lies in some fixed subset $S$ of $G$. We call the elements of $S$ generators. A circulant graph is a Cayley graph where $G$ is finite and cyclic. Chromatic numbers of circulant graphs have been studied by many authors. A general formula due to Heuberger for the chromatic number of a circulant graph is known when $S$ has two elements, but no such formula is known when $S$ has three or more elements. We say that an element $x$ of $S$ is indispensable if $S\\setminus\\{x\\}$ does not generate $G$. We say that $S$ is minimal if every element of $S$ is indispensable. By a result of Garcia-Marco and Knauer from 2024, if $G$ is nilpotent and $S$ is minimal, then $\\text{Cay}(G,S)$ is $3$-colorable. In this article, we prove three main results. First, we give an upper bound for the chromatic number of a circulant graph with three generators, one of which is indispensable. Second, we present an alternate proof of the theorem of Garcia-Marco and Knauer for the case of abelian groups. Third, we apply these methods to provide a considerably more systematic (and potentially generalizable) proof of Heuberger's theorem for the chromatic number of circulant graphs with two generators. Throughout this paper, our primary tool is the theory of Heuberger matrices, for which we provide a brief primer.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-26T20:59:45+00:00", "updated": "2026-07-26T20:59:45+00:00", "abs_url": "http://arxiv.org/abs/2607.23841v1", "pdf_url": "https://arxiv.org/pdf/2607.23841v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "순환 케일리 그래프의 색칠수(chromatic number) 연구로, McMullen's problem의 convex position·oriented matroid·조합 기하학과 직접 관련 없음.", "summary": "순환 그래프(circulant graph)의 색칠수를 연구하며, 특히 생성원 집합 $S$가 세 개 이상일 때 색칠수의 상한을 제시한다. Garcia-Marco–Knauer의 nilpotent 그룹에 대한 3-색칠성 정리의 아벨군 경우 새로운 증명을 제공하고, Heuberger 행렬 이론을 주요 도구로 활용한다.", "technique": "Heuberger 행렬(Heuberger matrices) 이론을 색칠수 문제에 체계적으로 적용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.25426v1", "title": "A matroidal criterion for flow polytopes to be order polytopes", "authors": ["Akihiro Higashitani", "Hidefumi Ohsugi"], "abstract": "Flow polytopes of directed acyclic graphs form a central class of lattice polytopes in algebraic, geometric, and enumerative combinatorics. Order polytopes are one of the best understood families of lattice polytopes; their Ehrhart theory, triangulations, volumes, and face structures are closely controlled by the combinatorics of the underlying posets. Mészáros--Morales--Striker proved that the flow polytope of an $st$-planar directed acyclic graph is unimodularly equivalent to an order polytope. In this paper, we prove a converse after contracting idle edges. More precisely, for a directed acyclic graph $G$ with a unique source and a unique sink, let $\\widetilde G$ be the graph obtained from $G$ by successively contracting idle edges until none remain. We prove that $\\mathcal{F}(G)$ is unimodularly equivalent to an order polytope if and only if $\\widetilde G$ is $st$-planar. In addition, under a local three-good-neighbor condition, we prove that for a directed acyclic graph with a unique source, a unique sink, and no idle edges, the graph is $st$-planar if and only if it avoids an explicit list of forbidden butterfly minors.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-28T08:23:06+00:00", "updated": "2026-07-28T08:23:06+00:00", "abs_url": "http://arxiv.org/abs/2607.25426v1", "pdf_url": "https://arxiv.org/pdf/2607.25426v1", "journal_ref": "", "doi": "", "comment": "17 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 flow polytope와 order polytope의 동치 조건에 관한 것으로, McMullen 문제(oriented matroid, convex/general position 점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 유향 비순환 그래프(DAG)의 flow polytope가 order polytope와 단모듈 동치(unimodularly equivalent)가 되기 위한 필요충분조건을 증명한다. 구체적으로, 유일한 source와 sink를 가지는 DAG $G$에서 idle edge를 수축하여 얻은 $\\widetilde{G}$가 $st$-평면 그래프일 때, 그리고 그때에만 $\\mathcal{F}(G)$가 order polytope와 단모듈 동치임을 보인다. 추가로, 국소적 three-good-neighbor 조건 하에서 $st$-평면성이 명시적인 forbidden butterfly minor 회피 조건으로 특징지어짐을 증명한다.", "technique": "idle edge 수축(contraction of idle edges)과 $st$-평면성의 특성화를 통해 flow polytope와 order polytope의 단모듈 동치 조건을 matroid 이론적 관점에서 분석.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2607.25682v1", "title": "On t-colorable k-plane drawings", "authors": ["Miriam Goetze", "Michael Kaufmann", "Soeren Terziadis"], "abstract": "In this work, we introduce $t$-colorable $k$-plane drawings, that is, drawings of graphs with a $t$-edge-coloring where every edge is crossed by at most $k$ edges of each color. We give tight upper bounds on the edge- and crossing density for small values of $t$ and $k$ and show that the recognition of such drawings is NP-complete if $t\\geq 2$ and $k\\geq1$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-28T12:56:46+00:00", "updated": "2026-07-28T12:56:46+00:00", "abs_url": "http://arxiv.org/abs/2607.25682v1", "pdf_url": "https://arxiv.org/pdf/2607.25682v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 그리기의 색칠과 교차 복잡도 문제는 McMullen의 convex position 점 배치 및 oriented matroid 문제와 직접적 관련이 없음.", "summary": "본 논문은 t-색칠 가능한 k-평면 그리기(t-edge-coloring에서 각 edge가 최대 k개의 같은 색 edge와 교차)를 도입하고, 작은 t와 k 값에 대해 edge/crossing density의 tight 상한을 제시한다. 또한 t≥2, k≥1일 때 이러한 그리기의 인식(recognition) 문제가 NP-완전임을 보인다.", "technique": "Edge coloring과 crossing density 분석을 통한 상한 도출 및 NP-완전성 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.26028v1", "title": "A Spectral Proof of the Hypergraph Moore Bound", "authors": ["Alexander Schmidhuber", "Matthew B. Hastings"], "abstract": "A nonempty subfamily of a $k$-uniform hypergraph is an \\emph{even cover} if every vertex lies in an even number of its hyperedges; for $k=2$ these are edge-disjoint unions of cycles, so the minimum size of an even cover is the natural hypergraph analogue of girth. We prove Feige's 2008 conjecture on the hypergraph Moore bound: there are absolute constants $A$ and $C$ (independent of $k$) such that for every $k\\ge3$ and every $1\\le\\ell\\le n$, any $k$-uniform hypergraph on $n$ vertices with more than $C\\,n^{k/2}/\\ell^{k/2-1}$ hyperedges contains an even cover of size at most $A\\,\\ell\\log(en/\\ell)$. Our proof is based on sharp spectral bounds for Kikuchi matrices, which we expect to be of independent interest; we apply them to the refutation of random constraint satisfaction problems in a companion paper.", "categories": ["math.CO", "cs.DM", "quant-ph"], "primary_category": "math.CO", "published": "2026-07-28T17:38:31+00:00", "updated": "2026-07-28T17:38:31+00:00", "abs_url": "http://arxiv.org/abs/2607.26028v1", "pdf_url": "https://arxiv.org/pdf/2607.26028v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "하이퍼그래프 구조와 스펙트럼 방법론을 다루지만, McMullen's problem의 convex position, oriented matroid, realizability와는 직접적 연관 없음.", "summary": "Feige의 2008 하이퍼그래프 Moore bound 추측을 증명한다. k-uniform 하이퍼그래프에서 even cover (모든 꼭짓점이 짝수 개의 하이퍼엣지에 포함되는 부분족)의 최소 크기에 대한 스펙트럼 상한을 제시하며, 이는 그래프의 girth 개념을 자연스럽게 일반화한다.", "technique": "Kikuchi 행렬의 스펙트럼 상한을 이용한 프로빗과 even cover 크기 제어.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.23583v1", "title": "The Equality Cases for the Grone-Merris-Bai Theorem", "authors": ["Dongxiu Cai", "Zhengbo Chen", "Jia Yang", "Xiao-Dong Zhang"], "abstract": "The Grone--Merris inequality, conjectured by Grone and Merris~(1994) and first proved by Bai~(2011), states that for every graph $G$ of order $n$ and every $1\\le k\\le n$, $\\sum_{i=1}^kλ_i(G)\\le\\sum_{i=1}^k d_i^*(G)$, where $λ_1\\ge\\cdots\\geλ_n$ are the Laplacian eigenvalues and $d_1^*\\ge\\cdots\\ge d_n^*$ is the conjugate degree sequence. In this paper we determine exactly when equality holds. Using the split-graph trace inequality developed by Kothari and Tudose~(2026) in their proof of Brouwer's Laplacian conjecture---which relies on Bai's theorem and also establishes the equivalence between the two conjectures---together with the recent characterization of the Brouwer equality cases by Cai, Chen, Yang and Zhang~(2027), we prove that equality holds in the Grone--Merris inequality if and only if the graph $G$ belongs to one of two explicitly described families. Both families are obtained from a threshold graph by a surgical operation at one terminal block: in the first family, edges are removed from the initial dominating block; in the second, edges are added inside the initial isolated block. Our analysis yields a complete combinatorial description of all pairs $(G,k)$ for which the Grone--Merris bound is tight.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-26T10:24:47+00:00", "updated": "2026-07-26T10:24:47+00:00", "abs_url": "http://arxiv.org/abs/2607.23583v1", "pdf_url": "https://arxiv.org/pdf/2607.23583v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 라플라시안 고유값과 차수 수열 간의 부등식 특성화로서 극단 구조를 다루지만, McMullen 문제의 볼록위치 점 배치, oriented matroid, chirotopeality 등과 직접 관련이 없음.", "summary": "본 논문은 2011년 증명된 Grone-Merris 부등식의 등호 조건을 완전히 규명한다. 임의의 그래프 G에 대해 라플라시안 고유값의 합과 켤레 차수 수열의 합 사이의 부등식에서 등호가 성립하는 필요충분조건을 threshold graph에 특정 수술 연산을 적용한 두 가지 명시적 그래프 족으로 특성화한다.", "technique": "split-graph trace inequality (Kothari-Tudose 2026) 및 Brouwer 등호 경우의 최근 특성화(Cai-Chen-Yang-Zhang 2027)를 활용한 조합론적 분해.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.26844v1", "title": "General position sets in strong products with paths and cycles", "authors": ["Aleksander Vesel"], "abstract": "We study general position sets in strong products involving paths and cycles. For every connected graph $H$ and every $s\\ge 2$, we prove that gp$(P_s \\boxtimes H)=2$gp$(H)$. We also determine the corresponding values when the path is replaced by $C_4$, $C_5$, or $C_6$, and establish a general upper bound for gp$(C_s \\boxtimes H)$. These results are then applied to strong products of two cycles. We determine several exact values, construct infinite families attaining the general upper bound, and provide counterexamples to the conjectured multiplicativity of the general position number under the strong product.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-29T12:33:02+00:00", "updated": "2026-07-29T12:33:02+00:00", "abs_url": "http://arxiv.org/abs/2607.26844v1", "pdf_url": "https://arxiv.org/pdf/2607.26844v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문의 'general position'은 그래프 이론에서의 GP-수(general position number in graphs) 개념으로, McMullen 문제의 유클리드 공간 내 점 배치의 일반 위치(general position)와 용어만 공유할 뿐 직접적 관련이 없다.", "summary": "이 논문은 경로(path) 및 사이클(cycle)을 포함하는 강한 곱(strong product) 그래프에서의 일반 위치 집합(general position set) 크기를 연구한다. 모든 연결 그래프 $H$와 $s\\ge 2$에 대해 $\\mathrm{gp}(P_s \\boxtimes H) = 2\\,\\mathrm{gp}(H)$임을 증명하고, $C_4, C_5, C_6$의 경우와 일반 사이클에 대한 상한을 결정한다. 두 사이클의 강한 곱에 대한 정확한 값들을 구하고, 강한 곱 하에서 일반 위치 수의 곱셈성(multiplicativity) 추측에 대한 반례를 제시한다.", "technique": "강한 곱 그래프의 구조적 분석을 통해 GP-수에 대한 정확한 공식과 상한을 도출하고, 무한 족(infinite families) 구성으로 상한 달성을 보임.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2607.26176v1", "title": "A Riemann-Roch theorem for Frobenius quotients", "authors": ["Matthew Dupraz", "Andreas Gross", "Leonid Monin"], "abstract": "We construct two families of commutative Frobenius rings: discrete and continuous Frobenius quotients $K_f$, resp. $A_g$, which are defined as the quotients of shift, resp. differential operator algebras by the annihilator of a polynomial. These constructions model the numerical $K$-rings and Chow rings of smooth complete varieties. We show that there is a naturally defined isomorphism $\\mathbb{Q} K_f \\cong \\mathbb{Q} A_g$ playing the role of the Chern character, precisely when the polynomials satisfy a combinatorial analogue of the Hirzebruch-Riemann-Roch theorem, which states that there exists an invertible element $\\mathrm{td} \\in \\mathbb{Q} A_g^\\times$, called the Todd class, such that $f = \\mathrm{td} \\cdot g$. In this case we show that $K_f$ carries all the structure needed to make it a suitable model for $K$-rings of complete smooth varieties: $K_f$ is a $λ$-ring, has well-defined Chern classes, determinants, and satisfies a combinatorial analogue of Serre duality. We further show that the construction is functorial and obtain a combinatorial analogue of the Grothendieck-Riemann-Roch theorem. Lastly, we investigate the existence of larger families of isomorphisms between Frobenius quotients defined by the action of a power series on a generating set, such as the truncated Chern character which yields an integral isomorphism $K_f \\cong A_g$.   We provide numerous examples and applications: we give a new formula for computing Snapper polynomials of matroids, show that the dualizing class of $K_f$ coincides with dualizing classes of matroids and linear families of polytopes, realize $K$-rings of toric variety bundles as Frobenius quotients, and study $K$-rings of Ehrhart fans as well as exceptional isomorphisms in this setting.", "categories": ["math.AG", "math.AC", "math.CO", "math.KT"], "primary_category": "math.AG", "published": "2026-07-28T18:31:56+00:00", "updated": "2026-07-28T18:31:56+00:00", "abs_url": "http://arxiv.org/abs/2607.26176v1", "pdf_url": "https://arxiv.org/pdf/2607.26176v1", "journal_ref": "", "doi": "", "comment": "41 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Frobenius 환, K-링, Chow 링, Riemann-Roch 정리에 관한 대수기하학·교환대수 연구로, McMullen 문제나 oriented matroid의 acyclic reorientation과 직접적 관련이 없다.", "summary": "이 논문은 이동(shift) 연산자 대수 및 미분 연산자 대수를 다항식의 소멸자(annihilator)로 나눈 두 종류의 가환 Frobenius 환(이산형 $K_f$, 연속형 $A_g$)을 구성하여 매끄러운 완전 다양체의 수치적 $K$-링과 Chow 링을 모형화한다. 두 환 사이의 자연스러운 동형 $\\mathbb{Q}K_f \\cong \\mathbb{Q}A_g$가 존재하는 조건이 Hirzebruch-Riemann-Roch 정리의 조합론적 유사체, 즉 Todd 클래스 $\\mathrm{td} \\in \\mathbb{Q}A_g^\\times$가 존재하여 $f = \\mathrm{td} \\cdot g$를 만족하는 경우임을 보인다. 응용으로 matroid의 Snapper 다항식 계산 공식, 토릭 다발(toric variety bundle)의 $K$-링 실현, Ehrhart fan의 $K$-링 등을 다룬다.", "technique": "이동·미분 연산자 대수를 다항식의 소멸자로 나눈 Frobenius 환 구성, $\\lambda$-링 구조·Chern 클래스·Serre 쌍대성의 조합론적 유사체 확립, Grothendieck-Riemann-Roch의 함자적(functorial) 유사체 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2607.26942v1", "title": "Coloring semiminimal Cayley Graphs", "authors": ["Ignacio García-Marco", "Kolja Knauer", "Giuliamaria Menara"], "abstract": "In 1978 Babai raised the question whether all semiminimal Cayley graphs have bounded chromatic number. In this paper we show that semiminimal Cayley graphs of abelian and generalized dihedral groups have circular chromatic number at most 4, thus extending a result of Barajas and Serra.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-29T14:10:52+00:00", "updated": "2026-07-29T14:10:52+00:00", "abs_url": "http://arxiv.org/abs/2607.26942v1", "pdf_url": "https://arxiv.org/pdf/2607.26942v1", "journal_ref": "", "doi": "", "comment": "11 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Cayley graph coloring은 군론과 그래프 색칠 문제로, McMullen의 볼록 위치 점 배치 문제와는 직접적 관련성이 없음.", "summary": "본 논문은 1978년 Babai의 질문—반최소(semiminimal) Cayley 그래프가 유계 색수를 갖는가—에 대해 아벨군 및 일반화된 이면체군의 경우 원형 색수(circular chromatic number)가 최대 4임을 보임으로써 Barajas-Serra의 결과를 확장한다.", "technique": "원형 색수 분석 및 군론적 구조를 이용한 Cayley 그래프의 색칠 논증", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.25396v1", "title": "Optimal coloring of $\\{\\mathrm{cap},\\mathrm{even\\ hole}\\}$-free graphs with no short odd holes", "authors": ["Feng Liu", "Shuang Sun", "Yan Wang"], "abstract": "A \\emph{hole} is an induced cycle of length at least four, and an \\emph{even hole} is a hole of even length. A \\emph{cap} is obtained from a hole by adding a vertex adjacent to exactly two consecutive vertices of the hole. Chen, Xu, and Xu proved that every $\\{\\mathrm{cap},\\mathrm{even\\ hole}\\}$-free graph $G$ satisfies $χ(G)\\leq \\left\\lceil\\frac{5}{4}ω(G)\\right\\rceil$, and improved this bound to $χ(G)\\leq \\left\\lceil\\frac{7}{6}ω(G)\\right\\rceil$ when $5$-holes are also excluded. They asked whether, for every integer $q\\geq3$, every $\\{\\mathrm{cap},\\mathrm{even\\ hole}\\}$-free graph $G$ with no odd hole of length at most $2q-1$ satisfies $$ χ(G)\\leq \\left\\lceil\\frac{2q+1}{2q}ω(G)\\right\\rceil. $$ We answer this question affirmatively and show that the bound is sharp for every $q\\geq3$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-28T07:56:19+00:00", "updated": "2026-07-28T07:56:19+00:00", "abs_url": "http://arxiv.org/abs/2607.25396v1", "pdf_url": "https://arxiv.org/pdf/2607.25396v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 색칠 문제로, 이산기하학의 점 배치나 oriented matroid 구조와는 직접 관련 없음.", "summary": "본 논문은 cap과 even hole을 포함하지 않는 그래프의 색수(chromatic number)에 대한 상한을 연구합니다. Chen, Xu, Xu의 미해결 문제에 긍정적으로 답하여, 짧은 홀수 사이클이 없는 그래프에 대해 $χ(G) \\leq \\lceil\\frac{2q+1}{2q}ω(G)\\rceil$ 부등식이 성립함을 증명하고 그 상한이 모든 $q \\geq 3$에 대해 최적임을 보였습니다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.24655v1", "title": "On the problem of large gcd for disjoint residue classes", "authors": ["Jan Fornal", "Yu-Chen Sun"], "abstract": "Consider $k$ pairwise disjoint residue classes $a_i \\pmod{m_i}$. We prove that   \\[   \\max_{1\\leq i<j\\leq k}\\gcd(m_i,m_j)   \\gg k\\exp\\!\\left(-(2+o(1))   \\sqrt{\\frac{\\log k}{\\log\\log k}}\\right).   \\] The proof uses a complete graph whose edges are colored by the gcds of the corresponding moduli, together with a structural lemma, a sieve-theoretic partition, Möbius inversion, and the discrete Fourier transform.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-07-27T16:51:58+00:00", "updated": "2026-07-27T16:51:58+00:00", "abs_url": "http://arxiv.org/abs/2607.24655v1", "pdf_url": "https://arxiv.org/pdf/2607.24655v1", "journal_ref": "", "doi": "", "comment": "19 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 수론(residue classes, gcd, sieve theory)의 문제이며, 이산기하학의 McMullen's problem(convex position, oriented matroid, realizability 등)과 직접적 연관이 없습니다.", "summary": "k개의 쌍별 서로소(pairwise disjoint) 잉여류 $a_i \\pmod{m_i}$에 대해, 대응하는 법수들의 최대공약수의 하한을 $\\max_{1\\leq i<j\\leq k}\\gcd(m_i,m_j) \\gg k\\exp(-(2+o(1))\\sqrt{\\frac{\\log k}{\\log\\log k}})$로 증명합니다. 증명은 완전 그래프의 색칠, 체 이론적 분할, 뫼비우스 역변환, 이산 푸리에 변환을 활용합니다.", "technique": "완전 그래프의 gcd 색칠, 체 이론적 분할(sieve-theoretic partition), 뫼비우스 역변환, 이산 푸리에 변환.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.26441v1", "title": "Straightedge-and-Compass Constructibility of the Reciprocal-$k$-th-Power Law", "authors": ["George M. Georgiou"], "abstract": "Given positive lengths $a$ and $b$ and a positive integer $k$, let $c$ be determined by $$   \\frac{1}{c^k}=\\frac{1}{a^k}+\\frac{1}{b^k}. $$ We prove that a single finite unmarked-straightedge-and-compass construction producing $c$ for every pair $a,b$ exists if and only if $k$ is a power of two. Necessity follows by specializing to $a=b=1$ and applying the algebraic-degree obstruction to $2^{1/k}$; sufficiency is established by a recursive construction using third, fourth, and mean proportionals. We give an explicit construction for $k=4$ and its iteration for $k=8,16,\\ldots$. We also describe a projection from a surface of revolution generated by a Lamé curve that realizes the same relation geometrically for every real $k>1$, although generally not by classical straightedge-and-compass operations.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-07-29T03:40:22+00:00", "updated": "2026-07-29T03:40:22+00:00", "abs_url": "http://arxiv.org/abs/2607.26441v1", "pdf_url": "https://arxiv.org/pdf/2607.26441v1", "journal_ref": "", "doi": "", "comment": "7 pages, 3 figures; includes an explicit construction for k=4 and a complete classification for positive integer k", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "고전 기하 작도 가능성 문제로, McMullen's problem의 조합-기하 구조와 무관함.", "summary": "주어진 양수 길이 $a, b$와 양의 정수 $k$에 대해 $\\frac{1}{c^k}=\\frac{1}{a^k}+\\frac{1}{b^k}$를 만족하는 $c$를 자 자-정규컴퍼스로 작도 가능하기 위한 필요충분조건은 $k$가 2의 거듭제곱인 것임을 증명. 필요성은 대수차수 장애(algebraic-degree obstruction)로, 충분성은 제3비례항·제4비례항·산술-기하 평균의 재귀적 작도로 확립.", "technique": "대수적 차수 장애 및 고전 비례항(proportionals) 작도의 재귀 조합.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.00377v1", "title": "Schubitopes are not Ehrhart positive", "authors": ["Yupeng Li", "Avery St. Dizier"], "abstract": "Schubitopes are a family of generalized permutahedra arising as the Newton polytopes of both Schubert polynomials and Demazure characters of $\\mathrm{GL}_n$. Monical, Tokcan, and Yong conjectured that Schubitopes are Ehrhart positive. We exhibit a counterexample to this conjecture, a Schubitope whose Ehrhart polynomial contains a negative coefficient in its monomial expansion. This example was found using GPT-5.6 Sol Pro in ChatGPT.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-01T01:20:07+00:00", "updated": "2026-08-01T01:20:07+00:00", "abs_url": "http://arxiv.org/abs/2608.00377v1", "pdf_url": "https://arxiv.org/pdf/2608.00377v1", "journal_ref": "", "doi": "", "comment": "5 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Schubitope의 Ehrhart 양성 추측 반례에 관한 논문으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "Schubitope는 Schubert 다항식과 $\\mathrm{GL}_n$의 Demazure character의 Newton polytope로서 일반화된 permutahedron의 한 종류이다. Monical, Tokcan, Yong이 제기한 'Schubitope는 Ehrhart 양수(Ehrhart positive)이다'라는 추측에 대한 반례를 제시하며, 구체적으로 Ehrhart 다항식의 단항 전개에서 음의 계수를 갖는 Schubitope를 전시한다. 해당 반례는 GPT-5.6 Sol Pro(ChatGPT)를 활용하여 발견되었다.", "technique": "GPT-5.6 Sol Pro를 이용한 반례 탐색 및 Ehrhart 다항식의 단항 전개 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2607.29671v1", "title": "The motivic Lie algebra embeds into the cohomology of the general linear group", "authors": ["Francis Brown", "Erik Panzer", "Jean-Luc Portner"], "abstract": "We show that the motivic Lie algebra of mixed Tate motives over $\\mathbb{Z}$ embeds canonically into the unstable compactly-supported cohomology of locally symmetric spaces for $\\mathrm{GL}_g(\\mathbb{Z})$, and into the weight-zero compactly-supported cohomology of $\\mathcal{A}_g$, the moduli space of principally polarized abelian varieties. Our construction passes through tropical geometry and graph complexes: compactly-supported analogues of the Borel classes pull back via the tropical Torelli map to canonical graph cocycles. The latter were recently identified with cocycles studied previously by Rossi and Willwacher. We combine their results with the theory of single-valued periods to conclude that the cocycles map to generators of the motivic Lie algebra. We also compute the canonical graph cocycles for all graphs with $\\leq14$ edges.", "categories": ["math.AG", "math.AT", "math.QA"], "primary_category": "math.AG", "published": "2026-07-31T17:53:39+00:00", "updated": "2026-07-31T17:53:39+00:00", "abs_url": "http://arxiv.org/abs/2607.29671v1", "pdf_url": "https://arxiv.org/pdf/2607.29671v1", "journal_ref": "", "doi": "", "comment": "25 pages, ancillary files with explicit graph cocycles", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 동기적 리 대수(motivic Lie algebra)와 GL_g(Z)의 국소 대칭 공간의 코호몰로지에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 $\\mathbb{Z}$ 위의 mixed Tate motives의 동기적 리 대수가 $\\mathrm{GL}_g(\\mathbb{Z})$의 국소 대칭 공간의 compact-supported 코호몰로지 및 $\\mathcal{A}_g$(주극화 아벨 다양체의 모듈라이 공간)의 weight-zero compact-supported 코호몰로지에 표준적으로 매장됨을 증명한다. 이 구성은 열대 기하학(tropical geometry)과 그래프 복합체(graph complexes)를 경유하며, Borel 류의 compact-supported 유사체가 열대 Torelli 사상을 통해 표준적 그래프 코사이클로 당겨짐을 보인다. 또한 Rossi–Willwacher의 결과와 단일값 주기(single-valued periods) 이론을 결합하여 해당 코사이클이 동기적 리 대수의 생성원에 대응됨을 결론짓고, 변 수 $\\leq 14$인 모든 그래프에 대해 표준적 그래프 코사이클을 계산한다.", "technique": "열대 Torelli 사상(tropical Torelli map), 그래프 복합체(graph complexes), 단일값 주기(single-valued periods) 이론을 결합하여 코사이클과 동기적 리 대수 생성원의 대응을 확립한다.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2607.25598v2", "title": "Projective Ore-Degree Conditions for Intersection Theorems in Vector Spaces", "authors": ["Mengyu Cao", "Mei Lu", "Xuyang Yan", "Haixiang Zhang"], "abstract": "Let $V$ be an $n$-dimensional vector space over the finite field $\\mathbb F_q$, and let $\\mathcal F\\subsetneq\\genfrac{[}{]}{0pt}{}{V}{k}$. The \\emph{projective Ore-degree} of $\\mathcal F$ is the minimum, over all $k$-subspaces $S\\notin\\mathcal F$, of the sum of the $\\mathcal F$-degrees of the projective points contained in $S$. We prove sharp projective Ore analogues of the vector-space Erdős--Ko--Rado and Hilton--Milner theorems. The Ore--Erdős--Ko--Rado theorem holds for $n\\ge2k+1$, with equality only for a full point-star. For nontrivial intersecting families, we determine the sharp Ore--Hilton--Milner threshold, together with the complete equality classification, when $q\\ge3$ and $n\\ge2k+1$, or when $q\\ge2$ and $n\\ge2k+2$. We further determine a sharp projective Ore-degree threshold forcing a direct-sum matching of size $s$ when $s\\ge3$ and $n\\ge(2s-1)k-s+4$, and derive a multicolour Ramsey consequence.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-28T11:29:53+00:00", "updated": "2026-07-29T10:55:29+00:00", "abs_url": "http://arxiv.org/abs/2607.25598v2", "pdf_url": "https://arxiv.org/pdf/2607.25598v2", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한체 위 벡터공간의 교집합 정리(Ore-degree 조건)로, McMullen's problem의 볼록 위치·general position 점 배치 문제와 기술적·개념적 연관성 없음.", "summary": "유한체 $\\mathbb{F}_q$ 위의 $n$-차원 벡터공간에서 $k$-부분공간족 $\\mathcal{F}$에 대해 '사영 Ore-차수' 개념을 도입하고, Erdős–Ko–Rado와 Hilton–Milner 정리의 Ore 유사형을 증명했다. 직합 matching 크기와 다색 Ramsey 결과도 도출했다.", "technique": "사영 기하와 차수 조건을 결합한 extremal combinatorics 기법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.00900v1", "title": "An explicit construction of two completely independent spanning trees in the four-dimensional dual-cube", "authors": ["Jitendra Prajapati"], "abstract": "Lalou, Mbarek, Skender and Togni (arXiv:2607.25917) proved that the $n$-dimensional dual-cube $F_n$ admits two completely independent spanning trees for every $n\\ge 5$, observed that none exist for $n\\le 3$, and identified $F_4$ as the first unresolved case, reporting more than 700 hours of inconclusive computation. We settle this case affirmatively by an explicit construction, completing the classification: $F_n$ admits two completely independent spanning trees if and only if $n\\ge 4$. The internal-vertex sets of the two trees are the level sets of a single ten-term cubic polynomial over $\\mathbb{F}_2$ in the seven vertex bits, and correctness reduces to finite connectivity checks that are machine-verified by a solver-free program distributed with the certificate. In $F_4$ the two trees necessarily use 254 of the 256 edges. We also report exact infeasibility results for simpler rules of the same shape: within the search model, no affine or quadratic rule works, and ten terms is the fewest possible for a cubic rule.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-08-02T00:00:20+00:00", "updated": "2026-08-02T00:00:20+00:00", "abs_url": "http://arxiv.org/abs/2608.00900v1", "pdf_url": "https://arxiv.org/pdf/2608.00900v1", "journal_ref": "", "doi": "", "comment": "5 pages. Certificate and solver-free verifier available at https://github.com/infinityscroll/f4-dualcube-cist", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "완전독립 스패닝 트리는 그래프 연결성 문제이며, McMullen's problem은 점 배치와 볼록위치의 조합론적 기하 문제로 직접적 관련성 없음.", "summary": "4차원 dual-cube $F_4$에서 두 개의 완전독립 스패닝 트리가 명시적으로 구성되었으며, 이는 모든 $n\\ge 4$에서 존재함을 확정함. 구성은 $\\mathbb{F}_2$상의 10항 3차 다항식과 유한 연결성 검증에 기반함.", "technique": "다항식 기반 내부정점 집합 규칙 및 solver-free 프로그램을 통한 기계 검증", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.00791v1", "title": "Odd-Girth Bounds for Defective Edge Coloring", "authors": ["Guantao Chen", "Alireza Fiujlaali"], "abstract": "A $(k,d)$-edge coloring of a loopless multigraph $G$ is an edge coloring using at most $k$ colors such that the subgraph formed by each color class has maximum degree at most $d$. The least such $k$ is denoted by $χ'_d(G)$. Let $G$ be a loopless non-bipartite multigraph with maximum degree $Δ(G)$ and odd girth $g_0(G)$, and let $d\\ge1$ be odd. We prove that \\[ χ'_d(G)\\le\\left\\lceil\\frac{g_0(G)Δ(G)-1}{dg_0(G)-1}\\right\\rceil. \\] For $d=1$, this is Goldberg's odd-girth refinement of Shannon's theorem, while for $g_0(G)=3$ it is the defective Shannon bound of Aboulker, Aubian, and Huang. For every odd $d>1$, every odd $g_0\\ge3$, and every $Δ>d$, an almost full ring multigraph $R(Δ,g_0)$, an odd cycle with edge multiplicities alternating between $\\lfloorΔ/2\\rfloor$ and $\\lceilΔ/2\\rceil$, except that two consecutive edges have multiplicity $\\lfloorΔ/2\\rfloor$, attains equality. We also derive a range in which the defective Goldberg--Seymour conjecture holds.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-01T17:46:24+00:00", "updated": "2026-08-01T17:46:24+00:00", "abs_url": "http://arxiv.org/abs/2608.00791v1", "pdf_url": "https://arxiv.org/pdf/2608.00791v1", "journal_ref": "", "doi": "", "comment": "Submitted to The Electronic Journal of Combinatorics", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen's problem은 convex position 점 배치와 oriented matroid의 조합구조에 관한 것이며, 본 논문은 그래프의 edge coloring과 odd girth에 관한 것으로 직접 관련성이 없습니다.", "summary": "본 논문은 loopless non-bipartite multigraph G의 (k,d)-edge coloring에 대한 상한을 odd girth g₀(G)를 이용하여 증명합니다. χ'_d(G) ≤ ⌈(g₀(G)Δ(G)-1)/(dg₀(G)-1)⌉ 부등식은 Goldberg의 정리와 defective Shannon bound를 통합하며, 특정 multigraph에서 등호가 성립함을 보입니다.", "technique": "Odd girth를 이용한 그래프의 색칠수(chromatic index) 상한 도출 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.25274v1", "title": "Proper Hat-Guessing on Two-Spine Book Graphs", "authors": ["Yulin Zhai"], "abstract": "In the proper variant of the classical hat-guessing game on a graph, an adversary properly colors the vertices from a palette of $q$ colors. Each vertex sees only the colors of its neighbors and simultaneously guesses its own color; the players win if at least one guess is correct. We study this game on the book graph $B_{k,n}=K_k\\vee\\overline{K_n}$, with $k$ mutually adjacent spine vertices and $n$ independent pages.   We give a coverability characterization valid for every fixed spine size. Let $C_k$ be the minimum of $|P|+|\\operatorname{supp}(P)|$ over all non-coverable finite configurations $P$ of proper $k$-tuples. We prove $\\sup_{n\\geq 1}\\operatorname{HGP}(B_{k,n})=C_k$ and $\\operatorname{HGP}(B_{k,n})=C_k$ for all sufficiently large $n$. Thus the asymptotic problem for fixed $k$ reduces to a finite extremal invariant. For two spines, coverability is equivalent to pseudoforestness, and we determine the associated extremal problem exactly: $C_2=11$, with precisely two types of extremal obstruction. Consequently, $\\operatorname{HGP}(B_{2,n})\\leq 11$ for every $n$, with equality for all sufficiently large $n$; an explicit probabilistic estimate gives a stabilization threshold of at most $4\\times 10^8$.   We also resolve the first two previously open finite cases. An explicit seven-color construction with affine symmetry proves $\\operatorname{HGP}(B_{2,3})=7$. A counting-rigidity argument establishes $\\operatorname{HGP}(B_{2,n})\\leq n+3$ for all $n\\geq 4$, which together with monotonicity yields $\\operatorname{HGP}(B_{2,4})=7$. Finally, a general box obstruction gives explicit uniform bounds on $C_k$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-28T04:22:40+00:00", "updated": "2026-07-28T04:22:40+00:00", "abs_url": "http://arxiv.org/abs/2607.25274v1", "pdf_url": "https://arxiv.org/pdf/2607.25274v1", "journal_ref": "", "doi": "", "comment": "18 pages, no figures; ancillary verification code included", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Hat-guessing game은 극값 조합론이지만, McMullen's problem의 oriented matroid, convex position, general position과는 직접적 연관이 없음.", "summary": "본 논문은 책 그래프(book graph) $B_{k,n}$에서의 proper hat-guessing game을 연구한다. 고정된 spine 크기에 대해 coverability 특성화를 제시하고, 두 spine 경우 $C_2=11$을 정확히 결정하며, 여러 유한 경우를 해결한다.", "technique": "Coverability characterization, pseudoforestness 동치성, extremal obstruction 분석, counting-rigidity 논증, affine 대칭 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.25410v1", "title": "On the Genus Polynomial of Cubic Graphs", "authors": ["Austin Ulrigg"], "abstract": "The orientable genus polynomial of a graph counts its cellular embeddings by genus. For finite simple $2$-connected cubic graphs it is a cycle-matroid invariant: $M(G)\\cong M(H)$ implies $Γ_G=Γ_H$. The adjacency spectrum and the genus polynomial are incomparable: neither determines the other. We exhibit connected cubic graphs on $16$ vertices sharing the adjacency spectrum, spanning-tree count, girth, diameter, vertex and edge connectivity, automorphism-group order, and cycle counts through length $10$, yet with pairwise distinct genus polynomials. Splitting the expected face count at twice the girth explains the difference: short faces are spectral, long faces are not. We construct an explicit infinite family of connected cospectral cubic pairs $(G_t,H_t)$ on $14+2t$ vertices whose minimum genera differ. We also compute the genus polynomials of all $7,875,918$ connected cubic graphs through $22$ vertices and derive from short-cycle counts a deterministic lower bound on the minimum genus.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-28T08:07:54+00:00", "updated": "2026-07-28T08:07:54+00:00", "abs_url": "http://arxiv.org/abs/2607.25410v1", "pdf_url": "https://arxiv.org/pdf/2607.25410v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "3차 그래프의 genus polynomial 연구는 McMullen's problem(convex position, oriented matroid, realizability)과 직접적 관련이 없음.", "summary": "본 논문은 유한 단순 2-연결 3차 그래프의 방향성 genus polynomial을 연구한다. Cycle-matroid 동형은 genus polynomial을 보존하며, 동일한 인접 스펙트럼을 갖되 genus polynomial이 다른 그래프 족을 구성한다. 14+2t 정점의 cospectral cubic 쌍 무한족을 명시적으로 구성하고, 22 정점까지의 모든 연결 3차 그래프 7,875,918개의 genus polynomial을 계산한다.", "technique": "Cycle-matroid invariant 분석, 짧은 면(short faces)과 긴 면(long faces)의 스펙트럼 구분, 단순 사이클 카운트로부터의 최소 genus의 결정론적 하한 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.00710v1", "title": "Poisson approximations of the number of fixed points in random multiset permutations", "authors": ["Dudley Stark"], "abstract": "For ordinary permutations on $n$ letters, the distribution of the number of fixed points of a random permutation is well known to approach the Poisson$(1)$ distribution in total variation distance as $n\\to\\infty$. We use Stein's method to get related results for the number of fixed points of random permutations of multisets.", "categories": ["math.CO", "math.PR"], "primary_category": "math.CO", "published": "2026-08-01T15:16:14+00:00", "updated": "2026-08-01T15:16:14+00:00", "abs_url": "http://arxiv.org/abs/2608.00710v1", "pdf_url": "https://arxiv.org/pdf/2608.00710v1", "journal_ref": "", "doi": "", "comment": "12 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "다중집합 순열의 고정점 분포를 다루지만 McMullen's problem의 convex position, oriented matroid, 조합기하학적 구조와는 무관함.", "summary": "일반 순열의 고정점 개수 분포가 Poisson(1) 분포로 수렴하는 고전 결과를 다중집합(multiset) 순열으로 확장한다. Stein의 방법을 사용하여 관련된 근사 결과들을 도출한다.", "technique": "Stein's method을 이용한 Poisson 근사 분석", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.00323v1", "title": "On a conjecture of Han and Xiong for fractional Gaussian binomial coefficients", "authors": ["Ken Ono"], "abstract": "Han and Xiong recently extended the Gaussian binomial coefficient $\\genfrac{[}{]}{0pt}{}{r+k}{k}_{q}$ to positive rational $r$ and conjectured that its integer trace, the integer-exponent part of the resulting power series, is coefficientwise largest at $r=1/2$. We prove a support-dominance theorem comparing rational parameters under an explicit divisibility condition. It settles the conjecture for every $r\\geq 1/2$ and reduces the full conjecture to the unit fractions $r=\\frac{1}{2m}$, only finitely many of which are nontrivial for each fixed $k$. A computer computation then verifies the conjecture for every positive rational $r$ and every $k\\leq 200$. The theoretical results were autonomously produced and verified in Lean by AxiomProver.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-31T22:23:29+00:00", "updated": "2026-07-31T22:23:29+00:00", "abs_url": "http://arxiv.org/abs/2608.00323v1", "pdf_url": "https://arxiv.org/pdf/2608.00323v1", "journal_ref": "", "doi": "", "comment": "Comments welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Gaussian binomial coefficients와 q-analogs은 조합론 일반 주제이지만, McMullen's problem (convex position, oriented matroid, realizability)과는 직접적 기하학적 관련성이 없음.", "summary": "Han과 Xiong이 유리수 r에 대해 확장한 Gaussian binomial coefficient의 정수 trace에 관한 추측을 증명함. r=1/2에서 계수 최대성을 보이는 support-dominance 정리를 제시하며, 나머지 경우를 유한 개의 단위분수로 축소하고 k≤200에서 컴퓨터 검증 완료.", "technique": "Support-dominance theorem을 명시적 나눗셈 조건 하에서 비교하여 증명; Lean 기반 자동 검증.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.02979v1", "title": "Topological Tverberg theorems for products of polytopes", "authors": ["Steven Simon"], "abstract": "The topological Tverberg theorem asserts that if $r$ is a prime power then for any continuous map $f\\colon Δ_{(r-1)(d+1)}\\rightarrow \\mathbb{R}^d$ from the $(r-1)(d+1)$-dimensional simplex $Δ_{(r-1)(d+1)}$ to $\\mathbb{R}^d$ there exist $r$ pairwise disjoint faces of the simplex whose images have non-empty $r$-fold intersection. By refinement, the same conclusion holds if the simplex is replaced by any polytope of the same dimension. While this dimension is tight for simplices, recent work of Soberón and Zerbib shows that this need not be true for polytopes in general.   Here we give topological Tverberg theorems for products of simplices. Each of these improves upon the $(r-1)(d+1)$-dimensional threshold, even while imposing the structural condition that the ``Tverberg faces'' of the product are themselves the products of pairwise disjoint faces from each simplex factor. As before, refinement extends these results, and in particular their dimensional improvements, to products of arbitrary polytopes. As an example, if $d+1$ is a power of two then whenever $m\\geq n\\geq d+1$ and $m+n=3d+2$ we show that any continuous map $f\\colon Δ_m\\times Δ_n\\rightarrow \\mathbb{R}^d$ admits disjoint faces $σ_1,σ_2$ of $Δ_m$ and $τ_1,τ_2$ of $Δ_n$ such that $\\cap_{i,j\\in[2]} f(σ_i\\timesτ_j)\\neq \\emptyset$. In the case of multilinear maps, our results imply partitions of grid-indexed point sets in $\\mathbb{R}^d$ by specialized subsets with stronger intersection conclusions than given by Tverberg's original theorem. Lastly, we extend our results to van Kampen--Flores type theorems which impose dimensional restrictions on the faces of each product factor.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-08-04T00:30:59+00:00", "updated": "2026-08-04T00:30:59+00:00", "abs_url": "http://arxiv.org/abs/2608.02979v1", "pdf_url": "https://arxiv.org/pdf/2608.02979v1", "journal_ref": "", "doi": "", "comment": "20 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 위상적 Tverberg 정리와 van Kampen–Flores 정리를 다루며, McMullen 문제(convex/general position 점 배치, oriented matroid의 acyclic reorientation)와 직접적인 관련이 없다.", "summary": "이 논문은 단체(simplex) 대신 단체들의 곱(products of simplices)에 대해 위상적 Tverberg 정리를 확립하며, 기존의 $(r-1)(d+1)$ 차원 임계값을 개선한다. 핵심 결과로, $d+1$이 2의 거듭제곱일 때 $m+n=3d+2$를 만족하는 $m\\geq n\\geq d+1$에 대해 $f\\colon \\Delta_m\times\\Delta_n\to\\mathbb{R}^d$가 특정 분리 면들의 교차 조건을 만족함을 보인다. 또한 multilinear map의 경우 격자 인덱스 점 집합의 분할에 대한 응용과 van Kampen–Flores형 정리로 확장된다.", "technique": "단체 곱의 구조를 활용한 위상적 방법(equivariant topology 및 refinement 논증)으로 Tverberg 면의 곱 구조 조건을 부과하여 차원 임계값을 개선.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.02894v1", "title": "Compact Hyperbolic Coxeter Six-dimensional Polytopes With Ten Facets", "authors": ["John Mcleod"], "abstract": "We show that, up to isometry, there is exactly one compact hyperbolic Coxeter 6-polytope with 10 facets: the polytope $P_{6,10}$ whose Coxeter diagram appears as Figure 5 of Burcroff, attributed there to Bugaenko. Together with the results of Lannér, Kaplinskaja, Esselmann and Felikson-Tumarkin, and the independent classifications of Burcroff and Ma-Zheng in dimensions 4 and 5, this completes the classification of compact hyperbolic Coxeter $d$-polytopes with $d+4$ facets in every dimension. We enumerate all 387 candidate combinatorial types from the complete database of planar order types on 10 points via affine Gale duality, reduce to 11 types using two combinatorial consequences of Lannér's classification and the known classifications with $d+2$ facets and in dimension 5 with 9 facets, and decide those 11 by an exhaustive search over Coxeter labellings with no a priori bound on the dihedral angles. The search terminates with machine-checked exhaustion certificates, and the unique surviving Gram matrix is certified exactly over $\\mathbb{Q}(\\sqrt2,\\sqrt5)$ and independently by CoxIter. The emptiness verdicts are exact as well: forward checking, by integer and real quadratic-field arithmetic, empties ten of the 11 types on its own, and every labelling that reaches a screen and is not accepted is refuted exactly over $\\mathbb{Q}(\\sqrt2,\\sqrt3,\\sqrt5)$, by the non-vanishing of a single determinant or, in 19 cases, by interval arithmetic on a compactified domain. No verdict rests on a floating-point tolerance or on a bound on the ultraparallel weights. The same code path, unchanged, reproduces the known censuses of 51 polytopes in dimension 5 and 348 in dimension 4. Code, data and certificates are publicly available. Most of the software was written by an AI assistant under the author's direction.", "categories": ["math.CO", "math.GR", "math.MG"], "primary_category": "math.CO", "published": "2026-08-03T21:21:23+00:00", "updated": "2026-08-03T21:21:23+00:00", "abs_url": "http://arxiv.org/abs/2608.02894v1", "pdf_url": "https://arxiv.org/pdf/2608.02894v1", "journal_ref": "", "doi": "", "comment": "24 pages, 2 tables", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "쌍곡 Coxeter 폴리토프 분류 문제로, McMullen 문제(볼록 위치 점 배치·oriented matroid)와 직접적 관련이 없다.", "summary": "이 논문은 10개의 면(facet)을 가지는 컴팩트 쌍곡 Coxeter 6차원 폴리토프가 등장성(isometry) 하에 정확히 하나($P_{6,10}$)임을 증명하며, 이로써 모든 차원에서 $d+4$개의 면을 가지는 컴팩트 쌍곡 Coxeter $d$-폴리토프의 완전한 분류가 완성된다. 10점 평면 순서 유형(planar order types) 데이터베이스와 affine Gale duality를 이용해 387개의 후보 조합 유형을 열거하고, 이를 11개로 축소한 뒤 Coxeter 레이블링에 대한 전수 탐색으로 결론을 내린다. 모든 판정은 부동소수점 오차에 의존하지 않고 $\\mathbb{Q}(\\sqrt{2},\\sqrt{3},\\sqrt{5})$ 위의 정확한 산술로 검증된다.", "technique": "affine Gale duality를 통한 조합 유형 열거, Coxeter 레이블링 전수 탐색, $\\mathbb{Q}(\\sqrt{2},\\sqrt{3},\\sqrt{5})$ 위의 정확한 산술 및 구간 산술(interval arithmetic)에 의한 기계 검증 인증서 생성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.02445v1", "title": "Minkowski decomposability of symmetric edge polytopes", "authors": ["Akihiro Higashitani", "Aki Mori"], "abstract": "In this paper, we study the Minkowski decomposability of symmetric edge polytopes $P_G^\\pm$ of a finite simple graph $G$ on vertex set $[n]$. More precisely, we give a complete characterization of graphs whose symmetric edge polytopes are Minkowski decomposable. We prove that $P_G^\\pm$ is Minkowski decomposable if and only if $G$ is one of the three complete multipartite graphs: $K_n$, $K_{2,n-2}$, or $K_{1,1,n-2}$. In other words, if $G$ does not belong to these three families, then $P_G^\\pm$ is Minkowski indecomposable.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-03T16:23:46+00:00", "updated": "2026-08-03T16:23:46+00:00", "abs_url": "http://arxiv.org/abs/2608.02445v1", "pdf_url": "https://arxiv.org/pdf/2608.02445v1", "journal_ref": "", "doi": "", "comment": "11 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 대칭 엣지 폴리토프의 Minkowski 분해 가능성을 다루며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "유한 단순 그래프 $G$의 대칭 엣지 폴리토프 $P_G^\\pm$의 Minkowski 분해 가능성을 완전히 특성화하였다. 주요 결과로, $P_G^\\pm$이 Minkowski 분해 가능(decomposable)인 것은 $G$가 $K_n$, $K_{2,n-2}$, $K_{1,1,n-2}$ 세 완전 다분 그래프(complete multipartite graph) 중 하나인 경우와 동치임을 증명하였다. 즉, 이 세 계열에 속하지 않는 그래프의 대칭 엣지 폴리토프는 모두 Minkowski 분해 불가능(indecomposable)이다.", "technique": "그래프의 완전 다분 구조와 대칭 엣지 폴리토프의 조합론적 성질을 이용한 완전 특성화.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.01870v1", "title": "$0/1$-Polytopes with Exponentially Small Edge Expansion", "authors": ["Xiongxin Yang"], "abstract": "We present a construction of a family of $0/1$-polytopes whose edge expansion decreases exponentially with the dimension, which disproves the Mihail-Vazirani conjecture that the graph of every $0/1$-polytope has edge expansion at least one.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-03T08:18:18+00:00", "updated": "2026-08-03T08:18:18+00:00", "abs_url": "http://arxiv.org/abs/2608.01870v1", "pdf_url": "https://arxiv.org/pdf/2608.01870v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 0/1-폴리토프의 edge expansion에 관한 Mihail-Vazirani 추측을 반증하는 연구로, McMullen 문제(d=5, Larman conjecture, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 edge expansion이 차원에 따라 지수적으로 감소하는 $0/1$-폴리토프 족(family)의 구성을 제시한다. 이를 통해 모든 $0/1$-폴리토프의 그래프가 edge expansion 적어도 1을 가진다는 Mihail-Vazirani 추측을 반증한다.", "technique": "$0/1$-폴리토프 족을 명시적으로 구성하여 지수적으로 작은 edge expansion을 보이는 반례 제시.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.01716v1", "title": "A Lovász Theta Parameter and Theta Body for Signed Graphs", "authors": ["Gabriel Coutinho"], "abstract": "We introduce a Lovász-type semidefinite parameter for balanced colouring of signed graphs. Its homomorphism target is a unit sphere equipped with an orthogonal involution: the fixed and anti-fixed components play different roles, while applying the involution to one endpoint realizes switching. The resulting parameter admits a symmetric formulation with two positive semidefinite matrices and an equally symmetric dual. It is also one half of the strict vector chromatic number of the ordinary graph formed by the negative edges of the double switching graph. Our second main contribution is a hierarchy of convex corners. Starting from the balanced induced subgraph polytope, we define signed analogues of the stable-set, theta, and clique-inequalities relaxations in the original vertex space. The signed theta body has an intrinsic two-matrix description, its all-ones gauge is the new scalar parameter, and the ordinary stable-set hierarchy is recovered exactly from signed digon graphs. For all-negative signatures, the construction becomes a relaxation of the maximum induced bipartite subgraph problem and is related to the generalized theta number. Finally, we propose a notion of balanced perfectness and show that it is strictly weaker than perfectness of the associated double-cover graph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-03T05:24:39+00:00", "updated": "2026-08-03T05:24:39+00:00", "abs_url": "http://arxiv.org/abs/2608.01716v1", "pdf_url": "https://arxiv.org/pdf/2608.01716v1", "journal_ref": "", "doi": "", "comment": "18 pages. I welcome any comments", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 부호 그래프(signed graphs)의 균형 채색을 위한 Lovász형 반정치(semidefinite) 파라미터를 다루며, McMullen 문제나 oriented matroid의 acyclic reorientation과 직접적인 관련이 없다.", "summary": "본 논문은 부호 그래프의 균형 채색(balanced colouring)을 위한 Lovász-type 반정치 파라미터를 도입하고, 대칭적 이중 행렬 정식화를 제시한다. 또한 안정 집합 다면체(stable-set polytope)의 부호 그래프 유사체인 계층적 볼록 코너(convex corner) 구조를 정의하며, 균형 완전성(balanced perfectness) 개념을 제안하여 이중 커버 그래프(double-cover graph)의 완전성보다 엄격히 약함을 보인다.", "technique": "두 개의 양반정치 행렬(positive semidefinite matrices)을 이용한 대칭적 반정치 프로그래밍(semidefinite programming) 정식화 및 부호 그래프의 theta body 계층 구성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2607.27601v1", "title": "Optimal tree-decompositions with bags of bounded pathwidth", "authors": ["Kevin Hendrey", "Robert Hickingbotham", "Jędrzej Hodor", "David R. Wood"], "abstract": "We show that every planar graph has a tree-decomposition with optimal width such that the subgraph induced by each bag has pathwidth at most 3. This bound is best possible, and for tree-decompositions that satisfy a certain minimality condition, we in fact give a precise description of the possible structures in each bag. Moreover, we show that the union of any $k$ bags has pathwidth $O(k)$. We also show that graphs excluding a fixed double-apex-forest minor have a tree-decomposition with optimal width such that the subgraph induced by each bag has bounded pathwidth. This includes graphs embeddable on any fixed surface. As a byproduct of our machinery, we give a new proof of the linear grid minor theorem for planar graphs.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-07-30T02:43:49+00:00", "updated": "2026-07-30T02:43:49+00:00", "abs_url": "http://arxiv.org/abs/2607.27601v1", "pdf_url": "https://arxiv.org/pdf/2607.27601v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Tree-decomposition과 pathwidth는 그래프 구조 분해 문제이며, McMullen's problem은 convex position의 점 배치와 oriented matroid 관련 조합론 문제로, 두 주제 간 직접적 연결이 없음.", "summary": "평면 그래프가 최적 너비의 tree-decomposition을 가지며 각 bag의 induced subgraph의 pathwidth가 최대 3으로 제한된다는 것을 보였다. 이 bound는 최선이며, double-apex-forest minor를 제외하는 그래프(고정 곡면에 embedding 가능한 그래프 포함)도 유사 성질을 만족한다.", "technique": "Tree-decomposition 구조 분석과 pathwidth 제한을 통한 그래프 분해; linear grid minor theorem의 새로운 증명 제시.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.01873v1", "title": "Bipartite Turán Numbers of Trees and Star Forests", "authors": ["Omid Khormali"], "abstract": "The bipartite Turán number of a graph $H$, denoted $\\text{ex}(m, n; H)$, is the maximum   number of edges in any $H$-free bipartite graph $G = (A, B; E)$ with parts of size $|A| = m$ and $|B| = n$. We study this problem for two families. For a tree $T = T(r, s)$ with parts $R$ and $S$ of sizes $|R| = r \\le s = |S|$, we prove   \\[   (r - 1) n \\;\\le\\; \\text{ex}(m, n; T(r, s)) \\;\\le\\; (r - 1) n + O(m)   \\]   for $n$ sufficiently large compared to $m$, $r$, and $s$, determining the leading-order term exactly (with the star case $r=1$ solved with an exact formula). For a star forest $F = \\bigcup_{i=1}^k S_{d_i}$ with $d_1 \\ge \\cdots \\ge d_k$, we determine the exact value $\\text{ex}(m, n; F) = (k - 1) n + (d_k - 1)(m - k + 1)$ for $n$ sufficiently large, and characterize the unique extremal graph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-03T08:19:56+00:00", "updated": "2026-08-03T08:19:56+00:00", "abs_url": "http://arxiv.org/abs/2608.01873v1", "pdf_url": "https://arxiv.org/pdf/2608.01873v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "극값 그래프 이론(Turán 문제)은 이산기하학의 convex position 및 점 배치와 무관한 순수 그래프 조합론 분야.", "summary": "이분 그래프에서 나무와 별 포레스트를 피하는 최대 간선 수(bipartite Turán number)를 연구. 나무 $T(r,s)$에 대해 leading-order term $(r-1)n$을 정확히 결정하고, 별 포레스트에 대해 정확한 공식을 제시.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.27264v1", "title": "Stronger Lower Bounds for Tree Covers via Cyclic Symmetry", "authors": ["Shengtang Huang"], "abstract": "A tree cover of an $n$-point metric space is a collection of $k$ dominating trees such that every pairwise distance is approximately preserved by at least one tree. The best known general upper bound on the distortion is $\\widetilde{O}(n^{1/k})$. Recently, Chen, Tan, and Xu (ITCS 2026, SICOMP 2026) proved a lower bound of $Ω_k(n^{1/2^{k-1}})$ using a topological approach.   We improve their lower bound to $Ω_k(n^{1/[k(p-1)]})=Ω_k(n^{1/O(k^2)})$, where $p$ is the smallest prime strictly larger than $k$. Thus, the gap between the known upper and lower exponents is reduced from exponential in $k$ to a factor of $O(k)$.   Our key observation is a qualitative difference between the antipodal symmetry underlying the binary labels in the previous approach and the cyclic symmetry used here. In the binary setting, every joint label has a unique antipodal partner, whereas every label in $\\mathbb{Z}_p^k$ has many partners that differ from it in every coordinate. This flexibility allows an equivariant Borsuk--Ulam-type theorem in only $k(p-1)$ dimensions to produce two nearby vertices with different labels in all $k$ trees. A cyclic unwinding argument then shows that they are far apart in every tree.", "categories": ["math.CO", "cs.DS"], "primary_category": "math.CO", "published": "2026-07-29T08:44:01+00:00", "updated": "2026-07-29T08:44:01+00:00", "abs_url": "http://arxiv.org/abs/2607.27264v1", "pdf_url": "https://arxiv.org/pdf/2607.27264v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Tree covers of metric spaces와 McMullen's problem (convex position, general position의 기하학적 배치)은 서로 다른 영역으로, 직접적 관련성이 없음.", "summary": "이 논문은 n-점 메트릭 공간의 트리 커버(tree cover)에서 왜곡(distortion) 하한을 개선한다. Borsuk-Ulam 유형의 위상적 논증을 순환 대칭(cyclic symmetry)을 사용하여 재설계하여, 기존 지수적 차이를 $O(k)$ 인수로 축소했다.", "technique": "Equivariant Borsuk-Ulam-type theorem을 $\\mathbb{Z}_p^k$의 순환 대칭으로 활용하여 차원 감소 ($2^k$에서 $k(p-1)$)를 달성하고, cyclic unwinding 논증으로 거리 관계를 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.01350v1", "title": "The Middle Stair for Complete Bipartite Parallel Chip-Firing", "authors": ["Minkyu Jung"], "abstract": "We prove the middle-stair conjecture for every complete bipartite graph. If a parallel chip-firing game on $K_{a,b}$ has configuration $σ$ with $2ab-a-b<|σ|<2ab$, then its eventual period is $2$. The balanced case $K_{a,a}$ was proved by Ji, Li, and Wang using one-parameter conjugate configurations. We introduce two-parameter conjugates $c^{k,\\ell}$, in which the rank shift on one side supplies the additive offset on the other. These conjugates preserve both the total number of chips and the activity. An exact Ferrers-diagram count then produces a nonnegative conjugate with two-round firing coverage on one side. The coverage propagates in alternating two-round waves, giving activity $1/2$; non-clumpiness then forces period $2$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-02T16:12:40+00:00", "updated": "2026-08-02T16:12:40+00:00", "abs_url": "http://arxiv.org/abs/2608.01350v1", "pdf_url": "https://arxiv.org/pdf/2608.01350v1", "journal_ref": "", "doi": "", "comment": "5 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "완전이분그래프의 병렬 칩-파이링 게임은 조합론적 구조를 다루지만, McMullen 문제(볼록위치 점 배치, oriented matroid 실현가능성)와 직접적인 관련이 없습니다.", "summary": "본 논문은 완전이분그래프 $K_{a,b}$의 병렬 칩-파이링 게임에서 중간계단 추측을 증명합니다. 칩 개수가 $2ab-a-b<|\\sigma|<2ab$ 범위에 있을 때 최종 주기가 2임을 보입니다. 핵심은 두 매개변수 켤레 구성(two-parameter conjugates)을 도입하여 양쪽에서 발사 패턴을 제어하는 것입니다.", "technique": "두 매개변수 켤레 구성($c^{k,\\ell}$)을 통해 칩 개수와 활성도(activity)를 보존하면서 Ferrers 다이어그램 계산으로 교대 두 라운드 파동 구조를 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.26403v1", "title": "An Invertible Family of Hurwitz--Lerch Type Functions Associated with $k$-Augmented Centered Triangular Numbers", "authors": ["Noel B. Lacpao", "Rushel S. Acope", "Marlon S. Frias", "Mark Ivan P. Arcillas", "Rey Carl P. Tiu", "Francis Jay R. Romagos"], "abstract": "This paper defines a family of Hurwitz--Lerch type functions whose   coefficients are the \\(k\\)-augmented centered triangular numbers. For this   family, we obtain the convergence conditions, a reduction formula, and an   Euler-operator form. A Vandermonde-based inversion formula is derived for a   class of polynomially weighted Hurwitz--Lerch functions. The family considered   here is the quadratic case with geometric factors \\(1\\), \\(2\\), and \\(4\\).   The resulting formulas show that three consecutive functions recover the   classical Hurwitz--Lerch transcendent and its first two Euler derivatives.   We also derive recurrence formulas, ordinary generating functions, finite   sums, and special values. The values at \\(z=1\\) are expressed through   Hurwitz zeta functions and Bernoulli polynomials. When \\(a=1\\), the numerator   polynomials of the rational values \\(H_k(z,-m,1)\\) are written in terms of   Eulerian polynomials, while the alternating values \\(H_k(-1,-m,a)\\) are   expressed through Euler polynomials.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-29T02:34:23+00:00", "updated": "2026-07-29T02:34:23+00:00", "abs_url": "http://arxiv.org/abs/2607.26403v1", "pdf_url": "https://arxiv.org/pdf/2607.26403v1", "journal_ref": "", "doi": "", "comment": "17 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 분류이나 McMullen's problem(볼록위치의 점 배치, oriented matroid, 기하학적 조합론)과 무관하게 특수함수론 및 정수수열 연구에 초점.", "summary": "본 논문은 k-augmented centered triangular numbers를 계수로 갖는 Hurwitz-Lerch 타입 함수족을 정의하고, 수렴조건, 축약공식, Euler 연산자 형식을 유도한다. Vandermonde 기반의 역공식을 도출하며, z=1에서의 값을 Hurwitz 제타함수와 Bernoulli 다항식으로 표현한다.", "technique": "Vandermonde 역공식, Hurwitz 제타함수, Bernoulli 및 Eulerian 다항식을 활용한 특수값 계산.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.00575v1", "title": "The finitude of the fibers of the complementary Bell numbers", "authors": ["John M. Campbell"], "abstract": "Subbarao and Verma introduced, in 1999, a number of open problems concerning the sequence $(f(n))_{n \\geq 0}$ of complementary Bell numbers, which may be defined via Bell polynomials $B_{n}(x) = \\sum_{k=0}^{n} \\left\\{ \\begin{smallmatrix} n \\\\ k \\end{smallmatrix} \\right\\} x^k$ so that $f(n) = B_{n}(-1)$. Yang [Electron. J. Combin., 2001] subsequently solved the first two problems from Subbarao and Verma, but the third such problem has remained open, to the best of our knowledge. The first part of this third problem asks whether or not $f(n)$ takes any given value only a finite number of times. We solve this problem in the affirmative, through a combined application of finite difference-based methods, partial Motzkin paths, the completeness of the Tate algebra with respect to the Gauss norm, and Strassmann's theorem.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-08-01T10:29:10+00:00", "updated": "2026-08-01T10:29:10+00:00", "abs_url": "http://arxiv.org/abs/2608.00575v1", "pdf_url": "https://arxiv.org/pdf/2608.00575v1", "journal_ref": "", "doi": "", "comment": "Submitted for publication", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 논문이지만 McMullen's problem(convex geometry, point configurations, oriented matroids)과는 주제가 직접 관련되지 않음.", "summary": "본 논문은 Subbarao-Verma(1999)의 미해결 문제를 해결하여, 여집합 Bell 수열 $f(n) = B_n(-1)$이 각 값을 유한 번만 취함을 증명한다. 유한 차분 방법, 부분 Motzkin 경로, Tate 대수와 Strassmann 정리를 결합하여 이를 입증했다.", "technique": "유한 차분(finite difference), Motzkin 경로, Tate 대수의 Gauss 노름에 대한 완비성(completeness), Strassmann 정리의 응용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.01206v1", "title": "On three open problems in zero-sum Ramsey numbers", "authors": ["Cheng Chi", "Jialin He", "Quan Sun"], "abstract": "Let $K_N^{(r)}$ denote the $N$-vertex complete $r$-uniform hypergraph. For an $r$-uniform hypergraph $H$ and an integer $k\\geq2$, the $k$-color Ramsey number $R(H,k)$ is the least integer $N$ such that every $k$-edge-coloring of $K_N^{(r)}$ contains a monochromatic copy of $H$. When $k\\mid\\esize(H)$, the zero-sum Ramsey number $R(H,\\mathbb Z_k)$ is the least integer $N$ such that every edge-labeling of $K_N^{(r)}$ by elements of $\\mathbb Z_k$ contains a copy of $H$ whose edge labels sum to $0$ in $\\mathbb Z_k$.   We settle two conjectures and a problem concerning these two Ramsey numbers. First, Caro and Provstgaard proposed exact values for the zero-sum Ramsey numbers over $\\mathbb Z_2$ of delta-systems with an even number of edges. We determine these numbers and thereby prove their conjecture. Second, for a forest $F$ with $m$ edges, let $tF$ denote the disjoint union of $t$ copies of $F$. Caro conjectured that $R(tF,\\mathbb Z_{mt})=R(tF,2)$ for all sufficiently large $t$. We show that this conjecture does not hold for double stars. Caro also asked whether there exists a tree $T$ with $m$ edges such that $R(T,\\mathbb Z_m)>R(T,2)$. We answer this question affirmatively by constructing an infinite family of such trees.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-02T12:47:18+00:00", "updated": "2026-08-02T12:47:18+00:00", "abs_url": "http://arxiv.org/abs/2608.01206v1", "pdf_url": "https://arxiv.org/pdf/2608.01206v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Zero-sum Ramsey 수는 조합론의 중요한 주제이지만 McMullen's problem(5차원 convex polytope의 면 개수)과는 직접적 연관이 없음.", "summary": "본 논문은 초록에서 명시된 세 가지 open problem을 다룬다: (1) $\\mathbb{Z}_2$ 위의 delta-system zero-sum Ramsey 수에 관한 Caro–Provstgaard 추측을 증명, (2) 삼림(forest)의 disjoint union에 대해 Caro의 추측이 double star에서 성립하지 않음을 보임, (3) $R(T, \\mathbb{Z}_m) > R(T, 2)$인 무한 트리 족을 구성하여 Caro의 문제에 affirmative 답변.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.12681v1", "title": "Volume and Projection Inequalities I: Zonoids and Courtade's Conjecture", "authors": ["Matthieu Fradelizi", "Alfredo Hubard", "Auttawich Manui", "Cheikh Saliou Ndiaye", "Shouda Wang", "Artem Zvavitch"], "abstract": "We study volume and projection inequalities for zonoids through the multiaffine determinant polynomials that encode their volumes. We show that a log-submodularity conjecture for the volume of zonoids is equivalent to the Rayleigh property of zonotope volume polynomials, which we prove for the c

er)의 실현 가능성(Hurwitz existence problem)을 다루며, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 전혀 관련이 없다.", "summary": "소수 $p$에 대해 구면 위의 모든 호환 분기 데이터(compatible branch datum)가 연결 분기 피복으로 실현 가능함을 증명한다. 3점 경우는 잉여 표수 $p$에서 구성되며, Henrio의 모멘트 정리, Wewers의 리프팅 정리, Edmonds–Kulkarni–Stong의 결합(fusion) 결과를 조합하여 일반적인 분기값 개수로 확장된다. 결과로서 연결 소수 차수 Hurwitz 퍼텐셜의 완전 지지, 대응하는 연결 상대 Gromov–Witten 불변량의 비영성 등이 도출된다.", "technique": "잉여 표수 $p$에서 Henrio의 모멘트 정리로 꼬리(tail)를 구성하고, 로그 변형 데이터(logarithmic deformation datum)와 Wewers의 리프팅 정리를 통해 표수 0의 3점 갈루아 피복을 얻은 뒤, Edmonds–Kulkarni–Stong의 실현·융합 결과로 일반화한다.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.20436v1", "title": "New upper bounds for the chromatic numbers of Euclidean spaces", "authors": ["Leonid Ivanov", "Nadezhda Glushkova"], "abstract": "A coloring of $\\R^n$ is \\emph{proper for the forbidden distance segment} $[1,\\ell]$ if no two points of the same color are at a distance from $[1,\\ell]$; the minimum number of colors is $χ(\\R^n,[1,\\ell])$, and $\\ell=1$ gives the classical chromatic number $χ(\\R^n)$ of the Nelson--Hadwiger problem. We prove the new upper bounds $χ(\\R^4)\\le43$, $χ(\\R^5)\\le132$, $χ(\\R^7)\\le1029$, $χ(\\R^9)\\le7203$, $χ(\\R^{10})\\le45619$, improving the previously known $49$, $140$, $1372$, $17253$ and $3^{10}$; in particular, this refutes the conjecture of Arman, Bondarenko, Prymak and Radchenko that $49$ and $140$ are optimal among all lattice colorings of $\\R^4$ and $\\R^5$. The first four bounds come from explicit rational lattices --- an Eisenstein lattice in $\\R^4$, a lattice in general position in $\\R^5$, and laminations of the Eisenstein colorings $E_6^*/343$ and $E_8/2401$ in $\\R^7$ and $\\R^9$ --- and each is reduced, by one verification protocol, to a finite list of inequalities between explicitly written rational numbers checked in exact arithmetic. The fifth bound is analytic: we prove that for every Eisenstein lattice $Λ$ the distance between same-colored cells of $(3+ω)Λ$ equals $\\sqrt{7/3}\\,λ_1(Λ)$, which gives the exact widths of all known colorings with $7^{n/2}$ colors, and a product rule $\\sum_i1/d_i^2\\le1$ for the widths of orthogonal products; together they yield $45619=2401\\cdot19$, the first bound in $\\R^{10}$ below $3^n$, as well as $χ(\\R^{25})\\le4\\cdot7^{12}$ and $χ(\\R^{26})\\le19\\cdot7^{12}$. We also show that no sublattice of $E_8$ of index below $2401$ defines a proper coloring. All code, exact certificates and data are open.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T14:12:41+00:00", "updated": "2026-09-17T14:12:41+00:00", "abs_url": "http://arxiv.org/abs/2609.20436v1", "pdf_url": "https://arxiv.org/pdf/2609.20436v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유클리드 공간의 채색수(chromatic number) 상한을 다루며, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid)와 직접적 관련이 없다.", "summary": "이 논문은 넬슨-하드위거 문제 및 금지 거리 구간 $[1,\\ell]$에 대한 $\\mathbb{R}^n$의 채색수 $\\chi(\\mathbb{R}^n)$의 새로운 상한을 제시한다. $\\chi(\\mathbb{R}^4)\\le43$, $\\chi(\\mathbb{R}^5)\\le132$, $\\chi(\\mathbb{R}^7)\\le1029$, $\\chi(\\mathbb{R}^9)\\le7203$, $\\chi(\\mathbb{R}^{10})\\le45619$ 등을 증명하여 기존 최적값을 개선하고, Arman 등의 추측을 반박한다. 상한은 Eisenstein 격자와 $E_6^*$, $E_8$ 격자의 라미네이션(lamination) 구조, 그리고 직교곱에 대한 폭(width) 조건 $\\sum_i 1/d_i^2 \\le 1$을 활용하여 유도된다.", "technique": "Eisenstein 격자 및 $E_6^*$, $E_8$ 기반 유리 격자 채색과 직교곱 폭 부등식을 결합하여 유한 검증 프로토콜로 정확한 산술로 확인 가능한 상한을 구성한다.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2609.19637v1", "title": "Unimodality for IDP Lattice Simplices of Prime Normalized Volume", "authors": ["Feihu Liu", "Zihao Zhang"], "abstract": "Recently, Ferroni constructed a family of counterexamples to the well-known conjecture in Ehrhart theory stating that the $h^*$-polynomial of a lattice polytope with the integer decomposition property is unimodal. This raises the question of whether the $h^*$-polynomial of a lattice simplex with the integer decomposition property remains unimodal. In this note, we prove that every lattice simplex with the integer decomposition property and prime normalized volume has a unimodal $h^*$-polynomial. Furthermore, we establish several sufficient conditions for the unimodality of the $h^*$-polynomial of such simplices.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T03:28:03+00:00", "updated": "2026-09-17T03:28:03+00:00", "abs_url": "http://arxiv.org/abs/2609.19637v1", "pdf_url": "https://arxiv.org/pdf/2609.19637v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Ehrhart 이론의 $h^*$-다항식 단조성(unimodality)에 관한 것으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "Ferroni가 정수 분해 성질(IDP)을 가지는 격자 다면체의 $h^*$-다항식이 단조(unimodal)하다는 잘 알려진 추측에 대한 반례를 구성한 이후, 이 논문은 IDP를 갖는 격자 단체(simplex)로 문제를 한정할 경우 소수 정규화 부피(prime normalized volume)를 가지면 $h^*$-다항식이 단조임을 증명한다. 또한 그러한 단체의 $h^*$-다항식 단조성을 위한 여러 충분 조건을 확립한다.", "technique": "", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.18873v1", "title": "Decomposing Gorenstein polytopes of large index", "authors": ["Johannes Knupfer", "Benjamin Nill"], "abstract": "In this paper we prove a free-join decomposition theorem on Gorenstein polytopes significantly improving upon results in prior joint work of the second author with Batyrev, Borger, Haase, Kretschmer, and Payne. In particular, as a strong extension of the Batyrev-Juny lattice pyramid theorem it implies that any $d$-dimensional Gorenstein polytope $P$ of index larger than $\\frac{d+2}{2}$ is a free join of Gorenstein polytopes. Here, the index (also called codegree) is the dilation factor $r$ such that $rP$ is reflexive. As our main application, we prove that the stringy $E$-polynomial of a Gorenstein polytope $P$ vanishes if and only if $P$ is thin (i.e., its local $h^*$-polynomial vanishes), and it has the expected degree otherwise. The latter was conjectured by Batyrev and the second author.   The proofs of the general results were found via ChatGPT 5.6 Sol, while a proof of the extremal case of the Batyrev-Juny conjecture is contained in the master thesis of the first author.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-16T16:09:33+00:00", "updated": "2026-09-16T16:09:33+00:00", "abs_url": "http://arxiv.org/abs/2609.18873v1", "pdf_url": "https://arxiv.org/pdf/2609.18873v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Gorenstein polytope의 free-join 분해 및 stringy E-다항식에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 Gorenstein polytope의 free-join 분해 정리를 증명하며, 특히 지수(index/codegree)가 $\\frac{d+2}{2}$보다 큰 $d$차원 Gorenstein polytope $P$는 Gorenstein polytope들의 free join임을 보인다. 주요 응용으로, Gorenstein polytope $P$의 stringy $E$-다항식이 소멸하는 것과 $P$가 thin(즉, local $h^*$-다항식이 소멸)인 것이 동치임을 증명하며, 이는 Batyrev와 제2저자의 추측을 해결한다. 일반 결과의 증명은 ChatGPT 5.6 Sol을 통해 발견되었다고 명시되어 있다.", "technique": "Batyrev-Juny lattice pyramid 정리의 강화로서 free-join 분해 정리를 활용하며, local $h^*$-다항식 및 stringy $E$-다항식 분석을 적용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.18367v1", "title": "Generating Functions and the Minimum Spectral Radius in Strongly Connected Digraphs with $m+2$ Edges", "authors": ["Rostislav Klech"], "abstract": "We study the minimum adjacency spectral radius in the class $\\mathcal{SC}_{m+2}(m)$ of strongly connected digraphs with $m$ vertices and $m+2$ edges. Using generating functions for directed paths, we associate with the relevant digraphs topological polynomials whose smallest positive roots determine the corresponding spectral radii. Based on an ear decomposition, we obtain a complete structural classification of $\\mathcal{SC}_{m+2}(m)$ by showing that every digraph in this class can be obtained from a butterfly digraph by attaching a single ear. This reduces the extremal problem to the optimization and comparison of finitely many polynomial families subject to their realizability conditions. We prove that the minimum spectral radius is determined by the polynomial $P_{\\min}(z)=1-2z^{m-1}-z^m$. If $R_m\\in(0,1)$ denotes its unique root, then $\\min_{G\\in\\mathcal{SC}_{m+2}(m)}ρ(G)=R_m^{-1}$. For $m\\geq4$, the minimum is attained, up to isomorphism, uniquely by the cross-chorded cycle $\\mathcal{C}_m^\\times$. For $m=3$, there are exactly two non-isomorphic minimizers, both with spectral radius $(1+\\sqrt5)/2$. Finally, we establish the bounds $2^{1/(m-1)}<ρ\\left(\\mathcal{C}_m^\\times\\right)<3^{1/(m-1)}$.", "categories": ["math.CO", "math.DS", "math.SP"], "primary_category": "math.CO", "published": "2026-09-16T09:22:18+00:00", "updated": "2026-09-16T09:22:18+00:00", "abs_url": "http://arxiv.org/abs/2609.18367v1", "pdf_url": "https://arxiv.org/pdf/2609.18367v1", "journal_ref": "", "doi": "", "comment": "50 pages, 18 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유향 그래프의 스펙트럼 반지름에 관한 것으로, McMullen 문제(볼록 위치·방향 매트로이드·실현 가능성)와 직접적인 연관이 없다.", "summary": "이 논문은 $m$개의 꼭짓점과 $m+2$개의 간선을 가진 강연결 유향 그래프 클래스 $\\mathcal{SC}_{m+2}(m)$에서 인접 스펙트럼 반지름의 최솟값을 연구한다. 귀 분해(ear decomposition)를 통한 구조적 분류를 바탕으로, 최소 스펙트럼 반지름이 다항식 $P_{\\min}(z)=1-2z^{m-1}-z^m$의 가장 작은 양의 근의 역수임을 증명한다. $m\\geq 4$일 때 최솟값은 동형을 제외하고 교차-현 순환 그래프(cross-chorded cycle) $\\mathcal{C}_m^\\times$ 단 하나에서 달성되며, $m=3$일 때는 정확히 두 개의 비동형 최솟값이 존재한다.", "technique": "유향 경로에 대한 생성함수를 이용해 위상 다항식을 연관시키고, 귀 분해를 통한 구조 분류로 극값 문제를 유한 개의 다항식 군 비교로 환원한다.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.17932v1", "title": "A Better-Than-$3$ Approximation Algorithm for Demand Matching via Knapsack Intersection LP and Contention Resolution", "authors": ["Michel X. Goemans", "Yuchong Pan"], "abstract": "The demand matching problem generalizes both the knapsack problem and the $b$-matching problem. In this problem, each edge of a graph has a demand and a weight, and each vertex has a capacity. The goal is to find a maximum weight subset of edges such that, at each vertex, the total demand of the incident selected edges does not exceed the vertex capacity. Parekh [IPCO 2011] proved that, if each edge is individually feasible, the natural LP relaxation for demand matching has integrality gap at most $3$, yielding a $3$-approximation algorithm. This bound is tight for the natural LP relaxation, matching the lower bound of Shepherd and Vetta [Math. Oper. Res. 2007].   We present a randomized $(3/2 + \\sqrt{2} + \\varepsilon) \\approx (2.914 + \\varepsilon)$-approximation algorithm for the demand matching problem for every $\\varepsilon > 0$, giving the first approximation ratio strictly better than $3$. For bipartite graphs, we obtain a randomized $(2 + \\varepsilon)$-approximation algorithm for every $\\varepsilon > 0$. Both algorithms run in time polynomial in $1/\\varepsilon$ and the input length. Our algorithms use a strengthened LP relaxation based on intersecting the integral knapsack polytopes associated with the vertices, together with a multiple-choice generalization. As a key ingredient, we prove the existence of a $(q, 1/(1+q))$-balanced contention resolution scheme for the integral knapsack polytope for every $q \\in [0, 1]$, which may be of independent interest. The balance guarantee $1/(1+q)$ is tight in the worst case over all knapsack instances.", "categories": ["cs.DS", "cs.DM", "math.CO"], "primary_category": "cs.DS", "published": "2026-09-15T23:44:53+00:00", "updated": "2026-09-15T23:44:53+00:00", "abs_url": "http://arxiv.org/abs/2609.17932v1", "pdf_url": "https://arxiv.org/pdf/2609.17932v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 demand matching 문제의 근사 알고리즘에 관한 것으로, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 전혀 관련이 없다.", "summary": "이 논문은 knapsack 문제와 $b$-matching 문제를 동시에 일반화하는 demand matching 문제에 대해, 기존 최선의 근사비 $3$을 처음으로 돌파하는 $(3/2 + \\sqrt{2} + \\varepsilon) \\approx 2.914 + \\varepsilon$ 근사 알고리즘을 제시한다. 이분 그래프의 경우 $(2+\\varepsilon)$ 근사를 달성하며, 두 알고리즘 모두 다항 시간에 동작한다. 핵심 기여로, integral knapsack polytope에 대한 $(q, 1/(1+q))$-balanced contention resolution scheme의 존재를 증명하며, 이 보장이 최악의 경우 tight함을 보인다.", "technique": "정점별 integral knapsack polytope의 교집합에 기반한 강화된 LP 완화(relaxation)와 multiple-choice 일반화, 그리고 knapsack polytope에 대한 balanced contention resolution scheme을 결합한 무작위화 알고리즘.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.22078v1", "title": "Stellahedral Geometry of Partially Ordered Sets", "authors": ["Tommaso Faustini", "Luis Ferroni", "Ludovico Piazza"], "abstract": "We introduce a transformation on partially ordered sets, termed the \\emph{stellahedral transform}, with notable features.   It preserves the properties of being Eulerian, Cohen--Macaulay, and of being the face poset of a polytope.   Furthermore, it admits an explicit geometric realization for convex polytopes and specializes to the construction that takes a simplex to the stellahedron. One motivation for this definition comes from the theory of toric $h$-polynomials and (augmented) Chow polynomials of Eulerian posets.   We show that the right augmented Chow polynomial of an Eulerian poset $P$ agrees with the toric $h$-polynomial of the stellahedral transform of $P$. We use this perspective, together with $\\mathbf{cd}$-index results due to Ehrenborg (2005) and Karu (2006), to prove two positivity results for augmented Chow polynomials: for Gorenstein* posets they are unimodal, and for face posets of polytopes they are $γ$-positive.   Along the way we provide negative answers to two open questions concerning Eulerian and Gorenstein* posets. First, the question on the nonnegativity of Eulerian Chow polynomials, posed by Ferroni, Matherne, and Vecchi (2024). Second, the question posed by Athanasiadis and Kalampogia-Evangelinou (2023) on the real-rootedness of chain and Chow polynomials of Gorenstein* posets: these examples provide a novel application of a technique introduced by Murai and Nevo (2014).", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-18T17:58:38+00:00", "updated": "2026-09-18T17:58:38+00:00", "abs_url": "http://arxiv.org/abs/2609.22078v1", "pdf_url": "https://arxiv.org/pdf/2609.22078v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 편순서집합(poset)의 stellahedral 변환, Chow 다항식, toric h-다항식에 관한 것으로 McMullen 문제나 oriented matroid와 직접적 관련이 없다.", "summary": "본 논문은 편순서집합에 'stellahedral transform'이라는 새로운 변환을 도입하여, Eulerian·Cohen–Macaulay 성질 및 다면체 face poset 성질을 보존함을 보인다. 이 변환을 통해 Eulerian poset $P$의 right augmented Chow 다항식이 stellahedral transform의 toric $h$-다항식과 일치함을 증명하고, 이를 활용해 augmented Chow 다항식에 대한 두 가지 양성(positivity) 결과(Gorenstein* poset에서 unimodal, 다면체 face poset에서 $\\gamma$-positive)를 도출한다. 또한 Eulerian Chow 다항식의 비음성 및 Gorenstein* poset의 Chow 다항식 real-rootedness에 관한 두 미해결 문제에 부정적 답을 제시한다.", "technique": "Ehrenborg(2005)과 Karu(2006)의 $\\mathbf{cd}$-index 결과 및 Murai–Nevo(2014)의 기법을 활용하여 augmented Chow 다항식의 양성 결과를 증명하고 반례를 구성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.21670v1", "title": "Centro-affine spectral geometry of polytopes", "authors": ["Yingxiang Hu", "Mohammad N. Ivaki"], "abstract": "In this paper, we develop a polyhedral version of Milman's centro-affine spectral framework for full-dimensional origin-symmetric polytopes. A weighted graph Laplacian on the facets plays the role of the smooth centro-affine Laplacian. For $n\\geq 3$, we prove that its first nonconstant even eigenvalue satisfies \\[   λ_{1,e}(P)\\geq n-1+\\frac{1}{n-1} \\] whenever $P$ is a local minimizer of $λ_{1,e}$ among origin-symmetric polytopes with the same facet normals, but not necessarily the same normal fan.", "categories": ["math.MG", "math.AP"], "primary_category": "math.MG", "published": "2026-09-18T12:06:32+00:00", "updated": "2026-09-18T12:06:32+00:00", "abs_url": "http://arxiv.org/abs/2609.21670v1", "pdf_url": "https://arxiv.org/pdf/2609.21670v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 centro-affine 스펙트럼 기하학과 다면체의 가중 그래프 라플라시안 고유값을 다루며, McMullen 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "이 논문은 완전 차원의 원점 대칭 다면체(origin-symmetric polytopes)에 대해 Milman의 centro-affine 스펙트럼 프레임워크의 다면체 버전을 개발한다. 면(facets) 위의 가중 그래프 라플라시안이 매끄러운 centro-affine 라플라시안의 역할을 한다. $n \\geq 3$에서, 같은 면 법선벡터를 가진 원점 대칭 다면체들 중 $\\lambda_{1,e}$의 국소 최솟값에서 첫 번째 비상수 짝수 고유값이 $\\lambda_{1,e}(P) \\geq n-1+\\frac{1}{n-1}$을 만족함을 증명한다.", "technique": "면(facets) 위의 가중 그래프 라플라시안을 구성하고, 국소 최소화 조건 하에서 고유값의 하한을 도출하는 스펙트럼 분석 기법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.23710v1", "title": "Sylvester simplices: Triangulations and Ehrhart-theoretic aspects", "authors": ["Jhon B. Caicedo", "Federico Castillo", "Martina Juhnke", "Germain Poullot"], "abstract": "The Sylvester simplex $\\mathsf{Sylv}_d^k$ is a $d$-dimensional lattice simplex with exactly $k$ interior lattice points. Sylvester simplices are conjectured to be the volume maximizers among all $d$-dimensional lattice polytopes with exactly $k$ interior lattice points for any $k\\geq 1$. Even stronger, it is conjectured that they maximize (entry-wise) the $h^\\ast$-vector among all $d$-dimensional lattice polytopes with exactly $k$ interior lattice points. Yet, Sylvester simplices seem to be rarely studied in their own right. In particular, their Ehrhart-theoretic properties are far from being well understood.   In the present article, we tackle this problem. We describe flag, regular and unimodular triangulations for the Sylvester simplices, and prove that their $h^\\ast$-vectors are unimodal. Moreover, we explicitly determine the values of some entries of their $f^\\ast$-vectors, and prove that they are Ehrhart magic positive up to dimension $6$ but not in dimension $7$. We conclude by detailing tables of Ehrhart-theoretic quantities (numbers of lattice points, Ehrhart polynomials, local and boundary $h^\\ast$-vectors, $f^\\ast$-vectors) for Sylvester simplices of dimensions 7 and lower.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-20T15:41:21+00:00", "updated": "2026-09-20T15:41:21+00:00", "abs_url": "http://arxiv.org/abs/2609.23710v1", "pdf_url": "https://arxiv.org/pdf/2609.23710v1", "journal_ref": "", "doi": "", "comment": "29 (= 21 + appendix) pages, 3 figures, 8 tables", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Sylvester simplex의 Ehrhart 이론(삼각분할, $h^*$-벡터, $f^*$-벡터)을 다루며, McMullen 문제나 oriented matroid의 acyclic reorientation과는 직접적 연관이 없다.", "summary": "Sylvester simplex $\\mathsf{Sylv}_d^k$는 정확히 $k$개의 내부 격자점을 갖는 $d$차원 격자 simplex로, 동일 조건의 모든 격자 다면체 중 부피 및 $h^*$-벡터를 최대화한다는 추측이 있다. 본 논문은 Sylvester simplex에 대한 flag, regular, unimodular 삼각분할을 기술하고, $h^*$-벡터의 unimodality를 증명하며, $f^*$-벡터의 일부 항을 명시적으로 결정한다. 또한 차원 6 이하에서는 Ehrhart magic positive임을 증명하나 차원 7에서는 성립하지 않음을 보이고, 차원 7 이하의 Ehrhart 관련 수치 표를 제공한다.", "technique": "Flag·regular·unimodular 삼각분할 구성 및 Ehrhart 이론($h^*$-벡터, $f^*$-벡터) 분석.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.22514v1", "title": "Directed distances in spanning-tree-decorated planar maps: exact exponent, scaling limit and universality", "authors": ["Jacopo Borga", "Ewain Gwynne", "Yuanzheng Wang"], "abstract": "We define a natural orientation on a spanning-tree-decorated planar map whereby, roughly speaking, each directed edge in the map is oriented to match the direction of the contour exploration of the spanning tree. We study directed distances (lengths of shortest directed paths) with respect to this orientation.   We construct the Busemann function which measures directed distances to $\\infty$ along a natural interface in the uniform infinite spanning-tree-decorated map. We show that this Busemann function, re-scaled appropriately, converges in law to a $3/2$-stable Lévy process.   We also show that in a uniform spanning-tree-decorated map with $n$ edges, directed distances are typically of order $n^{1/3}$. Using a strong coupling argument, we deduce analogous statements for directed distances in other random planar maps in the $\\sqrt 2$-Liouville quantum gravity (LQG) universality class, including uniform meandric systems and mated-CRT maps for $γ=\\sqrt 2$. These results give the scaling dimension for a hypothetical directed version of the $\\sqrt 2$-LQG metric.   Our proof strategy is inspired by work of Borga and Gwynne (2025) on directed distances in bipolar-oriented triangulations.", "categories": ["math.PR", "math-ph", "math.CO"], "primary_category": "math.PR", "published": "2026-09-18T19:22:21+00:00", "updated": "2026-09-18T19:22:21+00:00", "abs_url": "http://arxiv.org/abs/2609.22514v1", "pdf_url": "https://arxiv.org/pdf/2609.22514v1", "journal_ref": "", "doi": "", "comment": "89 pages, 29 figures. Comments are welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 신장트리로 장식된 평면 지도에서의 방향 거리와 LQG 보편성에 관한 확률론·수리물리 연구로, McMullen 문제나 oriented matroid·볼록 위치 배치와 무관하다.", "summary": "신장트리로 장식된 평면 지도에 자연스러운 방향성을 부여하고, 해당 방향 거리(최단 유향 경로 길이)를 연구한다. 균일 무한 신장트리-장식 지도에서 Busemann 함수를 구성하여 적절히 재정규화하면 $3/2$-stable Lévy 과정으로 분포 수렴함을 증명하고, $n$개의 간선을 가진 균일 신장트리-장식 지도에서 방향 거리가 전형적으로 $n^{1/3}$ 차수임을 보인다. 강결합(strong coupling) 논증을 통해 $\\sqrt{2}$-LQG 보편성 류에 속하는 균일 meandric system 및 $\\gamma=\\sqrt{2}$ mated-CRT 지도 등에도 유사한 결과를 도출한다.", "technique": "Busemann 함수 구성, $3/2$-stable Lévy 과정으로의 약수렴, 강결합(strong coupling) 논증을 핵심 기법으로 사용하며, bipolar-oriented triangulation에서의 방향 거리 연구(Borga–Gwynne 2025)에서 영감을 받은 증명 전략을 채택한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.25863v1", "title": "Exact Ehrhart Series of Birkhoff Polytopes via Constant Terms and Finite-Field Evaluation", "authors": ["Xinru Jiang", "Guoce Xin", "Chen Zhang", "Yueming Zhong"], "abstract": "The Ehrhart series of the $n$th Birkhoff polytope is $\\sum_{r\\geq0}H_n(r)z^r$, where $H_n(r)$ counts nonnegative integer $n\\times n$ matrices whose row and column sums all equal $r$. We present an exact method for computing this series using constant terms and finite fields. A root filter expresses $H_n(r)$ as a weighted sum of the values $h_r(M)^n$, where $h_r$ is the complete homogeneous symmetric polynomial and $M$ ranges over multisets of $m$th roots of unity with $m=r+1$. Constant-term cancellation reduces the evaluation of $h_r(M)$ to a sum over repeated elements $a$ of $M$. For a particular $a$ of multiplicity $μ_a$, the computation uses a generalized Todd coefficient of degree $μ_a-2$. Sums of $h_r(M)^n$ over selected multiplicity classes are handled using symmetric function techniques. Together with the remaining individual evaluations, this gives $O_n(m^{n-5}+m^4)$ field operations for each admissible prime and fixed $n\\geq5$. An explicit bound and the Chinese remainder theorem recover the integer counts, and Ehrhart symmetry determines the full series. The same method applies to the World Cup problem, which counts the same matrices with diagonal entries required to be $0$. We prove correctness and compute complete series for both families through order $12$. The Birkhoff series for orders $10$--$12$ and the World Cup series for orders $9$--$12$ are tabulated in the appendices.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T08:27:32+00:00", "updated": "2026-09-22T08:27:32+00:00", "abs_url": "http://arxiv.org/abs/2609.25863v1", "pdf_url": "https://arxiv.org/pdf/2609.25863v1", "journal_ref": "", "doi": "", "comment": "37 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Birkhoff polytope의 Ehrhart 급수 계산에 관한 것으로, McMullen 문제(d=5에서의 볼록 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 $n$차 Birkhoff polytope의 Ehrhart 급수를 constant term 기법과 유한체(finite field) 평가를 이용해 정확히 계산하는 방법을 제시한다. root filter를 통해 $H_n(r)$을 완전동차대칭다항식(complete homogeneous symmetric polynomial) $h_r(M)^n$의 가중합으로 표현하고, constant-term 소거 및 중국인의 나머지 정리(Chinese Remainder Theorem)를 결합하여 고정된 $n\\geq5$에 대해 각 허용 소수마다 $O_n(m^{n-5}+m^4)$ 번의 체(field) 연산으로 계산한다. 이 방법을 Birkhoff polytope(10~12차)와 World Cup 문제(9~12차)에 적용하여 완전한 급수를 표로 제시한다.", "technique": "root filter와 constant-term 소거, 대칭함수 기법, 일반화된 Todd 계수, 유한체 평가 및 중국인의 나머지 정리를 결합한 Ehrhart 급수의 정확 계산법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.25004v1", "title": "Abstract regular polytopes of $G_2(q)$ in even characteristic", "authors": ["Malcolm Hoong Wai Chen"], "abstract": "For every even prime power $q>2$, we explicitly construct a rank five string C-group representation of the Chevalley simple group $G_2(q)$ using its natural seven-dimensional matrix representation. We also give a census for the string C-group representations of $G_2(q)$ of ranks four and above for every prime power $3 \\le q \\le 11$; providing computational evidence that rank five string C-group representations of $G_2(q)$ are rare and that this construction is exceptional among the currently known examples.", "categories": ["math.GR", "math.CO"], "primary_category": "math.GR", "published": "2026-09-21T17:59:59+00:00", "updated": "2026-09-21T17:59:59+00:00", "abs_url": "http://arxiv.org/abs/2609.25004v1", "pdf_url": "https://arxiv.org/pdf/2609.25004v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Chevalley 군 $G_2(q)$의 abstract regular polytope(string C-group 표현)을 구성하는 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "짝수 소수 거듭제곱 $q>2$에 대해 Chevalley 단순군 $G_2(q)$의 자연스러운 7차원 행렬 표현을 이용하여 rank 5 string C-group 표현을 명시적으로 구성하였다. 또한 $3 \\le q \\le 11$인 모든 소수 거듭제곱에 대해 $G_2(q)$의 rank 4 이상 string C-group 표현의 목록을 제공하며, rank 5 표현이 희귀하고 이 구성이 예외적임을 계산적으로 보여준다.", "technique": "7차원 자연 행렬 표현을 활용한 rank 5 string C-group 표현의 명시적 구성 및 소규모 $q$에 대한 전산 탐색(census).", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.24593v1", "title": "Polyhedral Methods for Cooperative Games: Small Lifts and Hard Faces", "authors": ["Hans Raj Tiwary", "Michel Grabisch"], "abstract": "We study the computational complexity of fundamental algorithmic problems -- membership testing, separation, valid-inequality testing, and linear optimization -- over polytopes and cones arising from cooperative games (also known as pseudo-Boolean functions). A central obstacle in the study of such problems is that a general cooperative game on $n$ players requires $2^n$ values, so the input size is $2^n$ for a game with $n$ players, making these computational tasks theoretically trivial. Restricting to $k$-additive games reduces the input size to $O(n^k)$, making such games a natural target for meaningful questions about the existence of efficient algorithms.   On the positive side, we give an explicit extended formulation of size $O(n^k)$ for the core of $k$-additive $k$-monotone games, allowing all four problems to be solved by a single polynomial-size linear program -- in particular, circumventing the ellipsoid method that is needed when building from earlier tractability results of Deng and Papadimitriou, or of Edmonds. For the cone of $k$-additive $(k{-}1)$-monotone games, we give a complete characterization of its extreme rays and derive the same $O(n^k)$ bound on extension complexity, yielding a geometry-based proof and generalization of a result of Billionnet and Minoux.   On the negative side, we show that for $l \\leq k-2$ the cone of $k$-additive $l$-monotone games is computationally intractable: membership testing is not in NP (unless NP\\,=\\,coNP), valid-inequality testing is NP-complete, and extension complexity is at least $1.5^n$. Our hardness results yield, as a special case, a result of Crama and of Gallo and Simone. Furthermore, our hardness results also explain the lack of any good characterization of the extreme rays of the cone of $k$-additive $(k{-}2)$-monotone games.", "categories": ["cs.GT", "cs.CC", "math.CO", "math.OC"], "primary_category": "cs.GT", "published": "2026-09-21T13:51:51+00:00", "updated": "2026-09-21T13:51:51+00:00", "abs_url": "http://arxiv.org/abs/2609.24593v1", "pdf_url": "https://arxiv.org/pdf/2609.24593v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 협력 게임(cooperative games)의 다면체 복잡도를 다루며, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 협력 게임(pseudo-Boolean 함수)에서 발생하는 다면체·원뿔 위에서의 멤버십 테스트, 분리, 유효 부등식 테스트, 선형 최적화의 계산 복잡도를 연구한다. 긍정적 결과로 $k$-가산(additive) $k$-단조(monotone) 게임의 core에 대해 크기 $O(n^k)$의 명시적 확장 공식(extended formulation)을 제공하고, 부정적 결과로 $l \\leq k-2$인 경우 $k$-가산 $l$-단조 게임의 원뿔은 계산상 난해(확장 복잡도 $1.5^n$ 이상)임을 증명한다.", "technique": "협력 게임의 core 및 cone에 대해 크기 $O(n^k)$의 확장 공식을 명시적으로 구성하고, 극단 ray(extreme ray)의 완전한 특성화와 NP-hardness 환원(reduction)을 통해 양방향 결과를 도출한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.27635v1", "title": "Geometric ideal triangulations of hyperbolic 3-manifolds", "authors": ["Huabin Ge"], "abstract": "We resolve the longstanding geometric ideal triangulation conjecture arising from Thurston's theory of hyperbolic 3-manifolds: every finite-volume cusped hyperbolic 3-manifold admits a finite geometric ideal triangulation realizing its complete hyperbolic structure.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-09-23T10:00:09+00:00", "updated": "2026-09-23T10:00:09+00:00", "abs_url": "http://arxiv.org/abs/2609.27635v1", "pdf_url": "https://arxiv.org/pdf/2609.27635v1", "journal_ref": "", "doi": "", "comment": "20 pages, 3 figures. Comments are welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 쌍곡 3-다양체의 기하학적 이상 삼각분할 추측을 해결한 것으로, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 전혀 무관하다.", "summary": "이 논문은 Thurston의 쌍곡 3-다양체 이론에서 오랫동안 미해결이었던 기하학적 이상 삼각분할 추측을 해결한다. 구체적으로, 유한 부피를 가지는 모든 cusped 쌍곡 3-다양체가 완전 쌍곡 구조를 실현하는 유한 기하학적 이상 삼각분할을 가짐을 증명한다.", "technique": "", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.25711v1", "title": "A Refined Sum-Product Estimate via Higher Energies", "authors": ["Kaiqiang Zhang", "Yuyu Wang", "Yuanguo Zeng"], "abstract": "Let $A\\subset\\mathbb{R}$ be a finite set. Combining the multiplicative slope estimate of Rudnev--Stevens, Cushman's higher-energy regularization, Shakan's $d^+$--$d^\\times$ decomposition, and Solymosi's classical sum--product estimate, we prove \\[ |AA|^{204}|A+A|^{301}\\gtrsim |A|^{675}, \\] where $\\gtrsim$ suppresses a fixed polylogarithmic factor in $|A|$. Consequently, for every $\\varepsilon>0$, \\[ \\max\\{|A+A|,|AA|\\}\\gg_\\varepsilon |A|^{135/101-\\varepsilon}. \\] The proof is organized around two intermediate estimates. For every nonempty finite set $B\\subset\\mathbb{R}_{>0}$, \\[ d^\\times(B)|BB|^{12}|B+B|^{16}\\gtrsim |B|^{38}, \\] whereas for every nonempty finite set $U\\subset\\mathbb{R}$, \\[ d^+(U)^{17}|U+U|^{29}\\gtrsim |U|^{46}. \\]", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T05:32:35+00:00", "updated": "2026-09-22T05:32:35+00:00", "abs_url": "http://arxiv.org/abs/2609.25711v1", "pdf_url": "https://arxiv.org/pdf/2609.25711v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Sum-product estimates in additive combinatorics은 McMullen's problem(볼록다각형의 조합론적 구조)과 무관한 순수 실수 대수 문제.", "summary": "유한 실수 집합 $A$에 대해 Rudnev-Stevens의 multiplicative slope estimate, Cushman의 higher-energy 정규화, Shakan의 $d^+$-$d^\\times$ 분해, Solymosi의 고전적 sum-product estimate를 결합하여 $|AA|^{204}|A+A|^{301}\\gtrsim |A|^{675}$를 증명한다. 이를 통해 모든 $\\varepsilon>0$에 대해 $\\max\\{|A+A|,|AA|\\}\\gg_\\varepsilon |A|^{135/101-\\varepsilon}$을 도출한다.", "technique": "Higher-energy regularization과 multiplicative/additive decomposition 기법의 결합을 통한 sum-product bound 개선.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.30257v1", "title": "A quasisymmetric analog of Grassmannian Schubert varieties", "authors": ["Teddy Gonzales", "Tuong Le", "Chayim Lowen"], "abstract": "We show that the cohomology rings of toric Richardson varieties in the Grassmannian are finite truncations of the ring of quasisymmetric functions. We exhibit an affine paving of each such variety whose cell closures give rise to the basis of fundamental quasisymmetric functions. We similarly interpret the homology of these varieties in terms of the ring of noncommutative symmetric functions and show that the expansion of the homological class of any torus-invariant subvariety into the affine paving basis agrees with the expansion of a corresponding generalized noncommutative ribbon function into the ribbon basis. By taking the direct limit of all toric Richardson varieties, we obtain an ind-variety equipped with a weak $H$-group structure whose cohomology is the Hopf algebra of quasisymmetric functions. We conjecture that it is isomorphic to a similar $H$-group constructed by Baker--Richter.   As a byproduct, we deduce that the $f$-vectors of shard polytopes are log-concave, making the first progress on a question of Ferroni--Schröter for matroid base polytopes.", "categories": ["math.CO", "math.AG", "math.AT"], "primary_category": "math.CO", "published": "2026-09-24T17:59:15+00:00", "updated": "2026-09-24T17:59:15+00:00", "abs_url": "http://arxiv.org/abs/2609.30257v1", "pdf_url": "https://arxiv.org/pdf/2609.30257v1", "journal_ref": "", "doi": "", "comment": "48 pages, 16 figures, comments are welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 toric Richardson variety의 코호몰로지와 준대칭 함수(quasisymmetric functions)의 관계를 다루며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "Grassmannian 내의 toric Richardson variety의 코호몰로지 환이 준대칭 함수환(ring of quasisymmetric functions)의 유한 절단(finite truncation)임을 증명하고, 각 variety의 affine paving을 구성하여 fundamental quasisymmetric functions의 기저를 구현한다. 모든 toric Richardson variety의 direct limit을 취해 준대칭 함수의 Hopf 대수를 코호몰로지로 갖는 ind-variety를 얻으며, Baker–Richter의 $H$-group과의 동형을 추측한다. 부산물로 shard polytope의 $f$-벡터가 로그-오목(log-concave)임을 증명하여 Ferroni–Schröter의 질문에 최초의 진전을 이룬다.", "technique": "Toric Richardson variety의 affine paving 구성과 코호몰로지·동조론을 준대칭/비가환 대칭 함수환과 연결하는 대수기하학적 방법을 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.29927v1", "title": "Chromatic word-quasisymmetric functions of matroids", "authors": ["Raul Penaguiao", "Sophie Rehberg"], "abstract": "Billera, Jia, and Reiner (2009) introduced the quasisymmetric functions of matroids and showed that this defines a Hopf algebra homomorphism which is a valuative invariant, i.e., isomorphic matroids have the same quasisymmetric function and polytopal subdivisions of matroid base polytopes define relations among the corresponding quasisymmetric functions. In this project we study an analogue in non-commuting variables, the word-quasisymmetric functions. To every matroid $M$ we associate a word-quasisymmetric function $ψ(M)$ and call this the chromatic word-quasisymmetric functions of a matroid.   Matroids and word-quasisymmetric functions form Hopf algebras, and our map $ψ$ between them is a homomorphism. We want to study the kernel, equivalently the image, of the map $ψ$ from matroids to word-quasisymmetric functions, that is, we would like to understand which matroids are indistinguishable by the chromatic word-quasisymmetric functions. The map $ψ$ is not an invariant, but we can show that it is valuative. Using Schubert matroids and nested matroids, special classes of matroids, we prove a lower bound of $2^d-d$ for the rank of the map $ψ$ from matroids to the chromatic word-quasisymmetric functions in degree $d$ and conjecture the upper bound of $d!$ is tight.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-24T14:58:33+00:00", "updated": "2026-09-24T14:58:33+00:00", "abs_url": "http://arxiv.org/abs/2609.29927v1", "pdf_url": "https://arxiv.org/pdf/2609.29927v1", "journal_ref": "", "doi": "", "comment": "53 pages, 10 figures, comments welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 매트로이드의 chromatic word-quasisymmetric 함수와 Hopf 대수 동형사상을 연구하며, McMullen 문제나 Larman 추측과 직접적 관련이 없다.", "summary": "Billera–Jia–Reiner(2009)의 매트로이드 준대칭 함수를 비가환 변수로 확장한 word-quasisymmetric 함수 $\\psi(M)$를 정의하고, 이 사상이 Hopf 대수 준동형사상이며 valuative임을 보인다. Schubert 매트로이드와 nested 매트로이드를 활용하여 차수 $d$에서 $\\psi$의 랭크에 대한 하한 $2^d - d$를 증명하고, 상한 $d!$이 정확하다는 추측을 제시한다.", "technique": "Schubert 매트로이드와 nested 매트로이드를 이용한 랭크 하한 증명 및 매트로이드 기저 폴리토프의 다면체 세분(polytopal subdivision)을 통한 valuative 성질 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.29299v1", "title": "Adjoint Reidemeister torsion from hyperbolic gluing equations", "authors": ["Shuang Ming", "Baojun Wu"], "abstract": "Motivated by the study of asymptotics of quantum invariants, Dimofte and Garoufalidis introduced a power series associated to a suitable ideal triangulation of a cusped hyperbolic $3$-manifold. They proved that its constant term can be written in terms of Neumann-Zagier data and the complex shape parameters of ideal tetrahedra, and conjectured that it equals the adjoint twisted Reidemeister torsion. On the other hand, in the study of asymptotics of Turaev-Viro type invariants of cusped $ 3$-manifolds, the authors, together with Liu, Sun and Yang, found that the one-loop terms of their asymptotic expansions could be written in terms of Gram matrices and decorated edge lengths of ideal tetrahedra. In this paper, we prove the conjecture of Dimofte and Garoufalidis and relate the one-loop term appearing in the Turaev-Viro type invariant to the adjoint twisted Reidemeister torsion.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-09-24T09:34:03+00:00", "updated": "2026-09-24T09:34:03+00:00", "abs_url": "http://arxiv.org/abs/2609.29299v1", "pdf_url": "https://arxiv.org/pdf/2609.29299v1", "journal_ref": "", "doi": "", "comment": "32 pages,3 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 쌍곡 3-다양체의 양자 불변량 점근론과 Reidemeister torsion에 관한 위상수학 연구로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "Dimofte–Garoufalidis가 제기한 추측, 즉 이상적 삼각분할(ideal triangulation)을 갖는 cusped 쌍곡 3-다양체에 연관된 멱급수의 상수항이 adjoint twisted Reidemeister torsion과 같다는 명제를 증명한다. 또한 Turaev–Viro형 불변량의 점근 전개에서 나타나는 one-loop 항을 adjoint twisted Reidemeister torsion과 연관짓는다.", "technique": "Neumann–Zagier 데이터, 이상적 사면체의 복소 형태 매개변수(complex shape parameters), Gram 행렬 및 장식된 모서리 길이(decorated edge lengths)를 활용하여 쌍곡 접합 방정식(hyperbolic gluing equations)으로부터 torsion을 도출한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.28808v1", "title": "Cyclic Latin Eulerian Numbers", "authors": ["Madjid Mirzavaziri", "Daniel Yaqubi"], "abstract": "We introduce the directed cyclic difference inventory $D_n(\\mathbf{m})$ to study Latin Eulerian numbers restricted to row-reorderings of the cyclic Latin square, offering an orientation-sensitive refinement of the prescribed-edge-length Hamiltonian path problem. We establish exact enumeration formulas, symmetries, and realizability obstructions for this inventory. Furthermore, we reduce the cyclic total-ascent statistic directly to endpoint-refined Eulerian statistics via the identity $Σ(L_π) = n \\operatorname{asc}(π) + π(1) - π(n)$, yielding a closed-form expression for the cyclic Latin-Eulerian polynomial.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-23T21:41:44+00:00", "updated": "2026-09-23T21:41:44+00:00", "abs_url": "http://arxiv.org/abs/2609.28808v1", "pdf_url": "https://arxiv.org/pdf/2609.28808v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 순환 라틴 방진(cyclic Latin square)과 오일러 수(Eulerian numbers)에 관한 조합론 연구로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 순환 라틴 방진의 행 재배열(row-reordering)에 제한된 라틴 오일러 수(Latin Eulerian numbers)를 연구하기 위해 유향 순환 차분 인벤토리(directed cyclic difference inventory) $D_n(\\mathbf{m})$를 도입한다. 이 인벤토리에 대한 정확한 열거 공식, 대칭성, 실현 가능성 장애물(realizability obstructions)을 확립한다. 또한 항등식 $\\Sigma(L_\\pi) = n\\operatorname{asc}(\\pi) + \\pi(1) - \\pi(n)$을 통해 순환 총 상승 통계량(cyclic total-ascent statistic)을 끝점 정제된 오일러 통계량으로 환원하여 순환 라틴-오일러 다항식의 닫힌 형식 표현을 도출한다.", "technique": "유향 순환 차분 인벤토리 도입 및 순환 상승 통계량을 오일러 통계량으로 직접 환원하는 항등식 활용.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.28507v1", "title": "A proof of the Athanasiadis-Chapoton ordinal-sum conjecture", "authors": ["Congyi Luo"], "abstract": "Given a finite preorder $τ$, we study how its order relation determines the $h^*$-polynomial of the associated polar preorder polytope. Let $\\mathcal R_τ^{\\vee}$ be the convex hull of the negative standard basis vectors and the indicator vectors of nonempty order ideals, and write $h_τ^*(t)=h^*(\\mathcal R_τ^{\\vee},t)$. Athanasiadis and Chapoton conjectured that this enumerative invariant takes ordinal sums to products: $$h_{τ_1\\oplusτ_2}^*(t)=h_{τ_1}^*(t)\\,h_{τ_2}^*(t).$$ We prove the conjecture for arbitrary finite preorders, including those with nontrivial equivalence classes. More precisely, we construct a positively homogeneous piecewise unimodular shear from the free sum $\\mathcal R_{τ_1}^{\\vee}\\oplus\\mathcal R_{τ_2}^{\\vee}$ onto $\\mathcal R_{τ_1\\oplusτ_2}^{\\vee}$, giving lattice-point bijections at every nonnegative real dilation scale. The key is a formula for the Minkowski functional in terms of the least nonnegative order-reversing majorant: after the shear, the functional becomes the sum of the two factor functionals. Together with the Ehrhart product formula for free sums, this proves the conjecture and the corresponding product formula for normalized volume.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-19T18:34:08+00:00", "updated": "2026-09-19T18:34:08+00:00", "abs_url": "http://arxiv.org/abs/2609.28507v1", "pdf_url": "https://arxiv.org/pdf/2609.28507v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 preorder polytope의 $h^*$-다항식에 관한 Athanasiadis-Chapoton 추측을 증명하는 조합론·Ehrhart 이론 논문으로, McMullen 문제(d=5, 일반위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "유한 preorder $\\tau$에 대해 정의되는 polar preorder polytope $\\mathcal{R}_\\tau^\\vee$의 $h^*$-다항식이 ordinal sum을 곱으로 보낸다는 Athanasiadis-Chapoton 추측, 즉 $h^*_{\\tau_1 \\oplus \\tau_2}(t) = h^*_{\\tau_1}(t)\\,h^*_{\\tau_2}(t)$를 임의의 유한 preorder(비자명 동치류 포함)에 대해 증명한다. 핵심 구성은 free sum $\\mathcal{R}_{\\tau_1}^\\vee \\oplus \\mathcal{R}_{\\tau_2}^\\vee$에서 $\\mathcal{R}_{\\tau_1 \\oplus \\tau_2}^\\vee$로의 양의 동차 조각별 유니모듈러 shear로, 모든 음이 아닌 실수 팽창 스케일에서 격자점 전단사를 제공한다. 이로부터 추측 및 정규화 부피에 대한 곱 공식이 도출된다.", "technique": "Minkowski functional을 최소 음이 아닌 order-reversing majorant로 표현한 후, 양의 동차 조각별 유니모듈러 shear를 구성하여 두 인자의 functional의 합이 되도록 만들고 free sum에 대한 Ehrhart 곱 공식을 적용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.23291v1", "title": "The Partial List Colouring Conjecture is False", "authors": ["Jonathan A. Noel"], "abstract": "We exhibit a graph $G$ with $14$ vertices and list chromatic number equal to $3$ such that there is a $2$-list assignment $L$ of $G$ such that at most $9$ vertices of $G$ can be properly coloured from $L$. This disproves the Partial List Colouring Conjecture of Albertson, Grossman and Haas. This counterexample was discovered and fully verified by ChatGPT 6 Astra Ultra after some persistent prompting, but almost no mathematical input, from the author.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-20T01:58:08+00:00", "updated": "2026-09-20T01:58:08+00:00", "abs_url": "http://arxiv.org/abs/2609.23291v1", "pdf_url": "https://arxiv.org/pdf/2609.23291v1", "journal_ref": "", "doi": "", "comment": "4 pages, 1 figure", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 리스트 색칠(list colouring) 문제로, 이산 기하학·조합론의 특정 분야인 McMullen's problem (oriented matroid, convex position, point configuration)과 직접적 관련이 없음.", "summary": "본 논문은 Partial List Colouring Conjecture를 반박하는 14개 정점의 그래프를 구성하였다. 이 그래프의 리스트 색칠 수(list chromatic number)는 3이지만, 특정 2-리스트 할당에서 최대 9개 정점만 올바르게 색칠 가능함을 보여준다.", "technique": "구체적 반례 구성; 초록에 명시된 수학적 기법이 없으며 ChatGPT를 통한 발견이 기술됨.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.28088v1", "title": "Berry--Esseen Bounds for Faces in Unimodular Triangulations of Random Polytopes", "authors": ["Zhonggen Su", "Huilian Zheng"], "abstract": "Consider the number of faces arising from unimodular triangulations of random polytopes associated with Erdős--Rényi graphs. Focusing on two-dimensional faces of regular unimodular triangulations of random symmetric edge polytopes, we derive precise asymptotic expansions for the expectation and variance and then establish a quantitative central limit theorem with an explicit Berry--Esseen bound. The proof combines an algebraically derived characterization of faces in terms of local graph configurations with a detailed combinatorial--geometric study of the relevant configurations. The normal approximation is established using the discrete Malliavin--Stein method. We also determine the asymptotic orders of the expectation and variance and establish a quantitative central limit theorem for the number of faces in each fixed higher dimension. These results identify a common local mechanism underlying the fluctuations of face numbers and extend the distributional theory of random symmetric edge polytopes [Donzelmann et al., arXiv:2603.10650] beyond edge statistics.", "categories": ["math.PR", "math.CO"], "primary_category": "math.PR", "published": "2026-10-20T12:07:38+00:00", "updated": "2026-10-20T12:07:38+00:00", "abs_url": "http://arxiv.org/abs/2610.28088v1", "pdf_url": "https://arxiv.org/pdf/2610.28088v1", "journal_ref": "", "doi": "", "comment": "48 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 랜덤 볼록다면체의 단일모듈 삼각분할(unimodular triangulation) 면 개수의 중심극한정리를 다루며, McMullen 문제나 Larman 추측과 직접적 관련이 없다.", "summary": "Erdős–Rényi 그래프에 연관된 랜덤 볼록다면체의 단일모듈 삼각분할에서 발생하는 면(face) 개수를 분석한다. 랜덤 대칭 에지 폴리토프의 정칙 단일모듈 삼각분할에서 2차원 면 개수에 대한 기댓값·분산의 점근 전개와 명시적 Berry–Esseen 경계를 갖는 정량적 중심극한정리를 확립한다. 또한 고정된 임의 높은 차원에서의 면 개수에 대해서도 점근적 차수와 정량적 중심극한정리를 도출한다.", "technique": "국소 그래프 구성(local graph configurations)에 의한 면의 대수적 특성화와 이산 Malliavin–Stein 방법을 결합하여 정규 근사를 확립한다.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2610.29737v1", "title": "Spanning bipartite quadrangulations in even triangulations of real projective spaces", "authors": ["Kengo Enami"], "abstract": "We study spanning quadrangulations of even triangulations of real projective spaces, using the higher-dimensional notion of quadrangulation introduced by Kaiser and Stehlík. We prove that every even triangulation of $\\RP^d$, where $d\\ge 2$, admits a spanning bipartite quadrangulation. Moreover, such a triangulation admits a spanning non-bipartite quadrangulation if and only if it is not balanced; if it is balanced, every spanning quadrangulation is bipartite. Our proofs use coloring monodromy: its orbits yield bipartite quadrangulations, while a covering-space construction gives non-bipartite ones. %In dimension three, a bipartite quadrangulation can always be chosen to induce $K_{2,2}$ on each tetrahedron. More generally, we establish a sufficient condition for the existence of spanning bipartite quadrangulations on closed manifolds in terms of the monodromy action, and derive a consequence involving the fundamental group.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-10-21T13:37:57+00:00", "updated": "2026-10-21T13:37:57+00:00", "abs_url": "http://arxiv.org/abs/2610.29737v1", "pdf_url": "https://arxiv.org/pdf/2610.29737v1", "journal_ref": "", "doi": "", "comment": "13 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 실사영공간의 삼각분할에서 spanning quadrangulation의 존재성을 다루는 위상조합론 연구로, McMullen 문제(볼록 위치·일반 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "이 논문은 실사영공간 $\\mathbb{RP}^d$($d\\ge 2$)의 짝수 삼각분할(even triangulation)에 대해 spanning bipartite quadrangulation의 존재성을 증명한다. 또한 spanning non-bipartite quadrangulation은 삼각분할이 balanced가 아닐 때에만 존재하며, balanced인 경우 모든 spanning quadrangulation은 bipartite임을 보인다. 증명 도구로 coloring monodromy와 covering space 구성을 활용하며, 닫힌 다양체에서의 spanning bipartite quadrangulation 존재에 관한 충분조건도 기본군과 연관하여 제시한다.", "technique": "Coloring monodromy의 orbit을 이용한 bipartite quadrangulation 구성과 covering space 구성을 통한 non-bipartite quadrangulation 존재 증명.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.28446v1", "title": "Geometric chains of orbifolds with corners and singular homology", "authors": ["Hao Yu"], "abstract": "We study a geometric homology theory (GHT for short). Its chains are generated by smooth maps from compact oriented orbifolds with corners to a smooth space, and two kinds of chains are set to zero: those admitting an orientation reversing automorphism, and degenerate ones, which, together with their boundaries, factor through smooth maps to orbifolds of lower dimension. Bisecting the source of a geometric chain along a hypersurface transverse to its corners changes the chain only by the boundary of an explicit prism and by prisms over its faces; cutting a geometric cycle along a regular level set of a smooth function on the target does not change its homology class. Geometric chains also behave well under products and pullbacks along fibre bundles, which overcomes some of the combinatorial rigidity of singular chains. We prove that geometric homology is naturally isomorphic to singular homology with rational coefficients for every smooth space admitting a good cover, such as smooth manifolds, orbifolds and locally finite polyhedra, and also for orbifolds with corners. The proof uses cutting operators along level sets of functions on the target, realized by explicit prisms, instead of triangulations. For continuous maps into arbitrary spaces we conjecture the same statement, and prove it for Euclidean neighbourhood retracts in degrees at most one, with surjectivity in degree two. Without the relation killing degenerate chains the comparison fails for orbifold chains: the weighted projective plane $\\mathbb{P}(1,1,p)$, $p\\ge5$ prime, mapped to a point is a cycle that does not bound. Applications on Morse theory and the BV structure on geometric chains of moduli spaces of bordered Riemann surfaces, following Costello and Harrelson--Voronov--Zúñiga, are given.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-10-20T16:06:57+00:00", "updated": "2026-10-20T16:06:57+00:00", "abs_url": "http://arxiv.org/abs/2610.28446v1", "pdf_url": "https://arxiv.org/pdf/2610.28446v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 orbifold 및 singular homology 이론에 관한 것으로, McMullen's problem이나 oriented matroid, 볼록 위치 점 배치와 전혀 관련이 없다.", "summary": "이 논문은 compact oriented orbifolds with corners에서 smooth space로의 smooth map으로 생성되는 기하학적 호몰로지 이론(GHT)을 연구한다. GHT가 good cover를 허용하는 모든 smooth space(매끄러운 다양체, orbifold, locally finite polyhedra 등)에 대해 유리수 계수 singular homology와 자연스럽게 동형임을 증명하며, 삼각분할 대신 target의 함수 level set을 따른 cutting operator를 활용한다. 또한 Morse 이론 및 bordered Riemann surface의 moduli space에서의 BV 구조 응용을 제시한다.", "technique": "삼각분할 대신 target 위 함수의 level set을 따른 cutting operator(explicit prism으로 실현)를 사용하여 GHT와 singular homology의 동형을 증명한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.27819v1", "title": "Ehrhart positivity of smooth polytopes with few facets", "authors": ["Feihu Liu", "Jinlong Tang", "Sihao Tao", "Zihao Zhang"], "abstract": "For each dimension $d$, we determine the minimum number of facets of a smooth $d$-dimensional lattice polytope whose Ehrhart polynomial has at least one negative coefficient. This minimum is six in dimension $d=3$, seven in dimension $d=4$, and $d+2$ in every dimension $d\\ge 5$. The lower bounds follow from the classification of smooth lattice polytopes with at most $d+2$ facets, together with explicit formulas for Ehrhart polynomials in dimensions at most $4$. We also prove that a lattice polytope of dimension at least $3$ with a smooth vertex cannot be $2$-integral with respect to any ordered lattice basis.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-20T08:10:47+00:00", "updated": "2026-10-20T08:10:47+00:00", "abs_url": "http://arxiv.org/abs/2610.27819v1", "pdf_url": "https://arxiv.org/pdf/2610.27819v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 smooth lattice polytope의 Ehrhart 다항식 계수 부호에 관한 것으로, McMullen 문제(볼록 위치 점 배치, oriented matroid 재방향 등)와 직접적 관련이 없다.", "summary": "각 차원 $d$에 대해, Ehrhart 다항식에 음의 계수를 갖는 smooth $d$차원 격자 다면체(lattice polytope)의 최소 면(facet) 수를 결정한다. 최솟값은 $d=3$일 때 6, $d=4$일 때 7, $d \\ge 5$일 때 $d+2$임을 증명한다. 하한은 최대 $d+2$개의 면을 가진 smooth 격자 다면체의 분류와 차원 4 이하에서의 Ehrhart 다항식 명시적 공식으로부터 도출된다.", "technique": "최대 $d+2$개의 면을 가진 smooth 격자 다면체의 분류와 낮은 차원에서의 Ehrhart 다항식 명시적 공식을 결합하여 하한을 증명한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.27283v1", "title": "PL standardness of the four-pentachoron census sphere Q", "authors": ["Vance Faber", "Michael Murphy"], "abstract": "We prove that the four-pentachoron homotopy \\(4\\)-sphere \\(Q\\) singled out in the census of Burke, Burton and Spreer is PL homeomorphic to the standard \\(4\\)-sphere. The key construction identifies the compact exterior of an explicit locally flat \\(2\\)-sphere in an auxiliary 39-vertex model of \\(Q\\) with the exterior of Budney, Burton and Hillman, then certifies its fibration by a normal cut followed by a relative collapse. The exterior identification uses finite checked moves, an exact regular-neighbourhood construction and a PL lemma controlling the passage through an ideal triangulation. Cutting the compact exterior along the specified normal hypersurface gives a manifold that collapses onto one boundary copy of the punctured \\(3\\)-torus in 209,144 elementary pairs; a marked product lemma identifies the cut as a product. The resulting integral monodromy realizes \\(Q\\) as a Cappell--Shaneson filling whose two surgery framings are standard by Gompf's results. The fibration certificate is independent of Issa's earlier PL-compatible constructions. Combined with the published census, the result establishes standardness for every homotopy \\(4\\)-sphere triangulated with at most four pentachora.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-19T20:57:33+00:00", "updated": "2026-10-19T20:57:33+00:00", "abs_url": "http://arxiv.org/abs/2610.27283v1", "pdf_url": "https://arxiv.org/pdf/2610.27283v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 4차원 구(homotopy 4-sphere)의 PL 표준성을 다루는 위상수학 논문으로, McMullen 문제나 Larman 추측(볼록/일반 위치 점 배치, oriented matroid)과 직접적 관련이 없다.", "summary": "이 논문은 Burke, Burton, Spreer의 census에서 분류된 four-pentachoron homotopy 4-구 $Q$가 표준 $4$-구와 PL 위상동형임을 증명한다. 핵심 구성은 $Q$의 39-꼭짓점 모델에서 국소 평탄 $2$-구의 외부를 Budney–Burton–Hillman의 외부와 동일시하고, normal cut과 relative collapse를 통해 fibration을 인증하는 것이다. 결과적으로 $Q$는 Cappell–Shaneson filling으로 실현되고 Gompf의 결과에 의해 두 surgery framing이 표준임이 확인되며, 이로써 최대 네 개의 pentachora로 삼각분할된 모든 homotopy 4-구의 표준성이 확립된다.", "technique": "39-꼭짓점 모델에서의 exact regular-neighbourhood 구성, ideal triangulation을 통한 PL lemma, normal hypersurface를 따른 절단 후 209,144 elementary pair collapse, 그리고 marked product lemma를 이용한 fibration 인증.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.26744v1", "title": "Finite convexification by Minkowski summation", "authors": ["Mark Meyer"], "abstract": "Let $A\\subset\\mathbb{R}^n$ be a nonempty compact set and let $K\\subset\\mathbb{R}^n$ be a nonempty compact convex set. We study the problem of when there exists $λ>0$ such that the Minkowski sum $A+λK$ is convex. First, we show that this finite convexification is equivalent to a uniform covering condition on the exposed sets of $A$ and $K$. We then show that another characterization is possible in terms of the covering radii of the iterated exposed sets after translating each exposed face of $K$ so that its relative centroid is $0$. In the case of convex polytopes, we show that it suffices to check the exposed sets in the first level of the iteration. We also study several special cases, such as strictly convex convexifiers, lower-dimensional convexifiers, strongly isomorphic polytopes, and the planar case.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-19T17:08:30+00:00", "updated": "2026-10-19T17:08:30+00:00", "abs_url": "http://arxiv.org/abs/2610.26744v1", "pdf_url": "https://arxiv.org/pdf/2610.26744v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Minkowski 합에 의한 볼록화(convexification) 조건을 연구하는 것으로, McMullen 문제나 Larman 추측, oriented matroid와 직접적인 관련이 없다.", "summary": "컴팩트 집합 $A\\subset\\mathbb{R}^n$과 컴팩트 볼록 집합 $K\\subset\\mathbb{R}^n$에 대해, 어떤 $\\lambda>0$이 존재하여 Minkowski 합 $A+\\lambda K$가 볼록이 되는 조건을 분석한다. 이 유한 볼록화(finite convexification)가 $A$와 $K$의 노출 집합(exposed sets)에 관한 균등 피복 조건(uniform covering condition)과 동치임을 보이고, 반복된 노출 집합의 피복 반경(covering radii)으로도 특성화할 수 있음을 증명한다. 볼록 다면체의 경우, 반복의 첫 번째 단계에서 노출 집합만 확인하면 충분함을 보이며, 순볼록 볼록화기(strictly convex convexifier), 저차원 볼록화기, 강동형 다면체(strongly isomorphic polytopes), 평면 경우 등 여러 특수 상황도 다룬다.", "technique": "노출 집합(exposed sets)에 대한 균등 피복 조건 및 반복적 노출 집합의 피복 반경 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.26523v1", "title": "Counting Lattice Points in Translations: Uniqueness and Existence Results", "authors": ["Ansgar Freyer", "Georg C. Hofstätter"], "abstract": "Generalizing a recent theorem by Higashitani et al. (Comb. Theory 2025), it is shown that a convex body $K$ is uniquely described up to integer translation by the function $\\mathrm{t}_K(v) = |(K-v)\\cap\\mathbb{Z}^n|$, $v\\in\\mathbb{R}^n$. For a lattice polytope $P$ the function $\\mathrm{t}_P$ is decomposed into homogeneous components $\\mathrm{t}_{P,i}$, similar to the Ehrhart polynomial. It is shown that the functions $\\mathrm{t}_{P,i}$ are simultaneous eigenfunctions of a family of linear operators introduced by Kubert and Lang in (Math. Z. 1976) and that, conversely, the linear spaces of piecewise constant eigenfunctions are generated by the respective coefficients $\\mathrm{t}_{P,i}$. A structure theorem for the simultaneous eigenspace corresponding to the $(n-1)$st coefficient in the decomposition of $\\mathrm{t}_P$ is obtained. This leads to an explicit description of the set of functions $\\mathrm{t}_P$, where $P$ ranges over all lattice polygons, as well as to inequalities for the number of lattice points in dilated and translated lattice polytopes.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-10-19T14:53:29+00:00", "updated": "2026-10-19T14:53:29+00:00", "abs_url": "http://arxiv.org/abs/2610.26523v1", "pdf_url": "https://arxiv.org/pdf/2610.26523v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록체의 격자점 계수 함수(lattice point counting)와 Ehrhart 이론에 관한 것으로, McMullen 문제(d=5, oriented matroid, convex/general position 점 배치)와 직접적 관련이 없다.", "summary": "이 논문은 볼록체 $K$가 함수 $\\mathrm{t}_K(v) = |(K-v)\\cap\\mathbb{Z}^n|$에 의해 정수 평행이동까지 유일하게 결정됨을 보이고, 격자 다면체 $P$에 대해 $\\mathrm{t}_P$를 Ehrhart 다항식과 유사한 동차 성분 $\\mathrm{t}_{P,i}$로 분해한다. 이 성분들이 Kubert-Lang 연산자 족의 동시 고유함수임을 증명하고, 역으로 각 선형 공간이 해당 계수들로 생성됨을 보인다. 이를 통해 격자 다각형에 대한 $\\mathrm{t}_P$ 함수들의 집합을 명시적으로 기술하고, 팽창·이동된 격자 다면체의 격자점 수에 대한 부등식을 도출한다.", "technique": "Ehrhart 이론의 유사체로서 $\\mathrm{t}_P$를 동차 성분으로 분해하고, Kubert-Lang 선형 연산자의 동시 고유공간 구조 정리를 활용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.26125v1", "title": "Unimodular defect and antipodal lattice points of smooth reflexive polytopes", "authors": ["Binnan Tu"], "abstract": "Let $P$ be a smooth reflexive polytope and let $Q=P^{*}$ be the dual of smooth Fano polytope. Ewald's conjecture (1988) predicts that the lattice points of $P\\cap (-P)$ contain a lattice basis. In general it is not even known whether $P\\cap (-P)$ contains a nonzero lattice point; we call this weakest form of the conjecture the antipodal condition. We define the unimodular defect of a finite set of lattice vectors as the least number of vectors that must be removed to leave a unimodular set, and the unimodular defect of $Q$ as that of its vertex set. Defect zero gives the unimodular smooth Fano polytopes, for which Ewald's conjecture is known. Our main result is that every smooth Fano polytope of unimodular defect at most two has a \\emph{flat ridge}, a ridge $W$ with $|\\det(v,W)|\\leq 1$ for all vertices $v$; consequently its dual satisfies the antipodal condition. We also consider removed sets of pairwise non-adjacent vertices. Using results of Nill on independent vertices, we show that every such set has at most two elements unless $Q$ is unimodular, so the antipodal condition holds whenever such a set exists.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-19T10:15:19+00:00", "updated": "2026-10-19T10:15:19+00:00", "abs_url": "http://arxiv.org/abs/2610.26125v1", "pdf_url": "https://arxiv.org/pdf/2610.26125v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 smooth reflexive polytope의 Ewald 추측 및 격자점 조건을 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 smooth reflexive polytope $P$와 그 쌍대 smooth Fano polytope $Q=P^*$에 대해 Ewald 추측(1988)을 부분적으로 검증한다. unimodular defect(꼭짓점 집합에서 unimodular 집합을 얻기 위해 제거해야 하는 최소 벡터 수)가 최대 2인 모든 smooth Fano polytope은 'flat ridge'를 가지며, 따라서 쌍대 $P$가 antipodal 조건($P\\cap(-P)$에 비영 격자점 존재)을 만족함을 증명한다. 또한 pairwise non-adjacent 꼭짓점들로 이루어진 제거 집합에 대해 Nill의 결과를 활용하여 antipodal 조건이 성립함을 보인다.", "technique": "unimodular defect 개념 도입, flat ridge 존재성 증명, Nill의 independent vertices 결과 적용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.26119v1", "title": "Local structure of sumsets and projections of self-affine carpets", "authors": ["Roope Anttila", "Jonathan M. Fraser"], "abstract": "We show that if $X$ and $Y$ are self-similar sets in $\\mathbb{R}$ with multiplicatively independent contraction ratios, then the Assouad dimension of $X+Y$ is one. As an application, we show that for a large class of self-affine carpets, the Assouad dimension of any non-principal orthogonal projection is one. The latter result is new even for the simplest case of Bedford-McMullen carpets.", "categories": ["math.DS", "math.MG"], "primary_category": "math.DS", "published": "2026-10-19T10:11:17+00:00", "updated": "2026-10-19T10:11:17+00:00", "abs_url": "http://arxiv.org/abs/2610.26119v1", "pdf_url": "https://arxiv.org/pdf/2610.26119v1", "journal_ref": "", "doi": "", "comment": "17 pages, 2 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 자기유사 집합의 합집합(sumset)과 자기아핀 카펫(self-affine carpet)의 정사영(projection)에 관한 Assouad 차원 이론을 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid)와 직접적 관련이 없다.", "summary": "이 논문은 $\\mathbb{R}$에서 곱셈적으로 독립적인 수축비를 가진 자기유사 집합 $X$와 $Y$의 합집합 $X+Y$의 Assouad 차원이 1임을 증명한다. 이를 응용하여, 대규모 자기아핀 카펫 계열에서 비주축 방향 정사영(non-principal orthogonal projection)의 Assouad 차원이 1임을 보인다. 후자의 결과는 Bedford-McMullen 카펫의 가장 단순한 경우에도 새로운 결과이다.", "technique": "곱셈 독립 수축비를 가진 자기유사 집합의 합집합 국소 구조(local structure) 분석을 통해 Assouad 차원을 결정한다.", "connections": "", "keyword_hits": ["mcmullen"], "source": "filter"}, {"id": "2610.25838v1", "title": "A New Proof of Wei's Theorem", "authors": ["Zhiqaing Wei", "Mengyan Xing", "Xingya Zhao"], "abstract": "In the paper \\emph{Structure and realizability for rational maps}, Wei proved the following. Let \\(k\\) nontrivial partitions of an integer \\(d\\ge 3\\) be given, satisfying the Riemann--Hurwitz formula for the case of maps between two spheres. If \\(k>\\ell+1\\), where \\[ \\ell=\\min_i|π_i| \\] is the shortest partition length, then there exists a rational map whose branch datum is given by these partitions. In this paper we give a new proof of Wei's theorem on realizing a tuple of partitions as the ramification data of a rational function. The proof is inductive on the shortest partition length. Two auxiliary results are established: a two-cut partition theorem and a gluing theorem for marked spherical coverings. These reduce any counterexample with shortest length \\(\\ell\\ge3\\) to auxiliary data with either fewer factors or smaller shortest length, while preserving the total defect and the marked conditions. The base case \\(\\ell\\le2\\) is quoted from the literature.", "categories": ["math.AT"], "primary_category": "math.AT", "published": "2026-10-19T05:50:14+00:00", "updated": "2026-10-19T05:50:14+00:00", "abs_url": "http://arxiv.org/abs/2610.25838v1", "pdf_url": "https://arxiv.org/pdf/2610.25838v1", "journal_ref": "", "doi": "", "comment": "10 pages. Comments are welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유리함수의 분기 데이터 실현(Hurwitz 존재 문제)에 관한 것으로, McMullen 문제나 oriented matroid와 전혀 무관하다.", "summary": "이 논문은 Wei의 정리—$k$개의 분할이 Riemann–Hurwitz 공식을 만족하고 $k > \\ell+1$ ($\\ell$은 최단 분할 길이)이면 해당 분기 데이터를 실현하는 유리함수가 존재한다—에 대한 새로운 증명을 제시한다. 증명은 최단 분할 길이 $\\ell$에 대한 귀납법으로 진행되며, two-cut 분할 정리와 구면 피복의 접합 정리(gluing theorem)를 보조 결과로 확립한다. 이 보조 결과들을 통해 $\\ell \\ge 3$인 반례를 인수의 수가 더 적거나 최단 길이가 더 작은 경우로 환원하며, 기저 경우 $\\ell \\le 2$는 기존 문헌을 인용한다.", "technique": "최단 분할 길이에 대한 귀납법, two-cut 분할 정리 및 표시된 구면 피복의 접합 정리를 이용한 반례 환원.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2610.25217v2", "title": "Non-geometric ideal triangulations with all edge valences at least six", "authors": ["Ke Feng", "Aijin Lin"], "abstract": "Costantino, Frigerio, Martelli and Petronio conjectured that an ideal triangulation in which every edge has valence at least six can be realized by hyperbolic partially truncated tetrahedra on the compact 3-manifold it defines. We show that this is false. Starting from the figure-eight knot complement, we construct an ideal triangulation with $2688$ tetrahedra and edge valences six and eighteen whose manifold is hyperbolic with totally geodesic boundary, but which admits no such realization. The obstruction is a critical point of the covolume energy of Luo and Yang at which three tetrahedra have collapsed: convexity then excludes every geometric competitor, an Euler characteristic count excludes edges of length zero, and the critical point itself is located by a finite certificate in exact integer arithmetic. The obstruction persists in every finite cover, while a complementary theorem shows that no counterexample can have only two edge lengths or only two orbits of edges.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-10-18T12:22:23+00:00", "updated": "2026-10-20T17:25:58+00:00", "abs_url": "http://arxiv.org/abs/2610.25217v2", "pdf_url": "https://arxiv.org/pdf/2610.25217v2", "journal_ref": "", "doi": "", "comment": "53 pages, 5 figures, 6 tables. Comments are welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 쌍곡 3-다양체의 이상 삼각분할(ideal triangulation) 실현 가능성에 관한 것으로, McMullen 문제(볼록 위치 점 배치, oriented matroid, 열대기하학 등)와 직접적 관련이 없다.", "summary": "Costantino 등이 제안한 '모든 변의 차수(valence)가 6 이상인 이상 삼각분할은 쌍곡 부분 절단 사면체로 실현 가능하다'는 추측에 대한 반례를 제시한다. 저자들은 figure-eight 매듭 여공간에서 출발하여 2688개의 사면체를 가진 이상 삼각분할을 구성하며, 이 삼각분할의 다양체는 쌍곡적이지만 해당 기하학적 실현이 불가능함을 보인다. 반례의 존재는 유한 피복에서도 지속되며, 변의 길이 종류나 변의 궤도가 두 가지만인 경우에는 반례가 존재할 수 없음도 증명된다.", "technique": "Luo-Yang의 공부피 에너지(covolume energy)의 임계점 분석, 볼록성(convexity) 논증, Euler 표수 계산, 정수 정확 산술을 이용한 유한 인증서(finite certificate)를 핵심 기법으로 사용한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.24438v1", "title": "Bounded powers of edge ideals: Nearly Gorenstein polytopes", "authors": ["Takayuki Hibi", "Seyed Amin Seyed Fakhari"], "abstract": "A lattice polytope $\\mathcal{P} \\subset \\mathbb{R}^n$ of dimension $n$ is called nearly Gorenstein if $\\mathcal{P}$ is normal and if its Ehrhart ring is a nearly Gorenstein ring. We study nearly Gorenstein polytopes arising from discrete polymatroids of bounded powers of edge ideals. Especially, it is shown that every nearly Gorenstein polytope coming from either a complete graph or a complete bipartite graph is level.", "categories": ["math.AC", "math.CO"], "primary_category": "math.AC", "published": "2026-10-17T03:56:43+00:00", "updated": "2026-10-17T03:56:43+00:00", "abs_url": "http://arxiv.org/abs/2610.24438v1", "pdf_url": "https://arxiv.org/pdf/2610.24438v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 격자 다면체의 nearly Gorenstein 성질과 Ehrhart 링에 관한 것으로, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 이산 폴리매트로이드(discrete polymatroid)의 변 아이디얼(edge ideal)의 유계 거듭제곱으로부터 얻어지는 격자 다면체의 nearly Gorenstein 성질을 연구한다. 특히, 완전 그래프 또는 완전 이분 그래프로부터 나오는 모든 nearly Gorenstein 다면체가 level임을 증명한다.", "technique": "이산 폴리매트로이드와 변 아이디얼의 유계 거듭제곱을 통해 격자 다면체를 구성하고, Ehrhart 링의 대수적 성질(nearly Gorenstein, level)을 분석하는 교환 대수적 방법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.23672v1", "title": "Homology and carrier faces of simplicial distributions", "authors": ["Aziz Kharoof", "Chung-Ping Lai"], "abstract": "We study the facial structure of simplicial distribution polytopes using topological and algebraic methods. In the theory of simplicial distributions, measurement and event spaces are represented by simplicial sets, and compatible probability assignments form a convex polytope. Given a simplicial distribution, it is known that its supports determine its carrier face. Moreover, the supports form a simplicial subset of the event space. This naturally raises the question of how the topology of this simplicial subset is related to the corresponding carrier face. Our main objective is to relate the dimension of the carrier face to the topology and combinatorial structure of the space of supports. For $n$-facet-paired measurement spaces, we first express the carrier dimension in terms of the nullity of an associated facet matrix. When the measurement space is additionally orientable, we show that the carrier dimension is determined by the top-dimensional homology of the space of supports, yielding, in particular, a homological criterion for detecting vertices. We then develop an algebraic reduction based on a strong connectivity relation on the generating simplices of the space of supports. This construction yields a reduced facet matrix, indexed by the strongly connected components, whose null space is isomorphic to that of the original facet matrix. As a consequence, both the carrier dimension and extremality can be determined from the topology of the support and the way its strongly connected components are glued together.", "categories": ["math.AT"], "primary_category": "math.AT", "published": "2026-10-16T16:04:18+00:00", "updated": "2026-10-16T16:04:18+00:00", "abs_url": "http://arxiv.org/abs/2610.23672v1", "pdf_url": "https://arxiv.org/pdf/2610.23672v1", "journal_ref": "", "doi": "", "comment": "27 pages, 3 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 simplicial distribution polytope의 위상적·대수적 구조를 다루며, McMullen 문제나 oriented matroid의 acyclic reorientation과는 직접적 관련이 없다.", "summary": "이 논문은 simplicial distribution polytope의 면(face) 구조를 위상적·대수적 방법으로 연구한다. 측정 공간이 $n$-facet-paired이고 orientable인 경우, carrier face의 차원이 지지 공간(space of supports)의 최고 차원 호몰로지(top-dimensional homology)에 의해 결정됨을 보이며, 이를 통해 꼭짓점(vertex) 판별을 위한 호몰로지 기준을 제공한다. 또한 지지 공간의 생성 단체들 사이의 강연결 관계(strong connectivity relation)에 기반한 대수적 축소 구성을 개발하여, carrier 차원과 극단성(extremality)을 강연결 성분의 위상으로부터 결정할 수 있음을 보인다.", "technique": "facet matrix의 nullity를 이용한 carrier 차원 공식화, 지지 공간의 top-dimensional homology 분석, 강연결 성분(strongly connected components)에 의한 reduced facet matrix 구성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.23312v1", "title": "The Strong Total Cover Problem", "authors": ["Manuel Aprile", "Luca Ferrarini"], "abstract": "The Strong Total Cover Problem (STCP) is a novel covering problem defined on a graph $G = (V, E)$, where the objective is to find a minimum-cardinality subset $T \\subseteq V \\cup E$ such that every element of $V \\cup E$ is covered. In this setting, a vertex covers itself and all its incident edges, while an edge covers itself together with its two endpoints. The STCP resembles classical covering problems such as Vertex Cover and Edge Cover problems, and naturally arises as the dual of the total matching problem. In this paper, we investigate the STCP from algorithmic, complexity, and polyhedral perspectives. We first establish close connections between STCP, the Dominating Set Problem, and the Maximum Induced Matching Problem. These relationships provide structural insights, imply the NP-hardness of STCP, and identify graph classes for which the problem is polynomial-time solvable. We then investigate the weighted version of STCP, showing that it remains NP-hard even on complete graphs with binary weights. On the other hand, we present a 2-approximation algorithm, and a polynomial-time algorithm for complete bipartite graphs. On the polyhedral side, we introduce the Strong Total Cover Polytope and derive several families of valid inequalities, some of which are shown to define facets. Finally, we provide a complete linear description of the associated polytope for triangular cactus graphs, revealing an interesting contrast with the considerably more intricate facial structure of the dominating set polytope on cactus graphs.", "categories": ["cs.DM", "cs.CC", "math.CO"], "primary_category": "cs.DM", "published": "2026-10-16T11:14:59+00:00", "updated": "2026-10-16T11:14:59+00:00", "abs_url": "http://arxiv.org/abs/2610.23312v1", "pdf_url": "https://arxiv.org/pdf/2610.23312v1", "journal_ref": "", "doi": "", "comment": "28 pages, 4 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프의 커버링 문제(STCP)를 다루며 McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 전혀 관련이 없다.", "summary": "Strong Total Cover Problem(STCP)은 그래프 $G=(V,E)$에서 $V\\cup E$의 모든 원소를 커버하는 최소 부분집합 $T\\subseteq V\\cup E$를 찾는 새로운 커버링 문제이다. 본 논문은 STCP의 NP-난이성, 2-근사 알고리즘, 완전 이분 그래프에 대한 다항 시간 알고리즘을 제시하고, Strong Total Cover Polytope의 패싯(facet)을 포함한 다양한 유효 부등식을 유도한다. 또한 삼각 선인장 그래프(triangular cactus graph)에 대한 완전 선형 기술(linear description)을 제공한다.", "technique": "지배 집합 문제(Dominating Set) 및 최대 유도 매칭(Maximum Induced Matching)과의 구조적 연결을 활용한 복잡도 분석, 다면체(polyhedral) 접근을 통한 패싯 분류 및 다항 시간 알고리즘 설계.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.22559v1", "title": "Four colours are needed for closed-neighbourhood conflict-free colouring of all planar graphs", "authors": ["Jelena Sedlar", "Riste Škrekovsk"], "abstract": "A colouring of the vertices of a graph is conflict-free with respect to closed neighbourhoods if every closed neighbourhood contains a colour that appears on exactly one of its vertices. The colouring need not be proper. Every planar graph has such a colouring with four colours. Fabrici, Lužar, Rindošová and Soták conjectured that three colours always suffice. We disprove this conjecture. We give a simple gadget construction that turns every planar graph of chromatic number four into a planar graph with no such colouring with three colours. This also shows that it is NP-complete to decide whether three colours suffice for a planar graph. We also give a planar graph on $25$ vertices that needs four colours. Further, we give critical planar graphs on $25$ vertices with $52$ and with $51$ edges, an infinite family of plane triangulations that need four colours, and an infinite family of critical examples.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-15T18:59:49+00:00", "updated": "2026-10-15T18:59:49+00:00", "abs_url": "http://arxiv.org/abs/2610.22559v1", "pdf_url": "https://arxiv.org/pdf/2610.22559v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 그래프의 closed-neighbourhood conflict-free 채색에 관한 것으로, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid 등)와 전혀 관련이 없다.", "summary": "모든 평면 그래프는 closed neighbourhood에 대해 conflict-free한 4-색칠을 가지며, 3색으로 충분하다는 Fabrici 등의 추측을 반례로 반증한다. 단순한 gadget 구성을 통해 색수 4인 평면 그래프로부터 3색 conflict-free 채색이 불가능한 평면 그래프를 만들 수 있으며, 이로부터 평면 그래프에서 3색 충분성 판별이 NP-완전임도 보인다. 또한 25개 꼭짓점의 4색 필요 평면 그래프, 임계(critical) 예시, 그리고 4색이 필요한 무한 평면 삼각형화 족을 제시한다.", "technique": "색수 4인 평면 그래프를 3색 conflict-free 불가능 평면 그래프로 변환하는 gadget 구성 및 임계 그래프 분석.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.22114v1", "title": "SL(n)-covariant symmetric tensor valuations on polytopes", "authors": ["Chunna Zeng", "Xiaoyu Cheng"], "abstract": "All $\\operatorname{SL}(n)$-covariant symmetric tensor valuations on convex polytopes in $\\mathbb R^n$ are completely classified without any continuity assumptions. It is shown that the only such valuation is the moment tensor.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-15T15:53:31+00:00", "updated": "2026-10-15T15:53:31+00:00", "abs_url": "http://arxiv.org/abs/2610.22114v1", "pdf_url": "https://arxiv.org/pdf/2610.22114v1", "journal_ref": "", "doi": "", "comment": "24pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체 위의 SL(n)-공변 대칭 텐서 값값(valuation) 분류에

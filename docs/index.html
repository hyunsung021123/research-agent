<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#15161C; --muted:#71727F;
    --line:#E6E7EC; --accent:#4338CA; --accent-soft:#EEECFB;
    --explore:#0D9488; --explore-soft:#E3F4F1; --up:#15803D; --down:#B91C1C;
    --serif: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:880px;margin:0 auto;padding:16px 20px 12px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:var(--serif);font-weight:600;font-size:25px;margin:2px 0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .controls input[type=search]{flex:1 1 180px;min-width:150px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;color:inherit}
  .controls select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;color:inherit}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--surface);border:0;padding:8px 11px;cursor:pointer;border-left:1px solid var(--line);font:inherit}
  .seg button:first-child{border-left:0}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff}
  label.thr{font-size:13px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
  label.thr output{font-family:var(--mono);color:var(--ink);min-width:1.4em;text-align:right}
  .gear{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}
  .panel{max-width:880px;margin:0 auto;padding:0 20px;overflow:hidden;max-height:0;transition:max-height .2s}
  .panel.open{max-height:420px;padding-bottom:12px}
  .panel .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px}
  .panel input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;margin:4px 0 10px}
  .panel button{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font:inherit}
  .panel .hint{color:var(--muted);font-size:12px;margin-bottom:8px}
  .refresh-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font:inherit;font-size:14px;font-weight:500}
  .refresh-btn:disabled{opacity:.5;cursor:not-allowed}
  .refresh-btn .spin{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .refresh-btn.loading .spin{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  main{max-width:880px;margin:0 auto;padding:14px 20px 64px}
  .count{font-size:13px;color:var(--muted);margin:2px 0 14px;font-family:var(--mono)}
  .card{position:relative;display:grid;grid-template-columns:60px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 16px 0;margin-bottom:12px;overflow:hidden}
  .ledger{display:flex;flex-direction:column;align-items:center;padding-top:2px;position:relative}
  .ledger::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--edge,var(--line))}
  .score{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1;color:var(--edge,var(--muted))}
  .score small{display:block;font-size:9px;letter-spacing:.1em;color:var(--muted);margin-top:4px;font-weight:400}
  .body{min-width:0}
  .title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
  .tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--explore);background:var(--explore-soft);padding:2px 7px;border-radius:5px;margin-left:8px}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .prob{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px}
  .meta .dot{margin:0 6px;opacity:.5}
  .reason{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:10px}
  .summary{margin:0 0 10px}
  .field{font-size:14px;margin:6px 0}
  .field b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:6px}
  .conn{background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:14px}
  .chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .actions{margin-top:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .act{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
  .act.on-fav{border-color:#D97706;background:#FEF3C7}
  .act.on-up{border-color:var(--up);background:#DCFCE7}
  .act.on-down{border-color:var(--down);background:#FEE2E2}
  .links{margin-left:auto;font-family:var(--mono);font-size:12px;display:flex;gap:14px;align-items:center}
  .links .id{color:var(--muted)}
  .togg{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;font-family:var(--mono);margin-top:8px}
  .abstract{margin-top:10px;font-size:13.5px;color:#3a3b47;border-top:1px dashed var(--line);padding-top:10px;display:none}
  .abstract.open{display:block}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .sync{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:560px){.card{grid-template-columns:44px 1fr;gap:10px;padding-right:14px}.title{font-size:17px}h1{font-size:21px}.links{margin-left:0;width:100%}}
  @media (prefers-reduced-motion:reduce){*{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="eyebrow">arXiv · 리서치 다이제스트</div>
    <h1>관련 논문</h1>
    <div class="sub">갱신 2026-11-27 06:11 · 총 246편 <span class="sync" id="sync"></span></div>
    <div class="controls">
      <button class="refresh-btn" id="refreshBtn">
        <span class="spin"></span>▶ 지금 업데이트
      </button>
      <input type="search" id="q" placeholder="제목·요약·초록 검색" aria-label="검색">
      <select id="sort" aria-label="정렬">
        <option value="fav">즐겨찾기 우선</option>
        <option value="rel">관련도순</option>
        <option value="date">최신순</option>
      </select>
      <select id="prob" aria-label="문제 필터"><option value="">전체 문제</option></select>
      <label class="thr">관련도 ≥ <input type="range" id="thr" min="0" max="10" value="0"><output id="thrv">0</output></label>
      <span class="seg" role="group">
        <button id="fAll" aria-pressed="true">전체</button>
        <button id="fFav" aria-pressed="false">⭐만</button>
        <button id="fExp" aria-pressed="false">탐색만</button>
      </span>
      <span class="seg" role="group"><button id="hideDown" aria-pressed="false">👎 숨기기</button></span>
      <button class="gear" id="gear" title="동기화 설정">⚙</button>
    </div>
  </div>
  <div class="panel" id="panel"><div style="max-width:880px;margin:0 auto"><div class="box">
    <b>GitHub 연동 설정</b>
    <div class="hint">
      토큰 권한: <b>Contents</b>(읽기·쓰기) + <b>Actions</b>(읽기·쓰기) — 두 권한이 있어야
      즐겨찾기·평가 동기화와 수동 업데이트 버튼이 모두 작동합니다.<br>
      fine-grained Personal Access Token 권장. 토큰은 이 기기 브라우저에만 저장됩니다.
    </div>
    <input id="ghRepo" placeholder="owner/repo (예: choihs/research-agent) — 비우면 URL 에서 자동 감지">
    <input id="ghToken" type="password" placeholder="github_pat_... (이 기기에만 저장)">
    <button id="ghSave">저장</button> <span class="sync" id="ghStatus"></span>
  </div></div></div>
</header>

<script>
const DATA = [{"id": "2606.19573v1", "title": "Embracing exchange sequences and oriented matroid polyhedron diameter", "authors": ["Kolja Knauer", "Luis Pedro Montejano"], "abstract": "We reduce the embracing exchange distance of bases of oriented matroids to the metric of oriented matroid polyhedra. This allows us to disprove recent conjectures of Caoduro, Khodamoradi, Paat, and Shepherd and of Bérczi and Nádor. On the other hand, we show that any two embracing bases of an oriented matroid of rank $r$ can be transformed into each other in at most $2r^{\\log_2(r)+3}$ steps and in at most $r$ steps in a Lawrence oriented matroid, thus confirming the conjecture in this case.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-06-17T20:18:48+00:00", "updated": "2026-06-17T20:18:48+00:00", "abs_url": "http://arxiv.org/abs/2606.19573v1", "pdf_url": "https://arxiv.org/pdf/2606.19573v1", "journal_ref": "", "doi": "", "comment": "10 pages, 1 figure", "relevance": 5, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Lawrence oriented matroid와 oriented matroid의 기저 변환 문제를 다루며, McMullen 문제와 관련된 Lawrence oriented matroid 구조를 직접 언급하고 있어 부분적 관련성이 있다.", "summary": "이 논문은 oriented matroid의 기저들의 embracing exchange distance를 oriented matroid polyhedra의 metric으로 환원하여, Caoduro 등과 Bérczi-Nádor의 최근 추측들을 반례로 논박한다. 한편, rank $r$의 oriented matroid에서 임의의 두 embracing base는 최대 $2r^{\\log_2(r)+3}$ 단계로 변환 가능함을 보이고, Lawrence oriented matroid의 경우 최대 $r$ 단계로 변환 가능함을 증명하여 해당 경우의 추측을 확인한다.", "technique": "Embracing exchange distance를 oriented matroid polyhedra의 직경(diameter) 문제로 환원하는 것이 핵심 기법이다.", "connections": "Lawrence oriented matroid에서의 $r$ 단계 변환 결과는 McMullen 문제와 관련된 Lawrence oriented matroid 구조에 직접 적용 가능하다.", "keyword_hits": [], "source": "seed"}, {"id": "2609.15850v1", "title": "Neither simpliciality nor mutation connectivity: conjectures of Las Vergnas and Cordovil-Las Vergnas fail", "authors": ["Qiyuan Gu", "Kolja Knauer"], "abstract": "We construct a simple rank-$7$ oriented matroid on $24$ elements with no simplicial tope, disproving the Las Vergnas simplex conjecture from 1980. We then show that the mutation graph on uniform oriented matroids is disconnected for infinitely many values of rank $r$ and ground-set size $n$, disproving the Cordovil--Las Vergnas conjecture from 1988.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-09-14T16:43:39+00:00", "updated": "2026-09-14T16:43:39+00:00", "abs_url": "http://arxiv.org/abs/2609.15850v1", "pdf_url": "https://arxiv.org/pdf/2609.15850v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 4, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Oriented matroid의 구조(tope, mutation graph)를 다루어 McMullen 문제와 같은 oriented matroid 프레임워크를 공유하지만, 연구 대상이 Las Vergnas 추측과 Cordovil–Las Vergnas 추측의 반례 구성으로 McMullen 문제(f(5)=11, acyclic reorientation 등)와는 직접적 관련이 없다.", "summary": "이 논문은 rank-$7$, 24원소 위의 simplicial tope가 없는 단순 oriented matroid를 구성하여 1980년 Las Vergnas의 simplex 추측을 반증한다. 또한 uniform oriented matroids의 mutation graph가 무한히 많은 $(r, n)$ 값에서 비연결임을 보여, 1988년 Cordovil–Las Vergnas 추측도 반증한다.", "technique": "반례(counterexample) 구성: rank-7, 24원소의 단순 oriented matroid를 명시적으로 작성하여 두 추측을 동시에 반증.", "connections": "추측: McMullen 문제에서 활용되는 oriented matroid의 tope graph 및 chirotope 개념과 관련 구조를 공유하나, 직접적 연결은 초록만으로는 불확실.", "keyword_hits": ["oriented matroid", "tope"], "source": "filter"}, {"id": "2610.23553v1", "title": "Visibility Sets, Empty Pentagons, and Sufficient Conditions for Hexagons", "authors": ["Carlos M. Nicolas"], "abstract": "Given a set $S$ of $n$ points in general position in the plane, we define the $C$-set $C(p,q)$ of an oriented edge $(p,q)$ as the set of extreme points of the visibility set $V(p,q)$ facing $(p,q)$. Since every point of $V(p,q)$ that is not in $C(p,q)$ gives rise to an empty convex pentagon having $(p,q)$ as a boundary edge, it is natural to study the properties of $C$-sets in order to bound the number of empty convex pentagons of $S$.   We prove tight bounds on the intersection size and union complexity of $C$-sets sharing an endpoint. We also consider the problem of bounding the number of empty pentagons and hexagons in terms of the number of interior and boundary points of $S$. While the hexagon bound is weak, it offers a potential step toward a superlinear lower bound. On the other hand, the two-parameter bound for pentagons, combined with the structural results on $C$-sets, yields a simple proof of an $Ω(n^{3/2})$ bound for the number of pentagons. While this is a significant improvement over previously published bounds, a recent preprint \\cite{Astudillo2026} attains a better bound using completely different methods. Thus, the primary contribution of this paper lies in the structural results about $C$-sets and the two-parameter bounds for empty pentagons and hexagons.", "categories": ["math.CO", "cs.CG"], "primary_category": "math.CO", "published": "2026-10-16T14:42:47+00:00", "updated": "2026-10-16T14:42:47+00:00", "abs_url": "http://arxiv.org/abs/2610.23553v1", "pdf_url": "https://arxiv.org/pdf/2610.23553v1", "journal_ref": "", "doi": "", "comment": "21 pages, 12 figures", "relevance": 3, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "공집합 볼록 오각형·육각형의 구조적 분석은 일반 위치 점 배치와 볼록 위치 관련 조합론을 다루지만, McMullen 문제(d=5, f(5)=11)나 oriented matroid의 acyclic reorientation과는 직접적 연관이 없다.", "summary": "평면의 일반 위치 점 집합 $S$에서 방향 간선 $(p,q)$의 가시 집합(visibility set) $V(p,q)$의 극점들로 이루어진 $C$-집합을 정의하고, $C$-집합의 교집합 크기 및 합집합 복잡도에 대한 tight한 경계를 증명한다. 이를 이용하여 공집합 볼록 오각형의 수에 대한 $\\Omega(n^{3/2})$ 하한을 단순하게 도출하며, 공집합 볼록 육각형의 수에 대한 interior·boundary 점 수 기반의 2-매개변수 경계도 제시한다.", "technique": "$C$-집합의 교집합·합집합 복잡도 분석과 2-매개변수(interior/boundary 점) 경계 기법을 결합하여 공집합 오각형·육각형 수의 하한을 도출한다.", "connections": "추측: 공집합 볼록 다각형의 구조 분석은 oriented matroid의 chirotope 및 점 배치의 조합적 유형 분류와 간접적으로 연결될 수 있으나, 초록에는 그러한 연결이 명시되지 않는다.", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2606.24339v1", "title": "Toward a classification of tropical complete intersection number one", "authors": ["Linxuan Li"], "abstract": "By bridging two classification results -- the Esterov--Gusev classification of tuples of lattice polytopes of mixed volume one, and Fink's characterization of Bergman fans -- we formulate a classification conjecture describing when the stable intersection of a tropical fan F with the tropicalization Trop(X) of a subvariety of T^n is a reduced point. Our main results establish this conjecture in three fundamental cases -- unmixed sequences, hypersurface complete-intersection cycles, and tropical 2-cycles -- and develop several tools intended for the general case.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-23T09:25:12+00:00", "updated": "2026-06-23T09:25:12+00:00", "abs_url": "http://arxiv.org/abs/2606.24339v1", "pdf_url": "https://arxiv.org/pdf/2606.24339v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "열대기하학(tropical geometry)을 도구로 활용한다는 점에서 McMullen 문제의 접근 도구 중 하나인 tropical geometry와 표면적으로 연관되나, 본 논문의 핵심 주제는 열대 완전 교차(tropical complete intersection)의 분류로 McMullen 문제 또는 Larman 추측과 직접적 관련이 없다.", "summary": "본 논문은 격자 다면체(lattice polytope) 튜플의 mixed volume 1에 대한 Esterov–Gusev 분류와 Bergman fan에 대한 Fink의 특성화를 연결하여, 열대 팬(tropical fan) $F$와 대수적 부분다양체의 열대화 $\\mathrm{Trop}(X)$의 안정 교차(stable intersection)가 축약점(reduced point)이 되는 조건을 기술하는 분류 추측을 제시한다. 주요 결과로 unmixed sequence, 초곡면 완전 교차 사이클(hypersurface complete-intersection cycle), 열대 2-사이클(tropical 2-cycle)의 세 가지 기본 경우에서 이 추측을 증명한다.", "technique": "Esterov–Gusev의 mixed volume 1 분류와 Fink의 Bergman fan 특성화를 연결하여 열대 완전 교차 수(tropical complete intersection number)가 1인 경우를 분류하는 방법론을 개발한다.", "connections": "", "keyword_hits": ["tope", "tropical"], "source": "filter"}, {"id": "2609.20656v1", "title": "Framingtopes", "authors": ["Sergio Alejandro Fernandez de soto Guerrero", "Cesar Ceballos", "Matias von Bell"], "abstract": "Framing lattices arise from the dual graphs of framed (or DKK) triangulations of flow polytopes and provide a common framework encompassing classical lattices such as the Boolean, Tamari, and weak-order lattices, as well as $τ$-tilting posets of certain gentle algebras. In this paper, we introduce the \\emph{framingtope}, a polytopal complex that provides a geometric counterpart to a framing lattice: its edge graph is the Hasse diagram of the framing lattice. We prove that the framingtope admits three equivalent descriptions, in terms of interior faces of the framed triangulation, sets of pairwise coherent routes covering the graph, and pure intervals of the framing lattice. We further construct a tropical realization of the framingtope as the bounded-cell complex of an arrangement of tropical hypersurfaces associated with an admissible height function. This construction yields explicit vertex coordinates for broad classes of framed graphs, including plane framed graphs and multioruga graphs. In the multioruga case, these coordinates give tropical realizations of weak orders on multipermutations and, in the ordinary oruga case, recover the classical permutahedron.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T16:36:15+00:00", "updated": "2026-09-17T16:36:15+00:00", "abs_url": "http://arxiv.org/abs/2609.20656v1", "pdf_url": "https://arxiv.org/pdf/2609.20656v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "tropical geometry 기법을 공유하나, McMullen 문제(d=5, f(5)=11, oriented matroid, acyclic reorientation)와 직접적인 관련은 없고 flow polytope의 삼각분할 및 framing lattice의 폴리토프 복합체 연구이다.", "summary": "이 논문은 flow polytope의 framed(DKK) 삼각분할의 쌍대 그래프로부터 생성되는 framing lattice의 기하학적 대응물인 framingtope를 도입한다. framingtope는 세 가지 동치 서술(framed 삼각분할의 내부 면, 상호 coherent route 집합, framing lattice의 pure interval)을 가지며, 열대(tropical) 초곡면 배열의 유계 셀 복합체로 실현된다. 특히 multioruga 그래프의 경우 multipermutation에 대한 weak order의 열대 실현을 제공하고, 일반 oruga 경우 고전적 permutahedron을 복원한다.", "technique": "admissible height function에 연관된 열대 초곡면 배열의 유계 셀 복합체로 framingtope의 열대 실현을 구성하여 명시적 꼭짓점 좌표를 도출한다.", "connections": "추측: tropical geometry를 통한 폴리토프 실현 기법이 McMullen 문제의 realizability 접근과 느슨하게 연결될 수 있으나 초록에 직접 근거 없음.", "keyword_hits": ["tope", "triangulation", "tropical"], "source": "filter"}, {"id": "2609.19299v1", "title": "Sumsets of Ahlfors--David regular sets", "authors": ["Fred Tyrrell"], "abstract": "We prove that there is an absolute constant $c>0$ such that for every finite $(α,M)$-Ahlfors--David regular set $A\\subseteq[N]$ with $0\\leqα<1$ and $M\\geq2$, we have the sumset estimate \\[|A+A|\\geq |A|^{1+c(1-α)/\\log M}.\\] We also prove a corresponding statement for Ahlfors--David regular sets in $[0,1]$. The proof combines a multiscale entropy decomposition with inverse results from additive combinatorics, showing that Ahlfors--David regularity forces a definite entropy gain at each scale. The dependence $1/\\log M$ in the exponent is of optimal order.", "categories": ["math.CO", "math.CA", "math.MG", "math.NT"], "primary_category": "math.CO", "published": "2026-09-16T18:08:13+00:00", "updated": "2026-09-16T18:08:13+00:00", "abs_url": "http://arxiv.org/abs/2609.19299v1", "pdf_url": "https://arxiv.org/pdf/2609.19299v1", "journal_ref": "", "doi": "", "comment": "19 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Sumset 추정과 Ahlfors–David 정칙성은 additive combinatorics와 geometric measure theory의 교집합이지만, McMullen's problem(convex position, oriented matroid, realizability)과는 직접적 관련이 없음.", "summary": "유한 $(α,M)$-Ahlfors–David 정칙 집합 $A\\subseteq[N]$에 대해, sumset 크기가 $|A+A|\\geq |A|^{1+c(1-α)/\\log M}$을 만족하는 절댓값 상수 $c>0$가 존재함을 증명. 증명은 다중 스케일 엔트로피 분해와 덧셈 조합론의 역 정리를 결합하여, 정칙성이 각 스케일에서 확정적 엔트로피 증가를 강제함을 보임.", "technique": "Multiscale entropy decomposition과 inverse results from additive combinatorics의 결합.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.22741v1", "title": "The polynomial characterization of tope graphs of the lopsided sets", "authors": ["Xuan Zheng", "Yan-Ting Xie", "Shou-Jun Xu"], "abstract": "The cube polynomial $C_G(x)$ generates the number of $k$-cubes on a graph $G$. As a subclass of partial cubes, the tope graphs of lopsided sets (LOPs) generalize daisy cubes and median graphs. In this paper, we prove that every tope graph of a LOP shares its cube polynomial with some daisy cube, thereby answering affirmatively a problem posed earlier by the authors. Furthermore, we present explicit expressions for the cube polynomials of tope graphs of LOPs: $C_G(x)=f_\\mathcal{K}(x+1)$, where $f_\\mathcal{K}(x)$ is the $f$-polynomial of the cubical complex $\\mathcal{K}$ of $G$. Finally, we show that a class $\\mathcal{G}$ of partial cubes is the class of tope graphs of LOPs if and only if the following equivalent conditions hold: (a) $\\mathcal{G}$ is the maximal pc-minor-closed class such that every graph in $\\mathcal{G}$ has the same cube polynomial as some daisy cube; (b) for every $G\\in\\mathcal{G}$, each antipodal subgraph of $G$ has the same cube polynomial as some daisy cube.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-19T03:49:03+00:00", "updated": "2026-09-19T03:49:03+00:00", "abs_url": "http://arxiv.org/abs/2609.22741v1", "pdf_url": "https://arxiv.org/pdf/2609.22741v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "tope graph라는 용어가 공유되나, 이 논문은 LOP(lopsided set)의 tope graph에 대한 cube polynomial 특성화를 다루며 McMullen 문제(oriented matroid의 acyclic reorientation, f(5)=11 등)와는 직접적 관련이 없다.", "summary": "이 논문은 lopsided set(LOP)의 tope graph가 daisy cube와 동일한 cube polynomial을 가짐을 증명하여 저자들이 이전에 제기한 문제에 긍정적으로 답한다. 나아가 LOP의 tope graph의 cube polynomial에 대한 명시적 표현 $C_G(x)=f_{\\mathcal{K}}(x+1)$을 제시하며, 여기서 $f_{\\mathcal{K}}(x)$는 해당 cubical complex의 $f$-다항식이다. 최종적으로 partial cube의 클래스 $\\mathcal{G}$가 LOP의 tope graph 클래스임을 특징짓는 동치 조건들을 확립한다.", "technique": "pc-minor-closed class와 antipodal subgraph 분석을 통해 cube polynomial과 cubical complex의 $f$-polynomial 사이의 관계를 규명한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.21927v1", "title": "A colorful Steinitz theorem with different centers", "authors": ["G. Ivanov"], "abstract": "We prove a colorful quantitative Steinitz theorem in which the color classes may have different centers. If the convex hull of each of $2d$ sets in $\\R^d$ contains a translate of the Euclidean unit ball, then a rainbow convex hull contains a ball of radius $(3d)^{-2d^2}$ whose center belongs to the convex hull of the given centers. The main ingredient is an exact result for translates of a segment, proved by a lifting and a topological colorful Helly theorem. The same idea also yields a sharp colorful Helly theorem for translated cones: for $1 \\le k \\le d-1$, if every rainbow selection from $2d-k+1$ finite families of convex sets in $\\mathbb{R}^d$ has a $k$-dimensional cone in its intersection, then the intersection of one of the families contains such a cone.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-18T15:49:19+00:00", "updated": "2026-09-18T15:49:19+00:00", "abs_url": "http://arxiv.org/abs/2609.21927v1", "pdf_url": "https://arxiv.org/pdf/2609.21927v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Colorful Helly-type 정리는 조합기하학의 기초적 도구이지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, acyclic reorientation과는 직접적 관련이 없음.", "summary": "색깔별 집합들(각각 다른 중심을 가진)의 rainbow convex hull이 특정 반지름의 공을 포함함을 보이는 양적 Colorful Steinitz 정리를 증명. 선분의 이동에 대한 정확한 결과와 위상적 colorful Helly 정리를 활용하며, 동일한 방법으로 이동된 원뿔에 대한 sharp colorful Helly 정리도 도출.", "technique": "Lifting과 위상적 colorful Helly 정리를 결합한 방법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25181v1", "title": "On Smooth Combinatorial Products of Simplices", "authors": ["Juliana Curtis", "Tuong Le", "Chayim Lowen"], "abstract": "We show that every lattice weak Minkowski summand of a smooth polytope combinatorially isomorphic to a product of simplices has a quadratic triangulation. This is achieved by identifying this class of polytopes with the class of Nakajima polytopes. We combine these results to give a new proof that two lattice weak Minkowski summands of the same such smooth polytope are relatively IDP. Along the way, we prove a structure theorem for simple polytopes whose 2-faces are triangles and trapezoids.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T15:30:35+00:00", "updated": "2026-09-21T15:30:35+00:00", "abs_url": "http://arxiv.org/abs/2609.25181v1", "pdf_url": "https://arxiv.org/pdf/2609.25181v1", "journal_ref": "", "doi": "", "comment": "17 pages, 4 figures", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "단체들의 곱의 삼각분할(triangulations of products of simplices)이라는 공통 도구가 언급되나, 본 논문은 McMullen 문제나 oriented matroid와 직접 관련 없이 격자 다면체의 Minkowski 합산자 및 IDP 성질을 다룬다.", "summary": "이 논문은 단체들의 곱에 조합론적으로 동형인 매끄러운 볼록 다면체(smooth polytope)의 격자 weak Minkowski 합산자가 이차 삼각분할(quadratic triangulation)을 가짐을 보인다. 이를 위해 해당 다면체 류를 Nakajima polytope 류와 동일시하는 방법을 사용하며, 그 결과로 동일한 매끄러운 다면체의 두 격자 weak Minkowski 합산자가 relatively IDP임을 새로운 방식으로 증명한다. 부수적으로, 2-면(2-face)이 삼각형과 사다리꼴인 단순 다면체(simple polytope)에 대한 구조 정리도 증명한다.", "technique": "매끄러운 단체 곱형 다면체를 Nakajima polytope로 특성화하고 이차 삼각분할을 구성함으로써 relatively IDP 성질을 도출.", "connections": "추측: 단체들의 곱의 삼각분할 이론이 McMullen 문제의 접근 도구 중 하나로 언급되지만, 본 논문의 내용이 직접 연결된다는 초록 근거는 없음.", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.25671v1", "title": "A colorful quantitative Helly theorem for volume", "authors": ["Grigory Ivanov"], "abstract": "We prove a colorful quantitative Helly theorem for volume with the optimal number $2d$ of colors. If every rainbow intersection from $2d$ finite families of convex sets in $\\R^d$ has volume at least one, then the intersection of one family has volume at least $d^{-O(d^2)}$. We also prove a colorful quantitative Steinitz theorem for origin-centered ellipsoids of different shapes. The proof uses a common normalization of positive operators and a lift that produces two rainbow bases with large determinants.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T04:22:27+00:00", "updated": "2026-09-22T04:22:27+00:00", "abs_url": "http://arxiv.org/abs/2609.25671v1", "pdf_url": "https://arxiv.org/pdf/2609.25671v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "볼륨에 대한 Helly 정리와 볼록 교집합 문제를 다루지만, McMullen의 문제인 일반위치 점 배치와 oriented matroid의 구조 문제와는 직접적인 연결이 없음.", "summary": "Color 수 $2d$에서 최적인 colorful quantitative Helly 정리를 증명: $\\mathbb{R}^d$의 convex set 유한족 $2d$개에서 모든 rainbow intersection이 부피 1 이상이면, 한 족의 교집합 부피는 최소 $d^{-O(d^2)}$. 또한 다양한 타원체에 대한 colorful quantitative Steinitz 정리도 증명.", "technique": "양의 연산자 정규화(common normalization of positive operators)와 큰 행렬식을 가진 두 개의 rainbow basis를 생성하는 lift 기법 활용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23746v1", "title": "On convex spiral equicoverings of masses", "authors": ["Edgardo Roldán-Pensado"], "abstract": "Convex spiral equicoverings were recently introduced by Espinosa-García, Martínez-Sandoval and Roldán-Pensado. They left open the question of whether every planar mass admits a convex $(3k,k+1)$-spiral equicovering. In this paper we give an affirmative answer to this question. To be precise, we prove the following: Given an integer $k \\ge 2$, for every planar mass there is a fan consisting of $3k$ equal-mass sectors such that the union of every $k+1$ consecutive sectors is convex.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-09-20T16:47:54+00:00", "updated": "2026-09-20T16:47:54+00:00", "abs_url": "http://arxiv.org/abs/2609.23746v1", "pdf_url": "https://arxiv.org/pdf/2609.23746v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen 문제는 고차원 convex position 점 배치와 oriented matroid의 조합론적 구조를 다루지만, 본 논문은 평면 측도의 spiral equicovering이라는 기하학적 분할 문제로 직접적 관련성이 약함.", "summary": "본 논문은 최근 도입된 convex spiral equicovering 개념에 대해, 모든 평면 측도(planar mass)가 $(3k, k+1)$-spiral equicovering을 허용함을 증명한다. 즉, $3k$개의 등질량 부채꼴로 이루어진 부채꼴 분할에서 연속하는 $k+1$개 부채꼴의 합집합이 항상 볼록 집합이 되는 구조가 존재함을 보인다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.20380v1", "title": "The Bézout inequality for mixed volumes characterizes simplices", "authors": ["Dylan Langharst", "Shouda Wang"], "abstract": "We prove that the Bézout inequality for mixed volumes characterizes simplices among full dimensional convex bodies in every dimension, resolving a conjecture of Soprunov and Zvavitch. We give two separate proofs of the conjecture. Along the way, we also prove characterizations of simplices in terms of longest chords or relative inradii.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-17T13:33:58+00:00", "updated": "2026-09-17T13:33:58+00:00", "abs_url": "http://arxiv.org/abs/2609.20380v1", "pdf_url": "https://arxiv.org/pdf/2609.20380v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "혼합부피(mixed volume)의 기하학적 특성화는 볼록체 조합론과 관련있으나, McMullen's problem의 핵심인 일반위치 점 배치, 방향매트로이드, 다각형 부분합(polyhedral matching fields) 등과는 직접 연결이 없음.", "summary": "본 논문은 혼합부피에 대한 Bézout 부등식이 모든 차원의 전차원 볼록체 중 단체를 유일하게 특성화함을 증명하여 Soprunov–Zvavitch 추측을 해결한다. 두 가지 별도의 증명을 제시하며, 가장 긴 현(longest chord) 및 상대내접원반경(relative inradius)으로도 단체 특성화를 보인다.", "technique": "혼합부피의 변분 및 부등식 분석을 통한 기하학적 특성화", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25656v1", "title": "Enumerating pattern-avoiding translation-invariant total orders", "authors": ["Stella Jiahui Li"], "abstract": "Let $n$ be a positive integer. A translation-invariant total order (TITO) with period $n$ is a total order of the integers that is invariant under translations by multiples of $n$. These structures arise naturally in the study of Coxeter groups. In particular, real $n$-TITOs are in bijection with biclosed sets of positive roots of the affine symmetric group $\\widetilde S_n$. Barkley and Defant recently introduced pattern avoidance for TITOs and used it to define the affine Tamari lattice.   The enumeration of TITOs avoiding a single pattern of length $3$ is due to Crites and Barkley--Defant. We extend this work to TITOs avoiding two patterns. Our main results include a complete enumeration of TITOs that avoid a pair of patterns in $S_3\\times S_3$, as well as of TITOs that avoid a pair $(p, q)$ with $p \\in S_3 \\setminus \\{123, 321\\}$ and $q \\in S_4$. Furthermore, we provide an explicit construction of the inverse of the bijection between $312$-avoiding TITOs and noncrossing arc diagrams, thereby extending the combinatorial framework introduced by Barkley.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T04:05:52+00:00", "updated": "2026-09-22T04:05:52+00:00", "abs_url": "http://arxiv.org/abs/2609.25656v1", "pdf_url": "https://arxiv.org/pdf/2609.25656v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "패턴 회피 조합론과 격자 구조를 다루지만 McMullen's problem(볼록 위치의 점 배치, oriented matroid, 실현 가능성)과는 직접 관련이 없음.", "summary": "이 논문은 정수의 평행이동 불변 전순서(TITO)에서 패턴 회피 구조를 열거한다. 저자는 한 쌍의 패턴을 회피하는 TITO들을 완전히 열거하고, 312-회피 TITO와 비교차 호 다이어그램 사이의 전단사의 역함수를 명시적으로 구성한다.", "technique": "패턴 회피 열거법과 전단사 구성; Coxeter 군 및 affine symmetric group $\\widetilde{S}_n$의 biclosed 근 집합과의 관계", "connections": "추측: oriented matroid의 reorientation 관점에서 affine symmetric group의 근 구조와 TITO 패턴 회피의 관계가 있을 수 있으나, 초록에서는 명시되지 않음", "keyword_hits": [], "source": "explore"}, {"id": "2609.27366v1", "title": "Homology of matching complexes of $3\\times n$ grid graphs", "authors": ["Pratiksha Chauhan", "Anchal Sharma", "Samir Shukla"], "abstract": "For a finite simple graph $G$, the matching complex $M(G)$ is the simplicial complex whose vertex set is the edge set of $G$ and whose simplices are all the matchings in $G$. The topology of the matching complex of the $m\\times n$ grid graph $G_{m\\times n}$ is known only for $m = 1,2$, in which cases it is homotopy equivalent to a wedge of spheres. In this article, we study the matching complex $M(G_{3 \\times n})$. We prove that for $n\\ge2$, its reduced homology vanishes in dimensions $i \\leq n-2$ and in top dimension, while $\\tilde{H}_{n-1}(M(G_{3\\times n}))\\neq 0$. We also show that $M(G_{3 \\times n})$ is simply connected for $n \\geq 3$. Consequently, the topological connectivity of $M(G_{3\\times n})$ is $n-2$.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-09-23T05:09:29+00:00", "updated": "2026-09-23T05:09:29+00:00", "abs_url": "http://arxiv.org/abs/2609.27366v1", "pdf_url": "https://arxiv.org/pdf/2609.27366v1", "journal_ref": "", "doi": "", "comment": "23 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "매칭 복소체의 위상 구조를 연구하지만, McMullen's problem의 핵심인 점 배치의 convex position, oriented matroid, 또는 다면체 조합론과 직접적인 연관이 없음.", "summary": "3×n 격자 그래프의 매칭 복소체 M(G_{3×n})의 호모로지를 연구한다. n≥2일 때 축약된 호모로지가 차원 i≤n-2와 최상위 차원에서 소멸하고, n-1 차원에서는 0이 아님을 증명한다. n≥3일 때 단순연결이며 위상 연결도는 n-2이다.", "technique": "단순 복소체의 호모로지 계산 및 위상적 연결도 분석", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24775v1", "title": "Discrepancy theory, Tverberg's theorem, and regression depth", "authors": ["Aleksey Lopez", "Pablo Soberón"], "abstract": "We prove new bounds for Tverberg's theorem with tolerance. We show that $N = rt+Θ_{d,r}(t^{1/2-1/(2d)})$, where $N$ is the smallest number such that any set of $N$ points in $\\mathbb{R}^d$ has a partition into $r$ parts such that the convex hulls of the parts intersect even if we remove any $t$ of the points.   We extend Tverberg's theorem with tolerance to families of hyperplanes in $\\mathbb{R}^d$, and show that for any set of $rt + O_{d,r}(t^{1/2-1/(2d)}\\sqrt{\\log (t+1)})$ hyperplanes in $\\mathbb{R}^d$ there exists a partition of them into $r$ parts such that the regression hulls of the parts intersect even if any $t$ hyperplanes are removed.   Our bounds follow from establishing a connection between Tverberg-type results and discrepancy theory.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T15:42:56+00:00", "updated": "2026-09-21T15:42:56+00:00", "abs_url": "http://arxiv.org/abs/2609.24775v1", "pdf_url": "https://arxiv.org/pdf/2609.24775v1", "journal_ref": "", "doi": "", "comment": "11 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Tverberg의 정리는 고차원 조합기하의 고전적 결과이지만, McMullen의 문제(d=5에서의 convex position 점 배치 및 oriented matroid 구조)와는 직접적인 연관이 없음.", "summary": "저자들은 tolerance를 갖춘 Tverberg 정리에 대한 새로운 상한을 증명했으며, $N = rt+\\Theta_{d,r}(t^{1/2-1/(2d)})$ 형태의 점 개수 경계를 도출했다. 또한 이 결과를 초평면 족으로 확장하여 regression hull의 교집합 성질을 보이고, discrepancy 이론과의 연결을 확립했다.", "technique": "Discrepancy theory와 Tverberg-type 결과 간의 연결을 통해 점 및 초평면 집합의 분할 문제를 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25445v1", "title": "Back Stable Standard Elementary Monomials", "authors": ["Carlos Rodriguez"], "abstract": "We introduce back stable standard elementary monomials and their complete homogeneous analogues. These families form bases of the back stable Schubert ring and record the eventual standard elementary monomial expansions of left-stabilized Schubert polynomials. Dynkin reversal exchanges the two bases while preserving their coefficients. We also show that orbit sums of the back stable coefficients recover the elementary and complete homogeneous coefficients of Stanley symmetric functions. Finally, we study the shifted specialization polynomial $\\mathcal{T}_w(t)=\\mathfrak{S}_{1^t\\times w}(1)$, considered by Fomin and Kirillov, which counts reduced pipe dreams of $1^t\\times w$. We express this polynomial in terms of back stable standard elementary monomial coefficients.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T21:55:34+00:00", "updated": "2026-09-21T21:55:34+00:00", "abs_url": "http://arxiv.org/abs/2609.25445v1", "pdf_url": "https://arxiv.org/pdf/2609.25445v1", "journal_ref": "", "doi": "", "comment": "20 pages, 1 figure", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Back stable Schubert ring과 symmetric function 이론은 combinatorial 대수 구조를 다루지만, McMullen's problem의 convex position, oriented matroid, tope graph 등 이산기하학적 문제와는 직접 연관이 없음.", "summary": "본 논문은 back stable Schubert ring의 기저를 형성하는 back stable standard elementary monomial과 complete homogeneous analogue를 소개한다. Dynkin reversal을 통해 두 기저 사이의 관계를 규명하고, orbit sum이 Stanley symmetric function의 계수를 복원함을 보인다. 또한 Fomin-Kirillov의 shifted specialization polynomial을 back stable standard elementary monomial 계수로 표현한다.", "technique": "Back stable Schubert polynomial expansion과 symmetric function의 orbit sum 기법, reduced pipe dream 계수 추적.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.26397v1", "title": "Pairs of lattice complements with complementary homology", "authors": ["Sara Faridi", "Dharm Veer", "Volkmar Welker"], "abstract": "In this paper we study whether there is a global to local principle for the homology of order complexes of finite lattices. We explore whether the non-vanishing of the homology of a lattice in degree $a+b-2$ forces the existence of a pair of lattice-complements whose open intervals below have non-vanishing homology in degrees $a$ and $b$ respectively. We consider the same question also in the language of multigraded free resolutions. We provide positive evidence for the existence of such pairs and give counterexamples to strengthenings of the question.", "categories": ["math.CO", "math.AC"], "primary_category": "math.CO", "published": "2026-09-22T13:33:54+00:00", "updated": "2026-09-22T13:33:54+00:00", "abs_url": "http://arxiv.org/abs/2609.26397v1", "pdf_url": "https://arxiv.org/pdf/2609.26397v1", "journal_ref": "", "doi": "", "comment": "22 pages, 3 figures", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한 격자의 order complex 동형(homology)을 다루지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, 다면체 기하와는 직접 관련이 없음.", "summary": "유한 격자의 order complex에 대한 global-to-local 동형 원리를 연구한다. 특정 차수에서 격자의 동형이 0이 아닌지 여부가 보수적 격자 쌍(lattice-complements)의 존재를 강제하는지 탐구하고, 다중등급 자유 분해(multigraded free resolutions) 언어로도 같은 문제를 고찰한다.", "technique": "Order complex의 동형학, 격자 보수성(lattice complementarity) 분석, 다중등급 호몰로지 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.29808v1", "title": "Topological degree of fewnomial maps", "authors": ["Frédéric Bihan"], "abstract": "We study the topological degree on the positive orthant of a map $F:\\mathbb{R}^n_{>0}\\to\\mathbb{R}^n$ whose components are real polynomials, possibly with real exponents, with the same support $\\mathcal{A}$ of $N=n+k+1$ monomials. This degree is well defined under a half-space condition on the columns of the coefficient matrix indexed by the faces of the Newton polytope, which holds for generic exponents and coefficients. We give three formulas for it, all in terms of signs of maximal minors. The first one is a Viro formula: the degree is a signed count of the simplices of a regular triangulation of $\\mathcal{A}$ which are positively decorated in the sense of Bihan, Santos and Spaenlehauer. The second one is a sum over the facets of the Newton polytope, and the third one a sum over the vertices of the polyhedron of the Gale dual system. As a consequence, the degree only depends on the oriented matroids of the exponent and coefficient matrices restricted to the vertices of the Newton polytope. We also obtain a Descartes rule of signs for the degree and, in the generic case, the upper bound $|°F|<\\frac12\\min(M(n,N),M(k,N))$, where $M(d,N)$ is the largest number of facets of a $d$-polytope with $N$ vertices. This bound is sharp when $n=2$ or $k=2$. Using the H-duality of Bihan, Dickenstein and Forsgård, we show that the set of possible degrees is symmetric in $n$ and $k$. Since a nonzero degree forces a positive zero, our formulas give sign conditions for the existence of positive solutions, as well as parity statements for their number.", "categories": ["math.CO", "math.AG"], "primary_category": "math.CO", "published": "2026-10-21T14:34:25+00:00", "updated": "2026-10-21T14:34:25+00:00", "abs_url": "http://arxiv.org/abs/2610.29808v1", "pdf_url": "https://arxiv.org/pdf/2610.29808v1", "journal_ref": "", "doi": "", "comment": "34 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "oriented matroid의 개념이 등장하지만, 이 논문은 McMullen 문제나 Larman 추측과 직접 관련 없이 fewnomial 맵의 위상적 차수(topological degree)를 연구한다.", "summary": "이 논문은 $N=n+k+1$개의 단항식으로 구성된 동일한 지지집합 $\\mathcal{A}$를 갖는 실다항식 맵 $F:\\mathbb{R}^n_{>0}\\to\\mathbb{R}^n$의 양의 직교체(positive orthant) 위에서의 위상적 차수를 연구한다. 정규 삼각분할(regular triangulation)을 이용한 Viro 공식, Newton 다면체의 면(facet) 위 합산 공식, Gale 쌍대 시스템의 꼭짓점 위 합산 공식 등 세 가지 공식을 도출하며, 이 차수는 지수 행렬과 계수 행렬의 oriented matroid에만 의존함을 보인다. 부호 조건에 대한 Descartes 법칙과 상한 $|\\deg F| < \\frac{1}{2}\\min(M(n,N), M(k,N))$을 얻으며, 이를 통해 양의 해의 존재 조건 및 개수의 홀짝성을 도출한다.", "technique": "정규 삼각분할(regular triangulation)과 Gale 쌍대성(H-duality)을 활용하여 위상적 차수를 최대 소행렬식(maximal minor)의 부호들로 표현하는 세 가지 공식을 구성한다.", "connections": "추측: oriented matroid의 부호 조건과 실현가능성(realizability)은 McMullen 문제의 chirotope 접근과 형식적으로 유사하나, 직접적 연결 근거는 초록에 없음.", "keyword_hits": ["oriented matroid", "tope", "triangulation"], "source": "filter"}, {"id": "2610.28672v1", "title": "Triangulation, Volume, and Symmetries of the Dihedral Group Analogue of the Permutohedron", "authors": ["Colin Olairez"], "abstract": "We study the analogue of the permutohedron for the dihedral group, which we call the dihedral permutohedron. We determine the facet structure of the dihedral permutohedron, use the facet structure to construct a triangulation, and determine a nice combinatorial formula for the volume of the dihedral permutohedron. Lastly, we find a family of interesting unimodular affine symmetries of the odd dihedral permutohedron.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-18T18:32:00+00:00", "updated": "2026-10-18T18:32:00+00:00", "abs_url": "http://arxiv.org/abs/2610.28672v1", "pdf_url": "https://arxiv.org/pdf/2610.28672v1", "journal_ref": "", "doi": "", "comment": "21 pages, 4 figures", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이면체군(dihedral group)에 대한 permutohedron의 삼각분할(triangulation)을 다루지만, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와는 직접적인 연관이 없다.", "summary": "이 논문은 이면체군(dihedral group)에 대응하는 퍼뮤토헤드론(permutohedron)인 '이면 퍼뮤토헤드론(dihedral permutohedron)'을 연구한다. 패싯(facet) 구조를 결정하고, 이를 이용해 삼각분할(triangulation)을 구성하며, 부피(volume)에 대한 조합론적 공식을 유도한다. 추가로 홀수 이면 퍼뮤토헤드론의 유니모듈(unimodular) 아핀 대칭군 패밀리를 발견한다.", "technique": "패싯 구조를 활용한 삼각분할(triangulation) 구성 및 조합론적 부피 공식 도출.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.22829v1", "title": "KKM meets colorful Carathéodory", "authors": ["Alexander Polyanskii"], "abstract": "The colorful Carathéodory theorem states that if $V_1,\\dots,V_{d+1}\\subset\\mathbb R^d$ satisfy $0\\in\\mathrm{conv}\\;V_i$ for every $i$, then there exist points $v_i\\in V_i$ such that $0\\in\\mathrm{conv}\\;\\{v_1,\\dots,v_{d+1}\\}$.   We give a new proof based on triangulations and the classical KKM lemma. We lift the sets $V_i$ to parallel affine copies of $\\mathbb R^d$ in $\\mathbb R^d\\times\\mathbb R^d$ and use a triangulation of the resulting point configuration to construct a KKM cover. Using the same approach, we prove the very colorful Carathéodory theorem.", "categories": ["math.CO", "math.HO"], "primary_category": "math.CO", "published": "2026-10-16T02:11:09+00:00", "updated": "2026-10-16T02:11:09+00:00", "abs_url": "http://arxiv.org/abs/2610.22829v1", "pdf_url": "https://arxiv.org/pdf/2610.22829v1", "journal_ref": "", "doi": "", "comment": "6 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "colorful Carathéodory 정리는 볼록 위치(convex position) 및 일반 위치 점 배치와 관련된 조합론적 도구이나, McMullen 문제(d=5, Larman 추측 등)와 직접적 연관은 없음.", "summary": "이 논문은 colorful Carathéodory 정리($V_1,\\dots,V_{d+1}\\subset\\mathbb{R}^d$에서 각 $0\\in\\mathrm{conv}\\,V_i$이면 $v_i\\in V_i$가 존재하여 $0\\in\\mathrm{conv}\\{v_1,\\dots,v_{d+1}\\}$)에 대한 새로운 증명을 제시한다. 증명 방법은 집합 $V_i$를 $\\mathbb{R}^d\\times\\mathbb{R}^d$ 내의 평행한 아핀 복사본으로 올린 뒤, 해당 점 배치의 삼각분할(triangulation)을 이용하여 KKM 덮개(KKM cover)를 구성하는 방식이다. 동일한 접근법으로 'very colorful Carathéodory 정리'도 증명한다.", "technique": "점 집합을 $\\mathbb{R}^d\\times\\mathbb{R}^d$로 올려 삼각분할을 구성하고, 고전적인 KKM 보조정리를 적용하여 colorful Carathéodory 정리를 증명.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.25828v1", "title": "Piercing spanned lines and hyperplanes", "authors": ["Ben Lund"], "abstract": "Motzkin, Grünbaum, and Erdős and Purdy asked how many noncollinear blue points can coexist with $t$ red points in the real plane if every blue-spanned line contains a red point. We prove that there are at most $2.35t-3$ blue points, even over the complex numbers. For the complex higher-dimensional problem of Campbell, Kroeker, and Lund, we prove $b_k(t)\\le1.40k^2t$. Colorings of cyclic Dowling geometries give a matching lower bound in order of magnitude for all $k\\ge2$ and $t\\ge3$. The planar proof uses frame normalization and a second-moment estimate; the higher-dimensional proof combines the degree bound of Kroeker and Lund with principal truncation.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-19T05:44:06+00:00", "updated": "2026-10-19T05:44:06+00:00", "abs_url": "http://arxiv.org/abs/2610.25828v1", "pdf_url": "https://arxiv.org/pdf/2610.25828v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합기하학의 점 배치 문제이지만 McMullen's problem(볼록위치, 일반위치의 고차원 점 배치)과는 직접적 관련이 없으며, piercing/incidence 구조 최적화에 초점.", "summary": "평면에서 파란점이 이루는 직선이 모두 빨간점을 포함할 때, t개의 빨간점과 공존 가능한 파란점의 최대 개수는 2.35t-3개 이하임을 증명. 고차원에서는 cyclic Dowling geometries를 이용한 하한을 제시하여 점근적으로 일치하는 상한·하한을 얻음.", "technique": "frame normalization과 second-moment estimate(평면), degree bound 및 principal truncation의 조합(고차원)", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2606.24878v1", "title": "An Improved Lower Bound for the Erdős-Lovász Cover Number Problem", "authors": ["Varun Sivashankar"], "abstract": "Let $g(r)$ be the minimum number of edges in an $r$-uniform intersecting hypergraph with cover number $r$. Erdős and Lovász proved the lower bound $g(r)\\ge 8r/3-3$. We first give a completely elementary proof that $g(r)\\ge 3r-4$. We then build on the same approach and apply Kahn's small-codegree hypergraph edge-colouring theorem to improve this to $g(r)\\ge (61/20-o(1))r$. To the best of our knowledge, this is the first improvement over the Erdős-Lovász lower bound in about fifty years.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-23T17:55:10+00:00", "updated": "2026-06-23T17:55:10+00:00", "abs_url": "http://arxiv.org/abs/2606.24878v1", "pdf_url": "https://arxiv.org/pdf/2606.24878v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Erdős-Lovász cover number 문제는 hypergraph covering과 extremal combinatorics의 고전 문제이며, McMullen's problem(convex position, general position 배치)과는 직접적 주제 연관성이 없음.", "summary": "본 논문은 $r$-uniform intersecting hypergraph에서 cover number가 $r$일 때 최소 간선 수 $g(r)$에 대한 Erdős-Lovász 하한을 약 50년 만에 처음 개선한다. 초등적 증명으로 $g(r) \\ge 3r-4$를 얻고, Kahn의 small-codegree hypergraph edge-colouring 정리를 적용하여 $g(r) \\ge (61/20-o(1))r$로 개선한다.", "technique": "Kahn의 small-codegree hypergraph edge-colouring theorem을 extremal lower bound 개선에 적용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2606.24840v1", "title": "The inverse reduction map in the quantum Littlewood-Richardson bijection", "authors": ["Olga Azenhas"], "abstract": "In arXiv:2603.16698v5 we have explicitly computed the inverse of the reduction map in the quantum Littlewood-Richardson bijection for certain patterns of symplectic columns. It turns out that some of those patterns are cell pieces to compute the inverse of the reduction map on any symplectic column. For large symplectic columns, the tools provided here can be combined with the composition of the inverses of the several maps in which the reduction map decomposes, given by Watanabe, namely, among them, combinatorial $R$-matrices and reduction maps of shorter symplectic columns.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-23T17:19:20+00:00", "updated": "2026-06-23T17:19:20+00:00", "abs_url": "http://arxiv.org/abs/2606.24840v1", "pdf_url": "https://arxiv.org/pdf/2606.24840v1", "journal_ref": "", "doi": "", "comment": "17 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "양자 Littlewood-Richardson 대합과 symplectic column의 reduction map은 McMullen's problem의 convex position, oriented matroid, 조합적 구조와 직접적 관련이 없음.", "summary": "본 논문은 양자 Littlewood-Richardson 대합(quantum Littlewood-Richardson bijection)에서 reduction map의 역함수를 symplectic column의 특정 패턴에 대해 명시적으로 계산한다. 이러한 패턴들은 일반 symplectic column의 reduction map 역함수 계산을 위한 cell piece로 작용하며, Watanabe의 combinatorial $R$-matrices와 조합되어 큰 symplectic column에 적용될 수 있다.", "technique": "Symplectic column의 세포 구조(cell pieces) 분해와 combinatorial $R$-matrices를 이용한 reduction map의 역함수 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2606.24776v1", "title": "A disproof of the uniform witness conjecture", "authors": ["Zixiang Xu"], "abstract": "The study of $(d+1)$-uniform set systems with VC-dimension at most $d$ links the Erdős--Ko--Rado theorem with VC-dimension. But already in 1997, Ahlswede and Khachatrian showed that this is not the right extension of the Erdős--Ko--Rado theorem. In 2025, Chao, Xu, Yip and Zhang proposed the uniform witness conjecture as a possible right extension: for $0\\le s\\le d$, if every set of a $(d+1)$-uniform family has a missing trace of the same fixed size $s$, then the family should have size at most $\\binom{n-1}{d}$. They proved the conjecture when $s=d$, and when $s=1$ and $n$ is large. Very recently, Chao, Xu and Zakharov proved the conjecture when $s\\le \\frac{d}{2}$ and $n$ is large.   We fill in the missing half of the picture, although the picture is not the one suggested by the conjecture. More precisely, for $d\\ge 4$ and $\\left\\lceil \\frac{d+2}{2}\\right\\rceil\\le s\\le d-1$, we construct such a family $\\mathcal{F}\\subseteq\\binom{[n]}{d+1}$ with $|\\mathcal{F}|=\\binom{n-1}{d}+\\binom{n-2(d+1-s)-2}{2s-d-2}$ for every $n\\ge2(d+1)$, thereby disproving the uniform witness conjecture.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-23T16:35:12+00:00", "updated": "2026-06-23T16:35:12+00:00", "abs_url": "http://arxiv.org/abs/2606.24776v1", "pdf_url": "https://arxiv.org/pdf/2606.24776v1", "journal_ref": "", "doi": "", "comment": "5 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "VC-dimension과 uniform set systems를 다루지만 McMullen's problem(convex position의 combinatorial geometry)과는 직접적 관련 없음.", "summary": "본 논문은 2025년 제안된 uniform witness conjecture를 반박한다. 이 추측은 $(d+1)$-uniform family가 고정 크기 $s$의 missing trace를 모두 가질 때 크기가 $\\binom{n-1}{d}$를 넘지 않는다고 주장했으나, 저자는 $d\\ge 4$와 $\\lceil \\frac{d+2}{2}\\rceil\\le s\\le d-1$ 범위에서 명시적 반례를 구성하여 추측을 거짓임을 보인다.", "technique": "명시적 구성(explicit construction)을 통한 counterexample 제시, 특히 $|\\mathcal{F}|=\\binom{n-1}{d}+\\binom{n-2(d+1-s)-2}{2s-d-2}$ 형태의 가족 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2606.28041v1", "title": "The Erdos n^2/25 max-cut conjecture for small multiples of five, via a per-root-MaxCut envelope and blow-up integrality", "authors": ["Alper Ferudun"], "abstract": "Erdős conjectured that every triangle-free graph on $N$ vertices can be made bipartite by deleting at most $N^2/25$ edges; the bound would be sharp, attained by the balanced blow-up $C_5[N/5]$. Writing $β(G)$ for the minimum number of edges whose deletion makes $G$ bipartite and $a(N) = \\max\\{β(G):G$ triangle-free on $N$ vertices$\\}$, the conjecture is $a(N)\\le N^2/25$, and for $N=5n$ it reads $a(5n)\\le n^2$. Balogh, Clemen and Lidícký proved it for large $N$ in the two density tails (edge density at most $0.2486$ or at least $0.3197$) and proved the global bound $a(N)\\le N^2/23.5$; the medium-density band remains open. We prove \\[ a(5n) = n^2 \\qquad \\text{for every } 1 \\le n \\le 40, \\quad \\text{i.e. } N \\in \\{5,10,\\dots,200\\}. \\] The proof is computer-assisted and combines three ingredients. (i) A \\emph{per-root-MaxCut envelope}: for the $107$ triangle-free $7$-root types, the mean over types of the best per-type cut is an upper bound $d_{\\rm mono}(W)\\le U_7(W)$ that is \\emph{tight} at the $C_5$-blow-up. (ii) An order-$10$ flag-algebra certificate -- the per-root-MaxCut rows at $7$ and $8$ roots together with rooted-Horn cuts and a manifestly-PSD moment block -- bounds the envelope on the medium band, $U_7(W)\\le \\tfrac{2}{25}+δ$ with an explicit rational $δ\\approx 4.8558\\times10^{-5}$, for every triangle-free graphon $W$ of edge density in $[0.2486,0.3197]$. (iii) The blow-up identity $β(G[t])=t^2β(G)$ plus integrality of $β$ turns this into $β(G)\\le n^2+\\tfrac{25}{2}n^2δ$ for any $5n$-vertex band-density $G$, and $\\tfrac{25}{2}n^2δ<1$ for $n\\le 40$; the two density tails are handled by the Balogh-Clemen-Lidícký bounds, transferred to finite $N$ by the same blow-up. The envelope bound $d_{\\rm mono} \\le U_7$ is a genuine graphon upper bound (each per-root rule is one global $2$-colouring), the certificate is verified in exact rational arithmetic, the moment positivity is Razborov's flag-algebra theorem exhibited as an exact Gram factorization, and the bound is cross-checked against brute-force max-cut on all triangle-free graphs of order at most $12$. The same envelope at orders $9$ and $10$ provably does not reach the constant needed for larger $n$; we explain why, and locate the all-$n$ conjecture at a single self-tight obstruction.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-26T12:44:10+00:00", "updated": "2026-06-26T12:44:10+00:00", "abs_url": "http://arxiv.org/abs/2606.28041v1", "pdf_url": "https://arxiv.org/pdf/2606.28041v1", "journal_ref": "", "doi": "", "comment": "9 pages. Computer-assisted. Ancillary files: order-10 per-root-MaxCut + rooted-Horn flag-algebra certificate with an independent exact-arithmetic verifier, a self-contained brute-force max-cut ground-truth checker, and the manifestly-PSD moment Gram certificate", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Erdős max-cut conjecture는 그래프 이론의 극값 문제이며, McMullen's problem(convex polytope의 combinatorial structure)과는 주제와 기법이 근본적으로 다릅니다.", "summary": "본 논문은 삼각형 없는 그래프에서 이분 그래프로 만들기 위해 삭제해야 할 최대 간선 수에 관한 Erdős 추측을 다룹니다. Flag algebra와 blow-up 항등식을 결합한 컴퓨터 보조 증명으로 $N \\in \\{5,10,\\ldots,200\\}$에 대해 $a(5n)=n^2$을 증명합니다.", "technique": "Per-root-MaxCut envelope(107개 삼각형 없는 7-근 타입에 대한 평균 상한)과 10차 flag-algebra certificate를 조합하여 graphon의 중간 밀도 대역에서 경계를 확립하고, blow-up 항등식 $\\beta(G[t])=t^2\\beta(G)$의 정확성을 이용합니다.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.30481v1", "title": "The Multicolour Size--Ramsey Number of an Even Cycle", "authors": ["Lanchao Wang", "Xiaolin Wang"], "abstract": "We determine the $k$-colour size--Ramsey number of even cycles up to absolute constant factors. For every $k\\ge2$ and every even $n\\ge100\\log k$, \\[ \\widehat R_k(C_n)=Θ(k^2\\log k)n. \\] The lower bound follows from the corresponding result of Beke, Li and Sahasrabudhe for paths, while our upper bound improves the previous best estimate $O(k^{34}n)$ of Javadi, Kohayakawa and Miralaei.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-31T09:07:08+00:00", "updated": "2026-08-31T09:07:08+00:00", "abs_url": "http://arxiv.org/abs/2608.30481v1", "pdf_url": "https://arxiv.org/pdf/2608.30481v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "짝수 사이클의 크기-Ramsey 수를 결정하는 극단 그래프 이론 문제로, McMullen's problem(볼록 위치 점 배치, oriented matroid, 조합 구조)과는 직접적 관련이 없음.", "summary": "이 논문은 모든 $k \\geq 2$와 $n \\geq 100\\log k$에 대해 짝수 사이클 $C_n$의 $k$-색 크기-Ramsey 수가 $\\widehat{R}_k(C_n) = \\Theta(k^2\\log k)n$임을 보인다. 하한은 경로에 대한 기존 결과로부터 따르고, 상한은 이전의 $O(k^{34}n)$ 추정치를 개선한다.", "technique": "경로에 대한 Beke, Li, Sahasrabudhe의 결과 활용 및 상한 개선 기법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.29525v1", "title": "Anti-Ramsey Number for Suspension of Edge-Critical Graphs", "authors": ["Shuchao Li", "Haojie Zheng"], "abstract": "An edge-colored graph is called a rainbow graph if all its edges have distinct colors. The \\textit{anti-Ramsey number}, denoted by $\\ar(n,F),$ for a fixed graph $F$ and a positive integer $n$, is the maximum number of colors used in an edge-coloring of the complete graph $K_n$ that contains no rainbow copy of $F$. Meanwhile, the \\textit{Turán number}, denoted by $\\ex(n,F),$ for graph $F$ and $n$, is the maximum number of edges in an $n$-vertex graph that does not contain $F$ as a subgraph. For a vertex $v$ and a multiset $\\mathcal{H}$ of graphs, the \\textit{suspension} $\\mathcal{H} + v$ of $\\mathcal{H}$ is the graph obtained by connecting the vertex $v$ to all vertices of $H$ for each $H \\in \\mathcal{H}$. Let integers $k\\ge 1$ and $r\\ge 2$ be fixed, and suppose that $\\mathcal{H}_{k+1}=\\{H_1, H_2, \\ldots, H_{k+1}\\}+v$ satisfying $H_1, H_2, \\ldots, H_{k+1}$ are pairwise vertex-disjoint edge-critical graphs, and $χ(H_i)=r$ for $i=1,2,\\ldots, k+1$.In this paper, we determine $ \\ar(n,\\mathcal{H}_{k+1}) $ for $k\\ge 1$, $r\\ge 2$ and sufficiently large $n$. This result unifies and generalizes a result of Liu et al. (arXiv:2411.08475) concerning the friendship graph, and a result of Lu et al. (arXiv:2507.13165) on the intersecting cliques.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-30T03:07:18+00:00", "updated": "2026-08-30T03:07:18+00:00", "abs_url": "http://arxiv.org/abs/2608.29525v1", "pdf_url": "https://arxiv.org/pdf/2608.29525v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Anti-Ramsey 수와 edge-coloring 문제는 McMullen's problem의 convex position, oriented matroid, chirotope와 직접 관련이 없음.", "summary": "본 논문은 edge-critical 그래프의 suspension에 대한 anti-Ramsey 수 $\\ar(n,\\mathcal{H}_{k+1})$을 결정한다. 이는 friendship graph와 intersecting cliques 관련 선행 결과를 통합·일반화한다.", "technique": "Anti-Ramsey 수와 Turán 수의 관계를 이용하여 충분히 큰 $n$에 대해 정확한 값을 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.10402v1", "title": "Superpolynomial lower bounds for vertex numbers of real projective space triangulations via a topological Figiel-Lindenstrauss-Milman theorem", "authors": ["Florian Frick", "Kaave Hosseini", "Eric Myzelev", "Arya Narnapatti", "Aliaksei Vasileuski"], "abstract": "We prove that every simplicial triangulation of real projective $d$-space has $\\exp(Ω(\\sqrt d))$ vertices. Together with known constructions, this determines the minimum vertex number as $μ_d=\\exp(d^{1/2+o(1)})$. The result follows from a topological generalization of the Figiel--Lindenstrauss--Milman inequality, answering a recent question of Frick, Hosseini, and Vasileuski: a finite strongly regular CW complex with a free cellular involution, $v$ vertices, and $f$ maximal cells has $\\mathbb{Z}/2$-index at most $O(\\log v\\log f)$. We bound the dimensions of Morse cells by a trace estimate for a constrained Hessian, obtaining a Morse-theoretic proof of the classical inequality for centrally symmetric polytopes. As further applications of this inequality, we give an $\\exp(Ω(\\sqrt t))$ lower bound for the order of a triangle-free topologically $t$-chromatic graph and bound the index of sign complexes by $O(d\\log^2 N)$ for total matrices and $O(d\\log^3 N)$ for partial matrices, where $N\\geq2$ is the number of columns and $d\\geq1$ is the VC dimension.", "categories": ["math.CO", "math.GT"], "primary_category": "math.CO", "published": "2026-09-09T16:22:33+00:00", "updated": "2026-09-09T16:22:33+00:00", "abs_url": "http://arxiv.org/abs/2609.10402v1", "pdf_url": "https://arxiv.org/pdf/2609.10402v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 실사영공간의 삼각분할 꼭짓점 수의 하한을 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid 의 acyclic reorientation 등)와 직접적인 관련이 없다.", "summary": "실사영 $d$-공간의 단체 삼각분할은 반드시 $\\exp(\\Omega(\\sqrt{d}))$개의 꼭짓점을 가짐을 증명하여, 최소 꼭짓점 수가 $\\mu_d = \\exp(d^{1/2+o(1)})$임을 결정한다. 이는 Figiel–Lindenstrauss–Milman 부등식의 위상적 일반화를 통해 얻어지며, 자유 셀형 대합(free cellular involution)을 갖는 유한 강정칙 CW 복합체에서 $\\mathbb{Z}/2$-index가 $O(\\log v \\log f)$로 유계됨을 보인다. 추가 응용으로 삼각형-없는 위상적 $t$-채색 그래프의 크기 하한 및 부호 복합체(sign complex)의 index 상한도 도출된다.", "technique": "Morse 이론적 접근(제약된 헤시안의 트레이스 추정을 통한 Morse 셀 차원 제한)과 위상적 Figiel–Lindenstrauss–Milman 부등식의 일반화.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.17493v1", "title": "Twisted Bracelets for Sorting by Transpositions: the Transposition Diameter of $S_{16}$", "authors": ["Luiz A. G. Silva", "Luis A. B. Kowada", "Noraí R. Rocco", "Maria E. M. T. Walter"], "abstract": "Sorting By Transpositions (SBT) seeks the minimum number of transpositions required to sort a permutation $π$ on $n$ symbols into the identity $ι$. Let $N=n+1$. A cyclic-target pair $(ω,β)$ consists of an even permutation $ω$ and an $N$-cycle $β$ such that $ρ=ωβ$ is also an $N$-cycle. An SBT instance is the special case $(\\barι {\\barπ}^{-1},\\barπ)$, where $\\barπ$ and $\\barι$ are $N$-cycles corresponding to $π$ and $ι$, respectively, and $\\barι {\\barπ}^{-1}\\barπ=\\barι$, so its target is $\\barι$. For each prescribed fixed-point-free cycle type with specified cycle orientations relative to $β$, fixed-content words encode the corresponding permutations $ω$. Colors identify cycles and ranks record their orientations. A word is realizable when the associated product $ρ=ωβ$ is an $N$-cycle. Permuting equal-part colors and shifting rank origins give auxiliary symmetries. Together with word rotation and position reflection combined with rank inversion, they define a twisted dihedral action. Its orbits are twisted bracelets, and the realizable orbits are in bijection with extended-toric equivalence classes of cyclic-target pairs. Here extended-toric equivalence means Eriksson et al.'s toric equivalence with reflection adjoined. This correspondence yields exact orbit counts and direct generation of one representative per realizable extended-toric class. The transposition diameter $TD(n)$ is the largest transposition distance in $S_n$. Previously, $9\\leq TD(16)\\leq10$ was known, and $16$ was the only unresolved value for $n\\leq17$. Combining fixed-point contraction and structural reductions with exhaustive verification of the remaining twisted bracelets, we prove $TD(16)=9$, closing a twenty-five-year gap.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T17:35:37+00:00", "updated": "2026-09-15T17:35:37+00:00", "abs_url": "http://arxiv.org/abs/2609.17493v1", "pdf_url": "https://arxiv.org/pdf/2609.17493v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 치환의 전위(transposition) 지름을 다루는 조합론 논문으로, McMullen 문제(볼록 위치, oriented matroid, 실현 가능성)와 직접적인 관련이 없다.", "summary": "이 논문은 $n$개의 기호에 대한 치환을 전위(transposition)로 정렬하는 데 필요한 최소 전위 수, 즉 전위 지름 $TD(n)$을 연구한다. twisted bracelet(꼬인 팔찌)이라는 조합론적 구조와 extended-toric 동치류를 도입하여 cyclic-target 쌍을 체계적으로 분류하고, 소진적 검증을 통해 25년간 미해결이었던 $TD(16)=9$를 증명한다.", "technique": "fixed-content word의 twisted dihedral action에 의한 궤도(twisted bracelet) 분류, fixed-point contraction 및 구조적 축소를 결합한 소진적 검증.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.16195v1", "title": "Combinatorial slicing problems of polytopes: How (not) to reconstruct a polytope from its slices", "authors": ["Anna Birkemeyer", "Anouk E. Brose", "Marie-Charlotte Brandenburg", "Niklas Prün"], "abstract": "We study combinatorial aspects of hyperplane sections of polytopes, focusing on how much the combinatorics of the sections determines the combinatorics of the original polytope. We show that, in general, combinatorial information about the sections is not enough to determine even the $f$-vector of the polytope. In contrast, for sufficiently generic simple polytopes, the function recording the number of vertices of each central section determines the full combinatorial type. We organize different combinatorial slicing properties into hierarchies, separately for affine and central sections, according to the level of combinatorial structure they determine on the polytope. In analogy with classical metric slicing problems, we formulate combinatorial analogues of the Busemann-Petty problem and Bourgain's slicing problem by replacing volume with face numbers, and show that they fail in every dimension and every face dimension.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T18:27:49+00:00", "updated": "2026-09-14T18:27:49+00:00", "abs_url": "http://arxiv.org/abs/2609.16195v1", "pdf_url": "https://arxiv.org/pdf/2609.16195v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체의 하이퍼평면 단면의 조합론적 성질을 연구하며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 다면체의 하이퍼평면 단면(슬라이스)의 조합론적 정보가 원래 다면체의 조합론적 구조를 얼마나 결정하는지를 연구한다. 일반적으로 단면의 조합론적 정보만으로는 다면체의 $f$-벡터조차 결정할 수 없지만, 충분히 일반적인 단순 다면체(simple polytope)에 대해서는 중심 단면의 꼭짓점 수 함수가 완전한 조합론적 유형을 결정함을 보인다. 또한 Busemann-Petty 문제와 Bourgain의 슬라이싱 문제의 조합론적 유사체를 공식화하고, 이들이 모든 차원 및 모든 면 차원에서 성립하지 않음을 보인다.", "technique": "아핀 단면과 중심 단면을 분리하여 조합론적 슬라이싱 성질을 계층적으로 조직화하고, 고전적 계량 슬라이싱 문제의 조합론적 유사체를 구성하는 방법론을 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.14895v1", "title": "Level structures on tropical abelian varieties", "authors": ["Eran Assaf", "Madeline Brandt", "Juliette Bruce", "Melody Chan", "Raluca Vlad"], "abstract": "We introduce level structures on tropical abelian varieties and give a modular interpretation of $A_g[m]^{\\mathrm{trop}}$, the tropicalization of the moduli space $\\mathcal{A}_g[m]$ of principally polarized abelian varieties with level $m$ structure. We study the case of abelian surfaces in greater depth. The link of $A_2[m]^{\\mathrm{trop}}$ is an explicit simplicial complex whose vertices are the primitive vectors of $(\\mathbb{Z}/m\\mathbb{Z})^4$ up to sign. As a topological space, this link is homotopic to a wedge sum of closed orientable surfaces and circles; we compute the number of each of these and the genera of the surfaces. We deduce the weight zero compactly supported rational cohomology of $\\mathcal{A}_2[m]$, completing a calculation of Oda-Schwermer from 1990.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-09-14T01:29:26+00:00", "updated": "2026-09-14T01:29:26+00:00", "abs_url": "http://arxiv.org/abs/2609.14895v1", "pdf_url": "https://arxiv.org/pdf/2609.14895v1", "journal_ref": "", "doi": "", "comment": "19 pages, 3 figures; comments welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 열대 아벨 다양체의 레벨 구조와 모듈라이 공간의 코호몰로지를 다루며, McMullen 문제(볼록 위치·oriented matroid·점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 열대 아벨 다양체(tropical abelian varieties)에 레벨 구조를 도입하고, 레벨 $m$ 구조를 가진 주편극 아벨 다양체의 모듈라이 공간 $\\mathcal{A}_g[m]$의 열대화 $A_g[m]^{\\mathrm{trop}}$에 대한 모듈러 해석을 제공한다. 아벨 곡면($g=2$) 경우에 집중하여, $A_2[m]^{\\mathrm{trop}}$의 링크가 $(\\mathbb{Z}/m\\mathbb{Z})^4$의 부호 동치류 원시 벡터를 꼭짓점으로 하는 단체 복합체(simplicial complex)임을 규명하고, 이 위상 공간이 닫힌 가향 곡면과 원의 쐐기합(wedge sum)에 호모토픽임을 보인다. 이를 통해 1990년 Oda-Schwermer의 미완 계산을 완성하여 $\\mathcal{A}_2[m]$의 무게 0 컴팩트 지지 유리 코호몰로지를 결정한다.", "technique": "열대 기하학(tropical geometry)과 단체 복합체 위상 분석을 결합하여 레벨 구조의 모듈러 해석 및 코호몰로지 계산을 수행한다.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2609.14645v1", "title": "A short polyhedral proof of the infinitesimal Stoker conjecture", "authors": ["Martin Winter"], "abstract": "The infinitesimal Stoker conjecture states that an infinitesimal deformation of a convex polytope that preserves all dihedral angles also preserves all normal directions up to isometry. We give a short polyhedral proof, self-contained up to assuming spectral and geometric properties of the Izmestiev matrix.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-09-13T16:31:03+00:00", "updated": "2026-09-13T16:31:03+00:00", "abs_url": "http://arxiv.org/abs/2609.14645v1", "pdf_url": "https://arxiv.org/pdf/2609.14645v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체의 이면각 보존 변형에 관한 infinitesimal Stoker 추측을 다루며, McMullen 문제(점 배치·oriented matroid 관련)와 직접적인 관련이 없다.", "summary": "이 논문은 볼록 다면체의 무한소 변형(infinitesimal deformation)이 모든 이면각(dihedral angle)을 보존하면 등거리 변환(isometry)을 제외하고 모든 법선 방향(normal direction)도 보존된다는 infinitesimal Stoker 추측에 대한 짧고 자기완결적인 다면체적 증명을 제시한다. 증명은 Izmestiev 행렬의 스펙트럼적·기하학적 성질을 가정한 위에서 전개된다.", "technique": "Izmestiev 행렬(Izmestiev matrix)의 스펙트럼 및 기하학적 성질을 활용한 다면체적(polyhedral) 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.13757v1", "title": "The crossing number and the unit-distance crossing number of the Hamming graphs H(d,3)=K_3^{box d}, and their realizations over many coordinate fields", "authors": ["Haroldo Costa Silva Filho"], "abstract": "The Hamming graph H(d,3)=K_3^{box d} (n=3^d vertices) is the graph of single-symbol errors of ternary codes, yet we ask a geometric question of it: can it be drawn in the plane with every edge exactly one unit long and no two non-adjacent vertices a unit apart? It can, for every d, joining two problems into one.   Where does it live? As a Minkowski sum of unit triangles, each H(d,3) has a hidden flexibility carrying its coordinates up the constructibility ladder (compass, origami, and beyond), so one graph is realizable over many number fields at once, in the plane and in R^3 (edim(H(d,q))=q-1). Yet almost every faithful realization is transcendental: the Galois picture is a measure-zero shadow of a vast transcendental continuum, matching the exists-R hardness of unit-distance recognition.   How crowded must a unit drawing be? We separate the ordinary crossing number from a unit-distance crossing number (absent from Schaefer's survey), and one recursion H(d,3)=H(d-1,3) box K_3 controls both. We prove cr(H)=Theta(n^2), with sharp one-page constant 7/6; and Omega(n^2) <= udcr(H) <= O(n^2 log n) by concentration, plus a closed-form majorant (3/2)n^2(L^2-L+1), L=log_3 n. The least-crossing drawing we find is constructible (origami): field and crossings are two readings of one geometry. All claims are verified computationally; the lower bound udcr=Omega(n^2 log n) is the central open problem.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-12T07:08:19+00:00", "updated": "2026-09-12T07:08:19+00:00", "abs_url": "http://arxiv.org/abs/2609.13757v1", "pdf_url": "https://arxiv.org/pdf/2609.13757v1", "journal_ref": "", "doi": "", "comment": "45 pages. Reproducible Python code included", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 해밍 그래프의 교차수(crossing number)와 단위거리 실현(unit-distance realization)을 다루며, McMullen 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "해밍 그래프 $H(d,3)=K_3^{\\boxtimes d}$ ($n=3^d$ 꼭짓점)에 대해 단위거리 그래프로서의 평면 실현 가능성을 연구하고, 교차수(crossing number)와 단위거리 교차수(unit-distance crossing number)를 분리하여 분석한다. 귀납적 관계 $H(d,3)=H(d-1,3)\\boxtimes K_3$를 이용해 $\\mathrm{cr}(H)=\\Theta(n^2)$ (상수 $7/6$)와 $\\Omega(n^2)\\le\\mathrm{udcr}(H)\\le O(n^2\\log n)$을 증명하며, 닫힌 형태의 상계 $(3/2)n^2(L^2-L+1)$, $L=\\log_3 n$도 제시한다. 또한 좌표 체계의 관점에서 실현이 대수적(작도 가능, origami)에서 초월적 연속체까지 다양하게 존재함을 보인다.", "technique": "Minkowski 합 구조와 귀납적 재귀 $H(d,3)=H(d-1,3)\\boxtimes K_3$를 이용한 교차수 점화식 분석, 집중 부등식(concentration inequality)을 통한 하계 도출.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.13122v1", "title": "A base-$8$ upper bound for planar peeling sequences", "authors": ["André Hisatsuga", "Griffin Johnston", "Rafael Miyazaki"], "abstract": "Let $g(n)$ denote the minimum number of peeling sequences among all $n$-point sets in general position in the plane. Dumitrescu and Tóth proved an exponential upper bound with base $12.29$, and Simon subsequently lowered the base to $9.78$. Using the same recursive construction, we prove \\begin{equation*}   g(n) \\le (8+o(1))^n. \\end{equation*}", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-11T17:51:07+00:00", "updated": "2026-09-11T17:51:07+00:00", "abs_url": "http://arxiv.org/abs/2609.13122v1", "pdf_url": "https://arxiv.org/pdf/2609.13122v1", "journal_ref": "", "doi": "", "comment": "6 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 점 집합의 peeling sequence 수에 관한 조합론 문제를 다루며, McMullen 문제나 Larman 추측과 직접적 관련이 없다.", "summary": "이 논문은 평면에서 일반 위치(general position)에 있는 $n$개 점 집합에서 peeling sequence의 최소 개수 $g(n)$에 대한 상한을 개선한다. Dumitrescu-Tóth의 밑수 $12.29$, Simon의 $9.78$에 이어, 동일한 재귀적 구성(recursive construction)을 활용하여 $g(n) \\le (8+o(1))^n$을 증명한다.", "technique": "기존 재귀적 구성(recursive construction)을 정밀화하여 지수적 상한의 밑수를 $9.78$에서 $8+o(1)$로 낮춤.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2609.12640v1", "title": "Non-convex unit-edge polytopes on kissing configurations in dimensions 5-7", "authors": ["Matthew Self"], "abstract": "All nine known conjecturally optimal non-lattice kissing configurations in dimensions 5, 6, and 7 are the vertex sets of polytopes with only unit edges. Eight of the nine are non-convex, and the contact polytopes, the convex hulls of the same points, have longer edges. The edges of the unit-edge polytopes are exactly the contacts of the configuration. All but two of the nine are constructed from the lattice contact polytope in the same dimension by splitting some of its facets and reassembling the pieces. This is a geometric construction, distinct from the constructions by layers. The facets that fold when split are consecutive members of the Gosset series $k_{21}$, and a split in dimension $n$ folds to the inner product $1/(10-n)$: $1/5$, $1/4$, or $1/3$. These are the inner products by which the contact polytopes differ from the lattice one. All 12 unit-edge polytopes, the nine and the three lattice ones, are creased, a class we define that extends convexity by admitting shallow folds that reach no more than halfway. Each is the only creased unit-edge polytope on its vertex set. Every statement is certified in exact arithmetic.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-09-11T09:41:13+00:00", "updated": "2026-09-11T09:41:13+00:00", "abs_url": "http://arxiv.org/abs/2609.12640v1", "pdf_url": "https://arxiv.org/pdf/2609.12640v1", "journal_ref": "", "doi": "", "comment": "16 pages, 3 figures, 5 tables. Ancillary files contain the verification code and data (Python standard library only)", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 5~7차원 키싱(kissing) 배치와 unit-edge polytope에 관한 것으로, McMullen 문제(일반 위치 점 배치, oriented matroid, f(5)=11 등)와 직접적인 관련이 없다.", "summary": "이 논문은 5, 6, 7차원에서 알려진 9개의 비격자(non-lattice) 최적 키싱 배치가 모두 단위 모서리(unit edge)만을 갖는 폴리토프의 꼭짓점 집합임을 보인다. 그 중 8개는 비볼록이며, 이들 unit-edge 폴리토프의 모서리는 정확히 키싱 배치의 접촉(contact)에 해당한다. 저자는 'creased' 폴리토프라는 새로운 볼록성 일반화 개념을 도입하고, 12개의 unit-edge 폴리토프 각각이 자신의 꼭짓점 집합 위에서 유일한 creased unit-edge 폴리토프임을 정확 산술(exact arithmetic)로 검증한다.", "technique": "격자 접촉 폴리토프(lattice contact polytope)의 일부

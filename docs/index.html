관한 것으로, McMullen 문제(d=5에서의 점 배치, oriented matroid, chirotope 등)와 직접적인 관련이 없다.", "summary": "이 논문은 $\\mathbb{R}^n$의 볼록 다면체(convex polytope) 위에서 정의된 $\\operatorname{SL}(n)$-공변(covariant) 대칭 텐서 값값(valuation)을 연속성 가정 없이 완전히 분류한다. 주된 결과는 이러한 조건을 만족하는 유일한 값값이 모멘트 텐서(moment tensor)임을 보이는 것이다.", "technique": "연속성 가정 없는 대수적·조합론적 분류 기법을 통해 SL(n)-공변 대칭 텐서 값값의 유일성을 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.21501v2", "title": "Ehrhart positivity for paving positroids", "authors": ["Feihu Liu", "Zihao Zhang"], "abstract": "A central conjecture of Ferroni, Jochemko, and Schröter posits that every positroid is Ehrhart positive. While Ehrhart positivity has recently been verified for notable classes such as lattice path matroids and series-parallel matroids, the general conjecture remains open. In this paper, we prove that the base polytope of any paving positroid has positive Ehrhart coefficients. This establishes a new class of Ehrhart positive positroids and provides substantial evidence supporting this conjecture.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-15T08:37:26+00:00", "updated": "2026-10-16T15:00:55+00:00", "abs_url": "http://arxiv.org/abs/2610.21501v2", "pdf_url": "https://arxiv.org/pdf/2610.21501v2", "journal_ref": "", "doi": "", "comment": "Fixed LaTeX \\cref{} display errors; mathematical content unchanged", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 positroid의 Ehrhart 계수 양성(Ehrhart positivity)에 관한 것으로, McMullen's problem이나 Larman conjecture와 직접적 관련이 없다.", "summary": "Ferroni, Jochemko, Schröter의 추측—모든 positroid는 Ehrhart positive하다—의 일부로서, 본 논문은 paving positroid의 base polytope가 양의 Ehrhart 계수를 가짐을 증명한다. 이는 lattice path matroid 및 series-parallel matroid에 이어 새로운 Ehrhart positive positroid 클래스를 확립하며, 일반 추측에 대한 실질적 증거를 제공한다.", "technique": "", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.29659v1", "title": "Small and Large Quasi-Kernels in General Digraphs", "authors": ["Daniel Rutschmann"], "abstract": "In a digraph $D$, a set $Q$ of vertices is a quasi-kernel if $Q$ is an independent set and every vertex in $D$ can be reached from $Q$ via at most two edges. The small quasi-kernel conjecture by Erdős and Székely predicts that every source-free $n$-vertex digraph contains a quasi-kernel of size at most $n - n/2$. Chvátal and Lovász' 1974 work implies a bound of $n - \\sqrt{n}+1$. In 2024, Sprio shows the bound $n - \\frac{1}{4} \\sqrt{n \\log_2 n}$. We show that there always is a quasi-kernel of size at most $n - \\frac{1}{51}n^{2/3} / \\ln^{2/3}(n)$.   For the related large quasi-kernel conjecture by Spiro, we show that there always is a quasi-kernel $Q$ with $|N^+[Q]| \\ge 0.2917 \\cdot n^{2/3} / \\ln^{2/3}(n)$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-21T12:39:22+00:00", "updated": "2026-10-21T12:39:22+00:00", "abs_url": "http://arxiv.org/abs/2610.29659v1", "pdf_url": "https://arxiv.org/pdf/2610.29659v1", "journal_ref": "", "doi": "", "comment": "Preprint submitted to the Journal of Graph Theory", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학이나 점의 일반위치(general position) 배치, oriented matroid, 볼록다각형 등과 직접 관련이 없는 순수 그래프 이론 문제.", "summary": "Directed graph에서 quasi-kernel의 크기에 대한 상한을 개선한다. 이전 $n - \\sqrt{n}+1$, $n - \\frac{1}{4}\\sqrt{n\\log_2 n}$의 상한을 $n - \\frac{1}{51}n^{2/3}/\\ln^{2/3}(n)$로 강화하고, large quasi-kernel conjecture에 대해서도 새로운 하한을 도출한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.31001v1", "title": "Triangulation of orbifolds with corners", "authors": ["Hao Yu"], "abstract": "We prove that every compact orbifold with corners admits a triangulation in which the image of every codimension one face is a subcomplex. Faces need not be embedded, and the local groups may permute boundary components. The proof turns the boundary hyperplanes of linear charts into mirrors by means of the squaring map, which, unlike the folding $y\\mapsto|y|$, is compatible with smooth changes of charts, and then applies the triangulation theorem for orbit spaces of proper Lie groupoids.", "categories": ["math.GT", "math.AT"], "primary_category": "math.GT", "published": "2026-10-22T09:42:25+00:00", "updated": "2026-10-22T09:42:25+00:00", "abs_url": "http://arxiv.org/abs/2610.31001v1", "pdf_url": "https://arxiv.org/pdf/2610.31001v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 orbifold with corners의 삼각분할에 관한 위상기하학·기하학적 군론 연구로, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "이 논문은 모든 compact orbifold with corners가 여차원 1 면(face)의 상(image)이 부분복합체(subcomplex)를 이루는 삼각분할을 가짐을 증명한다. 핵심 아이디어는 선형 차트(linear chart)의 경계 초평면을 제곱 사상(squaring map)으로 거울(mirror)로 변환하는 것인데, 이 사상은 절댓값 접기($y\\mapsto|y|$)와 달리 차트의 매끄러운 변환(smooth change of charts)과 양립 가능하다. 이후 적절한 Lie groupoid의 궤도 공간(orbit space)에 대한 삼각분할 정리를 적용하여 결론을 도출한다.", "technique": "경계 초평면을 제곱 사상(squaring map)으로 거울로 변환한 뒤, proper Lie groupoid의 궤도 공간에 대한 삼각분할 정리를 적용.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.30993v1", "title": "Landfall Geometry", "authors": ["Frances Kirwan", "Vidit Nanda"], "abstract": "We study the negative gradient flow of analytic maps $f:X\\to\\R$ defined on compact analytic Riemannian manifolds without imposing any nondegeneracy or transversality assumptions. We construct tight isolating blocks around the connected components of the critical set $\\Crit(f)$ and record only bounded-time contacts made after an orbit exits one block and before it makes landfall within the interior of another. These contacts assemble into a strict topological category $\\cL$ -- called the landfall category -- whose classifying space $B\\cL$ is shown to be simple homotopy equivalent to $X$ naturally over all down-sets of the flow partial order. The filtered homotopy type is independent of the isolating blocks. Passing to a finite subanalytic triangulation yields a flow-induced acyclic partial matching, and hence, an explicit finite chain complex generated by the non-exit simplices of the blocks which computes the homology of $X$. The finite model also computes the Morse--Conley spectral sequence over arbitrary coefficients; over a field, homological perturbation further produces a connection matrix whose entries are finite sums over descending contact itineraries.", "categories": ["math.AT", "math.DS"], "primary_category": "math.AT", "published": "2026-10-22T09:36:22+00:00", "updated": "2026-10-22T09:36:22+00:00", "abs_url": "http://arxiv.org/abs/2610.30993v1", "pdf_url": "https://arxiv.org/pdf/2610.30993v1", "journal_ref": "", "doi": "", "comment": "33 pages, 1 figure, comments welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 해석적 Riemannian 다양체 위의 음의 기울기 흐름과 위상적 범주(landfall category)를 다루는 대수적 위상수학·동역학계 논문으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 비퇴화성 가정 없이 컴팩트 해석적 Riemannian 다양체에서 정의된 함수 $f:X\\to\\mathbb{R}$의 음의 기울기 흐름을 연구한다. 임계 집합의 연결 성분 주변에 tight isolating block을 구성하고, 궤도가 한 블록을 빠져나간 후 다른 블록에 도달하기까지의 접촉 정보를 모아 'landfall category' $\\mathcal{L}$를 정의하며, $B\\mathcal{L}$이 $X$와 단순 호모토피 동치임을 보인다. 이를 유한 부분해석적 삼각분할에 적용하면 Morse–Conley 스펙트럴 수열과 연결 행렬을 명시적으로 계산하는 유한 체인 복합체를 얻는다.", "technique": "tight isolating block 구성, strict topological category(landfall category)의 분류 공간 분석, 부분해석적 삼각분할 기반 acyclic partial matching, homological perturbation을 이용한 연결 행렬 계산.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.31102v1", "title": "Nonexistence of Constant Congruences for the Cumulative Partition Function", "authors": ["Kathy Q. Ji"], "abstract": "Let $p(n)$ be the ordinary partition function and let $c(n)=\\sum_{k=0}^{n-1}p(k)$, with $c(0)=0$. We prove that, for every $a\\geq1$, $b\\geq0$, and $m\\geq2$, the sequence $c(an+b)$ is not eventually constant modulo $m$, thereby answering a question posed by Chen. The proof combines the algebraicity over $\\mathbb C(j)$ of modular functions for finite-index subgroups of $\\mathrm{SL}_2(\\mathbb Z)$ with Voloch's theorem on the transcendence of elliptic modular functions in positive characteristic.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-10-22T11:14:51+00:00", "updated": "2026-10-22T11:14:51+00:00", "abs_url": "http://arxiv.org/abs/2610.31102v1", "pdf_url": "https://arxiv.org/pdf/2610.31102v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "분할함수의 합동식 성질을 다루는 수론 문제로, 이산기하학의 점 배치, oriented matroid, 또는 다면체 구조와 직접적 관련이 없음.", "summary": "누적 분할함수 $c(n)=\\sum_{k=0}^{n-1}p(k)$에 대해, 모든 $a\\geq1, b\\geq0, m\\geq2$에 대하여 수열 $c(an+b)$가 임의의 modulus $m$에 대해 결국 상수가 될 수 없음을 증명한다. 증명은 유한지수 부분군 $\\Gamma_0$의 modular function들의 $\\mathbb{C}(j)$ 위 대수성과 Voloch의 양의 특성에서의 타원 modular function 초월성 정리를 결합한다.", "technique": "Modular function의 대수성(algebraicity over $\\mathbb{C}(j)$)과 양의 특성에서의 초월성(transcendence in positive characteristic) 결합", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.28208v1", "title": "On the MDS conjecture in even characteristic", "authors": ["Bocong Chen", "Jing Huang"], "abstract": "We prove that every nontrivial linear $[n,k]$ maximum distance separable (MDS) code over a finite field $\\F_q$ of characteristic two satisfies $n\\le q+1$, except in dimensions $k=3$ and $k=q-1$, where $n\\le q+2$. This resolves the linear MDS conjecture in even characteristic.", "categories": ["math.CO", "cs.IT"], "primary_category": "math.CO", "published": "2026-10-20T13:46:09+00:00", "updated": "2026-10-20T13:46:09+00:00", "abs_url": "http://arxiv.org let GH = {repo:"", token:""};

function autoRepo(){
  if(GH.repo) return GH.repo;
  const h=location.hostname, parts=location.pathname.split("/").filter(Boolean);
  if(h.endsWith("github.io")){ const owner=h.split(".")[0]; return owner+"/"+(parts[0]||h); }
  return "";
}
function setSync(msg){ document.getElementById("sync").textContent = msg; }

async function pushGitHub(){
  const repo = autoRepo(); if(!GH.token || !repo){ return; }
  setSync("동기화 중…");
  const url = `https://api.github.com/repos/${repo}/contents/data/feedback.json`;
  const hdr = {Authorization:`Bearer ${GH.token}`, Accept:"application/vnd.github+json"};
  try{
    let sha = undefined, remote = {};
    const g = await fetch(url, {headers:hdr});
    if(g.status===200){ const j = await g.json(); sha=j.sha;
      try{ remote = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))))); }catch(e){} }
    const merged = Object.assign({}, remote, FB);   // 로컬 우선
    const body = { message:"update feedback", content: btoa(unescape(encodeURIComponent(JSON.stringify(merged,null,2)))) };
    if(sha) body.sha = sha;
    const p = await fetch(url, {method:"PUT", headers:hdr, body:JSON.stringify(body)});
    setSync(p.ok ? "동기화됨 ✓" : "동기화 실패("+p.status+")");
  }catch(e){ setSync("동기화 오류"); }
}
let pushTimer=null;
function schedulexPush(){ if(!GH.token) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushGitHub, 1500); }

function setVote(id,v){ const b=baseId(id); const e=FB[b]||{}; e.vote=(e.vote===v?null:v); e.ts=new Date().toISOString(); FB[b]=e; saveLocal(); schedulexPush(); apply(); }

function edge(rel,source){ if(source==="explore")return "var(--explore)"; if(rel>=8)return "var(--accent)"; if(rel>=5)return "#8B82DE"; return "var(--muted)"; }
function fmtDate(iso){ return (iso||"").slice(0,10); }

function card(r){
  const b=baseId(r.id), fb=FB[b]||{};
  const ed=edge(r.relevance,r.source);
  const tag=r.source==="explore"?'<span class="tag">탐색 발견</span>':"";
  const authors=(r.authors||[]).slice(0,6).join(", ")+((r.authors||[]).length>6?" 외":"");
  const journal=r.journal_ref?`<span class="dot">·</span>${esc(r.journal_ref)}`:"";
  const probName=r.problem_name?`<span class="prob">${esc(r.problem_name)}</span><span class="dot">·</span>`:"";
  const tech=r.technique?`<div class="field"><b>기법</b>${esc(r.technique)}</div>`:"";
  const conn=r.connections?`<div class="field conn"><b>연결</b>${esc(r.connections)}</div>`:"";
  const chips=(r.keyword_hits||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join("");
  const abs=r.abstract?`<button class="togg" data-abs="${esc(r.id)}">초록 보기 ▾</button><div class="abstract" id="abs-${esc(r.id)}">${esc(r.abstract)}</div>`:"";
  return `<article class="card" style="--edge:${ed}">
    <div class="ledger"><div class="score">${r.relevance}<small>/10</small></div></div>
    <div class="body">
      <h2 class="title"><a href="${esc(r.abs_url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${tag}</h2>
      <div class="meta">${probName}${esc(authors)}<span class="dot">·</span>${esc((r.categories||[]).join(", "))}${journal}<span class="dot">·</span>${fmtDate(r.published)}</div>
      ${r.relevance_reason?`<div class="reason">${esc(r.relevance_reason)}</div>`:""}
      <div class="summary">${esc(r.summary)}</div>
      ${tech}${conn}${chips?`<div class="chips">${chips}</div>`:""}
      <div class="actions">
        <button class="act ${fb.fav?'on-fav':''}" data-fav="${esc(r.id)}">⭐ 즐겨찾기</button>
        <button class="act ${fb.vote==='up'?'on-up':''}" data-vote="up" data-id="${esc(r.id)}">👍</button>
        <button class="act ${fb.vote==='down'?'on-down':''}" data-vote="down" data-id="${esc(r.id)}">👎</button>
        <span class="links"><span class="id">${esc(r.id)}</span><a href="${esc(r.abs_url)}" target="_blank" rel="noopener">abs ↗</a><a href="${esc(r.pdf_url)}" target="_blank" rel="noopener">pdf ↗</a></span>
      </div>
      ${abs}
    </div></article>`;
}

function apply(){
  let rows=DATA.slice();
  if(state.problem) rows=rows.filter(r=>r.problem_id===state.problem);
  if(state.exp) rows=rows.filter(r=>r.source==="explore");
  if(state.fav) rows=rows.filter(r=>(FB[baseId(r.id)]||{}).fav);
  if(state.hideDown) rows=rows.filter(r=>(FB[baseId(r.id)]||{}).vote!=="down");
  rows=rows.filter(r=>(r.relevance||0)>=state.thr);
  if(state.q){ const q=state.q.toLowerCase(); rows=rows.filter(r=>(r.title+" "+r.summary+" "+(r.abstract||"")).toLowerCase().includes(q)); }
  const favRank=r=>(FB[baseId(r.id)]||{}).fav?1:0;
  rows.sort((a,b)=>{
    if(state.sort==="fav"){ const f=favRank(b)-favRank(a); if(f)return f; }
    if(state.sort==="date") return (b.published||"").localeCompare(a.published||"");
    return (b.relevance-a.relevance)||(b.published||"").localeCompare(a.published||"");
  });
  const list=document.getElementById("list");
  document.getElementById("count").textContent=`${rows.length}편 표시`;
  if(!rows.length){ list.innerHTML=`<div class="empty">조건에 맞는 논문이 없습니다.</div>`; return; }
  list.innerHTML=rows.map(card).join("");
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([list]);
}

const refreshBtn = document.getElementById("refreshBtn");
async function triggerUpdate(){
  const repo = autoRepo();
  if(!GH.token || !repo){
    alert("⚙ 설정에서 GitHub 저장소와 토큰을 먼저 입력해주세요.\n토큰에 Actions 읽기·쓰기 권한이 필요합니다.");
    return;
  }
  refreshBtn.disabled = true;
  refreshBtn.classList.add("loading");
  refreshBtn.querySelector(".spin").style.display = "inline-block";
  setSync("업데이트 요청 중…");
  try{
    const url = `https://api.github.com/repos/${repo}/actions/workflows/daily.yml/dispatches`;
    const res = await fetch(url, {
      method:"POST",
      headers:{Authorization:`Bearer ${GH.token}`, Accept:"application/vnd.github+json", "Content-Type":"application/json"},
      body: JSON.stringify({ref:"main"})
    });
    if(res.status === 204){
      setSync("⏳ 업데이트 중… (완료되면 자동 새로고침)");
      // workflow_dispatch 후 Actions API 에 run 이 나타날 때까지 잠시 대기
      await new Promise(r=>setTimeout(r, 5000));
      pollUntilDone(repo);
    } else {
      const err = await res.json().catch(()=>({}));
      const msg = err.message || res.status;
      if(res.status === 422) setSync("❌ 이미 실행 중이거나 대기 중");
      else if(res.status === 403) setSync("❌ 권한 없음 — 토큰에 Actions 쓰기 권한 필요");
      else setSync(`❌ 실패 (${msg})`);
    }
  } catch(e){
    setSync("❌ 네트워크 오류");
  } finally {
    setTimeout(()=>{
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("loading");
    }, 10000);
  }
}

// Actions 실행 완료 여부를 10초마다 polling — 완료되면 즉시 새로고침
async function pollUntilDone(repo){
  const hdr = {Authorization:`Bearer ${GH.token}`, Accept:"application/vnd.github+json"};
  const maxWait = 60;  // 최대 10분(60회 × 10초)
  let dots = 0;
  for(let i=0; i<maxWait; i++){
    await new Promise(r=>setTimeout(r, 10000));
    dots = (dots % 3) + 1;
    setSync("⏳ 업데이트 중" + ".".repeat(dots));
    try{
      const r = await fetch(
        `https://api.github.com/repos/${repo}/actions/workflows/daily.yml/runs?per_page=1`,
        {headers: hdr}
      );
      if(!r.ok) continue;
      const data = await r.json();
      const run = (data.workflow_runs||[])[0];
      if(!run) continue;
      if(run.status === "completed"){
        if(run.conclusion === "success"){
          setSync("✅ 완료! 새로고침 중…");
          setTimeout(()=>location.reload(), 1500);
        } else {
          setSync(`❌ 실행 실패 (${run.conclusion})`);
        }
        return;
      }
    } catch(e){ /* 네트워크 일시 오류 무시 */ }
  }
  // 10분 초과 — 그냥 새로고침
  setSync("⏱ 시간 초과, 새로고침 중…");
  setTimeout(()=>location.reload(), 1500);
}
refreshBtn.addEventListener("click", triggerUpdate);
apply();
</script>

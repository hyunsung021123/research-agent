 three colours. This also shows that it is NP-complete to decide whether three colours suffice for a planar graph. We also give a planar graph on $25$ vertices that needs four colours. Further, we give critical planar graphs on $25$ vertices with $52$ and with $51$ edges, an infinite family of plane triangulations that need four colours, and an infinite family of critical examples.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-15T18:59:49+00:00", "updated": "2026-10-15T18:59:49+00:00", "abs_url": "http://arxiv.org/abs/2610.22559v1", "pdf_url": "https://arxiv.org/pdf/2610.22559v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 그래프의 closed-neighbourhood conflict-free 채색에 관한 것으로, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid 등)와 전혀 관련이 없다.", "summary": "모든 평면 그래프는 closed neighbourhood에 대해 conflict-free한 4-색칠을 가지며, 3색으로 충분하다는 Fabrici 등의 추측을 반례로 반증한다. 단순한 gadget 구성을 통해 색수 4인 평면 그래프로부터 3색 conflict-free 채색이 불가능한 평면 그래프를 만들 수 있으며, 이로부터 평면 그래프에서 3색 충분성 판별이 NP-완전임도 보인다. 또한 25개 꼭짓점의 4색 필요 평면 그래프, 임계(critical) 예시, 그리고 4색이 필요한 무한 평면 삼각형화 족을 제시한다.", "technique": "색수 4인 평면 그래프를 3색 conflict-free 불가능 평면 그래프로 변환하는 gadget 구성 및 임계 그래프 분석.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.22114v1", "title": "SL(n)-covariant symmetric tensor valuations on polytopes", "authors": ["Chunna Zeng", "Xiaoyu Cheng"], "abstract": "All $\\operatorname{SL}(n)$-covariant symmetric tensor valuations on convex polytopes in $\\mathbb R^n$ are completely classified without any continuity assumptions. It is shown that the only such valuation is the moment tensor.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-15T15:53:31+00:00", "updated": "2026-10-15T15:53:31+00:00", "abs_url": "http://arxiv.org/abs/2610.22114v1", "pdf_url": "https://arxiv.org/pdf/2610.22114v1", "journal_ref": "", "doi": "", "comment": "24pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체 위의 SL(n)-공변 대칭 텐서 값값(valuation) 분류에 관한 것으로, McMullen 문제(d=5에서의 점 배치, oriented matroid, chirotope 등)와 직접적인 관련이 없다.", "summary": "이 논문은 $\\mathbb{R}^n$의 볼록 다면체(convex polytope) 위에서 정의된 $\\operatorname{SL}(n)$-공변(covariant) 대칭 텐서 값값(valuation)을 연속성 가정 없이 완전히 분류한다. 주된 결과는 이러한 조건을 만족하는 유일한 값값이 모멘트 텐서(moment tensor)임을 보이는 것이다.", "technique": "연속성 가정 없는 대수적·조합론적 분류 기법을 통해 SL(n)-공변 대칭 텐서 값값의 유일성을 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.21501v2", "title": "Ehrhart positivity for paving positroids", "authors": ["Feihu Liu", "Zihao Zhang"], "abstract": "A central conjecture of Ferroni, Jochemko, and Schröter posits that every positroid is Ehrhart positive. While Ehrhart positivity has recently been verified for notable classes such as lattice path matroids and series-parallel matroids, the general conjecture remains open. In this paper, we prove that the base polytope of any paving positroid has positive Ehrhart coefficients. This establishes a new class of Ehrhart positive positroids and provides substantial evidence supporting this conjecture.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-15T08:37:26+00:00", "updated": "2026-10-16T15:00:55+00:00", "abs_url": "http://arxiv.org/abs/2610.21501v2", "pdf_url": "https://arxiv.org/pdf/2610.21501v2", "journal_ref": "", "doi": "", "comment": "Fixed LaTeX \\cref{} display errors; mathematical content unchanged", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 positroid의 Ehrhart 계수 양성(Ehrhart positivity)에 관한 것으로, McMullen's problem이나 Larman conjecture와 직접적 관련이 없다.", "summary": "Ferroni, Jochemko, Schröter의 추측—모든 positroid는 Ehrhart positive하다—의 일부로서, 본 논문은 paving positroid의 base polytope가 양의 Ehrhart 계수를 가짐을 증명한다. 이는 lattice path matroid 및 series-parallel matroid에 이어 새로운 Ehrhart positive positroid 클래스를 확립하며, 일반 추측에 대한 실질적 증거를 제공한다.", "technique": "", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.29659v1", "title": "Small and Large Quasi-Kernels in General Digraphs", "authors": ["Daniel Rutschmann"], "abstract": "In a digraph $D$, a set $Q$ of vertices is a quasi-kernel if $Q$ is an independent set and every vertex in $D$ can be reached from $Q$ via at most two edges. The small quasi-kernel conjecture by Erdős and Székely predicts that every source-free $n$-vertex digraph contains a quasi-kernel of size at most $n - n/2$. Chvátal and Lovász' 1974 work implies a bound of $n - \\sqrt{n}+1$. In 2024, Sprio shows the bound $n - \\frac{1}{4} \\sqrt{n \\log_2 n}$. We show that there always is a quasi-kernel of size at most $n - \\frac{1}{51}n^{2/3} / \\ln^{2/3}(n)$.   For the related large quasi-kernel conjecture by Spiro, we show that there always is a quasi-kernel $Q$ with $|N^+[Q]| \\ge 0.2917 \\cdot n^{2/3} / \\ln^{2/3}(n)$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-21T12:39:22+00:00", "updated": "2026-10-21T12:39:22+00:00", "abs_url": "http://arxiv.org/abs/2610.29659v1", "pdf_url": "https://arxiv.org/pdf/2610.29659v1", "journal_ref": "", "doi": "", "comment": "Preprint submitted to the Journal of Graph Theory", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학이나 점의 일반위치(general position) 배치, oriented matroid, 볼록다각형 등과 직접 관련이 없는 순수 그래프 이론 문제.", "summary": "Directed graph에서 quasi-kernel의 크기에 대한 상한을 개선한다. 이전 $n - \\sqrt{n}+1$, $n - \\frac{1}{4}\\sqrt{n\\log_2 n}$의 상한을 $n - \\frac{1}{51}n^{2/3}/\\ln^{2/3}(n)$로 강화하고, large quasi-kernel conjecture에 대해서도 새로운 하한을 도출한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.31001v1", "title": "Triangulation of orbifolds with corners", "authors": ["Hao Yu"], "abstract": "We prove that every compact orbifold with corners admits a triangulation in which the image of every codimension one face is a subcomplex. Faces need not be embedded, and the local groups may permute boundary components. The proof turns the boundary hyperplanes of linear charts into mirrors by means of the squaring map, which, unlike the folding $y\\mapsto|y|$, is compatible with smooth changes of charts, and then applies the triangulation theorem for orbit spaces of proper Lie groupoids.", "categories": ["math.GT", "math.AT"], "primary_category": "math.GT", "published": "2026-10-22T09:42:25+00:00", "updated": "2026-10-22T09:42:25+00:00", "abs_url": "http://arxiv.org/abs/2610.31001v1", "pdf_url": "https://arxiv.org/pdf/2610.31001v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 orbifold with corners의 삼각분할에 관한 위상기하학·기하학적 군론 연구로, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "이 논문은 모든 compact orbifold with corners가 여차원 1 면(face)의 상(image)이 부분복합체(subcomplex)를 이루는 삼각분할을 가짐을 증명한다. 핵심 아이디어는 선형 차트(linear chart)의 경계 초평면을 제곱 사상(squaring map)으로 거울(mirror)로 변환하는 것인데, 이 사상은 절댓값 접기($y\\mapsto|y|$)와 달리 차트의 매끄러운 변환(smooth change of charts)과 양립 가능하다. 이후 적절한 Lie groupoid의 궤도 공간(orbit space)에 대한 삼각분할 정리를 적용하여 결론을 도출한다.", "technique": "경계 초평면을 제곱 사상(squaring map)으로 거울로 변환한 뒤, proper Lie groupoid의 궤도 공간에 대한 삼각분할 정리를 적용.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.30993v1", "title": "Landfall Geometry", "authors": ["Frances Kirwan", "Vidit Nanda"], "abstract": "We study the negative gradient flow of analytic maps $f:X\\to\\R$ defined on compact analytic Riemannian manifolds without imposing any nondegeneracy or transversality assumptions. We construct tight isolating blocks around the connected components of the critical set $\\Crit(f)$ and record only bounded-time contacts made after an orbit exits one block and before it makes landfall within the interior of another. These contacts assemble into a strict topological category $\\cL$ -- called the landfall category -- whose classifying space $B\\cL$ is shown to be simple homotopy equivalent to $X$ naturally over all down-sets of the flow partial order. The filtered homotopy type is independent of the isolating blocks. Passing to a finite subanalytic triangulation yields a flow-induced acyclic partial matching, and hence, an explicit finite chain complex generated by the non-exit simplices of the blocks which computes the homology of $X$. The finite model also computes the Morse--Conley spectral sequence over arbitrary coefficients; over a field, homological perturbation further produces a connection matrix whose entries are finite sums over descending contact itineraries.", "categories": ["math.AT", "math.DS"], "primary_category": "math.AT", "published": "2026-10-22T09:36:22+00:00", "updated": "2026-10-22T09:36:22+00:00", "abs_url": "http://arxiv.org/abs/2610.30993v1", "pdf_url": "https://arxiv.org/pdf/2610.30993v1", "journal_ref": "", "doi": "", "comment": "33 pages, 1 figure, comments welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 해석적 Riemannian 다양체 위의 음의 기울기 흐름과 위상적 범주(landfall category)를 다루는 대수적 위상수학·동역학계 논문으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 비퇴화성 가정 없이 컴팩트 해석적 Riemannian 다양체에서 정의된 함수 $f:X\\to\\mathbb{R}$의 음의 기울기 흐름을 연구한다. 임계 집합의 연결 성분 주변에 tight isolating block을 구성하고, 궤도가 한 블록을 빠져나간 후 다른 블록에 도달하기까지의 접촉 정보를 모아 'landfall category' $\\mathcal{L}$를 정의하며, $B\\mathcal{L}$이 $X$와 단순 호모토피 동치임을 보인다. 이를 유한 부분해석적 삼각분할에 적용하면 Morse–Conley 스펙트럴 수열과 연결 행렬을 명시적으로 계산하는 유한 체인 복합체를 얻는다.", "technique": "tight isolating block 구성, strict topological category(landfall category)의 분류 공간 분석, 부분해석적 삼각분할 기반 acyclic partial matching, homological perturbation을 이용한 연결 행렬 계산.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.31102v1", "title": "Nonexistence of Constant Congruences for the Cumulative Partition Function", "authors": ["Kathy Q. Ji"], "abstract": "Let $p(n)$ be the ordinary partition function and let $c(n)=\\sum_{k=0}^{n-1}p(k)$, with $c(0)=0$. We prove that, for every $a\\geq1$, $b\\geq0$, and $m\\geq2$, the sequence $c(an+b)$ is not eventually constant modulo $m$, thereby answering a question posed by Chen. The proof combines the algebraicity over $\\mathbb C(j)$ of modular functions for finite-index subgroups of $\\mathrm{SL}_2(\\mathbb Z)$ with Voloch's theorem on the transcendence of elliptic modular functions in positive characteristic.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-10-22T11:14:51+00:00", "updated": "2026-10-22T11:14:51+00:00", "abs_url": "http://arxiv.org/abs/2610.31102v1", "pdf_url": "https://arxiv.org/pdf/2610.31102v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "분할함수의 합동식 성질을 다루는 수론 문제로, 이산기하학의 점 배치, oriented matroid, 또는 다면체 구조와 직접적 관련이 없음.", "summary": "누적 분할함수 $c(n)=\\sum_{k=0}^{n-1}p(k)$에 대해, 모든 $a\\geq1, b\\geq0, m\\geq2$에 대하여 수열 $c(an+b)$가 임의의 modulus $m$에 대해 결국 상수가 될 수 없음을 증명한다. 증명은 유한지수 부분군 $\\Gamma_0$의 modular function들의 $\\mathbb{C}(j)$ 위 대수성과 Voloch의 양의 특성에서의 타원 modular function 초월성 정리를 결합한다.", "technique": "Modular function의 대수성(algebraicity over $\\mathbb{C}(j)$)과 양의 특성에서의 초월성(transcendence in positive characteristic) 결합", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.28208v1", "title": "On the MDS conjecture in even characteristic", "authors": ["Bocong Chen", "Jing Huang"], "abstract": "We prove that every nontrivial linear $[n,k]$ maximum distance separable (MDS) code over a finite field $\\F_q$ of characteristic two satisfies $n\\le q+1$, except in dimensions $k=3$ and $k=q-1$, where $n\\le q+2$. This resolves the linear MDS conjecture in even characteristic.", "categories": ["math.CO", "cs.IT"], "primary_category": "math.CO", "published": "2026-10-20T13:46:09+00:00", "updated": "2026-10-20T13:46:09+00:00", "abs_url": "http://arxiv.org/abs/2610.28208v1", "pdf_url": "https://arxiv.org/pdf/2610.28208v1", "journal_ref": "", "doi": "", "comment": "34 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "MDS 부호 이론과 유한체 위의 선형 코드는 이산기하학의 McMullen 문제(고차원 볼록위치 점 배치, oriented matroid 실현성)와 직접적인 관련이 없음.", "summary": "유한체 $\\mathbb{F}_q$(특성 2)에서 모든 비자명 선형 MDS 부호 $[n,k]$가 $n \\le q+1$을 만족함을 증명(단, $k=3, q-1$ 차원 제외 시 $n \\le q+2$). 이는 짝수 특성에서의 선형 MDS 추측을 완전히 해결.", "technique": "유한체 부호 이론, 선형 부호의 거리 분리 성질, 특성 2 환경에서의 조합론적 제약 조건.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.24626v1", "title": "Infinitesimally Euclidean metric surfaces", "authors": ["Alexander Lytchak", "Elefterios Soultanis"], "abstract": "We prove the equivalence of several notions of infinitesimally Euclidean-like behaviour for metric surfaces appearing in the literature. We obtain in particular that metric surfaces with property (ET) are universally infinitesimally Hilbertian.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-17T11:02:37+00:00", "updated": "2026-10-17T11:02:37+00:00", "abs_url": "http://arxiv.org/abs/2610.24626v1", "pdf_url": "https://arxiv.org/pdf/2610.24626v1", "journal_ref": "", "doi": "", "comment": "12 pages; comments welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "메트릭 기하학(metric geometry)과 곡면의 무한소 구조에 관한 논문으로, 이산기하학의 점 배치·볼록위치·oriented matroid 문제와 직접적 연관 없음.", "summary": "메트릭 곡면(metric surfaces)에서 무한소 유클리드 유사 성질(infinitesimally Euclidean-like behaviour)의 여러 정의가 동치임을 증명한다. 특히 성질 (ET)를 만족하는 메트릭 곡면이 보편적으로 무한소 힐베르트 공간(universally infinitesimally Hilbertian)임을 보인다.", "technique": "메트릭 기하학적 동치성 증명을 통한 곡면의 무한소 구조 특성화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.26622v1", "title": "On the denominators of signed harmonic sums", "authors": ["Quan-Hui Yang"], "abstract": "Let $\\eps=(\\eps_i)_{i\\ge1}$ be a sequence with $\\eps_i\\in\\{-1,1\\}$, and let $v_n(\\eps)$ be the positive denominator of $\\sum_{i=1}^n\\eps_i/i$ in lowest terms. We prove that $|\\{1\\le n\\le x:v_n(\\eps)\\ne v_{n+1}(\\eps)\\}|=o(x)$ uniformly in $\\eps$. In particular, the set of positive integers $n$ with $v_n(\\eps)=v_{n+1}(\\eps)$ has asymptotic density one for every sequence of signs. This answers a problem of Wu and Chen, \\emph{J. Number Theory} \\textbf{200} (2019), 397--406.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-19T15:55:22+00:00", "updated": "2026-10-19T15:55:22+00:00", "abs_url": "http://arxiv.org/abs/2610.26622v1", "pdf_url": "https://arxiv.org/pdf/2610.26622v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "부호 조화합의 분모에 관한 수론 문제로, 이산기하학의 McMullen's problem과 직접적 관련성이 없음.", "summary": "임의의 부호 수열 $\\eps=(\\eps_i)_{i\\ge1}$, $\\eps_i\\in\\{-1,1\\}$에 대해 부분합 $\\sum_{i=1}^n\\eps_i/i$의 최소공배 분모 $v_n(\\eps)$를 연구. 분모가 변하는 지점의 밀도가 0임을 증명하여 Wu-Chen의 문제를 해결.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.34651v1", "title": "Approximating the Euclidean Ball by Polytopes: Surprising Rates in High Dimensions", "authors": ["Yegor Gorodzha", "Steven Hoehner", "Gil Kur"], "abstract": "We determine the sharp dimensional dependence of the asymptotic approximation error for the Euclidean unit ball $B_2^d\\subset\\mathbb{R}^d$ by polytopes with a prescribed number of vertices in the relative symmetric difference metric. Specifically, we prove that $$\\lim_{N\\to\\infty}N^{2/(d-1)}\\inf_{P\\in P_d(N)}\\frac{\\operatorname{vol}_d(P\\triangle B_2^d)}{\\operatorname{vol}_d(B_2^d)}=Θ(d^{-1/2}),$$ where $P_d(N)$ consists of polytopes with at most $N$ vertices and no containment restriction. Equivalently, the classical Laguerre-Delone triangulation numbers satisfy $\\operatorname{ldel}_{d-1}=Θ(d^{-1/2})$. This improves the lower bound $Ω(d^{-1})$ of Böröczky (2000) and the upper bound $O(1)$ of Ludwig, Schütt and Werner (2006). In contrast, the corresponding asymptotic coefficient for approximation with a prescribed number of facets has order one, as shown by Kur (2020). We also establish non-asymptotic bounds showing that, for every fixed $\\varepsilon\\in(0,1)$, the ball admits an $\\varepsilon$-approximation with at most $\\exp(C(\\varepsilon)\\sqrt d)$ vertices, whereas approximating the hypercube to the same accuracy requires at least $\\exp(c(\\varepsilon)d)$ vertices. Consequently, the ball does not maximize the optimal relative approximation error among convex bodies, even up to an absolute multiplicative constant at the same vertex budget. Thus Macbeath's theorem (1951) on the extremality of the ball for inscribed approximation does not extend to polytopes in arbitrary position.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-26T00:29:19+00:00", "updated": "2026-10-26T00:29:19+00:00", "abs_url": "http://arxiv.org/abs/2610.34651v1", "pdf_url": "https://arxiv.org/pdf/2610.34651v1", "journal_ref": "", "doi": "", "comment": "72 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유클리드 공(Euclidean ball)의 볼록 다면체 근사 오차의 차원 의존성을 다루며, McMullen 문제(d=5에서의 oriented matroid, convex/general position 점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 꼭짓점 수 $N$이 정해진 볼록 다면체로 유클리드 단위 공 $B_2^d$를 근사할 때의 점근적 오차의 정확한 차원 의존성을 결정한다. 구체적으로 $\\lim_{N\\to\\infty}N^{2/(d-1)}\\inf_{P\\in P_d(N)}\\frac{\\operatorname{vol}_d(P\\triangle B_2^d)}{\\operatorname{vol}_d(B_2^d)}=\\Theta(d^{-1/2})$임을 증명하며, 이는 Böröczky(2000)의 하한 $\\Omega(d^{-1})$과 Ludwig-Schütt-Werner(2006)의 상한 $O(1)$을 모두 개선한다. 또한 공은 $\\exp(C(\\varepsilon)\\sqrt{d})$개의 꼭짓점으로 $\\varepsilon$-근사가 가능하지만 초입방체는 $\\exp(c(\\varepsilon)d)$개가 필요함을 보여, Macbeath 정리(1951)의 내접 근사 극값성이 임의 위치 다면체로는 확장되지 않음을 밝힌다.", "technique": "Laguerre-Delone 삼각분할 수(ldel)의 점근 분석과 비점근적 꼭짓점 수 상·하한 추정을 핵심 도구로 사용한다.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2610.39242v1", "title": "The Liouville property for geometric graphs in the plane", "authors": ["Kuijun Liu", "Feng Luo", "Yanwen Luo", "Zhenghao Rao"], "abstract": "We show that every bounded discrete harmonic function with respect to the cotangent Laplacian on a Delaunay triangulation of the Euclidean plane is constant; equivalently, the cotangent-weighted triangulation has the Liouville property. Our main theorem establishes this property for a more general class of connected weighted geometric graphs in the plane. Furthermore, we show that a planar Delaunay triangulation with cotangent weights could be transient but is recurrent if edge lengths are uniformly bounded.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-10-29T02:58:06+00:00", "updated": "2026-10-29T02:58:06+00:00", "abs_url": "http://arxiv.org/abs/2610.39242v1", "pdf_url": "https://arxiv.org/pdf/2610.39242v1", "journal_ref": "", "doi": "", "comment": "16 pages, 4 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Delaunay 삼각분할 위의 코탄젠트 라플라시안에 관한 Liouville 성질을 다루며, McMullen 문제(점 배치, oriented matroid, 볼록 위치)와 전혀 무관하다.", "summary": "이 논문은 유클리드 평면의 Delaunay 삼각분할 위에서 코탄젠트 라플라시안에 관한 유계 이산 조화 함수(bounded discrete harmonic function)가 상수임을 증명하여, 코탄젠트 가중 삼각분할이 Liouville 성질을 가짐을 보인다. 더 나아가 이 결과를 평면 위의 더 일반적인 연결 가중 기하 그래프(weighted geometric graph) 류로 확장한다. 또한 코탄젠트 가중의 평면 Delaunay 삼각분할은 변환적(transient)일 수 있으나, 변 길이가 균등 유계(uniformly bounded)이면 재귀적(recurrent)임을 보인다.", "technique": "코탄젠트 라플라시안(cotangent Laplacian)을 이용한 이산 조화 해석과 기하 그래프의 가중 구조 분석.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.39034v1", "title": "On $κ$-covering minima", "authors": ["Fei Xue"], "abstract": "We introduce $κ$-covering minima by requiring the permutation simplices of one independent lattice frame to fit into translates of a common dilate of a convex body. We prove a lower bound for their normalized product, with coefficient $(n+1)/2^n$ for centrally symmetric bodies and an explicit dependence on Minkowski asymmetry in general. On Euclidean balls, the supremum over full-rank lattices of the ratio of the resulting fitting radius to the covering radius has order $\\sqrt n$. We also establish basic comparisons with classical lattice minima and bounds under products, projections, Minkowski addition, and free direct sums. We extend the definition by allowing projected periodic lattice triangulations. These extended minima agree with the classical covering minima on ellipsoids.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-28T23:05:27+00:00", "updated": "2026-10-28T23:05:27+00:00", "abs_url": "http://arxiv.org/abs/2610.39034v1", "pdf_url": "https://arxiv.org/pdf/2610.39034v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록체의 격자 피복(covering minima)에 관한 연속기하학 연구로, McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 독립 격자 프레임의 순열 단체(permutation simplices)가 볼록체의 공통 팽창 이동에 맞도록 요구하는 $\\kappa$-covering minima를 새롭게 도입한다. 중심대칭 볼록체에 대해 정규화된 곱의 하한이 계수 $(n+1)/2^n$로 증명되며, 일반적인 경우 Minkowski 비대칭성에 명시적으로 의존한다. 유클리드 공(Euclidean ball)에서 피팅 반지름과 피복 반지름의 비율의 상한이 $\\sqrt{n}$ 차수임도 보인다.", "technique": "격자 피복 minima의 일반화(허용 사영 주기 격자 삼각분할), Minkowski 비대칭성 분석, 고전적 격자 minima와의 비교 부등식 증명.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.38674v1", "title": "Projected Brion's theorem", "authors": ["Matthew Dupraz", "Leonid Monin"], "abstract": "We present an analogue of Brion's theorem for the projected integer-point transform. Brion's theorem writes the integer-point transform of a rational polyhedron $P$ as the sum of the rational functions associated to its vertex cones. The pushforward $π_*$ along a lattice projection $π$ turns the transform of $P$ into the generating function of the numbers of lattice points in the fibres of $π$. We group the vertices of $P$ into contracted classes, generated by the edges whose direction $π$ kills, and show that the sum of the rational functions associated to the vertex cones in a contracted class can be pushed forward along $π$, yielding a rational function decomposition of the projected integer-point transform. For a lattice polytope, the classes correspond to the connected components of the fixed locus of the associated toric variety under the action of a subtorus, and our formula resembles the localization formula for this subtorus. We use this decomposition to provide an explicit formula for the projected integer-point transform of a linear family of polytopes. We illustrate this result with families of Gelfand--Zetlin and string polytopes.", "categories": ["math.CO", "math.AG", "math.RT"], "primary_category": "math.CO", "published": "2026-10-28T18:53:08+00:00", "updated": "2026-10-28T18:53:08+00:00", "abs_url": "http://arxiv.org/abs/2610.38674v1", "pdf_url": "https://arxiv.org/pdf/2610.38674v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유리 다면체의 정수점 변환에 관한 Brion 정리의 유사체를 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid, f(5)=11)와 직접적인 관련이 없다.", "summary": "이 논문은 격자 사영(lattice projection) $\\pi$에 따른 푸시포워드를 통해 유리 다면체 $P$의 정수점 변환을 분해하는 'projected Brion's theorem'을 제시한다. 꼭짓점들을 $\\pi$가 죽이는 모서리 방향에 의해 생성되는 수축 클래스(contracted class)로 묶고, 각 클래스에 대응하는 유리함수 분해를 보인다. 이 결과를 Gelfand–Zetlin 다면체 및 string polytope 족에 적용하는 명시적 공식을 도출한다.", "technique": "꼭짓점 원뿔(vertex cone)의 유리함수를 수축 클래스별로 묶어 격자 사영 $\\pi_*$로 밀어내는 분해 방법 및 토릭 다양체의 부분토러스 작용 고정점 집합과의 대응 활용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.38456v1", "title": "Sheaves on quoric manifolds", "authors": ["Christos Aravanis", "Ioannis Gkeneralis"], "abstract": "Quoric manifolds are quaternionic analogues of quasitoric manifolds introduced by Hopkinson. Given a quoric manifold over a simple polytope, we study the stratification induced by the faces of the polytope. We then show that the equivariant derived category of constructible sheaves with respect to the face stratification is equivalent to the derived category of constructible DG-modules over a DG-algebra defined on the orbit space. Finally, we prove that the associated DG-algebra is formal.", "categories": ["math.AG", "math.AT"], "primary_category": "math.AG", "published": "2026-10-28T08:34:19+00:00", "updated": "2026-10-28T08:34:19+00:00", "abs_url": "http://arxiv.org/abs/2610.38456v1", "pdf_url": "https://arxiv.org/pdf/2610.38456v1", "journal_ref": "", "doi": "", "comment": "44 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 quaternionic quoric manifold 위의 층(sheaf) 이론과 DG-대수를 다루며, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 Hopkinson이 도입한 quoric manifold(준환면체 다양체의 사원수 유사체)를 단순 다면체 위에서 연구하며, 면 층화(face stratification)로 유도되는 등변 구성가능 층의 유도 범주를 분석한다. 궤도 공간 위에 정의된 DG-대수의 유도 범주와의 동치성을 증명하고, 해당 DG-대수가 formal함을 보인다.", "technique": "면 층화에 의한 등변 유도 범주(equivariant derived category of constructible sheaves)와 DG-모듈 범주 사이의 동치 구성 및 형식성(formality) 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.37057v1", "title": "Three-manifolds that do not admit veering triangulations", "authors": ["Layne Hall"], "abstract": "We show that if a three-manifold $M$ admits a veering triangulation, then the dual spine of every essential triangulation of $M$ can be smoothed to a branched surface. We use this criterion to identify a large collection of cusped hyperbolic three-manifolds that do not admit veering triangulations. We then use the same criterion to construct the first infinite family of cusped hyperbolic three-manifolds without veering triangulations.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-10-27T11:24:36+00:00", "updated": "2026-10-27T11:24:36+00:00", "abs_url": "http://arxiv.org/abs/2610.37057v1", "pdf_url": "https://arxiv.org/pdf/2610.37057v1", "journal_ref": "", "doi": "", "comment": "33 pages, 19 figures. Comments welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 3-다양체의 veering triangulation에 관한 위상수학 연구로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 3-다양체 $M$이 veering triangulation을 허용하면 $M$의 모든 essential triangulation의 dual spine이 branched surface로 smoothing될 수 있음을 증명한다. 이 판별 기준을 이용하여 veering triangulation을 허용하지 않는 cusped hyperbolic 3-다양체의 큰 집합을 식별하고, 나아가 veering triangulation이 없는 cusped hyperbolic 3-다양체의 첫 번째 무한 족을 구성한다.", "technique": "veering triangulation의 존재 조건으로 dual spine의 branched surface smoothing 가능성을 필요조건으로 활용하는 판별 기준.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.36394v1", "title": "Realizing graph automorphisms as geometric symmetries of straight line drawings", "authors": ["Saul D. Freedman", "Melissa Lee", "Dragan Marušič", "Tomaž Pisanski"], "abstract": "Given a finite graph $G$, we characterize the automorphisms and automorphism groups of $G$ that can be realized as geometric symmetries and symmetry groups of straight line drawings of $G$ in the plane. In doing so, we correct a previous version of this characterization from the literature. As an application, we show that the graphs recently constructed by the first two authors to disprove the Polycirculant Conjecture, which have orders $16{,}464^k$ for each positive integer $k$, are the first known vertex-transitive graphs with no function autoRepo(){
  if(GH.repo) return GH.repo;
  const h=location.hostname, parts=location.pathname.split("/").filter(Boolean);
  if(h.endsWith("github.io")){ const owner=h.split(".")[0]; return owner+"/"+(parts[0]||h); }
  return "";
}
function setSync(msg){ document.getElementById("sync").textContent = msg; }

async function pushGitHub(){
  const repo = autoRepo(); if(!GH.token || !repo){ return; }
  setSync("동기화 중…");
  const url = `https://api.github.com/repos/${repo}/contents/data/feedback.json`;
  const hdr = {Authorization:`Bearer ${GH.token}`, Accept:"application/vnd.github+json"};
  try{
    let sha = undefined, remote = {};
    const g = await fetch(url, {headers:hdr});
    if(g.status===200){ const j = await g.json(); sha=j.sha;
      try{ remote = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))))); }catch(e){} }
    const merged = Object.assign({}, remote, FB);   // 로컬 우선
    const body = { message:"update feedback", content: btoa(unescape(encodeURIComponent(JSON.stringify(merged,null,2)))) };
    if(sha) body.sha = sha;
    const p = await fetch(url, {method:"PUT", headers:hdr, body:JSON.stringify(body)});
    setSync(p.ok ? "동기화됨 ✓" : "동기화 실패("+p.status+")");
  }catch(e){ setSync("동기화 오류"); }
}

function card(r){
  const b=baseId(r.id), fb=FB[b]||{};
  const ed=edge(r.relevance,r.source);
  const tag=r.source==="explore"?'<span class="tag">탐색 발견</span>':"";
  const authors=(r.authors||[]).slice(0,6).join(", ")+((r.authors||[]).length>6?" 외":"");
  const journal=r.journal_ref?`<span class="dot">·</span>${esc(r.journal_ref)}`:"";
  const probName=r.problem_name?`<span class="prob">${esc(r.problem_name)}</span><span class="dot">·</span>`:"";
  const tech=r.technique?`<div class="field"><b>기법</b>${esc(r.technique)}</div>`:"";
  const conn=r.connections?`<div class="field conn"><b>연결</b>${esc(r.connections)}</div>`:"";
  const chips=(r.keyword_hits||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join("");
  const abs=r.abstract?`<button class="togg" data-abs="${esc(r.id)}">초록 보기 ▾</button><div class="abstract" id="abs-${esc(r.id)}">${esc(r.abstract)}</div>`:"";
  return `<article class="card" style="--edge:${ed}">
    <div class="ledger"><div class="score">${r.relevance}<small>/10</small></div></div>
    <div class="body">
      <h2 class="title"><a href="${esc(r.abs_url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${tag}</h2>
      <div class="meta">${probName}${esc(authors)}<span class="dot">·</span>${esc((r.categories||[]).join(", "))}${journal}<span class="dot">·</span>${fmtDate(r.published)}</div>
      ${r.relevance_reason?`<div class="reason">${esc(r.relevance_reason)}</div>`:""}
      <div class="summary">${esc(r.summary)}</div>
      ${tech}${conn}${chips?`<div class="chips">${chips}</div>`:""}
      <div class="actions">
        <button class="act ${fb.fav?'on-fav':''}" data-fav="${esc(r.id)}">⭐ 즐겨찾기</button>
        <button class="act ${fb.vote==='up'?'on-up':''}" data-vote="up" data-id="${esc(r.id)}">👍</button>
        <button class="act ${fb.vote==='down'?'on-down':''}" data-vote="down" data-id="${esc(r.id)}">👎</button>
        <span class="links"><span class="id">${esc(r.id)}</span><a href="${esc(r.abs_url)}" target="_blank" rel="noopener">abs ↗</a><a href="${esc(r.pdf_url)}" target="_blank" rel="noopener">pdf ↗</a></span>
      </div>
      ${abs}
    </div></article>`;
}

function apply(){
  let rows=DATA.slice();
  if(state.problem) rows=rows.filter(r=>r.problem_id===state.problem);
  if(state.exp) rows=rows.filter(r=>r.source==="explore");
  if(state.fav) rows=rows.filter(r=>(FB[baseId(r.id)]||{}).fav);
  if(state.hideDown) rows=rows.filter(r=>(FB[baseId(r.id)]||{}).vote!=="down");
  rows=rows.filter(r=>(r.relevance||0)>=state.thr);
  if(state.q){ const q=state.q.toLowerCase(); rows=rows.filter(r=>(r.title+" "+r.summary+" "+(r.abstract||"")).toLowerCase().includes(q)); }
  const favRank=r=>(FB[baseId(r.id)]||{}).fav?1:0;
  rows.sort((a,b)=>{
    if(state.sort==="fav"){ const f=favRank(b)-favRank(a); if(f)return f; }
    if(state.sort==="date") return (b.published||"").localeCompare(a.published||"");
    return (b.relevance-a.relevance)||(b.published||"").localeCompare(a.published||"");
  });
  const list=document.getElementById("list");
  document.getElementById("count").textContent=`${rows.length}편 표시`;
  if(!rows.length){ list.innerHTML=`<div class="empty">조건에 맞는 논문이 없습니다.</div>`; return; }
  list.innerHTML=rows.map(card).join("");
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([list]);
}

// 수동 업데이트 버튼 — GitHub Actions workflow_dispatch 호출
const refreshBtn = document.getElementById("refreshBtn");
async function triggerUpdate(){
  const repo = autoRepo();
  if(!GH.token || !repo){
    alert("⚙ 설정에서 GitHub 저장소와 토큰을 먼저 입력해주세요.\n토큰에 Actions 읽기·쓰기 권한이 필요합니다.");
    return;
  }
  refreshBtn.disabled = true;
  refreshBtn.classList.add("loading");
  refreshBtn.querySelector(".spin").style.display = "inline-block";
  setSync("업데이트 요청 중…");
  try{
    const url = `https://api.github.com/repos/${repo}/actions/workflows/daily.yml/dispatches`;
    const res = await fetch(url, {
      method:"POST",
      headers:{Authorization:`Bearer ${GH.token}`, Accept:"application/vnd.github+json", "Content-Type":"application/json"},
      body: JSON.stringify({ref:"main"})
    });
    if(res.status === 204){
      setSync("⏳ 업데이트 중… (완료되면 자동 새로고침)");
      // workflow_dispatch 후 Actions API 에 run 이 나타날 때까지 잠시 대기
      await new Promise(r=>setTimeout(r, 5000));
      pollUntilDone(repo);
    } else {
      const err = await res.json().catch(()=>({}));
      const msg = err.message || res.status;
      if(res.status === 422) setSync("❌ 이미 실행 중이거나 대기 중");
      else if(res.status === 403) setSync("❌ 권한 없음 — 토큰에 Actions 쓰기 권한 필요");
      else setSync(`❌ 실패 (${msg})`);
    }
  } catch(e){
    setSync("❌ 네트워크 오류");
  } finally {
    setTimeout(()=>{
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("loading");
    }, 10000);
  }
}

// Actions 실행 완료 여부를 10초마다 polling — 완료되면 즉시 새로고침
async function pollUntilDone(repo){
  const hdr = {Authorization:`Bearer ${GH.token}`, Accept:"application/vnd.github+json"};
  const maxWait = 60;  // 최대 10분(60회 × 10초)
  let dots = 0;
  for(let i=0; i<maxWait; i++){
    await new Promise(r=>setTimeout(r, 10000));
    dots = (dots % 3) + 1;
    setSync("⏳ 업데이트 중" + ".".repeat(dots));
    try{
      const r = await fetch(
        `https://api.github.com/repos/${repo}/actions/workflows/daily.yml/runs?per_page=1`,
        {headers: hdr}
      );
      if(!r.ok) continue;
      const data = await r.json();
      const run = (data.workflow_runs||[])[0];
      if(!run) continue;
      if(run.status === "completed"){
        if(run.conclusion === "success"){
          setSync("✅ 완료! 새로고침 중…");
          setTimeout(()=>location.reload(), 1500);
        } else {
          setSync(`❌ 실행 실패 (${run.conclusion})`);
        }
        return;
      }
    } catch(e){ /* 네트워크 일시 오류 무시 */ }
  }
  // 10분 초과 — 그냥 새로고침
  setSync("⏱ 시간 초과, 새로고침 중…");
  setTimeout(()=>location.reload(), 1500);
}
refreshBtn.addEventListener("click", triggerUpdate);
apply();
</script>

ce의 에너지 형식과 Poincaré 부등식에 관한 기하해석학 주제로, McMullen's problem(볼록위치 점 배치 및 oriented matroid 실현가능성)과 직접적 연관이 없음.", "summary": "이 논문은 완전 doubling metric measure space에서 정규 strongly local $p$-energy 형식에 대해 macroscopic Poincaré 부등식을 유도한다. 이 부등식은 서로 다른 스케일에서의 $L^p$-oscillation을 비교하고 Korevaar-Schoen 함수에 대한 균일한 two-scale 비교를 제공한다. 역방향 결과로 macroscopic 부등식이 에너지 영역의 weak-type 특성화를 야기함을 보인다.", "technique": "Doubling 조건, capacity 상한, 그리고 스케일별 Poincaré 부등식을 이용한 macroscopic 부등식의 파생 및 역증명(converse).", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.24408v1", "title": "A Recursive Construction of Perfect $K^n\\times K^n$ Arrays over $K$ Roots of Unity", "authors": ["Sam Blake"], "abstract": "We give a uniform, explicit and elementary recursive construction of two-dimensional arrays with perfect (ideal) periodic autocorrelation over a \\emph{fixed} alphabet of $K$ roots of unity and \\emph{unbounded} size: for every integer $K\\ge2$ and every $n\\ge1$ a perfect $K^n\\times K^n$ array whose entries are $K$-th roots of unity, given by a nested sum of floor terms. The construction works with \\emph{twisted} (quasi-perfect) arrays indexed by a type $v\\in\\Z_K^2$, of which ordinary perfect arrays are the type $v=0$ members. For $K=2$ the types are Jedwab's generalised perfect binary arrays and the recursion specialises to the doubling constructions of Jedwab--Mitchell and Wild; for prime $K$ the arrays are the relative difference sets whose existence in abelian $p$-groups was settled by Ma and Schmidt; and the bare existence of perfect $K^n\\times K^n$ arrays over $K$ roots of unity follows, for every $K$, from recent constructions of group-invariant Butson Hadamard matrices. The contribution of this note is therefore not existence but the calculus: types with arbitrary entries in $\\Z_K^2$; three spectral lemmas (a twisted periodic extension of a type-$v$ array has a flat spectrum supported on one coset of $K\\Z^2$; interleaving arrays whose spectra are flat on disjoint cosets gives a perfect array; and a shear of the index plane with a floor-function carry permutes types through the action of $SL_2(\\Z_K)$ on $\\Z_K^2$, whose orbits are the classes $\\gcd(v_1,v_2,K)=g$); a one-directional lift that produces every type at side $KM$ from every type at side $M$ for arbitrary $K$; and the resulting closed index function, which is the recursive form of the floor-function arrays of \\cite{Blake2017}.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-17T03:18:44+00:00", "updated": "2026-10-17T03:18:44+00:00", "abs_url": "http://arxiv.org/abs/2610.24408v1", "pdf_url": "https://arxiv.org/pdf/2610.24408v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Perfect arrays와 McMullen's problem은 모두 이산기하학 분야이지만, 전자는 신호처리·조합론의 autocorrelation 구조에, 후자는 볼록위치 점 배치와 oriented matroid에 관한 것으로 직접적 연관성이 없음.", "summary": "본 논문은 K-th roots of unity를 알파벳으로 하는 perfect $K^n \\times K^n$ 배열의 명시적이고 재귀적인 구성을 제시한다. Twisted (quasi-perfect) 배열을 타입 $v \\in \\mathbb{Z}_K^2$로 인덱싱하여, spectral 조건과 floor function 기반의 통일된 calculus를 개발한다.", "technique": "Spectral lemma와 floor-function carry를 이용한 $SL_2(\\mathbb{Z}_K)$ 작용 하의 타입 공간 분석, 및 일방향 lift를 통한 재귀 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.26596v1", "title": "Rational Dyck Excursion Counts as Sums of Generalized Fuss-Catalan Products", "authors": ["Brecht Verbeken", "Arne Vanhoyweghen", "Vincent Ginis"], "abstract": "For walks with jumps +p and -q, where p,q are coprime positive integers, we express the weak and strict rational Dyck excursion counts as finite weighted sums of generalized Fuss-Catalan products. Both sums run over the same partitions of q for every path size. Reversing the order of the steps and changing their signs transforms a returning walk with jumps +p and -q into one with jumps +q and -p, with the same heights in reverse order. This preserves both weak and strict excursions. Applying the formulas with p and q exchanged therefore gives sums over partitions of p, so we can choose the smaller of the two jump magnitudes. The indices of the Fuss-Catalan factors satisfy certain divisibility conditions that are determined by the jump magnitudes and the partition parts. The weak formula alternates in sign with the number of parts, whereas every term in the strict formula is positive. We prove both formulas by cutting unrestricted walks at their first and last visits to their lowest height. Expanding the resulting factors produces the partitions of q and the different signs. We also give equivalent binomial convolutions. Multiplying each Fuss-Catalan factor by q in the weak formula or p in the strict formula gives a positive integer. For q=1, the weak and strict counts reduce to Fuss-Catalan and shifted Raney numbers, respectively; for q=2 and q=3, the formulas yield explicit convolution identities.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-19T15:39:36+00:00", "updated": "2026-10-19T15:39:36+00:00", "abs_url": "http://arxiv.org/abs/2610.26596v1", "pdf_url": "https://arxiv.org/pdf/2610.26596v1", "journal_ref": "", "doi": "", "comment": "29 pages, 3 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유리 Dyck 경로와 Fuss-Catalan 수의 조합론적 공식이 주제이나, McMullen's problem의 convex position, oriented matroid, tope graph, realizability와는 직접적 연관이 없음.", "summary": "서로소인 양의 정수 p, q에 대해 +p, -q 점프를 갖는 경로의 유리 Dyck excursion 개수를 generalized Fuss-Catalan 곱의 가중합으로 표현한다. 약한(weak) 공식은 부호가 교대로 나타나고, 엄격한(strict) 공식은 모든 항이 양수이며, 첫 방문과 마지막 방문에서의 절단(cutting)으로 증명된다.", "technique": "경로를 최소 높이 방문점에서 절단하여 분해, q의 분할(partition)에 대한 합으로 변환, divisibility 조건 활용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25204v1", "title": "Crossing numbers of complete bipartite graphs", "authors": ["József Balogh", "Nicholas Layman", "Bernard Lidický", "Florian Pfender", "Gelasio Salazar", "Sam Spiro", "Jan Volec"], "abstract": "Zarankiewicz's long standing conjecture states that the crossing number $cr(K_{m,n})$ of the complete bipartite graph is \\[ Z(m,n):=\\bigg\\lfloor{\\frac{m}{2}}\\bigg\\rfloor \\bigg\\lfloor{\\frac{m-1}{2}}\\bigg\\rfloor \\bigg\\lfloor{\\frac{n}{2}}\\bigg\\rfloor \\bigg\\lfloor{\\frac{n-1}{2}}\\bigg\\rfloor. \\] Using flag algebras, we show that $cr(K_{n,n}) \\geq 0.96936 \\cdot Z(n,n) + o(n^4)$. We also show that the rectilinear crossing number $\\overline{cr}(K_{n,n})$ of $K_{n,n}$ is at least $0.987\\cdot Z(n,n) + o(n^4)$. Additionally, we prove the following for complete bipartite graphs: if a drawing of $K_{n,n}$ contains no induced subdrawing of $K_{3,4}$ with exactly two crossings whose endpoints intersect in exactly one vertex, then it has at least $Z(n,n)+o(n^4)$ crossings. This is a local restriction inspired by Turán-type problems that gives an asymptotically tight result.   A closely related conjecture is Hill's conjecture stating that the crossing number $cr(K_{n})$ of the complete graph $K_n$ is \\[ H(n):= \\frac14 \\left\\lfloor \\frac{n}{2} \\right\\rfloor \\left\\lfloor \\frac{n-1}{2} \\right\\rfloor \\left\\lfloor \\frac{n-2}{2} \\right\\rfloor \\left\\lfloor \\frac{n-3}{2} \\right\\rfloor \\] for all $n \\geq 3$. By an averaging argument, the asymptotic Zarankiewicz conjecture implies the asymptotic Hill conjecture. We improve the lower bound on $cr(K_{n})$ from $(0.985+o(1)) H(n)$ to $(0.9899+o(1)) H(n)$.   Both conjectures were claimed to be true in manuscripts by OpenAI dated Sep 23, 2026 and made public on Oct 6, 2026. This paper represents the state of knowledge before those publications and shows how far we can push the flag algebra method.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-18T11:49:05+00:00", "updated": "2026-10-18T11:49:05+00:00", "abs_url": "http://arxiv.org/abs/2610.25204v1", "pdf_url": "https://arxiv.org/pdf/2610.25204v1", "journal_ref": "", "doi": "", "comment": "13 pages, 5 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Crossing numbers of complete bipartite graphs는 조합론의 고전 문제이지만 McMullen's problem (고차원 볼록기하, 특히 convex position의 점 배치와 oriented matroid)과는 기하학적 구조나 도구 면에서 직접 관련이 없습니다.", "summary": "본 논문은 Zarankiewicz 추측(완전 이분 그래프 $K_{m,n}$의 crossing number가 $Z(m,n)$임)을 flag algebra를 이용하여 점근적으로 증명에 근접시키며, $cr(K_{n,n}) \\geq 0.96936 \\cdot Z(n,n) + o(n^4)$를 보입니다. 또한 rectilinear crossing number와 Hill's conjecture에 관한 개선된 하한도 제시합니다.", "technique": "Flag algebra를 이용한 조합적 최적화 방법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.28002v1", "title": "Functions determining few direction: the final missing case", "authors": ["Peter Sziklai"], "abstract": "By results of Blokhuis, Ball, Brouwer, Storme and Szőnyi, and of Ball, if a function $f: {\\mathbb F}_q\\to{\\mathbb F}_q$ determines fewer than $(q+3)/2$ directions, then $f-f(0)$ is linear over a subfield of ${\\mathbb F}_q$, except possibly when $q$ is even and $f$ determines exactly $q/2+1$ directions. We settle this case: $f-f(0)$ is then additive. Hence every small minimal blocking set of Rédei type in PG(2,$q$) is linear.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-20T10:46:09+00:00", "updated": "2026-10-20T10:46:09+00:00", "abs_url": "http://arxiv.org/abs/2610.28002v1", "pdf_url": "https://arxiv.org/pdf/2610.28002v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한체 위의 함수와 방향 결정 문제로, McMullen's problem의 convex position 및 oriented matroid와 직접 관련성 없음.", "summary": "유한체 $\\mathbb{F}_q$ 위의 함수가 결정하는 방향 개수에 대한 고전적 결과를 완성한다. $q$가 짝수이고 $f$가 정확히 $q/2+1$개 방향을 결정할 때, $f-f(0)$는 덧셈함수(additive)임을 증명한다. 이는 사영평면 PG(2,$q$)의 Rédei형 최소 blocking set이 모두 선형임을 함의한다.", "technique": "유한체 위의 함수론과 blocking set 이론을 결합한 특성화 방법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.29043v1", "title": "Every tournament of dichromatic number $10 k^2$ has a vertex whose out-neighborhood has dichromatic number more than $k$", "authors": ["Seokbeom Kim", "Sang-il Oum"], "abstract": "The dichromatic number of a tournament is the minimum number of colors needed to color the vertices so that no directed cycle is monochromatic. Nguyen, Scott, and Seymour (2025) asked whether every tournament with dichromatic number $2k$ has a vertex whose out-neighborhood induces a subtournament of dichromatic number at least $k$. We answer their question negatively by finding an example with dichromatic number $Ω(k^2)$. Furthermore, this quadratic bound is tight up to a constant factor; we show that for every integer $k \\geq 1$, every tournament of dichromatic number $Ω(k^2)$ contains a vertex whose out-neighborhood induces a subtournament of dichromatic number more than $k$. This improves the previous best bound $\\mathcal{O}(k^2\\log k)$ due to Colinot and Newman (2026). To show this, we prove that every tournament of fractional dichromatic number $c$ has a dominating set of size at most $5c-1$. The proof uses Brouwer's fixed point theorem.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-21T01:17:47+00:00", "updated": "2026-10-21T01:17:47+00:00", "abs_url": "http://arxiv.org/abs/2610.29043v1", "pdf_url": "https://arxiv.org/pdf/2610.29043v1", "journal_ref": "", "doi": "", "comment": "7 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "토너먼트의 색칠 문제는 조합론이지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, acyclic reorientation, tope graph와는 직접적 관련이 없음.", "summary": "토너먼트의 dichromatic number에 관한 문제로, Nguyen-Scott-Seymour의 추측에 대해 음의 답변을 제시한다. dichromatic number가 Ω(k²)인 토너먼트가 존재하며, 이 경계는 tight함을 보인다. Brouwer의 고정점 정리를 이용하여 fractional dichromatic number $c$인 토너먼트는 크기 최대 $5c-1$의 dominating set을 가짐을 증명한다.", "technique": "Brouwer의 고정점 정리를 적용한 지배집합(dominating set) 크기 제어.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25829v1", "title": "A classification of the Nim-sequences for the two-element subtraction game with a single pass", "authors": ["Richard M. Low"], "abstract": "In this paper, we provide a complete description of the preperiods, periodic lengths, and the Grundy-value sequences of two-element subtraction games with a single pass option.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-19T05:45:26+00:00", "updated": "2026-10-19T05:45:26+00:00", "abs_url": "http://arxiv.org/abs/2610.25829v1", "pdf_url": "https://arxiv.org/pdf/2610.25829v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론의 게임론(Nim-sequence, Grundy value) 분야이나 McMullen's problem(고차원 convex position, oriented matroid)과 직접적 관련 없음.", "summary": "본 논문은 단일 pass 옵션이 있는 두 원소 감산 게임(two-element subtraction game)의 Nim-수열을 완전히 분류한다. 선수열(preperiod), 주기 길이(periodic length), Grundy-value 수열의 완전한 기술을 제공한다.", "technique": "Grundy value 계산 및 수열의 주기성 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.25380v1", "title": "The Corners of Ramanujan: Partial- and False-Theta Companions to Third-Order Mock Theta Functions", "authors": ["George E. Andrews", "Mohamed El Bachraoui"], "abstract": "Most of the traditional third-order mock theta functions occur naturally as specialized values of partition-rank generating functions. The same finite rank kernels also occur in the ordinary and odd unimodal-rank series studied previously in the literature. We organize a parallel collection of corner series by retaining these kernels and replacing their quadratic core weights by linear peak weights. Their root-of-unity specializations are governed by partial and false theta identities recorded in Ramanujan's Lost Notebook; in one exceptional case the corner companion is itself a mock theta function. The classical rank series and Ramanujan identities are used as inputs. Our new results include exact two- and three-color partition identities with sparse theta discrepancies and an oriented three-dimensional corner with a distinct tower. In both color cases, positive decompositions separate the colored companion into copies of the relevant odd-corner series and a corresponding decorated even-corner series. Thus both sparse discrepancies become signed differences between natural corner families. Burson's boxed modular involution provides a common rank-refined model for the two corrections, whose surviving fixed points produce the exceptional quadratic sequences. For the side rank of the three-dimensional corners we obtain an exact formula at $z=-1$, a strict parity bias, quartic and cubic root-of-unity rank-difference identities, and exact equidistribution modulo $3$ on the progression $6n+5$. The cubic identity also gives exact congruence formulas on the progressions $6n+2$ and $6n+3$. We further classify the associated binary triangular support modulo every integer and derive general congruence families.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-10-18T16:30:31+00:00", "updated": "2026-10-18T16:30:31+00:00", "abs_url": "http://arxiv.org/abs/2610.25380v1", "pdf_url": "https://arxiv.org/pdf/2610.25380v1", "journal_ref": "", "doi": "", "comment": "45 pages, Submitted", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학 문제와 무관하며, 조합론 중에서도 분할론(partition theory)과 모의 세타 함수(mock theta functions)의 수론적 성질에 집중.", "summary": "본 논문은 제3차 모의 세타 함수들이 분할-계수 생성함수의 특수값으로 나타나는 현상을 분석하고, 선형 꼭짓점 가중치로 대체하여 '코너 급수(corner series)' 모음을 구성한다. Ramanujan의 Lost Notebook에 기록된 부분 및 거짓 세타 항등식을 활용하여 두 색 분할 항등식, 세 차원 코너 구조, 그리고 다양한 합동 공식을 도출한다.", "technique": "분할-계수 생성함수 커널의 유지와 가중치 변환, Burson의 상자형 모듈 대합(boxed modular involution)을 통한 통일 모델 제시, root-of-unity 특수화", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.26615v1", "title": "Bootstrap percolation on the hypercube", "authors": ["Fengxing Zhu"], "abstract": "In this paper we obtain the critical probability $p_c(Q_{n},r)$ for bootstrap percolation with the infection threshold $r=f(n)n^a$ on the $n$-dimensional hypercube $Q_{n}$, where $0<a<1$ and $f(n)=n^{o(1)}$. More precisely, we obtain the exact first-order and second-order terms of $p_c(Q_{n},r)$ by extending the main theorem of Balogh, Bollob{á}s, and Morris (2009).", "categories": ["math.CO", "math.PR"], "primary_category": "math.CO", "published": "2026-10-19T15:49:32+00:00", "updated": "2026-10-19T15:49:32+00:00", "abs_url": "http://arxiv.org/abs/2610.26615v1", "pdf_url": "https://arxiv.org/pdf/2610.26615v1", "journal_ref": "", "doi": "", "comment": "This paper and V5 of arXiv:2503.12607[math.CO] supersede V1-V4 of arXiv:2503.12607[math.CO] as the results have been significantly improved and a main mistake has been fixed", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Bootstrap percolation on hypercubes는 조합론적 확률 문제이나, McMullen's problem(볼록위치의 점 배치, oriented matroid, chirality)과는 직접적 연결이 없음.", "summary": "이 논문은 $n$차원 하이퍼큐브 $Q_n$ 위의 감염역치 $r=f(n)n^a$ (단, $0<a<1$, $f(n)=n^{o(1)}$)를 갖는 부트스트랩 퍼콜레이션의 임계 확률 $p_c(Q_n,r)$을 결정한다. Balogh-Bollobás-Morris(2009)의 주요 정리를 확장하여 1차 및 2차 항을 정확히 구한다.", "technique": "점근 해석 및 부트스트랩 동역학의 임계 확률 구조를 확장하는 조합론적 방법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.29650v1", "title": "Connected Coloring Games on Corona Products of Graphs", "authors": ["Daša Mesarič Štesl"], "abstract": "We study the connected coloring game on corona products of graphs. For connected graphs $G$ and $H$, we prove the sharp upper bound $χ_{cg}(G\\circ H)\\leq\\max\\{Δ(G),Δ(H)+1\\}+1$ and establish a further bound using the Bob-start ordinary coloring game on the second factor. We show that the difference between the Alice-start and Bob-start connected game chromatic numbers can be arbitrarily large in either direction. We further prove that a connected subgraph may have arbitrarily larger connected game chromatic number than its ambient connected graph, and that $χ_{cg}(G\\circ H)$ cannot be bounded in terms of $χ_{cg}(G)$ and $χ_{cg}(H)$ alone, even when both factors have connected game chromatic number $2$. We also obtain corona products for which the difference $χ_g-χ_{cg}$ is arbitrarily large and construct infinitely many connected graphs with $χ_g<χ_{cg}$. Finally, for corona products of trees, we prove the universal upper bound $5$, characterize those attaining the value $3$, give structural sufficient conditions for the value $4$, and exhibit a broad family attaining the value $5$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-21T12:30:26+00:00", "updated": "2026-10-21T12:30:26+00:00", "abs_url": "http://arxiv.org/abs/2610.29650v1", "pdf_url": "https://arxiv.org/pdf/2610.29650v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 색칠 게임은 조합론이지만 McMullen's problem(볼록 위치의 점 배치, oriented matroid, 실현가능성)과는 직접적 연관이 없다.", "summary": "이 논문은 그래프의 코로나 곱(corona product)에서 연결 색칠 게임(connected coloring game)을 연구한다. 연결된 그래프 G, H에 대해 $\\chi_{cg}(G\\circ H) \\leq \\max\\{\\Delta(G), \\Delta(H)+1\\}+1$의 상한을 증명하고, Alice-start와 Bob-start 게임 색수의 차이가 임의로 커질 수 있음을 보인다. 트리의 코로나 곱에 대해 보편적 상한 5를 얻고 특정 값을 갖는 경우들을 특성화한다.", "technique": "게임-이론적 분석과 그래프 구조적 귀납법(maximal degree, 부분그래프 관계 활용)", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.28789v1", "title": "Spherically Supported Sets with Variable Radii", "authors": ["Chadi Nour"], "abstract": "We study closed sets for which, at every boundary point, there exists a containing supporting ball whose prescribed radius may vary from point to point. This extends the notion of spherical support from constant to variable radii. The variable-radius setting presents a new difficulty: unlike the constant-radius case, the intersection of the supporting balls need not be strongly convex with respect to the prescribed radii. We overcome this difficulty by associating with every such set a canonical set and an induced radius function determined by the active supporting balls. For continuous prescribed radii, our main result establishes a geometric dichotomy: the original set either coincides with the canonical set and is strongly convex with respect to the prescribed radii, or it is contained in the boundary of the canonical set, which is strongly convex with respect to the induced radii. An example shows that the induced radii cannot, in general, be replaced by the prescribed ones in the second alternative. We also recover the constant-radius theory and characterize variable-radius strong convexity in terms of the spherical support of the boundary.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-10-20T18:18:49+00:00", "updated": "2026-10-20T18:18:49+00:00", "abs_url": "http://arxiv.org/abs/2610.28789v1", "pdf_url": "https://arxiv.org/pdf/2610.28789v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen's problem은 볼록위치의 점 배치와 oriented matroid 관련 이산 조합 구조에 관한 것이나, 본 논문은 미분기하와 볼록해석의 구면 지지(spherical support) 개념을 다루는 연속 기하학이므로 직접 관련성이 거의 없음.", "summary": "본 논문은 경계의 각 점에서 변수 반지름 $r(p)$를 가진 포함 지지 구(supporting ball)가 존재하는 닫힌 집합을 연구한다. 변수 반지름의 어려움을 극복하기 위해 정규 집합(canonical set)과 활성 지지 구에 의해 유도된 반지름 함수를 도입하고, 연속 반지름에 대해 원래 집합이 정규 집합과 일치하거나 그 경계에 포함되는 기하학적 이분법을 증명한다.", "technique": "정규 집합 구성과 유도 반지름 함수를 통한 강볼록성(strong convexity) 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.30369v1", "title": "Permutation classes need not have proper growth rates", "authors": ["Jay Pantone", "Vincent Vatter"], "abstract": "By the Marcus-Tardos Theorem (formerly the Stanley-Wilf Conjecture), every permutation class other than the class of all permutations has a finite upper growth rate, meaning that the $n$th root of the number of permutations of length $n$ in the class has a finite limit superior. It has long been conjectured that this limit superior is in fact always a proper limit. We disprove this by constructing a permutation class whose upper and lower growth rates differ. The construction uses grid classes with cubic row-column graphs of increasing girth, obtained from Haar graphs of finite 2-groups. The corresponding hereditary property of ordered graphs also disproves an analogous 2006 conjecture of Balogh, Bollobás, and Morris. Along the way, we show that every proper permutation class with a D-finite generating function has a proper growth rate. We also establish refined enumerative bounds for grid classes, which lead to a short proof of Albert and Vatter's generalization of Bevan's Theorem on the growth rates of grid classes.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-21T19:29:39+00:00", "updated": "2026-10-21T19:29:39+00:00", "abs_url": "http://arxiv.org/abs/2610.30369v1", "pdf_url": "https://arxiv.org/pdf/2610.30369v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "순열류의 성장률 문제는 조합론적 구조이지만 McMullen's problem(볼록위치 점 배치, oriented matroid, 다면체 기하)과는 직접적 연관이 없음.", "summary": "Marcus-Tardos 정리에도 불구하고 순열류의 상한 성장률과 하한 성장률이 다를 수 있음을 보인다. 유한 2-군의 Haar 그래프에서 유도된 큰 둘레의 입방 행-열 그래프를 가진 격자류(grid classes)를 구성하여 반례를 제시하고, D-finite 생성함수를 갖는 순열류는 올바른 성장률을 갖는다는 결과도 도출한다.", "technique": "Haar 그래프(finite 2-groups에서 유도)와 증가하는 둘레의 입방 행-열 그래프를 이용한 격자류 구성, D-finite 생성함수 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.35689v2", "title": "Facet normals of Minkowski sums of staircase simplices", "authors": ["Yushan Qu", "Jon Lee"], "abstract": "Staircase simplices are the simplices of the standard (Freudenthal--Kuhn) triangulation of $[0,1]^d$ and of Stanley's triangulations of order polytopes. We study the facet normals of their Minkowski sums and how the number of summands constrains the size of primitive integer normals. We characterize the normals attainable with a prescribed number of summands in terms of $d-1$ linearly independent zero-one vectors orthogonal to the normal, whose supports have an intersection graph that can be colored with one color per summand. This gives a combinatorial characterization of the least number of summands needed to realize a normal. For two summands, all primitive normals have entries in $\\{-1,0,1\\}$, and we determine which of them occur. For three summands we bound every entry in absolute value by $3^{(d-2)/3}$ and construct normals with entries of order $θ^d$, $θ$ the plastic number; for four summands a second construction gives entries of order $ψ^d$, $ψ$ the supergolden ratio. Since $ψ>3^{1/3}$, the largest coefficients for three and four summands are exponentially separated. For vectors with at most two distinct nonzero entry values, we determine the least number of summands exactly, using a matching-rank formula proved by exterior algebra and representations of symmetric groups. With no restriction on the number of summands, the maximum coefficient equals the classical maximum for facets of $0/1$-polytopes in the same dimension.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-26T16:20:53+00:00", "updated": "2026-10-27T16:27:19+00:00", "abs_url": "http://arxiv.org/abs/2610.35689v2", "pdf_url": "https://arxiv.org/pdf/2610.35689v2", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 staircase simplex의 Minkowski 합의 facet normal을 연구하며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 표준 (Freudenthal–Kuhn) 삼각분할의 simplex인 staircase simplex의 Minkowski 합의 facet normal을 연구한다. 합산 개수(summand 수)가 primitive integer normal의 크기를 어떻게 제한하는지 특성화하며, 두 summand의 경우 모든 primitive normal의 성분이 $\\{-1,0,1\\}$에 속함을 증명하고, 세 summand의 경우 각 성분의 절댓값을 $3^{(d-2)/3}$으로 bound하며 plastic number $\\theta$의 지수적 성장을 갖는 normal을 구성한다. 또한 exterior algebra와 대칭군의 표현론을 이용한 matching-rank 공식으로, 서로 다른 비영 성분값이 최대 두 개인 벡터에 대해 최소 summand 수를 정확히 결정한다.", "technique": "Exterior algebra 및 대칭군 표현론을 활용한 matching-rank 공식과, 법선 벡터에 직교하는 zero-one 벡터의 support 교집합 그래프의 채색(coloring)을 이용한 조합론적 특성화.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2610.35668v2", "title": "On the facets of the Cayley polytope of Stanley's triangulation", "authors": ["Yushan Qu", "Jon Lee"], "abstract": "Disjunctions over the cells of a triangulation arise in formulations of piecewise-linear functions. For a poset $P$ on $[d]$, we study the convex hull $D$ of the simplices of Stanley's triangulation of the order polytope of $P$, each lifted by its own indicator vector. Via the Cayley trick, for any disjunction of full-dimensional polytopes, the facets of the convex hull other than those described by the bounds on the indicator variables correspond to the facet normals of the Minkowski sum of the polytopes, and each is described by the full optimal big-M lifting of the supporting inequality with that normal of any one polytope. For Stanley's triangulation, with $M(P)$ the Minkowski sum of its simplices, lifting only the facet-describing inequalities of the simplices need not suffice, unlike some other cases; we show that it suffices if and only if $M(P)$ is alcoved, if and only if deleting one element of $P$ leaves a chain. Otherwise, the coefficients of the additional facet-describing inequalities are governed by the least number $\\ell(P)$ of elements whose deletion leaves a chain: for fixed $\\ell(P)$, the largest entry of a primitive facet normal grows like $d^{\\ell(P)-1}$, and it can be exponential in $d$ if $\\ell(P)$ grows with $d$. For $d \\geq 3$ and $\\ell(P)\\leq2$ the sharp bound is $d-2$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-26T16:12:43+00:00", "updated": "2026-10-27T16:13:24+00:00", "abs_url": "http://arxiv.org/abs/2610.35668v2", "pdf_url": "https://arxiv.org/pdf/2610.35668v2", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Stanley의 삼각분할과 Cayley 폴리토프의 패싯(facet) 분석에 관한 것으로, McMullen 문제나 Larman 추측과 직접적 관련이 없다.", "summary": "포셋(poset) $P$ 위의 Stanley 삼각분할의 단체(simplex)들을 지시 벡터로 리프팅하여 얻은 볼록 껍질 $D$의 패싯을 분석한다. Cayley 트릭을 이용해 $D$의 패싯이 단체들의 Minkowski 합 $M(P)$의 패싯 법선과 대응됨을 보이고, 단체의 패싯 기술 부등식만으로 충분한 조건이 '$M(P)$가 alcoved인 것', 즉 '$P$에서 원소 하나를 제거하면 체인(chain)이 되는 것'과 동치임을 증명한다. 그렇지 않은 경우, 추가 패싯 법선의 계수는 $\\ell(P)$에 의해 결정되며, 고정된 $\\ell(P)$에서 원시(primitive) 패싯 법선의 최대 성분은 $d^{\\ell(P)-1}$처럼 성장한다.", "technique": "Cayley 트릭(Cayley trick)을 통해 볼록 껍질의 패싯을 Minkowski 합의 패싯 법선으로 환원하고, big-M 리프팅과 alcoved 폴리토프 이론을 활용하여 패싯 기술 부등식의 계수 성장률을 분석한다.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2610.39116v1", "title": "Some results on intersecting families of triangulations", "authors": ["Imre Leader", "Ta Sheng Tan"], "abstract": "Kalai conjectured that the largest intersecting family of triangulations of an $n$-gon is the family consisting of all triangulations that contain a fixed ear (a chord of length $2$). What happens if we strengthen the intersecting condition to the condition that any two of the triangulations must intersect on a chord from a specified family of chords -- for example, what if any two triangulations intersect on a chord from some fixed point of the $n$-gon, or intersect on an ear?   In this paper we verify Kalai's conjecture for families of triangulations in which any two intersect on a chord from some fixed point. We also show that any ear-intersecting family of triangulations has size at most $T_{n-1} +T_{n-3} = T_{n-1}(17/16 + o(1))$, where $T_{n-1}$ is the upper bound in Kalai's conjecture, namely the number of triangulations of an $(n-1)$-gon. This is based on an exact upper bound of $T_{n-1}$ for the size of a family of triangulations in which any two intersect on some ear from the set of all ears with one ear excluded.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-29T01:01:20+00:00", "updated": "2026-10-29T01:01:20+00:00", "abs_url": "http://arxiv.org/abs/2610.39116v1", "pdf_url": "https://arxiv.org/pdf/2610.39116v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 다각형의 삼각분할(triangulation) 족의 교차 문제(Kalai 추측)를 다루며, McMullen 문제나 oriented matroid와는 직접적 연관이 없다.", "summary": "이 논문은 $n$각형의 삼각분할 족 중 임의의 두 삼각분할이 특정 현(chord) 족 위에서 교차하는 조건을 연구한다. 고정된 꼭짓점에서 나오는 현 위에서 교차하는 족에 대해 Kalai 추측을 검증하고, 임의의 두 삼각분할이 어떤 귀(ear, 길이 2의 현) 위에서 교차하는 'ear-intersecting' 족의 크기 상한이 $T_{n-1} + T_{n-3} = T_{n-1}(17/16 + o(1))$임을 보인다. 여기서 $T_{n-1}$은 Kalai 추측의 상한, 즉 $(n-1)$각형의 삼각분할 수이다.", "technique": "하나의 귀를 제외한 모든 귀의 집합에서 교차하는 삼각분할 족의 크기 상한 $T_{n-1}$에 대한 정확한(exact) 상한 증명을 핵심 보조 결과로 활용한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.39078v1", "title": "Borsuk number in four dimensions is at most seven", "authors": ["Andrii Arman", "Andriy Bondarenko", "Andriy Prymak", "Danylo Radchenko"], "abstract": "We prove that every bounded set of diameter one in four-dimensional Euclidean space can be covered by seven balls of diameter strictly smaller than $0.9999$. In particular, the Borsuk number satisfies $b_4\\le7$. The proof combines geometric arguments based on contact points of the circumball with an exact finite computation. For small and large circumradius, the covering centres are constructed analytically. In the remaining range, a suitable triangle of contact points reduces the problem to a four-parameter family of ball polytopes. The parameter cube is subdivided into 23494 boxes. For each parameter box, candidate centres are found by nonlinear optimization, and the resulting covering is verified using exact rational interval arithmetic and paraboloid lifting.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-10-29T00:14:17+00:00", "updated": "2026-10-29T00:14:17+00:00", "abs_url": "http://arxiv.org/abs/2610.39078v1", "pdf_url": "https://arxiv.org/pdf/2610.39078v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Borsuk 분할 문제는 이산기하학 분야이나, McMullen 문제(oriented matroid, convex position 점 배치, f(5)=11 등)와 직접적인 연관이 없다.", "summary": "이 논문은 4차원 유클리드 공간에서 지름 1인 임의의 유계 집합을 지름 $0.9999$보다 작은 7개의 공으로 덮을 수 있음을 증명하여, Borsuk 수의 상한 $b_4 \\le 7$을 확립한다. 증명은 외접구(circumball)의 접촉점에 기반한 기하학적 논증과 정확한 유한 계산을 결합한다. 잔여 범위에서는 4-매개변수 ball polytope 족으로 문제를 축소하고, 23494개의 박스로 매개변수 공간을 세분하여 유리수 구간 산술로 검증한다.", "technique": "외접구 접촉점 분석, 비선형 최적화로 후보 중심 탐색, 포물면 lifting 및 정확한 유리수 구간 산술(exact rational interval arithmetic)을 이용한 컴퓨터 보조 검증.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.38900v1", "title": "Sharp dimension bounds for right-angled hyperbolic polytopes", "authors": ["Alexander Kolpakov"], "abstract": "We determine the largest dimensions in which right-angled hyperbolic polytopes of finite volume can exist. The dimension is at most eight in general, and at most four when all vertices lie at infinity. Both bounds are attained, improving the previously known upper bounds of twelve and six. Our proofs use elementary properties of hyperbolic polytopes together with bounds for configurations of points on spheres.", "categories": ["math.GT", "math.MG"], "primary_category": "math.GT", "published": "2026-10-28T20:56:58+00:00", "updated": "2026-10-28T20:56:58+00:00", "abs_url": "http://arxiv.org/abs/2610.38900v1", "pdf_url": "https://arxiv.org/pdf/2610.38900v1", "journal_ref": "", "doi": "", "comment": "6 pages; GitHub repository at https://github.com/sashakolpakov/CoxeterPolytopes/", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "직각 쌍곡 다면체(right-angled hyperbolic polytopes)의 최대 차원 결정 문제로, McMullen 문제나 Larman 추측과 직접적 관련이 없음.", "summary": "이 논문은 유한 부피를 갖는 직각 쌍곡 다면체(right-angled hyperbolic polytopes)가 존재할 수 있는 최대 차원을 결정한다. 일반적인 경우 차원은 최대 8, 모든 꼭짓점이 무한원(infinity)에 있는 경우 최대 4임을 증명하며, 두 상한 모두 실현됨을 보여 기존 상한(각각 12와 6)을 개선한다. 증명은 쌍곡 다면체의 기초적 성질과 구면 위 점 배치(configurations of points on spheres)에 대한 상한을 결합한다.", "technique": "쌍곡 다면체의 기초적 성질과 구면 위 점 배치(spherical point configurations)에 대한 상한을 결합하여 차원 상한을 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.38658v1", "title": "Larger Crossing Families", "authors": ["Joachim Orthaber", "Patrick Schnider"], "abstract": "We give the first explicit constant for crossing families of linear size by showing that every set of $n$ points in general position in the plane contains a crossing family of size approximately $\\frac{n}{79}$. We further identify some conditions where there are even larger crossing families. The first such condition forbids the existence of a large different pattern, namely non-convex 4-clusters: We show that every point set contains either a large non-convex 4-cluster or a large crossing family. The second condition is the existence of many crossings: We give a bound for the size of a crossing family in terms of the number of crossings of the complete geometric graph drawn on the point set.", "categories": ["math.CO", "cs.CG"], "primary_category": "math.CO", "published": "2026-10-28T18:42:01+00:00", "updated": "2026-10-28T18:42:01+00:00", "abs_url": "http://arxiv.org/abs/2610.38658v1", "pdf_url": "https://arxiv.org/pdf/2610.38658v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 점 집합에서의 crossing family에 관한 것으로, McMullen 문제(5차원 일반 위치 점 배치, oriented matroid)와 직접적인 연관이 없다.", "summary": "이 논문은 평면의 일반 위치 $n$개 점 집합에서 크기 약 $\\frac{n}{79}$인 crossing family가 존재함을 보여, 선형 크기 crossing family에 대한 최초의 명시적 상수를 제공한다. 또한 non-convex 4-cluster가 없는 경우 더 큰 crossing family가 존재함을 보이고, 완전 기하 그래프의 교차 수와 crossing family 크기의 관계도 제시한다.", "technique": "non-convex 4-cluster의 존재 여부에 따른 경우 분석 및 완전 기하 그래프의 교차 수를 이용한 crossing family 크기 하한 도출.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2610.38369v1", "title": "The 120-Cell Dissected by the Hyperplanes of Its Final Stellation: the golden ring Z[phi] as foundation, from Kramer's seven cells to 2,455,201 cells in 338 orbits", "authors": ["Miguel E. Pérez Ibarra", "Jaziel Flores Rodríguez"], "abstract": "The diagonals of a regular pentagon dissect it into eleven pieces and draw a pentagram; the dodecahedron dissected by the twelve face planes of its inner core gives Kramer's seven \"elementary cells\" of 1982. We define the stellation dissection of a golden regular polytope in any dimension as the dissection of the convex hull of its final regular stellation by the facet hyperplanes of the core, show that the core has phi^(-d) of the inradius of the hull for d = 2, 3, 4, and carry the dissection out for the first time on the 120-cell. The foundation is the arithmetic of the golden ring Z[phi], the ring of integers of Q(sqrt 5): vertices and hyperplanes live in Z[phi]^d, every orientation test is the exact sign of an element of Z[phi], decided with integers, and the pieces are named by sign vectors. We develop this foundation from scratch (conjugation, norm, units, the primes sqrt 5, 2, 3, the exact sign test, the lattice x -> (x, conj x), the vertex modules of the dodecahedron and the 120-cell, the icosian ring) and let it carry the geometry. The definition bifurcates in dimension four: the star cut at depth phi^(-4), a unit, has 2,455,201 cells in 338 orbits of H4; the hereditary cut at depth 1 - phi^(-4) = sqrt 5 / phi^2, a unit times the ramified prime, induces the three-dimensional dissection on every facet and has 8,161 cells in 8 orbits. New here: all vertices of the dodecahedral and of the hereditary dissection lie in the vertex module of the polytope being cut, whereas the star cut needs the denominators 2, 3 and 5; the seven kinds of pieces of the dodecahedron are exactly the I_h-orbits of sign vectors, with stellation layer equal to the number of plus signs. We catalogue the four-dimensional pieces and treat the circumscribed disc, ball and 4-ball. Every number quoted is recomputed exactly by a script whose output is reproduced in an appendix.", "categories": ["math.MG", "cs.CG", "math.NT"], "primary_category": "math.MG", "published": "2026-10-28T07:08:06+00:00", "updated": "2026-10-28T07:08:06+00:00", "abs_url": "http://arxiv.org/abs/2610.38369v1", "pdf_url": "https://arxiv.org/pdf/2610.38369v1", "journal_ref": "", "doi": "", "comment": "37 pages, 14 figures; catalogue of the 338 orbits and the output of the exact checks in the appendices", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 120-cell의 황금 정다포체 절개(stellation dissection)와 Z[φ] 산술을 다루며, McMullen 문제(d=5 일반 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 120-cell을 그 최종 별모양 다포체(final stellation)의 초평면으로 절개하는 '황금 정다포체 절개(stellation dissection)'를 정의하고, 황금환 $\\mathbb{Z}[\\phi]$(즉 $\\mathbb{Q}(\\sqrt{5})$의 정수환)를 산술적 기반으로 삼아 정확한 부호 판정을 수행한다. 4차원에서 절개는 두 가지(star cut: 2,455,201개 셀, 338개 $H_4$-궤도; hereditary cut: 8,161개 셀, 8개 궤도)로 분기되며, 도데카헤드론의 7가지 조각이 부호 벡터(sign vector)의 $I_h$-궤도와 정확히 대응함을 보인다. 모든 수치는 스크립트로 정확히 재계산되어 부록에 수록되었다.", "technique": "$\\mathbb{Z}[\\phi]$ 산술(켤레, 노름, 소수, 정확한 부호 검사, 꼭짓점 모듈, icosian ring)을 기반으로 초평면 방향 판정을 정수 연산으로 정확히 수행하고 부호 벡터로 셀을 분류한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.38368v1", "title": "Crescent configurations in three dimensions", "authors": ["Yuda Chen"], "abstract": "A crescent configuration of $n$ points in $\\mathbb R^d$ is a set in general position whose distinct pairwise distances have multiplicities $1,\\ldots,n-1$. We construct such a configuration in $\\mathbb R^3$ for every $n\\geq3$, giving a uniform bound of three for the minimum dimension. The proof uses equally spaced parameters on a short circular helix and Rolle's theorem. We also give explicit integer-coordinate configurations with $O(n\\log n)$ bits per coordinate, and prove that every finite initial segment of the sequence $(\\cos j,\\sin j,2j)_{j\\geq0}$ of length at least three is a crescent configuration.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-28T07:06:19+00:00", "updated": "2026-10-28T07:06:19+00:00", "abs_url": "http://arxiv.org/abs/2610.38368v1", "pdf_url": "https://arxiv.org/pdf/2610.38368v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 crescent configuration(쌍별 거리 중복도 조건)에 관한 것으로, McMullen 문제(볼록/일반 위치 점 배치, acyclic reorientation)와는 직접적 관련이 없다.", "summary": "$\\mathbb{R}^d$에서의 crescent configuration이란 일반 위치(general position)에 있는 $n$개의 점 집합으로, 서로 다른 쌍별 거리의 중복도가 $1, \\ldots, n-1$인 구성이다. 이 논문은 짧은 원형 나선(circular helix) 위의 등간격 매개변수와 Rolle의 정리를 이용하여 모든 $n \\geq 3$에 대해 $\\mathbb{R}^3$에서 crescent configuration을 구성하며, 최소 차원의 균일한 상한이 3임을 증명한다. 또한 좌표당 $O(n \\log n)$ 비트의 정수 좌표 명시적 구성과, 수열 $(\\cos j, \\sin j, 2j)_{j \\geq 0}$의 길이 3 이상의 모든 유한 초기 구간이 crescent configuration임을 증명한다.", "technique": "짧은 원형 나선 위의 등간격 매개변수화와 Rolle의 정리를 결합하여 crescent configuration의 존재를 증명.", "connections": "", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2610.37017v1", "title": "From amplituhedra to flagtopes", "authors": ["Grant T. Barkley", "Steven N. Karp", "Kaitao Xie"], "abstract": "The amplituhedron was introduced by Arkani-Hamed and Trnka (2014) to geometrically encode scattering amplitudes in high-energy physics. It can be viewed as the generalization of a cyclic polytope into the Grassmannian, and is defined to be the projection of the totally nonnegative part of one Grassmannian with respect to a totally negative element of a second Grassmannian. We construct a Lie-theoretic generalization of amplituhedra called 'flag amplituhedra', by replacing the pair of Grassmannians in the definition with an arbitrary pair of partial flag varieties for a reductive group $G$. We study in detail an example of a flag amplituhedron which is not a Grassmannian amplituhedron; it is a curved hexagon in $\\mathbb{P}^1\\times \\mathbb{P}^1$.", "categories": ["math.RT", "math-ph", "math.AG", "math.CO"], "primary_category": "math.RT", "published": "2026-10-27T10:55:03+00:00", "updated": "2026-10-27T10:55:03+00:00", "abs_url": "http://arxiv.org/abs/2610.37017v1", "pdf_url": "https://arxiv.org/pdf/2610.37017v1", "journal_ref": "", "doi": "", "comment": "26 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Lie군·Grassmannian·flag variety에 관한 대수기하학적 연구로, McMullen의 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "Arkani-Hamed와 Trnka가 도입한 amplituhedron(cyclic polytope의 Grassmannian 일반화)을 Lie 이론적으로 확장하여 'flag amplituhedron'을 구성한다. 이는 두 Grassmannian 대신 임의의 reductive group $G$에 대한 partial flag variety 쌍을 사용하여 정의된다. 구체적 예로 $\\mathbb{P}^1\\times\\mathbb{P}^1$ 안의 curved hexagon 형태의 flag amplituhedron을 상세히 분석한다.", "technique": "Reductive group $G$에 대한 partial flag variety의 totally nonnegative part와 totally negative element를 이용한 사영(projection)으로 flag amplituhedron을 구성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2610.36566v1", "title": "Helly theorems for lattice of flats of a matroid", "authors": ["Amir Jafari", "Kiumars Kaveh"], "abstract": "A basis of a matroid is adapted to a flat if it contains a basis of the flat. We prove that a family of flats in a rank r matroid has a common adapted basis whenever every subfamily of at most r+1 flats does. The ground set and the family may be infinite; only the rank must be finite. This result, in particular, contains Klyachko's vector space Helly theorem for subspaces. As an application, we obtain a splitting criterion for tropical toric vector bundles on projective spaces. As a secondary application, we derive quadratic bounds for the Helly number for distributive generation in the lattice of flats.", "categories": ["math.CO", "math.AG"], "primary_category": "math.CO", "published": "2026-10-27T03:15:42+00:00", "updated": "2026-10-27T03:15:42+00:00", "abs_url": "http://arxiv.org/abs/2610.36566v1", "pdf_url": "https://arxiv.org/pdf/2610.36566v1", "journal_ref": "", "doi": "", "comment": "16 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 matroid의 flat의 격자에 대한 Helly 정리를 다루며, McMullen 문제(oriented matroid, convex position, 점 배치)와 직접적인 관련성이 없다.", "summary": "rank $r$인 matroid에서 flat들의 family가 공통 적응 기저(common adapted basis)를 가지려면, 최대 $r+1$개의 부분 family마다 공통 적응 기저가 존재하는 것으로 충분함을 증명한다. 이 결과는 Klyachko의 벡터 공간 Helly 정리를 포함하며, tropical toric 벡터 번들의 분리 기준(splitting criterion) 및 distributive generation에 대한 Helly 수의 이차(quadratic) 상한 도출에 응용된다.", "technique": "Matroid의 flat 격자(lattice of flats) 구조를 이용한 Helly형 조합론적 논증.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2610.36390v1", "title": "Tropical spin Hurwitz numbers", "authors": ["Lou-Jean Leila Cobigo", "Marvin Anas Hahn"], "abstract": "We introduce a tropical framework for the study of spin Hurwitz numbers and their completed cycles analogues. We use degeneration techniques to obtain an interpretation of spin Hurwitz numbers via tropical covers. We employ the tropical methods to obtain new closed formulae for spin Hurwitz numbers in special cases. Moreover, we employ Fock space techniques to tropicalise completed cycles spin Hurwitz numbers. Using this, we prove that spin Hurwitz numbers admit a piecewise polynomial structure akin to their classical counterparts. We also derive wall--crossing formulae.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-10-26T23:16:32+00:00", "updated": "2026-10-26T23:16:32+00:00", "abs_url": "http://arxiv.org/abs/2610.36390v1", "pdf_url": "https://arxiv.org/pdf/2610.36390v1", "journal_ref": "", "doi": "", "comment": "56 pages, 19 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 spin Hurwitz 수와 tropical cover에 관한 연구로, McMullen 문제(볼록 위치, oriented matroid, 점 배치)와 직접적인 관련이 없다.", "summary": "본 논문은 spin Hurwitz 수와 그 completed cycles 유사체를 연구하기 위한 tropical 프레임워크를 도입한다. 퇴화(degeneration) 기법을 통해 spin Hurwitz 수를 tropical cover로 해석하고, Fock space 기법을 활용하여 completed cycles spin Hurwitz 수를 열대화(tropicalise)한다. 이를 통해 spin Hurwitz 수가 고전적 대응물과 유사한 piecewise polynomial 구조를 가짐을 증명하고, 벽-교차(wall-crossing) 공식을 도출한다.", "technique": "퇴화(degeneration) 기법, tropical cover 해석, Fock space 기법을 결합하여 spin Hurwitz 수의 closed formula와 piecewise polynomial 구조를 확립한다.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2608.30285v1", "title": "Unfolding Overlaps of the Exceptional Regular Polytopes", "authors": ["Satyan L. Devadoss", "Matthew Harvey", "David Richter"], "abstract": "We find explicit ridge unfoldings of the three exceptional 4D polytopes (24-cell, 120-cell, 600-cell) that result in overlaps of their facets. These failures bring an end to the full classification of regular polytopes with the all-net property.", "categories": ["cs.CG", "math.CO"], "primary_category": "cs.CG", "published": "2026-08-31T05:52:48+00:00", "updated": "2026-08-31T05:52:48+00:00", "abs_url": "http://arxiv.org/abs/2608.30285v1", "pdf_url": "https://arxiv.org/pdf/2608.30285v1", "journal_ref": "", "doi": "", "comment": "11 pages, 4 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 4차원 정다면체의 ridge unfolding과 all-net 분류에 관한 것으로, McMullen의 문제(oriented matroid, 점 배치, f(5)=11)와 직접적인 관련이 없다.", "summary": "이 논문은 24-cell, 120-cell, 600-cell의 세 예외적 4차원 정다면체에 대해 facet이 겹치는 명시적 ridge unfolding을 발견한다. 이 결과들은 all-net 성질을 갖는 정다면체의 완전한 분류를 마무리 짓는다.", "technique": "4차원 정다면체의 ridge unfolding(능선 전개)을 명시적으로 구성하여 facet 중첩(overlap)을 확인하는 방법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.29260v1", "title": "Generalized Spectral Closedness and the Nonexistence of Walk-Realizable Supporters for Split Graphs", "authors": ["Yanyang Li"], "abstract": "Let $\\mathcal F=\\{2K_2,C_4,C_5\\}$, so that $\\operatorname{Forb}(\\mathcal F)$ is the class of split graphs. Resolving a conjecture of Wang and Tang, we prove that the class of split graphs is generalized spectrally closed and that it admits no walk-realizable $\\mathcal F$-supporter of any finite order.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-29T13:27:24+00:00", "updated": "2026-08-29T13:27:24+00:00", "abs_url": "http://arxiv.org/abs/2608.29260v1", "pdf_url": "https://arxiv.org/pdf/2608.29260v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 split graph의 스펙트럼 폐쇄성(spectral closedness)과 walk-realizable supporter에 관한 것으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "$\\mathcal{F}=\\{2K_2, C_4, C_5\\}$로 정의된 forbidden 그래프 집합에 대해, $\\operatorname{Forb}(\\mathcal{F})$인 split graph 클래스가 일반화된 스펙트럼 폐쇄(generalized spectrally closed) 성질을 가짐을 증명한다. 또한 split graph 클래스는 유한 차수의 walk-realizable $\\mathcal{F}$-supporter를 허용하지 않음을 보임으로써 Wang과 Tang의 추측을 해결한다.", "technique": "", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.10513v1", "title": "Unimodality shenanigans in Ehrhart theory", "authors": ["Luis Ferroni"], "abstract": "We show the existence of counterexamples to a four-decade-old conjecture attributed to Stanley concerning the unimodality of $h^*$-polynomials of IDP polytopes. As additional applications of our main constructions, we also disprove a conjecture by Brenti on the log-concavity of $h^*$-polynomials of Gorenstein IDP polytopes, and a conjecture by Ferroni and Higashitani concerning the log-concavity of the Ehrhart series of IDP polytopes. We also answer their question about the existence of very ample polytopes with non-log-concave interior Ehrhart series. Our class of examples arises by taking Cayley sums of rectangular prisms, and hence they possess regular unimodular flag triangulations by a result of Haase, Paffenholz, Piechnik and Santos. For the unimodality conjecture, we can even find smooth counterexamples.", "categories": ["math.CO", "math.AC"], "primary_category": "math.CO", "published": "2026-09-09T17:48:32+00:00", "updated": "2026-09-09T17:48:32+00:00", "abs_url": "http://arxiv.org/abs/2609.10513v1", "pdf_url": "https://arxiv.org/pdf/2609.10513v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Ehrhart 이론에서 $h^*$-다항식의 단봉성(unimodality) 및 로그-오목성(log-concavity) 추측들에 대한 반례를 구성하는 연구로, McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 Stanley의 40년 된 추측(IDP 폴리토프의 $h^*$-다항식 단봉성)에 대한 반례의 존재를 증명하고, Brenti의 Gorenstein IDP 폴리토프 $h^*$-다항식 로그-오목성 추측과 Ferroni–Higashitani의 IDP 폴리토프 Ehrhart 급수 로그-오목성 추측도 함께 반박한다. 반례들은 직육면체(rectangular prism)들의 Cayley 합으로 구성되며, Haase–Paffenholz–Piechnik–Santos의 결과에 의해 정칙 유니모듈러 플래그 삼각분할을 가진다. 단봉성 추측에 대해서는 매끄러운(smooth) 반례도 존재함을 보인다.", "technique": "직육면체의 Cayley 합을 이용하여 정칙 유니모듈러 플래그 삼각분할을 갖는 반례 폴리토프 족을 명시적으로 구성한다.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.17250v1", "title": "Weighted lattice point enumeration in lecture hall order polytopes", "authors": ["Katharina Jochemko", "Krishna Menon"], "abstract": "We consider weighted lattice point enumeration in lecture hall order polytopes. We observe that these half-open polytopes are closed under weight-lifting for a large class of polynomial weights, including monomials and weights given by binomial coefficients. For rooted trees, we prove that the corresponding (weighted) $h^\\ast$-polynomial is real-rooted thereby complementing previous results of Savage-Visontai and Brändén-Leander.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T14:31:31+00:00", "updated": "2026-09-15T14:31:31+00:00", "abs_url": "http://arxiv.org/abs/2609.17250v1", "pdf_url": "https://arxiv.org/pdf/2609.17250v1", "journal_ref": "", "doi": "", "comment": "9 pages, 2 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 lecture hall order polytope의 가중 격자점 열거(weighted lattice point enumeration)와 $h^*$-다항식의 실근성(real-rootedness)을 다루며, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 lecture hall order polytope에서의 가중 격자점 열거를 연구하며, 단항식 및 이항계수로 주어진 다항식 가중치를 포함하는 넓은 범주에 대해 이 반열린(half-open) 다면체가 weight-lifting에 닫혀 있음을 보인다. 뿌리 있는 트리(rooted tree)에 대해 대응하는 (가중) $h^*$-다항식이 실근(real-rooted)임을 증명하여 Savage-Visontai 및 Brändén-Leander의 기존 결과를 보완한다.", "technique": "반열린 다면체의 weight-lifting 성질과 $h^*$-다항식의 실근성 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.16776v1", "title": "Exact Labelled Layer-Order Classification for Period-2 Mountain--Valley Assignments on 2 x 2k Maps", "authors": ["Michael Fofonov"], "abstract": "We classify the labelled final layer orders of ordinary orthogonal 2 x 2k maps whose mountain-valley assignments are periodic with period two in each crease family. For k >= 2, local flat-foldability leaves 16 of the 64 formal period words. Eight pleat words have a unique labelled state. The remaining eight words reduce, under labelled symmetries, to two constant-row families described by row pivots. For the canonical word MMMMVV, an ordered pivot pair (a,b) is realizable exactly when a = 1, a = m, or a = b, where m = 2k - 1. For MVMMMM, realizability is equivalent to BR(a) = BR(b). In both families each compatible ordered pivot pair determines a unique labelled state. The resulting state counts are 0, 1, 6k - 5, and 4k - 3. The case k = 1 is treated separately because two formal period bits have no physical crease carriers.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T07:44:01+00:00", "updated": "2026-09-15T07:44:01+00:00", "abs_url": "http://arxiv.org/abs/2609.16776v1", "pdf_url": "https://arxiv.org/pdf/2609.16776v1", "journal_ref": "", "doi": "", "comment": "34 pages, 5 figures. Code, validation data, supplements, and interactive visualizations: https://github.com/spicmaff/per2-layer-orders/", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 종이접기(origami)의 2×2k 격자 지도에서 주기-2 산-골짜기 배정의 분류를 다루며, McMullen 문제·Larman 추측·oriented matroid 등과 직접적 관련이 없다.", "summary": "이 논문은 주기가 2인 산-골짜기 배정을 갖는 직교 2×2k 지도의 레이블된 최종 레이어 순서를 완전히 분류한다. 64개의 형식적 주기 단어 중 국소 평면 접힘 가능성 조건을 만족하는 16개를 추려, 8개의 주름(pleat) 단어는 유일한 레이블 상태를 가지며 나머지 8개는 행 피벗(row pivot)으로 기술되는 두 상수-행 패밀리로 환원됨을 보인다. MMMMVV 및 MVMMMM 두 표준 단어에 대해 순서쌍 피벗 $(a,b)$의 실현 가능 조건과 상태 수($0, 1, 6k-5, 4k-3$)를 정확히 결정한다.", "technique": "국소 평면 접힘 가능성 조건을 이용한 형식적 주기 단어 필터링 및 레이블된 대칭에 의한 행 피벗 분류.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.15890v1", "title": "PL Recognition After Two $S^2\\times S^2$ Stabilisations is PSPACE-Hard", "authors": ["Rhuaidi Antonio Burke"], "abstract": "Let $Z$ be any fixed closed connected PL $4$-manifold. We give a polynomial-time many-to-one reduction from the compressed word problem in Thompson's group $F$ to fixed-target recognition of $Z\\#_{2}(S^2\\times S^2)$. Once a finite triangulation of $Z$ has been fixed, the construction sends a straight-line program $A$ to a closed triangulated PL $4$-manifold $X_{A,Z}$ such that $\\operatorname{val}(A)=1$ in $F$ if and only if $X_{A,Z}$ is PL-homeomorphic to $Z\\#_2(S^2\\times S^2)$. Since the compressed word problem in $F$ is PSPACE-complete, every such recognition problem is PSPACE-hard. In particular, fixed-target recognition of $\\#_n(S^2\\times S^2)$ is PSPACE-hard for every fixed $n\\geq2$.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-09-14T17:14:45+00:00", "updated": "2026-09-14T17:14:45+00:00", "abs_url": "http://arxiv.org/abs/2609.15890v1", "pdf_url": "https://arxiv.org/pdf/2609.15890v1", "journal_ref": "", "doi": "", "comment": "16 pages, comments welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 PL 4-다양체 인식 문제의 계산 복잡도(PSPACE-hardness)에 관한 것으로, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 전혀 무관하다.", "summary": "Thompson 군 $F$의 압축 단어 문제(compressed word problem)로부터 임의의 고정된 닫힌 PL 4-다양체 $Z$에 대해 $Z\\#_2(S^2\\times S^2)$의 인식 문제로의 다항시간 다대일 환원을 구성한다. 구체적으로, straight-line program $A$를 삼각화된 PL 4-다양체 $X_{A,Z}$로 변환하여 $\\operatorname{val}(A)=1$ (in $F$) $\\iff$ $X_{A,Z}\\cong_{\\mathrm{PL}} Z\\#_2(S^2\\times S^2)$임을 보인다. $F$의 압축 단어 문제가 PSPACE-완전이므로, 모든 $n\\geq 2$에 대해 $\\#_n(S^2\\times S^2)$의 고정-목표 PL 인식 문제가 PSPACE-hard임이 귀결된다.", "technique": "Thompson 군 $F$의 압축 단어 문제로부터 PL 4-다양체 인식으로의 다항시간 many-to-one 환원 구성.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.15201v1", "title": "Real-Rootedness and Gamma-Positivity for a Variation of the Morris Constant Term", "authors": ["Feihu Liu", "Zihao Zhang"], "abstract": "Beck and Pixton expressed the Ehrhart polynomial of the Birkhoff polytope as a weighted sum of constant terms of several multivariate rational functions. Xin and Zhang studied a class of constant terms $h_n(t)$, which can be regarded as a variation of the Morris constant term. They proved that $h_n(t)$ is a polynomial of degree $(n-1)^2$ and obtained many nice properties involving the Morris constant term identity. Let $h_n^*(y)=(1-y)^{(n-1)^2+1}\\sum_{t\\geq0}h_n(t)y^t$. For fixed $n\\geq 3$, we obtain the following three main results: (i): $h_n^*(y)$ is a polynomial with positive integer coefficients. (ii): $h_n^*(y)$ is real-rooted. In particular, all its roots are non-positive real numbers. (iii): $h_n^*(y)$ is Gamma-positive. Furthermore, $h_n^*(y)$ is palindromic, unimodal, and ultra log-concave. This confirms Xin and Zhang's conjecture regarding $h_n^*(y)$. As a byproduct, we prove that every root of a Gamma polynomial associated with $h_n^*(y)$ is a negative real number.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T08:21:49+00:00", "updated": "2026-09-14T08:21:49+00:00", "abs_url": "http://arxiv.org/abs/2609.15201v1", "pdf_url": "https://arxiv.org/pdf/2609.15201v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Birkhoff polytope의 Ehrhart 다항식 및 Morris constant term과 관련된 실근성(real-rootedness)·감마-양수성(gamma-positivity)을 다루며, McMullen 문제나 oriented matroid와는 무관하다.", "summary": "Xin과 Zhang이 연구한 Morris constant term의 변형 $h_n(t)$에 대해, 그 Ehrhart $h^*$-다항식 $h_n^*(y)$가 양의 정수 계수를 가지며, 실근(모두 비양의 실수)이고, 감마-양수(gamma-positive)임을 증명하여 Xin–Zhang의 추측을 해결한다. 그 결과로 $h_n^*(y)$는 회문(palindromic)·단봉(unimodal)·초로그-오목(ultra log-concave) 성질도 만족하며, 연관된 감마 다항식의 모든 근이 음의 실수임도 부산물로 증명된다.", "technique": "Ehrhart $h^*$-다항식의 실근성과 감마-양수성을 분석하는 대수·조합론적 방법 사용(구체적 기법은 초록만으로는 불확실).", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.14948v1", "title": "Conway Symbols of Frieze Patterns of Dynkin Types", "authors": ["Kengo Miyamoto", "Ryuhei Suzuki"], "abstract": "In this paper, we classify the Conway symbols of the Euclidean symmetry groups of frieze patterns of Dynkin types $A_n$, $B_n$, $C_n$, $D_n$, $F_4$ and $G_2$. First, we show that the Conway symbol of a Conway--Coxeter frieze is determined by the bilateral and the central symmetry of the underlying triangulation. Secondly, we show that a frieze pattern of non-simply-laced type has the symbol ${*}\\infty\\infty$ or $\\infty\\infty$ according as its first interior row is palindromic or not, with the single exception of type $C_3$, which realises four symbols. Thirdly, we show that the same dichotomy holds for type $D_n$ with $n \\ge 5$, the symbol being read off the tagged triangulation of the once-punctured polygon attached to the frieze together with the value on its puncture edges, and that type $D_4$ realises five symbols.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T02:44:50+00:00", "updated": "2026-09-14T02:44:50+00:00", "abs_url": "http://arxiv.org/abs/2609.14948v1", "pdf_url": "https://arxiv.org/pdf/2609.14948v1", "journal_ref": "", "doi": "", "comment": "32 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 프리즈 패턴(frieze pattern)의 Conway 기호와 Dynkin 유형 분류에 관한 것으로, McMullen 문제나 oriented matroid와 직접적 관련이 없다.", "summary": "이 논문은 Dynkin 유형 $A_n$, $B_n$, $C_n$, $D_n$, $F_4$, $G_2$의 프리즈 패턴에 대한 유클리드 대칭군의 Conway 기호를 분류한다. Conway–Coxeter 프리즈의 Conway 기호가 기저 삼각분할의 이중 대칭 및 중심 대칭에 의해 결정됨을 보이고, 비단순 연결 유형의 프리즈 패턴은 첫 번째 내부 행의 회문 여부에 따라 기호 $*\\infty\\infty$ 또는 $\\infty\\infty$를 가짐을 보인다(단, $C_3$ 유형은 예외). $D_n$ ($n \\ge 5$) 유형에도 동일한 이분법이 성립하며, $D_4$ 유형은 다섯 가지 기호를 실현함을 증명한다.", "technique": "삼각분할(triangulation)의 이중·중심 대칭 분석과 한 번 천공된 다각형의 tagged 삼각분할을 활용한 Conway 기호 결정.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.14598v1", "title": "From veering triangulations to convergence actions and back again", "authors": ["Jason Fox Manning", "Saul Schleimer", "Henry Segerman"], "abstract": "Suppose that $M$ is a finite-volume cusped hyperbolic three-manifold, equipped with a veering triangulation $\\mathcal{V}$. We prove that the action of the fundamental group of $M$ on the veering two-sphere is a geometrically finite convergence action. Applying a result of Yaman, we deduce that the veering two-sphere is equivariantly homeomorphic to the boundary of hyperbolic space.   As an application, we obtain Cannon-Thurston maps associated to veering triangulations. If $\\mathcal{V}$ is layered we recover the classical Cannon-Thurston map. If it is not we obtain Cannon-Thurston maps that do not come from surface subgroups. These are the first such examples in the cusped case.   Finally, we implement an algorithm to draw approximations of these Cannon-Thurston maps. This improves upon previous approximations obtained by Thurston and others.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-09-13T15:26:47+00:00", "updated": "2026-09-13T15:26:47+00:00", "abs_url": "http://arxiv.org/abs/2609.14598v1", "pdf_url": "https://arxiv.org/pdf/2609.14598v1", "journal_ref": "", "doi": "", "comment": "90 pages, 43 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 쌍곡 3-다양체의 veering triangulation과 Cannon-Thurston 사상에 관한 것으로, McMullen 문제(볼록 위치, oriented matroid, 점 배치)와 전혀 관련이 없다.", "summary": "유한 부피 cusped 쌍곡 3-다양체 $M$에 veering triangulation $\\mathcal{V}$가 주어질 때, $M$의 기본군의 veering 2-구면에 대한 작용이 기하학적으로 유한한 수렴 작용(geometrically finite convergence action)임을 증명한다. Yaman의 결과를 적용하여 veering 2-구면이 쌍곡 공간의 경계와 등변 위상동형임을 도출하고, 이를 통해 veering triangulation에 연관된 Cannon-Thurston 사상을 구성한다. 특히 layered가 아닌 경우 surface subgroup에서 유래하지 않는 Cannon-Thurston 사상의 첫 번째 cusped 사례를 제공한다.", "technique": "기본군의 veering 2-구면 작용이 기하학적으로 유한한 수렴 작용임을 증명하고 Yaman의 정리를 적용하는 방법, 그리고 Cannon-Thurston 사상의 근사를 계산하는 알고리즘 구현.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.14200v1", "title": "Torus knots as loop-edges in three-sphere triangulations", "authors": ["Lezhi Lin", "Jonathan Spreer"], "abstract": "We present a procedure that, given a pair of coprime integers, produces a one-vertex triangulation of the three-sphere containing the corresponding torus knot as an edge. The construction is canonical, and produces a three-sphere triangulation from a pair of minimal layered triangulations of the solid torus.   The size of the triangulation is, in the worst case, linear, but can be as small as logarithmic in the crossing number of the knot, motivating this triangulation size as an organising principle for knots, alternative to the crossing number.", "categories": ["math.GT", "math.CO"], "primary_category": "math.GT", "published": "2026-09-13T00:19:35+00:00", "updated": "2026-09-13T00:19:35+00:00", "abs_url": "http://arxiv.org/abs/2609.14200v1", "pdf_url": "https://arxiv.org/pdf/2609.14200v1", "journal_ref": "", "doi": "", "comment": "12 pages, 6 figures, 2 tables", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 3-구면 삼각분할과 토러스 매듭에 관한 것으로, McMullen's problem(볼록·일반 위치 점 배치, oriented matroid)과 직접적인 관련이 없다.", "summary": "서로소인 정수 쌍이 주어지면 해당 토러스 매듭을 에지로 포함하는 3-구면의 단일 꼭짓점 삼각분할을 정준적으로 구성하는 절차를 제시한다. 이 삼각분할은 두 개의 최소 층상(layered) 솔리드 토러스 삼각분할로부터 만들어진다. 삼각분할의 크기는 최악의 경우 매듭의 교차수에 대해 선형이지만 로그 크기까지 줄어들 수 있으며, 이를 교차수를 대체하는 매듭 분류 원리로 제안한다.", "technique": "서로소인 정수 쌍으로부터 한 쌍의 최소 층상 솔리드 토러스 삼각분할을 조합하여 정준적인 3-구면 단일 꼭짓점 삼각분할을 구성하는 절차.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.14035v1", "title": "Finite Polyhedral Models for the Space of Equivalent Norms", "authors": ["Juan Rafael Acosta-Portilla"], "abstract": "We study finite polyhedral models inside the projectivized space of equivalent norms $\\mathcal{N}'(X)$ on a finite-dimensional Banach space $X$, endowed with the logarithmic distortion metric. Given a finite symmetric direction set $E$, we introduce the class of $αE$-norms, defined as Minkowski functionals of symmetric polytopes whose vertices lie on the rays prescribed by $E$. We identify the admissible weights $α$ for which this parametrization is non-redundant and prove that they give a one-to-one parametrization of the corresponding finite direction model $\\mathcal{N}(E)$. We then refine this description by introducing complete, symmetric, simplicial $E$-fans, which encode the conical regions on which the associated polyhedral norms are linear. For a fixed fan $\\mathcal{F}$, we define the corresponding geometric and coordinate fan models $\\mathcal{N}(\\mathcal{F})$ and $\\mathcal{R}(\\mathcal{F})$, and show that they are naturally isomorphic as cones. After quotienting by positive scalar multiplication, the coordinate models become isometric to the corresponding norm models: the logarithmic distortion metric on $\\mathcal{N}'(E)$ and $\\mathcal{N}'(\\mathcal{F})$ is represented exactly by the Hilbert projective metric on the admissible weight spaces. Finally, we prove completeness results for these finite models and show how they provide finite-dimensional polyhedral approximations to the metric geometry of $\\mathcal{N}'(X)$.", "categories": ["math.FA", "math.MG"], "primary_category": "math.FA", "published": "2026-09-12T16:41:39+00:00", "updated": "2026-09-12T16:41:39+00:00", "abs_url": "http://arxiv.org/abs/2609.14035v1", "pdf_url": "https://arxiv.org/pdf/2609.14035v1", "journal_ref": "", "doi": "", "comment": "28 pages. Submitted for publication", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유한차원 Banach 공간의 등가 노름 공간에 대한 유한 다면체 모델을 연구하며, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "유한차원 Banach 공간 $X$ 위의 등가 노름의 사영화된 공간 $\\mathcal{N}'(X)$에 로그 왜곡 거리를 부여하고, 유한 대칭 방향 집합 $E$로 정의된 $\\alpha E$-노름 클래스를 도입하여 비중복 매개변수화를 구성한다. 완전·대칭·단체 $E$-팬(fan) $\\mathcal{F}$를 이용해 기하학적 팬 모델 $\\mathcal{N}(\\mathcal{F})$와 좌표 팬 모델 $\\mathcal{R}(\\mathcal{F})$가 원뿔로서 자연동형임을 보이고, 양의 스칼라 곱으로 몫을 취하면 로그 왜곡 거리가 허용 가중치 공간 위의 Hilbert 사영 거리로 정확히 표현됨을 증명한다. 마지막으로 이 유한 모델들이 $\\mathcal{N}'(X)$의 거리 기하학에 대한 유한차원 다면체 근사를 제공함을 보인다.", "technique": "Minkowski 함수자(Minkowski functional)로 정의된 대칭 다면체 노름의 $\\alpha E$-매개변수화와 단체 $E$-팬을 통한 좌표 모델 위의 Hilbert 사영 거리 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12732v1", "title": "Degreewise Cut-Semigroup Saturation for $K_5$-Minor-Free Graphs and Seymour's Planar Edge-Colouring Conjecture", "authors": ["SeungJu Lee"], "abstract": "For every positive integer $k$, we prove that the homogeneous cut semigroup of every $K_5$-minor-free graph is saturated at height $k$ if and only if every planar $k$-graph is $k$-edge-colourable. Here a $k$-graph is a loopless $k$-regular multigraph in which every odd vertex cut has size at least $k$. A triangle expansion of a cubic plane dual converts cut decompositions into perfect-matching decompositions. The converse uses symmetric difference with a fixed perfect matching. The equivalence identifies the normality conjecture for $K_5$-minor-free cut polytopes with Seymour's planar edge-colouring conjecture. In particular, the known cases $k\\leq 8$ give saturation through height eight.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-11T11:31:39+00:00", "updated": "2026-09-11T11:31:39+00:00", "abs_url": "http://arxiv.org/abs/2609.12732v1", "pdf_url": "https://arxiv.org/pdf/2609.12732v1", "journal_ref": "", "doi": "", "comment": "7 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 $K_5$-minor-free 그래프의 cut semigroup 포화 문제와 Seymour의 평면 에지 채색 추측에 관한 것으로, McMullen 문제(d=5, 볼록 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "모든 양의 정수 $k$에 대해 $K_5$-minor-free 그래프의 동차 cut semigroup이 높이 $k$에서 포화될 필요충분조건이 '모든 평면 $k$-그래프가 $k$-에지 채색 가능'임을 증명한다. 삼각형 확장(triangle expansion)을 이용해 cut 분해를 완전 매칭 분해로 변환하며, 이 동치 관계를 통해 $K_5$-minor-free cut polytope의 normality 추측이 Seymour의 평면 에지 채색 추측과 동치임을 확인한다. 특히, 이미 알려진 $k \\leq 8$ 경우에서 높이 8까지의 포화가 따라온다.", "technique": "삼각형 확장(triangle expansion)으로 cut 분해를 완전 매칭 분해로 변환하고, 고정 완전 매칭과의 대칭차(symmetric difference)를 이용해 역 방향을 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12685v1", "title": "Self-dual sets up to a translation: a negative answer to Milman's question", "authors": ["Alex Segal"], "abstract": "Let \\(K,T\\subset\\mathbb R^n\\) be convex bodies with the origin in their interiors. If \\(K=T^\\circ\\), then the identity \\( K+T=K^\\circ+T^\\circ \\) holds trivially. V.~Milman asked whether these trivial solutions are the only ones, that is, whether \\( K+T=K^\\circ+T^\\circ \\) forces \\(K=T^\\circ\\). We show that the answer is positive for polytopes but negative for general convex bodies.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-11T10:30:51+00:00", "updated": "2026-09-11T10:30:51+00:00", "abs_url": "http://arxiv.org/abs/2609.12685v1", "pdf_url": "https://arxiv.org/pdf/2609.12685v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록체의 극체(polar body)와 Minkowski 합에 관한 Milman의 질문을 다루며, McMullen 문제(d=5에서의 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "이 논문은 볼록체 $K, T \\subset \\mathbb{R}^n$에 대해 $K + T = K^\\circ + T^\\circ$가 성립할 때 반드시 $K = T^\\circ$이어야 하는가라는 Milman의 질문을 다룬다. 저자는 다각형(polytope)의 경우에는 긍정적 답이 성립하지만, 일반적인 볼록체에 대해서는 반례가 존재함을 보인다.", "technique": "다각형과 일반 볼록체를 구분하여 각각 긍정·부정 답을 구성하는 방법론 사용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12311v1", "title": "Quantum Invariants indexed by Fibered Faces of the Thurston Polytope", "authors": ["Davide Passaro", "Lara San Martín Suárez"], "abstract": "We study the Gukov--Manolescu quantum invariant for oriented links. While this invariant is a single series in the knot case, we find that links admit multiple such series, each one consistent with the Melvin--Morton--Rozansky expansion of the colored Jones polynomials. We prove that convergent inverted state sums yield a family of multivariable Gukov--Manolescu series, indexed by monomials of the Alexander polynomial. We conjecture that these monomials correspond precisely to the fibered faces of the Thurston norm ball and provide extensive computational evidence for this correspondence. Further results concerning the leading term, the corresponding single-variable invariant, and the effect of partial Dehn surgery are also established.", "categories": ["math.GT", "math.QA"], "primary_category": "math.GT", "published": "2026-09-11T00:32:17+00:00", "updated": "2026-09-11T00:32:17+00:00", "abs_url": "http://arxiv.org/abs/2609.12311v1", "pdf_url": "https://arxiv.org/pdf/2609.12311v1", "journal_ref": "", "doi": "", "comment": "58 pages, 16 figures, 9 tables", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 양자 위상 불변량(Gukov–Manolescu 불변량)과 Thurston norm ball의 섬유면을 다루는 위상수학·양자위상 논문으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 방향 링크(oriented link)에 대한 Gukov–Manolescu 양자 불변량을 연구하며, 링크의 경우 Alexander 다항식의 단항식으로 인덱싱된 여러 계열의 불변량이 존재함을 보인다. 수렴하는 inverted state sum이 다변수 Gukov–Manolescu 급수족을 산출함을 증명하고, 이 단항식들이 Thurston norm ball의 섬유면(fibered faces)과 정확히 대응한다는 추측을 광범위한 계산적 증거와 함께 제시한다. 또한 선도항(leading term), 단변수 불변량, 부분 Dehn 수술의 효과에 관한 추가 결과도 확립한다.", "technique": "수렴하는 inverted state sum을 이용해 다변수 Gukov–Manolescu 급수족을 구성하고, Melvin–Morton–Rozansky 전개와의 일관성을 확인.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.11589v1", "title": "Preservation of log-concavity under Hadamard products", "authors": ["Yanxin Liu", "Jianxi Mao"], "abstract": "For a nonzero real polynomial $p$, let $\\W(p)$ denote the numerator of its ordinary generating function. We prove that if the coefficients of both $\\W(p)$ and $\\W(q)$ are nonnegative and log-concave with no internal zeros, then so are the coefficients of $\\W(pq)$. This provides an affirmative answer to a question of Brändén, Ferroni, and Jochemko. As applications, we derive corresponding results for finite products and for Cartesian products of lattice polytopes, answering a question of Ferroni and Higashitani.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-10T14:19:41+00:00", "updated": "2026-09-10T14:19:41+00:00", "abs_url": "http://arxiv.org/abs/2609.11589v1", "pdf_url": "https://arxiv.org/pdf/2609.11589v1", "journal_ref": "", "doi": "", "comment": "12 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 다항식의 Hadamard 곱 하에서 log-concavity 보존에 관한 결과로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "비영 실수 다항식 $p$에 대해 $\\mathcal{W}(p)$를 그 ordinary generating function의 분자로 정의할 때, $\\mathcal{W}(p)$와 $\\mathcal{W}(q)$의 계수가 모두 음이 아니고 내부 영점 없이 log-concave이면 $\\mathcal{W}(pq)$의 계수도 같은 성질을 가짐을 증명한다. 이는 Brändén, Ferroni, Jochemko의 질문에 긍정적 답변을 제공하며, 격자 다면체(lattice polytopes)의 Cartesian 곱에 관한 Ferroni와 Higashitani의 질문도 해결한다.", "technique": "Hadamard 곱 연산 하에서 log-concavity의 보존성을 분석하여 유한 곱 및 Cartesian 곱으로 응용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.11396v1", "title": "Homogeneous Milnor fibers and Kato--Matsumoto bounds via simplicial multiwedges", "authors": ["Masaharu Ishikawa", "Tat-Thang Nguyen"], "abstract": "For every $n\\geq 3$ and $s\\geq 2$, we construct a homogeneous polynomial of degree $n(n+1)/2$ whose Milnor fiber is exactly $2s$-connected and whose rational cohomology contains a strictly defined nontrivial $n$-fold Massey product on classes of degree $2s+1$, implying that the Milnor fiber is non-formal, while attaining the Kato--Matsumoto connectivity bound. Our construction is based on the simplicial multiwedges of the nerve complexes of simple polytopes introduced by Limonchenko, combined with Suciu's realization of weighted homogeneous Milnor fibers. We thereby answer two problems posed by Suciu.", "categories": ["math.AT", "math.AG", "math.CO", "math.GT"], "primary_category": "math.AT", "published": "2026-09-10T11:30:14+00:00", "updated": "2026-09-10T11:30:14+00:00", "abs_url": "http://arxiv.org/abs/2609.11396v1", "pdf_url": "https://arxiv.org/pdf/2609.11396v1", "journal_ref": "", "doi": "", "comment": "16 pages, 1 figure", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Milnor fiber의 연결성, Massey product, Kato–Matsumoto 경계에 관한 대수적 위상수학 연구로, McMullen 문제나 oriented matroid와 무관하다.", "summary": "모든 $n\\geq 3$, $s\\geq 2$에 대해 차수 $n(n+1)/2$인 동차 다항식을 구성하여, 그 Milnor fiber가 정확히 $2s$-연결(connected)이고 유리 코호몰로지에 차수 $2s+1$ 위의 비자명한 $n$-중 Massey product를 가짐을 보인다. 이로써 Kato–Matsumoto 연결성 경계를 달성하면서도 Milnor fiber가 non-formal임을 증명하며, Suciu가 제기한 두 문제에 답한다.", "technique": "Limonchenko가 도입한 단순 다면체의 nerve complex의 simplicial multiwedge와 Suciu의 가중 동차 Milnor fiber 실현을 결합하여 구성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.10660v1", "title": "The maximum spectral radius of outerplanar and planar $k$-uniform hypergraphs", "authors": ["Pei Liu", "Suil O"], "abstract": "For an integer $k\\ge3$, a $k$-angulation is a simple $2$-connected outerplane graph whose interior faces are bounded by $k$-cycles, and a closed $k$-angulation is a simple $2$-connected plane graph all of whose faces, the outer face included, are bounded by $k$-cycles; the face hypergraph of either is the $k$-uniform hypergraph whose edges are the vertex sets of those faces. For $k=3$ these are the outerplanar and planar hypergraphs of Ellingham, Lu and Wang, who determined the outerplanar extremal hypergraph for large $n$ and conjectured the planar one. In this paper, we determine the extremal hypergraphs in both classes for every $k$. In the outerplanar case, for all sufficiently large admissible $n$, it is the fan, in which a single vertex lies on every face, and the maximum equals $(4f)^{1/k}(1+o(1))$ with $f=(n-2)/(k-2)$. In the planar problem the maximum has order $n^{1/3}$ when $k=3$ and order $n^{2/k}$ when $k\\ge4$. For $k\\ge4$ the extremal hypergraphs are the face hypergraphs of the balanced theta graphs, in which two vertices are joined by internally disjoint paths and every face is a $k$-cycle through both: for $k=4$, where the closed $4$-angulations are the quadrangulations of the sphere, this holds for every $n\\ge5$, the extremal hypergraph being $\\mathcal{H}(K_{2,n-2})$, and for $k\\ge5$ for all sufficiently large admissible $n$. For $k\\ge6$ the extremal hypergraph is not unique: when the number of faces is even there are exactly $\\lfloor(k-2)/2\\rfloor$ of them up to isomorphism. For $k=3$ two vertices of a plane triangulation lie on at most two common faces, the balanced theta graphs are unavailable, and the extremal hypergraph is instead, for all sufficiently large $n$, the face hypergraph of $K_2+P_{n-2}$; this confirms a conjecture of Ellingham, Lu and Wang.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-09T17:22:23+00:00", "updated": "2026-09-09T17:22:23+00:00", "abs_url": "http://arxiv.org/abs/2609.10660v1", "pdf_url": "https://arxiv.org/pdf/2609.10660v1", "journal_ref": "", "doi": "", "comment": "50 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 외평면·평면 균일 하이퍼그래프의 스펙트럼 반지름 극값 문제를 다루며, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid)와 직접적 관련이 없다.", "summary": "정수 $k\\ge3$에 대해 $k$-angulation의 면 하이퍼그래프(face hypergraph)로 정의되는 외평면·평면 $k$-균일 하이퍼그래프의 최대 스펙트럼 반지름을 결정한다. 외평면 경우 충분히 큰 허용 $n$에 대해 극값 하이퍼그래프는 팬(fan)이며 최댓값은 $(4f)^{1/k}(1+o(1))$ ($f=(n-2)/(k-2)$)이고, 평면 경우 $k\\ge4$이면 균형 세타 그래프(bal

omial submodules of Amata and Crupi. The hull is the Minkowski sum of $r$ shifted copies of one and the same simplex: the Kozlov simplex, which Kozlov proved in 1997 to be the convex hull of the $f$-vectors of simplicial complexes on $n$ vertices. For $r=1$ the statement is Kozlov's theorem, so this is a rank-$r$ generalization of it. We give a self-contained proof, including a short proof of Kozlov's theorem from the local Lubell-Yamamoto-Meshalkin inequality, and an explicit facet description of the Kozlov simplex that appears not to be recorded in the literature. Along the way we isolate the class of submodules for which the argument works, the ideal-direct-sum modules, and show by example that the Hilbert function of a graded submodule outside that class need not be a shifted sum of $f$-vectors at all. The combinatorial content is stated separately, in language that uses no algebra, as a result on $r$-vectors of simplicial complexes and their $ff$-vectors. Finally we describe the vertex structure of the Minkowski sum -- which sums of vertices of the summands survive as vertices -- proving the answer for the all-ones leg vector at every rank and for the Kozlov leg vector at rank two.", "categories": ["math.CO", "math.AC"], "primary_category": "math.CO", "published": "2026-09-20T12:48:32+00:00", "updated": "2026-09-20T12:48:32+00:00", "abs_url": "http://arxiv.org/abs/2609.23605v1", "pdf_url": "https://arxiv.org/pdf/2609.23605v1", "journal_ref": "", "doi": "", "comment": "53 pages. The combinatorial core is formalized in Lean 4 + Mathlib (no sorry, no extra axioms); the formalization and all verification code are in the anc directory and at https://gitlab.liu.se/jansn19/exterior-convex", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 exterior algebra 위의 Hilbert 함수와 단순 복합체의 f-벡터에 관한 것으로, McMullen 문제나 oriented matroid의 acyclic reorientation과 직접적 관련이 없다.", "summary": "이 논문은 exterior algebra $E$ 위의 등급 자유 $E$-모듈 $F$의 몫 $F/M$의 Hilbert 함수 집합의 볼록 껍질(convex hull)을 결정하며, 이 껍질이 Kozlov 단체(Kozlov simplex)의 Minkowski 합임을 보인다. 이는 Kozlov(1997)가 $n$개의 꼭짓점을 가진 단순 복합체의 $f$-벡터의 볼록 껍질이 Kozlov 단체임을 증명한 결과의 rank-$r$ 일반화이다. 또한 Kozlov 정리의 간결한 새 증명(local LYM 부등식 이용), Kozlov 단체의 명시적 면(facet) 기술, 그리고 Minkowski 합의 꼭짓점 구조 분석을 제공한다.", "technique": "local Lubell-Yamamoto-Meshalkin(LYM) 부등식을 이용한 Kozlov 단체의 단독 증명과 Minkowski 합 구조 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.23842v1", "title": "Edge complexity of weighted graphs: involutory symmetries and NP-hardness", "authors": ["Vishal Gupta", "Alex Iosevich"], "abstract": "The edge complexity of a weighted graph is the smallest ratio of the Fourier $\\ell^1$ and $\\ell^2$ norms of its adjacency matrix over all vertex labelings. We study the difficulty of finding this minimum by relating it to a graph symmetry. Adding a universal vertex with sufficiently large incident weight produces an explicit Fourier $\\ell^1$ lower bound. We show that equality holds exactly when the source graph has a fixed-point-free involutory automorphism. Two-sided estimates compare the excess above this bound with the squared Frobenius distance to the nearest weighted graph having such a symmetry. For sources of constant weighted degree, these estimates determine the exact leading term as the added weight tends to infinity. A stronger separation for simple source graphs proves that additive $\\frac{1}{256N^{\\frac{7}{2}}}$ approximation of weighted edge complexity is NP-hard, even on connected graphs of odd order $N$ with at most two distinct positive integer weights, each at most $N^2$. We also prove that recognizing a simple graph with a real Fourier labeling is NP-complete. A seven-vertex example shows that every minimizing labeling can have nonreal Fourier coefficients even when real Fourier labelings exist. An exact rational certificate for this example is included in the appendix.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-20T19:52:43+00:00", "updated": "2026-09-20T19:52:43+00:00", "abs_url": "http://arxiv.org/abs/2609.23842v1", "pdf_url": "https://arxiv.org/pdf/2609.23842v1", "journal_ref": "", "doi": "", "comment": "21 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "가중 그래프의 edge complexity와 Fourier 노름 최소화 문제로, McMullen's problem의 점 배치·일반위치·기하학적 실현가능성과 무관함.", "summary": "가중 그래프의 edge complexity를 정점 라벨링에 대한 인접행렬의 Fourier $\\ell^1$과 $\\ell^2$ 노름 비율의 최솟값으로 정의하고, 이를 고정점 없는 involutory automorphism을 가진 그래프의 대칭성과 연결한다. 이 최솟값을 찾는 문제가 NP-hard임을 증명하고, real Fourier labeling의 인식이 NP-complete임을 보인다.", "technique": "universal vertex 추가를 통한 Fourier $\\ell^1$ 하한, Frobenius 거리를 이용한 양측 추정, 고정점 없는 involution 대칭성 특성화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.22393v1", "title": "Counting $t$-wise $L$-intersecting cliques with prescribed intersection sizes", "authors": ["Yiyan Zhan", "Yichen Wang", "Mei Lu"], "abstract": "Let $r,t\\ge 3$ be integers and $L=\\{\\ell_1,\\ell_2,\\ldots,\\ell_s\\}\\subseteq [0,r-1]$ a fixed set of integers with $|L|\\neq r$ and $\\ell_1<\\ell_2<\\cdots<\\ell_s$. For each integer $n$, let $Ψ_{r}(n,L,t)$ be the maximum number of $r$-cliques in an $n$-vertex graph whose $r$-cliques, viewed as a family of $r$-subsets of the vertex set, form a $t$-wise $L$-intersecting family. In this paper, we prove that $Ψ_{r}(n,L,t)=o(n^{|L|})$ when the sequence $\\ell_1,\\ell_2,\\ldots,\\ell_s,r$ does not form an arithmetic progression, and we give an asymptotic formula for $Ψ_{r}(n,L,t)$ when this sequence does form an arithmetic progression. When $t=2$, our results are exactly Helliar and Liu's results.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-18T07:29:09+00:00", "updated": "2026-09-18T07:29:09+00:00", "abs_url": "http://arxiv.org/abs/2609.22393v1", "pdf_url": "https://arxiv.org/pdf/2609.22393v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "교집합 크기 제약이 있는 클리크 계수 문제로, McMullen's problem의 일반적인 위치(general position) 점 배치나 oriented matroid 구조와 직접적 연관이 없음.", "summary": "이 논문은 $r$-클리크들이 $t$-wise $L$-intersecting family를 이루는 $n$-정점 그래프에서 $r$-클리크의 최대 개수 $Ψ_{r}(n,L,t)$를 연구한다. 수열 $\\ell_1,\\ell_2,\\ldots,\\ell_s,r$이 등차수열을 이루지 않을 때 $Ψ_{r}(n,L,t)=o(n^{|L|})$임을 증명하고, 등차수열을 이루는 경우 점근 공식을 제시한다.", "technique": "교집합 크기 제약을 만족하는 조합족(combinatorial family)의 계수 문제로 보이며, 등차수열 구조의 유무에 따른 경우 분석이 핵심 기법으로 추측됨.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.18816v1", "title": "Solution to a conjecture on integral uniform hypercycles", "authors": ["Joyentanuj Das", "Iswar Mahato"], "abstract": "A hypergraph is said to be integral if all of its adjacency eigenvalues are integers. Recently, Portugal and Del-Vecchio in [\\emph{Appl. Math. Comput.} 504: 129507 (2025)] studied the integral hypergraphs and gave a characterization of integral hypercycles in three particular cases: $3$-uniform, $4$-uniform and $5$-uniform hypercycles. In the same article, they conjectured that the $k$-uniform hypercycle on $n$ vertices $\\Cnk$ is never integral for $k<n-1$, when $n>6$. In this article, we confirm this conjecture and prove that for $2\\le k\\le n-1$, $\\Cnk$ is integral if and only if $k=n-1$ or $(n,k)\\in\\{(4,2),(6,2),(6,3),(6,4)\\}$. The proof begins with computing the complete adjacency spectrum of $\\Cnk$ and then uses Niven's theorem, a cyclotomic-unit lemma, an elementary property of Euler's totient function, and the Galois symmetry of cyclotomic fields to complete it. Our result gives a complete characterization of $k$-uniform integral hypercycles on $n$ vertices.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-16T15:23:55+00:00", "updated": "2026-09-16T15:23:55+00:00", "abs_url": "http://arxiv.org/abs/2609.18816v1", "pdf_url": "https://arxiv.org/pdf/2609.18816v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "k-uniform hypercycle의 spectral integrality 특성화는 McMullen's problem(convex position, oriented matroid, realizability)과 직접 관련이 없음.", "summary": "본 논문은 k-uniform hypercycle $C_{n}^{k}$가 integral hypergraph(모든 인접 고유값이 정수)일 조건을 완전히 특성화한다. Portugal-Del-Vecchio의 추측을 확인하여 $2\\le k\\le n-1$일 때 $C_{n}^{k}$가 integral인 필요충분조건은 $k=n-1$ 또는 $(n,k)\\in\\{(4,2),(6,2),(6,3),(6,4)\\}$임을 증명한다.", "technique": "인접 행렬의 완전 스펙트럼 계산, Niven 정리, cyclotomic-unit lemma, Euler 지표함수의 성질, cyclotomic field의 Galois 대칭성을 조합.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.17446v2", "title": "Relaxed coparking functions and Stanley's conjecture for matroid $h$-vectors", "authors": ["SuHo Oh"], "abstract": "Stanley's conjecture asserts that the $h$-vector of a matroid is a pure $O$-sequence. Corry, Dochtermann, McClain, Perkinson and Yi introduced cycle systems, which give a bijective proof for the matroids that admit one, through coparking functions, and proposed generalized cycle systems. Every matroid admitting a cycle system is regular, and the Wagner and Petersen graphs admit no generalized cycle system consisting of circuits. We propose a relaxation. Where the coparking recursion breaks down, at the strata whose unique union is independent, the coparking functions are replaced by a fibre: a pure multicomplex with the $h$-vector of the dead node, the minor of the matroid attached to the stratum. We prove, for any matroid with a fixed basis, that whenever the required fibres exist the relaxed coparking functions form a pure multicomplex whose degree sequence is the $h$-vector of the matroid, so Stanley's conjecture follows. The proof rests on a version of Dhar's burning algorithm for a matroid with a fixed basis, which gives the purity, and on a deletion-contraction identity that computes the gap between the $h$-vector and the coparking functions as a sum of local $h$-vectors, one per dead node. Coned, biconed and triconed graphs carry a fibre system with their canonical spanning trees, as do the Wagner and Petersen graphs. Beyond graphs, every basis of a matroid of corank two, of a matroid of rank at most four or of a uniform matroid carries a fibre system, so Stanley's conjecture follows for those classes. We also give a graph of radius two on twelve vertices which, with its breadth-first spanning tree, carries no fibre system.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T16:51:47+00:00", "updated": "2026-09-19T13:12:33+00:00", "abs_url": "http://arxiv.org/abs/2609.17446v2", "pdf_url": "https://arxiv.org/pdf/2609.17446v2", "journal_ref": "", "doi": "", "comment": "46 pages, 16 figures. v2: rank at most four added, definition of a fibre simplified", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Stanley's conjecture on matroid h-vectors는 조합론적 위상수학 문제이나, McMullen's problem(d=5)의 convex position과 oriented matroid의 구조론적 질문과는 직접적 관련 없음.", "summary": "본 논문은 Stanley's conjecture(matroid h-벡터가 순수 O-수열임)를 증명하기 위해 relaxed coparking functions를 도입한다. 특정 matroid 클래스(corank 2, rank ≤4, uniform matroid)에서 fibre system을 구성하여 삭제-축약 항등식과 Dhar's burning algorithm으로 순수성을 보인다.", "technique": "Dhar's burning algorithm의 고정기저 버전과 fibre system을 통한 deletion-contraction 항등식의 국소 h-벡터 분해.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23362v1", "title": "Multiset Colorings of Random Graphs Across Density Regimes", "authors": ["Arash Ahadi", "Sharareh Alipour"], "abstract": "We show that almost every graph admits a partition of its vertex set into three parts such that no two adjacent vertices have the same number of neighbors in each of the three parts. Equivalently, for $G\\sim G(n,1/2)$, $χ_m(G)\\le3$ with high probability, improving the previously known bound of five. Here $χ_m(G)$ denotes the multiset chromatic number of $G$, the minimum number of parts in a vertex partition whose neighbor-count vectors distinguish every pair of adjacent vertices. In fact, the three-part bound holds for every fixed $0.185<p<0.509$. More generally, for every fixed $p\\in(0,1)$, $G\\sim G(n,p)$ satisfies $χ_m(G)\\le4$ with high probability. These results are obtained by converting the unresolved edges of a carefully chosen initial partition into hyperplanes of a Boolean cube and applying the Linial--Radhakrishnan theory of essential covers.   We also determine how $χ_m(G)$ grows when the graph is polynomially close to complete. For every fixed $β\\in(0,1)$ and $G\\sim G\\!\\left(n,1-n^{-(1-β)}\\right)$, with high probability $\\frac{2}β\\le χ_m(G)\\le \\left\\lfloor\\frac{2}β\\right\\rfloor+5$. Thus $χ_m(G)=2/β+O(1)$. The lower bound is spectral, while the upper bound follows from multinomial anti-concentration and the Lov'asz Local Lemma.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-20T05:06:54+00:00", "updated": "2026-09-20T05:06:54+00:00", "abs_url": "http://arxiv.org/abs/2609.23362v1", "pdf_url": "https://arxiv.org/pdf/2609.23362v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Multiset coloring은 vertex partition 문제이지만, McMullen's problem(convex position, oriented matroid, realizability)과는 기하학적·조합적 구조가 전혀 다른 독립적인 주제.", "summary": "무작위 그래프 $G(n,p)$에서 vertex partition을 3개 부분으로 나누어 각 부분에서의 이웃 개수 벡터(multiset)가 인접한 정점쌍을 구별하도록 할 수 있음을 보였다. 이는 multiset chromatic number $\\chi_m(G)\\le 3$ (고확률)을 의미하며, 기존 상한 5를 개선한다. 완전 그래프 근처 밀도 영역에서는 $\\chi_m(G)=2/\\beta+O(1)$의 점근적 행동을 결정했다.", "technique": "Boolean cube의 hyperplane 변환과 Linial--Radhakrishnan essential covers 이론; 하한은 spectral 방법, 상한은 multinomial anti-concentration 및 Lovász Local Lemma.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.21653v1", "title": "Equivalence of Complex Hadamard Matrices", "authors": ["Patric R. J. Östergård", "Tuomo Valtonen"], "abstract": "Symmetry in the context of equivalence or isomorphism is a fundamental and natural concept in any study of discrete structures. Symmetries are also important for non-discrete structures, but their treatment can be more challenging and is perhaps therefore often overlooked. This holds for many studies of complex Hadamard matrices, that is, matrices with unimodular complex entries satisfying the equation $HH^{\\dagger} = nI$, where $H^{\\dagger}$ is the conjugate transpose of $H$. In the current work, equivalence of complex Hadamard matrices is considered, and algorithms for determining equivalence of matrices and the automorphism group of a matrix are presented. The algorithms are used to establish the automorphism group of a large number of complex Hadamard matrices from the literature.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-18T11:50:00+00:00", "updated": "2026-09-18T11:50:00+00:00", "abs_url": "http://arxiv.org/abs/2609.21653v1", "pdf_url": "https://arxiv.org/pdf/2609.21653v1", "journal_ref": "Journal of Algebraic Combinatorics 64, Article 20 (2026)", "doi": "10.1007/s10801-026-01568-x", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Complex Hadamard matrices와 McMullen's problem(convex position, oriented matroid 등)은 직접적인 관련성이 없음.", "summary": "본 논문은 복소 Hadamard 행렬의 동치성(equivalence)과 자기동형군(automorphism group)을 판정하는 알고리즘을 제시한다. 행렬의 대칭성을 고려하여 기존 문헌의 많은 Hadamard 행렬들의 자기동형군을 결정했다.", "technique": "행렬 동치성 판정 알고리즘 및 자기동형군 계산 알고리즘.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.17108v1", "title": "The forced colouring function of a graph", "authors": ["G. E. Farr"], "abstract": "The forced colouring function of a graph gives the probability that a random assignment of colours to a random subset of vertices can be extended, by a simple local process called forcing, to give a proper colouring of the whole graph using the same set of available colours. This is a polynomial for each fixed number of colours, and was introduced as a subject for research on the general theory of graph polynomials. In this paper we establish its fundamental properties and give combinatorial interpretations of its derivatives at two particular points. We also prove that the problem of computing its value at any specific point in a certain interval is #P-hard.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-09-15T12:39:02+00:00", "updated": "2026-09-15T12:39:02+00:00", "abs_url": "http://arxiv.org/abs/2609.17108v1", "pdf_url": "https://arxiv.org/pdf/2609.17108v1", "journal_ref": "", "doi": "", "comment": "29 pages. Part of this work was presented at the 31st British Combinatorial Conference, Cardiff, UK, 6-10 July 2026", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 다항식과 강제 칠하기 함수는 이산기하학이나 McMullen's problem과 직접적인 관련이 없음.", "summary": "본 논문은 그래프의 강제 칠하기 함수(forced colouring function)를 도입하며, 이는 정점의 무작위 부분집합에 색을 칠하고 강제(forcing)라는 국소 과정으로 전체 그래프의 적절한 칠하기로 확장할 확률을 나타낸다. 저자들은 이 함수의 기본 성질을 확립하고 특정 점에서의 도함수의 조합론적 해석을 제시하며, 특정 구간에서의 계산이 #P-hard임을 증명한다.", "technique": "그래프 다항식 이론 및 강제 과정을 통한 칠하기 확장성 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24917v1", "title": "Magic positivity of Snapper polynomials for matroids", "authors": ["Shiyue Li"], "abstract": "In 1959, Snapper showed that the Euler characteristic of the tensor powers of a line bundle on a normal projective scheme is a polynomial, later named the \\emph{Snapper polynomial}. Positivity of coefficients of Snapper polynomials implies various notions of positivity of line bundles, which we study through the lens of magic positivity and real-rootedness. We introduce zonotopal classes in the Grothendieck $K$-ring of vector bundles of the toric variety for any loopless matroid, and prove that their Snapper polynomials are magic positive. Our proof realizes such a Snapper polynomial as a weighted independence polynomial of the Dilworth truncation along certain lines of the matroid. As a consequence, their coefficients are positive, and their $h^{\\ast}$-polynomials are real-rooted. In the realizable case, this polynomial is the multigraded Hilbert polynomial of the wonderful variety embedded in a product of projective lines.   We introduce analogous line bundles on the Deligne--Mumford--Knudsen moduli space $\\overline{\\mathcal M}_{0,n}$ and prove that their Snapper polynomials are magic positive. For cotangent line bundles whose first Chern classes are distinct $ψ$-classes, which are not zonotopal, we nonetheless prove that their $h^{\\ast}$-polynomials are real-rooted, whereas their Snapper polynomials are magic positive if and only if $n\\leqslant7$. More generally, we introduce saturated and weakly saturated $K$-classes of matroids, which furnish a sufficient and a necessary condition for magic positivity of Snapper polynomials in terms of their dragon Hall--Rado polymatroids.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-09-21T17:17:20+00:00", "updated": "2026-09-21T17:17:20+00:00", "abs_url": "http://arxiv.org/abs/2609.24917v1", "pdf_url": "https://arxiv.org/pdf/2609.24917v1", "journal_ref": "", "doi": "", "comment": "32 pages; comments welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 matroid의 Snapper 다항식의 positivity와 real-rootedness를 다루며, McMullen 문제(d=5)나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 loopless matroid의 toric variety에 대한 zonotopal classes의 Snapper 다항식이 magic positive임을 증명하며, 이를 Dilworth truncation의 가중 독립 다항식(weighted independence polynomial)으로 실현한다. 그 결과로 계수의 양수성과 $h^*$-다항식의 real-rootedness를 도출한다. 또한 $\\overline{\\mathcal{M}}_{0,n}$ 위의 유사한 선다발에 대해서도 magic positivity를 증명하며, $n \\leq 7$일 때 cotangent line bundle의 Snapper 다항식이 magic positive임을 보인다.", "technique": "Dilworth truncation을 통한 가중 독립 다항식 표현 및 dragon Hall–Rado polymatroid를 이용한 포화(saturated)/약포화(weakly saturated) $K$-class 조건 분석.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.24878v1", "title": "Equilibrium Numbers in Non-Square Bimatrix Games", "authors": ["Constantin Ickstadt", "Thorsten Theobald", "Bernhard von Stengel"], "abstract": "Bimatrix games may have an exponential number of mixed Nash equilibria if both dimensions of the game are allowed to grow. Bounds on their maximal number give structural insights that have been used to construct hard-to-solve games. We show new sharp or asymptotically sharp bounds on the (polynomial) number of equilibria for generic games where one dimension of the game is fixed and the number of strategies of the other player grows. These results go beyond the hitherto studied square games. Our methods employ combinatorial properties of polytopes, and recent obstructions that relate to the graph of those polytopes. For $n\\ge5$, we construct $3\\times n$ games that have all $2n+1$ vertices of the best-response polytope as equilibrium strategies, proved using a simple case of the 4-color theorem for planar graphs. Generic $4\\times 5$ games are shown to have at most 17 equilibria, using computer calculations with existing datasets for all combinatorial types of the relevant polytopes. For $d\\times n$ games, we construct games where all but a fraction of $O(1/n)$ of the maximum number of vertices are equilibrium strategies.", "categories": ["cs.GT", "math.CO"], "primary_category": "cs.GT", "published": "2026-09-21T16:47:47+00:00", "updated": "2026-09-21T16:47:47+00:00", "abs_url": "http://arxiv.org/abs/2609.24878v1", "pdf_url": "https://arxiv.org/pdf/2609.24878v1", "journal_ref": "", "doi": "", "comment": "32 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 이분행렬 게임(bimatrix game)의 Nash 균형 수 상한을 다루며, McMullen 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "이 논문은 한 차원이 고정된 비정방(non-square) 이분행렬 게임에서 혼합 Nash 균형의 최대 수에 대한 새로운 sharp 또는 점근적으로 sharp한 상한을 제시한다. $n\\ge5$인 $3\\times n$ 게임에서 최선반응 폴리토프(best-response polytope)의 모든 $2n+1$개 꼭짓점이 균형 전략임을 평면그래프의 4색 정리 특수 경우를 이용해 증명하고, $4\\times5$ 게임의 균형 수 상한이 17임을 컴퓨터 계산으로 확인한다. $d\\times n$ 게임에서는 최대 꼭짓점 수의 $O(1/n)$ 비율을 제외한 거의 모든 꼭짓점이 균형 전략인 게임을 구성한다.", "technique": "폴리토프의 조합론적 성질, 폴리토프 그래프와 관련된 장애물(obstruction), 평면그래프 4색 정리, 기존 데이터셋을 이용한 컴퓨터 계산을 핵심 도구로 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.24790v1", "title": "The $g$-theorem in smooth approximation", "authors": ["Joel Hakavuori"], "abstract": "We show that a sequence of simplicial polytopes approximating a smooth convex body has primitive Betti numbers diverging from the upper bound given by the $g$-theorem. This complements a result of Adiprasito-Nevo-Samper, who proved the corresponding divergence from the lower bound. The proof uses a new lower bound for the size of the shadow of a set of monomials.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T15:50:37+00:00", "updated": "2026-09-21T15:50:37+00:00", "abs_url": "http://arxiv.org/abs/2609.24790v1", "pdf_url": "https://arxiv.org/pdf/2609.24790v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 $g$-theorem과 단순 다면체(simplicial polytopes)의 Betti 수에 관한 것으로, McMullen의 문제(d=5, f(5)=11, 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "이 논문은 매끄러운 볼록체(smooth convex body)를 근사하는 단순 다면체(simplicial polytopes) 수열에서 원시 Betti 수(primitive Betti numbers)가 $g$-theorem의 상한(upper bound)으로부터 발산함을 증명한다. 이는 Adiprasito-Nevo-Samper가 증명한 하한(lower bound)으로부터의 발산과 상보적인 결과이다. 증명의 핵심 도구로 단항식(monomials) 집합의 그림자(shadow) 크기에 대한 새로운 하한이 사용된다.", "technique": "단항식 집합의 그림자(shadow of a set of monomials) 크기에 대한 새로운 하한 부등식을 활용한 조합론적 논증.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.25794v1", "title": "Some results on the distance spectral radius and edge-disjoint spanning trees of graphs", "authors": ["Yongbin Gao", "Ligong Wang"], "abstract": "Let $τ(G)$ denote the maximum number of edge-disjoint spanning trees in a connected graph $G$ of order $n$, and let $ρ_D(G)$ denote its distance spectral radius. For an integer $k\\ge2$, Fan, He and Zhao [Discrete Appl. Math. 376 (2025) 31--40] obtained a sharp distance spectral radius condition for $τ(G)\\ge k$ when $n\\ge2k+6$. In this paper, we fill the gap $2k\\le n\\le2k+5$ and thus complete the result for all $n\\ge2k$. The extremal graph given by Fan, He and Zhao remains valid for $n\\ge2k+2$, while we determine the unique extremal graph for each of the orders $n=2k$ and $n=2k+1$. We further obtain sharp distance spectral radius conditions and characterize all extremal graphs under the minimum degree condition $δ(G)\\ge k$ for all $n\\ge2k$. Finally, for graphs with the stronger minimum degree condition $δ(G)\\ge6k-4$ and order $n\\ge2δ(G)+2$, we obtain a sharp distance spectral radius condition ensuring $τ(G)\\ge k$ and determine the unique extremal graph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T07:30:10+00:00", "updated": "2026-09-22T07:30:10+00:00", "abs_url": "http://arxiv.org/abs/2609.25794v1", "pdf_url": "https://arxiv.org/pdf/2609.25794v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 스펙트럼 이론과 스패닝 트리 문제는 이산기하학의 McMullen's problem(convex position, oriented matroid, realizability)과 직접적 관련이 없음.", "summary": "본 논문은 거리 스펙트럼 반지름(distance spectral radius) $ρ_D(G)$와 최대 간-분리 스패닝 트리 개수 $τ(G)$ 사이의 관계를 연구한다. Fan, He and Zhao의 이전 결과의 간격을 메우어 $n\\ge 2k$인 모든 경우에 $τ(G)\\ge k$를 보장하는 sharp spectral condition을 완성하고, 각 경우의 유일한 극값 그래프를 결정한다.", "technique": "거리 스펙트럼 반지름의 경계 조건과 최소 차수 제약 하에서의 그래프 특성화", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.19895v1", "title": "Fractal Hyper-Trees: Combinatorial Enumeration, Symmetry Properties, and Ultrametric Structures", "authors": ["Jean-Jacques Salone"], "abstract": "This paper introduces and formalizes Fractal Hyper-Trees (FHT), a novel class of hypergraphs characterized by deep recursive inclusion hierarchies and controlled relational textures. Moving beyond classical graph-theoretic frameworks, we establish an axiomatic foundation for FHTs and investigate their combinatorial enumeration, revealing explicit connections to OEIS sequence A398931. Furthermore, we analyze the structural symmetry properties via automorphism groups, examine the resulting global hierarchical ultrametric topologies, and discuss asymptotic perspectives, including vertex substitution operators and heuristic parallels with $p$-adic integer rings.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T08:42:49+00:00", "updated": "2026-09-17T08:42:49+00:00", "abs_url": "http://arxiv.org/abs/2609.19895v1", "pdf_url": "https://arxiv.org/pdf/2609.19895v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Fractal hyper-tree 구조와 ultrametric topology는 McMullen's problem의 convex position, oriented matroid, realizability 등과 직접 관계 없음.", "summary": "본 논문은 깊은 재귀적 포함 계층과 제어된 관계 구조로 특징지어진 hypergraph의 새로운 클래스인 Fractal Hyper-Trees (FHT)를 도입한다. FHT의 조합론적 열거, 자기동형군을 통한 대칭성, ultrametric 위상 구조를 분석하고 OEIS A398931과의 연결을 보인다.", "technique": "Recursive inclusion hierarchies와 automorphism group 분석을 통한 공리적 기초(axiomatic foundation) 설립.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.26041v1", "title": "A sharp density bound for 5-connected graphs with no $\\Ke$ minor", "authors": ["Caibing Chang", "Zijian Deng", "Qinfei Tang", "Caihong Yang"], "abstract": "Let $\\Ke$ be obtained from $K_7$ by deleting two independent edges. We prove that every 5-connected graph on $n\\ge7$ vertices with at least $4n-9$ edges contains a $\\Ke$ minor, settling Conjecture~1.4 of Dvo\\v rák, Norin and Rahman (arXiv preprint 2609.17760v1). The bound is sharp. We prove the stronger statement that every $4$-bilight graph on $n\\ge4$ vertices with at least $4n-9$ edges contains either a $\\Ke$ minor or a $K_6$ subgraph. Within their reduction framework, we strengthen the rooted-minor theorem. We show that every $4$-light 5-rooted graph of rooted $4$-density at least two has a model with two nonroot vertices and at most one missing edge incident with them. At the critical density, reductions preserve density exactly, which prevents them from creating a new $K_6$ subgraph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T11:45:33+00:00", "updated": "2026-09-22T11:45:33+00:00", "abs_url": "http://arxiv.org/abs/2609.26041v1", "pdf_url": "https://arxiv.org/pdf/2609.26041v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 마이너 이론과 밀도 경계에 관한 논문으로, McMullen's problem의 oriented matroid, 볼록 위치, 일반적 위치와는 직접 관련이 없음.", "summary": "본 논문은 5-연결 그래프에서 $K_e$ 마이너(7개 꼭짓점 완전 그래프에서 두 개의 독립 간선을 제거한 그래프)를 포함하기 위한 간선 밀도의 날카로운 경계 $4n-9$를 증명한다. 이는 Dvořák, Norin, Rahman의 추측을 해결하며, 경계가 최적임을 보인다.", "technique": "rooted-minor 정리 강화 및 4-light 5-rooted 그래프의 4-밀도에서의 감소 연산(reduction) 기법, 임계 밀도에서 감소 연산이 새로운 $K_6$ 부분그래프를 생성하지 않음을 이용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.19762v1", "title": "Spreads of degrees in graphs", "authors": ["Yair Caro", "Riste Škrekovski", "Christina Zarb"], "abstract": "For a graph $G$ and a set $B\\subseteq V(G)$, the spread $\\mathrm{sp}(B)$ of $B$ is the difference between the largest and the smallest degree in $G$ of a vertex of $B$, and for an integer $k\\geq0$ the parameter $\\mathrm{sp}(G,k)$ is the largest cardinality of a set $B$ with $\\mathrm{sp}(B)\\leq k$. Caro, Lauri and Zarb derived a lower bound for $\\mathrm{sp}(G,k)$ and, among several families of graphs, considered \\[ \\mathrm{MOP}(n,k)=\\min \\{\\mathrm{sp}(G,k):G\\text{ is a maximal outerplanar graph of order }n\\} \\] and determined $\\mathrm{MOP}(n,k)$ up to an additive constant for every $k\\not =2,$ leaving the case $k=2$ open, with the bounds $4n/9\\leq \\mathrm{MOP}(n,2)\\leq (5n+19)/11$. We first prove a lower bound on $\\mathrm{sp}(G,k)$ for an arbitrary graph $G$ in terms of its order $n$, its number of edges $m$ and its minimum degree $δ$. This lower bound contains the bounds of Caro, Lauri and Zarb and, for $k=0$, the bound $\\mathrm{rep}(G)\\geq \\left\\lceil n/(2d-2δ+1)\\right\\rceil $ of Caro and West, where $d=2m/n$. We determine when this lower bound is attained, exhibit explicit graphs attaining it, and show that it is exact for all graphs once $n\\geq n_{0}(δ,k,d)$. We then apply the bound to maximal outerplanar graphs: adjusting the count to this class we prove \\[ \\mathrm{MOP}(n,2)\\geq \\left\\lceil \\frac{4n+10}{9}\\right\\rceil \\qquad \\text{for every }n\\geq 14, \\] with equality for $n\\equiv 2\\ (\\mathrm{mod}\\ 18)$, and $\\mathrm{MOP}(n,2)=4n/9+O(1)$ for every $n$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T06:32:46+00:00", "updated": "2026-09-17T06:32:46+00:00", "abs_url": "http://arxiv.org/abs/2609.19762v1", "pdf_url": "https://arxiv.org/pdf/2609.19762v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 차수 분포 최적화는 조합론이지만, McMullen 문제(볼록 위치 점 배치, oriented matroid, 실현가능성)와 직접 관련이 없음.", "summary": "본 논문은 그래프 $G$의 부분집합 $B$에 대해 차수의 최대-최소 차이(spread)를 정의하고, $\\mathrm{sp}(G,k)$를 spread가 $k$ 이하인 최대 부분집합의 크기로 정의한다. 이전 연구에서 열려있던 극대 외평면 그래프(maximal outerplanar graph)의 경우 $k=2$에 대해 $\\mathrm{MOP}(n,2) \\geq \\lceil(4n+10)/9\\rceil$임을 증명하고, 일반 그래프에 대한 하한을 차수와 간선수로 표현한다.", "technique": "극대 외평면 그래프의 구조를 이용한 차수 계산 및 하한 유도; 등호 달성 조건 분석을 통한 정확한 점근 경계.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23634v1", "title": "Connectivity keeping pendant extensions of paths in $k$-connected graphs and triangle-free graphs", "authors": ["Menghan Ma", "Qinghai Liu", "Liping Zhang", "Yanmei Hong"], "abstract": "Motivated by Mader's conjecture on connectivity keeping trees, we study trees obtained from paths by adding one pendant vertex, as well as related problems in triangle-free graphs.   For an integer $m$ and $1\\leq i\\leq m-1$, let $P_m^+(i)$ denote the tree obtained from a path of order $m-1$ by adding one pendant vertex adjacent to its $i$th vertex. We prove that, for positive integers $k,m,1\\leq i\\leq m-1$, every $k$-connected graph $G$ with $δ(G)\\geq \\lfloor \\frac{3k}{2}\\rfloor+m-1$ contains a subgraph $T\\cong P_m^+(i)$ such that $κ(G-V(T))\\geq k$. This confirms Mader's conjecture for all pendant extensions of paths.   For highly connected triangle-free graphs, a connectivity keeping result for paths was obtained in [J. Combin. Theory Ser. B, 174 (2025), 190-206]. Let $(X,Y)$ be the bipartition of $P_m^+(i)$. We further prove that every $k$-connected triangle-free graph $G$ with $δ(G)\\geq k+\\max\\{|X|,|Y|\\}+[P_m^+(i)\\text{ is bad}]$ contains a subgraph $T\\cong P_m^+(i)$ such that $κ(G-V(T))\\geq k$, where we use Iverson's convention for $[P_m^+(i)\\text{ is bad}]$. This extends the corresponding result for paths to pendant extensions of paths.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-20T13:25:42+00:00", "updated": "2026-09-20T13:25:42+00:00", "abs_url": "http://arxiv.org/abs/2609.23634v1", "pdf_url": "https://arxiv.org/pdf/2609.23634v1", "journal_ref": "", "doi": "", "comment": "16pages, 0 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 분야이지만 McMullen's problem(고차원 볼록기하학 및 oriented matroid)과 직접적 관련이 없으며, 경로와 트리의 연결성 문제는 제시된 연구 문제와 무관함.", "summary": "본 논문은 Mader의 연결성 유지 트리 추측을 동기로, 경로에 pendant 정점을 추가한 트리 구조 $P_m^+(i)$를 다룬다. $k$-연결 그래프에서 최소차수 조건 하에 $P_m^+(i)$ 부분그래프를 포함하면서 남은 그래프의 연결성을 유지함을 증명하며, 삼각형이 없는 그래프에서도 확장 결과를 얻는다.", "technique": "최소차수 조건을 통한 부분그래프 존재 증명, 이분 분해를 활용한 삼각형 비허용 그래프 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.28417v1", "title": "Ehrhart polynomials of cyclic polytopes as averages of zonotope Ehrhart polynomials", "authors": ["Masato Konoike"], "abstract": "We prove an averaging formula for the Ehrhart polynomial of a cyclic polytope whose vertices are given by integer parameters on the moment curve. More precisely, its Ehrhart polynomial is the average of the Ehrhart polynomials of an explicitly constructed family of lattice zonotopes. Since lattice zonotopes are magic positive, this formula implies magic positivity for these cyclic polytopes. Consequently, their $h^\\ast$-polynomials are real-rooted, and their $h^\\ast$-vectors are log-concave and unimodal.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-23T17:18:50+00:00", "updated": "2026-09-23T17:18:50+00:00", "abs_url": "http://arxiv.org/abs/2609.28417v1", "pdf_url": "https://arxiv.org/pdf/2609.28417v1", "journal_ref": "", "doi": "", "comment": "6 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 cyclic polytope의 Ehrhart 다항식과 조합론적 성질을 다루며, McMullen 문제나 Larman 추측과는 직접적 관련이 없다.", "summary": "이 논문은 정수 파라미터로 주어진 꼭짓점을 가지는 cyclic polytope의 Ehrhart 다항식이 명시적으로 구성된 격자 조노토프(lattice zonotope) 족의 Ehrhart 다항식들의 평균임을 증명한다. 격자 조노토프가 magic positive임을 이용하여 해당 cyclic polytope의 magic positivity를 도출한다. 그 결과로 $h^*$-다항식의 real-rootedness, $h^*$-벡터의 log-concavity 및 unimodality가 성립함을 보인다.", "technique": "격자 조노토프의 magic positivity를 활용한 평균 공식(averaging formula)을 통해 cyclic polytope의 Ehrhart 다항식을 분석한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.28102v1", "title": "Biplanar graphs with independence number two are 9-colorable", "authors": ["Stefan Szeider"], "abstract": "A graph is biplanar if it is the union of two planar graphs on the same vertex set. The largest chromatic number of a biplanar graph is known to lie between 9 and 12. The lower bound comes from Sulanke's graph, which has independence number 2, and a biplanar graph on 19 vertices with independence number 2 would have chromatic number at least 10. Gethner and Sulanke asked in 2009 whether such a graph exists. We show that it does not, and more generally that every biplanar graph with independence number at most 2 is 9-colorable. The proof embeds a hypothetical counterexample in the union of two sphere triangulations, enumerates with SAT modulo symmetries the 3271 graphs that pass a necessary filter for the complement of such a union, and shows with a SAT solver that none of them is such a complement; a matching argument reduces the general statement to this computation and one further case on 18 vertices. The computational part of the proof, including the completeness of the enumeration and every refutation, is checked in Lean 4, assuming three classical facts about planar graphs. The Lean development, the SAT instances, and the enumeration certificates are available on Zenodo.", "categories": ["math.CO", "cs.LO"], "primary_category": "math.CO", "published": "2026-09-23T13:33:04+00:00", "updated": "2026-09-23T13:33:04+00:00", "abs_url": "http://arxiv.org/abs/2609.28102v1", "pdf_url": "https://arxiv.org/pdf/2609.28102v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 이평면 그래프(biplanar graph)의 채색수 문제를 다루며, McMullen's problem이나 Larman 추측과는 직접적인 관련이 없다.", "summary": "이평면 그래프(두 평면 그래프의 합집합)의 최대 채색수는 9와 12 사이에 있음이 알려져 있으며, 본 논문은 독립수(independence number)가 최대 2인 모든 이평면 그래프가 9-채색 가능함을 증명한다. 증명은 SAT solver와 대칭 모듈 열거를 활용하여 3271개의 후보 그래프를 분석하고, Lean 4로 계산적 증명 전체를 형식적으로 검증한다.", "technique": "SAT modulo symmetries를 이용한 후보 그래프 열거, SAT solver에 의한 반박, 그리고 Lean 4를 이용한 전체 계산 증명의 형식 검증.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.27738v1", "title": "Ehrhart theorem for integral-integral affine manifolds with corners", "authors": ["Oded Elisha"], "abstract": "We study lattice-counting functions on compact integral-integral affine manifolds with corners, which generalize integral unimodular polytopes. We prove analogues of Ehrhart's theorem and Ehrhart-Macdonald reciprocity in this setting.", "categories": ["math.DG", "math.CO", "math.SG"], "primary_category": "math.DG", "published": "2026-09-23T11:53:45+00:00", "updated": "2026-09-23T11:53:45+00:00", "abs_url": "http://arxiv.org/abs/2609.27738v1", "pdf_url": "https://arxiv.org/pdf/2609.27738v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 적분 어파인 다양체에서의 Ehrhart 정리를 다루며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 compact integral-integral affine manifolds with corners 위에서의 격자 점 계수 함수를 연구하며, 이는 integral unimodular polytope의 일반화이다. 저자는 이 설정에서 Ehrhart 정리와 Ehrhart-Macdonald 상반성(reciprocity)의 유사체를 증명한다.", "technique": "Integral-integral affine manifolds with corners 구조를 활용한 격자 계수 함수 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.24207v1", "title": "Convergence of metric measure spaces via embeddings in the Urysohn universal space", "authors": ["Milica Caković", "Enrico Pasqualetto", "Timo Schultz"], "abstract": "We study different notions of convergence of metric measure spaces by means of isometric embeddings into the Urysohn universal metric space $\\mathbb U$. Due to the universality of $\\mathbb U$, the collection $\\mathbb X_1$ of isomorphism classes of normalised metric measure spaces can be canonically identified with the quotient (set) $\\mathscr P_\\sim(\\mathbb U)=\\mathscr P(\\mathbb U)/\\sim$ of the space $\\mathscr P(\\mathbb U)$ of Borel probability measures on $\\mathbb U$, where $μ\\simν$ if $ν$ is the pushforward of $μ$ under an isometry between their respective supports. By making crucial use of the ultrahomogeneity of $\\mathbb U$, we show that, under the above identification, Gromov's box topology on $\\mathbb X_1$ coincides with the quotient topology induced by the weak topology of $\\mathscr P(\\mathbb U)$. More quantitatively, the truncated $1$-Wasserstein distance on $\\mathscr P(\\mathbb U)$ induces a complete and separable distance ${\\sf d}_{\\rm mG}$ on $\\mathbb X_1\\cong\\mathscr P_\\sim(\\mathbb U)$, which metrises the quotient topology of $\\mathscr P_\\sim(\\mathbb U)$ and is Hölder equivalent to the box distance $\\square$.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-21T07:23:45+00:00", "updated": "2026-09-21T07:23:45+00:00", "abs_url": "http://arxiv.org/abs/2609.24207v1", "pdf_url": "https://arxiv.org/pdf/2609.24207v1", "journal_ref": "", "doi": "", "comment": "12 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "메트릭 측도 공간의 수렴성 연구로, 이산기하학의 점 배치 문제나 볼록위치 문제와 직접적 관련이 없음.", "summary": "본 논문은 Urysohn 범용 메트릭 공간으로의 등거리 임장을 통해 메트릭 측도 공간의 수렴을 연구한다. Gromov의 상자 위상이 Borel 확률측도 공간의 약한 위상으로부터 유도된 몫 위상과 일치함을 보이며, 절단된 1-Wasserstein 거리가 이 위상을 메트리화함을 증명한다.", "technique": "Urysohn 범용 공간의 초동질성(ultrahomogeneity)과 확률측도 공간의 약한 위상, Wasserstein 거리를 이용한 거리화 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23922v1", "title": "Rényi stability of $B_h$ sets: a two-order phase diagram and sharp deletion principles", "authors": ["Jae Oh Woo"], "abstract": "A set $B$ in an abelian group is a $B_h$ set if every $h$-term sum has a unique representation up to permutation; for $h=2$ these are the Sidon sets. We study a weighted removal problem for this collision-free property: if the $h$-fold sum map has small Rényi entropy loss, how much probability mass must be deleted to leave a $B_h$ support? Two Rényi orders naturally arise: a collision order $α$, measuring the entropy loss, and a budget order $β$, controlling how spread out the weighting may be. Existing one-order formulations tie the two together on the diagonal $β=α$. We determine the resulting stability problem on the full $(α,β)$-plane. Stability holds exactly when $β\\le1$ and $α\\geβ$. Inside this region the optimal deletion rate is polynomial for $β<1$ and logarithmic on the boundary $β=1$, where the leading constant is exact; outside it, stability fails through two distinct mechanisms: a supercritical budget and dilution by light atoms. In each case the limiting defect is computed exactly. The upper bounds follow from a sharp list-coarsening inequality with optimal constant, which also yields an entropy-free removal theorem, a finite combinatorial consequence for moments of the representation function, and extensions to $B_h[g]$ sets. Matching constructions show that the phase boundaries and rates are sharp.", "categories": ["math.CO", "cs.IT"], "primary_category": "math.CO", "published": "2026-09-20T22:55:58+00:00", "updated": "2026-09-20T22:55:58+00:00", "abs_url": "http://arxiv.org/abs/2609.23922v1", "pdf_url": "https://arxiv.org/pdf/2609.23922v1", "journal_ref": "", "doi": "", "comment": "30 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen's problem은 convex position의 점 배치와 combinatorial geometry에 관한 것이며, 본 논문은 additive combinatorics의 Sidon/B_h sets에 관한 것으로 직접 관련성이 없음.", "summary": "Abelian group에서 B_h sets (h-term sum의 유일한 표현을 갖는 집합)에 대한 Rényi stability 문제를 다룸. h-fold sum map의 entropy loss가 작을 때, collision-free 성질을 유지하기 위해 삭제해야 할 확률 질량의 양을 결정하는 가중 제거 문제를 연구함.", "technique": "Rényi entropy의 두 order (collision order α와 budget order β)를 도입하여 (α,β)-plane에서 stability를 완전히 특성화; list-coarsening inequality와 entropy-free removal theorem 활용.", "connections": "추측: oriented matroid의 reorientation과 representation function의 combinatorial structure 사이의 깊은 연결이 있을 수 있으나, 초록에는 명시되지 않음.", "keyword_hits": [], "source": "explore"}, {"id": "2609.23024v1", "title": "Extremal Least Common Multiples in Rows of Pascal's Triangle", "authors": ["Felix Huber"], "abstract": "For $r \\geq 0$, let $\\mathcal P_r=\\{\\binom{r}{0},\\binom{r}{1},\\ldots,\\binom{r}{\\lfloor r/2\\rfloor}\\}$ be the set of distinct entries in row $r$ of Pascal's triangle. We study the least possible least common multiple of $n$ entries chosen from one row, with the row itself also free: \\[ a(n)=\\min_{\\substack{r\\geq 0,\\ S\\subseteq\\mathcal P_r\\\\ |S|=n}}\\operatorname{lcm}(S). \\] We first recast the fixed-row problem exactly as a weighted prime-power exclusion problem. This structural description explains why optimal supports may develop holes and yields an exact certification method for finite cases. Our main asymptotic result is \\[ \\log a(n)=2n+O\\!\\left(n\\exp\\!\\left(-c\\frac{(\\log n)^{3/5}}{(\\log\\log n)^{1/5}}\\right)\\right) \\] for some absolute $c>0$, so $a(n)^{1/n}\\to e^2$. A two-band refinement further shows that every optimal row satisfies \\[ r_n=2n+O\\!\\left(n\\exp\\!\\left(-c\\frac{(\\log n)^{3/5}}{(\\log\\log n)^{1/5}}\\right)\\right), \\] and that the minimum prefix defect of an optimal support is $o(n)$. Finally, two independent exact implementations certify the first finite structural transitions: $n=15$ is the first non-prefix optimum, while $n=41$ is the first case of minimum prefix defect greater than one.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-09-19T13:44:30+00:00", "updated": "2026-09-19T13:44:30+00:00", "abs_url": "http://arxiv.org/abs/2609.23024v1", "pdf_url": "https://arxiv.org/pdf/2609.23024v1", "journal_ref": "", "doi": "", "comment": "20 pages. Ancillary files contain the reproducibility archive for the exact computations", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "파스칼 삼각형의 행(row)에서 최소공배수 최적화 문제로, McMullen's problem의 convex position, general position, oriented matroid 등과 직접적 관련성이 없음.", "summary": "이 논문은 파스칼 삼각형의 한 행에서 선택한 n개의 항목의 최소공배수 최솟값 a(n)을 연구한다. 가중 소수-거듭제곱 배제 문제로 구조화하여 log a(n) = 2n + 오류항의 점근 공식을 증명하고, a(n)^{1/n} → e^2임을 보인다.", "technique": "가중 소수-거듭제곱 배제 문제(weighted prime-power exclusion problem)로의 재구성과 유한 경우 인증 방법(certification method).", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23210v1", "title": "The lattice covering density of the regular octahedron", "authors": ["Yanlu Lian", "Fei Xue"], "abstract": "We prove that the lattice covering density of the regular octahedron is $9/8$, settling a conjecture of Dougherty and Faber.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-09-19T20:42:19+00:00", "updated": "2026-09-19T20:42:19+00:00", "abs_url": "http://arxiv.org/abs/2609.23210v1", "pdf_url": "https://arxiv.org/pdf/2609.23210v1", "journal_ref": "", "doi": "", "comment": "31 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "격자 덮음 밀도(lattice covering density)는 볼록 기하학 문제이지만, McMullen's problem의 convex position, oriented matroid, chirotope 등 조합론적 기하 도구와 직접 관련이 없음.", "summary": "정규 팔면체(regular octahedron)의 격자 덮음 밀도(lattice covering density)가 9/8임을 증명하여 Dougherty-Faber 추측을 해결하였다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.30068v1", "title": "S-meandric Permutations and Tangency Polynomials", "authors": ["Yury Belousov", "Viktoriia Georgievskaia"], "abstract": "A meander is a configuration of two simple plane curves intersecting transversely. The orders of their intersection points define a permutation that determines the configuration. When tangencies are allowed, however, different configurations can share the same permutation. We study the combinatorial and algebraic structures arising from this non-uniqueness. We give a realization criterion and show that the realizations of each realizable permutation form an affine space over the two-element field. We describe this space using an associated graph, called the component spine. We prove that the component spine of every permutation is a cactus. We also introduce the tangency polynomial, which counts realizations by their number of tangencies, investigate its properties, and prove that it factors over the cycles and bridges of the component spine. We derive a central limit theorem for tangency counts and obtain asymptotic formulas for the number of distinct tangency polynomials.", "categories": ["math.CO", "math.GT"], "primary_category": "math.CO", "published": "2026-09-24T16:26:27+00:00", "updated": "2026-09-24T16:26:27+00:00", "abs_url": "http://arxiv.org/abs/2609.30068v1", "pdf_url": "https://arxiv.org/pdf/2609.30068v1", "journal_ref": "", "doi": "", "comment": "28 pages, 10 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 곡선의 교차·접선 배치에 관한 조합론으로, McMullen 문제(볼록/일반위치 점 배치, oriented matroid 실현가능성)와 직접적 관련이 없다.", "summary": "이 논문은 두 단순 평면 곡선이 접선(tangency)을 허용하며 교차할 때 발생하는 S-meandric 순열의 조합·대수적 구조를 연구한다. 각 실현가능한 순열의 실현 집합이 2원체 위의 affine 공간을 이루며, 이를 기술하는 'component spine' 그래프가 항상 cactus임을 증명한다. 또한 접선 수를 세는 tangency polynomial을 도입하고, 중심극한정리 및 점근 공식을 도출한다.", "technique": "component spine(cactus 그래프) 구조 분석, 2원체 위의 affine 공간 표현, tangency polynomial의 인수분해 및 확률론적 점근 분석.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.21922v1", "title": "On the Injectivity of Elementary Symmetric Partitions and the Multiset Recovery Problem", "authors": ["Ziyao Sun"], "abstract": "The elementary symmetric partition map $\\pre_s$, introduced by Ballantine, Beck, and Merca, sends an integer partition to the summands in the evaluation of the $s$-th elementary symmetric polynomial at its parts. By encoding partition parts as prime-exponent valuation vectors, we connect $\\pre_s$ to Leo Moser's additive Multiset Recovery Problem (1957) and prove that $\\pre_s$ is unconditionally injective on partitions of length $n$ whenever $n$ lies outside the Moser root set $\\mathcal{Z}_s$, with no size restrictions. Furthermore, under the equal-size constraint $|λ| = |μ| = N$, we prove that $\\pre_4$ is injective at the isolated singular length $n = 12$, and that every fiber of $\\pre_3$ on $\\Part_6(N)$ has cardinality at most $2$, completely excluding both triplets and quartets.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-09-18T15:43:05+00:00", "updated": "2026-09-18T15:43:05+00:00", "abs_url": "http://arxiv.org/abs/2609.21922v1", "pdf_url": "https://arxiv.org/pdf/2609.21922v1", "journal_ref": "", "doi": "", "comment": "18 pages, 1 appendix", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "elementary symmetric partitions와 multiset recovery는 combinatorial structure 문제이지만, McMullen's problem(convex position, oriented matroid, polyhedral matching)과 직접적 관련성 없음.", "summary": "Ballantine-Beck-Merca의 elementary symmetric partition map $\\pre_s$의 단사성(injectivity)을 연구하며, Moser의 1957년 additive Multiset Recovery Problem과 연결함. 분할의 길이가 Moser root set 밖에 있을 때 무조건적 단사성을 증명하고, 크기 제약 하에서 $\\pre_3$, $\\pre_4$의 섬유(fiber) 구조를 특성화함.", "technique": "소인수분해 지수 벡터(prime-exponent valuation vectors)로의 인코딩과 대수적 부등식 기법을 사용한 단사성 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23031v1", "title": "Two-disjoint-cycle-cover edge bipancyclicity of bipartite generalized hypercubes", "authors": ["Ke Lu", "Ruichao Niu"], "abstract": "Let \\(G=C(d_1,\\ldots,d_n)=F_1\\BoxProd\\cdots\\BoxProd F_n\\) be a bipartite generalized hypercube with \\(n\\geq2\\), all \\(d_i\\) even, and \\(N=|V(G)|\\geq8\\), where \\(F_i=K_2\\) when \\(d_i=2\\), and \\(F_i=C_{d_i}\\) when \\(d_i\\geq4\\). We prove the following exact strengthening of two-disjoint-cycle-cover vertex bipancyclicity. For every ordered pair of independent edges \\(e,f\\in E(G)\\) and every even integer \\(4\\leq\\ell\\leq N-4\\), the vertex set can be partitioned into two cycles \\(J_1,J_2\\) of lengths \\(\\ell\\) and \\(N-\\ell\\), respectively, with \\(e\\in E(J_1)\\) and \\(f\\in E(J_2)\\), if and only if \\(G\\) is not isomorphic to any \\(K_2\\BoxProd C_{2p}\\) with \\(p\\geq3\\). The graph \\(C(2,2)\\cong C_4\\) is treated separately: it has no 2-DCC. Consequences that retain prescribed-edge information include ordinary edge bipancyclicity and the even \\(k\\)-ary \\(n\\)-cube specialization.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-19T14:06:32+00:00", "updated": "2026-09-19T14:06:32+00:00", "abs_url": "http://arxiv.org/abs/2609.23031v1", "pdf_url": "https://arxiv.org/pdf/2609.23031v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학의 McMullen 문제(볼록위치 점 배치, oriented matroid 등)와 무관하며, 순수 그래프 이론의 사이클 분해 문제임.", "summary": "Bipartite generalized hypercube $G=C(d_1,\\ldots,d_n)$에서 독립적인 두 간선 $e,f$를 각각 포함하면서 길이 $\\ell$과 $N-\\ell$인 두 개의 분리된 사이클로 정점 집합을 분할할 수 있는 조건을 완전히 특성화한다. 예외는 $K_2\\Box C_{2p}$ (단, $p\\geq 3$) 형태의 그래프와 $C_4$이다.", "technique": "Hypercube 구조의 대칭성과 bipartite 성질을 이용한 사이클 분해 및 구성적 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24080v1", "title": "Extremal spectral result of outerplanar graphs without $P_{3\\cdot l}$", "authors": ["Fulong Ye", "Yuxiang Liu", "Ligong Wang"], "abstract": "A graph $G$ is $F$-free if it does not contain $F$ as a subgraph. Let $\\mathrm{spex}(n,F)$ be the maximum spectral radius over all $n$-vertex $F$-free outerplanar graphs. For integers $t\\geq1$ and $l\\geq2$, let $P_{t\\cdot l}$ be the starlike tree with $t$ branches of length $l-1$. For sufficiently large $n$, Yin, Li, and Meng [arXiv:2504.04364v1] characterized the unique extremal graph for $\\mathrm{spex}(n,P_{t\\cdot l})$ when $t=1$, $t=2$, or $t\\geq4$. They left the case $t=3$ open and proposed a natural candidate for the extremal graph. We show that this candidate is not extremal and determine the unique extremal graph for $\\mathrm{spex}(n,P_{3\\cdot l})$. For every $l\\geq3$ and all sufficiently large $n$, this unique extremal graph is $K_1\\vee\\bigl(2P_{2l-3}\\cup qP_{l-2}\\cup P_r\\bigr),$ where $q$ and $r$ are integers satisfying $n=2(2l-3)+q(l-2)+r+1,$ $q\\geq0,$ $0\\leq r<l-2.$", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T04:06:55+00:00", "updated": "2026-09-21T04:06:55+00:00", "abs_url": "http://arxiv.org/abs/2609.24080v1", "pdf_url": "https://arxiv.org/pdf/2609.24080v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "극값 그래프 스펙트럼 문제로, McMullen의 문제(convex position, general position 점 배치)와 직접적 관련이 없음.", "summary": "본 논문은 $P_{3\\cdot l}$을 부분그래프로 포함하지 않는 외평면 그래프(outerplanar graphs)에서 스펙트럼 반지름의 최댓값을 구하는 극값 문제를 다룬다. 선행 연구에서 미해결로 남겨진 $t=3$ 경우에 대해, 제안된 후보가 극값 그래프가 아님을 보이고 유일한 극값 그래프를 결정한다.", "technique": "스펙트럼 반지름의 극값화(extremal spectral radius)를 통한 그래프 구조 특성화", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.28674v1", "title": "Distribution of the inversion statistic on run-sorted permutations", "authors": ["Toufik Mansour", "Olivia Nabawanda", "Mark Shattuck"], "abstract": "Let $π=π_1\\cdots π_n$ be a permutation. We say that $π$ is $run$-$sorted$ if $π_1=1$ and the entries immediately following the descent positions of $π$ form an increasing sequence. Let $\\mathcal{R}_n$ denote the set of run-sorted permutations of length $n$, which has cardinality given by the Bell number $B_{n-1}$ for all $n \\geq 1$. In this paper, we consider the joint distribution $A_n(q,u)$ on $\\mathcal{R}_n$ for the parameters tracking the numbers of inversions and runs leading to a new polynomial generalization of the Bell numbers. Among our results, we find a general recurrence for $A_n(q,u)$, from which one may derive explicit formulas for the total numbers of inversions or runs in all the members of $\\mathcal{R}_n$ as well as for the sign-balance on $\\mathcal{R}_n$ of either parameter. A simple expression for the Eulerian generating function for $A_n(q,1)$ may be found upon making use of Gessel's $q$-exponential formula which can be extended to general $u$. Finally, a formula is found by a direct argument for the maximum number of inversions within a member of $\\mathcal{R}_n$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-23T18:14:42+00:00", "updated": "2026-09-23T18:14:42+00:00", "abs_url": "http://arxiv.org/abs/2609.28674v1", "pdf_url": "https://arxiv.org/pdf/2609.28674v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Run-sorted permutations의 inversion 분포는 순열의 조합론적 성질이지만 McMullen's problem (고차원 볼록 위치의 점 배치, oriented matroid, acyclic reorientation)과 직접적 관련 없음.", "summary": "Run-sorted 순열(첫 원소 1, descent 직후 원소들이 증가수열)의 집합 $\\mathcal{R}_n$에서 inversion과 run 개수의 결합분포를 연구. 이 집합의 크기가 Bell 수 $B_{n-1}$임을 알려진 결과로 삼고, 일반 재귀식, Gessel의 $q$-지수공식을 이용한 생성함수, inversions의 최댓값 공식을 도출.", "technique": "Gessel의 $q$-exponential formula를 적용한 생성함수 접근과 직접 조합론적 논증.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.28892v1", "title": "Trident Tableaux for Tree-Child Networks with One Reticulation Node: A Bijection with Two-Wall Tableaux", "authors": ["Hexuan Liu"], "abstract": "Motivated by a word encoding of tree-child networks, we introduce trident tableaux, which are Young tableaux with a unique three-cell column satisfying certain conditions on successors. We construct a bijection between trident tableaux with $n+1$ columns and two-wall tableaux with $n$ columns, that is, two-row fillings with two designated columns in which vertical order is not imposed. The bijection matches the three-part decompositions of the two classes and shows that each class has cardinality $n(n+1)C_n/2$, where $C_n$ is the $n$-th Catalan number. In particular, it gives a trident-tableau interpretation of a shifted form of OEIS A002457. As a consequence, we obtain an exact enumeration of tree-child networks with one reticulation node that contain a trident, and show that their proportion among all tree-child networks with one reticulation node tends to $1/8$ as the number of leaves tends to infinity.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-24T01:06:12+00:00", "updated": "2026-09-24T01:06:12+00:00", "abs_url": "http://arxiv.org/abs/2609.28892v1", "pdf_url": "https://arxiv.org/pdf/2609.28892v1", "journal_ref": "", "doi": "", "comment": "14 pages, 5 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 tree-child networks의 조합적 구조와 Young tableaux의 bijection을 다루며, 이산기하학이나 oriented matroid의 실현가능성, convex position 등과 직접적 관련이 없음.", "summary": "Tree-child networks with one reticulation node를 인코딩하기 위해 trident tableaux를 도입하고, 이를 two-wall tableaux와 연결하는 bijection을 구성함. 이 bijection을 통해 두 tableaux 클래스의 cardinality가 $n(n+1)C_n/2$임을 보이고, trident를 포함하는 tree-child networks의 열거 및 점근적 비율 $1/8$을 얻음.", "technique": "Young tableaux 간의 bijection 구성 및 three-part decomposition의 대응을 통한 cardinality 계산.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24684v1", "title": "Clique-dependent strongly sublinear treewidth and strongly sublinear tree-independence number", "authors": ["Andrea Munaro"], "abstract": "We establish a strongly sublinear counterpart of a recent result of Chudnovsky, E S, and Lokshtanov (arXiv 2025) on treewidth and tree-independence number. Namely, we prove that a hereditary graph class has strongly sublinear tree-independence number if and only if, for every fixed clique bound, its graphs of bounded clique number have strongly sublinear treewidth. In fact, this is part of a broader equivalence theorem. For hereditary classes, these conditions are also equivalent to having clique-dependent polynomial expansion, to admitting balanced separators whose size is bounded by $Kω(G)^s |V(G)|^{1-β}$ for fixed $K,s,β>0$, and to admitting balanced clique-based separators of strongly sublinear size (equivalently, weight). Thus, we show that all these properties, which arose independently in the study of subexponential-time exact algorithms and polynomial-time approximation schemes, in fact describe the same hereditary graph classes. As a consequence of our equivalence theorem, we also show that every hereditary class $\\mathcal C$ with strongly sublinear tree-independence number admits a subexponential-time algorithm that, given $G\\in\\mathcal C$, computes a tree decomposition of $G$ with strongly sublinear independence number.", "categories": ["math.CO", "cs.DS"], "primary_category": "math.CO", "published": "2026-09-21T14:41:13+00:00", "updated": "2026-09-21T14:41:13+00:00", "abs_url": "http://arxiv.org/abs/2609.24684v1", "pdf_url": "https://arxiv.org/pdf/2609.24684v1", "journal_ref": "", "doi": "", "comment": "29 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프의 트리폭(treewidth)과 트리-독립수(tree-independence number) 연구로, McMullen's problem의 점 배치·oriented matroid·realizability 등과는 직접 관련 없음.", "summary": "유전적 그래프 클래스에서 strongly sublinear tree-independence number를 특성화하는 동치 정리를 증명한다. 이는 bounded clique number를 가진 그래프의 strongly sublinear treewidth, polynomial expansion, balanced separator, clique-based separator의 strongly sublinear 크기 등과 모두 동치임을 보인다.", "technique": "균형잡힌 분리자(balanced separator)와 clique-based separator를 활용한 동치 조건 도출 및 subexponential-time 알고리즘 설계.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23962v1", "title": "The $L_p$ Minkowski problem for $C$-close sets: existence and continuity", "authors": ["Wen Ai", "Deping Ye", "Baocheng Zhu"], "abstract": "Let $C$ be a pointed closed convex cone in $\\mathbb{R}^n$ with nonempty interior, and let $S^{n-1}$ denote the unit sphere in $\\mathbb{R}^n$. The $L_p$ Minkowski problem for $C$-close sets is to determine, for a real number $p$ and a nonzero finite Borel measure $μ$ defined on $Ω_{C^\\circ}=S^{n-1}\\cap \\mathrm{int} C^{\\circ}$, whether there exists a $C$-close set $\\mathds{A}$ such that $μ$ is the $L_p$ surface area measure of $\\mathds{A}$. In this paper, we will solve the problem for $p\\in (0,1)$ and for $μ$ being a nonzero finite Borel measure on $Ω_{C^\\circ}$. Moreover, we establish the continuity of solutions to the $L_p$ Minkowski problem for $p\\in [0, 1]$ in several settings.", "categories": ["math.MG", "math.AP"], "primary_category": "math.MG", "published": "2026-09-21T00:25:31+00:00", "updated": "2026-09-21T00:25:31+00:00", "abs_url": "http://arxiv.org/abs/2609.23962v1", "pdf_url": "https://arxiv.org/pdf/2609.23962v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "볼록기하의 Minkowski 문제이지만, McMullen's problem(점 배치의 acyclic orientation, oriented matroid 실현성)과는 기하학적 맥락이 근본적으로 다름.", "summary": "지적된 convex cone $C$에 대해 $L_p$ Minkowski 문제를 연구하며, $p\\in(0,1)$ 범위에서 주어진 Borel measure를 $L_p$ surface area measure로 갖는 $C$-close set의 존재성을 해결함. $p\\in[0,1]$에서 해의 연속성도 확립.", "technique": "Minkowski 문제의 변분·PDE 기법(존재성 및 연속성 증명), $L_p$ surface area measure의 측도론적 특성화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.28556v1", "title": "Spectral extremal graphs for $W_5$-free graphs with odd size", "authors": ["Jing Gao", "Xianya Geng", "Shuchao Li"], "abstract": "For a fixed integer $k\\ge 2$, let $W_{2k+1}=K_1\\vee C_{2k}$ be an odd wheel graph. The fixed-size spectral extremal problem aims to determine \\[   \\operatorname{spex}(m,W_{2k+1}):=\\max\\{ρ(G): e(G)=m,\\ G \\text{ is } W_{2k+1}\\text{-free}\\}, \\] where $ρ(G)$ denotes the adjacency spectral radius. Based on this problem, Yu, Li, and Peng [12] proposed the following conjecture: When $m-\\binom{k}{2}$ is divisible by $k$ and $m$ is large, every $W_{2k+1}$-free graph of size $m$ satisfies \\(   ρ(G)^2-(k-1)ρ(G)\\le m-\\binom{k}{2} \\) with equality precisely for $K_k\\vee qK_1$. For nonzero residue class, Yu, Zhang, and Zhang [13] proposed the following conjecture: Let $r$ be a nonzero remainder when $m-\\binom{k}{2}$ is divided by $k$ and $m$ is large. Then $S_{k,m}$ is the unique graph among $W_{2k+1}$-free graphs of size $m$ having maximum spectral radius, where $S_{k,m}$ is obtained from $K_k\\vee qK_1$ by adding a vertex $z$ and joining it to exactly $r$ vertices of the $K_k$. Very recently, Fang, Zhai and Zhang [4] confirmed the Yu--Li--Peng conjecture for $k\\ge 2$. Chen, Gao and Li [2] confirmed Yu-Zhang-Zhang conjecture for $k\\ge 3$. When $k=2$, then $W_5=K_1\\vee C_4$. For large odd $m$, determining $\\operatorname{spex}(m,W_5)$ is still open. In this paper we address the odd-size problem. Our result disproved Yu-Zhang-Zhang conjecture for $k= 2$. In our proof, a universal defect bound shows that only $O(1)$ edges can lie outside the dense core. Perron localization then reduces this to at most one edge. A discrete defect inequality forces the complete bipartite crossing and quantizes the two matching deficiencies. Exact quotient-polynomial comparisons eliminate the remaining cross-edge and odd--odd candidates.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-23T08:18:57+00:00", "updated": "2026-09-23T08:18:57+00:00", "abs_url": "http://arxiv.org/abs/2609.28556v1", "pdf_url": "https://arxiv.org/pdf/2609.28556v1", "journal_ref": "", "doi": "", "comment": "26", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "스펙트럼 극값 문제(spectral extremal problem)는 조합론의 별도 부분으로, McMullen's problem의 볼록위치·oriented matroid·realizability와 직접 관련이 없음.", "summary": "본 논문은 홀수 크기 $W_5$-자유 그래프(wheel graph $W_5 = K_1 \\vee C_4$를 포함하지 않는 그래프)에 대한 고정크기 스펙트럼 극값 문제를 다룬다. Yu-Zhang-Zhang 추측을 $k=2$ 경우에 대해 반박하고, universal defect bound, Perron localization, discrete defect inequality 등을 통해 최적 그래프를 완전히 결정한다.", "technique": "Universal defect bound를 이용한 희소 부분 제약, Perron localization을 통한 차수 축소, quotient-polynomial 비교를 통한 후보 제거.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25196v1", "title": "Maximizing the number of cliques in $K_{r+1}$-free graphs with forbidden properties", "authors": ["Aleyah Dawkins", "Rachel Kirsch"], "abstract": "Ferrero and Lesniak in 2018 found the maximum numbers of edges in $r$-partite non-Hamiltonian graphs. Recently we found the maximum numbers of edges and $t$-cliques in $K_{r+1}$-free graphs (1) that are not Hamiltonian or (2) that satisfy a condition on low-degree vertices related to Pósa's theorem. Applying theorem (2), here we extend theorem (1) from Hamiltonicity to other properties. We determine the maximum numbers of edges and $t$-cliques in $K_{r+1}$-free graphs that avoid one of the following properties: traceability, Hamiltonian-connectedness, $k$-path Hamiltonicity, $k$-Hamiltonicity, $k$-Hamiltonian-connectedness, and $k$-connectedness. We find all extremal graphs having the maximum numbers of edges. On the way, we prove upper bounds on the numbers of edges and $t$-cliques in $K_{r+1}$-free graphs that avoid an arbitrary stable property that holds for sufficiently large complete graphs.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T17:45:17+00:00", "updated": "2026-09-21T17:45:17+00:00", "abs_url": "http://arxiv.org/abs/2609.25196v1", "pdf_url": "https://arxiv.org/pdf/2609.25196v1", "journal_ref": "", "doi": "", "comment": "30 pages. arXiv:2310.11452v4 has been split into two papers, with the first on Hamiltonicity and chorded pancyclicity at arXiv:2310.11452v5, and all other properties in this second paper", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 그래프의 클리크 개수와 극값 그래프 이론을 다루지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, 다면체 구조와는 직접 관련이 없습니다.", "summary": "본 논문은 $K_{r+1}$-free 그래프에서 여러 경로/해밀턴 성질을 만족하지 않으면서 최대 개수의 clique를 갖는 그래프를 특성화합니다. 특히 non-Hamiltonian, non-traceable, 비연결성 등 다양한 금지된 성질(forbidden property) 하에서 $t$-clique 개수의 상한을 구하고 극값 그래프를 모두 결정합니다.", "technique": "Turán-type 극값 그래프 이론과 Pósa 정리의 차수 조건을 활용한 상한 증명", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.27172v1", "title": "An exposition of the proof of the Komlós conjecture", "authors": ["Emrullah Akbas", "Suvrit Sra"], "abstract": "We give a short exposition of the recent proof of (Guo, Fang and Lu 2026a) on Komlós, wherein we present a proof based on a simple \"quadratic Dirichlet energy,'' which yields a (looser) discrepancy of $<3π$. We note in an appendix how upon using log-concavity one gets the (tighter) bound $C_0\\approx7.515$ ($< 3\\sqrt{2π}$ of(Guo, Fang and Lu 2026a)). (We also manage to substantially tighten algorithmic Komlós (Guo, Fang and Lu 2026b) , and report it in an appendix.)", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-23T00:10:35+00:00", "updated": "2026-09-23T00:10:35+00:00", "abs_url": "http://arxiv.org/abs/2609.27172v1", "pdf_url": "https://arxiv.org/pdf/2609.27172v1", "journal_ref": "", "doi": "", "comment": "Comments and feedback welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Komlós conjecture는 discrepancy theory 문제로, McMullen's problem(볼록 위치의 점 배치와 oriented matroid 관련)과는 직접적 연관이 없음.", "summary": "본 논문은 Komlós conjecture의 최근 증명(Guo, Fang and Lu 2026a)을 quadratic Dirichlet energy를 기반으로 재구성한 exposé이다. 저자들은 discrepancy bound <3π를 얻으며, log-concavity를 추가로 적용하면 C₀≈7.515의 더 타이트한 bound를 얻음을 보인다.", "technique": "Quadratic Dirichlet energy를 이용한 변분 방법과 log-concavity를 통한 discrepancy 상한 개선.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24653v1", "title": "Symmetric Quantum Latin Squares with Maximal Cardinality", "authors": ["Yiwen Zhang", "Haitao Cao"], "abstract": "In this paper, we prove that there exist a symmetric quantum Latin square with maximal cardinality of order $n$ for all $n\\geq 6$, and a symmetric idempotent quantum Latin square with maximal cardinality of order $4k+2$ for all $k\\geq 1$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T14:23:53+00:00", "updated": "2026-09-21T14:23:53+00:00", "abs_url": "http://arxiv.org/abs/2609.24653v1", "pdf_url": "https://arxiv.org/pdf/2609.24653v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Quantum Latin squares는 조합론적 구조이지만, McMullen's problem의 convex position, oriented matroid, realizability와는 직접적인 관계가 없음.", "summary": "본 논문은 모든 $n\\geq 6$에 대해 최대 cardinality를 갖는 symmetric quantum Latin square가 존재함을 증명하고, 모든 $k\\geq 1$에 대해 order $4k+2$인 symmetric idempotent quantum Latin square의 최대 cardinality 존재성을 보인다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.29957v1", "title": "Theta operators at $t=1$, Macdonald cumulants, and LLT positivity", "authors": ["Jim Haglund", "Vasu Tewari"], "abstract": "We study the Theta operators of D'Adderio-Iraci-Vanden Wyngaerd at $t=1$ and show that the power-sum-indexed operators $Θ_{\\mathsf p_k}|_{t=1}$ agree with a commuting family of derivations when restricted to symmetric functions of positive degree. Writing $\\widetilde{h}_a$ for the modified Macdonald function indexed by the single row $(a)$ we establish that $Θ_{\\mathsf p_μ}\\widetilde{h}_a|_{t=1}$ is, up to a normalization, the single-row Macdonald cumulant of Dolęga. We use these results to show that $Θ_{\\mathsf p_μ}\\widetilde{h}_a|_{t=1}$ and $Θ_{\\mathsf e_λ}\\widetilde{h}_a|_{t=1}$ are both sums of vertical-strip LLT polynomials indexed by certain plane trees. The former further shows that single-row Macdonald cumulants are LLT-positive, thereby yielding a stronger form of the higher-order Macdonald positivity conjecture of Dolęga when all shapes are single rows.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-24T15:14:07+00:00", "updated": "2026-09-24T15:14:07+00:00", "abs_url": "http://arxiv.org/abs/2609.29957v1", "pdf_url": "https://arxiv.org/pdf/2609.29957v1", "journal_ref": "", "doi": "", "comment": "27 pages, 7 figures, comments welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "논문은 Theta 연산자, Macdonald 함수, LLT 다항식 등 대칭함수론의 위치-기반 조합론을 다루나, McMullen's problem의 핵심인 convex position, general position 점 배치, oriented matroid, realizability 등과 직접 관련이 없음.", "summary": "본 논문은 D'Adderio-Iraci-Vanden Wyngaerd의 Theta 연산자를 $t=1$에서 연구하며, 멱급수 인덱싱 연산자들이 대칭함수의 양의 차수에서 교환 도함수족과 일치함을 보인다. 수정된 Macdonald 함수에 대한 Theta 연산자의 작용이 Dolęga의 단일행 Macdonald 누적량과 일치함을 확립하고, 이들이 특정 평면 트리로 인덱싱된 수직-스트립 LLT 다항식의 합임을 증명한다.", "technique": "Theta 연산자의 특화(specialization)를 통한 대칭함수 간의 관계식 도출 및 LLT 다항식 표현으로의 변환.", "connections": "추측: Macdonald 함수론의 양성(positivity) 현상과 조합 다항식(LLT) 표현이 결합하는 점은 oriented matroid의 기하학적 실현성 문제와 잠재적 깊은 연관이 있을 수 있음.", "keyword_hits": [], "source": "explore"}, {"id": "2609.23867v1", "title": "Optimal-diameter partitions into regions of the prescribed measure", "authors": ["Grigory Voinov"], "abstract": "In this paper we find a sufficient condition on an Ahlfors--David regular metric measure space under which it admits a partition into parts of prescribed measures and optimal (up to a constant) diameters. The proof uses the construction of dyadic cubes. The process is algorithmic: the pieces are cut out one by one via a filling procedure on the tree of dyadic cubes. We introduce the notion of spaces which admit a connected dyadic cube decomposition and prove that they admit a partition of the kind described above. We then develop several techniques to obtain such spaces and show some natural examples of this type.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-20T20:58:04+00:00", "updated": "2026-09-20T20:58:04+00:00", "abs_url": "http://arxiv.org/abs/2609.23867v1", "pdf_url": "https://arxiv.org/pdf/2609.23867v1", "journal_ref": "", "doi": "", "comment": "23 pages, 4 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Metric measure space의 분할 문제로, McMullen's problem의 점 배치·convex position과 직접 관련이 없음.", "summary": "Ahlfors-David regular metric measure space에서 처방된 측도를 가진 부분들로의 분할이 최적 직경을 가지도록 하는 충분조건을 제시한다. 동적 큐브 트리상의 filling procedure를 통해 알고리즘적으로 조각들을 순차적으로 추출하며, connected dyadic cube decomposition을 가진 공간의 특성화를 다룬다.", "technique": "Dyadic cube construction 및 tree 기반 filling procedure를 이용한 순차적 분할 알고리즘.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.30058v1", "title": "Facets of the X-ray polytope of doubly stochastic matrices", "authors": ["Prashant Chaudhary", "Kapil Khandelwal"], "abstract": "We study the polytope of anti-diagonal X-rays of k x k doubly stochastic matrices, the image of the Birkhoff polytope under the map that sums the entries along each anti-diagonal. Its facets other than the coordinate facets are the minimal joint tail bounds for lattice laws of a sum of two dependent uniform random variables. We give an exact facet criterion in terms of the allowed edges of a tight graph. For rays of the underlying tropical fan, total support of the tight graph suffices for a facet but is not necessary, as an example with k=19 shows. Up to affine functions and positive scaling, the potentials that define a facet form a polytope whose vertices are its rays. Facets propagate by padding and by grid refinement under explicit hypotheses. We give infinite families of facets from no step potential, facets of quadratic height, superpolynomially many facets, and a classification of three-step potentials. Total support of a step potential is characterized by a Hall-type condition on block starts; with computer assistance, total support decides facets of step potentials for k<=26. The facet counts up to k=12 are found directly for k<=3 and, for k>=4, come from an enumeration by a provably complete algorithm; an independent exact recomputation reproduces its ray lists for 5<=k<=12.", "categories": ["math.CO", "math.MG", "math.OC"], "primary_category": "math.CO", "published": "2026-10-21T17:18:07+00:00", "updated": "2026-10-21T17:18:07+00:00", "abs_url": "http://arxiv.org/abs/2610.30058v1", "pdf_url": "https://arxiv.org/pdf/2610.30058v1", "journal_ref": "", "doi": "", "comment": "36 pages, 4 tables; supplementary material (25 pages) as an ancillary file. Code and data: https://doi.org/10.5281/zenodo.23440726 (https://github.com/methodtrace/2026-doubly-stochastic-xray-facets). Companion paper: arXiv:2610.24197", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 이중확률행렬(Birkhoff polytope)의 X-ray polytope 면(facet) 구조를 연구하며, McMullen 문제·Larman 추측·oriented matroid 등 연구 문제와 직접적 관련이 없다.", "summary": "이 논문은 $k\\times k$ 이중확률행렬(doubly stochastic matrices)의 반대각선 X-ray polytope, 즉 Birkhoff polytope를 반대각선 합산 사상(anti-diagonal summation map)으로 투영한 다면체의 면(facet) 구조를 연구한다. 주요 결과로 tight graph의 허용 간선(allowed edges)을 이용한 정확한 facet 판별 기준을 제시하고, step potential로부터 무한히 많은 facet 족, 이차 높이(quadratic height)의 facet, 초다항식 개수의 facet 등을 구성한다. $k\\leq 12$에 대한 facet 수를 열거 알고리즘으로 완전히 계산하고 독립적으로 재검증하였다.", "technique": "tight graph의 total support 조건과 Hall형 조건을 이용한 facet 판별, step potential 분류, 컴퓨터 보조 열거 알고리즘.", "connections": "", "keyword_hits": ["tope", "tropical"], "source": "filter"}, {"id": "2610.29131v1", "title": "Small covers and the Four Color Theorem", "authors": ["Suyoung Choi", "Ringi Kim"], "abstract": "We give a combinatorial proof that every simple convex $3$-polytope admits a small cover without using the Four Color Theorem. We also prove that the assertion that every simple plane triangulation admits a mod~$2$ characteristic function with at most five values is equivalent to the Four Color Theorem.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-10-21T03:12:33+00:00", "updated": "2026-10-21T03:12:33+00:00", "abs_url": "http://arxiv.org/abs/2610.29131v1", "pdf_url": "https://arxiv.org/pdf/2610.29131v1", "journal_ref": "", "doi": "", "comment": "11 pages, 8 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Small cover, 사색정리, 3-다면체의 조합론적 구조를 다루며 McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 사색정리(Four Color Theorem)를 사용하지 않고 모든 단순 볼록 3-다면체가 small cover를 가짐을 조합론적으로 증명한다. 또한 모든 단순 평면 삼각분할이 최대 다섯 가지 값을 가지는 mod 2 특성함수(characteristic function)를 가진다는 주장이 사색정리와 동치임을 보인다.", "technique": "단순 볼록 3-다면체와 평면 삼각분할에 대한 조합론적 방법 및 mod 2 특성함수 분석.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2610.21533v1", "title": "On the Solution Sets of the Cone-Volume Map", "authors": ["Tom Baumbach", "Zhang Chen", "Martin Henk"], "abstract": "For a fixed set $U=(u_1,\\ldots,u_m)$ of outer unit normals, we consider the cone-volume map which associates to a vector of support numbers $b\\in\\mathbb R^m_{> 0}$ the cone-volume vector $γ\\in\\mathbb R^m$ of the polytope \\[ P(U,b)=\\{x\\in\\mathbb{R}^n:U^\\top x\\leq b\\}. \\]

<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#15161C; --muted:#71727F;
    --line:#E6E7EC; --accent:#4338CA; --accent-soft:#EEECFB;
    --explore:#0D9488; --explore-soft:#E3F4F1; --up:#15803D; --down:#B91C1C;
    --serif: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:880px;margin:0 auto;padding:16px 20px 12px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:var(--serif);font-weight:600;font-size:25px;margin:2px 0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .controls input[type=search]{flex:1 1 180px;min-width:150px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;color:inherit}
  .controls select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;color:inherit}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--surface);border:0;padding:8px 11px;cursor:pointer;border-left:1px solid var(--line);font:inherit}
  .seg button:first-child{border-left:0}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff}
  label.thr{font-size:13px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
  label.thr output{font-family:var(--mono);color:var(--ink);min-width:1.4em;text-align:right}
  .gear{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}
  .panel{max-width:880px;margin:0 auto;padding:0 20px;overflow:hidden;max-height:0;transition:max-height .2s}
  .panel.open{max-height:420px;padding-bottom:12px}
  .panel .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px}
  .panel input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;margin:4px 0 10px}
  .panel button{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font:inherit}
  .panel .hint{color:var(--muted);font-size:12px;margin-bottom:8px}
  .refresh-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font:inherit;font-size:14px;font-weight:500}
  .refresh-btn:disabled{opacity:.5;cursor:not-allowed}
  .refresh-btn .spin{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .refresh-btn.loading .spin{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  main{max-width:880px;margin:0 auto;padding:14px 20px 64px}
  .count{font-size:13px;color:var(--muted);margin:2px 0 14px;font-family:var(--mono)}
  .card{position:relative;display:grid;grid-template-columns:60px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 16px 0;margin-bottom:12px;overflow:hidden}
  .ledger{display:flex;flex-direction:column;align-items:center;padding-top:2px;position:relative}
  .ledger::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--edge,var(--line))}
  .score{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1;color:var(--edge,var(--muted))}
  .score small{display:block;font-size:9px;letter-spacing:.1em;color:var(--muted);margin-top:4px;font-weight:400}
  .body{min-width:0}
  .title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
  .tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--explore);background:var(--explore-soft);padding:2px 7px;border-radius:5px;margin-left:8px}
  .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .prob{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px}
  .meta .dot{margin:0 6px;opacity:.5}
  .reason{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:10px}
  .summary{margin:0 0 10px}
  .field{font-size:14px;margin:6px 0}
  .field b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:6px}
  .conn{background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:14px}
  .chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .actions{margin-top:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .act{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
  .act.on-fav{border-color:#D97706;background:#FEF3C7}
  .act.on-up{border-color:var(--up);background:#DCFCE7}
  .act.on-down{border-color:var(--down);background:#FEE2E2}
  .links{margin-left:auto;font-family:var(--mono);font-size:12px;display:flex;gap:14px;align-items:center}
  .links .id{color:var(--muted)}
  .togg{background:none;border:0;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;font-family:var(--mono);margin-top:8px}
  .abstract{margin-top:10px;font-size:13.5px;color:#3a3b47;border-top:1px dashed var(--line);padding-top:10px;display:none}
  .abstract.open{display:block}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .sync{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:560px){.card{grid-template-columns:44px 1fr;gap:10px;padding-right:14px}.title{font-size:17px}h1{font-size:21px}.links{margin-left:0;width:100%}}
  @media (prefers-reduced-motion:reduce){*{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="eyebrow">arXiv · 리서치 다이제스트</div>
    <h1>관련 논문</h1>
    <div class="sub">갱신 2026-10-24 02:51 · 총 436편 <span class="sync" id="sync"></span></div>
    <div class="controls">
      <button class="refresh-btn" id="refreshBtn">
        <span class="spin"></span>▶ 지금 업데이트
      </button>
      <input type="search" id="q" placeholder="제목·요약·초록 검색" aria-label="검색">
      <select id="sort" aria-label="정렬">
        <option value="fav">즐겨찾기 우선</option>
        <option value="rel">관련도순</option>
        <option value="date">최신순</option>
      </select>
      <select id="prob" aria-label="문제 필터"><option value="">전체 문제</option></select>
      <label class="thr">관련도 ≥ <input type="range" id="thr" min="0" max="10" value="0"><output id="thrv">0</output></label>
      <span class="seg" role="group">
        <button id="fAll" aria-pressed="true">전체</button>
        <button id="fFav" aria-pressed="false">⭐만</button>
        <button id="fExp" aria-pressed="false">탐색만</button>
      </span>
      <span class="seg" role="group"><button id="hideDown" aria-pressed="false">👎 숨기기</button></span>
      <button class="gear" id="gear" title="동기화 설정">⚙</button>
    </div>
  </div>
  <div class="panel" id="panel"><div style="max-width:880px;margin:0 auto"><div class="box">
    <b>GitHub 연동 설정</b>
    <div class="hint">
      토큰 권한: <b>Contents</b>(읽기·쓰기) + <b>Actions</b>(읽기·쓰기) — 두 권한이 있어야
      즐겨찾기·평가 동기화와 수동 업데이트 버튼이 모두 작동합니다.<br>
      fine-grained Personal Access Token 권장. 토큰은 이 기기 브라우저에만 저장됩니다.
    </div>
    <input id="ghRepo" placeholder="owner/repo (예: choihs/research-agent) — 비우면 URL 에서 자동 감지">
    <input id="ghToken" type="password" placeholder="github_pat_... (이 기기에만 저장)">
    <button id="ghSave">저장</button> <span class="sync" id="ghStatus"></span>
  </div></div></div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>

<script>
const DATA = [{"id": "2606.19573v1", "title": "Embracing exchange sequences and oriented matroid polyhedron diameter", "authors": ["Kolja Knauer", "Luis Pedro Montejano"], "abstract": "We reduce the embracing exchange distance of bases of oriented matroids to the metric of oriented matroid polyhedra. This allows us to disprove recent conjectures of Caoduro, Khodamoradi, Paat, and Shepherd and of Bérczi and Nádor. On the other hand, we show that any two embracing bases of an oriented matroid of rank $r$ can be transformed into each other in at most $2r^{\\log_2(r)+3}$ steps and in at most $r$ steps in a Lawrence oriented matroid, thus confirming the conjecture in this case.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-06-17T20:18:48+00:00", "updated": "2026-06-17T20:18:48+00:00", "abs_url": "http://arxiv.org/abs/2606.19573v1", "pdf_url": "https://arxiv.org/pdf/2606.19573v1", "journal_ref": "", "doi": "", "comment": "10 pages, 1 figure", "relevance": 5, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Lawrence oriented matroid와 oriented matroid의 기저 변환 문제를 다루며, McMullen 문제와 관련된 Lawrence oriented matroid 구조를 직접 언급하고 있어 부분적 관련성이 있다.", "summary": "이 논문은 oriented matroid의 기저들의 embracing exchange distance를 oriented matroid polyhedra의 metric으로 환원하여, Caoduro 등과 Bérczi-Nádor의 최근 추측들을 반례로 논박한다. 한편, rank $r$의 oriented matroid에서 임의의 두 embracing base는 최대 $2r^{\\log_2(r)+3}$ 단계로 변환 가능함을 보이고, Lawrence oriented matroid의 경우 최대 $r$ 단계로 변환 가능함을 증명하여 해당 경우의 추측을 확인한다.", "technique": "Embracing exchange distance를 oriented matroid polyhedra의 직경(diameter) 문제로 환원하는 것이 핵심 기법이다.", "connections": "Lawrence oriented matroid에서의 $r$ 단계 변환 결과는 McMullen 문제와 관련된 Lawrence oriented matroid 구조에 직접 적용 가능하다.", "keyword_hits": [], "source": "seed"}, {"id": "2609.15850v1", "title": "Neither simpliciality nor mutation connectivity: conjectures of Las Vergnas and Cordovil-Las Vergnas fail", "authors": ["Qiyuan Gu", "Kolja Knauer"], "abstract": "We construct a simple rank-$7$ oriented matroid on $24$ elements with no simplicial tope, disproving the Las Vergnas simplex conjecture from 1980. We then show that the mutation graph on uniform oriented matroids is disconnected for infinitely many values of rank $r$ and ground-set size $n$, disproving the Cordovil--Las Vergnas conjecture from 1988.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-09-14T16:43:39+00:00", "updated": "2026-09-14T16:43:39+00:00", "abs_url": "http://arxiv.org/abs/2609.15850v1", "pdf_url": "https://arxiv.org/pdf/2609.15850v1", "journal_ref": "", "doi": "", "comment": "9 pages", "relevance": 4, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Oriented matroid의 구조(tope, mutation graph)를 다루어 McMullen 문제와 같은 oriented matroid 프레임워크를 공유하지만, 연구 대상이 Las Vergnas 추측과 Cordovil–Las Vergnas 추측의 반례 구성으로 McMullen 문제(f(5)=11, acyclic reorientation 등)와는 직접적 관련이 없다.", "summary": "이 논문은 rank-$7$, 24원소 위의 simplicial tope가 없는 단순 oriented matroid를 구성하여 1980년 Las Vergnas의 simplex 추측을 반증한다. 또한 uniform oriented matroids의 mutation graph가 무한히 많은 $(r, n)$ 값에서 비연결임을 보여, 1988년 Cordovil–Las Vergnas 추측도 반증한다.", "technique": "반례(counterexample) 구성: rank-7, 24원소의 단순 oriented matroid를 명시적으로 작성하여 두 추측을 동시에 반증.", "connections": "추측: McMullen 문제에서 활용되는 oriented matroid의 tope graph 및 chirotope 개념과 관련 구조를 공유하나, 직접적 연결은 초록만으로는 불확실.", "keyword_hits": ["oriented matroid", "tope"], "source": "filter"}, {"id": "2608.09829v1", "title": "Blocking codimension-one simplices on the moment curve", "authors": ["Pablo Soberón"], "abstract": "We study $b_d(n)$, the minimum number of points needed to meet the relative interior of every $(d-1)$-simplex spanned by an $n$-point set in general position in $\\mathbb{R}^d$. In the plane, this is the parameter from the Blocking Conjecture. We improve the best known general planar lower bound to $   b_2(n)\\ge \\frac{41}{13}n-O\\left(\\frac{n}{\\log n}\\right)$. For $n$ points on the moment curve in even dimension $2r$, we prove that at least $\\frac{1}{r!}n^r\\log n-O_r(n^r)$ points are needed to pierce the relative interior of all its codimension-one simplices, which exceeds the number of codimension-one faces in a triangulation by a $\\log n$ factor. For equally spaced points on the moment curve in odd dimensions, we construct an optimal blocking set whose size equals the maximum number of codimension-one faces in a triangulation.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-10T16:47:49+00:00", "updated": "2026-08-10T16:47:49+00:00", "abs_url": "http://arxiv.org/abs/2608.09829v1", "pdf_url": "https://arxiv.org/pdf/2608.09829v1", "journal_ref": "", "doi": "", "comment": "12 pages, 1 figure", "relevance": 3, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "moment curve 위의 점 배치와 삼각분할(triangulation)을 다루지만, McMullen 문제(f(5)=11, oriented matroid의 acyclic reorientation 등)와는 직접적 연관이 없고 blocking/piercing 문제에 초점을 둔다.", "summary": "$b_d(n)$은 $\\mathbb{R}^d$의 일반위치 $n$점이 이루는 모든 $(d-1)$-심플렉스의 상대 내부를 만나는 데 필요한 최소 점의 수로 정의된다. 평면에서는 기존 최선의 하한을 $b_2(n)\\ge \\frac{41}{13}n - O\\!\\left(\\frac{n}{\\log n}\\right)$으로 개선하였다. 짝수 차원 $2r$의 moment curve 위 $n$점에 대해서는 $\\frac{1}{r!}n^r \\log n - O_r(n^r)$개 이상의 점이 필요함을 증명하였고, 홀수 차원의 등간격 점에 대해서는 크기가 삼각분할의 최대 여차원-1 면의 수와 일치하는 최적 blocking set을 구성하였다.", "technique": "평면 하한 개선에는 조합론적 카운팅 논증을, moment curve의 짝수 차원 하한에는 삼각분할과 로그 인수 초과 분석을, 홀수 차원에서는 명시적 최적 blocking set 구성을 활용한다.", "connections": "추측: moment curve 위 점 배치 및 삼각분할 구조는 McMullen 문제에서 사용되는 cyclic polytope·chirotope 분석과 간접적으로 연관될 수 있으나, 초록에는 해당 연결이 명시되지 않는다.", "keyword_hits": ["general position", "triangulation"], "source": "filter"}, {"id": "2610.23553v1", "title": "Visibility Sets, Empty Pentagons, and Sufficient Conditions for Hexagons", "authors": ["Carlos M. Nicolas"], "abstract": "Given a set $S$ of $n$ points in general position in the plane, we define the $C$-set $C(p,q)$ of an oriented edge $(p,q)$ as the set of extreme points of the visibility set $V(p,q)$ facing $(p,q)$. Since every point of $V(p,q)$ that is not in $C(p,q)$ gives rise to an empty convex pentagon having $(p,q)$ as a boundary edge, it is natural to study the properties of $C$-sets in order to bound the number of empty convex pentagons of $S$.   We prove tight bounds on the intersection size and union complexity of $C$-sets sharing an endpoint. We also consider the problem of bounding the number of empty pentagons and hexagons in terms of the number of interior and boundary points of $S$. While the hexagon bound is weak, it offers a potential step toward a superlinear lower bound. On the other hand, the two-parameter bound for pentagons, combined with the structural results on $C$-sets, yields a simple proof of an $Ω(n^{3/2})$ bound for the number of pentagons. While this is a significant improvement over previously published bounds, a recent preprint \\cite{Astudillo2026} attains a better bound using completely different methods. Thus, the primary contribution of this paper lies in the structural results about $C$-sets and the two-parameter bounds for empty pentagons and hexagons.", "categories": ["math.CO", "cs.CG"], "primary_category": "math.CO", "published": "2026-10-16T14:42:47+00:00", "updated": "2026-10-16T14:42:47+00:00", "abs_url": "http://arxiv.org/abs/2610.23553v1", "pdf_url": "https://arxiv.org/pdf/2610.23553v1", "journal_ref": "", "doi": "", "comment": "21 pages, 12 figures", "relevance": 3, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "공집합 볼록 오각형·육각형의 구조적 분석은 일반 위치 점 배치와 볼록 위치 관련 조합론을 다루지만, McMullen 문제(d=5, f(5)=11)나 oriented matroid의 acyclic reorientation과는 직접적 연관이 없다.", "summary": "평면의 일반 위치 점 집합 $S$에서 방향 간선 $(p,q)$의 가시 집합(visibility set) $V(p,q)$의 극점들로 이루어진 $C$-집합을 정의하고, $C$-집합의 교집합 크기 및 합집합 복잡도에 대한 tight한 경계를 증명한다. 이를 이용하여 공집합 볼록 오각형의 수에 대한 $\\Omega(n^{3/2})$ 하한을 단순하게 도출하며, 공집합 볼록 육각형의 수에 대한 interior·boundary 점 수 기반의 2-매개변수 경계도 제시한다.", "technique": "$C$-집합의 교집합·합집합 복잡도 분석과 2-매개변수(interior/boundary 점) 경계 기법을 결합하여 공집합 오각형·육각형 수의 하한을 도출한다.", "connections": "추측: 공집합 볼록 다각형의 구조 분석은 oriented matroid의 chirotope 및 점 배치의 조합적 유형 분류와 간접적으로 연결될 수 있으나, 초록에는 그러한 연결이 명시되지 않는다.", "keyword_hits": ["general position"], "source": "filter"}, {"id": "2606.24339v1", "title": "Toward a classification of tropical complete intersection number one", "authors": ["Linxuan Li"], "abstract": "By bridging two classification results -- the Esterov--Gusev classification of tuples of lattice polytopes of mixed volume one, and Fink's characterization of Bergman fans -- we formulate a classification conjecture describing when the stable intersection of a tropical fan F with the tropicalization Trop(X) of a subvariety of T^n is a reduced point. Our main results establish this conjecture in three fundamental cases -- unmixed sequences, hypersurface complete-intersection cycles, and tropical 2-cycles -- and develop several tools intended for the general case.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-23T09:25:12+00:00", "updated": "2026-06-23T09:25:12+00:00", "abs_url": "http://arxiv.org/abs/2606.24339v1", "pdf_url": "https://arxiv.org/pdf/2606.24339v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "열대기하학(tropical geometry)을 도구로 활용한다는 점에서 McMullen 문제의 접근 도구 중 하나인 tropical geometry와 표면적으로 연관되나, 본 논문의 핵심 주제는 열대 완전 교차(tropical complete intersection)의 분류로 McMullen 문제 또는 Larman 추측과 직접적 관련이 없다.", "summary": "본 논문은 격자 다면체(lattice polytope) 튜플의 mixed volume 1에 대한 Esterov–Gusev 분류와 Bergman fan에 대한 Fink의 특성화를 연결하여, 열대 팬(tropical fan) $F$와 대수적 부분다양체의 열대화 $\\mathrm{Trop}(X)$의 안정 교차(stable intersection)가 축약점(reduced point)이 되는 조건을 기술하는 분류 추측을 제시한다. 주요 결과로 unmixed sequence, 초곡면 완전 교차 사이클(hypersurface complete-intersection cycle), 열대 2-사이클(tropical 2-cycle)의 세 가지 기본 경우에서 이 추측을 증명한다.", "technique": "Esterov–Gusev의 mixed volume 1 분류와 Fink의 Bergman fan 특성화를 연결하여 열대 완전 교차 수(tropical complete intersection number)가 1인 경우를 분류하는 방법론을 개발한다.", "connections": "", "keyword_hits": ["tope", "tropical"], "source": "filter"}, {"id": "2607.26900v1", "title": "Lehmer Codes and the Reverse-Complement Mapping from (32-1)-Avoiding Permutations to (3-21)-Avoiding Permutations", "authors": ["Andrew Beveridge", "Yufan Hu", "Yucheng Liu"], "abstract": "Let $S_n(32\\text{-}1)$ and $S_n(3\\text{-}21)$ denote the sets of $n$-permutations avoiding the vincular patterns $32\\text{-}1$ and $3\\text{-}21$, respectively. Using Lehmer codes, we realize these families as weighted posets $L_n(32\\text{-}1)$ and $L_n(3\\text{-}21)$, where the weight of a code is the inversion number of its permutation. We show that the maximal elements of each of these posets, $\\operatorname{Max} L_n(32\\text{-}1)$ and $\\operatorname{Max} L_n(3\\text{-}21)$, are enumerated by the Fibonacci numbers. We demonstrate that the classical reverse-complement map on permutations restricts to a natural bijection between these two sets of maximal elements, revealing a deep symmetry between their underlying poset structures.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-29T13:33:01+00:00", "updated": "2026-07-29T13:33:01+00:00", "abs_url": "http://arxiv.org/abs/2607.26900v1", "pdf_url": "https://arxiv.org/pdf/2607.26900v1", "journal_ref": "", "doi": "", "comment": "23 pages, 5 figures", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Vincular pattern avoidance와 permutation 구조 연구이나, McMullen's problem의 convex position, oriented matroid, chirotope 등과는 직접적 관련이 없음.", "summary": "Lehmer codes를 이용하여 vincular pattern $32\\text{-}1$과 $3\\text{-}21$을 피하는 순열들을 가중 부분순서집합으로 실현하고, 각 poset의 극대 원소들이 Fibonacci 수로 열거됨을 보임. 역-여집합 맵(reverse-complement map)이 두 극대 원소 집합 사이의 자연 전단사임을 증명하여 기저 poset 구조 간의 대칭성 드러냄.", "technique": "Lehmer codes를 통한 순열의 poset 표현과 inversion number 가중, reverse-complement 맵의 제한을 통한 bijection 구성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2607.27041v1", "title": "Tight Stability Estimates Near the Simplex and Improved Bounds for the Diameter of the Banach-Mazur Compactum in Fixed Dimensions", "authors": ["René Brandenberg", "Bernardo González Merino", "Florian Grundbacher"], "abstract": "We establish a tight stability estimate for the Minkowski asymmetry near its maximal value, improving previously known estimates due to Böröczky, Guo, and Schneider. More precisely, if an $n$-dimensional convex body $K$ has Minkowski asymmetry $s(K) \\geq n-\\varepsilon$ for $\\varepsilon \\in [0,1)$, then its Banach-Mazur distance to the $n$-simplex is at most \\[ 1 + \\varepsilon + \\frac{\\varepsilon^2}{2(1-\\varepsilon)}. \\] This dimension-independent estimate is best possible up to the linear order in $\\varepsilon$. As an application, we prove a stability result for the maximal Banach-Mazur distance to the Euclidean ball, improving a previous estimate of Kobos to the optimal linear order: if $K$ is at Banach-Mazur distance at least $n - \\varepsilon$ to the ball for $\\varepsilon \\in [0,\\frac{1}{2})$, then its Banach-Mazur distance to the $n$-simplex is at most \\[ 1 + 2\\varepsilon + \\frac{2\\varepsilon^2}{1-2\\varepsilon}. \\] A key ingredient is a positive answer to a conjecture by Belloni and Freund, showing that every convex body $K$ contains a translated copy of its volume-minimal circumscribed ellipsoid scaled by a factor $1/\\sqrt{n s(K)}$. Finally, we apply the stability estimate for the Minkowski asymmetry to obtain improved upper bounds for the diameter of the Banach-Mazur compactum in fixed dimensions.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-07-29T15:33:50+00:00", "updated": "2026-07-29T15:33:50+00:00", "abs_url": "http://arxiv.org/abs/2607.27041v1", "pdf_url": "https://arxiv.org/pdf/2607.27041v1", "journal_ref": "", "doi": "", "comment": "20 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "볼록 기하학(convex geometry)의 고전적 문제이나, McMullen's problem의 핵심인 점 배치(point configuration), oriented matroid, 조합 구조와는 직접적 관련이 없고 Minkowski asymmetry와 Banach-Mazur distance라는 별개의 메트릭 문제에 집중.", "summary": "본 논문은 단체(simplex) 근처에서 Minkowski asymmetry의 긴밀한 안정성 추정을 확립하고, 이를 이용해 Banach-Mazur compactum의 지름에 대한 개선된 상한을 유도한다. 핵심 결과는 $s(K) \\geq n-\\varepsilon$일 때 Banach-Mazur 거리가 $1 + \\varepsilon + \\frac{\\varepsilon^2}{2(1-\\varepsilon)}$로 제한됨을 보이며, 이는 선형 차수까지 최적이다.", "technique": "Belloni-Freund 추측의 긍정적 해결을 통해 부피-최소 외접 타원체(volume-minimal circumscribed ellipsoid)의 축소 복사본을 포함하는 볼록체의 존재를 증명하는 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.07969v1", "title": "Topology of medial regime random simplicial complexes", "authors": ["Jonathan Ariel Barmak", "Michael Farber"], "abstract": "We analyse topology of random simplicial complexes in the medial regime. We show that these complexes are highly connected and have homotopy type of iterated suspensions. One of our main tools is a new combinatorial criterion for high connectivity of simplicial complexes, which is more flexible than conicity. We show that topological complexity of random simplical complexes in the medial regime is bounded above by 2 and it equals 2 for a class of homogenous medial regime random simplicial complexes, a.a.s.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-08-08T07:06:06+00:00", "updated": "2026-08-08T07:06:06+00:00", "abs_url": "http://arxiv.org/abs/2608.07969v1", "pdf_url": "https://arxiv.org/pdf/2608.07969v1", "journal_ref": "", "doi": "", "comment": "18 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Random simplicial complexes의 위상적 성질을 다루지만, McMullen's problem (convex position 점 배치, oriented matroid, 고차원 convex polytope의 face lattice)과의 직접적 관련성은 약함.", "summary": "이 논문은 medial regime의 random simplicial complexes의 위상을 분석하며, 이들이 높은 연결성을 가지고 반복된 suspension의 homotopy type을 가짐을 보인다. 주요 결과는 topological complexity가 거의 틀림없이 2 이상 2 이하로 제한된다는 것이다.", "technique": "Random simplicial complexes의 고연결성을 위한 새로운 조합론적 판정법(conicity보다 유연함)과 위상적 복잡도(topological complexity) 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.14909v1", "title": "On the Log-submodularity for zonoids: from Mixed Volume inequalities to the Hypercube", "authors": ["Gennadiy Averkov", "Katherina von Dichter", "Ivan Soprunov"], "abstract": "We prove a log-submodularity-type inequality for zonoids in $\\mathbb{R}^4$, extending the three-dimensional result of Fradelizi, Madiman, Meyer, and Zvavitch. More generally, we conjecture a log-submodularity-type inequality for zonoids in arbitrary dimension. This inequality admits several equivalent formulations in terms of volumes of coordinate projections as well as in terms of mixed volumes, thereby unifying several geometric perspectives. We reduce the conjectured inequality to a polynomial inequality whose variables are associated with the vertices of a hypercube and whose coefficients encode the volumes of 0/1 simplices. This reduction reveals unexpected connections between mixed volumes of zonoids, matroid theory, and real algebraic geometry.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-08-14T21:47:15+00:00", "updated": "2026-08-14T21:47:15+00:00", "abs_url": "http://arxiv.org/abs/2608.14909v1", "pdf_url": "https://arxiv.org/pdf/2608.14909v1", "journal_ref": "", "doi": "", "comment": "24 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Matroid theory와 combinatorial geometry를 언급하지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid의 acyclic reorientation, tope graph 등과 직접적인 연결이 없음.", "summary": "본 논문은 4차원 zonoid들의 로그-준가법성(log-submodularity) 부등식을 증명하고, 임의의 차원으로의 일반화를 추측한다. 이 부등식은 좌표 사영의 부피와 혼합 부피(mixed volume)로 표현되며, 초록체의 꼭짓점에 관련된 다항식 부등식으로 축약된다.", "technique": "혼합 부피(mixed volume) 이론과 다항식 부등식의 축약(reduction)을 통해 zonoid의 기하학적 성질을 대수적으로 인코딩.", "connections": "추측: matroid theory와의 연결이 언급되지만, 초록에서 구체적인 matroid 구조(oriented matroid, chirotope, acyclic reorientation 등)의 역할은 명확하지 않음.", "keyword_hits": [], "source": "explore"}, {"id": "2608.19844v1", "title": "Circles determined by planar point sets", "authors": ["Liyan Wang"], "abstract": "For $n\\geq 4$, let $c(n)$ be the minimum number of distinct circles containing at least three points of an $n$-point set in the Euclidean plane, where the set is neither collinear nor concyclic. Put[F(n)=1+\\binom{n-1}{2}-\\left\\lfloor\\frac{n-1}{2}\\right\\rfloor.]We determine $c(n)$ for every $n\\geq 4$: it equals $F(n)$ apart from three exceptional orders. We also solve the variant in which no three points are collinear; that variant has a single exceptional order. The proofs and exact finite verifications were developed through a collaboration between human researchers and artificial-intelligence systems.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-20T09:46:02+00:00", "updated": "2026-08-20T09:46:02+00:00", "abs_url": "http://arxiv.org/abs/2608.19844v1", "pdf_url": "https://arxiv.org/pdf/2608.19844v1", "journal_ref": "", "doi": "", "comment": "27 pages, 5 figures; ancillary files contain exact verification code and Lean 4 formalizations", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "평면 점 집합의 원의 개수를 세는 문제로, McMullen's problem과 직접 관련이 없는 별개의 조합 기하 문제.", "summary": "n개 점의 평면 집합이 일직선·일원선이 아닐 때, 최소 3개 점을 포함하는 서로 다른 원의 최소 개수 c(n)을 결정한다. 저자는 명시적 공식 F(n)=1+⌊(n-1 choose 2)⌋-⌊(n-1)/2⌋를 제시하고 몇 가지 예외 경우를 확인하였다.", "technique": "초록에 명시된 기법 없음; 인간과 AI 협력을 통한 증명 및 유한 검증", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18225v1", "title": "On the enumeration of polymatroids", "authors": ["Seonghyuk Im", "Donggyu Kim"], "abstract": "Let $p_k(n)$ be the number of $k$-polymatroids on $[n]$. We show that for every fixed $k \\geq 1$, we have   \\[   \\left\\lfloor \\frac{k}{2} \\right\\rfloor \\cdot \\binom{n}{\\lfloor n/2 \\rfloor} \\cdot (1+o(1)) \\le \\log_2 p_k(n) \\le k \\cdot \\binom{n}{\\lfloor n/2 \\rfloor} \\cdot (1+o(1)).   \\]   We also show that for $k \\geq 2$, almost all $k$-polymatroids are (i) connected, (ii) proper, and (iii) not linearly representable over any field.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T18:11:25+00:00", "updated": "2026-08-18T18:11:25+00:00", "abs_url": "http://arxiv.org/abs/2608.18225v1", "pdf_url": "https://arxiv.org/pdf/2608.18225v1", "journal_ref": "", "doi": "", "comment": "11 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Polymatroids는 조합기하의 중요한 구조이지만, McMullen's problem(일반위치 점 배치와 oriented matroid의 chirotope/realizability)과 직접적 관계 없음.", "summary": "임의의 고정된 k에 대해 [n] 위의 k-polymatroids 개수 $p_k(n)$의 로그에 대한 점근 경계를 제시하고, k≥2일 때 거의 모든 k-polymatroids가 연결, 고유(proper), 그리고 어떤 체 위에서도 선형 표현 불가능함을 보임.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.20606v1", "title": "Ptolemaic negative type and the values q(6) and q(7)", "authors": ["Eren Ercan"], "abstract": "Baker, Huh, Kummer, and Lorscheid define the triangular-hyperfield threshold q(n)=q(U_{2,n}) and conjecture exact values for all n. Using their identity q(n)=P(n-1), where P(m) is the universal negative-type exponent of m-point Ptolemaic metrics, we prove q(6)=\\log_2(9/4) and q(7)=1. For five points, we separate zero-sum coefficient vectors by sign pattern. A sharp two-summand inequality proves the inequality for the 1+4 pattern. For the 2+3 pattern, a sharp four-point partial-correlation bound and an exact copositivity identity prove the required inequality. For six points, we construct an involutive coefficient transport under metric inversion that preserves the negative-type quadratic form. Applying the transport at an index with positive local contribution converts a hypothetical 3+3 counterexample into a 2+4 counterexample. Complete split graph metrics attain both bounds.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-20T23:05:38+00:00", "updated": "2026-08-20T23:05:38+00:00", "abs_url": "http://arxiv.org/abs/2608.20606v1", "pdf_url": "https://arxiv.org/pdf/2608.20606v1", "journal_ref": "", "doi": "", "comment": "27 pages; exact rational Bernstein certificate supplied as ancillary files", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Ptolemaic metrics와 negative-type exponents는 metric geometry 문제이며, McMullen's problem은 convex position과 point configuration에 관한 조합론 문제로 직접적인 수학적 연결이 불명확함.", "summary": "본 논문은 triangular-hyperfield threshold q(n)을 Ptolemaic metrics의 universal negative-type exponent P(m)과 연결하여 q(6)=log_2(9/4), q(7)=1을 증명한다. 5점과 6점에서 zero-sum coefficient vectors를 부호 패턴으로 분리하고, 메트릭 반전 하에서 음수-타입 이차형식을 보존하는 involutive coefficient transport를 구성한다.", "technique": "Sign pattern 분리, sharp partial-correlation bound, copositivity identity, metric inversion에 의한 involutive coefficient transport.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18542v1", "title": "Any $k$-graph with zero $\\ell$-degree Turán density is layered", "authors": ["Jiabao Yang", "Xiaona Fang", "Yaojun Chen"], "abstract": "The codegree Turán density $π_{\\mathrm{co}}(F)$ is the supremum over all $γ\\in [0,1)$ such that, for arbitrarily large $n$, there exists an $n$-vertex $F$-free $k$-graph $H$ whose every $(k-1)$-subset of vertices lies in at least $γn$ edges. Ding, Lamaison, Liu, Wang, and Yang (JLMS, 2025) studied the problem of what 3-graphs $F$ satisfy $π_{\\mathrm{co}}(F) = 0$. They introduced layered $3$-graphs and conjectured that a $3$-graph has zero codegree Turán density if and only if it is layered and has zero uniform Turán density. For $k\\ge 3$, a $k$-graph is called layered if its vertices can be labelled so that every edge has a unique maximum label and two edges with the same maximum label have the same label multiset. In this paper, we show that every non-layered $k$-graph $F$ on $m$ vertices satisfies \\[   π_{\\mathrm{co}}(F)\\ge q_{k,m}^{-q_{k,m}}>0,   \\quad \\text{where}\\quad   q_{k,m}=\\frac{(k-1)^{m+1}-1}{k-2}, \\] which implies any $k$-graph with zero $\\ell$-degree Turán density is layered, and the case $k=3$ confirms the conjecture of Ding, Lamaison, Liu, Wang, and Yang.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T04:59:49+00:00", "updated": "2026-08-19T04:59:49+00:00", "abs_url": "http://arxiv.org/abs/2608.18542v1", "pdf_url": "https://arxiv.org/pdf/2608.18542v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "초록에서 명시된 연구 대상은 codegree Turán density와 layered k-graphs이며, McMullen's problem(d=5)의 핵심인 convex position, general position, oriented matroid, 실현가능성(realizability)과는 직접적 관련이 없음.", "summary": "본 논문은 $k$-그래프의 codegree Turán density가 0이 되는 필요충분조건을 규명한다. 모든 non-layered $k$-그래프 $F$에 대해 $\\pi_{\\mathrm{co}}(F) \\ge q_{k,m}^{-q_{k,m}} > 0$임을 보여, codegree Turán density가 0이려면 layered여야 한다는 것을 증명한다. 이는 Ding 등의 3-그래프 추측을 일반화한 결과이다.", "technique": "Extremal hypergraph theory의 codegree 방법론과 layered structure의 특성화를 통한 lower bound 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.20553v1", "title": "Four-Entropic Matroids Are Quaternary", "authors": ["Mohammad Hossein Kalantari", "Shahram Khazaei"], "abstract": "A matroid is $4$-entropic if its rank function, multiplied by $\\log 4$, is the joint-entropy function of random variables on a four-element alphabet. We prove that a matroid is $4$-entropic if and only if it is representable over $\\mathbb{F}_4$. The proof combines minor closure and the excluded-minor characterization of quaternary matroids with structural properties of quasigroups of order four. Thus arbitrary four-symbol partition representations yield no matroids beyond the quaternary ones. As an application, every access structure admitting an ideal perfect scheme with a uniform four-symbol secret and four-symbol active shares also admits an ideal $\\mathbb{F}_4$-linear scheme.", "categories": ["math.CO", "cs.IT"], "primary_category": "math.CO", "published": "2026-08-20T20:32:59+00:00", "updated": "2026-08-20T20:32:59+00:00", "abs_url": "http://arxiv.org/abs/2608.20553v1", "pdf_url": "https://arxiv.org/pdf/2608.20553v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Matroid representability와 특성화를 다루지만, McMullen's problem의 convex position 점 배치, oriented matroid, tope graph 등 구체적 기하 문제와 직접 관련이 없음.", "summary": "4-entropic matroid(4원 알파벳에서의 결합 엔트로피 함수로 정의)가 $\\mathbb{F}_4$ 위의 quaternary matroid와 정확히 일치함을 증명. 부분 폐포(minor closure)와 제외된 부분의 특성화, 4차 quasi-group 구조를 결합하여 증명.", "technique": "Excluded-minor characterization of quaternary matroids combined with quasigroup structural properties.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.23529v1", "title": "Infinite rational distance sets in affine general position: constructions in every dimension", "authors": ["Junkai Qiu"], "abstract": "For every integer $d\\geq 1$, we construct a countably infinite set $X_d\\subset\\mathbb{R}^d$ in affine general position, with all pairwise distances rational. When $d$ is odd, $X_d$ may also be chosen so that no $d+2$ points lie on a common sphere. The construction is uniform in $d$: positive Chebyshev square decompositions produce harmonic curves on spheres whose points corresponding to rational parameter values have pairwise rational distances. A divided-difference factorization of the affine determinant shows that sufficiently short arcs are locally convex, and stereographic projection produces the odd-dimensional examples. We also construct infinite rational distance sets in $\\mathbb{Q}^d$ in affine general position for every even $d$, and in general position for every $d\\equiv 1\\pmod 4$. For every $d\\geq 1$ and $n\\geq d+1$, taking and rescaling suitable finite subsets gives $n$-point integral point sets in affine general position. A suitable ordered choice yields integral-distance realizations of all cyclic polytopes. In dimension three, we give an explicit rational parametrization and obtain infinitely many pairwise non-similar primitive $n_3$-clusters for every $n\\geq 4$.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-08-24T17:31:12+00:00", "updated": "2026-08-24T17:31:12+00:00", "abs_url": "http://arxiv.org/abs/2608.23529v1", "pdf_url": "https://arxiv.org/pdf/2608.23529v1", "journal_ref": "", "doi": "", "comment": "27 pages; a 7-page computational supplement and exact verification code are included as ancillary files", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "affine general position 개념을 공유하지만, 이 논문은 유리수 거리 집합(rational distance sets) 구성에 관한 것으로 McMullen 문제(d=5에서의 oriented matroid·acyclic reorientation)와 직접적 관련은 없음.", "summary": "모든 정수 $d\\geq 1$에 대해 $\\mathbb{R}^d$ 안에 아핀 일반 위치(affine general position)에 있고 쌍별 거리가 모두 유리수인 가산 무한 집합 $X_d$를 구성한다. $d$가 홀수인 경우 $d+2$개의 점이 공통 구면 위에 놓이지 않도록 선택할 수 있으며, 구성은 Chebyshev 제곱 분해와 조화 곡선(harmonic curves) 및 입체사영(stereographic projection)을 활용한다. 부가적으로 모든 짝수 $d$에 대해 $\\mathbb{Q}^d$ 내의 무한 유리 거리 집합, 모든 순환 다면체(cyclic polytope)의 정수 거리 실현, 그리고 3차원에서 무한히 많은 비유사(non-similar) 원시 $n_3$-클러스터를 구성한다.", "technique": "양의 Chebyshev 제곱 분해(positive Chebyshev square decompositions)로 구 위의 조화 곡선을 생성하고, 아핀 행렬식의 분할 차분 인수분해(divided-difference factorization)로 국소 볼록성을 증명한 뒤 입체사영으로 홀수 차원 예시를 얻는다.", "connections": "추측: affine general position 개념이 McMullen 문제의 점 배치 조건과 용어를 공유하나, 지향 매트로이드나 실현 가능성 문제와의 직접 연결은 초록만으로는 불확실.", "keyword_hits": ["general position", "tope"], "source": "filter"}, {"id": "2608.20064v1", "title": "Classification of Deza graphs from anisotropic association schemes of quadrics", "authors": ["Valentino Smaldore"], "abstract": "Let $Q^\\varepsilon(3,q)$, where $\\varepsilon\\in\\{+,-\\}$ and $q>3$ is odd, be a non-degenerate hyperbolic or elliptic quadric of $PG(3,q)$. Fix one of the two quadratic classes of anisotropic points. Since the line joining two distinct points of this class is tangent, secant, or external to the quadric, one obtains a $3$-class association scheme. We classify all non-trivial unions of its relations which define Deza graphs. In addition to the previously known tangency family, exactly four exceptional strictly Deza graphs occur, with parameters $(360,135,54,45)$, $(369,108,36,27)$, $(65,34,18,15)$ and $(168,111,75,70)$. We determine their spectra and Deza children and give geometric or group-theoretic descriptions of all four exceptional graphs.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-20T13:59:52+00:00", "updated": "2026-08-20T13:59:52+00:00", "abs_url": "http://arxiv.org/abs/2608.20064v1", "pdf_url": "https://arxiv.org/pdf/2608.20064v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Deza 그래프와 association scheme은 조합론의 분리된 분야이며, McMullen's problem의 볼록위치 점 배치나 oriented matroid 구조와 직접적 관련이 없음.", "summary": "비퇴화 쌍곡/타원 이차형식 $Q^\\varepsilon(3,q)$ ($PG(3,q)$에서)의 이방성 점들로부터 3-클래스 association scheme을 구성하고, 관계들의 비자명한 합집합 중 Deza 그래프를 정의하는 것들을 분류함. 알려진 접선족(tangency family) 외에 4개의 예외적 순Deza 그래프를 발견하고 그들의 스펙트럼, 기하-군론적 구조를 결정함.", "technique": "Finite projective 이차형식의 기하학적 성질(접선/할선/외부선)을 이용한 association scheme 관계 분류 및 그래프 매개변수 계산", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.22585v1", "title": "A short proof of Oblakov's theorem", "authors": ["Danila Cherkashin"], "abstract": "We give a short proof that for a given planar set of terminals $P$ there is at most one locally minimal tree with prescribed directions at $P$ (i.e. two locally minimal trees cannot coincide in $B_\\varepsilon(P)$).   The new ingredient is a combinatorial result which says that a certain embedding of a bipartite cubic graph has the same numbers of balanced and unbalanced vertices.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-08-23T20:44:04+00:00", "updated": "2026-08-23T20:44:04+00:00", "abs_url": "http://arxiv.org/abs/2608.22585v1", "pdf_url": "https://arxiv.org/pdf/2608.22585v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "국소 최소 트리의 유일성과 임베딩의 조합론적 성질은 이산기하학적이지만, McMullen's problem의 convex position, oriented matroid, 실현 가능성과는 직접적 연관이 없음.", "summary": "평면 집합 $P$에 주어진 지시선(prescribed directions)을 갖는 국소 최소 트리(locally minimal tree)의 유일성을 증명함. 핵심은 이분 삼정규 그래프의 임베딩에서 균형잡힌 꼭짓점과 불균형 꼭짓점의 개수가 같다는 조합론적 결과를 활용.", "technique": "이분 삼정규 그래프 임베딩의 balanced/unbalanced 꼭짓점 개수 동등성을 이용한 조합론적 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.25987v2", "title": "When are tropical multidegrees positive?", "authors": ["Yairon Cid-Ruiz"], "abstract": "We study the positivity of the tropical multidegrees of a tropical variety contained in a product of real vector spaces. These multidegrees are obtained by stably intersecting the tropical variety with pullbacks of positive tropical divisors. We introduce projection-purity and facet-selectability, two conditions under which positivity is determined by the dimensions of the natural projections, and the support of the tropical multidegrees is precisely the set of lattice points of a polymatroid base polytope. This extends He's theorem for translation-admissible tropical varieties. We also show that these conditions alone do not force the corresponding tropical volume polynomial to be Lorentzian. By contrast, for the augmented Bergman fan of any polymatroid, the positive multidegrees are supported precisely on the lattice points of the polymatroid base polytope, and the tropical volume polynomial is Lorentzian for every sequence of positive tropical divisors.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-08-26T16:38:34+00:00", "updated": "2026-08-28T02:26:49+00:00", "abs_url": "http://arxiv.org/abs/2608.25987v2", "pdf_url": "https://arxiv.org/pdf/2608.25987v2", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "tropical geometry는 McMullen 문제의 접근 도구 중 하나로 언급되지만, 이 논문은 tropical multidegree의 양성(positivity)과 Lorentzian 다항식에 관한 것으로 McMullen 문제와 직접적 연관은 없다.", "summary": "이 논문은 실수 벡터 공간의 곱 안에 포함된 tropical variety의 tropical multidegree 양성 조건을 연구한다. projection-purity와 facet-selectability라는 두 조건 하에서 양성이 자연 사영의 차원으로 결정되며, tropical multidegree의 지지(support)가 polymatroid base polytope의 격자점 집합과 일치함을 보인다. 또한 임의의 polymatroid의 augmented Bergman fan에 대해 tropical volume polynomial이 임의의 양의 tropical divisor 열에 대해 Lorentzian임을 증명한다.", "technique": "stable intersection을 이용한 tropical multidegree 계산, projection-purity 및 facet-selectability 조건 도입, polymatroid base polytope와의 연관 분석.", "connections": "추측: tropical geometry가 McMullen 문제의 접근 도구로 언급되므로 간접적 연결 가능성이 있으나, 본 논문의 주제는 McMullen 문제와 직접 관련이 없다.", "keyword_hits": ["tope", "tropical"], "source": "filter"}, {"id": "2608.24869v1", "title": "Mod 2 magnitude cohomology ring of real hyperplane arrangements", "authors": ["Ye Liu"], "abstract": "Let $\\mathcal{A}$ be a finite central real hyperplane arrangement and let $\\mathcal{G}(\\mathcal{A})$ be its tope graph. Koizumi recently proved that the crossing-graded magnitude homology of $\\mathcal{G}(\\mathcal{A})$ is torsion-free and is freely indexed by face flags. We refine his result by proving that a fixed crossing vector and terminal chamber determine a summand of rank at most one. Over $\\mathbb{F}_2$, we use the canonical cohomology basis to determine the crossing-graded magnitude cohomology ring of $\\mathcal{G}(\\mathcal{A})$.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-08-25T17:51:33+00:00", "updated": "2026-08-25T17:51:33+00:00", "abs_url": "http://arxiv.org/abs/2608.24869v1", "pdf_url": "https://arxiv.org/pdf/2608.24869v1", "journal_ref": "", "doi": "", "comment": "26 pages, 1 figure", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "tope graph를 공유하지만, 본 논문은 magnitude cohomology ring의 대수적 구조를 다루며 McMullen 문제(oriented matroid의 acyclic reorientation, 점 배치)와 직접적인 관련은 없다.", "summary": "유한 중심 실 초평면 배열(real hyperplane arrangement) $\\mathcal{A}$의 tope graph $\\mathcal{G}(\\mathcal{A})$에 대한 crossing-graded magnitude homology를 연구한다. Koizumi의 결과(해당 호몰로지가 비틀림 없이 face flag으로 인덱싱됨)를 정밀화하여, 고정된 crossing vector와 terminal chamber가 rank 최대 1인 직합항을 결정함을 증명한다. $\\mathbb{F}_2$ 위에서 정준 코호몰로지 기저를 이용해 $\\mathcal{G}(\\mathcal{A})$의 crossing-graded magnitude cohomology ring을 완전히 결정한다.", "technique": "초평면 배열의 tope graph에 대한 crossing-graded magnitude cohomology의 정준 기저 분석 및 $\\mathbb{F}_2$ 계수 코호몰로지 링 구조 결정.", "connections": "추측: tope graph는 oriented matroid의 기본 조합론적 대상으로 McMullen 문제와 관련 도구를 공유하나, 본 논문의 목표는 대수적 위상수학적 불변량으로 직접 연결은 약함.", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.20656v1", "title": "Framingtopes", "authors": ["Sergio Alejandro Fernandez de soto Guerrero", "Cesar Ceballos", "Matias von Bell"], "abstract": "Framing lattices arise from the dual graphs of framed (or DKK) triangulations of flow polytopes and provide a common framework encompassing classical lattices such as the Boolean, Tamari, and weak-order lattices, as well as $τ$-tilting posets of certain gentle algebras. In this paper, we introduce the \\emph{framingtope}, a polytopal complex that provides a geometric counterpart to a framing lattice: its edge graph is the Hasse diagram of the framing lattice. We prove that the framingtope admits three equivalent descriptions, in terms of interior faces of the framed triangulation, sets of pairwise coherent routes covering the graph, and pure intervals of the framing lattice. We further construct a tropical realization of the framingtope as the bounded-cell complex of an arrangement of tropical hypersurfaces associated with an admissible height function. This construction yields explicit vertex coordinates for broad classes of framed graphs, including plane framed graphs and multioruga graphs. In the multioruga case, these coordinates give tropical realizations of weak orders on multipermutations and, in the ordinary oruga case, recover the classical permutahedron.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-17T16:36:15+00:00", "updated": "2026-09-17T16:36:15+00:00", "abs_url": "http://arxiv.org/abs/2609.20656v1", "pdf_url": "https://arxiv.org/pdf/2609.20656v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "tropical geometry 기법을 공유하나, McMullen 문제(d=5, f(5)=11, oriented matroid, acyclic reorientation)와 직접적인 관련은 없고 flow polytope의 삼각분할 및 framing lattice의 폴리토프 복합체 연구이다.", "summary": "이 논문은 flow polytope의 framed(DKK) 삼각분할의 쌍대 그래프로부터 생성되는 framing lattice의 기하학적 대응물인 framingtope를 도입한다. framingtope는 세 가지 동치 서술(framed 삼각분할의 내부 면, 상호 coherent route 집합, framing lattice의 pure interval)을 가지며, 열대(tropical) 초곡면 배열의 유계 셀 복합체로 실현된다. 특히 multioruga 그래프의 경우 multipermutation에 대한 weak order의 열대 실현을 제공하고, 일반 oruga 경우 고전적 permutahedron을 복원한다.", "technique": "admissible height function에 연관된 열대 초곡면 배열의 유계 셀 복합체로 framingtope의 열대 실현을 구성하여 명시적 꼭짓점 좌표를 도출한다.", "connections": "추측: tropical geometry를 통한 폴리토프 실현 기법이 McMullen 문제의 realizability 접근과 느슨하게 연결될 수 있으나 초록에 직접 근거 없음.", "keyword_hits": ["tope", "triangulation", "tropical"], "source": "filter"}, {"id": "2609.19299v1", "title": "Sumsets of Ahlfors--David regular sets", "authors": ["Fred Tyrrell"], "abstract": "We prove that there is an absolute constant $c>0$ such that for every finite $(α,M)$-Ahlfors--David regular set $A\\subseteq[N]$ with $0\\leqα<1$ and $M\\geq2$, we have the sumset estimate \\[|A+A|\\geq |A|^{1+c(1-α)/\\log M}.\\] We also prove a corresponding statement for Ahlfors--David regular sets in $[0,1]$. The proof combines a multiscale entropy decomposition with inverse results from additive combinatorics, showing that Ahlfors--David regularity forces a definite entropy gain at each scale. The dependence $1/\\log M$ in the exponent is of optimal order.", "categories": ["math.CO", "math.CA", "math.MG", "math.NT"], "primary_category": "math.CO", "published": "2026-09-16T18:08:13+00:00", "updated": "2026-09-16T18:08:13+00:00", "abs_url": "http://arxiv.org/abs/2609.19299v1", "pdf_url": "https://arxiv.org/pdf/2609.19299v1", "journal_ref": "", "doi": "", "comment": "19 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Sumset 추정과 Ahlfors–David 정칙성은 additive combinatorics와 geometric measure theory의 교집합이지만, McMullen's problem(convex position, oriented matroid, realizability)과는 직접적 관련이 없음.", "summary": "유한 $(α,M)$-Ahlfors–David 정칙 집합 $A\\subseteq[N]$에 대해, sumset 크기가 $|A+A|\\geq |A|^{1+c(1-α)/\\log M}$을 만족하는 절댓값 상수 $c>0$가 존재함을 증명. 증명은 다중 스케일 엔트로피 분해와 덧셈 조합론의 역 정리를 결합하여, 정칙성이 각 스케일에서 확정적 엔트로피 증가를 강제함을 보임.", "technique": "Multiscale entropy decomposition과 inverse results from additive combinatorics의 결합.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.22741v1", "title": "The polynomial characterization of tope graphs of the lopsided sets", "authors": ["Xuan Zheng", "Yan-Ting Xie", "Shou-Jun Xu"], "abstract": "The cube polynomial $C_G(x)$ generates the number of $k$-cubes on a graph $G$. As a subclass of partial cubes, the tope graphs of lopsided sets (LOPs) generalize daisy cubes and median graphs. In this paper, we prove that every tope graph of a LOP shares its cube polynomial with some daisy cube, thereby answering affirmatively a problem posed earlier by the authors. Furthermore, we present explicit expressions for the cube polynomials of tope graphs of LOPs: $C_G(x)=f_\\mathcal{K}(x+1)$, where $f_\\mathcal{K}(x)$ is the $f$-polynomial of the cubical complex $\\mathcal{K}$ of $G$. Finally, we show that a class $\\mathcal{G}$ of partial cubes is the class of tope graphs of LOPs if and only if the following equivalent conditions hold: (a) $\\mathcal{G}$ is the maximal pc-minor-closed class such that every graph in $\\mathcal{G}$ has the same cube polynomial as some daisy cube; (b) for every $G\\in\\mathcal{G}$, each antipodal subgraph of $G$ has the same cube polynomial as some daisy cube.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-19T03:49:03+00:00", "updated": "2026-09-19T03:49:03+00:00", "abs_url": "http://arxiv.org/abs/2609.22741v1", "pdf_url": "https://arxiv.org/pdf/2609.22741v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "tope graph라는 용어가 공유되나, 이 논문은 LOP(lopsided set)의 tope graph에 대한 cube polynomial 특성화를 다루며 McMullen 문제(oriented matroid의 acyclic reorientation, f(5)=11 등)와는 직접적 관련이 없다.", "summary": "이 논문은 lopsided set(LOP)의 tope graph가 daisy cube와 동일한 cube polynomial을 가짐을 증명하여 저자들이 이전에 제기한 문제에 긍정적으로 답한다. 나아가 LOP의 tope graph의 cube polynomial에 대한 명시적 표현 $C_G(x)=f_{\\mathcal{K}}(x+1)$을 제시하며, 여기서 $f_{\\mathcal{K}}(x)$는 해당 cubical complex의 $f$-다항식이다. 최종적으로 partial cube의 클래스 $\\mathcal{G}$가 LOP의 tope graph 클래스임을 특징짓는 동치 조건들을 확립한다.", "technique": "pc-minor-closed class와 antipodal subgraph 분석을 통해 cube polynomial과 cubical complex의 $f$-polynomial 사이의 관계를 규명한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.21927v1", "title": "A colorful Steinitz theorem with different centers", "authors": ["G. Ivanov"], "abstract": "We prove a colorful quantitative Steinitz theorem in which the color classes may have different centers. If the convex hull of each of $2d$ sets in $\\R^d$ contains a translate of the Euclidean unit ball, then a rainbow convex hull contains a ball of radius $(3d)^{-2d^2}$ whose center belongs to the convex hull of the given centers. The main ingredient is an exact result for translates of a segment, proved by a lifting and a topological colorful Helly theorem. The same idea also yields a sharp colorful Helly theorem for translated cones: for $1 \\le k \\le d-1$, if every rainbow selection from $2d-k+1$ finite families of convex sets in $\\mathbb{R}^d$ has a $k$-dimensional cone in its intersection, then the intersection of one of the families contains such a cone.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-18T15:49:19+00:00", "updated": "2026-09-18T15:49:19+00:00", "abs_url": "http://arxiv.org/abs/2609.21927v1", "pdf_url": "https://arxiv.org/pdf/2609.21927v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Colorful Helly-type 정리는 조합기하학의 기초적 도구이지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, acyclic reorientation과는 직접적 관련이 없음.", "summary": "색깔별 집합들(각각 다른 중심을 가진)의 rainbow convex hull이 특정 반지름의 공을 포함함을 보이는 양적 Colorful Steinitz 정리를 증명. 선분의 이동에 대한 정확한 결과와 위상적 colorful Helly 정리를 활용하며, 동일한 방법으로 이동된 원뿔에 대한 sharp colorful Helly 정리도 도출.", "technique": "Lifting과 위상적 colorful Helly 정리를 결합한 방법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25181v1", "title": "On Smooth Combinatorial Products of Simplices", "authors": ["Juliana Curtis", "Tuong Le", "Chayim Lowen"], "abstract": "We show that every lattice weak Minkowski summand of a smooth polytope combinatorially isomorphic to a product of simplices has a quadratic triangulation. This is achieved by identifying this class of polytopes with the class of Nakajima polytopes. We combine these results to give a new proof that two lattice weak Minkowski summands of the same such smooth polytope are relatively IDP. Along the way, we prove a structure theorem for simple polytopes whose 2-faces are triangles and trapezoids.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T15:30:35+00:00", "updated": "2026-09-21T15:30:35+00:00", "abs_url": "http://arxiv.org/abs/2609.25181v1", "pdf_url": "https://arxiv.org/pdf/2609.25181v1", "journal_ref": "", "doi": "", "comment": "17 pages, 4 figures", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "단체들의 곱의 삼각분할(triangulations of products of simplices)이라는 공통 도구가 언급되나, 본 논문은 McMullen 문제나 oriented matroid와 직접 관련 없이 격자 다면체의 Minkowski 합산자 및 IDP 성질을 다룬다.", "summary": "이 논문은 단체들의 곱에 조합론적으로 동형인 매끄러운 볼록 다면체(smooth polytope)의 격자 weak Minkowski 합산자가 이차 삼각분할(quadratic triangulation)을 가짐을 보인다. 이를 위해 해당 다면체 류를 Nakajima polytope 류와 동일시하는 방법을 사용하며, 그 결과로 동일한 매끄러운 다면체의 두 격자 weak Minkowski 합산자가 relatively IDP임을 새로운 방식으로 증명한다. 부수적으로, 2-면(2-face)이 삼각형과 사다리꼴인 단순 다면체(simple polytope)에 대한 구조 정리도 증명한다.", "technique": "매끄러운 단체 곱형 다면체를 Nakajima polytope로 특성화하고 이차 삼각분할을 구성함으로써 relatively IDP 성질을 도출.", "connections": "추측: 단체들의 곱의 삼각분할 이론이 McMullen 문제의 접근 도구 중 하나로 언급되지만, 본 논문의 내용이 직접 연결된다는 초록 근거는 없음.", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.25671v1", "title": "A colorful quantitative Helly theorem for volume", "authors": ["Grigory Ivanov"], "abstract": "We prove a colorful quantitative Helly theorem for volume with the optimal number $2d$ of colors. If every rainbow intersection from $2d$ finite families of convex sets in $\\R^d$ has volume at least one, then the intersection of one family has volume at least $d^{-O(d^2)}$. We also prove a colorful quantitative Steinitz theorem for origin-centered ellipsoids of different shapes. The proof uses a common normalization of positive operators and a lift that produces two rainbow bases with large determinants.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T04:22:27+00:00", "updated": "2026-09-22T04:22:27+00:00", "abs_url": "http://arxiv.org/abs/2609.25671v1", "pdf_url": "https://arxiv.org/pdf/2609.25671v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "볼륨에 대한 Helly 정리와 볼록 교집합 문제를 다루지만, McMullen의 문제인 일반위치 점 배치와 oriented matroid의 구조 문제와는 직접적인 연결이 없음.", "summary": "Color 수 $2d$에서 최적인 colorful quantitative Helly 정리를 증명: $\\mathbb{R}^d$의 convex set 유한족 $2d$개에서 모든 rainbow intersection이 부피 1 이상이면, 한 족의 교집합 부피는 최소 $d^{-O(d^2)}$. 또한 다양한 타원체에 대한 colorful quantitative Steinitz 정리도 증명.", "technique": "양의 연산자 정규화(common normalization of positive operators)와 큰 행렬식을 가진 두 개의 rainbow basis를 생성하는 lift 기법 활용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.23746v1", "title": "On convex spiral equicoverings of masses", "authors": ["Edgardo Roldán-Pensado"], "abstract": "Convex spiral equicoverings were recently introduced by Espinosa-García, Martínez-Sandoval and Roldán-Pensado. They left open the question of whether every planar mass admits a convex $(3k,k+1)$-spiral equicovering. In this paper we give an affirmative answer to this question. To be precise, we prove the following: Given an integer $k \\ge 2$, for every planar mass there is a fan consisting of $3k$ equal-mass sectors such that the union of every $k+1$ consecutive sectors is convex.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-09-20T16:47:54+00:00", "updated": "2026-09-20T16:47:54+00:00", "abs_url": "http://arxiv.org/abs/2609.23746v1", "pdf_url": "https://arxiv.org/pdf/2609.23746v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "McMullen 문제는 고차원 convex position 점 배치와 oriented matroid의 조합론적 구조를 다루지만, 본 논문은 평면 측도의 spiral equicovering이라는 기하학적 분할 문제로 직접적 관련성이 약함.", "summary": "본 논문은 최근 도입된 convex spiral equicovering 개념에 대해, 모든 평면 측도(planar mass)가 $(3k, k+1)$-spiral equicovering을 허용함을 증명한다. 즉, $3k$개의 등질량 부채꼴로 이루어진 부채꼴 분할에서 연속하는 $k+1$개 부채꼴의 합집합이 항상 볼록 집합이 되는 구조가 존재함을 보인다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.20380v1", "title": "The Bézout inequality for mixed volumes characterizes simplices", "authors": ["Dylan Langharst", "Shouda Wang"], "abstract": "We prove that the Bézout inequality for mixed volumes characterizes simplices among full dimensional convex bodies in every dimension, resolving a conjecture of Soprunov and Zvavitch. We give two separate proofs of the conjecture. Along the way, we also prove characterizations of simplices in terms of longest chords or relative inradii.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-17T13:33:58+00:00", "updated": "2026-09-17T13:33:58+00:00", "abs_url": "http://arxiv.org/abs/2609.20380v1", "pdf_url": "https://arxiv.org/pdf/2609.20380v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "혼합부피(mixed volume)의 기하학적 특성화는 볼록체 조합론과 관련있으나, McMullen's problem의 핵심인 일반위치 점 배치, 방향매트로이드, 다각형 부분합(polyhedral matching fields) 등과는 직접 연결이 없음.", "summary": "본 논문은 혼합부피에 대한 Bézout 부등식이 모든 차원의 전차원 볼록체 중 단체를 유일하게 특성화함을 증명하여 Soprunov–Zvavitch 추측을 해결한다. 두 가지 별도의 증명을 제시하며, 가장 긴 현(longest chord) 및 상대내접원반경(relative inradius)으로도 단체 특성화를 보인다.", "technique": "혼합부피의 변분 및 부등식 분석을 통한 기하학적 특성화", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25656v1", "title": "Enumerating pattern-avoiding translation-invariant total orders", "authors": ["Stella Jiahui Li"], "abstract": "Let $n$ be a positive integer. A translation-invariant total order (TITO) with period $n$ is a total order of the integers that is invariant under translations by multiples of $n$. These structures arise naturally in the study of Coxeter groups. In particular, real $n$-TITOs are in bijection with biclosed sets of positive roots of the affine symmetric group $\\widetilde S_n$. Barkley and Defant recently introduced pattern avoidance for TITOs and used it to define the affine Tamari lattice.   The enumeration of TITOs avoiding a single pattern of length $3$ is due to Crites and Barkley--Defant. We extend this work to TITOs avoiding two patterns. Our main results include a complete enumeration of TITOs that avoid a pair of patterns in $S_3\\times S_3$, as well as of TITOs that avoid a pair $(p, q)$ with $p \\in S_3 \\setminus \\{123, 321\\}$ and $q \\in S_4$. Furthermore, we provide an explicit construction of the inverse of the bijection between $312$-avoiding TITOs and noncrossing arc diagrams, thereby extending the combinatorial framework introduced by Barkley.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-22T04:05:52+00:00", "updated": "2026-09-22T04:05:52+00:00", "abs_url": "http://arxiv.org/abs/2609.25656v1", "pdf_url": "https://arxiv.org/pdf/2609.25656v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "패턴 회피 조합론과 격자 구조를 다루지만 McMullen's problem(볼록 위치의 점 배치, oriented matroid, 실현 가능성)과는 직접 관련이 없음.", "summary": "이 논문은 정수의 평행이동 불변 전순서(TITO)에서 패턴 회피 구조를 열거한다. 저자는 한 쌍의 패턴을 회피하는 TITO들을 완전히 열거하고, 312-회피 TITO와 비교차 호 다이어그램 사이의 전단사의 역함수를 명시적으로 구성한다.", "technique": "패턴 회피 열거법과 전단사 구성; Coxeter 군 및 affine symmetric group $\\widetilde{S}_n$의 biclosed 근 집합과의 관계", "connections": "추측: oriented matroid의 reorientation 관점에서 affine symmetric group의 근 구조와 TITO 패턴 회피의 관계가 있을 수 있으나, 초록에서는 명시되지 않음", "keyword_hits": [], "source": "explore"}, {"id": "2609.27366v1", "title": "Homology of matching complexes of $3\\times n$ grid graphs", "authors": ["Pratiksha Chauhan", "Anchal Sharma", "Samir Shukla"], "abstract": "For a finite simple graph $G$, the matching complex $M(G)$ is the simplicial complex whose vertex set is the edge set of $G$ and whose simplices are all the matchings in $G$. The topology of the matching complex of the $m\\times n$ grid graph $G_{m\\times n}$ is known only for $m = 1,2$, in which cases it is homotopy equivalent to a wedge of spheres. In this article, we study the matching complex $M(G_{3 \\times n})$. We prove that for $n\\ge2$, its reduced homology vanishes in dimensions $i \\leq n-2$ and in top dimension, while $\\tilde{H}_{n-1}(M(G_{3\\times n}))\\neq 0$. We also show that $M(G_{3 \\times n})$ is simply connected for $n \\geq 3$. Consequently, the topological connectivity of $M(G_{3\\times n})$ is $n-2$.", "categories": ["math.CO", "math.AT"], "primary_category": "math.CO", "published": "2026-09-23T05:09:29+00:00", "updated": "2026-09-23T05:09:29+00:00", "abs_url": "http://arxiv.org/abs/2609.27366v1", "pdf_url": "https://arxiv.org/pdf/2609.27366v1", "journal_ref": "", "doi": "", "comment": "23 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "매칭 복소체의 위상 구조를 연구하지만, McMullen's problem의 핵심인 점 배치의 convex position, oriented matroid, 또는 다면체 조합론과 직접적인 연관이 없음.", "summary": "3×n 격자 그래프의 매칭 복소체 M(G_{3×n})의 호모로지를 연구한다. n≥2일 때 축약된 호모로지가 차원 i≤n-2와 최상위 차원에서 소멸하고, n-1 차원에서는 0이 아님을 증명한다. n≥3일 때 단순연결이며 위상 연결도는 n-2이다.", "technique": "단순 복소체의 호모로지 계산 및 위상적 연결도 분석", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.24775v1", "title": "Discrepancy theory, Tverberg's theorem, and regression depth", "authors": ["Aleksey Lopez", "Pablo Soberón"], "abstract": "We prove new bounds for Tverberg's theorem with tolerance. We show that $N = rt+Θ_{d,r}(t^{1/2-1/(2d)})$, where $N$ is the smallest number such that any set of $N$ points in $\\mathbb{R}^d$ has a partition into $r$ parts such that the convex hulls of the parts intersect even if we remove any $t$ of the points.   We extend Tverberg's theorem with tolerance to families of hyperplanes in $\\mathbb{R}^d$, and show that for any set of $rt + O_{d,r}(t^{1/2-1/(2d)}\\sqrt{\\log (t+1)})$ hyperplanes in $\\mathbb{R}^d$ there exists a partition of them into $r$ parts such that the regression hulls of the parts intersect even if any $t$ hyperplanes are removed.   Our bounds follow from establishing a connection between Tverberg-type results and discrepancy theory.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T15:42:56+00:00", "updated": "2026-09-21T15:42:56+00:00", "abs_url": "http://arxiv.org/abs/2609.24775v1", "pdf_url": "https://arxiv.org/pdf/2609.24775v1", "journal_ref": "", "doi": "", "comment": "11 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Tverberg의 정리는 고차원 조합기하의 고전적 결과이지만, McMullen의 문제(d=5에서의 convex position 점 배치 및 oriented matroid 구조)와는 직접적인 연관이 없음.", "summary": "저자들은 tolerance를 갖춘 Tverberg 정리에 대한 새로운 상한을 증명했으며, $N = rt+\\Theta_{d,r}(t^{1/2-1/(2d)})$ 형태의 점 개수 경계를 도출했다. 또한 이 결과를 초평면 족으로 확장하여 regression hull의 교집합 성질을 보이고, discrepancy 이론과의 연결을 확립했다.", "technique": "Discrepancy theory와 Tverberg-type 결과 간의 연결을 통해 점 및 초평면 집합의 분할 문제를 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.25445v1", "title": "Back Stable Standard Elementary Monomials", "authors": ["Carlos Rodriguez"], "abstract": "We introduce back stable standard elementary monomials and their complete homogeneous analogues. These families form bases of the back stable Schubert ring and record the eventual standard elementary monomial expansions of left-stabilized Schubert polynomials. Dynkin reversal exchanges the two bases while preserving their coefficients. We also show that orbit sums of the back stable coefficients recover the elementary and complete homogeneous coefficients of Stanley symmetric functions. Finally, we study the shifted specialization polynomial $\\mathcal{T}_w(t)=\\mathfrak{S}_{1^t\\times w}(1)$, considered by Fomin and Kirillov, which counts reduced pipe dreams of $1^t\\times w$. We express this polynomial in terms of back stable standard elementary monomial coefficients.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-21T21:55:34+00:00", "updated": "2026-09-21T21:55:34+00:00", "abs_url": "http://arxiv.org/abs/2609.25445v1", "pdf_url": "https://arxiv.org/pdf/2609.25445v1", "journal_ref": "", "doi": "", "comment": "20 pages, 1 figure", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Back stable Schubert ring과 symmetric function 이론은 combinatorial 대수 구조를 다루지만, McMullen's problem의 convex position, oriented matroid, tope graph 등 이산기하학적 문제와는 직접 연관이 없음.", "summary": "본 논문은 back stable Schubert ring의 기저를 형성하는 back stable standard elementary monomial과 complete homogeneous analogue를 소개한다. Dynkin reversal을 통해 두 기저 사이의 관계를 규명하고, orbit sum이 Stanley symmetric function의 계수를 복원함을 보인다. 또한 Fomin-Kirillov의 shifted specialization polynomial을 back stable standard elementary monomial 계수로 표현한다.", "technique": "Back stable Schubert polynomial expansion과 symmetric function의 orbit sum 기법, reduced pipe dream 계수 추적.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2609.26397v1", "title": "Pairs of lattice complements with complementary homology", "authors": ["Sara Faridi", "Dharm Veer", "Volkmar Welker"], "abstract": "In this paper we study whether there is a global to local principle for the homology of order complexes of finite lattices. We explore whether the non-vanishing of the homology of a lattice in degree $a+b-2$ forces the existence of a pair of lattice-complements whose open intervals below have non-vanishing homology in degrees $a$ and $b$ respectively. We consider the same question also in the language of multigraded free resolutions. We provide positive evidence for the existence of such pairs and give counterexamples to strengthenings of the question.", "categories": ["math.CO", "math.AC"], "primary_category": "math.CO", "published": "2026-09-22T13:33:54+00:00", "updated": "2026-09-22T13:33:54+00:00", "abs_url": "http://arxiv.org/abs/2609.26397v1", "pdf_url": "https://arxiv.org/pdf/2609.26397v1", "journal_ref": "", "doi": "", "comment": "22 pages, 3 figures", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "유한 격자의 order complex 동형(homology)을 다루지만, McMullen's problem의 핵심인 convex position 점 배치, oriented matroid, 다면체 기하와는 직접 관련이 없음.", "summary": "유한 격자의 order complex에 대한 global-to-local 동형 원리를 연구한다. 특정 차수에서 격자의 동형이 0이 아닌지 여부가 보수적 격자 쌍(lattice-complements)의 존재를 강제하는지 탐구하고, 다중등급 자유 분해(multigraded free resolutions) 언어로도 같은 문제를 고찰한다.", "technique": "Order complex의 동형학, 격자 보수성(lattice complementarity) 분석, 다중등급 호몰로지 기법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2610.29808v1", "title": "Topological degree of fewnomial maps", "authors": ["Frédéric Bihan"], "abstract": "We study the topological degree on the positive orthant of a map $F:\\mathbb{R}^n_{>0}\\to\\mathbb{R}^n$ whose components are real polynomials, possibly with real exponents, with the same support $\\mathcal{A}$ of $N=n+k+1$ monomials. This degree is well defined under a half-space condition on the columns of the coefficient matrix indexed by the faces of the Newton polytope, which holds for generic exponents and coefficients. We give three formulas for it, all in terms of signs of maximal minors. The first one is a Viro formula: the degree is a signed count of the simplices of a regular triangulation of $\\mathcal{A}$ which are positively decorated in the sense of Bihan, Santos and Spaenlehauer. The second one is a sum over the facets of the Newton polytope, and the third one a sum over the vertices of the polyhedron of the Gale dual system. As a consequence, the degree only depends on the oriented matroids of the exponent and coefficient matrices restricted to the vertices of the Newton polytope. We also obtain a Descartes rule of signs for the degree and, in the generic case, the upper bound $|°F|<\\frac12\\min(M(n,N),M(k,N))$, where $M(d,N)$ is the largest number of facets of a $d$-polytope with $N$ vertices. This bound is sharp when $n=2$ or $k=2$. Using the H-duality of Bihan, Dickenstein and Forsgård, we show that the set of possible degrees is symmetric in $n$ and $k$. Since a nonzero degree forces a positive zero, our formulas give sign conditions for the existence of positive solutions, as well as parity statements for their number.", "categories": ["math.CO", "math.AG"], "primary_category": "math.CO", "published": "2026-10-21T14:34:25+00:00", "updated": "2026-10-21T14:34:25+00:00", "abs_url": "http://arxiv.org/abs/2610.29808v1", "pdf_url": "https://arxiv.org/pdf/2610.29808v1", "journal_ref": "", "doi": "", "comment": "34 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "oriented matroid의 개념이 등장하지만, 이 논문은 McMullen 문제나 Larman 추측과 직접 관련 없이 fewnomial 맵의 위상적 차수(topological degree)를 연구한다.", "summary": "이 논문은 $N=n+k+1$개의 단항식으로 구성된 동일한 지지집합 $\\mathcal{A}$를 갖는 실다항식 맵 $F:\\mathbb{R}^n_{>0}\\to\\mathbb{R}^n$의 양의 직교체(positive orthant) 위에서의 위상적 차수를 연구한다. 정규 삼각분할(regular triangulation)을 이용한 Viro 공식, Newton 다면체의 면(facet) 위 합산 공식, Gale 쌍대 시스템의 꼭짓점 위 합산 공식 등 세 가지 공식을 도출하며, 이 차수는 지수 행렬과 계수 행렬의 oriented matroid에만 의존함을 보인다. 부호 조건에 대한 Descartes 법칙과 상한 $|\\deg F| < \\frac{1}{2}\\min(M(n,N), M(k,N))$을 얻으며, 이를 통해 양의 해의 존재 조건 및 개수의 홀짝성을 도출한다.", "technique": "정규 삼각분할(regular triangulation)과 Gale 쌍대성(H-duality)을 활용하여 위상적 차수를 최대 소행렬식(maximal minor)의 부호들로 표현하는 세 가지 공식을 구성한다.", "connections": "추측: oriented matroid의 부호 조건과 실현가능성(realizability)은 McMullen 문제의 chirotope 접근과 형식적으로 유사하나, 직접적 연결 근거는 초록에 없음.", "keyword_hits": ["oriented matroid", "tope", "triangulation"], "source": "filter"}, {"id": "2610.28672v1", "title": "Triangulation, Volume, and Symmetries of the Dihedral Group Analogue of the Permutohedron", "authors": ["Colin Olairez"], "abstract": "We study the analogue of the permutohedron for the dihedral group, which we call the dihedral permutohedron. We determine the facet structure of the dihedral permutohedron, use the facet structure to construct a triangulation, and determine a nice combinatorial formula for the volume of the dihedral permutohedron. Lastly, we find a family of interesting unimodular affine symmetries of the odd dihedral permutohedron.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-10-18T18:32:00+00:00", "updated": "2026-10-18T18:32:00+00:00", "abs_url": "http://arxiv.org/abs/2610.28672v1", "pdf_url": "https://arxiv.org/pdf/2610.28672v1", "journal_ref": "", "doi": "", "comment": "21 pages, 4 figures", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이면체군(dihedral group)에 대한 permutohedron의 삼각분할(triangulation)을 다루지만, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와는 직접적인 연관이 없다.", "summary": "이 논문은 이면체군(dihedral group)에 대응하는 퍼뮤토헤드론(permutohedron)인 '이면 퍼뮤토헤드론(dihedral permutohedron)'을 연구한다. 패싯(facet) 구조를 결정하고, 이를 이용해 삼각분할(triangulation)을 구성하며, 부피(volume)에 대한 조합론적 공식을 유도한다. 추가로 홀수 이면 퍼뮤토헤드론의 유니모듈(unimodular) 아핀 대칭군 패밀리를 발견한다.", "technique": "패싯 구조를 활용한 삼각분할(triangulation) 구성 및 조합론적 부피 공식 도출.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2610.22829v1", "title": "KKM meets colorful Carathéodory", "authors": ["Alexander Polyanskii"], "abstract": "The colorful Carathéodory theorem states that if $V_1,\\dots,V_{d+1}\\subset\\mathbb R^d$ satisfy $0\\in\\mathrm{conv}\\;V_i$ for every $i$, then there exist points $v_i\\in V_i$ such that $0\\in\\mathrm{conv}\\;\\{v_1,\\dots,v_{d+1}\\}$.   We give a new proof based on triangulations and the classical KKM lemma. We lift the sets $V_i$ to parallel affine copies of $\\mathbb R^d$ in $\\mathbb R^d\\times\\mathbb R^d$ and use a triangulation of the resulting point configuration to construct a KKM cover. Using the same approach, we prove the very colorful Carathéodory theorem.", "categories": ["math.CO", "math.HO"], "primary_category": "math.CO", "published": "2026-10-16T02:11:09+00:00", "updated": "2026-10-16T02:11:09+00:00", "abs_url": "http://arxiv.org/abs/2610.22829v1", "pdf_url": "https://arxiv.org/pdf/2610.22829v1", "journal_ref": "", "doi": "", "comment": "6 pages", "relevance": 2, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "colorful Carathéodory 정리는 볼록 위치(convex position) 및 일반 위치 점 배치와 관련된 조합론적 도구이나, McMullen 문제(d=5, Larman 추측 등)와 직접적 연관은 없음.", "summary": "이 논문은 colorful Carathéodory 정리($V_1,\\dots,V_{d+1}\\subset\\mathbb{R}^d$에서 각 $0\\in\\mathrm{conv}\\,V_i$이면 $v_i\\in V_i$가 존재하여 $0\\in\\mathrm{conv}\\{v_1,\\dots,v_{d+1}\\}$)에 대한 새로운 증명을 제시한다. 증명 방법은 집합 $V_i$를 $\\mathbb{R}^d\\times\\mathbb{R}^d$ 내의 평행한 아핀 복사본으로 올린 뒤, 해당 점 배치의 삼각분할(triangulation)을 이용하여 KKM 덮개(KKM cover)를 구성하는 방식이다. 동일한 접근법으로 'very colorful Carathéodory 정리'도 증명한다.", "technique": "점 집합을 $\\mathbb{R}^d\\times\\mathbb{R}^d$로 올려 삼각분할을 구성하고, 고전적인 KKM 보조정리를 적용하여 colorful Carathéodory 정리를 증명.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2606.24878v1", "title": "An Improved Lower Bound for the Erdős-Lovász Cover Number Problem", "authors": ["Varun Sivashankar"], "abstract": "Let $g(r)$ be the minimum number of edges in an $r$-uniform intersecting hypergraph with cover number $r$. Erdős and Lovász proved the lower bound $g(r)\\ge 8r/3-3$. We first give a completely elementary proof that $g(r)\\ge 3r-4$. We then build on the same approach and apply Kahn's small-codegree hypergraph edge-colouring theorem to improve this to $g(r)\\ge (61/20-o(1))r$. To the best of our knowledge, this is the first improvement over the Erdős-Lovász lower bound in about fifty years.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-06-23T17:55:10+00:00", "updated": "2026-06-23T17:55:10+00:00", "abs_url": "http://arxiv.org/abs/2606.24878v1", "pdf_url": "https://arxiv.org/pdf/2606.24878v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Erdős-Lovász cover number 문제는 hypergraph covering과 extremal combinatorics의 고전 문제이며, McMullen's problem(convex position, general position 배치)과는 직접적 주제 연관성이 없음.", "summary": "본 논문은 $r$-uniform intersecting hypergraph에서 cover number가 $r$일 때 최소 간선 수 $g(r)$에 대한 Erdős-Lovász 하한을 약 50년 만에 처음 개선한다. 초등적 증명으로 $g(r) \\ge 3r-4$를 얻고, Kahn의 small-codegree hypergraph edge-colouring 정리를 적용하여 $g(r) \\ge (61/20-o(1))r$로 개선한다.", "technique": "Kahn의 small-codegree hypergraph edge-colouring theorem을 extremal lower bound 개선에 적용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2606.24840v1", "title": "The inverse reduction map in the quantum Littlewood-Richardson bijection", "authors": ["Olga Azenhas"], "abstract": "In arXiv:2603.16698v5 we have explicitly computed the inverse of the reduction map in the quantum Littlewood-Richardson bijection for certain patterns of symplectic columns. It turns out that some of those patterns are cell pieces to compute the inverse of the reduction map on any symplectic column. For large symplectic columns, the tools provided here can be combined with the composition of the inverses of the several maps in which the reduction map decomposes, given by Watanabe, namely, among them, combinatorial $R$-matrices and reduction maps of shorter symplectic columns.", "categories": ["math.CO"], "primary_category": "math.CO", "pub

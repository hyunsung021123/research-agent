ksandrov Monge--Ampère equation. Let $Ω\\subset\\mathbb R^2$ be a bounded open convex domain, let $K\\SubsetΩ$, and let $F_N=G_{P_N}0_Ω$ be the minimal nonnegative concave tropical series with integral slopes, zero boundary values, and corner locus containing an $N$-point set $P_N\\subset K$. For universally generic configurations whose empirical measures converge to $μ$, $N^{-1/2}F_N\\longrightarrow F_{μ,Ω}$ uniformly on $\\overlineΩ$, where $F_{μ,Ω}$ is the unique continuous concave Aleksandrov solution of $\\mathrm{MA}(F)=μ$ with zero boundary values. On every compact $L\\SubsetΩ$ we prove an $O(N^{-1/2})$ bounded-Lipschitz-type estimate for the curvature discrepancy. No regularity or strict-convexity assumption is imposed on $\\partialΩ$.   For rational polygons, strong genericity holds on an open dense full-measure locus. The tropical curve has exactly $N$ bounded cells, the marked dual edges form a spanning tree, and every compact internal edge has weight one. These finite statements yield global weak curvature convergence and the exact identity $\\mathrm{MA}(F_N)(Ω^\\circ)=N-1+\\frac{1}{2}D_{\\mathrm{term}}(F_N)$, with $D_{\\mathrm{term}}(F_N)=O(\\sqrt N)$. The proof combines tropical interpolation, semilinear marked topology, an Euler--Pick curvature formula, minimal coefficient deformations, tangential coarea, and a weighted Crofton estimate uniform over rational polygonal exhaustions. We also obtain almost-sure limits for random point clouds, full affine covariance of the continuum solution, and a configuration-dependent Abelian-sandpile diagonal.", "categories": ["math.AP", "math.AG", "math.MG"], "primary_category": "math.AP", "published": "2026-07-28T15:40:19+00:00", "updated": "2026-07-28T15:40:19+00:00", "abs_url": "http://arxiv.org/abs/2607.25878v1", "pdf_url": "https://arxiv.org/pdf/2607.25878v1", "journal_ref": "", "doi": "", "comment": "62 pages, 3 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 열대 기하학을 이용한 Monge–Ampère 방정식의 근사를 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid, 실현가능성 등)와 직접적 연관이 없다.", "summary": "이 논문은 평면 Aleksandrov Monge–Ampère 방정식의 열대적(tropical) 근사를 구성한다. $N$-점 집합 $P_N$의 경험적 측도가 $\\mu$로 수렴하는 범용 일반 배치에 대해 $N^{-1/2}F_N \\to F_{\\mu,\\Omega}$ 균등 수렴을 증명하며, $O(N^{-1/2})$ 곡률 불일치 추정을 제공한다. 증명은 열대 보간, Euler–Pick 곡률 공식, 가중 Crofton 추정 등을 결합한다.", "technique": "열대 보간(tropical interpolation), semilinear 표시 위상론(semilinear marked topology), Euler–Pick 곡률 공식, 최소 계수 변형(minimal coefficient deformations), 접선 coarea 및 가중 Crofton 추정을 결합한 증명.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2607.25629v1", "title": "On the Realizability of Edge-Girth Sequences", "authors": ["Lilian Marey", "Paul Hilaire", "Charlotte Laclau"], "abstract": "The edge-girth of an edge $e$ in a simple connected graph is the length of a shortest cycle containing $e$, with $g_e = \\infty$ if no such cycle exists. The edge-girth sequence of a graph is the nondecreasing sequence of edge-girth values over all its edges. We prove that a sequence $S$ is realizable as the edge-girth sequence of a simple connected graph if and only if it satisfies a recursive criterion: writing $S = S_0 \\uplus (g^{(m)})$ where $g$ is the maximum edge-girth value of $S$ with multiplicity $m$ and $S_0$ is the prefix subsequence, $S$ is realizable if and only if $S_0$ is realizable and the multiplicity $m$ lies in a set entirely determined by $g$ and the maximum diameter $d^*_{S_0}$ achievable by graphs realizing $S_0$. We further determine $d^*_S$ for any realizable sequence: for constant sequences $(g^{(m)})$, we obtain a closed-form formula when $g$ is even and a recursive formula when $g$ is odd. For general sequences, we provide a recursive algorithm computing $d^*_S$ together with explicit constructions of diameter-achieving graphs.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-07-28T12:11:20+00:00", "updated": "2026-07-28T12:11:20+00:00", "abs_url": "http://arxiv.org/abs/2607.25629v1", "pdf_url": "https://arxiv.org/pdf/2607.25629v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프의 edge-girth sequence 실현 가능성을 다루며, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "단순 연결 그래프에서 각 간선의 edge-girth(해당 간선을 포함하는 최단 사이클의 길이)로 이루어진 비감소 수열인 edge-girth sequence의 실현 가능성을 완전히 특징짓는다. 수열 $S$가 실현 가능할 조건을 재귀적 기준으로 제시하며, 최대 edge-girth 값 $g$의 중복도 $m$이 $g$와 $S_0$를 실현하는 그래프의 최대 지름 $d^*_{S_0}$에 의해 결정되는 집합에 속해야 함을 증명한다. 또한 임의의 실현 가능한 수열에 대해 $d^*_S$를 계산하는 재귀 알고리즘과 지름을 달성하는 그래프의 명시적 구성을 제공한다.", "technique": "재귀적 실현 가능성 기준과 최대 지름 $d^*_S$를 계산하는 재귀 알고리즘, 그리고 지름 달성 그래프의 명시적 구성.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2607.24945v1", "title": "The Dennis Trace for Assembler K-Theory", "authors": ["Sanjana Agarwal", "Ramyak Bilas"], "abstract": "We define a notion of Hochschild homology of a weak assembler and use it to construct a Dennis trace map from the group completion $K$-theory of a weak assembler to its Hochschild homology. We compute the Hochschild homology for some examples, in particular for various cases of restricted polytopes. We also give an explicit description of the Dennis trace map at level $0$, i.e. from the zeroth $K$-theory group to the zeroth Hochschild homology group. Further, we show that the Dennis trace is a refinement of the trace/regulator map defined by Bohmann et al thus showing that group homology is a trace invariant.", "categories": ["math.AT"], "primary_category": "math.AT", "published": "2026-07-27T18:01:13+00:00", "updated": "2026-07-27T18:01:13+00:00", "abs_url": "http://arxiv.org/abs/2607.24945v1", "pdf_url": "https://arxiv.org/pdf/2607.24945v1", "journal_ref": "", "doi": "", "comment": "39 pages, comments welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 대수적 K-이론과 Hochschild 호몰로지에 관한 것으로, McMullen 문제나 볼록 위치 점 배치·oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 weak assembler의 Hochschild 호몰로지 개념을 정의하고, assembler K-이론의 군 완성(group completion)으로부터 Hochschild 호몰로지로의 Dennis trace 사상을 구성한다. 제한된 다면체(restricted polytopes) 등 구체적인 예시에 대해 Hochschild 호몰로지를 계산하고, level 0에서의 Dennis trace에 대한 명시적 기술을 제공한다. 또한 Dennis trace가 Bohmann 등이 정의한 trace/regulator 사상의 세분화임을 보여 군 호몰로지가 trace 불변량임을 증명한다.", "technique": "Weak assembler의 Hochschild 호몰로지를 활용한 Dennis trace 사상의 구성 및 군 완성 K-이론과의 연결.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2607.26363v1", "title": "Neoplatonic solids", "authors": ["Peter Doyle", "Matthew Ellison"], "abstract": "A \\emph{6-net} is a simplicial triangulation of the $2$-sphere with maximum degree $\\leq 6$. Experiments suggest that every $6$-net admits a unique realization as an undented Euclidean polyhedron built from unit equilateral triangles, and a unique realization as an ideal equilateral hyperbolic polyhedron. We call these \\emph{neoplatonic solids} and \\emph{ideal neoplatonics}.   A net is \\emph{prime} if every 3-cycle bounds a face. A computer-assisted proof shows that every prime $6$-net with $v \\leq 50$ has a unique realization as a convex ideal neoplatonic. Numerical homotopy from this realization yields an approximate Euclidean neoplatonic, and a computer-assisted proof shows that a true Euclidean neoplatonic lies nearby, though we do not prove uniqueness. Using the separating-triangle decomposition, we extend Euclidean existence to all $10{,}412{,}340$ $6$-nets with $v\\leq50$, counted up to combinatorial isomorphism.", "categories": ["math.MG", "math.CO"], "primary_category": "math.MG", "published": "2026-07-29T00:40:20+00:00", "updated": "2026-07-29T00:40:20+00:00", "abs_url": "http://arxiv.org/abs/2607.26363v1", "pdf_url": "https://arxiv.org/pdf/2607.26363v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 구면 삼각분할(6-net)의 유클리드·쌍곡 다면체 실현에 관한 것으로, McMullen 문제(d=5에서의 볼록 위치 점 배치, oriented matroid, chirotope 등)와 직접적 관련이 없다.", "summary": "이 논문은 최대 차수 $\\leq 6$인 2-구면의 단체 삼각분할(6-net)을 대상으로, 각 6-net이 단위 정삼각형으로 구성된 유클리드 다면체(neoplatonic solid)와 이상적 쌍곡 다면체(ideal neoplatonic)로 유일하게 실현된다는 실험적 관찰을 보고한다. 컴퓨터 보조 증명을 통해 꼭짓점 수 $v \\leq 50$인 모든 소(prime) 6-net에 대해 볼록 이상 쌍곡 실현의 유일성을 확인하고, 분리 삼각형 분해(separating-triangle decomposition)를 이용해 $v \\leq 50$인 모든 10,412,340개의 6-net에 대한 유클리드 실현 존재성을 증명한다.", "technique": "컴퓨터 보조 증명, 수치적 호모토피(numerical homotopy), 분리 삼각형 분해(separating-triangle decomposition)를 결합하여 6-net의 유클리드 및 이상적 쌍곡 다면체 실현을 구성·검증한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.00920v1", "title": "Analysis of Conjectural Improvements to Minkowski's Lower Bound on the Sphere Packing Density", "authors": ["Carlo Vanoni", "Alan Guo", "Salvatore Torquato"], "abstract": "Torquato and Stillinger conjectured an exponential improvement of Minkowski's classical lower bound on the maximal density of sphere packings in high-dimensional Euclidean space $\\mathbb{R}^d$ using a pair-correlation-function optimization framework. Conditional on their realizability conjecture, we show that a simple family of hyperuniform pair correlation functions yields polynomial improvements over Minkowski's lower bound of the form $φ_{\\mathrm{max}} \\gtrsim d^β2^{-d}$ for every fixed $β>1$ in sufficiently high dimensions. As the polynomial exponent is allowed to increase with dimension, this family continuously approaches the previously conjectured exponential improvement. We further derive the same exponential asymptotic rate independently from the Cohn--Elkies dual linear programming upper bound formulation, demonstrating that its radial objective test functions cannot asymptotically exclude packings with the Torquato--Stillinger density scalings. The agreement between these alternative approaches provides new evidence that exceptionally dense disordered sphere packings may exist in high dimensions and strengthens the case for the Torquato--Stillinger conjectural lower bound.", "categories": ["math-ph", "cond-mat.stat-mech", "math.MG"], "primary_category": "math-ph", "published": "2026-08-02T01:25:28+00:00", "updated": "2026-08-02T01:25:28+00:00", "abs_url": "http://arxiv.org/abs/2608.00920v1", "pdf_url": "https://arxiv.org/pdf/2608.00920v1", "journal_ref": "", "doi": "", "comment": "16 pages, 5 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 고차원 구 채우기(sphere packing) 밀도의 하한에 관한 것으로, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid 등)와 무관하다.", "summary": "Torquato–Stillinger의 추측(고차원 구 채우기 밀도의 지수적 개선)을 분석하여, realizability 추측을 조건으로 hyperuniform pair correlation function 족이 $\\phi_{\\mathrm{max}} \\gtrsim d^\\beta 2^{-d}$ ($\\beta>1$ 고정) 형태의 다항식 개선을 산출함을 보였다. 또한 Cohn–Elkies 쌍대 선형 프로그래밍 상한 공식화로부터 동일한 지수적 점근 속도를 독립적으로 도출하였다. 두 접근법의 일치는 고차원에서 예외적으로 조밀한 비정렬(disordered) 구 채우기가 존재할 수 있다는 새로운 증거를 제공한다.", "technique": "Hyperuniform pair correlation function 최적화 및 Cohn–Elkies 쌍대 선형 프로그래밍 상한 공식화.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2607.29522v1", "title": "Optimal mean width and metric entropy estimates for convex bodies", "authors": ["Grigoris Paouris", "Reese Pathak"], "abstract": "We show that there exists a constant $C > 0$ such that for any $n \\geq 1$ and any convex body $K \\subset \\mathbf{R}^n$, \\[ 1 \\leq \\inf_{T \\in \\mathrm{GL}(n)} \\, \\frac{M^\\ast(TK)}{\\mathrm{vr}(TK)}   \\leq C\\sqrt{\\log(\\mathrm{e} n)}, \\] where $M^\\ast$ denotes the spherical mean width and $\\mathrm{vr}(\\cdot)$ denotes the volume radius. The righthand side is attained, up to universal constants, by the crosspolytope and the regular $n$-simplex. Analogously, we show that, up to universal constants, the logarithm of the Euclidean covering number is maximized over convex bodies $K \\subset \\mathbf{R}^n$ by the simplex and crosspolytope. Our proof makes use of Eldan's stochastic localization.", "categories": ["math.MG", "math.FA", "math.PR"], "primary_category": "math.MG", "published": "2026-07-31T15:22:06+00:00", "updated": "2026-07-31T15:22:06+00:00", "abs_url": "http://arxiv.org/abs/2607.29522v1", "pdf_url": "https://arxiv.org/pdf/2607.29522v1", "journal_ref": "", "doi": "", "comment": "20 pages. Comments are welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록체(convex body)의 평균 폭(mean width)과 covering number에 관한 비대칭 기하(asymptotic geometric analysis) 결과로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "임의의 볼록체 $K \\subset \\mathbf{R}^n$에 대해 $\\inf_{T \\in \\mathrm{GL}(n)} \\frac{M^*(TK)}{\\mathrm{vr}(TK)} \\leq C\\sqrt{\\log(en)}$임을 보이며, 이 상계는 crosspolytope와 정규 $n$-단체(regular $n$-simplex)에 의해 달성됨을 증명한다. 아울러 유클리드 covering number의 로그값도 동일한 두 도형에 의해 최대화됨을 보인다. 증명의 핵심 도구로 Eldan의 확률적 국소화(stochastic localization)를 사용한다.", "technique": "Eldan의 stochastic localization을 활용하여 구면 평균 폭과 volume radius의 비율에 대한 최적 상계를 도출한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2607.28772v1", "title": "Hard unknots are often easy from a different perspective", "authors": ["Jason Cantarella", "Henrik Schumacher", "Clayton Shonkwiler"], "abstract": "Recent attempts to train AI models to recognize knots have produced millions of \"hard\" unknot diagrams resistant to simplification by Reidemeister moves, pass moves, or random walks on the Reidemeister graph. Most are easy for non-diagrammatic methods such as simplifying triangulations of the knot complement (Regina) or presentations of the knot group (SnapPy). We present ReAPR (Re-embedding And Pass Rerouting), which alternates pass-move reduction with a geometric re-embedding step. The re-embedding minimizes the total variation of a height function on the diagram subject to crossing constraints. We show that for an $n$-crossing diagram, the minimum total variation is $2(n-k)$, where $k$ is the least number of crossings one must virtualize to make the diagram virtually alternating; this is a combinatorial invariant of the diagram. Reprojecting the resulting embedding from a new viewpoint reveals previously hidden simplifications. ReAPR successfully simplifies every published hard-unknot example we are aware of, as well as several new collections (approximately 2.6 million examples in total) in under 30 seconds of total CPU time. This includes a set of Kauffman's \"challenge\" unknots, presented as rational tangles, which appear to be surprisingly difficult for both non-diagrammatic methods.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-07-30T18:50:33+00:00", "updated": "2026-07-30T18:50:33+00:00", "abs_url": "http://arxiv.org/abs/2607.28772v1", "pdf_url": "https://arxiv.org/pdf/2607.28772v1", "journal_ref": "", "doi": "", "comment": "23 pages, 3 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 매듭 다이어그램 단순화(unknot recognition)에 관한 것으로, McMullen's problem, oriented matroid, convex/general position 점 배치 등 연구 문제와 직접적인 관련이 없다.", "summary": "이 논문은 AI 훈련 과정에서 생성된 수백만 개의 '어려운' 비매듭(unknot) 다이어그램을 효율적으로 단순화하는 알고리즘 ReAPR(Re-embedding And Pass Rerouting)을 제안한다. ReAPR은 pass-move 축소와 기하학적 재투영(re-embedding) 단계를 교대로 적용하며, $n$-교차 다이어그램의 최소 총변동(total variation)이 $2(n-k)$임을 증명한다(여기서 $k$는 virtually alternating 만들기 위해 가상화해야 할 최소 교차 수). 약 260만 개의 예제를 30초 미만의 CPU 시간으로 단순화하는 데 성공하였다.", "technique": "높이 함수의 총변동(total variation)을 교차 제약 하에 최소화하여 다이어그램을 재투영하는 기하학적 재임베딩과 pass-move 축소를 교대 적용.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2607.28566v1", "title": "From Kreweras walks to branching perimeter processes of percolated triangulations", "authors": ["Renan Gross", "Emmanuel Kammerer", "Frederik Ravn Klausen"], "abstract": "In this note, using a result of Bernardi, Holden and Sun, we give an explicit geometric relation between the perimeter of the peeling process along the percolation interface of a triangulation, and the corresponding Kreweras walk. The relation naturally extends to the branching peeling exploration. This sheds light on the relation between the growth-fragmentation process and correlated Brownian excursions discovered by Da Silva, Powell and Watson.", "categories": ["math.CO", "math-ph", "math.PR"], "primary_category": "math.CO", "published": "2026-07-30T17:32:25+00:00", "updated": "2026-07-30T17:32:25+00:00", "abs_url": "http://arxiv.org/abs/2607.28566v1", "pdf_url": "https://arxiv.org/pdf/2607.28566v1", "journal_ref": "", "doi": "", "comment": "16 pages, 8 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 삼각분할의 퍼콜레이션 계면에 대한 필링 과정과 Kreweras 보행 사이의 기하학적 관계를 다루는 확률론·조합론 논문으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 Bernardi, Holden, Sun의 결과를 활용하여 삼각분할의 퍼콜레이션 계면을 따르는 필링 과정(peeling process)의 둘레(perimeter)와 대응하는 Kreweras 보행 사이의 명시적인 기하학적 관계를 제시한다. 이 관계는 분기 필링 탐색(branching peeling exploration)으로 자연스럽게 확장된다. 이를 통해 Da Silva, Powell, Watson이 발견한 성장-단편화 과정(growth-fragmentation process)과 상관된 브라운 소풍(correlated Brownian excursions) 사이의 관계를 새롭게 조명한다.", "technique": "Bernardi–Holden–Sun의 결과를 이용해 퍼콜레이션 계면의 필링 과정 둘레를 Kreweras 보행과 기하학적으로 연결하고, 이를 분기 필링 탐색으로 확장하는 방법.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2607.27751v1", "title": "Exotic knottings and symmetries of surfaces in 4-manifolds", "authors": ["R. Inanc Baykur", "Nathan Sunukjian"], "abstract": "We study exotic knottings of surfaces in 4-manifolds through their ambient symmetries. We first give a general recipe for producing projectively rigid surfaces, for which every smoothly extendable self-diffeomorphism acts on first homology by plus or minus the identity. For every integer g >0, a refinement of this construction yields a finite sequence of genus-g surfaces F_0, ..., F_2g contained in a 4-manifold X_g. These surfaces are topologically isotopic and topologically flexible: every orientation-preserving self-diffeomorphism of F_i can be realized by a self-homeomorphism of X_g preserving F_i. Successive knotting, however, rules out increasingly many projective homological symmetries, revealing a finer knottedness phenomenon. The first two constructions combine iterated rim surgery with the convex geometry of Newton polytopes of relative Seiberg-Witten invariants. We also use hyperbolic geometry to construct a totally geodesic surface of positive genus whose smooth and topological extendable mapping class groups are both trivial.", "categories": ["math.GT", "math.GN"], "primary_category": "math.GT", "published": "2026-07-30T06:46:28+00:00", "updated": "2026-07-30T06:46:28+00:00", "abs_url": "http://arxiv.org/abs/2607.27751v1", "pdf_url": "https://arxiv.org/pdf/2607.27751v1", "journal_ref": "", "doi": "", "comment": "23 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 4-다양체 내 곡면의 exotic knotting과 대칭성을 다루는 위상수학 논문으로, McMullen 문제(점 배치, oriented matroid, 볼록 위치)와 전혀 관련이 없다.", "summary": "이 논문은 4-다양체 내 곡면의 exotic knotting을 ambient 대칭성을 통해 연구한다. genus-g 곡면의 유한 수열 $F_0, \\ldots, F_{2g}$를 구성하여 이들이 위상적으로 동위(isotopic)이면서도 연속적인 knotting에 의해 사영적 호몰로지 대칭성이 점차 제거됨을 보인다. 또한 쌍곡 기하를 이용하여 smooth 및 위상적 확장 가능 mapping class group이 모두 자명한 양의 종수의 전측지 곡면(totally geodesic surface)을 구성한다.", "technique": "반복적 rim surgery와 상대 Seiberg-Witten 불변량의 Newton polytope의 볼록 기하, 그리고 쌍곡 기하를 결합하여 projectively rigid 곡면을 구성한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2607.27535v1", "title": "Universal topological statistics on triangulated singular spaces", "authors": ["Uzu Lim", "Omer Bobrowski", "Primoz Skraba"], "abstract": "We prove a universality theorem for random persistent homology over a class of triangulable spaces. More precisely, let $M \\subset \\mathbb{R}^D$ be a compact $C^2$-triangulable space satisfying a geometric quality condition and let $f: M \\to \\mathbb{R}$ be a probability density. Then the expected persistence ratio measure computed from the Čech or Vietoris-Rips complex of a Poisson point process with intensity $nf$ has a universal limit independent of $(M, f)$. Since smooth manifolds, algebraic varieties, semialgebraic sets and Whitney stratified spaces are all triangulable spaces, our theorem applies to a large class of non-Euclidean spaces. Beyond persistent homology, our proof covers a general class of scale-invariant functionals. It relies on a geometric transfer method that adapts constructions in Euclidean space to triangulable spaces through successive approximations by Freudenthal-Kuhn triangulations, and control of interference across singular strata.", "categories": ["math.PR", "math.AT"], "primary_category": "math.PR", "published": "2026-07-30T00:07:55+00:00", "updated": "2026-07-30T00:07:55+00:00", "abs_url": "http://arxiv.org/abs/2607.27535v1", "pdf_url": "https://arxiv.org/pdf/2607.27535v1", "journal_ref": "", "doi": "", "comment": "First upload", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 삼각화 가능 공간에서의 랜덤 퍼시스턴트 호몰로지의 보편성 정리를 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "본 논문은 컴팩트 $C^2$-삼각화 가능 공간 $M \\subset \\mathbb{R}^D$ 위에서 강도 $nf$인 Poisson 점 과정의 Čech 또는 Vietoris-Rips 복합체로부터 계산된 기대 퍼시스턴스 비율 측도(persistence ratio measure)가 $(M, f)$에 무관한 보편적 극한을 가짐을 증명한다. 매끄러운 다양체, 대수적 다양체, 반대수적 집합, Whitney 층화 공간 등 광범위한 비유클리드 공간에 적용된다. 증명은 Freudenthal-Kuhn 삼각화를 통한 기하학적 전이 방법(geometric transfer method)과 특이 층(singular strata) 간 간섭 제어에 기반한다.", "technique": "Freudenthal-Kuhn 삼각화를 이용한 기하학적 전이 방법으로 유클리드 공간의 구성을 삼각화 가능 공간에 적응시키고, 특이 층 간의 간섭을 제어하는 연속적 근사 기법을 사용한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.03635v1", "title": "Lattice polytopes of large width have real-rooted Ehrhart $h^*$-polynomials", "authors": ["Benjamin Nill"], "abstract": "In this note we prove that in fixed dimension the Ehrhart $h^*$-polynomial of a lattice polytope of sufficiently large lattice width is real-rooted. In particular, this implies strict log-concavity and unimodality of the $h^*$-vector and answers a question of Averkov, Hofscheier and the author. For a lattice simplex we prove the analogous statement for its local $h^*$-polynomial, also called box polynomial. The proofs were found using ChatGPT 5.6 Sol and follow essentially directly from a result by Basu and Oertel that for large enough lattice width counting lattice points approximates the volume.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-04T13:19:26+00:00", "updated": "2026-08-04T13:19:26+00:00", "abs_url": "http://arxiv.org/abs/2608.03635v1", "pdf_url": "https://arxiv.org/pdf/2608.03635v1", "journal_ref": "", "doi": "", "comment": "5 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 격자 다면체의 Ehrhart $h^*$-다항식의 실근성(real-rootedness)에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 고정된 차원에서 충분히 큰 격자 너비(lattice width)를 가진 격자 다면체의 Ehrhart $h^*$-다항식이 실근(real-rooted)임을 증명한다. 이는 $h^*$-벡터의 엄격한 로그-오목성(strict log-concavity)과 단조성(unimodality)을 함의하며, Averkov, Hofscheier 및 저자의 질문에 답한다. 격자 단체(lattice simplex)의 경우 국소 $h^*$-다항식(box polynomial)에 대해서도 유사한 결과를 증명한다.", "technique": "격자 너비가 충분히 크면 격자점 개수가 부피를 근사한다는 Basu-Oertel의 결과를 핵심적으로 활용하며, 증명은 ChatGPT 5.6 Sol의 도움으로 발견되었다고 명시되어 있다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.03575v1", "title": "A Gauss-Bonnet-Type Dichotomy for Unimodular Random Infinite Trivalent Hyperbolic Polyhedra", "authors": ["Huabin Ge", "Yangxiang Lu", "Chuwen Wang", "Tian Zhou"], "abstract": "We develop a unified geometric and probabilistic theory of conformal type for unimodular random infinite trivalent hyperbolic polyhedra in $\\mathbb{H}^3$. By corresponding these with dual angled disk triangulations and regular circle patterns, we associate to each face an intrinsic geometric characteristic number $L_f(P)$, determined entirely by local dihedral geometry. For the root face $f$, we establish the unimodular Gauss-Bonnet formula $\\mathbb{E}[L_f(P)] = 2π- (π/3)\\mathbb{E}[deg(f)]$. Under natural tameness and admissibility assumptions, this yields a sharp dichotomy: a unimodular random trivalent hyperbolic polyhedron is parabolic precisely when $\\mathbb{E}[L_f(P)] = 0$, and hyperbolic when $\\mathbb{E}[L_f(P)] < 0$. Thus, global conformal type is governed by the expectation of a local geometric quantity.   We also investigate the approximation of infinite polyhedra by finite ones. We prove that every admissible Benjamini-Schramm limit of uniformly face-rooted finite trivalent hyperbolic polyhedra is necessarily parabolic, revealing a geometric and topological obstruction to the existence of hyperbolic unimodular polyhedral limits.   To study stochastic behavior in the hyperbolic regime, we overcome the failure of classical circle packing tools for unbounded degrees by establishing a refined ring lemma for regular circle patterns. This yields effective exponential control of adjacent circle radii via local flower degrees. Combined with boundary methods, we identify the Poisson boundary with the circle at infinity and prove positive hyperbolic speed for the face random walk. These results provide the first quantitative framework connecting local three-dimensional dihedral geometry, global conformal type, and asymptotic stochastic behavior of unimodular random infinite hyperbolic polyhedra.", "categories": ["math.PR", "math.DG", "math.GT"], "primary_category": "math.PR", "published": "2026-08-04T12:32:41+00:00", "updated": "2026-08-04T12:32:41+00:00", "abs_url": "http://arxiv.org/abs/2608.03575v1", "pdf_url": "https://arxiv.org/pdf/2608.03575v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 쌍곡 다면체의 등각 유형(conformal type)과 확률론적 거동에 관한 것으로, McMullen 문제(볼록 위치 점 배치, oriented matroid, 실현 가능성)와 직접적 관련이 없다.", "summary": "이 논문은 $\\mathbb{H}^3$에서의 unimodular random infinite trivalent hyperbolic polyhedra에 대해 unimodular Gauss-Bonnet 공식 $\\mathbb{E}[L_f(P)] = 2\\pi - (\\pi/3)\\mathbb{E}[\\deg(f)]$를 확립하고, 이를 통해 포물형(parabolic)과 쌍곡형(hyperbolic)의 sharp dichotomy를 증명한다. 또한 유한 다면체의 Benjamini-Schramm 극한은 반드시 포물형임을 보이며, refined ring lemma를 통해 Poisson 경계를 무한원에서의 원으로 동정하고 면 랜덤 워크의 양의 쌍곡 속도를 증명한다.", "technique": "dual angled disk triangulation 및 regular circle pattern을 활용한 국소 이면각 기하학 분석, refined ring lemma, Benjamini-Schramm 극한 이론.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.03305v1", "title": "Width distributions for rectangular boxes", "authors": ["Omri Abas"], "abstract": "For a rectangular box with edges $a_1,a_2,a_3$, the width in a uniform random direction $u \\in S^2$ is $w=\\sum_i a_i|u_i|$. Under a bijective change of parameters this is also the projected area of a rectangular parallelepiped, whose distribution was derived by Walters. We give a direct co-area derivation that recasts the law as one global positive-part formula and integrates it to an elementary closed cumulative distribution function.   The density is real-analytic except at the edge lengths, face diagonals and space diagonal. We classify every singularity as a corner, square-root fold, superposition or terminal jump and compute its coefficient. A Gaussian representation gives all moments from one generating function. The degree of the $n$th cumulant in $π^{-1}$ is exactly $\\lfloor n/2 \\rfloor$; at every order the mean-normalised cumulant is a polynomial in two scale-invariant combinations of the intrinsic volumes, with explicit formulas given through fifth order. The first three cumulants determine the box, and we characterise the admissible triples.   Beyond boxes, intrinsic volumes determine neither width variance nor brightness variance. The sign-pattern representation extends to bodies whose central symmetral is a zonotope, while the cellwise co-area method applies to every full-dimensional polytope.", "categories": ["math.MG", "math.PR"], "primary_category": "math.MG", "published": "2026-08-04T08:14:38+00:00", "updated": "2026-08-04T08:14:38+00:00", "abs_url": "http://arxiv.org/abs/2608.03305v1", "pdf_url": "https://arxiv.org/pdf/2608.03305v1", "journal_ref": "", "doi": "", "comment": "56 pages, 2 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 직육면체(rectangular box)의 너비 분포 및 기하 확률에 관한 것으로, McMullen 문제(볼록 위치·일반 위치 점 배치, oriented matroid)와 직접적인 연관이 없다.", "summary": "직육면체의 균일 랜덤 방향에서의 너비 $w = \\sum_i a_i|u_i|$의 분포를 co-area 공식을 이용해 명시적인 닫힌 형태의 누적분포함수로 유도한다. 밀도 함수의 특이점(모서리 길이, 면 대각선, 공간 대각선)을 분류하고, 가우시안 표현을 통해 모든 모멘트를 하나의 생성함수로 얻으며, $n$번째 누율(cumulant)의 $\\pi^{-1}$ 차수가 정확히 $\\lfloor n/2 \\rfloor$임을 보인다. 또한 처음 세 누율이 직육면체를 결정함을 보이고, 조노토프(zonotope)를 중심 대칭체로 갖는 볼록체로의 확장을 논의한다.", "technique": "co-area 공식(co-area formula)을 이용한 직접 유도 및 가우시안 표현을 통한 모멘트 생성함수 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.02554v1", "title": "Dual volume approximation of the Euclidean ball by polytopes with a fixed number of $k$-faces", "authors": ["Steven Hoehner", "Carsten Schütt", "Elisabeth M. Werner"], "abstract": "We study dual volume approximation of the Euclidean ball by polytopes with a prescribed number of $k$-dimensional faces. This continues the authors' previous work on intrinsic volume approximation of the ball by polytopes with a fixed number of $k$-faces, and develops the corresponding dual radial theory. Our first main result gives a nonasymptotic lower bound for the volume deficit of an inscribed polytope $P_M\\subset B_d$ with at most $M$ $k$-faces, for $0\\leq k\\leq \\lfloor d/2\\rfloor$. The estimate has the form \\[\\operatorname{vol}_d(B_d\\setminus P_M) \\geq \\frac{1-e^{-1}}{2}κ_d\\min\\left\\{ 1,\\frac{d}{2}\\left(\\frac{ω_d}{4κ_{d-1}}\\right)^{\\frac{2}{d-1}} M^{-\\frac{2}{d-1}}\\right\\},\\] and, in the vertices case $k=0$, in the large-$M$ regime it recovers the order of the lower bound of Gordon, Reisner and Schütt (J. Approx. Theory, 1997). We also prove the polar counterpart for the mean width excess of circumscribed polytopes with at most $M$ $k$-faces, for $\\lceil d/2\\rceil-1\\leq k\\leq d-1$. More generally, using the analytic extension of the dual volume deviations introduced by Besau, Hoehner and Kur (Int. Math. Res. Not., 2021), we obtain nonasymptotic lower bounds for all $q\\in\\mathbb R$, including $q=0$, in both the inscribed and circumscribed models.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-03T17:38:29+00:00", "updated": "2026-08-03T17:38:29+00:00", "abs_url": "http://arxiv.org/abs/2608.02554v1", "pdf_url": "https://arxiv.org/pdf/2608.02554v1", "journal_ref": "", "doi": "", "comment": "19 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유클리드 볼의 폴리토프 근사(dual volume, intrinsic volume)를 다루는 볼록 기하 분석 논문으로, McMullen 문제나 Larman 추측과 직접적 관련이 없다.", "summary": "이 논문은 $k$-면의 수가 고정된 폴리토프로 유클리드 볼 $B_d$를 근사할 때의 dual volume 편차에 대한 비점근적 하한을 확립한다. 내접 폴리토프 $P_M \\subset B_d$의 부피 결손에 대해 $M$과 $d$에 명시적으로 의존하는 하한을 제시하며, $k=0$(꼭짓점) 경우에는 Gordon–Reisner–Schütt(1997)의 결과의 차수를 회복한다. 또한 Besau–Hoehner–Kur(2021)의 dual volume deviation의 해석적 확장을 이용해 $q \\in \\mathbb{R}$ 전체에 대한 하한을 내접·외접 모델 양쪽에서 도출한다.", "technique": "dual radial 이론과 dual volume deviation의 해석적 확장을 결합하여 비점근적 하한을 유도.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.01444v1", "title": "Which Holonomy Signatures Are Realizable? A Complete Answer for Closed Surfaces", "authors": ["Leyi Zhu"], "abstract": "A seamless parametrization of a closed oriented surface carries a discrete invariant, its holonomy signature: the cone angles, all multiples of $π/2$, together with the rotational holonomy $ρ\\colon H_1(M\\setminus C)\\to\\mathbb{Z}_4$ of the induced cross field. This is the datum a quadrangulation prescribes, and it decides whether any parametrization exists at all. Shen, Zhu, Capouellez, Panozzo, Campen and Zorin asked which signatures occur and gave a sufficient condition of gcd type; which signatures are realizable has remained open.   We answer the question. A Reduction Lemma shows that the mapping class group acts on signatures with fixed cone angles with orbits classified by the subgroup $\\mathrm{im}\\,ρ\\le\\mathbb{Z}_4$ alone, so at most three cases survive per angle multiset instead of $4^{2g}$. A dictionary then identifies seamless parametrizations with meromorphic 4-differentials, under which $\\mathrm{im}\\,ρ$ measures primitivity, and realizability becomes non-emptiness of a stratum of primitive $k$-differentials with $k=4/d$ and $\\mathrm{im}\\,ρ=\\langle d\\rangle$. Unwinding this against the known classification of such strata leaves exactly five exceptional families; every other admissible signature is realizable, in every genus. Two of the five appear to be new, and both live in genus two. Four of the five lie outside the gcd condition, and the whole region it leaves open is settled here.   The non-emptiness half is made constructive by an explicit one-vertex square-tiled surface in every genus together with a local surgery that splits one cone into two of prescribed angles, leaving the genus, the other cones and $\\mathrm{im}\\,ρ$ untouched. Two extensions follow: surfaces with boundary, the feature-aligned setting, and the relation to the Abel-Jacobi criterion at a fixed conformal structure.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-08-02T18:55:59+00:00", "updated": "2026-08-02T18:55:59+00:00", "abs_url": "http://arxiv.org/abs/2608.01444v1", "pdf_url": "https://arxiv.org/pdf/2608.01444v1", "journal_ref": "", "doi": "", "comment": "28 pages, 7 figures, 2 tables", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 곡면의 매끄러운 매개변수화(seamless parametrization)와 holonomy signature의 실현 가능성을 다루는 기하위상학 논문으로, McMullen 문제나 oriented matroid와 전혀 무관하다.", "summary": "닫힌 방향 가능 곡면의 seamless parametrization이 갖는 holonomy signature(원뿔 각도와 회전 holonomy $\\rho: H_1(M\\setminus C)\\to\\mathbb{Z}_4$)의 실현 가능성 문제를 완전히 해결한다. Mapping class group의 작용을 통한 Reduction Lemma로 경우의 수를 $4^{2g}$에서 최대 3가지로 줄이고, seamless parametrization을 유리형 4-미분형식(meromorphic 4-differentials)과 동일시하여 primitive $k$-differential의 stratum 비공성(non-emptiness) 문제로 환원한다. 그 결과 정확히 다섯 개의 예외 족(exceptional families)을 제외한 모든 허용 가능한 signature가 모든 genus에서 실현 가능함을 증명한다.", "technique": "Mapping class group 작용에 의한 Reduction Lemma, seamless parametrization과 primitive $k$-differential stratum의 동일시, 그리고 one-vertex square-tiled surface와 국소 수술(local surgery)을 이용한 구성적 증명.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2608.01156v1", "title": "The Uniform Gromov Hausdorff Gap Problem for Approximating Spheres by Finite Homogeneous Spaces", "authors": ["Itai Benjamini"], "abstract": "Let $S^n$ be the unit round sphere with its intrinsic angular metric, normalized so that $\\operatorname{diam}S^n=π$. For finite homogeneous metric spaces $X$, put \\[   δ_n=\\inf_X d_{GH}(X,S^n). \\] The main open problem is whether $\\inf_{n\\ge2}δ_n>0$. Gelander's theorem gives $δ_n>0$ in each fixed dimension, but not uniformly. An abstract cross-polytope construction gives the universal upper bound $δ_n\\leπ/4$. In the opposite direction, ChatGPT combines the passage from small Gromov--Hausdorff error to an approximate finite action on the sphere, logarithmic stability of approximate inner-product-preserving maps due to Cuesta, operator-norm stability of almost representations, and Green's width theorem for finite transitive sets. This gives the quantitative bound \\[   δ_n\\ge \\frac{c}{(1+\\log(n+1))^2} \\] for all sufficiently large $n$.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-02T11:27:39+00:00", "updated": "2026-08-02T11:27:39+00:00", "abs_url": "http://arxiv.org/abs/2608.01156v1", "pdf_url": "https://arxiv.org/pdf/2608.01156v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 구면(sphere)을 유한 동차 거리 공간으로 근사하는 Gromov–Hausdorff 간격 문제를 다루며, McMullen 문제나 oriented matroid·점 배치와 직접적인 관련이 없다.", "summary": "단위 구면 $S^n$을 유한 동차 거리 공간으로 근사할 때의 Gromov–Hausdorff 거리 하한 $\\delta_n = \\inf_X d_{GH}(X, S^n)$이 차원 $n$에 대해 균일하게 양수인지($\\inf_{n\\ge 2}\\delta_n > 0$)를 묻는 열린 문제를 다룬다. 상한으로는 cross-polytope 구성으로 $\\delta_n \\le \\pi/4$가 알려져 있고, 하한으로는 근사 내적 보존 사상의 로그 안정성, 거의 표현의 연산자 노름 안정성, Green의 유한 추이 집합 너비 정리를 결합하여 충분히 큰 $n$에 대해 $\\delta_n \\ge \\frac{c}{(1+\\log(n+1))^2}$를 증명한다.", "technique": "근사 유한 군작용과 내적 보존 사상의 로그 안정성(Cuesta), 거의 표현의 연산자 노름 안정성, Green의 너비 정리를 결합한 정량적 하한 도출.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.10516v1", "title": "Richardson volume models for skew Schur and skew Schur $P/Q$-functions", "authors": ["Khai-Hoan Nguyen-Dang"], "abstract": "We identify ordinary skew Schur polynomials and skew Schur $P$-functions as top-degree total-Chern intersection polynomials on Richardson varieties in ordinary and Lagrangian Grassmannians. We then obtain that $\\mathcal N(s_{λ/μ})$, $\\mathcal N(P_{λ/μ})$, $\\mathcal N(Q_{λ/μ})$ are realizable volume polynomials. This settles the skew-Schur and Schur-$P$ Lorentzian conjectures of Huh--Matherne--Mészáros--St.~Dizier and strengthens the latter to arbitrary skew $P/Q$-functions.   The construction extends to cycle transforms attached to arbitrary irreducible subvarieties of ordinary and Lagrangian Grassmannians. We obtain reverse Khovanskii--Teissier inequalities for ordinary and shifted tableau multiplicities, Hessian-signature and principal-minor inequalities, root-direction log-concavity, and dominance monotonicity of coefficients toward balanced contents. We also prove ultra-log-concavity of weighted block aggregates and a diagonal covariance bound for factorially tilted content distributions. We determine the exact skew-Schur support permutahedron and its extremal coefficients, recover the known straight Schur-$P/Q$ support polytopes and identify their vertex coefficients in the present framework, and prove log-concavity for cumulative two-row ordinary Littlewood--Richardson coefficients and for weighted cumulative two-row shifted Littlewood--Richardson coefficients.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-11T05:40:40+00:00", "updated": "2026-08-11T05:40:40+00:00", "abs_url": "http://arxiv.org/abs/2608.10516v1", "pdf_url": "https://arxiv.org/pdf/2608.10516v1", "journal_ref": "", "doi": "", "comment": "Preliminary version. Comments welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Richardson variety, skew Schur 함수, Lorentzian 다항식에 관한 것으로 McMullen 문제(d=5)나 oriented matroid와 전혀 무관하다.", "summary": "이 논문은 ordinary 및 Lagrangian Grassmannian의 Richardson variety 위 top-degree total-Chern 교차 다항식으로 skew Schur 다항식과 skew Schur $P$-함수를 동일시하고, $\\mathcal{N}(s_{\\lambda/\\mu})$, $\\mathcal{N}(P_{\\lambda/\\mu})$, $\\mathcal{N}(Q_{\\lambda/\\mu})$가 실현 가능한 volume polynomial임을 증명한다. 이를 통해 Huh–Matherne–Mészáros–St. Dizier의 skew-Schur 및 Schur-$P$ Lorentzian 추측을 해결하고, 역 Khovanskii–Teissier 부등식, ultra-log-concavity, Littlewood–Richardson 계수의 log-concavity 등 여러 조합론적·대수기하학적 결과를 얻는다.", "technique": "Grassmannian 및 Lagrangian Grassmannian의 Richardson variety에서 total-Chern class의 교차 이론을 활용하여 skew Schur 함수를 volume polynomial로 실현.", "connections": "", "keyword_hits": ["realizab", "tope"], "source": "filter"}, {"id": "2608.13247v1", "title": "Gamma-positivity for octopuses: a bijective proof", "authors": ["Krishna Menon"], "abstract": "Chapoton introduced an interesting family of polytopes called arbor polytopes, where a polytope $\\mathcal{Q}_τ$ is associated to any arbor $τ$. Chapoton conjectured that the polynomial $h(τ)$ which counts lattice points in $\\mathcal{Q}_τ$ by number of nonzero entries is palindromic and unimodal. Athanasiadis, Xiao, and Yan recently proved that $h(τ)$ is gamma-positive for a certain class of arbors they call octopuses. Since their proof was computational, they asked for one that is bijective. We present such a proof. We also extend their results by showing that $h(τ)$ is gamma-positive for a larger class of arbors we call lopsided octopuses.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T13:52:02+00:00", "updated": "2026-08-13T13:52:02+00:00", "abs_url": "http://arxiv.org/abs/2608.13247v1", "pdf_url": "https://arxiv.org/pdf/2608.13247v1", "journal_ref": "", "doi": "", "comment": "7 pages, 2 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 arbor polytope의 격자점 다항식의 gamma-positivity에 관한 것으로, McMullen 문제(d=5, oriented matroid, convex/general position 점 배치)와 직접적인 관련이 없다.", "summary": "Chapoton이 도입한 arbor polytope $\\mathcal{Q}_\\tau$에서 격자점을 세는 다항식 $h(\\tau)$의 gamma-positivity를 다루는 논문이다. Athanasiadis, Xiao, Yan이 octopus라 불리는 특정 arbor 클래스에 대해 계산적 방법으로 증명한 결과에 대해, 전사적(bijective) 증명을 제시한다. 나아가 lopsided octopus라는 더 넓은 클래스로 결과를 확장한다.", "technique": "전사적 증명(bijective proof)을 통해 gamma-positivity를 확립하고 결과를 lopsided octopus 클래스로 일반화.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.13241v1", "title": "Reconstructing Turaev--Viro Invariants from Four-Fold Simple Branched Covering Presentations", "authors": ["Eri Hatakenaka"], "abstract": "We construct a finite state sum from a link diagram labelled by transpositions. The diagram presents a closed 3-manifold as a four-fold simple branched cover, and the state sum equals the SU(2)-type Turaev--Viro invariant of that manifold. For each admissible colouring of the diagram's edges and complementary regions, a global factor is combined with crossing weights obtained by summing over compatible local colourings. We then sum these products over all diagram colourings. The formula is proved by assembling crossing-wise local triangulations and matching the two state sums.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-08-13T13:45:35+00:00", "updated": "2026-08-13T13:45:35+00:00", "abs_url": "http://arxiv.org/abs/2608.13241v1", "pdf_url": "https://arxiv.org/pdf/2608.13241v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 3-다양체의 Turaev–Viro 불변량을 4겹 단순 분기 피복으로 재구성하는 위상수학 연구로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "링크 다이어그램에 전치(transposition) 라벨을 부여하여 닫힌 3-다양체를 4겹 단순 분기 피복으로 표현하고, 이 다이어그램으로부터 유한 상태합(finite state sum)을 구성한다. 이 상태합이 해당 3-다양체의 SU(2)-형 Turaev–Viro 불변량과 일치함을 증명한다. 증명은 교차점별(crossing-wise) 국소 삼각분할을 조립하여 두 상태합을 대응시키는 방식으로 이루어진다.", "technique": "링크 다이어그램의 변(edge)과 보완 영역에 허용 가능한 채색(admissible colouring)을 부여하고, 교차점별 국소 채색 합산을 통해 전역 인수와 교차 가중치를 결합하는 유한 상태합 공식을 구성한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.12731v1", "title": "The multiplicity sequence of monomial ideals", "authors": ["Sudipta Das", "Jonathan Montaño", "Aniketh Sivakumar"], "abstract": "We give a convex-geometric formula for the multiplicity sequence of a monomial ideal in terms of mixed volumes of polytopes constructed from its Newton polyhedron. We also construct a counterexample to a conjecture of Achilles and Manaresi proposing a different volume formula for the multiplicity sequence. Finally, we derive a mixed-volume formula for the mixed multiplicities of arbitrary monomial ideals.", "categories": ["math.AC", "math.CO"], "primary_category": "math.AC", "published": "2026-08-13T02:23:26+00:00", "updated": "2026-08-13T02:23:26+00:00", "abs_url": "http://arxiv.org/abs/2608.12731v1", "pdf_url": "https://arxiv.org/pdf/2608.12731v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 단항식 아이디얼(monomial ideal)의 multiplicity sequence와 혼합부피(mixed volume) 공식에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 단항식 아이디얼의 multiplicity sequence를 Newton 다면체(Newton polyhedron)로부터 구성된 볼록다면체(polytope)들의 혼합부피(mixed volume)를 이용해 계산하는 볼록기하학적 공식을 제시한다. 또한 Achilles와 Manaresi가 제안한 multiplicity sequence에 대한 다른 부피 공식 추측의 반례를 구성한다. 아울러 임의의 단항식 아이디얼의 혼합 중복도(mixed multiplicity)에 대한 혼합부피 공식도 유도한다.", "technique": "Newton 다면체에서 구성된 볼록다면체들의 혼합부피(mixed volume)를 핵심 도구로 사용하는 볼록기하학적 접근법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.12668v1", "title": "Torsion in skein modules and shared knot surgeries", "authors": ["Efstratia Kalfagianni"], "abstract": "For every $g>0$, we construct a closed Haken 3-manifold $M_g$, whose only connected, incompressible surface is a non-separating surface of genus $g$ and discuss the torsion behavior of the Kauffman bracket skein module $§(M_g,\\Z[A^{\\pm 1}])$. We also use properties of shared surgeries between knots to estimate (and often compute) the dimension of the Kauffman bracket skein module over $\\Q(A)$, for families of hyperbolic 3-manifolds obtained by surgery on double twist knots. We have similar computations for some surgeries on several knot complements in the SnapPy census of cusped hyperbolic manifolds with triangulations up to 9 tetrahedra.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-08-12T23:59:59+00:00", "updated": "2026-08-12T23:59:59+00:00", "abs_url": "http://arxiv.org/abs/2608.12668v1", "pdf_url": "https://arxiv.org/pdf/2608.12668v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 3-다양체의 스케인 모듈(skein module)과 매듭 수술(knot surgery)에 관한 위상수학 연구로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "모든 $g>0$에 대해 비분리 종수 $g$ 곡면만을 연결된 비압축 곡면으로 갖는 닫힌 Haken 3-다양체 $M_g$를 구성하고, $\\mathcal{S}(M_g, \\mathbb{Z}[A^{\\pm 1}])$의 비틀림(torsion) 거동을 분석한다. 또한 이중 꼬임 매듭(double twist knot)의 수술로 얻어지는 쌍곡 3-다양체 족에 대해 공유 수술(shared surgeries) 성질을 활용하여 $\\mathbb{Q}(A)$ 위에서의 Kauffman bracket 스케인 모듈의 차원을 추정·계산한다. SnapPy 센서스의 최대 9개 사면체 삼각분할을 갖는 여러 매듭 여공간의 수술에 대해서도 유사한 계산을 수행한다.", "technique": "공유 수술(shared surgeries) 성질과 Kauffman bracket 스케인 모듈의 대수적 분석을 결합하여 쌍곡 3-다양체의 스케인 모듈 차원을 계산한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.11921v1", "title": "Products of Two Integers Avoiding Perfect Powers", "authors": ["Quan-Hui Yang", "Lilu Zhao"], "abstract": "For integers $d\\geq 3$, let $F_{2,d}(n)$ be the largest size of a subset of $[n]$ containing no two distinct elements whose product is a perfect $d$-th power, and let $f_{2,d}(n)$ denote the analogous quantity when the two elements need not be distinct. Fleiner, Juhász, Kövér, Pach, and Sándor proved that both complements have order $n^{2/3}$ when $d=3$, and asked for a leading constant. They also asked whether, more generally, $n-F_{k,d}(n)$ and $n-f_{k,d}(n)$ have order $n^{k/d}$ for $1<k<d$.   We establish asymptotic formula in the case $k=2$ for every fixed $d\\geq3$, \\[   n-F_{2,d}(n)\\sim n-f_{2,d}(n)   \\sim C_d\\, n^{2/d}(\\log n)^{d-3}, \\] where $C_d>0$ is given explicitly by an Euler product and a polytope volume. In particular, the extra logarithmic factor gives a negative answer to the second question for every $d\\geq4$. For $d=3$ we obtain \\[   C_3=\\frac{π^2}{4}   \\prod_p\\left(1-\\frac3{p^2}+\\frac2{p^3}\\right), \\] which answers the first question. The proof uses an exact decomposition into complementary $d$-free kernel classes, a squarefree sieve in multiplicative boxes, and a two-height polytope calculation.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-12T11:04:43+00:00", "updated": "2026-08-12T11:04:43+00:00", "abs_url": "http://arxiv.org/abs/2608.11921v1", "pdf_url": "https://arxiv.org/pdf/2608.11921v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 완전제곱수 회피 집합의 점근 공식을 다루는 수론·조합론 문제로, McMullen 문제(볼록 위치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "정수 $d\\geq 3$에 대해, 두 원소의 곱이 완전 $d$제곱수가 되지 않는 $[n]$의 최대 부분집합 크기 $F_{2,d}(n)$의 점근 공식 $n - F_{2,d}(n) \\sim C_d\\, n^{2/d}(\\log n)^{d-3}$을 모든 고정된 $d\\geq 3$에 대해 확립한다. 특히 $d\\geq 4$일 때 여분의 로그 인수가 등장함을 보여 Fleiner 등의 질문에 부정적 답을 주고, $d=3$의 경우 선행 상수 $C_3 = \\frac{\\pi^2}{4}\\prod_p\\left(1-\\frac{3}{p^2}+\\frac{2}{p^3}\\right)$을 명시적으로 결정한다.", "technique": "보수적 $d$-free 커널 클래스의 정확한 분해, 곱셈 상자에서의 제곱자유 체(squarefree sieve), 두 높이(two-height) 다면체 부피 계산을 결합하여 증명한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.11570v1", "title": "Minkowski Polytopes of Spherical Designs: High-Order Isotropy and Quantitative Sphericity", "authors": ["Congpei An"], "abstract": "Let $X_N=\\{x_1,\\dots,x_N\\}\\subset \\Sph^2$ be a spherical $t$-design of strength $t\\ge2$, and let $μ_X$ be its empirical measure. Minkowski's theorem associates with $X_N$ a convex polytope $P_X\\subset\\R^3$, unique up to translation, whose facet normals are the design nodes and whose facets all have area $4π/N$; equivalently, $S_{P_X}=4πμ_X$. We show that this realization transfers polynomial exactness into exact convex geometry: the normalized surface tensors of $P_X$ agree with those of the unit ball through order $t$, and mixed volumes are exact against convex bodies whose support functions are spherical polynomials of degree at most $t$.   We next derive quantitative shape information. Spherical Jackson approximation yields a $1$-Wasserstein discrepancy $W_1(μ_X,σ)=O(t^{-1})$, while degree-two exactness gives a uniform nondegeneracy condition. Combined with quantitative inverse stability for Minkowski's problem, this implies, after Steiner normalization, \\[ d_H(P_X,B)=O(t^{-1/2}),\\qquad α(P_X,B)=O(t^{-3/4}), \\] for every spherical $t$-design, without assumptions on cardinality, separation, covering radius, or spectral conditioning. Projection bodies retain the full $O(t^{-1})$ scale, separating linear surface-area observables from nonlinear reconstruction of the body. In the critical regime $N=(t+1)^2$, a uniform spectral lower bound for the sampling Gram matrix further forces the facet normals to be separated at the wavelength scale $t^{-1}$. The construction extends to $\\Sph^d$, with the universal Hausdorff rate $O(t^{-1/d})$.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-12T02:29:17+00:00", "updated": "2026-08-12T02:29:17+00:00", "abs_url": "http://arxiv.org/abs/2608.11570v1", "pdf_url": "https://arxiv.org/pdf/2608.11570v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 구면 디자인(spherical designs)과 민코프스키 다면체의 정량적 구형성(quantitative sphericity)을 다루며, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "구면 $t$-디자인 $X_N \\subset S^2$에 민코프스키 정리를 적용하여 연관된 볼록 다면체 $P_X$를 구성하고, 이 다면체의 정규화된 표면 텐서가 단위 구의 것과 차수 $t$까지 일치함을 보인다. 구면 Jackson 근사와 민코프스키 문제의 정량적 역안정성을 결합하여 $d_H(P_X, B) = O(t^{-1/2})$, $\\alpha(P_X, B) = O(t^{-3/4})$를 카디널리티나 분리 조건 없이 도출한다. 결과는 $S^d$로 일반화되며 보편적 하우스도르프 수렴율 $O(t^{-1/d})$를 제공한다.", "technique": "구면 Jackson 근사에 의한 $1$-Wasserstein 불일치 추정과 민코프스키 문제의 정량적 역안정성 이론을 결합하여 다면체의 정량적 구형성 경계를 유도한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.10994v1", "title": "A connection between the Mahler conjecture and floating bodies", "authors": ["Agam Guberman"], "abstract": "In this paper, we will prove a result about the structure of polytopes whose floating bodies are not smooth. This will then be used to prove a result about the combinatorial structure of minimizers of the volume product.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-11T14:47:14+00:00", "updated": "2026-08-11T14:47:14+00:00", "abs_url": "http://arxiv.org/abs/2608.10994v1", "pdf_url": "https://arxiv.org/pdf/2608.10994v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Mahler 추측(볼륨 곱의 최솟값)과 floating body의 구조에 관한 것으로, McMullen 문제(d=5, oriented matroid, 점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 floating body가 매끄럽지 않은 폴리토프(polytope)의 구조에 관한 결과를 증명한다. 이를 바탕으로 볼륨 곱(volume product)의 최솟값의 조합론적 구조에 대한 결과를 도출한다. 이는 Mahler 추측과의 연결을 탐구하는 맥락에서 이루어진다.", "technique": "floating body의 비매끄러움(non-smoothness) 조건을 이용하여 폴리토프의 구조를 분석하고, 이를 볼륨 곱 최솟값의 조합론적 특성 규명에 적용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.10772v1", "title": "Differential equations for bipartite maps with bounded face degrees", "authors": ["Valentin Bonzom"], "abstract": "In recent years, integrable hierarchies have been used to great advantage for the enumeration of combinatorial maps. They have led to recurrence formulas with respect to the size and genus of the maps, e.g. for triangulations, bipartite quadrangulations and bipartite maps, and for constellations. These formulas are not only remarkably simple but also provide the fastest way of calculating these numbers of maps. With the exception of Louf's work on constellations, it has however remained a challenge to obtain recurrence formulas that control the degrees of the faces of the maps. Here we show how to achieve this for bipartite maps with bounded face degrees. By combining equations from the KP hierarchy and from the Virasoro constraints, a differentially algebraic system is obtained. It couples the generating functions of bipartite maps with bounded root face degrees while controlling the numbers of edges, black vertices, white vertices and number of faces of each degree (and in particular the genus). Finally, this system of ODEs is shown to give recurrence formulas that allows to calculate all the corresponding numbers of maps.", "categories": ["math.CO", "nlin.SI"], "primary_category": "math.CO", "published": "2026-08-11T10:26:18+00:00", "updated": "2026-08-11T10:26:18+00:00", "abs_url": "http://arxiv.org/abs/2608.10772v1", "pdf_url": "https://arxiv.org/pdf/2608.10772v1", "journal_ref": "", "doi": "", "comment": "24 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 이분 지도(bipartite maps)의 열거론에 관한 것으로, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 직접적인 관련이 없다.", "summary": "이 논문은 KP 계층(KP hierarchy)과 Virasoro 제약(Virasoro constraints)을 결합하여 면의 차수(face degree)가 유계인 이분 지도(bipartite maps with bounded face degrees)의 생성함수를 지배하는 미분대수적(differentially algebraic) 연립방정식을 도출한다. 이 ODE 시스템은 변(edge) 수, 흑·백 꼭짓점 수, 각 차수별 면의 수(genus 포함)를 동시에 제어하는 점화식을 제공한다. 결과적으로 대응하는 모든 지도의 수를 효율적으로 계산할 수 있는 점화 공식이 얻어진다.", "technique": "KP 계층 방정식과 Virasoro 제약을 결합하여 유계 면 차수 이분 지도의 생성함수에 대한 미분대수적 연립 ODE 시스템을 구성한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.10370v1", "title": "Relative Ehrhart theory I: relative Ehrhart eventual polynomials", "authors": ["Takashi Hirotsu"], "abstract": "Classical Ehrhart theory measures the discrete capacity of a convex rational polytope $P$ by counting the number of lattice points in the $t$-th dilate $tP$ of $P$. In this paper, we extend this paradigm by replacing a lattice point with a geometric object $Q$ of dimension at most $\\dim P$. We show that the counting function $\\mathrm{ehr}(P;Q;t)$ of such valid translations of $Q$ into $tP$ inherits eventual quasi-polynomiality (or eventual polynomiality) with leading term $\\mathrm{vol}(P)t^d$, where $d = \\dim P$. This result is naturally derived by induction on the dimension, based on the classical quasi-polynomiality and polynomiality of Ehrhart functions.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-11T02:01:30+00:00", "updated": "2026-08-11T02:01:30+00:00", "abs_url": "http://arxiv.org/abs/2608.10370v1", "pdf_url": "https://arxiv.org/pdf/2608.10370v1", "journal_ref": "", "doi": "", "comment": "9 pages, 4 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Ehrhart 이론의 확장(격자점 계수 함수의 준다항식성)을 다루며, McMullen 문제나 oriented matroid와 직접적 관련이 없다.", "summary": "이 논문은 고전적 Ehrhart 이론을 확장하여, 격자점 대신 최대 $\\dim P$ 차원의 기하학적 객체 $Q$를 사용해 $tP$ 안에서 $Q$의 유효한 이동 횟수를 세는 함수 $\\mathrm{ehr}(P;Q;t)$를 연구한다. 이 계수 함수가 eventually quasi-polynomial(또는 eventually polynomial)임을 보이며, 최고차 항이 $\\mathrm{vol}(P)t^d$($d=\\dim P$)임을 증명한다. 이 결과는 고전적 Ehrhart 함수의 준다항식성으로부터 차원에 대한 귀납법으로 자연스럽게 도출된다.", "technique": "차원에 대한 귀납법과 고전적 Ehrhart 준다항식성을 활용한 계수 함수의 점근적 다항식성 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.10236v1", "title": "Volumes of consecutively defined sets", "authors": ["Richard Ehrenborg", "Evan Henning"], "abstract": "We study a variant of the graph polytopes of a path and of a cycle where we replace the inequality $x_{i} + x_{i+1} \\leq 1$ with the two inequalities $(1-α) \\cdot x_{i} + α\\cdot x_{i+1} \\leq α$ for $0 \\leq x_{i} \\leq α$ and $α\\cdot x_{i} + (1-α) \\cdot x_{i+1} \\leq α$ for $α\\leq x_{i} \\leq 1$. Using a self-adjoint operator and its eigenvalues we obtain convergent series for their volumes. As a corollary we obtain that the volumes of the set associated to a path on $n$ vertices and the set associated to a cycle on $n+1$ vertices are related by a constant factor of $α$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-10T21:12:53+00:00", "updated": "2026-08-10T21:12:53+00:00", "abs_url": "http://arxiv.org/abs/2608.10236v1", "pdf_url": "https://arxiv.org/pdf/2608.10236v1", "journal_ref": "The Australasian Journal of Combinatorics 96(1) (2026), 38--48", "doi": "", "comment": "9 pages, 1 figure", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프 폴리토프(path/cycle)의 부피를 자기수반 연산자 고유값으로 분석하는 내용으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 path와 cycle의 그래프 폴리토프 변형을 연구하며, 부등식 $x_i + x_{i+1} \\leq 1$을 매개변수 $\\alpha$에 의존하는 두 부등식 쌍으로 대체한 집합의 부피를 분석한다. 자기수반 연산자(self-adjoint operator)와 그 고유값을 활용하여 부피에 대한 수렴 급수를 도출한다. 결론적으로, $n$개 꼭짓점 path에 연관된 집합의 부피와 $n+1$개 꼭짓점 cycle에 연관된 집합의 부피가 $\\alpha$를 인수로 하는 상수 배 관계에 있음을 보인다.", "technique": "자기수반 연산자(self-adjoint operator)의 고유값(eigenvalue)을 이용한 부피의 수렴 급수 표현.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.08518v1", "title": "Some new results for Andrews' Kimberling partitions", "authors": ["Gaurab Bardhan", "Nipen Saikia"], "abstract": "George E. Andrews (2016) introduced the Kimberling index, $K(π)$, of a partition $π$ of a positive integer $n$, which is defined as   $$K(π) = (\\text{largest part of } π) - (\\text{least part of } π) - (\\text{number of parts of } π).$$   Based on Kimberling index, Andrews defined five partition functions, $K_>(n),$ $K_<(n),$ $K_\\leq(n),$ $K_=(n),$ and $K_\\geq(n)$, called Kimberling partition functions, which count the numbers of partitions of a positive integer $n$ for which the Kimberling index $K(π) $ is $>0$, $<0$, $\\leq0$, $=0$ and $\\geq 0$, respectively. He also gave the generating functions for $K_\\le(n),$ $K_<(n),$ and $K_>(n)$ and established some relations connecting Kimberling partitions and other partition functions. Since then, the Kimberling partition functions and their generating functions remained unexplored. In this paper, we derive generating functions for $K_=(n),$ and $K_\\geq(n)$, and establish some congruence relations of the five Kimberling partition functions by using the method of $q$-series identities.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-08-09T06:33:00+00:00", "updated": "2026-08-09T06:33:00+00:00", "abs_url": "http://arxiv.org/abs/2608.08518v1", "pdf_url": "https://arxiv.org/pdf/2608.08518v1", "journal_ref": "", "doi": "", "comment": "20 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 분할 함수(partition functions)의 생성함수와 합동식을 다루는 조합론 연구이며, McMullen's problem이 다루는 볼록위치 점 배치, oriented matroid, 실현가능성 등과는 직접적 관련이 없습니다.", "summary": "Andrews의 Kimberling 지수를 이용한 분할 함수 5개를 연구합니다. 본 논문은 $K_=(n)$과 $K_\\geq(n)$의 생성함수를 유도하고, $q$-급수 항등식을 이용하여 다섯 Kimberling 분할 함수들 사이의 합동식 관계를 수립합니다.", "technique": "$q$-급수 항등식을 활용한 생성함수 유도 및 합동식 증명", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.16861v1", "title": "The canonical facets of multi-separator polytopes", "authors": ["Bjoern Andres", "Silvia Di Gregorio", "Jannik Irmai", "Lucas Fabian Naumann", "Shengxian Zhao"], "abstract": "We initiate a polyhedral study of the graph multi-separator problem proposed by Irmai et al. (2024) as an alternative to the lifted multicut problem for application to the task of image segmentation. Starting with an integer linear program (ILP) formulation and the multi-separator polytope spanned by its feasible solutions, we characterize in terms of efficiently-decidable, graph-theoretic conditions all facets induced by inequalities of the ILP. We proceed by strengthening these inequalities and describing additional facets of some multi-separator polytopes induced by the stronger inequalities. Specifically, we obtain a totally dual integral description of the multi-separator polytope for paths in the case where separation is considered for all vertex pairs. Finally, we relate the multi-separator polytope to the boolean quadric polytope, showing that facets induced by odd-cycle inequalities do not transfer generally, and to the lifted multicut polytope, showing that either polytope is a projection of a face of the other.", "categories": ["cs.DM", "cs.LG", "math.CO"], "primary_category": "cs.DM", "published": "2026-08-17T17:44:39+00:00", "updated": "2026-08-17T17:44:39+00:00", "abs_url": "http://arxiv.org/abs/2608.16861v1", "pdf_url": "https://arxiv.org/pdf/2608.16861v1", "journal_ref": "", "doi": "", "comment": "49 pages, 19 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 그래프 multi-separator 문제의 다면체 연구(polyhedral study)로, McMullen 문제·Larman 추측·oriented matroid 등과 직접적 관련이 없다.", "summary": "본 논문은 이미지 분할(image segmentation) 응용을 위한 그래프 multi-separator 문제의 정수선형계획(ILP) 정식화에서 출발하여 multi-separator polytope의 facet을 그래프-이론적 조건으로 특성화한다. 경로(path) 그래프에서 모든 정점 쌍에 대한 분리를 고려할 때 totally dual integral(TDI) 기술을 얻으며, boolean quadric polytope 및 lifted multicut polytope와의 관계도 규명한다. 특히 각 polytope가 상대방의 face의 projection임을 보인다.", "technique": "ILP 정식화로부터 facet 유도 부등식의 그래프-이론적 특성화, 부등식 강화, TDI 기술, 그리고 odd-cycle 부등식 전이 불가 예시를 통한 관련 polytope 비교.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.16581v1", "title": "Ergodic-transformation centralizers and essentially non-compact graphing symmetry", "authors": ["Alexandru Chirvasitu"], "abstract": "We prove that for every ergodic transformation $T$ on an infinite standard probability space both the automorphism group (i.e. centralizer) $\\mathrm{Aut}(T)$ and its reversing automorphism group are realizable as symmetry groups of graphings. This is an analogue of Sabidussi's realization of arbitrary graph-automorphism groups, and provides numerous examples of graphing automorphism groups carrying no compatible compact topology, answering a question of Lovasz'. Another consequence of discussion and ensuing constructions is the existence of large mutually locally-globally equivalent graphing families with highly variable symmetry.", "categories": ["math.DS", "math.CO", "math.GR"], "primary_category": "math.DS", "published": "2026-08-17T13:46:08+00:00", "updated": "2026-08-17T13:46:08+00:00", "abs_url": "http://arxiv.org/abs/2608.16581v1", "pdf_url": "https://arxiv.org/pdf/2608.16581v1", "journal_ref": "", "doi": "", "comment": "6 pages + references", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 에르고딕 변환의 중심화자(centralizer)와 그래핑(graphing) 대칭군에 관한 연구로, McMullen 문제나 oriented matroid와 전혀 무관하다.", "summary": "이 논문은 무한 표준 확률 공간 위의 임의의 에르고딕 변환 $T$에 대해, 자기동형군(중심화자) $\\mathrm{Aut}(T)$와 역자기동형군이 그래핑의 대칭군으로 실현될 수 있음을 증명한다. 이는 임의의 그래프 자기동형군이 어떤 그래프의 자기동형군으로 실현된다는 Sabidussi 정리의 유사체이며, Lovász의 질문에 답하여 양립하는 컴팩트 위상을 갖지 않는 그래핑 자기동형군의 다수 예시를 제공한다. 또한 대칭성이 크게 다른 대규모 상호 국소-전역 동치 그래핑 족의 존재도 도출된다.", "technique": "에르고딕 변환의 중심화자를 그래핑의 대칭군으로 구성하는 실현 기법을 사용한다.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2608.16037v1", "title": "Counting Lattice Points in Minkowski Sums of Cross Polytopes", "authors": ["Hongyu Wang", "Qilin Hou", "Warut Thawinrak", "Zhiyuan Liu", "Ziyi Dai"], "abstract": "Motivated by Postnikov's study of lattice-point enumeration in Minkowski sums of simplices, we investigate lattice points in Minkowski sums of cross polytopes and establish analogous results, together with several related consequences. In particular, we introduce the support-enumerator associated with Postnikov's notion of draconian sequences and show that it coincides with the $h^*$-polynomial of the corresponding root polytope. This provides a new interpretation of the $h^*$-polynomial and yields a simple method for computing the volume of the corresponding polytope. We further exploit the symmetry of such root polytopes to establish a duality property for support-enumerators, which in turn provides a proof of a conjecture by Chapoton and Athanasiadis concerning the $h$-polynomials of preorders. As an immediate consequence, we prove that a Minkowski sum of cross polytopes and its dual polytope have the same number of lattice points. This duality then leads to a general formula for the number of lattice points in Minkowski sums of cross polytopes in terms of draconian sequences. Our formula enables us to compute the Ehrhart polynomials of these polytopes and show that they are Ehrhart positive. Furthermore, the formula allows us to derive analogous formulas for the number of lattice points on their boundaries and for their surface volumes.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-17T03:03:48+00:00", "updated": "2026-08-17T03:03:48+00:00", "abs_url": "http://arxiv.org/abs/2608.16037v1", "pdf_url": "https://arxiv.org/pdf/2608.16037v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Minkowski 합의 격자점 열거와 Ehrhart 다항식에 관한 것으로, McMullen 문제(d=5에서의 convex/general position 점 배치, oriented matroid)와 직접적인 관련이 없다.", "summary": "이 논문은 cross polytope의 Minkowski 합에서의 격자점 열거를 연구하며, draconian sequence에 연관된 support-enumerator가 대응하는 root polytope의 $h^*$-다항식과 일치함을 보인다. 이를 통해 Chapoton과 Athanasiadis의 preorder의 $h$-다항식에 관한 추측을 증명하고, Minkowski 합과 그 쌍대 다면체가 동일한 격자점 수를 가짐을 보인다. 나아가 이 다면체들의 Ehrhart 다항식을 계산하고 Ehrhart positivity를 확립한다.", "technique": "draconian sequence에 기반한 support-enumerator 도입과 root polytope의 대칭성(duality) 활용을 통한 격자점 열거 공식 유도.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.15682v1", "title": "Variations of colored multiset Eulerian polynomials and applications", "authors": ["Xue Yan"], "abstract": "Deligeorgaki, Han and Solus introduced colored multiset Eulerian polynomials, derived a generating function identity which generalizes MacMahon's identity, proved their self-interlacing under suitable parameter conditions, and identified these polynomials as the h^*-polynomials of direct products of dilated lattice simplices. In this paper, we introduce an ascent analogue of the colored multiset Eulerian polynomial, derive an explicit generating function identity for this polynomial, show that it is equal to the h^*-polynomial of a family of half-open lattice polytopes, and verify that this ascent polynomial also satisfies self-interlacing under the same parameter conditions. By establishing recurrence relations, we prove that both polynomials are real-rooted for all positive integer parameters. The obtained identities are further applied to interpret combinatorially the h^*-polynomials of Pitman--Stanley polytopes, composition polytopes and a family of reflexive lattice polytopes defined from preorders.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-16T11:19:01+00:00", "updated": "2026-08-16T11:19:01+00:00", "abs_url": "http://arxiv.org/abs/2608.15682v1", "pdf_url": "https://arxiv.org/pdf/2608.15682v1", "journal_ref": "", "doi": "", "comment": "17 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 채색된 다중집합 오일러 다항식, 격자 다면체의 $h^*$-다항식, 실근성 등을 다루며 McMullen 문제(d=5, oriented matroid, 볼록 위치 점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 Deligeorgaki–Han–Solus가 도입한 채색된 다중집합 오일러 다항식의 상승(ascent) 유사체를 새롭게 도입하고, 해당 다항식에 대한 생성함수 항등식을 유도하며, 이를 반열린 격자 다면체(half-open lattice polytope) 족의 $h^*$-다항식으로 해석한다. 점화식을 수립하여 두 다항식 모두 양의 정수 매개변수에 대해 실근(real-rooted)임을 증명하고, 자기-인터레이싱(self-interlacing) 성질도 확인한다. 얻어진 항등식은 Pitman–Stanley 다면체, 합성 다면체(composition polytope), 전순서(preorder)로부터 정의되는 반사 격자 다면체 족의 $h^*$-다항식에 대한 조합론적 해석에 응용된다.", "technique": "점화 관계 수립과 생성함수 방법을 통해 실근성 및 자기-인터레이싱 성질을 증명하고, 다항식을 격자 다면체의 $h^*$-다항식으로 기하학적으로 해석하는 방법을 사용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.14912v1", "title": "On Nieuwland Numbers and Polar Duality", "authors": ["Kavin Satheeskumar", "Liam Benoit"], "abstract": "A convex 3D-polytope is said to have Rupert's property if it can pass through a copy of itself. The Nieuwland number of a convex polytope $P$ is the largest $ν\\in \\mathbb{R}^+$ such that $νP$ can pass through $P$. We reduce showing $P$ passes through $Q$ to a feasibility problem over a quadratic constraint set. Using this, we prove that the Nieuwland number of the octahedron is $\\frac{3\\sqrt2}{4}$ and that the computation of the Nieuwland number of a convex polytope can be reduced to polynomially many semialgebraic optimization problems in a fixed number of variables.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-14T21:50:16+00:00", "updated": "2026-08-14T21:50:16+00:00", "abs_url": "http://arxiv.org/abs/2608.14912v1", "pdf_url": "https://arxiv.org/pdf/2608.14912v1", "journal_ref": "", "doi": "", "comment": "17 pages, 1 figure", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 3D 볼록 다면체의 Rupert 성질 및 Nieuwland 수에 관한 것으로, McMullen 문제(oriented matroid, 점 배치, 볼록 위치)와 직접적인 관련이 없다.", "summary": "이 논문은 볼록 3D 다면체가 자기 자신을 통과할 수 있는 Rupert 성질과 관련된 Nieuwland 수를 연구한다. 저자들은 다면체 $P$가 $Q$를 통과하는 문제를 이차 제약 집합(quadratic constraint set)의 실현 가능성 문제로 환원하고, 이를 이용해 정팔면체의 Nieuwland 수가 $\frac{3\\sqrt{2}}{4}$임을 증명한다. 또한 볼록 다면체의 Nieuwland 수 계산이 고정된 변수 수의 반대수적(semialgebraic) 최적화 문제 다항 개로 환원됨을 보인다.", "technique": "다면체 통과 문제를 이차 제약 집합의 실현 가능성 문제로 환원하고, 반대수적(semialgebraic) 최적화를 활용하는 알고리즘적 접근.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.14839v1", "title": "Optimal Transport on Graphs and Stochastically Evolving Trees", "authors": ["Fan Chung", "Sawyer Jack Robertson"], "abstract": "We give an effective algorithm for determining the transportation distance between two given probability density functions defined on the vertices of a graph $G=(V,E)$ by analyzing an associated polytope. The vertices of the polytope correspond to feasible flows on spanning trees in $G$, and the $1$-skeleton of the polytope is a projection of the spanning tree state graph associated with the Glauber dynamics on $G$. The optimal value of this transportation problem, known as the $1$-Wasserstein distance, can be computed by tracing the transportation cost along the vertices of this polytope. We show that a local minimum of the transportation cost is also a global minimum, and this leads to a steepest descent algorithm for solving the transportation problem. If the probability density functions take discrete values in $δ\\mathbb{Z}$ for some $δ>0$, then the optimal transport cost can be reached in at most $\\frac{|V|-1}δ$ steps. As an application, we give an efficient algorithm for computing the Ollivier--Ricci curvature of a graph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-14T19:24:02+00:00", "updated": "2026-08-14T19:24:02+00:00", "abs_url": "http://arxiv.org/abs/2608.14839v1", "pdf_url": "https://arxiv.org/pdf/2608.14839v1", "journal_ref": "", "doi": "", "comment": "15 pages, 1 figure", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프 위의 최적 수송(1-Wasserstein 거리) 알고리즘과 Ollivier-Ricci 곡률 계산에 관한 것으로, McMullen 문제나 oriented matroid, 점 배치 등과 직접적인 관련이 없다.", "summary": "이 논문은 그래프 $G=(V,E)$의 꼭짓점에 정의된 두 확률 밀도 함수 간의 수송 거리(1-Wasserstein 거리)를 계산하는 효율적인 알고리즘을 제안한다. 핵심 아이디어는 스패닝 트리의 실현 가능한 흐름(feasible flow)에 대응하는 폴리토프를 분석하는 것으로, 수송 비용의 지역 최솟값이 전역 최솟값이기도 함을 증명하여 가장 가파른 하강(steepest descent) 알고리즘을 도출한다. 밀도 함수가 $\\delta\\mathbb{Z}$의 이산값을 가질 때 최적 수송 비용은 최대 $\frac{|V|-1}{\\delta}$ 스텝 안에 도달하며, 응용으로 그래프의 Ollivier-Ricci 곡률을 효율적으로 계산한다.", "technique": "스패닝 트리 상의 실현 가능한 흐름에 대응하는 폴리토프의 1-스켈레톤을 Glauber 동역학의 스패닝 트리 상태 그래프의 사영으로 분석하여 가장 가파른 하강 알고리즘을 설계한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.17232v1", "title": "Polyhedral Subspaces of $L_{p}$ and Polars of Zonotopes", "authors": ["Vladyslav Yaskin"], "abstract": "Let $K$ be an origin-symmetric full-dimensional convex polytope in $\\mathbb R^n$, $n\\ge 3$. We show that, for $-n+3<p<1$, the normed space $(\\mathbb R^n,\\|\\cdot\\|_K)$ embeds in $L_p$ if and only if it embeds in $L_1$. The case of $p\\le 0$ is understood in the generalized sense. In particular, an origin-symmetric full-dimensional convex polytope $K\\subset\\mathbb R^n$, $n\\ge 5$, is an intersection body if and only if $K$ is the polar of a zonotope.", "categories": ["math.MG", "math.FA"], "primary_category": "math.MG", "published": "2026-08-18T00:36:16+00:00", "updated": "2026-08-18T00:36:16+00:00", "abs_url": "http://arxiv.org/abs/2608.17232v1", "pdf_url": "https://arxiv.org/pdf/2608.17232v1", "journal_ref": "", "doi": "", "comment": "19 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체의 $L_p$ 공간 매장(embedding)과 존토프(zonotope)의 극체(polar)에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "원점 대칭인 완전 차원 볼록 다면체 $K \\subset \\mathbb{R}^n$ ($n \\ge 3$)에 대해, $-n+3 < p < 1$ 범위에서 노름 공간 $(\\mathbb{R}^n, \\|\\cdot\\|_K)$가 $L_p$에 매장될 조건이 $L_1$에 매장될 조건과 동치임을 보인다. 특히 $n \\ge 5$인 경우, 원점 대칭 볼록 다면체 $K$가 교차체(intersection body)인 것과 $K$가 존토프의 극체(polar of a zonotope)인 것이 동치임을 증명한다.", "technique": "일반화된 의미의 $L_p$ 매장($p \\le 0$ 포함)과 교차체 이론을 활용하여 존토프의 극체와의 동치 관계를 도출.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.19110v1", "title": "Rigid motion invariant valuations on polytopes", "authors": ["Jonas Knoerr"], "abstract": "We show that any measurable, translation and $\\mathrm{SO}(n)$-invariant valuation on polytopes in $\\mathbb{R}^n$ is a linear combination of the intrinsic volumes, which extends Hadwiger's classical characterization of rigid motion invariant continuous valuations on convex bodies. This result is based on a novel regularity result for translation invariant, measurable, $1$-homogeneous, and simple valuations. As a consequence, we obtain a similar characterization of the Steiner point map on polytopes.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-19T17:03:29+00:00", "updated": "2026-08-19T17:03:29+00:00", "abs_url": "http://arxiv.org/abs/2608.19110v1", "pdf_url": "https://arxiv.org/pdf/2608.19110v1", "journal_ref": "", "doi": "", "comment": "29 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 다면체 위의 rigid motion 불변 valuation의 특성화(Hadwiger 정리 확장)를 다루며, McMullen 문제나 Larman 추측과 직접적 관련이 없다.", "summary": "이 논문은 $\\mathbb{R}^n$의 다면체 위에서 가측(measurable)이고 평행이동 및 $\\mathrm{SO}(n)$-불변인 valuation이 내재 부피(intrinsic volumes)의 선형결합임을 증명하여, 볼록체 위의 연속 valuation에 대한 Hadwiger의 고전적 특성화를 다면체로 확장한다. 이 결과는 평행이동 불변, 가측, 1-동차, simple valuation에 대한 새로운 정칙성(regularity) 정리에 기반한다. 부수적 결과로 다면체 위의 Steiner point map의 유사한 특성화도 얻는다.", "technique": "평행이동 불변·가측·1-동차·simple valuation에 대한 새로운 정칙성 정리를 핵심 도구로 사용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.19089v1", "title": "Improved bounds on the oriented diameter of planar triangulations", "authors": ["Xiaonan Liu"], "abstract": "The oriented diameter of a connected bridgeless graph $G$, denoted by $\\overrightarrow{\\operatorname{diam}}(G)$, is the minimum diameter among all strong orientations of $G$. We study the oriented diameter of planar triangulations, and show that $\\overrightarrow{\\operatorname{diam}}(G)\\leq \\frac{2n+44}{5}$ for any $n$-vertex planar triangulation $G$. This improves the leading constant in the previous best general upper bound $\\lceil \\frac{n}{2}\\rceil$, due to Ge, Liu, and Wang, from $1/2$ to $2/5$. We also prove that every $n$-vertex $4$-connected planar triangulation satisfies $\\overrightarrow{\\operatorname{diam}}(G)\\leq \\frac{n+17}{3}$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T16:38:45+00:00", "updated": "2026-08-19T16:38:45+00:00", "abs_url": "http://arxiv.org/abs/2608.19089v1", "pdf_url": "https://arxiv.org/pdf/2608.19089v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 삼각분할 그래프의 oriented diameter에 관한 것으로, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "이 논문은 연결된 브릿지 없는 그래프의 oriented diameter(모든 강한 방향 중 최소 지름)를 평면 삼각분할에 대해 연구한다. $n$-꼭짓점 평면 삼각분할 $G$에 대해 $\\overrightarrow{\\operatorname{diam}}(G)\\leq \\frac{2n+44}{5}$를 증명하여 기존 최선 상한 $\\lceil\\frac{n}{2}\\rceil$의 주 계수를 $1/2$에서 $2/5$로 개선하였다. 또한 $n$-꼭짓점 4-연결 평면 삼각분할에 대해 $\\overrightarrow{\\operatorname{diam}}(G)\\leq \\frac{n+17}{3}$를 증명한다.", "technique": "평면 삼각분할의 강한 방향(strong orientation) 구성을 통해 oriented diameter의 상한을 개선하는 조합적·그래프이론적 방법.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.18533v1", "title": "Polytopes of Effective Boundary Expressions of Divisors on $\\overline{M}_{0,n}$", "authors": ["Ian Cavey", "Deniz Genlik"], "abstract": "For a divisor on $\\overline{M}_{0,n}$, we introduce the polytope of its effective boundary expressions. We establish structural properties of these polytopes under the forgetful maps of $\\overline{M}_{0,n}$ forgetting marked points, and give equivalent graph-theoretic descriptions. We compute these polytopes for several families of divisors. For psi-classes and their pullbacks by forgetful maps, we show that the polytopes are unimodular simplices. For the log-canonical class and its modifications by psi-classes, we prove that the nonnegative parts of the corresponding polytopes recover spanning forest polytopes and the subtour elimination (Held--Karp relaxation) polytope of the symmetric traveling salesman problem. As an application, we obtain a Minkowski-like decomposition of the subtour elimination polytope into simplices. Finally, for symmetric level-one $\\mathfrak{sl}_p$ conformal block divisors, we show that the defining inequalities are local Turán bounds and the $0/1$-points are

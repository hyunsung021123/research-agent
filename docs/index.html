ase when the degree or codegree is at most 3.   This result is sharp in that when the degree and codegree are at least 4, we construct counterexamples using the existence of non-Rayleigh matroids in ranks at least four. Additionally, we provide unimodular or graphical counterexamples in dimensions four and higher to an equivalent projection inequality formulation of the conjecture. We also show that a stronger projection inequality fails already in dimension three.   We next disprove Courtade's conjecture using a pair of orthogonal double bodies of revolution. Although Courtade's conjecture was originally formulated for general convex bodies, we show that it fails even for zonoids in every dimension at least three.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-13T00:41:36+00:00", "updated": "2026-08-13T00:41:36+00:00", "abs_url": "http://arxiv.org/abs/2608.12681v1", "pdf_url": "https://arxiv.org/pdf/2608.12681v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 조노이드(zonoid)의 부피·사영 부등식 및 Courtade 추측을 다루며, McMullen 문제(d=5)나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 조노이드의 부피를 인코딩하는 다중선형 행렬식 다항식을 통해 부피·사영 부등식을 연구한다. 조노이드 부피의 로그-준모듈성(log-submodularity) 추측이 조노토프 부피 다항식의 Rayleigh 성질과 동치임을 보이고, 차수 또는 여차수가 3 이하인 경우 이를 증명하며, 차수·여차수가 모두 4 이상인 경우 비-Rayleigh 매트로이드를 이용한 반례를 구성한다. 또한 직교 이중 회전체 쌍을 이용해 Courtade 추측을 반증하며, 이 추측이 3차원 이상의 모든 조노이드에 대해서도 성립하지 않음을 보인다.", "technique": "조노토프 부피 다항식의 Rayleigh 성질 분석 및 비-Rayleigh 매트로이드를 활용한 반례 구성, 직교 이중 회전체를 이용한 Courtade 추측 반증.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.11468v1", "title": "Submodular and strongly submodular functions and diversities", "authors": ["David Bryant", "Paul F. Tupper"], "abstract": "Submodular functions and their close relatives play a key role in combinatorial optimization, decision theory and potential theory. Part of their importance and usefulness stems from the connections with convex functions and polytopes. Here we explore connections between these functions and metric theory, with the bridge provided by diversities, a recently developed generalization of metric spaces to (finite) sets rather than just pairs. Both submodular functions and strongly submodular functions correspond to natural classes of diversities. Submodular diversities, as we define them here, are essentially non-decreasing, intersecting submodular functions which vanish on singletons. We prove new geometric embedding results for these diversities. In particular we show that submodular, strongly submodular, and XOS functions can be represented by the generalized circumradius, a set function in convex analysis equal to the amount a given convex body needs to be stretched to cover a set of points.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-08-11T22:11:41+00:00", "updated": "2026-08-11T22:11:41+00:00", "abs_url": "http://arxiv.org/abs/2608.11468v1", "pdf_url": "https://arxiv.org/pdf/2608.11468v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 submodular 함수와 diversity 이론의 연결을 다루며, McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "본 논문은 submodular 함수 및 strongly submodular 함수를 metric 이론의 관점에서 재해석하며, 최근 개발된 diversity(metric space의 집합 쌍 일반화) 개념을 교량으로 활용한다. submodular diversity, strongly submodular diversity, XOS 함수가 볼록 해석학의 generalized circumradius(주어진 볼록 체를 점들의 집합을 덮도록 늘리는 양)로 표현될 수 있음을 증명한다. 이를 통해 새로운 기하적 임베딩 결과들을 도출한다.", "technique": "Generalized circumradius(볼록 체를 집합 피복에 필요한 확장량으로 정의된 집합 함수)를 이용한 submodular 함수류의 기하적 표현 및 임베딩.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.11078v1", "title": "A Fourier-analytic Uniqueness Theorem for Lattice-point Enumerators", "authors": ["António Rocha-Neves"], "abstract": "We consider a bounded set $P \\subset \\mathbb{R}^d$ and the lattice-point enumerator $L_P(t) = |tP \\cap \\mathbb{Z}^d|$ for real $t > 0$. We show that if two bounded measurable sets with boundary of measure zero have the same real-parameter lattice-point enumerators for all integer translates, then their indicator functions agree almost everywhere. As a corollary, any convex body is uniquely determined by this data. Our proof is short and Fourier-analytic, where the key device is a periodic point-counting function whose Fourier coefficients recover the Fourier transform of the indicator function on a dense set. This recovers and extends, with a unified argument, the uniqueness results for rational polytopes and symmetric convex bodies established by Royer [arXiv:1712.01973, arXiv:1712.03937], whose proofs relied on intricate case-specific geometric constructions.", "categories": ["math.CO", "math.MG"], "primary_category": "math.CO", "published": "2026-08-11T15:39:32+00:00", "updated": "2026-08-11T15:39:32+00:00", "abs_url": "http://arxiv.org/abs/2608.11078v1", "pdf_url": "https://arxiv.org/pdf/2608.11078v1", "journal_ref": "", "doi": "", "comment": "4 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 격자점 열거함수의 유일성에 관한 Fourier 해석적 결과로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "유계 가측 집합 $P \\subset \\mathbb{R}^d$에 대해 실수 매개변수 격자점 열거함수 $L_P(t) = |tP \\cap \\mathbb{Z}^d|$를 고려하고, 경계 측도가 0인 두 유계 가측 집합이 모든 정수 평행이동에서 동일한 실수 매개변수 격자점 열거함수를 가지면 지시함수가 거의 어디서나 일치함을 증명한다. 이 결과의 따름정리로 볼록체는 이 데이터에 의해 유일하게 결정되며, Royer의 유리 다면체 및 대칭 볼록체에 대한 유일성 결과를 통합된 Fourier 해석적 논증으로 회복·확장한다.", "technique": "주기적 점-계수 함수의 Fourier 계수가 조밀한 집합 위에서 지시함수의 Fourier 변환을 복원한다는 사실을 핵심 도구로 사용하는 Fourier 해석적 방법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.09844v1", "title": "Grothendieck weights and K-theoretic positivity for matroids", "authors": ["Yiyu Wang"], "abstract": "We introduce a method for studying $K$-theoretic positivity on permutohedral toric varieties through the topology of spaces arising in tropical geometry. The key ingredient is the theory of Grothendieck weights developed by the author.   We prove two positivity results using this method. The first result is the positivity of the Euler characteristics of tautological bundles associated with an arbitrary matroid and twisted by a nef line bundle. This gives numerical evidence for a conjectural vanishing theorem.   The second result generalizes the external activity complex of Berget--Fink, originally defined for a pair of matroids, to the case of any tuple of matroids with no common loop. We deduce a formula for its graded $K$-polynomial in terms of exterior powers of the dual tautological quotient classes of the matroids. After a change of variables, its coefficients alternate in sign. We also prove the Cohen--Macaulayness of each such complex using the vanishing theorems for combinatorial geometries developed by Eur--Fink--Larson. This proof is new even in the case of a pair of matroids. As an application, we interpret certain Chern numbers of tautological quotient classes as counts of facets, partially answering a question of Berget--Eur--Spink--Tseng.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-08-10T17:03:35+00:00", "updated": "2026-08-10T17:03:35+00:00", "abs_url": "http://arxiv.org/abs/2608.09844v1", "pdf_url": "https://arxiv.org/pdf/2608.09844v1", "journal_ref": "", "doi": "", "comment": "50 pages, comments welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 matroid의 K-이론적 양성(positivity)과 열대기하학(tropical geometry)을 다루지만, McMullen 문제(d=5)나 점 배치·oriented matroid의 acyclic reorientation과는 직접적 관련이 없다.", "summary": "이 논문은 열대기하학에서 나타나는 공간의 위상수학을 통해 permutohedral toric variety 위에서의 $K$-이론적 양성을 연구하는 방법론(Grothendieck weights 이론)을 도입한다. 임의의 matroid에 대한 tautological bundle의 Euler 특성수의 양성과, Berget–Fink의 external activity complex를 임의의 matroid 튜플로 일반화하여 그 graded $K$-다항식을 exterior power로 표현하는 두 가지 양성 결과를 증명한다. 또한 Eur–Fink–Larson의 소멸 정리를 이용해 각 complex의 Cohen–Macaulay성을 증명하고, 특정 Chern 수를 facet 개수로 해석한다.", "technique": "열대기하학에서 발생하는 공간의 위상을 활용한 Grothendieck weights 이론과 combinatorial geometry에 대한 소멸 정리(vanishing theorems)를 핵심 도구로 사용한다.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2608.12401v1", "title": "The Tropical Algebra of Binary-Tree Height", "authors": ["Grant Molnar"], "abstract": "The binary-tree height recursion defines an algebra $\\mathcal{H}$ on $\\mathbb{N}\\cup\\{-\\infty\\}$, with join given by $\\max$ and product \\[ a\\star b=\\max\\{a,b\\}+1. \\] We show that weighted evaluation of a labelled tree depends only on the greatest depth of each label. Single-tree profiles are exactly the vectors satisfying the binary Kraft inequality, while finite joins realize every vector in $\\bigl(\\mathbb{N}\\cup\\{-\\infty\\}\\bigr)^n$; hence the $n$-variable term operations form the free algebra $\\mathcal{H}^n$. We also classify $\\mathcal{H}$'s compatible semilattice operation, subalgebras, endomorphisms, congruences, and finite quotients, and recover the dyadic-composition spectrum at the full-linear boundary.", "categories": ["math.CO", "math.RA"], "primary_category": "math.CO", "published": "2026-08-09T23:45:18+00:00", "updated": "2026-08-09T23:45:18+00:00", "abs_url": "http://arxiv.org/abs/2608.12401v1", "pdf_url": "https://arxiv.org/pdf/2608.12401v1", "journal_ref": "", "doi": "", "comment": "26 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 이진트리 높이의 열대 대수(tropical algebra) 구조를 분석하는 것으로, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 직접적인 관련이 없다.", "summary": "이 논문은 $\\mathbb{N}\\cup\\{-\\infty\\}$ 위에서 $a\\star b=\\max\\{a,b\\}+1$로 정의되는 이진트리 높이 재귀로부터 대수 $\\mathcal{H}$를 도입하고, 레이블된 트리의 가중 평가가 각 레이블의 최대 깊이에만 의존함을 보인다. 단일 트리 프로파일은 이진 Kraft 부등식을 만족하는 벡터와 일치하며, 유한 조인(join)이 $\\bigl(\\mathbb{N}\\cup\\{-\\infty\\}\\bigr)^n$의 모든 벡터를 실현하므로 $n$-변수 항 연산들이 자유 대수 $\\mathcal{H}^n$을 이룬다. 또한 $\\mathcal{H}$의 호환 반격자(semilattice) 연산, 부분대수, 자기준동형사상, 합동(congruence), 유한 몫 등을 분류하고 완전 선형 경계에서 이진 합성 스펙트럼을 복원한다.", "technique": "열대 대수(tropical algebra) 구조 분석 및 Kraft 부등식을 활용한 자유 대수 특성화.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2608.08918v1", "title": "Toric real loci via moment polytopes", "authors": ["João Camarneiro", "Ana Cannas da Silva"], "abstract": "Toric real loci are distinguished lagrangian submanifolds of toric symplectic manifolds. We develop a polyhedral model for toric real loci, called a kaleidoscope, based on the restriction of the moment map. This construction provides a direct geometric description of the topology of toric real loci and leads to simple criteria for orientability, together with transparent formulas for the Euler characteristic. We illustrate the theory with numerous examples and count, in every complex dimension up to 9, the smooth toric Fano varieties whose real loci are orientable. The kaleidoscope construction offers a simple, visual, and effective framework for understanding the topology of toric real loci through the combinatorics of their moment polytopes.", "categories": ["math.SG", "math.AG", "math.GT"], "primary_category": "math.SG", "published": "2026-08-09T21:14:34+00:00", "updated": "2026-08-09T21:14:34+00:00", "abs_url": "http://arxiv.org/abs/2608.08918v1", "pdf_url": "https://arxiv.org/pdf/2608.08918v1", "journal_ref": "", "doi": "", "comment": "49 pages, 16 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 토릭 심플렉틱 다양체의 실수 궤적(real loci) 위상을 연구하며, McMullen 문제나 oriented matroid의 acyclic reorientation과 직접적인 관련이 없다.", "summary": "이 논문은 토릭 심플렉틱 다양체의 구별되는 라그랑지안 부분다양체인 토릭 실수 궤적(toric real loci)을 연구하며, 모멘트 맵의 제한에 기반한 칼레이도스코프(kaleidoscope)라는 다면체 모델을 개발한다. 이 구성은 토릭 실수 궤적의 위상에 대한 직접적인 기하학적 기술을 제공하고, 가향성(orientability) 판정 기준과 오일러 특성(Euler characteristic) 공식을 이끌어낸다. 복소 차원 9까지의 매끈한 토릭 파노(Fano) 다양체 중 실수 궤적이 가향인 경우를 모두 셈한다.", "technique": "모멘트 맵의 제한을 이용한 칼레이도스코프(polyhedral model) 구성을 통해 모멘트 다각형(moment polytope)의 조합론으로부터 위상적 성질을 추출한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.08334v1", "title": "Complement minimally non-totally unimodular matrices", "authors": ["Suyoung Choi", "Mathieu Vallée"], "abstract": "We prove that, up to row and column permutations and complement operations, the only complement minimally non-totally unimodular matrices are the cycle matrices $C_3$ and $C_5$. This settles a conjecture of Chervet, Grappe, and Vallée. As a consequence, every simplicial cone generated by the rows of a totally equimodular matrix admits a regular unimodular Hilbert triangulation.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-08-08T20:57:54+00:00", "updated": "2026-08-08T20:57:54+00:00", "abs_url": "http://arxiv.org/abs/2608.08334v1", "pdf_url": "https://arxiv.org/pdf/2608.08334v1", "journal_ref": "", "doi": "", "comment": "8 pages (Comments are welcome)", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 전완전단모듈 행렬(totally unimodular matrices)과 삼각분할(triangulation)에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 연관이 없다.", "summary": "이 논문은 complement 최소 비전완전단모듈(non-totally unimodular) 행렬이 행·열 치환 및 complement 연산에 의해 순환 행렬 $C_3$와 $C_5$뿐임을 증명하여 Chervet, Grappe, Vallée의 추측을 해결한다. 결과로서, 전동치단모듈(totally equimodular) 행렬의 행들로 생성되는 모든 단순뿔(simplicial cone)이 정규 단모듈 Hilbert 삼각분할(regular unimodular Hilbert triangulation)을 허용함을 도출한다.", "technique": "행렬의 complement 연산과 최소성(minimality) 조건을 활용하여 비전완전단모듈 행렬을 구조적으로 분류.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.12749v1", "title": "Extensions of One-Sided Box Geometry and Pyramid Invariants to gd-Sets and qm-Spaces", "authors": ["Shigeaki Yokota"], "abstract": "Domination of gd-sets, the relation recording which function family approximates which, is closed under box convergence. More generally, approximate 1-Lipschitz maps on asymptotically full-measure subsets, whose restricted measures converge to the target measure after pushforward, place the target representation in every subsequential weak limit of the source pyramids. For weakly convergent pyramids, bounded joint distributions of finite ordered tuples of observables recover both observable diameter, after rightward perturbation of its mass parameter, and the largest common forward gap among several positive-mass sets, after common leftward perturbation of their mass parameters. The lower- and upper-limit formulas agree as the perturbations vanish. Without closure assumptions on a gd-set's function family, we compare observable diameter, the nonnegative part of forward separation, and upper and lower median-tail masses. All observables become uniformly close in measure to suitable constants exactly when both median-tail masses vanish at every positive radius.", "categories": ["math.MG", "math.PR"], "primary_category": "math.MG", "published": "2026-08-13T02:57:55+00:00", "updated": "2026-08-13T02:57:55+00:00", "abs_url": "http://arxiv.org/abs/2608.12749v1", "pdf_url": "https://arxiv.org/pdf/2608.12749v1", "journal_ref": "", "doi": "", "comment": "26 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학이나 조합론적 배치 문제가 아닌 측도론·함수해석학·확률론 중심의 메트릭 기하학 논문으로, McMullen's problem과 직접 관련 없음.", "summary": "본 논문은 gd-sets와 qm-spaces에서 domination, box convergence, 약수렴 피라미드 구조를 다룬다. 1-Lipschitz 근사 사상과 pushforward 측도의 수렴 성질, observable diameter와 median-tail mass 불변량의 극한 공식을 분석한다.", "technique": "Box convergence, weak convergence of probability pyramids, pushforward measures, limit formulas for observable diameters and median-tail masses를 통한 gd-sets의 기하학적 구조 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.08762v1", "title": "A note on the partition function of a rectangle", "authors": ["Krystian Gajdzica", "Maciej Zakarczemny"], "abstract": "We investigate the asymptotic behavior of the rectangle partition functions $p(n,n)$ and $p(3,n)$. The function $p(n,n)$ counts partitions of the square $n\\times n$ into rectangular blocks with integer sides, while $p(3,n)$ counts such partitions of the rectangle $3\\times n$. Two rectangle partitions are identified when they contain the same multiset of rectangle types, and a block $a\\times b$ is identified with a block $b\\times a$. Our main results are $$ p(n,n) = \\exp\\left( \\left(\\tfracπ{\\sqrt3}+o(1)\\right)n\\sqrt{\\log n} \\right) $$ and $$ p(3,n) = \\exp\\left( π\\sqrt{\\tfrac{11n}{3}}+O(\\log n) \\right). $$ We also present simpler upper and lower bounds for $p(n,n)$ and an independent upper bound for $p(3,n)$.", "categories": ["math.CO", "cs.DM", "math.NT"], "primary_category": "math.CO", "published": "2026-08-09T15:22:22+00:00", "updated": "2026-08-09T15:22:22+00:00", "abs_url": "http://arxiv.org/abs/2608.08762v1", "pdf_url": "https://arxiv.org/pdf/2608.08762v1", "journal_ref": "", "doi": "", "comment": "27 pages, 3 figures, 3 tables", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "직사각형 분할의 점근 거동을 연구하는 조합론 문제이나 McMullen's problem(convex position의 점 배치, oriented matroid, polyhedral matching fields)과는 직접적인 기하학적 또는 order-theoretic 연결이 없음.", "summary": "논문은 정사각형 $n\\times n$과 직사각형 $3\\times n$을 정수 변의 직사각형 블록으로 분할하는 경우의 수인 $p(n,n)$과 $p(3,n)$의 점근 거동을 분석한다. 주요 결과로 $p(n,n) = \\exp((\\pi/\\sqrt{3}+o(1))n\\sqrt{\\log n})$, $p(3,n) = \\exp(\\pi\\sqrt{11n/3}+O(\\log n))$을 도출한다.", "technique": "초록만으로는 점근 분석의 구체적 기법(생성함수, saddle-point, transfer matrix 등)이 명시되지 않아 불확실.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.12069v1", "title": "On ${\\rm b}^{\\ast}$-Coloring and $z$-Coloring of graphs with high girth", "authors": ["Zahra Ahmadidahr", "Manouchehr Zaker"], "abstract": "In a proper vertex coloring $c$ of a graph $G$, a vertex $u$ is called a b-vertex if $u$ is adjacent to a vertex in every other color class. A ${\\rm b}^{\\ast}$-coloring is a proper coloring in which a b-vertex is adjacent to a b-vertex in every other color class. A Grundy coloring is a proper coloring obtained by the First-Fit (greedy) coloring procedure. A $z$-coloring of $G$ is a ${\\rm b}^{\\ast}$-coloring that is also a Grundy coloring. The ${\\rm b}^{\\ast}$-chromatic number (resp., $z$-chromatic number), denoted by ${\\rm b}^{\\ast}(G)$ (resp., $z(G)$), is the maximum number of colors used in a ${\\rm b}^{\\ast}$-coloring (resp., $z$-coloring) of $G$. Every graph admits a ${\\rm b}^{\\ast}$-coloring and a $z$-coloring that can be found using a polynomial-time coloring heuristic. Let ${\\rm m}^{\\ast}(G)$ be the largest integer $k$ such that a vertex of degree at least $k$ in $G$ has $k$ neighbors of degree at least $k$. We employ list-coloring techniques to prove that if $G$ has a girth of at least $7$, then ${\\rm b}^{\\ast}(G) = {\\rm m}^{\\ast}(G)+ 1$. A similar result is obtained for graphs of girth at least $6$ when ${\\rm m}^{\\ast}=3$. Finally, we prove that if the girth is at least $2k+2$ and $G$ contains a specific tree as an ordinary subgraph, then $z(G)\\geq k$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-12T13:51:57+00:00", "updated": "2026-08-12T13:51:57+00:00", "abs_url": "http://arxiv.org/abs/2608.12069v1", "pdf_url": "https://arxiv.org/pdf/2608.12069v1", "journal_ref": "", "doi": "", "comment": "11 page", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "본 논문은 그래프 색칠(graph coloring)의 조합론적 성질을 다루지만, McMullen's problem(볼록 위치, 고차원 기하학적 배치)과는 직접적인 관련이 없습니다.", "summary": "본 논문은 높은 girth를 가진 그래프에서 b*-coloring과 z-coloring의 색수를 연구합니다. Girth가 7 이상일 때 b*(G) = m*(G)+1이고, girth가 2k+2 이상일 때 특정 부분트리를 포함하면 z(G)≥k임을 증명합니다.", "technique": "List-coloring 기법을 활용한 girth 제약 조건 하에서의 색칠수 상한 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.11007v1", "title": "Degree Game for Special Regular Graphs", "authors": ["Lajos Győrffy"], "abstract": "For a given $d$-regular graph $G$, a Maker-Breaker degree game is played by two players who alternately claim previously unclaimed edges of $G$. In the standard variant, the goal of Maker is to maximize the maximum degree of their induced subgraph, while Breaker aims to minimize it, or equivalently, to guarantee a certain minimum degree in their own subgraph. A classic pairing strategy shows that Breaker can secure at least $\\lfloor d/4 \\rfloor$ edges at every vertex of any $d$-regular graph. Breaking this bound for general or even for specific classes of graphs has been a long-standing open problem in combinatorial game theory; indeed, J. Beck characterized this challenge in his monograph as the first among the seven most humiliating open problems of positional game theory. In this paper, we improve the $d/4$ bound for some infinite graph families, such as the hypercube graph $Q_d$, grids and tori. We first show that Breaker can secure a degree of one at every vertex in $Q_3$, then lift this to higher dimensions, where Breaker can guarantee a degree of at least $\\lfloor d/3 \\rfloor$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-11T14:55:37+00:00", "updated": "2026-08-11T14:55:37+00:00", "abs_url": "http://arxiv.org/abs/2608.11007v1", "pdf_url": "https://arxiv.org/pdf/2608.11007v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 게임 이론의 차수 문제로, McMullen's problem의 기하학적·oriented matroid 관점과는 직접 관련성이 없음.", "summary": "Maker-Breaker 차수 게임에서 $d$-정규 그래프에 대해 Breaker가 보장할 수 있는 최소 차수의 하한을 개선한다. 특히 hypercube $Q_d$, grids, tori 등의 그래프족에 대해 고전적인 $\\lfloor d/4 \\rfloor$ 경계를 초과하여, hypercube에서 $\\lfloor d/3 \\rfloor$를 달성함을 보인다.", "technique": "쌍 전략(pairing strategy)의 개선 및 특정 정규 그래프의 기하학적·대칭적 구조를 활용한 Breaker의 전략 강화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.09868v1", "title": "A random Lipschitz function detecting jumps", "authors": ["Dmitriy Stolyarov"], "abstract": "Recently, A. Tyulenev and the author studied the class of metric spaces $\\mathcal{X}$ such that for every mapping $γ\\colon [0,1]\\to\\mathcal{X}$, there exists a $1$-Lipschitz function $F\\colon \\mathcal{X}\\to \\mathbb{R}$ that catches the total variation of $γ$, i.e. such that $\\operatorname{V}_{F\\circγ} \\gtrsim \\operatorname{V}_γ$. In this short note, we show that a metric space $\\mathcal{X}$ enjoys this property if and only if there exists a random $1$-Lipschitz function $f$ on $\\mathcal{X}$ such that $\\mathbb{E} |f(x) - f(y)| \\gtrsim ρ(x,y)$ for every $x$ and $y$ in $\\mathcal{X}$.", "categories": ["math.MG", "math.FA"], "primary_category": "math.MG", "published": "2026-08-10T17:24:54+00:00", "updated": "2026-08-10T17:24:54+00:00", "abs_url": "http://arxiv.org/abs/2608.09868v1", "pdf_url": "https://arxiv.org/pdf/2608.09868v1", "journal_ref": "", "doi": "", "comment": "5 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "메트릭 공간의 Lipschitz 함수와 변동(variation)에 관한 함수해석학·메트릭 기하학 주제로, McMullen's problem(볼록 조합론·oriented matroid·점 배치)과는 직접 관련성이 없음.", "summary": "메트릭 공간 $\\mathcal{X}$에서 모든 경로 $\\gamma\\colon [0,1]\\to\\mathcal{X}$의 전변동을 포착하는 1-Lipschitz 함수 $F$가 존재하는 조건을 특성화한다. 이 성질이 성립할 필요충분조건은 기댓값이 거리를 근사하는 무작위 1-Lipschitz 함수 $f$가 존재하는 것임을 보인다.", "technique": "무작위 Lipschitz 함수와 기댓값 추정을 통한 메트릭 공간의 기하학적 성질 특성화.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.11771v1", "title": "Bijective proofs of several conjectures on Jacobi permutations", "authors": ["Zhicong Lin", "Yongzhou Wen", "Sherry H. F. Yan"], "abstract": "Jacobi permutations, invented by Viennot in the context of the Jacobi elliptic functions, are counted by the Euler numbers. Recently, Henke, Hoffman, Stephens, Yuan, and Zhuang studied refined enumerations of Jacobi permutations and proposed three conjectures concerning the distribution of several statistics on Jacobi permutations. In this paper, we prove these conjectures by establishing explicit bijections involving increasing even trees, increasing binary trees, alternating permutations, and André permutations. One highlight of our results is a bijection between Jacobi permutations and André I permutations that transforms the pair of statistics $(\\Ascbot, \\last)$ to the pair of statistics $(\\Desbot, \\first)$. Here the statistic $\\Ascbot$ (resp., $\\Desbot$) denotes the set of ascent bottoms (resp., descent bottoms) of permutations, and the statistic $\\first$ (resp., $\\last$) denotes the first (resp., $\\last$) letter of permutations. Furthermore, we investigate pairs of statistics on André permutations and simsun permutations that are equidistributed with the pair $(\\asc, \\last)$ on Jacobi permutations, where $\\asc$ denotes the number of ascents of permutations. Finally, we obtain a closed-form formula for the trivariate exponential generating function of Jacobi permutations with respect to the number of ascents and the numbers of letters smaller and larger than the last letter.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-12T08:14:29+00:00", "updated": "2026-08-12T08:14:29+00:00", "abs_url": "http://arxiv.org/abs/2608.11771v1", "pdf_url": "https://arxiv.org/pdf/2608.11771v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Jacobi 순열의 통계적 분포와 전단사 증명은 McMullen 문제의 점 배치, general position, 또는 oriented matroid 구조와 직접적 연관이 없음.", "summary": "본 논문은 Viennot이 Jacobi 타원함수 맥락에서 정의한 Jacobi 순열의 세 가지 추측을 명시적 전단사(increasing even trees, increasing binary trees, alternating permutations, André permutations 포함)로 증명한다. 핵심 결과는 Jacobi 순열과 André I 순열 사이의 전단사로서 상승점 집합(ascent bottoms)과 하강점 집합(descent bottoms) 통계를 변환한다.", "technique": "명시적 전단사 구성(bijective proofs)과 순열 통계의 등분포(equidistribution) 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.11169v1", "title": "Released packing functions in graphs", "authors": ["Pablo Fekete", "Erica Hinrichsen", "Valeria Leoni", "María Inés Lopez Pujato"], "abstract": "We introduce and start the study of a variant of packing functions in graphs. Given a graph $G$ with vertex set $V$ and nonnegative integer vectors $\\mathbf{k}=(k_v)_{v\\in V}$, $\\boldsymbol\\ell=(l_v)_{v\\in V}$ and $\\mathbf{u}=(u_v)_{v\\in V}$, a function $f : V \\rightarrow \\mathbb{Z}_0^+$ is a Released $( \\mathbf{k}, \\boldsymbol\\ell, \\mathbf{u})$-packing function of $G$ if $l_v\\leq f(v)\\leq u_v$ for every $v\\in V$ and the sum of the values of $f$ over the closed neighborhood of vertices $v$ with $f(v) = u_v$ is at most $k_v$. The weight of $f$ is the value $f(V) = \\sum_{v\\in V} f(v)$. We study the associated decision problem (RPP), which asks, given $G$, $\\mathbf{k}$, $\\boldsymbol\\ell$, $\\mathbf{u}$ and an integer number $x$, whether $G$ admits a Released $( \\mathbf{k}, \\boldsymbol\\ell, \\mathbf{u})$-packing function of weight at least $x$. We relate RPP to the $r$-dependent set problem, derive several NP-hardness results, model RPP as a compact (polynomial in size) Integer Linear Program, and take the first steps of a polyhedral study.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-11T17:29:50+00:00", "updated": "2026-08-11T17:29:50+00:00", "abs_url": "http://arxiv.org/abs/2608.11169v1", "pdf_url": "https://arxiv.org/pdf/2608.11169v1", "journal_ref": "", "doi": "", "comment": "11 pages, 1 fugure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 그래프 이론이지만 McMullen의 문제(고차원 convex position, oriented matroid, realizability)와는 직접 관련이 없음.", "summary": "그래프에서 Released packing function 변형을 도입하며, 각 정점 $v$에서 함수값이 $[l_v, u_v]$ 범위이고 $f(v)=u_v$인 정점의 closed neighborhood 합이 $k_v$ 이하여야 하는 제약을 다룬다. 관련 결정 문제(RPP)의 NP-hardness, ILP 모델링, 다면체 연구를 진행한다.", "technique": "Integer Linear Programming 모델링 및 다면체 조합론(polyhedral study); r-dependent set 문제와의 관계 규명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.11684v1", "title": "A Proof of a Conjecture on Fixed Perimeter Partitions", "authors": ["Pankaj Jyoti Mahanta"], "abstract": "Finding fixed perimeter analogues of various partition theoretic identities and inequalities has recently emerged as an active area of research. Gray, Payne, Swisher, and Watson [\\textit{Discrete Math.}, 2026] established several fixed perimeter analogues of partition theoretic results inspired by Euler's celebrated partition identity. Very recently, in a separate work [\\textit{ar{X}iv:2608.00421}, 2026], they explored fixed perimeter analogues of inequalities related to parity biases. Introducing the concept of parity bias, Kim, Kim, and Lovejoy [\\textit{Eur. J. Comb.}, 2020] conjectured that $pd_o(n)>pd_e(n)$ for all $n\\ge 20$, where $pd_o(n)$ (respectively, $pd_e(n)$) denote the number of partitions of $n$ into distinct parts having more odd parts (respectively, even parts) than even parts (respectively, odd parts). The author, together with Banerjee, Bhattacharjee, Dastidar, and Saikia [\\textit{Eur. J. Comb.}, 2022], proved this conjecture. Gray, Payne, Swisher, and Watson conjectured that a fixed perimeter analogue of this inequality holds for all $n\\ge 9$. In this paper, we confirm their conjecture.", "categories": ["math.CO", "math.NT"], "primary_category": "math.CO", "published": "2026-08-12T05:47:11+00:00", "updated": "2026-08-12T05:47:11+00:00", "abs_url": "http://arxiv.org/abs/2608.11684v1", "pdf_url": "https://arxiv.org/pdf/2608.11684v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "분할론(partition theory) 내 조합항등식 증명으로, McMullen의 기하학적 조합 문제와 주제, 도구, 문제 유형이 모두 무관함.", "summary": "고정 주변(fixed perimeter) 분할의 패리티 편향(parity bias) 부등식을 다룬다. Gray-Payne-Swisher-Watson의 추측을 확인하여 $n \\geq 9$에서 고정 주변 분할 내 홀수 부분 초과 개수가 짝수 부분 초과 개수보다 많음을 증명한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.11723v1", "title": "Every 2-Subdivision of a Cubic Graph Is Antimagic", "authors": ["Fei-Huang Chang", "Teng-Da Chang", "Zhishi Pan"], "abstract": "Let G be a finite simple cubic graph, not necessarily connected, and let S_2(G) be obtained by subdividing every edge of G twice. Li (2025) developed general constructions for antimagic labelings of repeated subdivisions, but the cubic case G(3) = S_2(G) is not covered by those methods. Our first proof constructs an edge labeling of G in which every vertex sum is sufficiently large and occurs at most twice, and then uses an orientation after subdivision to separate the remaining equal sums. A second, direct construction uses the same path decomposition to make the internal contribution at each original vertex constant, while a unique endpoint contribution distinguishes the resulting sums. The direct construction further shows that S_2(G) is strongly antimagic whenever every vertex of G has odd degree at least three.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-12T07:02:41+00:00", "updated": "2026-08-12T07:02:41+00:00", "abs_url": "http://arxiv.org/abs/2608.11723v1", "pdf_url": "https://arxiv.org/pdf/2608.11723v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Antimagic labeling of subdivided cubic graphs는 McMullen's problem의 convex position, oriented matroid, chirotope 등과 무관한 그래프 라벨링 문제이다.", "summary": "3-정규 그래프 G의 모든 간선을 2번 세분화한 그래프 S_2(G)에 대해 antimagic labeling이 항상 존재함을 증명한다. 두 가지 구성 방법을 제시하며, 두 번째 방법은 경로 분해를 이용해 각 원래 정점에서의 내부 기여도를 상수로 만들고 끝점 기여도로 합을 구분한다.", "technique": "경로 분해(path decomposition)를 이용한 간선 라벨링과 세분화 후 방향 지정(orientation)으로 동일한 합을 분리하는 방법.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13252v1", "title": "Covering the ternary cube by binary subcubes", "authors": ["Peiru Kuang", "Yan Wang"], "abstract": "For an integer $n\\ge0$, let $f(n)$ be the minimum number of subcubes of $\\mathbb{Z}_3^n$ of the form $A_1\\times\\cdots\\times A_n$, where $|A_i|=2$ for every $i$, whose union covers $\\mathbb{Z}_3^n$. A simple counting argument gives $f(n)\\ge(3/2)^n$, while $f(n)=O(n(3/2)^n)$ by random construction. We prove that $f(n)\\le2(3/2)^n-1$, answering a problem of Imre Leader. We also show that $f(n)/(3/2)^n$ is nondecreasing and there exists a constant $C_3$ such that $f(n)=(C_3+o(1))(3/2)^n$ where $1.62227<C_3\\le2$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T13:56:53+00:00", "updated": "2026-08-13T13:56:53+00:00", "abs_url": "http://arxiv.org/abs/2608.13252v1", "pdf_url": "https://arxiv.org/pdf/2608.13252v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산 기하학이나 조합론의 일반적 분야이나, McMullen's problem(볼록 위치의 점 배치, oriented matroid, 다면체 구조)과는 직접 관련성 없음.", "summary": "$\\mathbb{Z}_3^n$을 2-크기 부분집합들의 곱으로 이루어진 이진 부분큐브들로 덮는 최소 개수 $f(n)$을 연구한다. 하한 $f(n) \\ge (3/2)^n$과 상한 $f(n) \\le 2(3/2)^n-1$을 증명하고, 상수 $C_3 \\in (1.62227, 2]$에 대해 $f(n) = (C_3+o(1))(3/2)^n$임을 보인다.", "technique": "조합론적 계수 논증 및 무작위 구성(random construction)을 이용한 상한 개선.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.09787v1", "title": "On B-Colorings in Planar Graphs", "authors": ["Anthony Vuolo"], "abstract": "Gyárfás and Sárközy [Studia Sci. Math. Hungar., 2023] defined a B-coloring of a graph to be a proper coloring of the edge set in which any $C_4$ is totally multicolored. Let $q_B(G)$ denote the minimum number of colors sufficient for a B-coloring of a graph $G$. In this paper, we prove that any planar graph $G$ with $Δ=Δ(G)$ and $Δ_2=Δ_2(G)$ has $q_B(G)\\leqΔ+\\max\\{Δ_2,38\\}$, refining a bound by Kong, Wang, and Zheng [J. Graph Theory, 2026].", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-10T16:10:31+00:00", "updated": "2026-08-10T16:10:31+00:00", "abs_url": "http://arxiv.org/abs/2608.09787v1", "pdf_url": "https://arxiv.org/pdf/2608.09787v1", "journal_ref": "", "doi": "", "comment": "7 pages, 2 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "B-coloring은 평면그래프의 간선 색칠 문제로, 제시된 McMullen's problem(볼록다각형 점 배치, oriented matroid, 삼각분할)과 직접 관련이 없음.", "summary": "Gyárfás와 Sárközy의 B-coloring 개념(모든 $C_4$가 완전히 다중색)에 대해, 평면그래프 $G$의 B-coloring 색수 $q_B(G)$에 대한 상한 $\\Delta + \\max\\{\\Delta_2, 38\\}$을 증명함. 이전 Kong-Wang-Zheng의 경계를 개선한 결과.", "technique": "평면그래프의 최대차수($\\Delta$)와 두 번째 최대차수($\\Delta_2$) 매개변수를 활용한 간선 색칠 상한 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.11005v1", "title": "Minimal Bridges and a Rotation-Based Bijection", "authors": ["Benjamin Lou", "Lucas Augustus Brown"], "abstract": "A classical problem in lattice path enumeration counts paths that remain on one side of a boundary line. We study several classes of paths where this boundary is porous and show that they are related through a single half-turn rotation bijection. As a first application, we enumerate minimal bridges by relating them to excursions: for positive integers $k$ and $n$, the number of paths from $(0,0)$ to $(kn,n)$ with unit right and up steps that avoid all other lattice points on the line $y=x/k$ is $\\frac{k}{kn+n-1}\\binom{kn+n}{n}$. The same bijection yields a relation between the ordinary generating functions for binomial coefficients and $k$-Catalan numbers through a dual edge-forbidden model, extends to forbidden strips containing the diagonal, and handles a rational-slope case involving Duchon paths. Finally, our bijection also proves that the number of bridges from $(0,0)$ to $(2n,2n)$ that avoid even diagonal points is $C_{2n}+4C_{2n-1}$, with $C_n$ the $n$th Catalan number. This complements a result of Shapiro.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-11T14:51:58+00:00", "updated": "2026-08-11T14:51:58+00:00", "abs_url": "http://arxiv.org/abs/2608.11005v1", "pdf_url": "https://arxiv.org/pdf/2608.11005v1", "journal_ref": "", "doi": "", "comment": "14 pages, 9 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "격자 경로 열거와 조합론적 구조를 다루지만 McMullen의 문제(볼록 위치의 점 배치, oriented matroid, 실현성)와는 직접적 관련이 없음.", "summary": "경계선이 다공성인 격자 경로 클래스들을 연구하고, 반회전(half-turn rotation) 전단사를 통해 최소 다리(minimal bridges)를 여행(excursions)과 관련시킨다. $(0,0)$에서 $(kn,n)$으로 가는 경로 중 직선 $y=x/k$ 위의 다른 격자점을 피하는 경로의 개수를 $\\frac{k}{kn+n-1}\\binom{kn+n}{n}$으로 열거하며, 이항계수와 $k$-Catalan 수 생성함수 간의 관계를 도출한다.", "technique": "회전 기반 전단사(rotation-based bijection)를 이용한 경로 열거 및 생성함수 관계식 도출.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13015v1", "title": "On the Restricted Edge-Cuts of Optimal 1-Planar Graphs", "authors": ["Licheng Zhang", "Zhangdong Ouyang", "Yuanqiu Huang", "Guiping Wang"], "abstract": "The restricted edge-connectivity of a graph is the minimum size of an edge-cut whose removal leaves every component with at least two vertices. In 2024, Zhang et al. showed that the restricted edge-connectivity of any optimal $1$-planar graph belongs to $\\{8,10,12\\}$. In this paper, we exclude $8$ as a possible value, thereby proving that the restricted edge-connectivity is either $10$ or $12$, and both values are attainable. Furthermore, we show that the restricted edge-connectivity of a 6-connected optimal 1-planar graph equals $10$ if and only if the graph contains an edge whose two endvertices both have degree $6$. As a key ingredient, we characterize the structure of vertex-induced subgraphs on $n$ vertices with $4n-9$ edges in optimal 1-planar graphs, and use this characterization to establish a connection between restricted edge-cuts and vertex-cuts in optimal 1-planar graphs.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T09:34:55+00:00", "updated": "2026-08-13T09:34:55+00:00", "abs_url": "http://arxiv.org/abs/2608.13015v1", "pdf_url": "https://arxiv.org/pdf/2608.13015v1", "journal_ref": "", "doi": "", "comment": "11 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "1-평면 그래프의 제한된 간선 연결도 문제로, McMullen's problem의 볼록 위치·배향 매트로이드·다면체 구조와 무관.", "summary": "최적 1-평면 그래프(optimal 1-planar graph)의 제한된 간선 연결도(restricted edge-connectivity)가 {10,12}에만 속함을 증명. 6-연결 최적 1-평면 그래프에서 제한된 간선 연결도가 10이 되는 필요충분조건을 특성화.", "technique": "최적 1-평면 그래프에서 n개 정점과 4n-9개 간선을 가진 정점 유도 부분그래프의 구조 특성화를 통해 제한된 간선 절단과 정점 절단 사이의 연결 수립.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.09770v1", "title": "Caged subsequences in permutations", "authors": ["Niranjan Balachandran", "Omkar Ramdas", "Umesh Shankar"], "abstract": "Given a sequence $\\mathfrak{a}:=(a_1,\\ldots,a_n)$ of reals, a subsequence $\\mathfrak{b}=(a_{i_1},\\ldots,a_{i_k})$ is said to be \"caged\" if the largest and smallest among the members of $\\mathfrak{b}$ are $a_{i_1}$ and $a_{i_k}$, though not necessarily in that order. In this paper, we consider the problem of maximal caged sequences in permutations $π\\in S_n$. We also consider the same problem for a random permutation, both when the permutation is chosen uniformly at random and also when it is picked uniformly at random from among the permutations of rectangular shape, via the RSK correspondence.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-10T15:58:32+00:00", "updated": "2026-08-10T15:58:32+00:00", "abs_url": "http://arxiv.org/abs/2608.09770v1", "pdf_url": "https://arxiv.org/pdf/2608.09770v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Permutation 구조와 combinatorial properties를 다루지만, McMullen's problem의 convex position, oriented matroid, realizability와는 직접적 연관이 없음.", "summary": "본 논문은 순열(permutation)에서 \"caged subsequence\"의 최대 길이를 연구한다. Caged subsequence는 부분수열의 최댓값과 최솟값이 양 끝에 위치하는 부분수열이며, 균등 무작위 순열과 RSK 대응을 통한 직사각형 모양의 순열에 대해 분석한다.", "technique": "RSK (Robinson-Schensted-Knuth) correspondence를 이용한 무작위 순열 분석", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.12948v1", "title": "A relaxation of the Bermond-Thomassen conjecture", "authors": ["Stéphane Bessy", "Matthijs Muis", "Jean-Sébastien Sereni", "Raphael Steiner", "Sebastian Wiederrecht"], "abstract": "The well-known Bermond-Thomassen conjecture states that every digraph of minimum out-degree at least $2k-1$ contains $k$ vertex-disjoint directed cycles. Despite being posed in 1981, this conjecture remains unresolved for all $k \\ge 4$. We prove a relaxation of this conjecture: every digraph $D$ of minimum out-degree at least $2k-1$ contains $k$ vertex-disjoint cycles, each of which either is directed or can be made directed by reversing one of its arcs. This bound is sharp and answers a question raised by Cames van Batenburg during the online workshop \"Entropy Compression and Related Methods\" in $2021$.", "categories": ["math.CO", "cs.DM"], "primary_category": "math.CO", "published": "2026-08-13T08:21:56+00:00", "updated": "2026-08-13T08:21:56+00:00", "abs_url": "http://arxiv.org/abs/2608.12948v1", "pdf_url": "https://arxiv.org/pdf/2608.12948v1", "journal_ref": "", "doi": "", "comment": "10 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Bermond-Thomassen 추측은 방향 그래프의 순환 구조에 관한 문제로, McMullen's problem(볼록 위치의 점 배치와 oriented matroid 관련)과는 직접적인 연결이 없음.", "summary": "본 논문은 1981년 제기된 Bermond-Thomassen 추측의 완화된 형태를 증명한다. 최소 나가는 차수(out-degree)가 최소 $2k-1$ 이상인 방향 그래프는 $k$개의 정점-분리된 순환을 포함하며, 각 순환은 방향 순환이거나 한 호(arc)를 역방향으로 변환하여 방향 순환으로 만들 수 있음을 보인다. 이 경계는 sharp하며 2021년 온라인 워크숍에서 제기된 질문에 답한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.09716v1", "title": "Degree sum conditions for a graph to have bounded conflict-free connection number", "authors": ["Dinh Hanh Dang", "Trung Duy Doan", "Pham Hoang Ha", "Vu Quang Minh"], "abstract": "A path in an edge-coloured graph is called \\emph{conflict-free} if a colour is exclusively applied to one of its edges. A graph $G$ is considered \\emph{conflict-free connected} if every pair of vertices in $V(G)$ is connected by a conflict-free path. The minimum number of colours required to render a connected graph $G$ conflict-free connected is referred to as the \\emph{conflict-free connection number}. In this paper, we introduce several sharp conditions on the minimum degree sum of any $4$ independent vertices in $G$ to ensure that the conflict-free connection number of $G$ is bounded.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-10T15:18:25+00:00", "updated": "2026-08-10T15:18:25+00:00", "abs_url": "http://arxiv.org/abs/2608.09716v1", "pdf_url": "https://arxiv.org/pdf/2608.09716v1", "journal_ref": "", "doi": "", "comment": "20 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "conflict-free coloring과 degree sum conditions는 그래프 색칠 및 연결성 문제이며, McMullen's problem은 convex position과 oriented matroid의 조합기하 문제로 직접적 관련성이 매우 약함.", "summary": "본 논문은 간선 색칠 그래프에서 경로의 conflict-free 성질을 연구하며, 특히 4개의 독립 정점들의 최소 차수 합 조건이 conflict-free connection number를 제한하는 방법을 제시한다. Sharp degree sum conditions를 통해 그래프의 conflict-free 연결성을 보장하는 필요충분조건을 도출한다.", "technique": "4개 독립 정점의 차수 합에 대한 degree sum conditions를 이용한 그래프 이론적 접근.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.10193v1", "title": "A Necessary and Sufficient Hall Condition for Hypergraphs", "authors": ["Xiaoyao Huang"], "abstract": "We prove a necessary and sufficient Hall condition for a family $A=(A_e)_{e\\in E(G)}$ of hypergraphs, possibly with loops, indexed by the edges of a forest $G$. We also show that acyclicity of the index graph is sharp for this Hall characterization. As an application, we prove that every $5$-tough chordal graph is Hamilton-connected, improving earlier sufficient toughness bounds for Hamiltonicity of $18$ in 1998 and $10$ in 2017.", "categories": ["math.CO", "cs.DM", "cs.DS"], "primary_category": "math.CO", "published": "2026-08-10T20:11:09+00:00", "updated": "2026-08-10T20:11:09+00:00", "abs_url": "http://arxiv.org/abs/2608.10193v1", "pdf_url": "https://arxiv.org/pdf/2608.10193v1", "journal_ref": "", "doi": "", "comment": "15 pages, 2 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "초록에 제시된 Hall condition, hypergraph, Hamilton-connectivity, toughness 개념들은 McMullen's problem (oriented matroid, convex position, realizability)과 직접적 관련성 없음.", "summary": "논문은 forest에 의해 색인된 초그래프 족에 대한 Hall 조건의 필요충분 특성화를 증명하고, 지수 그래프의 무순환성이 이 특성화에 필수적임을 보인다. 응용으로서 모든 5-tough chordal 그래프가 Hamilton-connected임을 증명하여, Hamiltonicity에 대한 이전의 toughness 한계(1998년 18, 2017년 10)를 개선한다.", "technique": "Graph-indexed hypergraph family에 대한 Hall 조건의 조합론적 특성화; forest 무순환성을 활용한 충분성과 필요성 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13273v1", "title": "A Finite Automaton Approach to Combinatorial Games", "authors": ["Kai Liang"], "abstract": "This study applies finite automata to the automatic solving of a variety of combinatorial games.   For games whose positions and moves can be represented as regular languages and their operations,   we design a two-stage automatic solving algorithm: first, construct a candidate finite automaton to determine the $\\mathcal{P}$- and $\\mathcal{N}$-positions, and then perform rigorous formal verification on this automaton; once verified, a complete solution of the game is obtained.   For partizan octal games, we introduce a generalized misère quotient, overcoming the limitation that traditional theory applies only to impartial games.   Using the above algorithm, we successfully solve the majority of two-digit partizan octal games, and based on these results, we propose a partizan version of Guy's conjecture.   We also successfully solve a considerable number of partizan octal games under misère play, and give a conjecture on the structure of those games exhibiting ``algebraic periodicity'' among them.   For Kotzig's nim, we resolve the most important related conjecture: we prove that the outcomes and SG values are periodic under both normal and misère play (including their partizan versions).   Our algorithm successfully solves several small-scale cases, including misère play and partizan versions.   This study pioneers a new theoretical tool and algorithmic paradigm for the automatic solving of combinatorial games, and has broad prospects for further extension and application in the field of combinatorial game theory.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T14:10:55+00:00", "updated": "2026-08-13T14:10:55+00:00", "abs_url": "http://arxiv.org/abs/2608.13273v1", "pdf_url": "https://arxiv.org/pdf/2608.13273v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 분야이나 McMullen's problem(볼록 위치, oriented matroid, 다면체 기하)과 무관하게 조합 게임 이론과 유한 오토마타에 집중.", "summary": "이 논문은 유한 오토마타를 이용하여 조합 게임의 자동 해결 알고리즘을 제시한다. 정규 언어로 표현 가능한 게임 위치와 이동에 대해 두 단계 알고리즘(후보 오토마타 구성 및 형식 검증)을 설계하였고, 준-Partizan octal games와 Kotzig's nim의 다수 경우를 해결하였으며 관련 추측을 제안했다.", "technique": "유한 오토마타 기반 게임 위치 분류와 형식 검증을 통한 자동 게임 해결 알고리즘.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13264v1", "title": "The Gromov-Hausdorff Distance Between Consecutive Spheres", "authors": ["Donghan Kim", "Sunhyuk Lim", "Facundo Memoli"], "abstract": "We determine the Gromov-Hausdorff distance between consecutive unit round spheres equipped with their geodesic metrics. Put $ζ_n:=\\arccos(-\\tfrac{1}{n+1}),$ the common geodesic distance between distinct vertices of a regular simplex with $n+2$ vertices inscribed in $\\mathbb{S}^n$.   We prove that $$ d_{\\mathrm{GH}}(\\mathbb{S}^n,\\mathbb{S}^{n+1})=\\frac{ζ_n}{2} \\qquad(n\\geq1), $$ resolving a conjecture of Lim, Mémoli, and Smith. All cases $n\\geq4$ were previously open.   This equality is established by explicitly constructing a family of correspondences $\\mathcal R_n\\subseteq \\mathbb{S}^{n+1}\\times \\mathbb{S}^n$, whose distortion matches the known quantitative Borsuk-Ulam lower bound $ζ_n$.   We also introduce synchronized spherical joins and suspensions of correspondences and prove that the distortion of a join is exactly the maximum of the distortions of its factors. In particular, suspension preserves distortion. Applying these join and suspension operations to the optimal correspondences $\\mathcal R_n$ yields new bounds for spheres of nonconsecutive dimensions, including $$ \\lim_{m\\to\\infty} d_{\\mathrm{GH}}\\bigl(\\mathbb{S}^m,\\mathbb{S}^{m+d(m)}\\bigr) = \\fracπ{4} \\qquad\\text{whenever } d(m)\\geq1,\\ \\text{and }d(m)=o(m).$$", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-13T14:01:37+00:00", "updated": "2026-08-13T14:01:37+00:00", "abs_url": "http://arxiv.org/abs/2608.13264v1", "pdf_url": "https://arxiv.org/pdf/2608.13264v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "메트릭 기하학과 Gromov-Hausdorff 거리 연구로, 제시된 McMullen's problem(convex position, general position, oriented matroid)과 직접적 교집합 없음.", "summary": "이 논문은 연속된 단위 구 $\\mathbb{S}^n$과 $\\mathbb{S}^{n+1}$ 사이의 Gromov-Hausdorff 거리를 결정하며, $d_{\\mathrm{GH}}(\\mathbb{S}^n,\\mathbb{S}^{n+1})=\\frac{\\zeta_n}{2}$ (단, $\\zeta_n:=\\arccos(-1/(n+1))$)임을 증명한다. 명시적 대응(correspondence) 구족과 Borsuk-Ulam 하한을 활용하여 $n\\geq4$ 경우를 해결하고, 구면 조인(spherical join)과 서스펜션 연산을 도입하여 비연속 차원 구들 사이의 거리에 대한 새로운 경계를 도출한다.", "technique": "정규 심플렉스의 꼭짓점 기하거리를 이용한 명시적 대응 구성과 Borsuk-Ulam 정리 기반 하한 달성.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.12673v1", "title": "Weakened Gallai-Ramsey Numbers for Books", "authors": ["Mark Budden", "Adam Gregory"], "abstract": "For $1\\le s<t$ and any graph $G$, the weakened Gallai-Ramsey number $gr^t_s(G)$ is defined to be the least $p\\in \\mathbb{N}$ such that every Gallai $t$-coloring of the edges of $K_p$ (i.e., a $t$-coloring that lacks rainbow triangles) contains a subgraph isomorphic to $G$ whose edges use at most $s$ of the colors. In the case of a book graph $B_n:=K_2+nK_1$, Jakhar and Moun determined the values $gr^3_2(B_3)=6$ and $gr^3_2(B_4)=7$. In this paper, we extend their results to $t>3$ colors, and we determine the values of $gr^3_2(B_n)$ for $5\\le n\\le 15$. General lower bounds for $gr^t_2(B_n)$ are also given.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T00:15:23+00:00", "updated": "2026-08-13T00:15:23+00:00", "abs_url": "http://arxiv.org/abs/2608.12673v1", "pdf_url": "https://arxiv.org/pdf/2608.12673v1", "journal_ref": "", "doi": "", "comment": "32 pages, 10 figures", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Weakened Gallai-Ramsey numbers are a Ramsey theory problem on colored complete graphs; McMullen's problem concerns convex position and oriented matroids in discrete geometry.", "summary": "논문은 약화된 갤라이-램지 수(weakened Gallai-Ramsey number) $gr^t_s(G)$를 연구하며, 특히 책 그래프(book graph) $B_n$에 대해 $gr^3_2(B_n)$의 값을 $5 \\le n \\le 15$ 범위에서 결정합니다. 갈라이 $t$-칠하기(rainbow triangle 없음)에서 최대 $s$개 색을 사용하는 부분그래프의 존재 조건을 탐구합니다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.09353v1", "title": "The Sharp Upper Bounds for the Median Eigenvalues of Graphs", "authors": ["Zhengbo Chen", "Yuzhenni Wang", "Xiao-Dong Zhang"], "abstract": "Let $λ_1\\geqλ_2\\geq\\cdots\\geqλ_n$ be the eigenvalues of a simple graph $G$ of order $n$. The HL-index of $G$ is defined by $R(G)=\\max\\|λ_h|,|λ_\\ell|\\}$ with $h=\\lfloor(n+1)/2\\rfloor$ and $\\ell=\\lceil(n+1)/2\\rceil$.In this paper, we prove that if $G$ is $ K_4$-minor-free or $ K _ {2,3} $-minor-free, then $R(G)\\leq\\sqrt{5}-1$ with equality attained by an infinite family of outerplanar graphs.Moreover, we show that $R(G)\\leq\\sqrt{d-2}$ for triangle-free graphs with maximum degree at most $d$ and average degree at most $(d-2)(d^2-2d+2)/(d^2-3d+5)$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-10T09:32:13+00:00", "updated": "2026-08-10T09:32:13+00:00", "abs_url": "http://arxiv.org/abs/2608.09353v1", "pdf_url": "https://arxiv.org/pdf/2608.09353v1", "journal_ref": "", "doi": "", "comment": "15 pages, 1 figure", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "스펙트럼 그래프 이론의 고전적 문제로, McMullen's problem의 기하학적·조합론적 구조와는 직접 관련이 없음.", "summary": "단순 그래프의 중앙 고유값(median eigenvalue)에 대한 상한을 연구한다. $K_4$-minor-free 또는 $K_{2,3}$-minor-free 그래프에서 HL-index $R(G) \\leq \\sqrt{5}-1$을 증명하고, 삼각형-free 그래프에 대한 일반적 상한도 제시한다.", "technique": "그래프의 minor-free 조건과 차수 제약을 이용한 스펙트럼 경계 기법", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.13501v1", "title": "The transversal achievement game on a square grid", "authors": ["Kevin Guan"], "abstract": "In the transversal achievement game on the $n\\times n$ board, two players alternately claim cells, and the first to own a transversal---a set of $n$ cells of which no two share a row or column---wins. Ranđelović showed that the first player wins for every $n\\ge4$, while the game is a draw for $n=2,3$. We give an independent proof that the first player wins for $n\\ge4$ that additionally establishes a bound on the length of the win: the given strategy forces a win by ply $2n+3$, i.e.\\ on the first player's $(n+2)$-nd move, for every $n\\ge4$. The proof yields a strategy that is fully determined by a fixed rule on the current position and can thus be implemented directly. We isolate the use of the hypothesis $n\\ge4$ to two steps in the analysis, explaining why the argument fails at $n=3$. An exhaustive computational search implementing the strategy verifies it against every legal defense for $n=4,5,6$, confirming both the strategy's validity and that the $2n+3$ bound is attained in these cases. The main theorem has also been formalized and machine-checked in Lean 4.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T17:29:38+00:00", "updated": "2026-08-13T17:29:38+00:00", "abs_url": "http://arxiv.org/abs/2608.13501v1", "pdf_url": "https://arxiv.org/pdf/2608.13501v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론의 게임 이론 문제이지만 McMullen's problem(고차원 볼록기하 및 면 격자)과는 직접적 관련성 없음.", "summary": "n×n 격자판에서 두 선수가 교대로 셀을 차지하며 행과 열이 중복되지 않는 n개 셀의 집합(transversal)을 먼저 완성하는 게 우승 조건인 게임을 분석. 저자는 n≥4일 때 선공이 2n+3 수 안에 승리함을 증명하고 Lean 4로 형식화 검증.", "technique": "전략적 위치 분석과 exhaustive computational search를 결합한 게임 트리 검증; Lean 4 형식 증명.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.15853v1", "title": "Disconnected graphs and extremal bounds for realizable distance orders", "authors": ["Gerardo L. Maldonado", "Leonardo Martínez-Sandoval", "Miguel Raggi", "Edgardo Roldán-Pensado"], "abstract": "Let $G$ be a graph together with a total order $\\prec$ on its edges. We say that $\\prec$ is realizable in $\\mathbb{R}^d$ if there is a placement of the vertices of $G$ in $\\mathbb{R}^d$ such that the Euclidean lengths of the edges induce exactly the order $\\prec$. Almendra-Hernández and Martínez-Sandoval proved that every total order on the edges of the complete graph $K_n$ is realizable in $\\mathbb{R}^{n-2}$. We show that the same is not true for the disjoint union of two complete graphs: for every $n\\geq 3$ there is a total order on the edges of $K_n\\sqcup K_n$ that is not realizable in $\\mathbb{R}^{n-2}$, but is in $\\mathbb{R}^{n-1}$. Surprisingly, the realizability of an order on a disconnected graph is not determined by its restrictions to the connected components. We also study realizability on the real line: we characterize which disjoint unions of two cycles are realizable, and estimate the largest number of edges an $n$-vertex graph can have while all of its edge-orders remain realizable on the line. In general dimension, we show that the largest number of edges of an $n$-vertex graph all of whose edge-orders are realizable in $\\mathbb{R}^d$ is $dn+O\\!\\left(dn/\\ln(dn)\\right)$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-16T16:51:57+00:00", "updated": "2026-08-16T16:51:57+00:00", "abs_url": "http://arxiv.org/abs/2608.15853v1", "pdf_url": "https://arxiv.org/pdf/2608.15853v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프 간선의 거리 순서 실현 가능성(distance order realizability)을 다루며, McMullen 문제나 Larman 추측과는 직접적 연관이 없다.", "summary": "완전그래프 $K_n$의 모든 간선 전순서(total order)는 $\\mathbb{R}^{n-2}$에서 실현 가능하다는 기존 결과와 달리, 두 완전그래프의 분리합 $K_n \\sqcup K_n$에는 $\\mathbb{R}^{n-2}$에서 실현 불가능하지만 $\\mathbb{R}^{n-1}$에서는 실현 가능한 순서가 존재함을 보인다. 또한 실수선($\\mathbb{R}^1$) 위에서 두 사이클의 분리합에 대한 실현 가능성을 완전히 특성화하고, $n$개 꼭짓점 그래프 중 모든 간선 순서가 $\\mathbb{R}^d$에서 실현 가능한 그래프의 최대 간선 수가 $dn + O(dn/\\ln(dn))$임을 밝힌다.", "technique": "비연결 그래프에서 실현 가능성이 연결 성분별 제한으로 결정되지 않음을 반례로 보이고, 실수선 실현 가능성 특성화 및 극값 조합론적 추정을 활용한다.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2608.12207v1", "title": "The Hajnal-Szemerédi theorem in digraphs revisited", "authors": ["Louis DeBiasio", "Hal Kierstead"], "abstract": "Treglown conjectured (in a complementary form) that for every positive integer $k$, every digraph $D$ satisfying $\\min\\{d^+(v),d^-(v)\\}\\le k-1$ for all $v\\in V(D)$ has an equitable acyclic $k$-coloring. If true, this would imply the acyclic coloring versions of the Hajnal-Szemerédi theorem for digraphs proved by Czygrinow, DeBiasio, Kierstead, and Molla (which in turn imply the original Hajnal-Szemerédi theorem for graphs).   As it turns out, there is a simple reduction implicit in Aboulker, Oijid, Petit, Rocton, and Simon which surprisingly shows that Treglown's conjecture (and thus the results of Czygrinow, DeBiasio, Kierstead, and Molla) follows directly from the original Hajnal--Szemerédi theorem for graphs. We slightly modify the reduction in order to show that there exists a polynomial time algorithm for finding an equitable acyclic $k$-coloring in such a digraph.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-12T16:02:32+00:00", "updated": "2026-08-12T16:02:32+00:00", "abs_url": "http://arxiv.org/abs/2608.12207v1", "pdf_url": "https://arxiv.org/pdf/2608.12207v1", "journal_ref": "", "doi": "", "comment": "6 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "방향 그래프의 색칠 문제로, McMullen's problem의 점 배치 및 oriented matroid와는 직접 관련이 없음.", "summary": "본 논문은 방향 그래프에서 균등한 비순환 k-색칠의 존재성에 관한 Treglown의 추측을 다룬다. 저자들은 Aboulker 등의 축약을 통해 이 추측이 원래의 무방향 그래프 Hajnal-Szemerédi 정리로부터 직접 따른다는 것을 보이고, 다항식 시간 알고리즘을 제시한다.", "technique": "그래프 색칠 이론의 축약(reduction) 기법을 이용하여 무방향 결과를 방향 그래프 경우로 확장.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.12284v1", "title": "The finite basis problem for the flat semirings $S(W)$", "authors": ["Zidong Gao", "Miaomiao Ren", "Xianzhong Zhao"], "abstract": "We focus on the finite basis problem for flat semirings of the form $S(W)$, where $W$ is an arbitrary set of nonempty words. We prove that $S(W)$ generates a Cross variety (and hence is finitely based) whenever every word in $W$ has length at most $3$, whereas it is nonfinitely based whenever there exists $k \\geq 3$ such that $W$ is $x^{k+2}$-free but not $x^{k+1}$-free. In particular, if $W_k$ denotes the set of all words of length $k$, then $S(W_k)$ is finitely based if and only if $k \\leq 3$. Moreover, $S(W)$ is nonfinitely based whenever $W$ is finite and not $x^4$-free. These results provide a partial answer to an open problem raised by Jackson et al.~(J Algebra 611: 211--245, 2022).", "categories": ["math.CO", "math.RA"], "primary_category": "math.CO", "published": "2026-08-12T17:28:42+00:00", "updated": "2026-08-12T17:28:42+00:00", "abs_url": "http://arxiv.org/abs/2608.12284v1", "pdf_url": "https://arxiv.org/pdf/2608.12284v1", "journal_ref": "", "doi": "", "comment": "26 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Finite basis problem for flat semirings는 Universal algebra와 variety theory의 문제로, McMullen's problem의 discrete geometry·combinatorial optimization과 무관함.", "summary": "본 논문은 단어 집합 $W$로 정의된 flat semiring $S(W)$의 유한 기저 문제를 연구합니다. $W$의 모든 단어 길이가 최대 3이면 $S(W)$는 Cross variety를 생성하여 finitely based이며, $k \\geq 3$에 대해 $W$가 $x^{k+2}$-free이지만 $x^{k+1}$-free가 아니면 nonfinitely based입니다.", "technique": "Word pattern avoidance (freeness 조건) 및 variety 이론을 이용한 유한 기저 판정.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.16639v1", "title": "The maximum number of maximal dissociation sets in trees", "authors": ["Meiqin Wang", "Min Xu", "Ning Zhang"], "abstract": "Let $G$ be a simple graph. A dissociation set of $G$ proposed by Yannakakis in $1981$ is defined as a set of vertices that induces a subgraph in which every vertex has a degree of at most $1$. A dissociation set is maximal if it is not contained as a proper subset in any other dissociation set. In $2025$, Wang et al.\\cite{ZiyuanWang} established that for any tree $T$ of order $n\\geq 4$, the number of maximal dissociation sets in $T$ is at most $3^{\\frac{n-1}{3}}+\\frac{n-1}{3}$ and characterized the extremal trees attaining the upper bound. They also proposed a conjecture about the upper bound of the maximal dissociation set. In this paper, we consider this conjecture and show that the maximum number of maximal dissociation sets in a tree of order $n(n\\geq 3)$ is $g(n)$, where \\[ g(n) = \\begin{cases} n, & n=3,4,5,6,\\\\ 3^{\\frac{n-1}{3}}+\\frac{n-1}{3}, & n \\equiv 1 \\pmod{3},~n\\geq7,\\\\ 4\\cdot 3^{\\frac{n-5}{3}}+n-5, & n \\equiv 2 \\pmod{3},~n\\geq8, \\\\ 16\\cdot 3^{\\frac{n-9}{3}}+3n-25, & n \\equiv 0 \\pmod{3},~n\\geq12~\\text{and }~n\\neq21, \\\\ 19, & n=9, \\\\ 1349, & n=21. \\end{cases} \\] We also characterize the extremal trees with the maximum number of maximal dissociation sets.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-17T14:35:54+00:00", "updated": "2026-08-17T14:35:54+00:00", "abs_url": "http://arxiv.org/abs/2608.16639v1", "pdf_url": "https://arxiv.org/pdf/2608.16639v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "트리의 maximal dissociation set 개수 최대값은 McMullen's problem의 convex position, oriented matroid, 또는 triangulation 문제와 직접적인 개념적 또는 도구적 연관이 없음.", "summary": "본 논문은 트리에서 maximal dissociation set의 최대 개수를 연구한다. Dissociation set은 모든 정점의 차수가 최대 1인 부분그래프를 유도하는 정점 집합이며, 논문은 트리의 크기 $n$에 따라 이 개수의 정확한 상한 $g(n)$을 결정하고 extremal tree를 특성화한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.15992v1", "title": "Two conjectures on graphs and their edge-path matrices", "authors": ["Metrose Metsidik", "Xian'an Jin"], "abstract": "The edge-path matrix is a square matrix where each off-diagonal entry records the maximum number of edge-disjoint paths between the corresponding pair of vertices. Akbari et al. [On edge-path eigenvalues of graphs, Linear Multilinear Algebra 70 (2022) 2998-3008] proposed two conjectures: Conjecture 1 relates the edge-path matrix to an upper bound on the number of edges in the graph, while Conjecture 2 asserts that a graph is Eulerian if and only if all entries of its edge-path matrix are even. In this paper, we prove the two conjectures.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-17T01:05:07+00:00", "updated": "2026-08-17T01:05:07+00:00", "abs_url": "http://arxiv.org/abs/2608.15992v1", "pdf_url": "https://arxiv.org/pdf/2608.15992v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프의 edge-path 행렬 성질과 오일러성(Eulerian property)에 관한 조합론 문제로, McMullen's problem의 점 배치·방향성·조합구조와는 직접 관련이 없음.", "summary": "본 논문은 edge-path 행렬(각 엔트리가 두 정점 사이 최대 edge-disjoint path 개수를 기록)에 관한 두 추측을 증명한다. 첫 번째 추측은 edge-path 행렬과 그래프의 간선 개수 상한의 관계를 다루고, 두 번째 추측은 그래프가 오일러 그래프일 필요충분조건이 edge-path 행렬의 모든 엔트리가 짝수임을 주장한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.12832v1", "title": "Bricks that every removable edge is solitary", "authors": ["Jinxin Xue", "Jun Ge", "Fuliang Lu", "Yaxian Zhang"], "abstract": "A brick is a 3-connected graph $G$ such that $G-u-v$ has a perfect matching for any two distinct vertices $u,v\\in V(G)$. An edge $e$ in a matching covered graph $G$ is removable if $G-e$ is matching covered. We say that a removable edge $e$ in a brick $G$ is $b$-invariant if $b(G-e)=b(G)=1$, where $b(H)$ denotes the number of bricks in the tight cut decomposition of a matching covered graph $H$. An edge of a graph is solitary if it lies in precisely one perfect matching.   Lucchesi and Murty proposed the problem of characterizing bricks, distinct from $K_4$, $\\overline{C_6}$ and the Petersen graph, in which every $b$-invariant edge is solitary. Note that every $b$-invariant edge is removable. In this paper, we strengthen the condition by requiring that every removable edge is solitary. We show that every nonsolid brick satisfying this strengthened condition can be obtained by repeatedly splicing odd wheels (up to multiple edges). Moreover, properties of such bricks imply that \"repeatedly splicing odd wheels\" cannot be replaced by \"repeatedly splicing copies of $K_4$\".", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-13T05:10:49+00:00", "updated": "2026-08-13T05:10:49+00:00", "abs_url": "http://arxiv.org/abs/2608.12832v1", "pdf_url": "https://arxiv.org/pdf/2608.12832v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Matching covered graphs와 brick 구조는 조합론의 고전 주제이지만 McMullen's problem (고차원 convex position, oriented matroid)과는 직접적 관련이 없음.", "summary": "본 논문은 brick(3-연결 matching covered graph의 특수한 종류)의 특성화 문제를 다룬다. 모든 removable edge가 solitary(정확히 하나의 perfect matching에만 포함)인 nonsolid brick은 odd wheels의 반복적인 splicing으로 구성됨을 보인다.", "technique": "Tight cut decomposition과 brick의 splicing 연산을 통한 구조적 특성화; perfect matching의 유일성 조건 활용.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.11665v1", "title": "Forbidden-Total-Size Nim", "authors": ["Hiromi Oginuma", "Masato Shinoda"], "abstract": "We consider a variant of Nim in which, for a fixed set $S$ of nonnegative integers, a move is forbidden if the total number of remaining stones belongs to $S$. This game coincides with normal-play Nim when $S=\\emptyset$, and with misère Nim when $S=\\{0\\}$. In this paper, we focus in particular on the case where $S$ is the set of multiples of $d$, and show that simple criteria for determining the outcome can be obtained for $d=2,3,4$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-12T05:22:00+00:00", "updated": "2026-08-12T05:22:00+00:00", "abs_url": "http://arxiv.org/abs/2608.11665v1", "pdf_url": "https://arxiv.org/pdf/2608.11665v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "조합론 게임 이론(combinatorial game theory)은 이산기하학 분야와 무관하며, McMullen's problem은 convex position과 oriented matroid의 기하학적 구조에 관한 것으로 본 논문의 Nim 변형과 직접적 연관이 없음.", "summary": "이 논문은 Nim의 변형을 연구하며, 특정 집합 S에 속하는 남은 돌의 총 개수를 가진 상태에서는 이동이 금지되는 규칙을 분석한다. S가 d의 배수 집합일 때 d=2,3,4에 대해 게임의 결과를 결정하는 간단한 기준을 제시한다.", "technique": "", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.14304v1", "title": "Splitting fields and spectral invariants of character degree graphs in solvable groups", "authors": ["G. Sivanesan", "C. Selvaraj", "Jacob Laubacher"], "abstract": "In this paper, we investigate the eigenvalues of character degree graphs, with particular emphasis on the arithmetic properties of their spectra. First, we study \\((n-2)\\)-regular character degree graphs of solvable groups and derive an explicit formula for their characteristic polynomials. We show that all their eigenvalues are rational and, consequently, that their splitting field is \\(\\mathbb{Q}\\). We then consider supergraphs obtained by adding edges to these graphs and prove that the corresponding splitting field is a quadratic extension of \\(\\mathbb{Q}\\).   Next, using their structural decomposition, we examine a general class of Lewis graphs. For this class, we establish bounds on both the number of irrational eigenvalues and the degree of the associated splitting fields. Finally, we investigate prime character degree graphs of diameter \\(3\\), focusing on the arithmetic nature of their eigenvalues and the degree of their splitting fields.", "categories": ["math.CO", "math.GR"], "primary_category": "math.CO", "published": "2026-08-14T13:40:47+00:00", "updated": "2026-08-14T13:40:47+00:00", "abs_url": "http://arxiv.org/abs/2608.14304v1", "pdf_url": "https://arxiv.org/pdf/2608.14304v1", "journal_ref": "", "doi": "", "comment": "24 pages, 5 figures, comments welcome", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "문자 차수 그래프의 고유값과 분할체를 연구하는 군론·그래프 스펙트럼 문제로, McMullen's problem의 조합기하학적 점 배치 및 oriented matroid 문제와 직접 관련이 없음.", "summary": "이 논문은 가해군의 문자 차수 그래프(character degree graphs)의 고유값을 연구하며, (n-2)-정규 그래프의 특성다항식에 대한 명시 공식을 도출하고 모든 고유값이 유리수임을 보임. 그래프에 간선을 추가한 경우의 분할체가 $\\mathbb{Q}$의 2차 확대임을 증명하고, Lewis 그래프 클래스와 지름 3인 소수 문자 차수 그래프에 대한 무리수 고유값의 개수 및 분할체 차수의 경계를 확립함.", "technique": "그래프의 구조적 분해(structural decomposition)와 스펙트럼 분석을 통한 고유값의 산술적 성질 연구.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.15281v1", "title": "A Ten-Vertex Counterexample to a Conjecture on Unstable Graphs", "authors": ["Prateek R. Srivastava"], "abstract": "Mizzi conjectured that every nontrivially unstable graph contains cycles C_k and C_{2k} for some odd k. We give a connected, nonbipartite, vertex-determining counterexample on ten vertices. Its instability is certified by an explicit nontrivial two-fold automorphism, and its complete set of simple-cycle lengths is {5,5,6}.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-15T15:26:34+00:00", "updated": "2026-08-15T15:26:34+00:00", "abs_url": "http://arxiv.org/abs/2608.15281v1", "pdf_url": "https://arxiv.org/pdf/2608.15281v1", "journal_ref": "", "doi": "", "comment": "2 pages; includes an exact, dependency-free verifier as an ancillary file", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "그래프 이론의 구체적 조합론 문제이나, McMullen's problem(볼록 기하 및 점 배치)과 직접 관련성 없음.", "summary": "Mizzi의 비안정 그래프(unstable graphs) 추측을 반박하는 10-정점 반례를 제시한다. 이 그래프는 연결되어 있고 비이분이며, 단순 사이클 길이 집합이 {5,5,6}이고 자명하지 않은 이중 자기동형으로 비안정성이 입증된다.", "technique": "명시적 자기동형(two-fold automorphism)을 통한 비안정성 증명 및 사이클 구조 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.18003v1", "title": "Combinatorial Hodge Index Theorem for Polytopes", "authors": ["Jacob B. Wood"], "abstract": "Toric varieties can be constructed from rational polytopes, and several invariants of toric varieties can be expressed in terms of the combinatorics of the corresponding polytope. Barthel-Brasselet-Fieseler-Kaup (BBFK) introduced combinatorial intersection cohomology for convex polytopes, which agrees with the intersection cohomology of the associated toric variety when the polytope is rational. Maxim-Schuermann computed the intersection cohomology signature of a projective toric variety, corresponding to the case of a polytope with rational vertices. Using the combinatorial framework of BBFK, we show that the Maxim-Schuermann formula extends to arbitrary convex polytopes. Finally, we discuss a version of the Hodge index theorem for polytopes.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-08-18T16:48:46+00:00", "updated": "2026-08-18T16:48:46+00:00", "abs_url": "http://arxiv.org/abs/2608.18003v1", "pdf_url": "https://arxiv.org/pdf/2608.18003v1", "journal_ref": "", "doi": "", "comment": "Comments are welcome!", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록 다면체의 조합적 교차 코호몰로지와 Hodge 지표 정리를 다루며, McMullen 문제나 oriented matroid의 acyclic reorientation과 직접적인 관련이 없다.", "summary": "이 논문은 BBFK의 조합적 교차 코호몰로지 프레임워크를 활용하여 Maxim-Schuermann의 사영 토릭 다양체(projective toric variety) 교차 코호몰로지 시그니처 공식을 유리수 꼭짓점 조건 없이 임의의 볼록 다면체로 확장한다. 또한 다면체에 대한 Hodge 지표 정리(Hodge index theorem)의 버전을 논의한다.", "technique": "BBFK의 볼록 다면체용 조합적 교차 코호몰로지(combinatorial intersection cohomology) 프레임워크를 비유리적(non-rational) 다면체로 확장 적용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.17350v1", "title": "A 15/31 Counterexample Family to the Albertson-Berman Conjecture", "authors": ["Heejae Jung"], "abstract": "For a graph $G$, let $a(G)$ be the maximum number of vertices in an induced forest. The Albertson-Berman conjecture, posed in 1979, asserts that every $n$-vertex planar graph satisfies $a(G)\\ge n/2$. Borodin's bound $a(G)\\ge 2n/5$ remains the general lower bound toward this problem. We disprove the conjecture with an explicit 31-vertex plane triangulation $T$ satisfying $a(T)=15$. Moreover, for every integer $k\\ge2$, we construct a simple planar graph $M_k$ with $|V(M_k)|=31k$ and $a(M_k)=15k$, so that $a(M_k)/|V(M_k)|=15/31<1/2$. Every member of the family has minimum degree five. The construction starts from a $31$-vertex seed obtained by substituting a $14$-vertex two-terminal gadget into a pentagonal bipyramid, and then uses annular joins along facial triangles to preserve the exact ratio. The resulting graphs are sphere triangulations, and hence maximal planar.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T04:15:59+00:00", "updated": "2026-08-18T04:15:59+00:00", "abs_url": "http://arxiv.org/abs/2608.17350v1", "pdf_url": "https://arxiv.org/pdf/2608.17350v1", "journal_ref": "", "doi": "", "comment": "12 pages, 5 figures; ancillary Python verifier included", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 평면 그래프에서 유도 숲(induced forest)에 관한 Albertson-Berman 추측을 반증하는 것으로, McMullen 문제(점 배치, oriented matroid, 열대 기하학 등)와 직접적인 관련이 없다.", "summary": "이 논문은 1979년에 제기된 Albertson-Berman 추측—$n$-꼭짓점 평면 그래프 $G$에 대해 $a(G) \\ge n/2$—을 반증한다. 구체적으로, $a(T)=15$인 31-꼭짓점 평면 삼각분할 $T$를 명시적으로 제시하며, 모든 정수 $k \\ge 2$에 대해 $|V(M_k)|=31k$이고 $a(M_k)=15k$인 단순 평면 그래프 족 $M_k$를 구성하여 비율 $a(M_k)/|V(M_k)|=15/31 < 1/2$임을 보인다. 이 그래프들은 최소 차수 5인 구면 삼각분할(maximal planar graph)이다.", "technique": "14-꼭짓점 two-terminal 가젯을 오각 쌍뿔(pentagonal bipyramid)에 치환하여 31-꼭짓점 씨앗을 만들고, 면 삼각형을 따라 환형 결합(annular join)을 반복하여 비율 $15/31$을 정확히 유지하는 무한 가족을 구성한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.17127v1", "title": "A Log-Free Lower Bound for the Number of Facets of $0/1$-Polytopes", "authors": ["Omer Friedland"], "abstract": "Let $g(n)$ denote the largest number of facets of a full-dimensional $0/1$-polytope in $\\R^n$. We prove that there are absolute constants $c>0$ and $n_0$ such that $$   g(n)\\ge (cn)^{n/2}\\quad(n\\ge n_0). $$ This removes the logarithmic factor from the lower bound $\\bigl(cn/\\log n\\bigr)^{n/2}$ of Gatzouras, Giannopoulos, and Markoulakis. The proof compares a random sign polytope with two Rademacher rate bodies separated by a fixed level gap. Facets missing the inner body have uniformly small footprints on a flat patch of the outer body. A facet entering the inner body forces an empty buffered discrete cap. For shallow penetration, a likelihood-slab localization reduces the relevant range entropy and permits a conditional $\\varepsilon$-net argument; for deep penetration, a global discretization suffices.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-17T21:03:16+00:00", "updated": "2026-08-17T21:03:16+00:00", "abs_url": "http://arxiv.org/abs/2608.17127v1", "pdf_url": "https://arxiv.org/pdf/2608.17127v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 0/1-폴리토프의 면(facet) 수에 관한 결과로, McMullen 문제(볼록 위치 점 배치, oriented matroid의 reorientation)와 직접적 연관이 없다.", "summary": "$\\mathbb{R}^n$에서 완전 차원 $0/1$-폴리토프의 최대 facet 수 $g(n)$에 대해 $g(n) \\ge (cn)^{n/2}$임을 증명하였다. 이는 Gatzouras–Giannopoulos–Markoulakis의 하한 $(cn/\\log n)^{n/2}$에서 로그 인수를 제거한 것이다. 증명은 랜덤 부호 폴리토프를 두 Rademacher rate body와 비교하는 확률론적 방법에 기반한다.", "technique": "랜덤 부호 폴리토프를 고정된 레벨 갭으로 분리된 두 Rademacher rate body와 비교하고, 얕은 침투에는 likelihood-slab 국소화 및 조건부 $\\varepsilon$-net 논증, 깊은 침투에는 전역 이산화를 적용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.17580v1", "title": "Crown-free families and forbidden subposets with $e(P)\\in \\{1,2\\}$", "authors": ["Balázs Patkós", "Casey Tompkins"], "abstract": "The maximum size of a weak $P$-free family $\\mathcal{F}\\subseteq 2^{[n]}$ is denoted by $La(n,P)$. Let $e(P)$ denote the maximum integer $k$ such that the union of any $k$ consecutive layers of $2^{[n]}$ is weak $P$-free. In recent years, multiple examples of posets with $e(P)<π^-(P):=\\liminf_{n\\to\\infty} \\frac{La(n,P)}{\\binom{n}{\\lfloor \\frac{n}{2}\\rfloor}}$ have been found. We add several further posets with $e(P)=1$ to this list. We define a family $\\mathcal{F}\\subseteq 2^{[n]}$ of size at least $(1.22+o(1))\\binom{n}{\\lfloor \\frac{n}{2}\\rfloor}$ that is weak $O_6$-free, where $O_6$ is the six-element crown poset. We also show an infinite set of posets $P$ with $1=e(P)<π^-(P)$ that are minimal with respect to this property.   Finally, we consider how far apart $e(P)$ and $π^-(P)$ can be. We prove that for every fixed finite poset $P$ with $e(P)=1$, there is a constant $δ_P>0$ such that $La(n,P)\\le(2-δ_P+o(1))\\binom{n}{\\lfloor n/2\\rfloor}$. The value 2 is optimal: explicit vertex-edge incidence posets with $e(P)=1$ have $π^-(P)$ values tending to $2$. In contrast, for every $K>0$ we construct a finite poset $P$ with $e(P)=2$ and lower density greater than $K$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-18T09:44:07+00:00", "updated": "2026-08-18T09:44:07+00:00", "abs_url": "http://arxiv.org/abs/2608.17580v1", "pdf_url": "https://arxiv.org/pdf/2608.17580v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 1, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "Weak P-free families와 poset 금지 구조를 다루지만, McMullen's problem의 convex posit

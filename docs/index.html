 balanced Turán graphs. Moreover, for $p=2$ and $p=n/2$, these polytopes recover the perfect matching and fractional perfect matching polytopes.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-08-19T04:33:08+00:00", "updated": "2026-08-19T04:33:08+00:00", "abs_url": "http://arxiv.org/abs/2608.18533v1", "pdf_url": "https://arxiv.org/pdf/2608.18533v1", "journal_ref": "", "doi": "", "comment": "52 pages, 10 figures. Comments welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 $\\overline{M}_{0,n}$ 위의 제수(divisor)의 유효 경계 표현 볼록다면체를 연구하며, McMullen 문제나 oriented matroid, Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 $\\overline{M}_{0,n}$ 위의 제수에 대해 유효 경계 표현의 볼록다면체(polytope of effective boundary expressions)를 도입하고, forgetful map 하에서의 구조적 성질과 그래프-이론적 동치 기술을 확립한다. psi-class 및 그 당김(pullback)에 대해 해당 볼록다면체가 단모듈러 단체(unimodular simplex)임을 보이고, 로그-정준 류(log-canonical class)의 변형에 대해서는 spanning forest polytope 및 대칭 외판원 문제의 subtour elimination polytope(Held–Karp relaxation)와의 동치를 증명한다. 또한 대칭 레벨-1 $\\mathfrak{sl}_p$ 등각 블록(conformal block) 제수에 대해 정의 부등식이 국소 Turán 한계임을 보이고, $p=2$ 및 $p=n/2$의 경우 완전 매칭 볼록다면체와의 관계를 밝힌다.", "technique": "forgetful map에 의한 구조 분석, 그래프-이론적 동치 기술, Minkowski 분해를 이용한 subtour elimination polytope의 단체 분해.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.18408v1", "title": "Half-open integer parallelepipeds and polytope Dedekind sums", "authors": ["Sinai Robins", "André Rosenbaum Coelho"], "abstract": "We study the Ehrhart theory of half-open $d$-dimensional integer parallelepipeds $Π$. Although the lattice-point count $tΠ\\cap \\Z^d$ is known to be simply $\\vol Πt^d$ for positive integer $t$, the corresponding counting function for arbitrary real dilations $t$ has subtle, nontrivial periodic structure. We give explicit formulas for this real Ehrhart quasi-polynomial, and more generally for all the discrete moments of the real dilates of $Π$: $\\sum_{p\\in tΠ\\cap\\mathbb Z^d}\\langle p,z\\rangle^m$. The formulas are expressed in terms of Barnes polynomials and polytope Dedekind sums, which encode the periodic lattice flow of translated integer lattices on the flat torus determined by $Π$. Our approach develops further the study of polytope Dedekind sums, introduced recently in \\cite{Robins2026}. In particular, we obtain novel identities for polytope Dedekind sums by using iterated discrete derivatives. Moreover, we show that the Ehrhart quasi-coefficients of $L_Π(t)$ are precisely alternating sums of polytope Dedekind sums. Finally, we give an Ehrhart-type reciprocity law relating $L_Π(t)$ at negative arguments to the lattice-point count of the `opposite' half-open parallelepiped.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T00:34:39+00:00", "updated": "2026-08-19T00:34:39+00:00", "abs_url": "http://arxiv.org/abs/2608.18408v1", "pdf_url": "https://arxiv.org/pdf/2608.18408v1", "journal_ref": "", "doi": "", "comment": "25 pages, 1 figure", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 반열린 정수 평행육면체의 Ehrhart 이론과 Dedekind 합에 관한 것으로, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "반열린 $d$차원 정수 평행육면체 $\\Pi$의 Ehrhart 이론을 연구하며, 실수 팽창 $t$에 대한 격자점 계수 함수의 주기적 구조를 분석한다. Barnes 다항식과 polytope Dedekind 합을 이용해 실수 Ehrhart 준다항식 및 이산 모멘트 $\\sum_{p\\in t\\Pi\\cap\\mathbb{Z}^d}\\langle p,z\\rangle^m$에 대한 명시적 공식을 유도한다. 또한 Ehrhart 준계수가 polytope Dedekind 합의 교대합으로 표현됨을 보이고, 음의 인수에서의 Ehrhart형 상반 법칙을 수립한다.", "technique": "반복 이산 미분(iterated discrete derivatives)을 이용한 polytope Dedekind 합의 새로운 항등식 도출 및 Barnes 다항식을 통한 명시적 공식 표현.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.18302v1", "title": "Schur polynomials twisted by roots of unity and reciprocal pairs: torsion filters, fusion quotients, and an equal-rank reduction at odd order", "authors": ["Carles Marín"], "abstract": "Write $μ_t$ for all $t$-th roots of unity and $z^{\\pm1}$ for $r$ free reciprocal pairs. We study $Φ_{t,r}(β)=s_λ(μ_t,z^{\\pm1})$, $β=λ+δ$, and the question the companion paper left open after $r=1$: when does it vanish? We factor the evaluation into classical branching followed by a torsion filter, and the shape depends on the parity of $t$: the point lies in the orthogonal group with determinant $(-1)^{t+1}$. For odd $t$ it sits in the identity component: an ordinary restriction $SO_{2R'+1}\\downarrow SO_{2m'+1}\\times SO_{2r}$, the filter an odd orthogonal character at a principal element of order $h+1$. For even $t$ in the other: a twining, a virtual expansion, and a torsion element regular but not principal; there we prove the filter, with its sign. One description covers both: the filter is nonzero exactly when the shifted torsion point is regular semisimple in the group. Both are minimal-level fusion projections: the even of type $C$, the tensor sector of the odd of type $B$. Affine folding accounts for the values $0,\\pm1$; what it does not survives as conjectures. The highest surviving weight is the dominant vertex of the numerator's Newton polytope minus the denominator's, the latter proved here, the former conditional on a single-orbit property; and the class there --- virtual for even $t$, a genuine multiplicity space for odd --- is conjecturally primitive, $\\pm$ the generator of the rank-one quotient. For odd $t$ and one $Λ$ that numerator is a signed transversal count in $\\{0,\\pm1\\}$ by the equal-rank character formula, leaving one division. We invert it in closed form, as a sum along an arithmetic progression of step $2t$; the quotient is $\\pmε_t\\det M$ for an explicit $0/{\\pm}1$ matrix, so total unimodularity of $M$ would settle it. Two extremal statements remain. Everything unproved here is measured, in both parities.", "categories": ["math.CO", "math.RT"], "primary_category": "math.CO", "published": "2026-08-18T20:27:46+00:00", "updated": "2026-08-18T20:27:46+00:00", "abs_url": "http://arxiv.org/abs/2608.18302v1", "pdf_url": "https://arxiv.org/pdf/2608.18302v1", "journal_ref": "", "doi": "", "comment": "72 pages, 13 figures; ancillary scripts and their archived output included", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Schur 다항식의 roots of unity 평가, fusion quotients, 직교군 분기 등 표현론·대수적 조합론을 다루며 McMullen 문제(볼록 위치 점 배치, oriented matroid)와 직접적 관련이 없다.", "summary": "이 논문은 $t$차 단위근과 역수 쌍으로 평가된 Schur 다항식 $\\Phi_{t,r}(\\beta)=s_\\lambda(\\mu_t, z^{\\pm1})$의 소멸 조건을 연구한다. $t$의 홀짝성에 따라 직교군 성분에서의 분기(branching)와 torsion filter로 평가를 분해하며, 두 경우 모두 최소 레벨 fusion projection(홀수는 $B$형, 짝수는 $C$형)으로 설명된다. Newton polytope의 우세 꼭짓점과 관련된 최고 살아남는 가중치 및 전체 단모듈성(total unimodularity) 관련 추측들도 제시된다.", "technique": "고전적 분기(classical branching)와 torsion filter의 인수분해, affine folding, equal-rank 지표 공식을 이용한 닫힌 형태 역산(arithmetic progression 합산).", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.17990v1", "title": "Cluster-Graph Edit Distance: Metric Proxies, Multiscale Embeddings, and Complexity", "authors": ["JiYe Liu", "Wenkai Wang", "Qiang Tian", "Wenjun Wang"], "abstract": "The cluster graphs on $n$ vertices, the disjoint unions of complete graphs, have the integer partitions of $n$ as their isomorphism classes, and the quotient edit distance $q^*(λ,μ)=\\min_{σ\\in S_n}|E(G_λ)\\triangleσE(G_μ)|$ makes that set a metric space. Its metric geometry and its computational complexity both issue from one identity: $q^*$ is an affine function of the maximum of $\\lVert X\\rVert_F^2$ over the contingency tables with margins $λ$ and $μ$. Combinatorially, it yields two explicit $\\ell_1$ models: the vertex-mass metric $δ_1$ on sorted degree sequences, with $\\frac12δ_1\\le q^*<\\frac32δ_1$ and both constants optimal, and the block-energy metric $B$ on the vectors $\\bigl(\\binom{λ_i}2\\bigr)_i$, with $q^*\\le B\\le2q^*-1$ by a per-table refinement measuring how far an alignment is from a block bijection. Hence $c_1(\\mathcal K_n)\\le2$, and an $O(n\\log n)$-time algorithm returns an alignment of cost below $2q^*$ with the certificate $q^*\\in[\\lceil(B+1)/2\\rceil,B]$. The Euclidean distortion of the class is $c_2(\\mathcal K_n)=Θ(n^{1/4})$; against it we measure the weighted dyadic sums $F^{(γ)}$ of the Ferrers staircase, of dimension below $4n$ and computable in $O(n)$ time. The unweighted member has distortion exactly $Θ(n^{1/4}\\sqrt{\\log n})$, while the critical weight $γ=\\frac14$ improves this unconditionally to $O(n^{1/4}(\\log n)^{1/4})$ through an inverse energy inequality proved from the quantization of staircase jumps; removing the residual $(\\log n)^{1/4}$ is reduced to one inverse inequality on the realizable cone. Computationally, the same identity gives a classification: deciding $q^*(λ,μ)\\le Q$ is strongly NP-complete, evaluation is strongly NP-hard and admits no FPTAS unless $\\mathrm P=\\mathrm{NP}$, while the farthest alignment is polynomial-time solvable.", "categories": ["cs.DS", "cs.CC", "math.CO", "math.MG"], "primary_category": "cs.DS", "published": "2026-08-18T16:38:10+00:00", "updated": "2026-08-18T16:38:10+00:00", "abs_url": "http://arxiv.org/abs/2608.17990v1", "pdf_url": "https://arxiv.org/pdf/2608.17990v1", "journal_ref": "", "doi": "", "comment": "43 pages, 4 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 클러스터 그래프의 편집 거리(metric geometry)와 계산 복잡도를 다루며, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid)와 직접적인 관련이 없다.", "summary": "이 논문은 $n$개 꼭짓점의 클러스터 그래프 동형류 집합 위에 정의된 몫 편집 거리 $q^*(\\lambda,\\mu)$의 계량 기하학과 계산 복잡도를 연구한다. $q^*$가 분할표(contingency table) 상의 $\\|X\\|_F^2$ 최대값의 아핀 함수임을 이용해 $\\ell_1$ 근사 모델 두 가지를 도출하고, 유클리드 왜곡이 $c_2(\\mathcal{K}_n)=\\Theta(n^{1/4})$임을 보인다. 계산 복잡도 측면에서 $q^*(\\lambda,\\mu)\\le Q$ 판정은 강 NP-완전, 평가는 강 NP-하드이며 $\\mathrm{P}\\neq\\mathrm{NP}$ 하에 FPTAS가 존재하지 않음을 증명한다.", "technique": "분할표의 Frobenius 노름 최대화와 Ferrers 계단함수의 가중 이진 합(weighted dyadic sums)을 결합한 다중 스케일 임베딩 및 역에너지 부등식.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2608.19989v1", "title": "On facet gaps of order and chain polytopes", "authors": ["Ghislain Fourier"], "abstract": "We discuss three questions from a recent paper of Bhandari, Cunningham, Morrell, Oh and Smith. We obtain an exact local formula for the facet gap between the order and the chain polytope of a finite poset. This gives a classification of the case $\\gap(P)=2$ in terms of star elements. For marked chain--order polytopes, the same local weights determine the facet differences between all admissible decompositions.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-20T13:04:19+00:00", "updated": "2026-08-20T13:04:19+00:00", "abs_url": "http://arxiv.org/abs/2608.19989v1", "pdf_url": "https://arxiv.org/pdf/2608.19989v1", "journal_ref": "", "doi": "", "comment": "6 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유한 포셋(poset)의 order polytope와 chain polytope 사이의 facet gap에 관한 것으로, McMullen's problem이나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 유한 포셋의 order polytope와 chain polytope 사이의 facet gap에 대한 정확한 국소 공식(local formula)을 도출한다. 이를 통해 $\\gap(P)=2$인 경우를 star element로 분류하며, marked chain-order polytope의 경우 모든 admissible decomposition 사이의 facet 차이도 같은 국소 가중치로 결정됨을 보인다.", "technique": "포셋의 국소 구조(star element)를 이용한 facet gap의 정확한 국소 공식 계산.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.19609v1", "title": "The integer point enumerator of one irrational translate of P is a complete invariant", "authors": ["Sinai Robins"], "abstract": "For a full-dimensional rational polytope $P\\subset\\mathbb{R}^d$ and a real dilation parameter $t>0$, the integer point enumerator is defined by $L_{P}(t):= |tP\\cap\\mathbb{Z}^d|$. We determine exactly which translation vectors $\\mathbf y=(y_1,\\ldots,y_d)\\in\\mathbb{R}^d$ have the property that the single translated counting function $t\\longmapsto L_{P+\\mathbf y}(t)$, with $t\\in\\mathbb{Q}_{>0}$, uniquely determines $P$ among all full-dimensional rational polytopes in $\\mathbb{R}^d$. The necessary and sufficient condition is that $1,y_1,\\ldots,y_d$ be linearly independent over $\\mathbb{Q}$. In particular, we may use the explicit algebraic vector $\\mathbf y^* := (2^{1/(d+1)},2^{2/(d+1)},\\ldots,2^{d/(d+1)})$ in every dimension $d$. The sufficiency proof recovers the primitive facet inequalities from isolated discontinuities of the counting function, while necessity follows from an affine-unimodular obstruction.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-20T03:48:43+00:00", "updated": "2026-08-20T03:48:43+00:00", "abs_url": "http://arxiv.org/abs/2608.19609v1", "pdf_url": "https://arxiv.org/pdf/2608.19609v1", "journal_ref": "", "doi": "", "comment": "12 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유리 볼록 다면체의 정수점 열거 함수(Ehrhart theory)에 관한 것으로, McMullen 문제(d=5에서의 볼록 위치 점 배치, oriented matroid의 실현 가능성)와 직접적 관련이 없다.", "summary": "유리 볼록 다면체 $P\\subset\\mathbb{R}^d$에 대해 번역 벡터 $\\mathbf{y}=(y_1,\\ldots,y_d)$가 $1, y_1, \\ldots, y_d$를 $\\mathbb{Q}$ 위에서 선형 독립이면, 단 하나의 번역된 정수점 열거 함수 $t\\mapsto L_{P+\\mathbf{y}}(t)$($t\\in\\mathbb{Q}_{>0}$)가 $P$를 모든 full-dimensional 유리 다면체 중에서 유일하게 결정함을 보인다. 이 조건이 필요충분임을 증명하며, 구체적으로 $\\mathbf{y}^* := (2^{1/(d+1)}, 2^{2/(d+1)}, \\ldots, 2^{d/(d+1)})$를 모든 차원에서 사용할 수 있다.", "technique": "충분성 증명은 계수 함수의 고립 불연속점에서 원시 면 부등식(primitive facet inequalities)을 복원하고, 필요성은 아핀-유니모듈 장애(affine-unimodular obstruction)를 이용한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.18663v1", "title": "A local clique density theorem in $H$-free graphs", "authors": ["Jiaao Li", "Xinyuan Li", "Yan Wang", "Zhouningxin Wang"], "abstract": "In 2016, Reiher's clique density theorem determined the minimum number of copies of $K_t$ in a graph with a prescribed edge density. In this paper, we investigate its local version and prove a local clique density theorem in $H$-free graphs as follows. For integers $r$ and $t$ with $2\\leq t\\leq r-1$, any $r$-chromatic graph $H$, any real numbers $γ$ and $α$ with $\\frac{t-2}{2(t-1)}\\leqγ\\leq \\frac{r-2}{2(r-1)}$ and $0\\leqα\\leq 1$, we determine the maximum value $β:=β(r,t,α,γ)$ such that for every $n$-vertex $H$-free graph $G$ with at least $γn^2$ edges, every $\\lceilαn\\rceil$-vertex subset in $G$ contains at least $(β-o(1))n^{t}$ copies of $K_t$. In particular, when $H=K_r$, every $\\lceilαn\\rceil$-vertex subset contains at least $\\lfloorβn^t\\rfloor$ copies of $K_t$, which is an exact bound. For suitable choices of $α$ and $γ$, namely, those for which all part ratios in the corresponding extremal construction are rational, this bound is attained for infinitely many values of $n$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-19T08:11:46+00:00", "updated": "2026-08-19T08:11:46+00:00", "abs_url": "http://arxiv.org/abs/2608.18663v1", "pdf_url": "https://arxiv.org/pdf/2608.18663v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "논문은 극값 그래프 이론(클리크 밀도)을 다루며, McMullen's problem은 고차원 볼록기하학과 지향된 matroid의 문제로 전혀 다른 분야입니다.", "summary": "Reiher의 클리크 밀도 정리를 지역적으로 일반화하여, H-free 그래프에서 주어진 간선 밀도를 갖는 그래프의 임의 부분집합이 포함하는 K_t 복사본의 최소 개수를 결정합니다. H=K_r인 경우 정확한 경계를 얻으며, 특정 조건에서는 무한히 많은 n에 대해 경계가 달성됩니다.", "technique": "극값 그래프 이론과 부분집합의 클리크 밀도 분석, Turán 유형 구조 활용", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.20959v1", "title": "Graded-fusion 2-categories and quantum homotopy invariants of 4-manifolds", "authors": ["Matthew Cellot"], "abstract": "We introduce 3-group-graded extensions of fusion 2-categories, where 3-groups are modeled by 2-crossed modules. From this data, we derive a state-sum invariant of 4-manifolds equipped with a homotopy class of maps to a homotopy 3-type, or equivalently of flat 3-bundles over 4-manifolds. This invariant is nontrivial and generalizes the Douglas-Reutter invariant of 4-manifolds. To construct our invariant, we encode homotopy classes of maps to the classifying space of a 3-group $σ$ via $σ$-colorings of triangulations, and we generalize Pachner's theorem in this context.", "categories": ["math.GT", "math.AT", "math.QA"], "primary_category": "math.GT", "published": "2026-08-21T10:26:32+00:00", "updated": "2026-08-21T10:26:32+00:00", "abs_url": "http://arxiv.org/abs/2608.20959v1", "pdf_url": "https://arxiv.org/pdf/2608.20959v1", "journal_ref": "", "doi": "", "comment": "46 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 4-다양체의 양자 호모토피 불변량 및 융합 2-카테고리에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 2-crossed module로 모델링된 3-군에 의해 등급화된 fusion 2-category의 확장을 도입하고, 이로부터 4-다양체 위의 flat 3-bundle(또는 호모토피 3-타입으로의 사상의 호모토피 류)에 대한 state-sum 불변량을 구성한다. 이 불변량은 자명하지 않으며 Douglas-Reutter 불변량을 일반화하고, 3-군의 분류공간으로의 사상의 호모토피 류를 삼각분할의 $\\sigma$-채색으로 인코딩하며 이 맥락에서 Pachner 정리를 일반화한다.", "technique": "2-crossed module로 3-군을 모델링하고 삼각분할의 $\\sigma$-채색을 이용해 호모토피 류를 인코딩하며 일반화된 Pachner 정리를 통해 state-sum 불변량의 위상 불변성을 확립한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.20778v1", "title": "Resistance Curvature: Recognition, Polyhedral Structure, and Graph Products", "authors": ["Meng Guo", "Wensheng Sun", "Yujun Yang"], "abstract": "Resistance curvature, introduced by Devriendt and Lambiotte, is a novel discrete curvature notion defined through effective resistance. A graph is called resistance nonnegative if there exists a choice of positive edge weights for which the resistance curvature is nonnegative at every vertex. This property has a notable combinatorial interpretation in terms of random spanning trees: a graph is resistance nonnegative if and only if it admits a distribution on its spanning trees under which every vertex has expected degree at most two. The resistance nonnegativity can also be characterized by the tree double matching polytope. These characterizations reveal strong connections among resistance curvature, effective resistance, spanning tree distributions, matching theory, and polyhedral combinatorics. Based on the sign of the curvature, Devriendt introduced the classes of resistance nonnegative (RN), resistance positive (RP), and strictly resistance nonnegative (SRN) graphs, and posed several questions concerning their recognition, polyhedral structure, and structural properties.   In this paper, we first answer Devriendt's question on the computational complexity of recognizing RN, RP, and SRN graphs by proving that all three classes can be recognized in polynomial time. We then address his question concerning the tree double matching polytope $Θ(G)$. Further, we characterize the vertices of $Θ(G)$ in terms of full-rank systems of tight constraints. Whenever $Θ(G)\\neq\\emptyset$, we also determine the least positive integer $k_G$ such that $k_GΘ(G)$ is a lattice polytope. Finally, for every finite Cartesian product of paths, we explicitly construct an average point satisfying the condition for resistance nonnegativity, thereby obtaining that such graphs are RN. We further characterize the classes of such Cartesian product graphs that are RP or SRN.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-21T06:43:03+00:00", "updated": "2026-08-21T06:43:03+00:00", "abs_url": "http://arxiv.org/abs/2608.20778v1", "pdf_url": "https://arxiv.org/pdf/2608.20778v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 effective resistance 기반 discrete curvature와 spanning tree polytope에 관한 것으로, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "본 논문은 Devriendt–Lambiotte가 도입한 resistance curvature 개념을 연구하며, RN·RP·SRN 그래프의 다항 시간 인식 알고리즘을 증명한다. Tree double matching polytope $\\Theta(G)$의 꼭짓점 특성화 및 $k_G\\Theta(G)$가 격자 다면체가 되는 최소 양의 정수 $k_G$를 결정한다. 또한 경로들의 유한 데카르트 곱 그래프에 대해 resistance nonnegativity를 명시적으로 구성하고 RP·SRN 분류를 완성한다.", "technique": "Tree double matching polytope의 tight constraint 전계수 시스템 분석 및 선형 프로그래밍 기반 다항 시간 인식 알고리즘.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.20854v1", "title": "Heat Codimension and Scalar Curvature", "authors": ["Bang-Xian Han"], "abstract": "Motivated by recent proofs of Gromov's codimension-two volume-growth conjecture, we propose a synthetic theory for scalar lower bound on metric measure Dirichlet spaces.", "categories": ["math.MG", "math.DG", "math.PR"], "primary_category": "math.MG", "published": "2026-08-21T08:20:27+00:00", "updated": "2026-08-21T08:20:27+00:00", "abs_url": "http://arxiv.org/abs/2608.20854v1", "pdf_url": "https://arxiv.org/pdf/2608.20854v1", "journal_ref": "", "doi": "", "comment": "We utilized ChatGPT 5.6 to summarize the smooth results from several recent preprints, whereas the non-smooth theory is formulated, organized, and verified by us", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이산기하학·조합론과 무관한 순수 기하학·확률론 분야의 연구로, McMullen's problem 및 convex position, oriented matroid 등과 직접 연관이 없음.", "summary": "이 논문은 Gromov의 부피 성장 추측의 증명에서 영감을 얻어, 메트릭 측도 Dirichlet 공간에서 스칼라 하한(scalar lower bound)에 대한 합성 이론(synthetic theory)을 제안한다.", "technique": "메트릭 측도 공간의 합성 기하학적 접근과 heat 방정식을 이용한 codimension 분석.", "connections": "", "keyword_hits": [], "source": "explore"}, {"id": "2608.23431v1", "title": "Makhlin polytopes are Demazure string polytopes", "authors": ["Ghislain Fourier"], "abstract": "We show that Makhlin's polytopes in type $B_n$ are unimodularly equivalent to string polytopes for Demazure modules in type $B_{2n-1}$. The proof passes through type $C$, combining Makhlin's diagonal comparison with symplectic FFLV polytopes and the $B/C$ similarity for string cones.", "categories": ["math.CO", "math.RT"], "primary_category": "math.CO", "published": "2026-08-24T16:06:19+00:00", "updated": "2026-08-24T16:06:19+00:00", "abs_url": "http://arxiv.org/abs/2608.23431v1", "pdf_url": "https://arxiv.org/pdf/2608.23431v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 타입 $B_n$ Makhlin 폴리토프와 타입 $B_{2n-1}$ Demazure 스트링 폴리토프의 단변환 동치를 다루는 대수적 조합론·표현론 논문으로, McMullen 문제나 볼록 위치 점 배치와 직접적인 관련이 없다.", "summary": "이 논문은 타입 $B_n$에서 Makhlin의 폴리토프가 타입 $B_{2n-1}$의 Demazure 모듈에 대한 스트링 폴리토프와 단변환 동치(unimodularly equivalent)임을 증명한다. 증명은 타입 $C$를 경유하여 Makhlin의 대각 비교(diagonal comparison), symplectic FFLV 폴리토프, 그리고 스트링 콘(string cone)의 $B/C$ 유사성을 결합한다.", "technique": "타입 $C$를 매개로 Makhlin의 대각 비교, symplectic FFLV 폴리토프, $B/C$ 스트링 콘 유사성을 조합하여 단변환 동치를 확립.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.23267v1", "title": "An Approach to Study the Structural Consistency of Triangle Badness Functions and Distance Metrics", "authors": ["Bowen Liu", "Yizhou Wang", "Lingqian Meng"], "abstract": "Triangle-based measures, commonly referred to as badness functions, are widely employed to quantify the extent to which a distance matrix deviates from an ideal geometric configuration. Different formulations of these functions may capture distinct facets of local non-uniformity, and their behavior is often influenced by the underlying distance metric chosen for evaluation. In practical settings, although a canonical badness function may be conceptually preferred, factors such as computational cost, algorithmic constraints, or data-specific characteristics frequently necessitate the adoption of modified versions-for instance, approximate forms or alternatives defined under different distance metrics. This gives rise to a central question: to what degree do these variants retain the structural consistency properties of their original counterparts? To address this issue, we develop a systematic correlation-based framework for evaluating structural consistency. As an illustrative instantiation of this framework, we compute badness sequences from a set of representative distance matrices alongside randomly generated triangle configurations, which are designed to cover variants that may arise under diverse practical scenarios. We then assess pairwise similarities among these sequences using four correlation coefficients. The experimental outcomes indicate that certain badness variants exhibit a notably high degree of structural consistency, whereas others reveal complementary behavioral patterns; moreover, the choice of distance metric exerts a considerable influence on the observed trends. These findings offer practical insights for the informed selection of distance metrics and triangle badness function variants in tasks including geometric reconstruction, triangulation, and structural analysis of pairwise distance data.", "categories": ["math.MG", "cs.CG", "stat.AP"], "primary_category": "math.MG", "published": "2026-08-24T13:55:59+00:00", "updated": "2026-08-24T13:55:59+00:00", "abs_url": "http://arxiv.org/abs/2608.23267v1", "pdf_url": "https://arxiv.org/pdf/2608.23267v1", "journal_ref": "", "doi": "", "comment": "18 pages, 11 tables. Main text in English; includes computational experiments on biological, astronomical, and materials datasets", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 삼각형 badness 함수와 거리 행렬의 구조적 일관성을 상관계수로 평가하는 것으로, McMullen 문제나 oriented matroid와 무관하다.", "summary": "이 논문은 거리 행렬이 이상적인 기하 배치에서 얼마나 벗어나는지를 측정하는 삼각형 기반 badness 함수들의 구조적 일관성을 평가하는 상관관계 기반 프레임워크를 제안한다. 다양한 거리 행렬과 랜덤 삼각형 배치에서 badness 수열을 계산하고 네 가지 상관계수로 쌍별 유사도를 측정한다. 실험 결과, 일부 badness 변형들은 높은 구조적 일관성을 보이는 반면 다른 것들은 보완적 패턴을 나타내며, 거리 메트릭 선택이 결과에 상당한 영향을 미침을 보인다.", "technique": "네 가지 상관계수를 이용한 badness 수열의 쌍별 유사도 측정 기반 구조적 일관성 평가 프레임워크", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.22814v1", "title": "Congruence classes of monodromies of even triangulations", "authors": ["Kenta Noguchi"], "abstract": "A triangulation is a graph on a surface where every face is triangular. It is well-known that a planar triangulation $G$ is $3$-chromatic if and only if $G$ is even, that is, all the vertices of $G$ have even degree. We focus on even triangulations of non-spherical surfaces. It is known that there is an invariant of even triangulations, called a monodromy. This concept was firstly introduced by Hutchinson et al. [J. Combin. Theory Ser. B 84 (2002) 225--239], and the congruence class of monodromies was defined by Kawarabayashi et al. [J. Combin. Theory Ser. B 99 (2009) 229--246]. For a lower genus surface $F^2$, the number of congruence classes of monodromies have already been shown, $1$ if $F^2$ is the sphere, $2$ if $F^2$ is the projective plane by Mohar [Discrete Math. 244 (2002) 339--343] and $3$ if $F^2$ is the torus by Higuchi et al. [Discrete Math. 311 (2011) 1128--1135]. In this paper, we count the number of congruence classes of monodromies of even triangulations of general closed surface $F^2$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-24T05:22:15+00:00", "updated": "2026-08-24T05:22:15+00:00", "abs_url": "http://arxiv.org/abs/2608.22814v1", "pdf_url": "https://arxiv.org/pdf/2608.22814v1", "journal_ref": "", "doi": "", "comment": "7 pages, 2 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 곡면 위의 삼각분할(triangulation)의 단조군(monodromy) 합동류(congruence class) 수를 세는 위상 그래프론 문제로, McMullen 문제나 oriented matroid와 직접적 관련이 없다.", "summary": "이 논문은 일반 폐곡면 $F^2$ 위의 짝수 삼각분할(even triangulation)의 단조군(monodromy) 합동류(congruence class)의 수를 완전히 결정한다. 기존에는 구면(1개), 사영평면(2개), 토러스(3개)에 대한 결과만 알려져 있었다. 저자는 이를 임의의 폐곡면으로 일반화하였다.", "technique": "", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.21625v1", "title": "Continuity of the tropical Prym-Torelli map", "authors": ["Giusi Capobianco"], "abstract": "We give a new intrinsic construction of the continuous tropical Prym variety, originally due to Röhrle and Zakahrov. In particular, given a harmonic double cover of graphs we explicitly construct the tropical Prym as integral torus. Moreover, we show that the tropical Prym--Torelli map from the moduli space of harmonic double covers to the moduli space of principally polarised tropical abelian varieties is continuous.", "categories": ["math.AG", "math.CO"], "primary_category": "math.AG", "published": "2026-08-21T20:48:41+00:00", "updated": "2026-08-21T20:48:41+00:00", "abs_url": "http://arxiv.org/abs/2608.21625v1", "pdf_url": "https://arxiv.org/pdf/2608.21625v1", "journal_ref": "", "doi": "", "comment": "27 pages, 7 figures. Comments are welcome!", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 열대 Prym-Torelli 사상의 연속성에 관한 대수기하·열대기하 연구로, McMullen 문제(볼록 위치, oriented matroid, 점 배치)와 직접적 관련이 없다.", "summary": "이 논문은 그래프의 조화 이중 피복(harmonic double cover)으로부터 열대 Prym 다양체를 적분 토러스(integral torus)로 명시적으로 구성하는 새로운 내재적 방법을 제시한다. 원래 Röhrle와 Zakharov에 의해 도입된 연속 열대 Prym 다양체의 새로운 구성을 제공하며, 조화 이중 피복의 모듈라이 공간에서 주극화 열대 아벨 다양체의 모듈라이 공간으로의 열대 Prym-Torelli 사상이 연속임을 증명한다.", "technique": "조화 이중 피복 그래프로부터 열대 Prym 다양체를 적분 토러스로 명시적으로 구성하는 내재적 방법 사용.", "connections": "", "keyword_hits": ["tropical"], "source": "filter"}, {"id": "2608.21507v1", "title": "A very ample lattice polytope with a non-unimodal $h^*$-vector", "authors": ["Johannes Hofscheier", "Vadym Kurylenko", "Benjamin Nill"], "abstract": "Lattice polytopes are called very ample if for every sufficiently large $k$ every lattice point of height $k$ in the cone over the lattice polytope is the sum of $k$ lattice points of height $1$. This is a weakening of the well-known integer decomposition property (also called IDP). We give an example of a very ample lattice polytope whose $h^*$-vector is non-unimodal. Here, the $h^*$-vector is the coefficient vector of the numerator of the Ehrhart series of the lattice polytope. This answers a question of Ferroni and Higashitani, as well as a related question by Balletti. The main question whether IDP lattice polytopes have unimodal $h^*$-vector is still open. The example was found using ChatGPT 5.6 Sol. It is just the Cartesian square of a lattice polytope belonging to a class of very ample examples constructed by Lasoń and Michalek.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-21T17:32:28+00:00", "updated": "2026-08-21T17:32:28+00:00", "abs_url": "http://arxiv.org/abs/2608.21507v1", "pdf_url": "https://arxiv.org/pdf/2608.21507v1", "journal_ref": "", "doi": "", "comment": "4 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 격자 다면체(lattice polytope)의 $h^*$-벡터 단봉성(unimodality)에 관한 것으로, McMullen 문제나 Larman 추측과 직접적인 관련이 없다.", "summary": "이 논문은 very ample 격자 다면체(very ample lattice polytope)가 비단봉(non-unimodal) $h^*$-벡터를 가질 수 있음을 예시로 보여, Ferroni–Higashitani 및 Balletti의 질문에 답한다. 해당 예시는 Lasoń–Michalek의 very ample 예시 클래스에 속하는 격자 다면체의 데카르트 제곱(Cartesian square)으로 구성되었으며, ChatGPT 5.6 Sol을 이용해 발견되었다. IDP 격자 다면체의 $h^*$-벡터 단봉성 여부는 여전히 미해결 문제로 남아 있다.", "technique": "Lasoń–Michalek의 very ample 예시 클래스에 속하는 다면체의 데카르트 제곱을 구성하여 비단봉 $h^*$-벡터를 가지는 very ample 격자 다면체의 구체적 예시를 제시.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.30285v1", "title": "Unfolding Overlaps of the Exceptional Regular Polytopes", "authors": ["Satyan L. Devadoss", "Matthew Harvey", "David Richter"], "abstract": "We find explicit ridge unfoldings of the three exceptional 4D polytopes (24-cell, 120-cell, 600-cell) that result in overlaps of their facets. These failures bring an end to the full classification of regular polytopes with the all-net property.", "categories": ["cs.CG", "math.CO"], "primary_category": "cs.CG", "published": "2026-08-31T05:52:48+00:00", "updated": "2026-08-31T05:52:48+00:00", "abs_url": "http://arxiv.org/abs/2608.30285v1", "pdf_url": "https://arxiv.org/pdf/2608.30285v1", "journal_ref": "", "doi": "", "comment": "11 pages, 4 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 4차원 정다면체의 ridge unfolding과 all-net 분류에 관한 것으로, McMullen의 문제(oriented matroid, 점 배치, f(5)=11)와 직접적인 관련이 없다.", "summary": "이 논문은 24-cell, 120-cell, 600-cell의 세 예외적 4차원 정다면체에 대해 facet이 겹치는 명시적 ridge unfolding을 발견한다. 이 결과들은 all-net 성질을 갖는 정다면체의 완전한 분류를 마무리 짓는다.", "technique": "4차원 정다면체의 ridge unfolding(능선 전개)을 명시적으로 구성하여 facet 중첩(overlap)을 확인하는 방법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.29260v1", "title": "Generalized Spectral Closedness and the Nonexistence of Walk-Realizable Supporters for Split Graphs", "authors": ["Yanyang Li"], "abstract": "Let $\\mathcal F=\\{2K_2,C_4,C_5\\}$, so that $\\operatorname{Forb}(\\mathcal F)$ is the class of split graphs. Resolving a conjecture of Wang and Tang, we prove that the class of split graphs is generalized spectrally closed and that it admits no walk-realizable $\\mathcal F$-supporter of any finite order.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-29T13:27:24+00:00", "updated": "2026-08-29T13:27:24+00:00", "abs_url": "http://arxiv.org/abs/2608.29260v1", "pdf_url": "https://arxiv.org/pdf/2608.29260v1", "journal_ref": "", "doi": "", "comment": "10 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 split graph의 스펙트럼 폐쇄성(spectral closedness)과 walk-realizable supporter에 관한 것으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "$\\mathcal{F}=\\{2K_2, C_4, C_5\\}$로 정의된 forbidden 그래프 집합에 대해, $\\operatorname{Forb}(\\mathcal{F})$인 split graph 클래스가 일반화된 스펙트럼 폐쇄(generalized spectrally closed) 성질을 가짐을 증명한다. 또한 split graph 클래스는 유한 차수의 walk-realizable $\\mathcal{F}$-supporter를 허용하지 않음을 보임으로써 Wang과 Tang의 추측을 해결한다.", "technique": "", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2608.28004v1", "title": "Hausdorff Dimension of the Set of Extreme Points of a Random Countable Stable Zonotope", "authors": ["Maksim Kukushkin"], "abstract": "Let $d\\geq 2$, $0<α<1$, and let $Γ_k$ be the successive arrival times of a standard Poisson process on $(0,\\infty)$. Given independent uniform directions $\\varepsilon_k\\in S^{d-1}$, independent of $(Γ_k)$, we consider the random countable stable zonotope $Z_α=\\bigoplus_{k=1}^{\\infty}Γ_k^{-1/α}[0,\\varepsilon_k]$. For its set of extreme points $\\operatorname{ext} Z_α$, we prove that almost surely $\\dim_H \\operatorname{ext} Z_α=(d-1)α$, and that the critical Hausdorff measure $\\mathcal H^{(d-1)α}(\\operatorname{ext} Z_α)$ is almost surely finite. The lower bound follows from the tangential non-degeneracy of the stable increments of the parametrizing field and Frostman's energy criterion. For the upper bound we construct an adaptive covering: at each scale the Poisson jumps are split into large and small ones, the large jumps determine a finite hyperplane arrangement, and the sum of the small jumps controls the diameters of the images of its cells.", "categories": ["math.PR", "math.MG"], "primary_category": "math.PR", "published": "2026-08-28T07:14:50+00:00", "updated": "2026-08-28T07:14:50+00:00", "abs_url": "http://arxiv.org/abs/2608.28004v1", "pdf_url": "https://arxiv.org/pdf/2608.28004v1", "journal_ref": "", "doi": "", "comment": "19 pages, 4 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 확률론적 안정 조노토프(stable zonotope)의 극점 집합의 Hausdorff 차원을 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid, 실현 가능성)와 직접적인 관련이 없다.", "summary": "이 논문은 $d\\geq 2$, $0<\\alpha<1$인 경우 랜덤 가산 안정 조노토프 $Z_\\alpha=\\bigoplus_{k=1}^{\\infty}\\Gamma_k^{-1/\\alpha}[0,\\varepsilon_k]$의 극점 집합 $\\operatorname{ext} Z_\\alpha$에 대해, 거의 확실히 $\\dim_H \\operatorname{ext} Z_\\alpha = (d-1)\\alpha$임을 증명한다. 또한 임계 Hausdorff 측도 $\\mathcal{H}^{(d-1)\\alpha}(\\operatorname{ext} Z_\\alpha)$가 거의 확실히 유한함을 보인다.", "technique": "하한은 안정 증분의 접선 비퇴화성(tangential non-degeneracy)과 Frostman 에너지 기준으로, 상한은 Poisson 점프를 대형·소형으로 분리한 적응적 피복(adaptive covering) 구성으로 증명한다.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.26015v1", "title": "Isometry invariant valuations on spherical polytopes", "authors": ["Jonas Knoerr"], "abstract": "We show that every continuous and isometry invariant valuation on spherical polytopes is a linear combination of the spherical intrinsic volumes. The proof relies on a weak differentiability property satisfied by valuations on polytopes in $\\mathbb{R}^n$ with a natural smoothness property with respect to the action of the affine group. This enables us to transfer several results established by Alesker for quasi-smooth valuations to the polytopal setting, and to reduce the problem to the translation invariant case of measurable valuations on polytopes.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-08-26T16:57:33+00:00", "updated": "2026-08-26T16:57:33+00:00", "abs_url": "http://arxiv.org/abs/2608.26015v1", "pdf_url": "https://arxiv.org/pdf/2608.26015v1", "journal_ref": "", "doi": "", "comment": "20 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 구면 다면체(spherical polytopes) 위의 등거리 불변 valuation 분류에 관한 것으로, McMullen 문제(d=5 일반 위치 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "이 논문은 구면 다면체 위의 연속적이고 등거리 불변인 valuation이 구면 고유 부피(spherical intrinsic volumes)의 선형 결합임을 증명한다. 증명은 $\\mathbb{R}^n$의 다면체 위 valuation이 아핀 군 작용에 관한 자연스러운 매끄러움 성질을 만족할 때 충족되는 약한 미분가능성(weak differentiability)에 기반한다. 이를 통해 Alesker가 준매끄러운(quasi-smooth) valuation에 대해 수립한 여러 결과를 다면체 설정으로 이전하고, 문제를 다면체 위 가측 valuation의 평행이동 불변 경우로 환원한다.", "technique": "아핀 군 작용에 대한 자연스러운 매끄러움 성질로부터 도출되는 약한 미분가능성(weak differentiability)을 활용하여, Alesker의 준매끄러운 valuation 이론을 다면체 설정으로 이전하는 기법.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.25233v1", "title": "Clique decompositions and covers for large graphs", "authors": ["Wentao Zhang"], "abstract": "In 1966, Erdős, Goodman, and Pósa showed that every $n$-vertex graph $G$ admits a cover of its edges using at most $\\lfloor \\frac{n^2}{4}\\rfloor$ cliques, with tightness witnessed by the balanced complete bipartite graph. Erdős suggested the following strengthening: every $n$-vertex graph $G$ admits an edge decomposition into cliques with total cost at most $\\lfloor \\frac{n^2}{4}\\rfloor$, where each $i$-clique has cost $i-1$. There is another generalization conjectured by Dau, Milenkovic and Puleo: for every $t\\ge4$, every $n$-vertex graph $G$ admits a cover of its $t$-cliques using at most $\\prod_{j=0}^{t-1}\\left\\lfloor\\frac{n+j}{t}\\right\\rfloor$ cliques. Balogh, He, Krueger, Nguyen and Wigal proved asymptotic and fractional versions of these conjectures. We solve both conjectures for large $n$ and identify the equality cases. Our proof of Erdős's conjecture combines linear programming duality and the spanning-forest polytope with a weighted stability form of Mantel's theorem, followed by explicit decomposition algorithms around an almost balanced bipartition. For the $t$-clique-cover conjecture, we combine graph removal lemma and generalized Turán stability with an exact covering construction for graphs close to $T_{n,t}$.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-25T23:43:32+00:00", "updated": "2026-08-25T23:43:32+00:00", "abs_url": "http://arxiv.org/abs/2608.25233v1", "pdf_url": "https://arxiv.org/pdf/2608.25233v1", "journal_ref": "", "doi": "", "comment": "35 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프의 클리크 분해·커버에 관한 Erdős 추측과 Dau-Milenkovic-Puleo 추측을 다루며, McMullen 문제(d=5에서의 점 배치, oriented matroid, 볼록 위치 등)와 직접적인 관련이 없다.", "summary": "이 논문은 두 가지 오래된 조합론적 추측을 대형 그래프($n$이 충분히 클 때)에 대해 해결한다: Erdős의 엣지 분해 추측(각 $i$-클리크의 비용을 $i-1$로 할 때 총 비용 $\\lfloor n^2/4 \\rfloor$ 이하)과 Dau-Milenkovic-Puleo의 $t$-클리크 커버 추측($\\prod_{j=0}^{t-1}\\lfloor(n+j)/t\\rfloor$ 개 이하의 클리크로 커버). 등호 조건(equality cases)도 완전히 규명되었다.", "technique": "선형 계획 쌍대성(LP duality)과 spanning-forest polytope, Mantel 정리의 가중 안정성 형태, 그래프 제거 보조정리(graph removal lemma), 일반화된 Turán 안정성을 결합하여 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2608.24497v1", "title": "Computing an e-net of a closed hyperbolic surface", "authors": ["Vincent Delecroix", "Vincent Despré", "Camille Lanuel", "Hugo Parlier", "Monique Teillaud"], "abstract": "Hyperbolic surfaces are a fundamental object in mathematics and play an increasingly important role in computational geometry and topology. A key ingredient in the design of efficient algorithms on such surfaces is the availability of a geometric discretization of controlled complexity. In this paper, we present the first algorithm for constructing e-nets on hyperbolic surfaces starting from a fundamental polygon representation. Our approach is based on Delaunay refinement and relies on maintaining Delaunay triangulations through edge flips.   The size of an e-net cannot be bounded solely as a function of the genus because of the presence of arbitrarily long collars around short geodesics. To overcome this difficulty, we introduce the notion of a pseudo e-net, which decomposes the surface into e-thin cylinders together with a Delaunay triangulation over an e-net of the remaining thick part.   As applications, we obtain algorithms for computing the length spectrum of an e-thick hyperbolic surface and for computing the systole from a pseudo log(sqrt(2))-net. These results demonstrate that Delaunay-based discretizations provide a practical and versatile framework for algorithmic computations on hyperbolic surfaces.", "categories": ["cs.CG", "math.GT"], "primary_category": "cs.CG", "published": "2026-08-25T12:46:15+00:00", "updated": "2026-08-25T12:46:15+00:00", "abs_url": "http://arxiv.org/abs/2608.24497v1", "pdf_url": "https://arxiv.org/pdf/2608.24497v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 쌍곡 곡면 위의 $\\varepsilon$-net 계산에 관한 것으로, McMullen 문제(oriented matroid, convex/general position 점 배치)와 직접적인 관련이 없다.", "summary": "이 논문은 기본 다각형(fundamental polygon) 표현에서 출발하여 쌍곡 곡면 위의 $\\varepsilon$-net을 구성하는 최초의 알고리즘을 제시한다. 짧은 측지선 주변의 임의로 긴 collar로 인해 $\\varepsilon$-net 크기를 genus만의 함수로 한정할 수 없으므로, 곡면을 $\\varepsilon$-thin 실린더와 두꺼운 부분의 Delaunay 삼각화로 분해하는 pseudo $\\varepsilon$-net 개념을 도입한다. 응용으로 $\\varepsilon$-thick 쌍곡 곡면의 length spectrum 계산 및 systole 계산 알고리즘을 도출한다.", "technique": "Delaunay 정제(Delaunay refinement)와 edge flip을 통한 Delaunay 삼각화 유지를 핵심 기법으로 사용한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2608.24137v1", "title": "Main-Factor Constraints on Generalized Cospectral Mates of Trees", "authors": ["Chaochao Zhu"], "abstract": "We study how irreducible factors associated with main eigenvalues constrain the connected components of generalized cospectral mates. Let $M_G(x):=\\prod_{λ {\\rm main}}(x-λ)$ be the main polynomial of $G$, where the product is over the distinct main eigenvalues, and write $φ_G(x)=\\prod_{i=1}^{r}f_i(x)^{m_i}$, where the $f_i$ are distinct monic irreducible polynomials over $\\mathbb Q$. With $I_{\\mathrm m}(G) :=\\{\\,i:f_i\\mid M_G\\,\\}$, define $κ_{\\mathrm m}(G):=\\sum_{i\\in I_{\\mathrm m}(G)}m_i$. For a graph $X$, write $c(X)$ and $β(X)$ for its number of connected components and cycle rank, respectively. We prove that every graph $H$ with the same characteristic polynomial and main polynomial as $G$ satisfies $c(H)\\leκ_{\\mathrm m}(G)$. Consequently, if $T$ is a tree and $H$ is generalized cospectral with $T$, then $β(H)=c(H)-1 \\le κ_{\\mathrm m}(T)-1$.   We develop the case $κ_{\\mathrm m}(T)=2$ further. A disconnected generalized cospectral mate must be the union of a tree and a connected bipartite unicyclic graph, and its two component coronals are uniquely prescribed by the canonical partial-fraction decomposition of the coronal of $T$ with respect to the two irreducible main factors. Consequently, these factor coronals must be realizable as coronals of actual graph components; their Laurent coefficients must therefore be nonnegative integers satisfying low-order walk identities. These realizability conditions, supplemented by matching restrictions on the unicyclic component, yield effective tree-forcing obstructions.   As an application, we show that the double star $D(2m,m+1)$ is determined by its generalized spectrum but not by its adjacency spectrum whenever $m\\ge2$ and neither $m$ nor $2m+2$ is a perfect square. In particular, the double stars $D(8t+4,4t+3), t\\ge0$, is an explicit infinite family of graphs that are DGS but not DS.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-08-25T07:02:32+00:00", "updated": "2026-08-25T07:02:32+00:00", "abs_url": "http://arxiv.org/abs/2608.24137v1", "pdf_url": "https://arxiv.org/pdf/2608.24137v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 그래프의 일반화 공스펙트럼(generalized cospectral) 동반자와 트리의 스펙트럼 결정 문제를 다루며, McMullen 문제(볼록 위치 점 배치, oriented matroid 등)와 전혀 관련이 없다.", "summary": "이 논문은 그래프 $G$의 주 다항식(main polynomial) $M_G(x)$와 특성 다항식의 기약 인수 분해로부터 정의된 $\\kappa_{\\mathrm{m}}(G)$를 이용해, 일반화 공스펙트럼 동반자 $H$의 연결 성분 수가 $c(H) \\le \\kappa_{\\mathrm{m}}(G)$를 만족함을 증명한다. 특히 $\\kappa_{\\mathrm{m}}(T)=2$인 트리의 경우, 비연결 일반화 공스펙트럼 동반자의 구조(트리와 연결 이분 단순사이클 그래프의 합집합)가 완전히 결정된다. 응용으로서, $m \\ge 2$이고 $m$과 $2m+2$가 완전제곱수가 아닐 때 이중별 그래프 $D(2m, m+1)$이 일반화 스펙트럼으로는 결정되지만 인접 스펙트럼으로는 결정되지 않는 무한 가족을 제시한다.", "technique": "주 다항식의 기약 인수 분해와 코로날(coronal)의 부분분수 분해를 결합하여 일반화 공스펙트럼 동반자의 연결 성분 수 상한 및 실현 가능성 조건을 도출한다.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2608.24028v1", "title": "Partitions of canonical bases", "authors": ["Jeff York Ye"], "abstract": "We show that various partitions of the canonical basis of quantum groups constructed by Lusztig and by Kashiwara coincide. Using this partition, we show that the subset corresponding to open Richardson varieties equals to the intersection of the subsets corresponding to the Schubert cells. We also show that in type $A$, the weights from open Richardson varieties are saturated in the corresponding Bruhat interval polytope.", "categories": ["math.RT", "math.CO"], "primary_category": "math.RT", "published": "2026-08-25T03:35:12+00:00", "updated": "2026-08-25T03:35:12+00:00", "abs_url": "http://arxiv.org/abs/2608.24028v1", "pdf_url": "https://arxiv.org/pdf/2608.24028v1", "journal_ref": "", "doi": "", "comment": "14 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 양자군의 정준 기저(canonical basis) 분할과 Richardson 다양체에 관한 것으로, McMullen 문제나 관련 조합론적 도구와 직접적인 연관이 없다.", "summary": "이 논문은 Lusztig와 Kashiwara가 구성한 양자군의 정준 기저에 대한 다양한 분할들이 일치함을 보인다. 이 분할을 이용하여, open Richardson 다양체에 대응하는 부분집합이 Schubert 셀에 대응하는 부분집합들의 교집합과 같음을 증명한다. 또한 타입 $A$에서 open Richardson 다양체로부터 나오는 weight들이 대응하는 Bruhat interval polytope 안에서 포화(saturated)됨을 보인다.", "technique": "양자군의 정준 기저 분할 이론과 Bruhat interval polytope의 포화성 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.10513v1", "title": "Unimodality shenanigans in Ehrhart theory", "authors": ["Luis Ferroni"], "abstract": "We show the existence of counterexamples to a four-decade-old conjecture attributed to Stanley concerning the unimodality of $h^*$-polynomials of IDP polytopes. As additional applications of our main constructions, we also disprove a conjecture by Brenti on the log-concavity of $h^*$-polynomials of Gorenstein IDP polytopes, and a conjecture by Ferroni and Higashitani concerning the log-concavity of the Ehrhart series of IDP polytopes. We also answer their question about the existence of very ample polytopes with non-log-concave interior Ehrhart series. Our class of examples arises by taking Cayley sums of rectangular prisms, and hence they possess regular unimodular flag triangulations by a result of Haase, Paffenholz, Piechnik and Santos. For the unimodality conjecture, we can even find smooth counterexamples.", "categories": ["math.CO", "math.AC"], "primary_category": "math.CO", "published": "2026-09-09T17:48:32+00:00", "updated": "2026-09-09T17:48:32+00:00", "abs_url": "http://arxiv.org/abs/2609.10513v1", "pdf_url": "https://arxiv.org/pdf/2609.10513v1", "journal_ref": "", "doi": "", "comment": "15 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Ehrhart 이론에서 $h^*$-다항식의 단봉성(unimodality) 및 로그-오목성(log-concavity) 추측들에 대한 반례를 구성하는 연구로, McMullen 문제나 oriented matroid와 직접적인 관련이 없다.", "summary": "이 논문은 Stanley의 40년 된 추측(IDP 폴리토프의 $h^*$-다항식 단봉성)에 대한 반례의 존재를 증명하고, Brenti의 Gorenstein IDP 폴리토프 $h^*$-다항식 로그-오목성 추측과 Ferroni–Higashitani의 IDP 폴리토프 Ehrhart 급수 로그-오목성 추측도 함께 반박한다. 반례들은 직육면체(rectangular prism)들의 Cayley 합으로 구성되며, Haase–Paffenholz–Piechnik–Santos의 결과에 의해 정칙 유니모듈러 플래그 삼각분할을 가진다. 단봉성 추측에 대해서는 매끄러운(smooth) 반례도 존재함을 보인다.", "technique": "직육면체의 Cayley 합을 이용하여 정칙 유니모듈러 플래그 삼각분할을 갖는 반례 폴리토프 족을 명시적으로 구성한다.", "connections": "", "keyword_hits": ["tope", "triangulation"], "source": "filter"}, {"id": "2609.17250v1", "title": "Weighted lattice point enumeration in lecture hall order polytopes", "authors": ["Katharina Jochemko", "Krishna Menon"], "abstract": "We consider weighted lattice point enumeration in lecture hall order polytopes. We observe that these half-open polytopes are closed under weight-lifting for a large class of polynomial weights, including monomials and weights given by binomial coefficients. For rooted trees, we prove that the corresponding (weighted) $h^\\ast$-polynomial is real-rooted thereby complementing previous results of Savage-Visontai and Brändén-Leander.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T14:31:31+00:00", "updated": "2026-09-15T14:31:31+00:00", "abs_url": "http://arxiv.org/abs/2609.17250v1", "pdf_url": "https://arxiv.org/pdf/2609.17250v1", "journal_ref": "", "doi": "", "comment": "9 pages, 2 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 lecture hall order polytope의 가중 격자점 열거(weighted lattice point enumeration)와 $h^*$-다항식의 실근성(real-rootedness)을 다루며, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 lecture hall order polytope에서의 가중 격자점 열거를 연구하며, 단항식 및 이항계수로 주어진 다항식 가중치를 포함하는 넓은 범주에 대해 이 반열린(half-open) 다면체가 weight-lifting에 닫혀 있음을 보인다. 뿌리 있는 트리(rooted tree)에 대해 대응하는 (가중) $h^*$-다항식이 실근(real-rooted)임을 증명하여 Savage-Visontai 및 Brändén-Leander의 기존 결과를 보완한다.", "technique": "반열린 다면체의 weight-lifting 성질과 $h^*$-다항식의 실근성 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.16776v1", "title": "Exact Labelled Layer-Order Classification for Period-2 Mountain--Valley Assignments on 2 x 2k Maps", "authors": ["Michael Fofonov"], "abstract": "We classify the labelled final layer orders of ordinary orthogonal 2 x 2k maps whose mountain-valley assignments are periodic with period two in each crease family. For k >= 2, local flat-foldability leaves 16 of the 64 formal period words. Eight pleat words have a unique labelled state. The remaining eight words reduce, under labelled symmetries, to two constant-row families described by row pivots. For the canonical word MMMMVV, an ordered pivot pair (a,b) is realizable exactly when a = 1, a = m, or a = b, where m = 2k - 1. For MVMMMM, realizability is equivalent to BR(a) = BR(b). In both families each compatible ordered pivot pair determines a unique labelled state. The resulting state counts are 0, 1, 6k - 5, and 4k - 3. The case k = 1 is treated separately because two formal period bits have no physical crease carriers.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-15T07:44:01+00:00", "updated": "2026-09-15T07:44:01+00:00", "abs_url": "http://arxiv.org/abs/2609.16776v1", "pdf_url": "https://arxiv.org/pdf/2609.16776v1", "journal_ref": "", "doi": "", "comment": "34 pages, 5 figures. Code, validation data, supplements, and interactive visualizations: https://github.com/spicmaff/per2-layer-orders/", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 종이접기(origami)의 2×2k 격자 지도에서 주기-2 산-골짜기 배정의 분류를 다루며, McMullen 문제·Larman 추측·oriented matroid 등과 직접적 관련이 없다.", "summary": "이 논문은 주기가 2인 산-골짜기 배정을 갖는 직교 2×2k 지도의 레이블된 최종 레이어 순서를 완전히 분류한다. 64개의 형식적 주기 단어 중 국소 평면 접힘 가능성 조건을 만족하는 16개를 추려, 8개의 주름(pleat) 단어는 유일한 레이블 상태를 가지며 나머지 8개는 행 피벗(row pivot)으로 기술되는 두 상수-행 패밀리로 환원됨을 보인다. MMMMVV 및 MVMMMM 두 표준 단어에 대해 순서쌍 피벗 $(a,b)$의 실현 가능 조건과 상태 수($0, 1, 6k-5, 4k-3$)를 정확히 결정한다.", "technique": "국소 평면 접힘 가능성 조건을 이용한 형식적 주기 단어 필터링 및 레이블된 대칭에 의한 행 피벗 분류.", "connections": "", "keyword_hits": ["realizab"], "source": "filter"}, {"id": "2609.15890v1", "title": "PL Recognition After Two $S^2\\times S^2$ Stabilisations is PSPACE-Hard", "authors": ["Rhuaidi Antonio Burke"], "abstract": "Let $Z$ be any fixed closed connected PL $4$-manifold. We give a polynomial-time many-to-one reduction from the compressed word problem in Thompson's group $F$ to fixed-target recognition of $Z\\#_{2}(S^2\\times S^2)$. Once a finite triangulation of $Z$ has been fixed, the construction sends a straight-line program $A$ to a closed triangulated PL $4$-manifold $X_{A,Z}$ such that $\\operatorname{val}(A)=1$ in $F$ if and only if $X_{A,Z}$ is PL-homeomorphic to $Z\\#_2(S^2\\times S^2)$. Since the compressed word problem in $F$ is PSPACE-complete, every such recognition problem is PSPACE-hard. In particular, fixed-target recognition of $\\#_n(S^2\\times S^2)$ is PSPACE-hard for every fixed $n\\geq2$.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-09-14T17:14:45+00:00", "updated": "2026-09-14T17:14:45+00:00", "abs_url": "http://arxiv.org/abs/2609.15890v1", "pdf_url": "https://arxiv.org/pdf/2609.15890v1", "journal_ref": "", "doi": "", "comment": "16 pages, comments welcome", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 PL 4-다양체 인식 문제의 계산 복잡도(PSPACE-hardness)에 관한 것으로, McMullen 문제나 oriented matroid, 볼록 위치 점 배치와 전혀 무관하다.", "summary": "Thompson 군 $F$의 압축 단어 문제(compressed word problem)로부터 임의의 고정된 닫힌 PL 4-다양체 $Z$에 대해 $Z\\#_2(S^2\\times S^2)$의 인식 문제로의 다항시간 다대일 환원을 구성한다. 구체적으로, straight-line program $A$를 삼각화된 PL 4-다양체 $X_{A,Z}$로 변환하여 $\\operatorname{val}(A)=1$ (in $F$) $\\iff$ $X_{A,Z}\\cong_{\\mathrm{PL}} Z\\#_2(S^2\\times S^2)$임을 보인다. $F$의 압축 단어 문제가 PSPACE-완전이므로, 모든 $n\\geq 2$에 대해 $\\#_n(S^2\\times S^2)$의 고정-목표 PL 인식 문제가 PSPACE-hard임이 귀결된다.", "technique": "Thompson 군 $F$의 압축 단어 문제로부터 PL 4-다양체 인식으로의 다항시간 many-to-one 환원 구성.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.15201v1", "title": "Real-Rootedness and Gamma-Positivity for a Variation of the Morris Constant Term", "authors": ["Feihu Liu", "Zihao Zhang"], "abstract": "Beck and Pixton expressed the Ehrhart polynomial of the Birkhoff polytope as a weighted sum of constant terms of several multivariate rational functions. Xin and Zhang studied a class of constant terms $h_n(t)$, which can be regarded as a variation of the Morris constant term. They proved that $h_n(t)$ is a polynomial of degree $(n-1)^2$ and obtained many nice properties involving the Morris constant term identity. Let $h_n^*(y)=(1-y)^{(n-1)^2+1}\\sum_{t\\geq0}h_n(t)y^t$. For fixed $n\\geq 3$, we obtain the following three main results: (i): $h_n^*(y)$ is a polynomial with positive integer coefficients. (ii): $h_n^*(y)$ is real-rooted. In particular, all its roots are non-positive real numbers. (iii): $h_n^*(y)$ is Gamma-positive. Furthermore, $h_n^*(y)$ is palindromic, unimodal, and ultra log-concave. This confirms Xin and Zhang's conjecture regarding $h_n^*(y)$. As a byproduct, we prove that every root of a Gamma polynomial associated with $h_n^*(y)$ is a negative real number.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T08:21:49+00:00", "updated": "2026-09-14T08:21:49+00:00", "abs_url": "http://arxiv.org/abs/2609.15201v1", "pdf_url": "https://arxiv.org/pdf/2609.15201v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Birkhoff polytope의 Ehrhart 다항식 및 Morris constant term과 관련된 실근성(real-rootedness)·감마-양수성(gamma-positivity)을 다루며, McMullen 문제나 oriented matroid와는 무관하다.", "summary": "Xin과 Zhang이 연구한 Morris constant term의 변형 $h_n(t)$에 대해, 그 Ehrhart $h^*$-다항식 $h_n^*(y)$가 양의 정수 계수를 가지며, 실근(모두 비양의 실수)이고, 감마-양수(gamma-positive)임을 증명하여 Xin–Zhang의 추측을 해결한다. 그 결과로 $h_n^*(y)$는 회문(palindromic)·단봉(unimodal)·초로그-오목(ultra log-concave) 성질도 만족하며, 연관된 감마 다항식의 모든 근이 음의 실수임도 부산물로 증명된다.", "technique": "Ehrhart $h^*$-다항식의 실근성과 감마-양수성을 분석하는 대수·조합론적 방법 사용(구체적 기법은 초록만으로는 불확실).", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.14948v1", "title": "Conway Symbols of Frieze Patterns of Dynkin Types", "authors": ["Kengo Miyamoto", "Ryuhei Suzuki"], "abstract": "In this paper, we classify the Conway symbols of the Euclidean symmetry groups of frieze patterns of Dynkin types $A_n$, $B_n$, $C_n$, $D_n$, $F_4$ and $G_2$. First, we show that the Conway symbol of a Conway--Coxeter frieze is determined by the bilateral and the central symmetry of the underlying triangulation. Secondly, we show that a frieze pattern of non-simply-laced type has the symbol ${*}\\infty\\infty$ or $\\infty\\infty$ according as its first interior row is palindromic or not, with the single exception of type $C_3$, which realises four symbols. Thirdly, we show that the same dichotomy holds for type $D_n$ with $n \\ge 5$, the symbol being read off the tagged triangulation of the once-punctured polygon attached to the frieze together with the value on its puncture edges, and that type $D_4$ realises five symbols.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-14T02:44:50+00:00", "updated": "2026-09-14T02:44:50+00:00", "abs_url": "http://arxiv.org/abs/2609.14948v1", "pdf_url": "https://arxiv.org/pdf/2609.14948v1", "journal_ref": "", "doi": "", "comment": "32 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 프리즈 패턴(frieze pattern)의 Conway 기호와 Dynkin 유형 분류에 관한 것으로, McMullen 문제나 oriented matroid와 직접적 관련이 없다.", "summary": "이 논문은 Dynkin 유형 $A_n$, $B_n$, $C_n$, $D_n$, $F_4$, $G_2$의 프리즈 패턴에 대한 유클리드 대칭군의 Conway 기호를 분류한다. Conway–Coxeter 프리즈의 Conway 기호가 기저 삼각분할의 이중 대칭 및 중심 대칭에 의해 결정됨을 보이고, 비단순 연결 유형의 프리즈 패턴은 첫 번째 내부 행의 회문 여부에 따라 기호 $*\\infty\\infty$ 또는 $\\infty\\infty$를 가짐을 보인다(단, $C_3$ 유형은 예외). $D_n$ ($n \\ge 5$) 유형에도 동일한 이분법이 성립하며, $D_4$ 유형은 다섯 가지 기호를 실현함을 증명한다.", "technique": "삼각분할(triangulation)의 이중·중심 대칭 분석과 한 번 천공된 다각형의 tagged 삼각분할을 활용한 Conway 기호 결정.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.14598v1", "title": "From veering triangulations to convergence actions and back again", "authors": ["Jason Fox Manning", "Saul Schleimer", "Henry Segerman"], "abstract": "Suppose that $M$ is a finite-volume cusped hyperbolic three-manifold, equipped with a veering triangulation $\\mathcal{V}$. We prove that the action of the fundamental group of $M$ on the veering two-sphere is a geometrically finite convergence action. Applying a result of Yaman, we deduce that the veering two-sphere is equivariantly homeomorphic to the boundary of hyperbolic space.   As an application, we obtain Cannon-Thurston maps associated to veering triangulations. If $\\mathcal{V}$ is layered we recover the classical Cannon-Thurston map. If it is not we obtain Cannon-Thurston maps that do not come from surface subgroups. These are the first such examples in the cusped case.   Finally, we implement an algorithm to draw approximations of these Cannon-Thurston maps. This improves upon previous approximations obtained by Thurston and others.", "categories": ["math.GT"], "primary_category": "math.GT", "published": "2026-09-13T15:26:47+00:00", "updated": "2026-09-13T15:26:47+00:00", "abs_url": "http://arxiv.org/abs/2609.14598v1", "pdf_url": "https://arxiv.org/pdf/2609.14598v1", "journal_ref": "", "doi": "", "comment": "90 pages, 43 figures", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 쌍곡 3-다양체의 veering triangulation과 Cannon-Thurston 사상에 관한 것으로, McMullen 문제(볼록 위치, oriented matroid, 점 배치)와 전혀 관련이 없다.", "summary": "유한 부피 cusped 쌍곡 3-다양체 $M$에 veering triangulation $\\mathcal{V}$가 주어질 때, $M$의 기본군의 veering 2-구면에 대한 작용이 기하학적으로 유한한 수렴 작용(geometrically finite convergence action)임을 증명한다. Yaman의 결과를 적용하여 veering 2-구면이 쌍곡 공간의 경계와 등변 위상동형임을 도출하고, 이를 통해 veering triangulation에 연관된 Cannon-Thurston 사상을 구성한다. 특히 layered가 아닌 경우 surface subgroup에서 유래하지 않는 Cannon-Thurston 사상의 첫 번째 cusped 사례를 제공한다.", "technique": "기본군의 veering 2-구면 작용이 기하학적으로 유한한 수렴 작용임을 증명하고 Yaman의 정리를 적용하는 방법, 그리고 Cannon-Thurston 사상의 근사를 계산하는 알고리즘 구현.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.14200v1", "title": "Torus knots as loop-edges in three-sphere triangulations", "authors": ["Lezhi Lin", "Jonathan Spreer"], "abstract": "We present a procedure that, given a pair of coprime integers, produces a one-vertex triangulation of the three-sphere containing the corresponding torus knot as an edge. The construction is canonical, and produces a three-sphere triangulation from a pair of minimal layered triangulations of the solid torus.   The size of the triangulation is, in the worst case, linear, but can be as small as logarithmic in the crossing number of the knot, motivating this triangulation size as an organising principle for knots, alternative to the crossing number.", "categories": ["math.GT", "math.CO"], "primary_category": "math.GT", "published": "2026-09-13T00:19:35+00:00", "updated": "2026-09-13T00:19:35+00:00", "abs_url": "http://arxiv.org/abs/2609.14200v1", "pdf_url": "https://arxiv.org/pdf/2609.14200v1", "journal_ref": "", "doi": "", "comment": "12 pages, 6 figures, 2 tables", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 3-구면 삼각분할과 토러스 매듭에 관한 것으로, McMullen's problem(볼록·일반 위치 점 배치, oriented matroid)과 직접적인 관련이 없다.", "summary": "서로소인 정수 쌍이 주어지면 해당 토러스 매듭을 에지로 포함하는 3-구면의 단일 꼭짓점 삼각분할을 정준적으로 구성하는 절차를 제시한다. 이 삼각분할은 두 개의 최소 층상(layered) 솔리드 토러스 삼각분할로부터 만들어진다. 삼각분할의 크기는 최악의 경우 매듭의 교차수에 대해 선형이지만 로그 크기까지 줄어들 수 있으며, 이를 교차수를 대체하는 매듭 분류 원리로 제안한다.", "technique": "서로소인 정수 쌍으로부터 한 쌍의 최소 층상 솔리드 토러스 삼각분할을 조합하여 정준적인 3-구면 단일 꼭짓점 삼각분할을 구성하는 절차.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.14035v1", "title": "Finite Polyhedral Models for the Space of Equivalent Norms", "authors": ["Juan Rafael Acosta-Portilla"], "abstract": "We study finite polyhedral models inside the projectivized space of equivalent norms $\\mathcal{N}'(X)$ on a finite-dimensional Banach space $X$, endowed with the logarithmic distortion metric. Given a finite symmetric direction set $E$, we introduce the class of $αE$-norms, defined as Minkowski functionals of symmetric polytopes whose vertices lie on the rays prescribed by $E$. We identify the admissible weights $α$ for which this parametrization is non-redundant and prove that they give a one-to-one parametrization of the corresponding finite direction model $\\mathcal{N}(E)$. We then refine this description by introducing complete, symmetric, simplicial $E$-fans, which encode the conical regions on which the associated polyhedral norms are linear. For a fixed fan $\\mathcal{F}$, we define the corresponding geometric and coordinate fan models $\\mathcal{N}(\\mathcal{F})$ and $\\mathcal{R}(\\mathcal{F})$, and show that they are naturally isomorphic as cones. After quotienting by positive scalar multiplication, the coordinate models become isometric to the corresponding norm models: the logarithmic distortion metric on $\\mathcal{N}'(E)$ and $\\mathcal{N}'(\\mathcal{F})$ is represented exactly by the Hilbert projective metric on the admissible weight spaces. Finally, we prove completeness results for these finite models and show how they provide finite-dimensional polyhedral approximations to the metric geometry of $\\mathcal{N}'(X)$.", "categories": ["math.FA", "math.MG"], "primary_category": "math.FA", "published": "2026-09-12T16:41:39+00:00", "updated": "2026-09-12T16:41:39+00:00", "abs_url": "http://arxiv.org/abs/2609.14035v1", "pdf_url": "https://arxiv.org/pdf/2609.14035v1", "journal_ref": "", "doi": "", "comment": "28 pages. Submitted for publication", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 유한차원 Banach 공간의 등가 노름 공간에 대한 유한 다면체 모델을 연구하며, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "유한차원 Banach 공간 $X$ 위의 등가 노름의 사영화된 공간 $\\mathcal{N}'(X)$에 로그 왜곡 거리를 부여하고, 유한 대칭 방향 집합 $E$로 정의된 $\\alpha E$-노름 클래스를 도입하여 비중복 매개변수화를 구성한다. 완전·대칭·단체 $E$-팬(fan) $\\mathcal{F}$를 이용해 기하학적 팬 모델 $\\mathcal{N}(\\mathcal{F})$와 좌표 팬 모델 $\\mathcal{R}(\\mathcal{F})$가 원뿔로서 자연동형임을 보이고, 양의 스칼라 곱으로 몫을 취하면 로그 왜곡 거리가 허용 가중치 공간 위의 Hilbert 사영 거리로 정확히 표현됨을 증명한다. 마지막으로 이 유한 모델들이 $\\mathcal{N}'(X)$의 거리 기하학에 대한 유한차원 다면체 근사를 제공함을 보인다.", "technique": "Minkowski 함수자(Minkowski functional)로 정의된 대칭 다면체 노름의 $\\alpha E$-매개변수화와 단체 $E$-팬을 통한 좌표 모델 위의 Hilbert 사영 거리 분석.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12732v1", "title": "Degreewise Cut-Semigroup Saturation for $K_5$-Minor-Free Graphs and Seymour's Planar Edge-Colouring Conjecture", "authors": ["SeungJu Lee"], "abstract": "For every positive integer $k$, we prove that the homogeneous cut semigroup of every $K_5$-minor-free graph is saturated at height $k$ if and only if every planar $k$-graph is $k$-edge-colourable. Here a $k$-graph is a loopless $k$-regular multigraph in which every odd vertex cut has size at least $k$. A triangle expansion of a cubic plane dual converts cut decompositions into perfect-matching decompositions. The converse uses symmetric difference with a fixed perfect matching. The equivalence identifies the normality conjecture for $K_5$-minor-free cut polytopes with Seymour's planar edge-colouring conjecture. In particular, the known cases $k\\leq 8$ give saturation through height eight.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-11T11:31:39+00:00", "updated": "2026-09-11T11:31:39+00:00", "abs_url": "http://arxiv.org/abs/2609.12732v1", "pdf_url": "https://arxiv.org/pdf/2609.12732v1", "journal_ref": "", "doi": "", "comment": "7 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 $K_5$-minor-free 그래프의 cut semigroup 포화 문제와 Seymour의 평면 에지 채색 추측에 관한 것으로, McMullen 문제(d=5, 볼록 위치 점 배치, oriented matroid 등)와 직접적인 관련이 없다.", "summary": "모든 양의 정수 $k$에 대해 $K_5$-minor-free 그래프의 동차 cut semigroup이 높이 $k$에서 포화될 필요충분조건이 '모든 평면 $k$-그래프가 $k$-에지 채색 가능'임을 증명한다. 삼각형 확장(triangle expansion)을 이용해 cut 분해를 완전 매칭 분해로 변환하며, 이 동치 관계를 통해 $K_5$-minor-free cut polytope의 normality 추측이 Seymour의 평면 에지 채색 추측과 동치임을 확인한다. 특히, 이미 알려진 $k \\leq 8$ 경우에서 높이 8까지의 포화가 따라온다.", "technique": "삼각형 확장(triangle expansion)으로 cut 분해를 완전 매칭 분해로 변환하고, 고정 완전 매칭과의 대칭차(symmetric difference)를 이용해 역 방향을 증명.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12685v1", "title": "Self-dual sets up to a translation: a negative answer to Milman's question", "authors": ["Alex Segal"], "abstract": "Let \\(K,T\\subset\\mathbb R^n\\) be convex bodies with the origin in their interiors. If \\(K=T^\\circ\\), then the identity \\( K+T=K^\\circ+T^\\circ \\) holds trivially. V.~Milman asked whether these trivial solutions are the only ones, that is, whether \\( K+T=K^\\circ+T^\\circ \\) forces \\(K=T^\\circ\\). We show that the answer is positive for polytopes but negative for general convex bodies.", "categories": ["math.MG"], "primary_category": "math.MG", "published": "2026-09-11T10:30:51+00:00", "updated": "2026-09-11T10:30:51+00:00", "abs_url": "http://arxiv.org/abs/2609.12685v1", "pdf_url": "https://arxiv.org/pdf/2609.12685v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 볼록체의 극체(polar body)와 Minkowski 합에 관한 Milman의 질문을 다루며, McMullen 문제(d=5에서의 점 배치, oriented matroid 등)와 직접적 관련이 없다.", "summary": "이 논문은 볼록체 $K, T \\subset \\mathbb{R}^n$에 대해 $K + T = K^\\circ + T^\\circ$가 성립할 때 반드시 $K = T^\\circ$이어야 하는가라는 Milman의 질문을 다룬다. 저자는 다각형(polytope)의 경우에는 긍정적 답이 성립하지만, 일반적인 볼록체에 대해서는 반례가 존재함을 보인다.", "technique": "다각형과 일반 볼록체를 구분하여 각각 긍정·부정 답을 구성하는 방법론 사용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.12311v1", "title": "Quantum Invariants indexed by Fibered Faces of the Thurston Polytope", "authors": ["Davide Passaro", "Lara San Martín Suárez"], "abstract": "We study the Gukov--Manolescu quantum invariant for oriented links. While this invariant is a single series in the knot case, we find that links admit multiple such series, each one consistent with the Melvin--Morton--Rozansky expansion of the colored Jones polynomials. We prove that convergent inverted state sums yield a family of multivariable Gukov--Manolescu series, indexed by monomials of the Alexander polynomial. We conjecture that these monomials correspond precisely to the fibered faces of the Thurston norm ball and provide extensive computational evidence for this correspondence. Further results concerning the leading term, the corresponding single-variable invariant, and the effect of partial Dehn surgery are also established.", "categories": ["math.GT", "math.QA"], "primary_category": "math.GT", "published": "2026-09-11T00:32:17+00:00", "updated": "2026-09-11T00:32:17+00:00", "abs_url": "http://arxiv.org/abs/2609.12311v1", "pdf_url": "https://arxiv.org/pdf/2609.12311v1", "journal_ref": "", "doi": "", "comment": "58 pages, 16 figures, 9 tables", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 양자 위상 불변량(Gukov–Manolescu 불변량)과 Thurston norm ball의 섬유면을 다루는 위상수학·양자위상 논문으로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "이 논문은 방향 링크(oriented link)에 대한 Gukov–Manolescu 양자 불변량을 연구하며, 링크의 경우 Alexander 다항식의 단항식으로 인덱싱된 여러 계열의 불변량이 존재함을 보인다. 수렴하는 inverted state sum이 다변수 Gukov–Manolescu 급수족을 산출함을 증명하고, 이 단항식들이 Thurston norm ball의 섬유면(fibered faces)과 정확히 대응한다는 추측을 광범위한 계산적 증거와 함께 제시한다. 또한 선도항(leading term), 단변수 불변량, 부분 Dehn 수술의 효과에 관한 추가 결과도 확립한다.", "technique": "수렴하는 inverted state sum을 이용해 다변수 Gukov–Manolescu 급수족을 구성하고, Melvin–Morton–Rozansky 전개와의 일관성을 확인.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.11589v1", "title": "Preservation of log-concavity under Hadamard products", "authors": ["Yanxin Liu", "Jianxi Mao"], "abstract": "For a nonzero real polynomial $p$, let $\\W(p)$ denote the numerator of its ordinary generating function. We prove that if the coefficients of both $\\W(p)$ and $\\W(q)$ are nonnegative and log-concave with no internal zeros, then so are the coefficients of $\\W(pq)$. This provides an affirmative answer to a question of Brändén, Ferroni, and Jochemko. As applications, we derive corresponding results for finite products and for Cartesian products of lattice polytopes, answering a question of Ferroni and Higashitani.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-10T14:19:41+00:00", "updated": "2026-09-10T14:19:41+00:00", "abs_url": "http://arxiv.org/abs/2609.11589v1", "pdf_url": "https://arxiv.org/pdf/2609.11589v1", "journal_ref": "", "doi": "", "comment": "12 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 다항식의 Hadamard 곱 하에서 log-concavity 보존에 관한 결과로, McMullen 문제나 oriented matroid와 전혀 관련이 없다.", "summary": "비영 실수 다항식 $p$에 대해 $\\mathcal{W}(p)$를 그 ordinary generating function의 분자로 정의할 때, $\\mathcal{W}(p)$와 $\\mathcal{W}(q)$의 계수가 모두 음이 아니고 내부 영점 없이 log-concave이면 $\\mathcal{W}(pq)$의 계수도 같은 성질을 가짐을 증명한다. 이는 Brändén, Ferroni, Jochemko의 질문에 긍정적 답변을 제공하며, 격자 다면체(lattice polytopes)의 Cartesian 곱에 관한 Ferroni와 Higashitani의 질문도 해결한다.", "technique": "Hadamard 곱 연산 하에서 log-concavity의 보존성을 분석하여 유한 곱 및 Cartesian 곱으로 응용.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.11396v1", "title": "Homogeneous Milnor fibers and Kato--Matsumoto bounds via simplicial multiwedges", "authors": ["Masaharu Ishikawa", "Tat-Thang Nguyen"], "abstract": "For every $n\\geq 3$ and $s\\geq 2$, we construct a homogeneous polynomial of degree $n(n+1)/2$ whose Milnor fiber is exactly $2s$-connected and whose rational cohomology contains a strictly defined nontrivial $n$-fold Massey product on classes of degree $2s+1$, implying that the Milnor fiber is non-formal, while attaining the Kato--Matsumoto connectivity bound. Our construction is based on the simplicial multiwedges of the nerve complexes of simple polytopes introduced by Limonchenko, combined with Suciu's realization of weighted homogeneous Milnor fibers. We thereby answer two problems posed by Suciu.", "categories": ["math.AT", "math.AG", "math.CO", "math.GT"], "primary_category": "math.AT", "published": "2026-09-10T11:30:14+00:00", "updated": "2026-09-10T11:30:14+00:00", "abs_url": "http://arxiv.org/abs/2609.11396v1", "pdf_url": "https://arxiv.org/pdf/2609.11396v1", "journal_ref": "", "doi": "", "comment": "16 pages, 1 figure", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 Milnor fiber의 연결성, Massey product, Kato–Matsumoto 경계에 관한 대수적 위상수학 연구로, McMullen 문제나 oriented matroid와 무관하다.", "summary": "모든 $n\\geq 3$, $s\\geq 2$에 대해 차수 $n(n+1)/2$인 동차 다항식을 구성하여, 그 Milnor fiber가 정확히 $2s$-연결(connected)이고 유리 코호몰로지에 차수 $2s+1$ 위의 비자명한 $n$-중 Massey product를 가짐을 보인다. 이로써 Kato–Matsumoto 연결성 경계를 달성하면서도 Milnor fiber가 non-formal임을 증명하며, Suciu가 제기한 두 문제에 답한다.", "technique": "Limonchenko가 도입한 단순 다면체의 nerve complex의 simplicial multiwedge와 Suciu의 가중 동차 Milnor fiber 실현을 결합하여 구성.", "connections": "", "keyword_hits": ["tope"], "source": "filter"}, {"id": "2609.10660v1", "title": "The maximum spectral radius of outerplanar and planar $k$-uniform hypergraphs", "authors": ["Pei Liu", "Suil O"], "abstract": "For an integer $k\\ge3$, a $k$-angulation is a simple $2$-connected outerplane graph whose interior faces are bounded by $k$-cycles, and a closed $k$-angulation is a simple $2$-connected plane graph all of whose faces, the outer face included, are bounded by $k$-cycles; the face hypergraph of either is the $k$-uniform hypergraph whose edges are the vertex sets of those faces. For $k=3$ these are the outerplanar and planar hypergraphs of Ellingham, Lu and Wang, who determined the outerplanar extremal hypergraph for large $n$ and conjectured the planar one. In this paper, we determine the extremal hypergraphs in both classes for every $k$. In the outerplanar case, for all sufficiently large admissible $n$, it is the fan, in which a single vertex lies on every face, and the maximum equals $(4f)^{1/k}(1+o(1))$ with $f=(n-2)/(k-2)$. In the planar problem the maximum has order $n^{1/3}$ when $k=3$ and order $n^{2/k}$ when $k\\ge4$. For $k\\ge4$ the extremal hypergraphs are the face hypergraphs of the balanced theta graphs, in which two vertices are joined by internally disjoint paths and every face is a $k$-cycle through both: for $k=4$, where the closed $4$-angulations are the quadrangulations of the sphere, this holds for every $n\\ge5$, the extremal hypergraph being $\\mathcal{H}(K_{2,n-2})$, and for $k\\ge5$ for all sufficiently large admissible $n$. For $k\\ge6$ the extremal hypergraph is not unique: when the number of faces is even there are exactly $\\lfloor(k-2)/2\\rfloor$ of them up to isomorphism. For $k=3$ two vertices of a plane triangulation lie on at most two common faces, the balanced theta graphs are unavailable, and the extremal hypergraph is instead, for all sufficiently large $n$, the face hypergraph of $K_2+P_{n-2}$; this confirms a conjecture of Ellingham, Lu and Wang.", "categories": ["math.CO"], "primary_category": "math.CO", "published": "2026-09-09T17:22:23+00:00", "updated": "2026-09-09T17:22:23+00:00", "abs_url": "http://arxiv.org/abs/2609.10660v1", "pdf_url": "https://arxiv.org/pdf/2609.10660v1", "journal_ref": "", "doi": "", "comment": "50 pages", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 외평면·평면 균일 하이퍼그래프의 스펙트럼 반지름 극값 문제를 다루며, McMullen 문제(볼록/일반 위치 점 배치, oriented matroid)와 직접적 관련이 없다.", "summary": "정수 $k\\ge3$에 대해 $k$-angulation의 면 하이퍼그래프(face hypergraph)로 정의되는 외평면·평면 $k$-균일 하이퍼그래프의 최대 스펙트럼 반지름을 결정한다. 외평면 경우 충분히 큰 허용 $n$에 대해 극값 하이퍼그래프는 팬(fan)이며 최댓값은 $(4f)^{1/k}(1+o(1))$ ($f=(n-2)/(k-2)$)이고, 평면 경우 $k\\ge4$이면 균형 세타 그래프(balanced theta graph)의 면 하이퍼그래프가 극값임을 보인다. 특히 $k=3$ 평면 경우에는 $K_2+P_{n-2}$의 면 하이퍼그래프가 극값임을 증명하여 Ellingham–Lu–Wang의 추측을 확인한다.", "technique": "면 하이퍼그래프의 스펙트럼 이론(테nsor 스펙트럼 반지름)과 그래프 구조 분석(2-연결 평면 그래프의 face structure)을 결합하여 극값 구조를 특정한다.", "connections": "", "keyword_hits": ["triangulation"], "source": "filter"}, {"id": "2609.20572v1", "title": "The Hurwitz existence problem in prime degree", "authors": ["Jijian Song", "Hailin Wen", "Zebao Zhang"], "abstract": "Let $p$ be a prime. We prove that every compatible branch datum of degree $p$ over the sphere is realizable by a connected branched cover. The three-point case is constructed in residue characteristic $p$. Henrio's moment theorem supplies the distinct-point moment solutions from which we construct a special primitive tail for each prescribed partition; a second application underlies the new tail required by a positive source genus. These tails are joined by a logarithmic deformation datum and embedded in one subgroup of $S_p$ containing a common regular subgroup of order $p$. Wewers's lifting theorem produces a three-point Galois cover in characteristic zero. The quotient by a point stabilizer has degree $p$ and the prescribed three ramification profiles. The fusion and realization results of Edmonds--Kulkarni--Stong then give the assertion for an arbitrary number of branch values. As consequences, the connected prime-degree Hurwitz potential has full support on the Riemann--Hurwitz locus, every corresponding connected relative Gromov--Witten invariant of $\\mathbf P^1$ is nonzero, the two-relative-point disconnected sector with even completed-cycle orders at most $p$ is strictly positive subject to the dimension constraint, and the connected transposition sector is strictly positive.", "categories": ["math.AG", "math.GT"], "primary_category": "math.AG", "published": "2026-09-17T15:31:11+00:00", "updated": "2026-09-17T15:31:11+00:00", "abs_url": "http://arxiv.org/abs/2609.20572v1", "pdf_url": "https://arxiv.org/pdf/2609.20572v1", "journal_ref": "", "doi": "", "comment": "", "relevance": 0, "problem_id": "mcmullen", "problem_name": "McMullen's problem (d=5)", "relevance_reason": "이 논문은 소수 차수 분기 피복(branched cov
